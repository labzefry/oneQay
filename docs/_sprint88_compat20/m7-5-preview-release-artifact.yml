            if [[ -f "$refund_backup" ]]; then mv "$refund_backup" "$refund"; fi
            if [[ -f "$opening_cash_backup" ]]; then mv "$opening_cash_backup" "$opening_cash"; fi
            if [[ -f "$closing_cash_backup" ]]; then mv "$closing_cash_backup" "$closing_cash"; fi
            if [[ -f "$expected_cash_backup" ]]; then mv "$expected_cash_backup" "$expected_cash"; fi
            if [[ -f "$variance_explanation_backup" ]]; then mv "$variance_explanation_backup" "$variance_explanation"; fi
            if [[ -f "$review_decision_backup" ]]; then mv "$review_decision_backup" "$review_decision"; fi
          }
          if [[ "$sprint51_jrn008_preview_fixture" == 'true' ]]; then
            if [[ -f "$inventory" ]]; then cp "$inventory" "$inventory_backup"; rm -f "$inventory"; fi
            if [[ -f "$refund" ]]; then cp "$refund" "$refund_backup"; rm -f "$refund"; fi
            if [[ -f "$opening_cash" ]]; then cp "$opening_cash" "$opening_cash_backup"; rm -f "$opening_cash"; fi
            if [[ -f "$closing_cash" ]]; then cp "$closing_cash" "$closing_cash_backup"; rm -f "$closing_cash"; fi
            if [[ -f "$expected_cash" ]]; then cp "$expected_cash" "$expected_cash_backup"; rm -f "$expected_cash"; fi
            if [[ -f "$variance_explanation" ]]; then cp "$variance_explanation" "$variance_explanation_backup"; rm -f "$variance_explanation"; fi
            if [[ -f "$review_decision" ]]; then cp "$review_decision" "$review_decision_backup"; rm -f "$review_decision"; fi
            trap restore_pos_successors EXIT
          fi
          php tests/pos-core-synthetic.php
          restore_pos_successors
          trap - EXIT
          php tests/technical-preview-interaction.php
          php tests/preview-background-execution.php

      - name: Verify bounded Preview background commands are registered
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php artisan list --raw > /tmp/oneqay-artisan-list.txt
          grep -F 'oneqay:preview-queue:enqueue' /tmp/oneqay-artisan-list.txt
          grep -F 'oneqay:preview-queue:work-one' /tmp/oneqay-artisan-list.txt
          grep -F 'oneqay:preview-queue:status' /tmp/oneqay-artisan-list.txt

      - name: Package deterministic governed Technical Preview release
        id: package
        shell: bash
        env:
          ONEQAY_BUILD_PROVENANCE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: bash tools/build-m7-5-preview-release.sh "${{ steps.source.outputs.source_sha }}"

      - name: Verify manifest binding, checksum, public/private, and no-schema-change boundaries
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum -c "$(basename "${{ steps.package.outputs.checksum_path }}")"
          )
          php tools/validate-release-manifest.php \
            "${{ steps.package.outputs.manifest_path }}" \
            "${{ steps.package.outputs.archive_path }}"
          tar -tzf "${{ steps.package.outputs.archive_path }}" > /tmp/oneqay-release-list.txt
          grep -F "${{ steps.package.outputs.release_id }}/RELEASE.json" /tmp/oneqay-release-list.txt
          grep -F "${{ steps.package.outputs.release_id }}/public-surface/index.php" /tmp/oneqay-release-list.txt
          grep -F "${{ steps.package.outputs.release_id }}/apps/web/vendor/autoload.php" /tmp/oneqay-release-list.txt
          grep -F "${{ steps.package.outputs.release_id }}/apps/web/public/build/manifest.json" /tmp/oneqay-release-list.txt
          if grep -E '(^|/)(\.env|\.git)(/|$)|(^|/)(node_modules)(/|$)' /tmp/oneqay-release-list.txt; then
            echo 'Forbidden path found in release artifact.' >&2
            exit 1
          fi
          if grep -F '/apps/web/database/migrations/' /tmp/oneqay-release-list.txt; then
            echo 'Technical Preview artifact must not contain Sprint 19 durable migrations.' >&2
            exit 1
          fi
          if tar -xOzf "${{ steps.package.outputs.archive_path }}" "${{ steps.package.outputs.release_id }}/RELEASE.json" | \
            grep -Fq '"migration_classification": "NO_SCHEMA_CHANGE"'; then
            :
          else
            echo 'Technical Preview RELEASE.json lost NO_SCHEMA_CHANGE classification.' >&2
            exit 1
          fi

      - name: Prove deterministic runtime archive reproduction
        shell: bash
        env:
          ONEQAY_BUILD_PROVENANCE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          set -euo pipefail
          first_sha="${{ steps.package.outputs.artifact_sha256 }}"
          first_size="${{ steps.package.outputs.artifact_size }}"
          bash tools/build-m7-5-preview-release.sh "${{ steps.source.outputs.source_sha }}"
          second_sha="$(sha256sum "${{ steps.package.outputs.archive_path }}" | awk '{print $1}')"
          second_size="$(wc -c < "${{ steps.package.outputs.archive_path }}" | tr -d '[:space:]')"
          test "$second_sha" = "$first_sha"
          test "$second_size" = "$first_size"
          php tools/validate-release-manifest.php \
            "${{ steps.package.outputs.manifest_path }}" \
            "${{ steps.package.outputs.archive_path }}"
          tar -tzf "${{ steps.package.outputs.archive_path }}" > /tmp/oneqay-release-list-reproduced.txt
          if grep -F '/apps/web/database/migrations/' /tmp/oneqay-release-list-reproduced.txt; then
            echo 'Reproduced Technical Preview artifact unexpectedly contains durable migrations.' >&2
            exit 1
          fi

      - name: Upload governed Technical Preview release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oneqay-${{ steps.package.outputs.release_id }}
          path: |
            ${{ steps.package.outputs.archive_path }}
            ${{ steps.package.outputs.manifest_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Confirm tracked source remains unchanged
        shell: bash
        run: git diff --exit-code