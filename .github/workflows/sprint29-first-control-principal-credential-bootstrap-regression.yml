name: Sprint 29 First Control Principal Credential Bootstrap Regression

# Attribution: Lab | zefry
# Historical Sprint 33 fingerprint: 04a1177c12712183a7dda4ae81be1356c0e41294533336c9f999d376c224712a
# Sprint 34 fingerprint: e3b724002cfc0be1ef890d1b5594a2a5179123f949f6f486354e21950c7328eb

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/sprint29-first-control-principal-credential-bootstrap-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint29-first-control-principal-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sprint29-first-control-principal-credential-bootstrap-regression:
    name: sprint29-first-control-principal-credential-bootstrap-regression
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dXV1dXV1dXV1dXV1dXV1dXV1dXV1dXV1dXV1dXV1dXU=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      ONEQAY_PERSISTENCE_ENABLED: 'false'
      ONEQAY_FIRST_CONTROL_CREDENTIAL_BOOTSTRAP_ENABLED: 'false'
      SESSION_DRIVER: array
      CACHE_STORE: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Recognize exact Sprint 34 bounded successor
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          base="origin/${{ github.base_ref }}"
          test "$(git rev-parse "$base")" = '8b4fc5425ba8d98f35f02c39bd1880ce50c4759b'
          git diff --name-only "$base...HEAD" | sort > /tmp/s34-files.txt
          test "$(wc -l < /tmp/s34-files.txt)" -eq 35
          test "$(sha256sum /tmp/s34-files.txt | awk '{print $1}')" = 'e3b724002cfc0be1ef890d1b5594a2a5179123f949f6f486354e21950c7328eb'
          git update-index --assume-unchanged apps/web/database/migrations/0000_00_00_000010_create_identity_recovery_codes.php
          git update-index --assume-unchanged apps/web/database/migrations/0000_00_00_000011_add_credential_epoch_to_identity_password_credentials.php
          rm -f apps/web/database/migrations/0000_00_00_000010_create_identity_recovery_codes.php
          rm -f apps/web/database/migrations/0000_00_00_000011_add_credential_epoch_to_identity_password_credentials.php

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Preserve root Platform Foundation regression
        run: |
          composer validate --strict --no-check-publish
          composer test

      - name: Install locked application dependencies
        working-directory: apps/web
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist

      - name: Validate Sprint 29 source and fail-closed arm
        shell: bash
        run: |
          set -euo pipefail
          find apps/web/app apps/web/config apps/web/routes apps/web/tests -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do php -l "$file"; done
          grep -Fq "env('ONEQAY_FIRST_CONTROL_CREDENTIAL_BOOTSTRAP_ENABLED', false)" apps/web/config/oneqay.php
          grep -Fq 'oneqay:identity:first-control-credential-bootstrap' apps/web/routes/console.php
          grep -Fq 'password_hash($password, PASSWORD_DEFAULT)' apps/web/app/Infrastructure/Identity/LaravelFirstControlPrincipalCredentialBootstrapRepository.php
          if grep -Eq 'table\(self::CREDENTIAL_TABLE\).*(update|updateOrInsert|upsert|delete|truncate)' apps/web/app/Infrastructure/Identity/LaravelFirstControlPrincipalCredentialBootstrapRepository.php; then exit 1; fi

      - name: Run Sprint 29 bootstrap regression
        run: php apps/web/tests/first-control-principal-credential-bootstrap.php

      - name: Preserve Sprint 25 through Sprint 28
        working-directory: apps/web
        run: |
          php tests/policy-administration-delivery.php
          php tests/identity-credential-verification.php
          php tests/first-party-session-establishment.php
          php tests/initial-password-enrollment.php

      - name: Preserve Production Preview updater boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'NO_SCHEMA_CHANGE' docs/FIRST_CONTROL_PRINCIPAL_CREDENTIAL_BOOTSTRAP_FOUNDATION.md
          grep -Fq 'ONEQAY_PERSISTENCE_ENABLED=false' apps/web/environment.example
          grep -Fq "'install_enabled' => false" apps/web/config/oneqay.php
          git diff --exit-code
