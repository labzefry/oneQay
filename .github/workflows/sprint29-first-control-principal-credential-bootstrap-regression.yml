name: Sprint 29 First Control Principal Credential Bootstrap Regression

# Attribution: Lab | zefry

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/app/Application/Identity/**'
      - 'apps/web/app/Infrastructure/Identity/**'
      - 'apps/web/app/Providers/AppServiceProvider.php'
      - 'apps/web/config/oneqay.php'
      - 'apps/web/routes/console.php'
      - 'apps/web/tests/first-control-principal-credential-bootstrap.php'
      - '.github/workflows/m7-2-tenant-isolation-regression.yml'
      - '.github/workflows/m7-3-identity-org-context-regression.yml'
      - '.github/workflows/m7-5-preview-db-qualification-regression.yml'
      - '.github/workflows/sprint22-policy-administration-regression.yml'
      - '.github/workflows/sprint23-initial-tenant-admin-provisioning-regression.yml'
      - '.github/workflows/sprint24-protected-control-admin-lifecycle-regression.yml'
      - '.github/workflows/sprint25-policy-administration-delivery-regression.yml'
      - '.github/workflows/sprint26-identity-credential-verification-regression.yml'
      - '.github/workflows/sprint27-first-party-session-establishment-regression.yml'
      - '.github/workflows/sprint28-initial-password-enrollment-regression.yml'
      - '.github/workflows/sprint29-first-control-principal-credential-bootstrap-regression.yml'
      - 'docs/FIRST_CONTROL_PRINCIPAL_CREDENTIAL_BOOTSTRAP_FOUNDATION.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint29-first-control-principal-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sprint29-first-control-principal-credential-bootstrap-regression:
    name: sprint29-first-control-principal-credential-bootstrap-regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dXV1dXV1dXV1dXV1dXV1dXV1dXV1dXV1dXV1dXV1dXU=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      ONEQAY_PERSISTENCE_ENABLED: 'false'
      ONEQAY_FIRST_CONTROL_CREDENTIAL_BOOTSTRAP_ENABLED: 'false'
      SESSION_DRIVER: array
      CACHE_STORE: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce exact Sprint 29 source envelope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" | sort > /tmp/sprint29-files.txt
          test "$(wc -l < /tmp/sprint29-files.txt)" -eq 20
          actual="$(sha256sum /tmp/sprint29-files.txt | awk '{print $1}')"
          expected='c917e275fd4cf49011533542bdd13a6ad81321f194972ed8253424929efe63c1'
          test "$actual" = "$expected"
          if grep -Eq '(^|/)\.env($|\.)' /tmp/sprint29-files.txt; then exit 1; fi
          if grep -Eq '(^|/)(composer\.(json|lock)|package(-lock)?\.json)$' /tmp/sprint29-files.txt; then exit 1; fi

      - name: Enforce no schema change and exact migrations one through eight
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --exit-code "origin/${{ github.base_ref }}...HEAD" -- apps/web/database/migrations
          fi
          mapfile -t migrations < <(find apps/web/database/migrations -maxdepth 1 -type f -name '*.php' -printf '%f\n' | sort)
          expected=(
            '0000_00_00_000001_create_foundational_context_graph.php'
            '0000_00_00_000002_create_organizational_access_grants.php'
            '0000_00_00_000003_create_scoped_role_permission_policy.php'
            '0000_00_00_000004_create_policy_mutation_journal.php'
            '0000_00_00_000005_create_initial_tenant_administrator_provisioning_journal.php'
            '0000_00_00_000006_create_protected_control_administrator_mutation_journal.php'
            '0000_00_00_000007_create_identity_password_credentials.php'
            '0000_00_00_000008_create_initial_password_enrollments.php'
          )
          test "${migrations[*]}" = "${expected[*]}"
          ! find apps/web/database/migrations -maxdepth 1 -type f -name '*000009*' -print -quit | grep -q .

      - name: Preserve root Platform Foundation regression
        run: |
          composer validate --strict --no-check-publish
          composer test

      - name: Install locked application dependencies
        working-directory: apps/web
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist

      - name: Lint Sprint 29 PHP source
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            apps/web/app/Application/Identity/FirstControlPrincipalCredentialBootstrapRepository.php \
            apps/web/app/Application/Identity/FirstControlPrincipalCredentialBootstrapService.php \
            apps/web/app/Application/Identity/FirstControlPrincipalCredentialBootstrapViolation.php \
            apps/web/app/Infrastructure/Identity/LaravelFirstControlPrincipalCredentialBootstrapRepository.php \
            apps/web/app/Providers/AppServiceProvider.php \
            apps/web/config/oneqay.php \
            apps/web/routes/console.php \
            apps/web/tests/first-control-principal-credential-bootstrap.php
          do
            php -l "$file"
          done

      - name: Enforce framework-independent Application boundary
        shell: bash
        run: |
          set -euo pipefail
          files=(
            apps/web/app/Application/Identity/FirstControlPrincipalCredentialBootstrapRepository.php
            apps/web/app/Application/Identity/FirstControlPrincipalCredentialBootstrapService.php
            apps/web/app/Application/Identity/FirstControlPrincipalCredentialBootstrapViolation.php
          )
          if grep -n -E 'Illuminate\\|Schema::|DB::|new PDO|mysqli_|ConnectionInterface|->table\(|Artisan|Request|Session' "${files[@]}"; then exit 1; fi
          grep -Fq 'MIN_PASSWORD_BYTES = 12' apps/web/app/Application/Identity/FirstControlPrincipalCredentialBootstrapService.php
          grep -Fq 'MAX_PASSWORD_BYTES = 4096' apps/web/app/Application/Identity/FirstControlPrincipalCredentialBootstrapService.php
          grep -Fq 'assertEligible' apps/web/app/Application/Identity/FirstControlPrincipalCredentialBootstrapRepository.php
          grep -Fq 'bootstrapFresh' apps/web/app/Application/Identity/FirstControlPrincipalCredentialBootstrapRepository.php
          grep -Fq '#[\SensitiveParameter]' apps/web/app/Application/Identity/FirstControlPrincipalCredentialBootstrapRepository.php

      - name: Enforce fail-closed feature arm and console signature
        shell: bash
        run: |
          set -euo pipefail
          config='apps/web/config/oneqay.php'
          console='apps/web/routes/console.php'
          grep -Fq "env('ONEQAY_FIRST_CONTROL_CREDENTIAL_BOOTSTRAP_ENABLED', false)" "$config"
          grep -Fq "oneqay:identity:first-control-credential-bootstrap {tenant_id}" "$console"
          grep -Fq "['local', 'test', 'ci']" "$console"
          test "$(grep -Fc -- '->secret(' "$console")" -eq 2
          if grep -E 'first-control-credential-bootstrap[^\n]*(password|identity_id|role_id|permission_id|token)' "$console"; then exit 1; fi
          if grep -RInF 'first-control-credential-bootstrap' apps/web/routes/web.php apps/web/app/Delivery/Http; then exit 1; fi

      - name: Enforce durable target derivation transactional recheck and insert-only path
        shell: bash
        run: |
          set -euo pipefail
          repo='apps/web/app/Infrastructure/Identity/LaravelFirstControlPrincipalCredentialBootstrapRepository.php'
          service='apps/web/app/Application/Identity/FirstControlPrincipalCredentialBootstrapService.php'
          grep -Fq 'assertEligible($tenantId)' "$service"
          grep -Fq 'bootstrapFresh($tenantId, $password)' "$service"
          grep -Fq 'oneqay_initial_tenant_admin_provisionings' "$repo"
          grep -Fq 'InitialTenantAdministratorProvisioningRepository::CONTROL_ROLE' "$repo"
          grep -Fq 'AdministrationPermission::MANAGE' "$repo"
          grep -Fq 'resolveEligibleTarget($tenant)' "$repo"
          grep -Fq 'password_hash($password, PASSWORD_DEFAULT)' "$repo"
          test "$(grep -Fc 'table(self::CREDENTIAL_TABLE)->insert([' "$repo")" -eq 1
          if grep -Eq 'table\(self::CREDENTIAL_TABLE\).*(update|updateOrInsert|upsert|delete|truncate)' "$repo"; then exit 1; fi

      - name: Prove runtime-scoped command registration
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          command='oneqay:identity:first-control-credential-bootstrap'
          ONEQAY_RUNTIME_CLASS=ci ONEQAY_FIRST_CONTROL_CREDENTIAL_BOOTSTRAP_ENABLED=true php artisan list --raw | grep -Fq "$command"
          ! ONEQAY_RUNTIME_CLASS=ci ONEQAY_FIRST_CONTROL_CREDENTIAL_BOOTSTRAP_ENABLED=false php artisan list --raw | grep -Fq "$command"
          ! ONEQAY_RUNTIME_CLASS=preview ONEQAY_FIRST_CONTROL_CREDENTIAL_BOOTSTRAP_ENABLED=true php artisan list --raw | grep -Fq "$command"
          ! ONEQAY_RUNTIME_CLASS=production ONEQAY_FIRST_CONTROL_CREDENTIAL_BOOTSTRAP_ENABLED=true php artisan list --raw | grep -Fq "$command"

      - name: Run disposable Sprint 29 bootstrap regression
        run: php apps/web/tests/first-control-principal-credential-bootstrap.php

      - name: Preserve Sprint 21 through Sprint 24 with application harness
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php -r 'require "vendor/autoload.php"; $app=require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Http\Kernel::class)->bootstrap(); $assert=static function(bool $c,string $m):void{if(!$c)throw new RuntimeException($m);}; require "tests/authorization-persistence.php"; require "tests/authorization-administration-persistence.php"; require "tests/initial-tenant-administrator-provisioning.php"; require "tests/protected-control-administrator-lifecycle.php";'

      - name: Preserve M7 tenant and identity boundaries
        working-directory: apps/web
        run: |
          php tests/tenant-isolation.php
          php tests/identity-org-context.php

      - name: Preserve Sprint 25 through Sprint 28
        working-directory: apps/web
        run: |
          php tests/policy-administration-delivery.php
          php tests/identity-credential-verification.php
          php tests/first-party-session-establishment.php
          php tests/initial-password-enrollment.php

      - name: Enforce Preview Production and updater separation
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "'install_enabled' => false" apps/web/config/oneqay.php
          grep -Fq 'NO_SCHEMA_CHANGE' docs/FIRST_CONTROL_PRINCIPAL_CREDENTIAL_BOOTSTRAP_FOUNDATION.md
          grep -Fq 'NO-GO / NOT AUTHORIZED' docs/FIRST_CONTROL_PRINCIPAL_CREDENTIAL_BOOTSTRAP_FOUNDATION.md
          grep -Fq 'DISABLED / UNWIRED' docs/FIRST_CONTROL_PRINCIPAL_CREDENTIAL_BOOTSTRAP_FOUNDATION.md

      - name: Confirm tracked source cleanliness
        run: test -z "$(git status --porcelain --untracked-files=no)"
