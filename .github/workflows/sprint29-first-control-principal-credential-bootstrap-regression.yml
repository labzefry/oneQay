name: Sprint 29 First Control Principal Credential Bootstrap Regression

# Attribution: Lab | zefry

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/app/Application/Identity/FirstControlPrincipalCredentialBootstrapRepository.php'
      - 'apps/web/app/Application/Identity/FirstControlPrincipalCredentialBootstrapService.php'
      - 'apps/web/app/Application/Identity/FirstControlPrincipalCredentialBootstrapViolation.php'
      - 'apps/web/app/Infrastructure/Identity/LaravelFirstControlPrincipalCredentialBootstrapRepository.php'
      - 'apps/web/app/Providers/AppServiceProvider.php'
      - 'apps/web/config/oneqay.php'
      - 'apps/web/routes/console.php'
      - 'apps/web/tests/first-control-principal-credential-bootstrap.php'
      - '.github/workflows/sprint29-first-control-principal-credential-bootstrap-regression.yml'
      - 'docs/FIRST_CONTROL_PRINCIPAL_CREDENTIAL_BOOTSTRAP_FOUNDATION.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint29-first-control-principal-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sprint29-first-control-principal-credential-bootstrap-regression:
    name: sprint29-first-control-principal-credential-bootstrap-regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dXV1dXV1dXV1dXV1dXV1dXV1dXV1dXV1dXV1dXV1dXU=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      ONEQAY_PERSISTENCE_ENABLED: 'false'
      ONEQAY_FIRST_CONTROL_CREDENTIAL_BOOTSTRAP_ENABLED: 'false'
      SESSION_DRIVER: array
      CACHE_STORE: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce exact corrected Sprint 29 source envelope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/sprint29-files.txt
          test -s /tmp/sprint29-files.txt
          while IFS= read -r file; do
            case "$file" in
              apps/web/app/Application/Identity/FirstControlPrincipalCredentialBootstrapRepository.php|\
              apps/web/app/Application/Identity/FirstControlPrincipalCredentialBootstrapService.php|\
              apps/web/app/Application/Identity/FirstControlPrincipalCredentialBootstrapViolation.php|\
              apps/web/app/Infrastructure/Identity/LaravelFirstControlPrincipalCredentialBootstrapRepository.php|\
              apps/web/app/Providers/AppServiceProvider.php|\
              apps/web/config/oneqay.php|\
              apps/web/routes/console.php|\
              apps/web/tests/first-control-principal-credential-bootstrap.php|\
              .github/workflows/sprint29-first-control-principal-credential-bootstrap-regression.yml|\
              docs/FIRST_CONTROL_PRINCIPAL_CREDENTIAL_BOOTSTRAP_FOUNDATION.md)
                ;;
              *) echo "Unauthorized Sprint 29 changed path: $file" >&2; exit 1 ;;
            esac
          done < /tmp/sprint29-files.txt
          test "$(wc -l < /tmp/sprint29-files.txt)" -eq 10
          if grep -Eq '(^|/)\.env($|\.)' /tmp/sprint29-files.txt; then
            echo 'Sprint 29 must preserve the repository env-file mutation prohibition.' >&2
            exit 1
          fi
          if grep -Eq '(^|/)(composer\.(json|lock)|package(-lock)?\.json)$' /tmp/sprint29-files.txt; then
            echo 'Sprint 29 authorizes zero dependency changes.' >&2
            exit 1
          fi

      - name: Enforce no schema change and exact migrations one through eight
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --exit-code "origin/${{ github.base_ref }}...HEAD" -- apps/web/database/migrations
          fi
          mapfile -t migrations < <(find apps/web/database/migrations -maxdepth 1 -type f -name '*.php' -printf '%f\n' | sort)
          expected=(
            '0000_00_00_000001_create_foundational_context_graph.php'
            '0000_00_00_000002_create_organizational_access_grants.php'
            '0000_00_00_000003_create_scoped_role_permission_policy.php'
            '0000_00_00_000004_create_policy_mutation_journal.php'
            '0000_00_00_000005_create_initial_tenant_administrator_provisioning_journal.php'
            '0000_00_00_000006_create_protected_control_administrator_mutation_journal.php'
            '0000_00_00_000007_create_identity_password_credentials.php'
            '0000_00_00_000008_create_initial_password_enrollments.php'
          )
          test "${migrations[*]}" = "${expected[*]}"
          ! find apps/web/database/migrations -maxdepth 1 -type f -name '*000009*' -print -quit | grep -q .

      - name: Preserve root Platform Foundation regression
        run: |
          composer validate --strict --no-check-publish
          composer test

      - name: Install locked application dependencies
        working-directory: apps/web
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist

      - name: Lint Sprint 29 source
        shell: bash
        run: |
          set -euo pipefail
          files=(
            apps/web/app/Application/Identity/FirstControlPrincipalCredentialBootstrapRepository.php
            apps/web/app/Application/Identity/FirstControlPrincipalCredentialBootstrapService.php
            apps/web/app/Application/Identity/FirstControlPrincipalCredentialBootstrapViolation.php
            apps/web/app/Infrastructure/Identity/LaravelFirstControlPrincipalCredentialBootstrapRepository.php
            apps/web/app/Providers/AppServiceProvider.php
            apps/web/config/oneqay.php
            apps/web/routes/console.php
            apps/web/tests/first-control-principal-credential-bootstrap.php
          )
          for file in "${files[@]}"; do php -l "$file"; done

      - name: Enforce framework-independent Application boundary
        shell: bash
        run: |
          set -euo pipefail
          files=(
            apps/web/app/Application/Identity/FirstControlPrincipalCredentialBootstrapRepository.php
            apps/web/app/Application/Identity/FirstControlPrincipalCredentialBootstrapService.php
            apps/web/app/Application/Identity/FirstControlPrincipalCredentialBootstrapViolation.php
          )
          if grep -n -E 'Illuminate\\|Schema::|DB::|new PDO|mysqli_|ConnectionInterface|->table\(|Artisan|Request|Session' "${files[@]}"; then
            echo 'Sprint 29 Application source gained framework/database/delivery mechanics.' >&2
            exit 1
          fi
          grep -Fq 'MIN_PASSWORD_BYTES = 12' apps/web/app/Application/Identity/FirstControlPrincipalCredentialBootstrapService.php
          grep -Fq 'MAX_PASSWORD_BYTES = 4096' apps/web/app/Application/Identity/FirstControlPrincipalCredentialBootstrapService.php
          grep -Fq '#[\SensitiveParameter]' apps/web/app/Application/Identity/FirstControlPrincipalCredentialBootstrapRepository.php
          grep -Fq '#[\SensitiveParameter]' apps/web/app/Application/Identity/FirstControlPrincipalCredentialBootstrapService.php

      - name: Enforce fail-closed feature arm and console signature
        shell: bash
        run: |
          set -euo pipefail
          config='apps/web/config/oneqay.php'
          console='apps/web/routes/console.php'
          grep -Fq "env('ONEQAY_FIRST_CONTROL_CREDENTIAL_BOOTSTRAP_ENABLED', false)" "$config"
          grep -Fq "oneqay:identity:first-control-credential-bootstrap {tenant_id}" "$console"
          grep -Fq "['local', 'test', 'ci']" "$console"
          test "$(grep -Fc -- '->secret(' "$console")" -eq 2
          if grep -E 'first-control-credential-bootstrap[^\n]*(password|identity_id|role_id|permission_id|token)' "$console"; then
            echo 'Sprint 29 command gained a forbidden sensitive selector/argument.' >&2
            exit 1
          fi
          if grep -RInF 'first-control-credential-bootstrap' apps/web/routes/web.php apps/web/app/Delivery/Http; then
            echo 'Sprint 29 gained an unauthorized HTTP surface.' >&2
            exit 1
          fi

      - name: Enforce durable target derivation and insert-only credential path
        shell: bash
        run: |
          set -euo pipefail
          repo='apps/web/app/Infrastructure/Identity/LaravelFirstControlPrincipalCredentialBootstrapRepository.php'
          grep -Fq "oneqay_initial_tenant_admin_provisionings" "$repo"
          grep -Fq 'InitialTenantAdministratorProvisioningRepository::CONTROL_ROLE' "$repo"
          grep -Fq 'AdministrationPermission::MANAGE' "$repo"
          grep -Fq "oneqay_identity_password_credentials" "$repo"
          grep -Fq "oneqay_initial_password_enrollments" "$repo"
          grep -Fq "where('target_identity_id', \$identityId)" "$repo"
          grep -Fq "where('active_marker', 1)" "$repo"
          grep -Fq 'password_hash($password, PASSWORD_DEFAULT)' "$repo"
          grep -Fq "['local', 'test', 'ci']" "$repo"
          test "$(grep -Fc 'table(self::CREDENTIAL_TABLE)->insert([' "$repo")" -eq 1
          if grep -Eq 'table\(self::CREDENTIAL_TABLE\).*(update|updateOrInsert|upsert|delete|truncate)' "$repo"; then
            echo 'Sprint 29 credential path gained overwrite/delete mechanics.' >&2
            exit 1
          fi
          if grep -Ei '(default.{0,20}password|plaintext.{0,20}password|bootstrap.{0,20}token)' "$repo"; then
            echo 'Sprint 29 infrastructure contains a forbidden bootstrap secret mechanism.' >&2
            exit 1
          fi

      - name: Prove runtime-scoped command registration
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          command='oneqay:identity:first-control-credential-bootstrap'
          ONEQAY_RUNTIME_CLASS=ci ONEQAY_FIRST_CONTROL_CREDENTIAL_BOOTSTRAP_ENABLED=true php artisan list --raw | grep -Fq "$command"
          ! ONEQAY_RUNTIME_CLASS=ci ONEQAY_FIRST_CONTROL_CREDENTIAL_BOOTSTRAP_ENABLED=false php artisan list --raw | grep -Fq "$command"
          ! ONEQAY_RUNTIME_CLASS=preview ONEQAY_FIRST_CONTROL_CREDENTIAL_BOOTSTRAP_ENABLED=true php artisan list --raw | grep -Fq "$command"
          ! ONEQAY_RUNTIME_CLASS=production ONEQAY_FIRST_CONTROL_CREDENTIAL_BOOTSTRAP_ENABLED=true php artisan list --raw | grep -Fq "$command"

      - name: Run disposable Sprint 29 bootstrap regression
        run: php apps/web/tests/first-control-principal-credential-bootstrap.php

      - name: Preserve Sprint 21 role permission policy
        run: php apps/web/tests/authorization-persistence.php

      - name: Preserve Sprint 22 policy administration
        run: php apps/web/tests/authorization-administration-persistence.php

      - name: Preserve Sprint 23 initial tenant administrator provisioning
        run: php apps/web/tests/initial-tenant-administrator-provisioning.php

      - name: Preserve Sprint 24 protected control administrator lifecycle
        run: php apps/web/tests/protected-control-administrator-lifecycle.php

      - name: Preserve tenant isolation
        run: php apps/web/tests/tenant-isolation.php

      - name: Preserve identity organization context
        run: php apps/web/tests/identity-org-context.php

      - name: Preserve Sprint 25 policy administration delivery
        run: php apps/web/tests/policy-administration-delivery.php

      - name: Preserve Sprint 26 credential verification
        run: php apps/web/tests/identity-credential-verification.php

      - name: Preserve Sprint 27 session establishment
        run: php apps/web/tests/first-party-session-establishment.php

      - name: Preserve Sprint 28 initial password enrollment
        run: php apps/web/tests/initial-password-enrollment.php

      - name: Enforce Preview Production and updater separation
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "'install_enabled' => false" apps/web/config/oneqay.php
          grep -Fq 'Technical Preview' docs/FIRST_CONTROL_PRINCIPAL_CREDENTIAL_BOOTSTRAP_FOUNDATION.md
          grep -Fq 'NO_SCHEMA_CHANGE' docs/FIRST_CONTROL_PRINCIPAL_CREDENTIAL_BOOTSTRAP_FOUNDATION.md
          grep -Fq 'Production' docs/FIRST_CONTROL_PRINCIPAL_CREDENTIAL_BOOTSTRAP_FOUNDATION.md
          grep -Fq 'NO-GO / NOT AUTHORIZED' docs/FIRST_CONTROL_PRINCIPAL_CREDENTIAL_BOOTSTRAP_FOUNDATION.md
          grep -Fq 'DISABLED / UNWIRED' docs/FIRST_CONTROL_PRINCIPAL_CREDENTIAL_BOOTSTRAP_FOUNDATION.md

      - name: Confirm tracked source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
