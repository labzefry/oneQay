name: Sprint250 Apply Activation Pagination Correction

# Attribution: Lab | zefry
# Bounded transient applicator trigger.

on:
  push:
    branches:
      - sprint250-final-shift-close-activation-workflow-pagination
    paths:
      - '.github/workflows/sprint250-apply-activation-pagination-patch.yml'

permissions:
  contents: write

jobs:
  apply-bounded-correction:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact Sprint250 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: sprint250-final-shift-close-activation-workflow-pagination
          fetch-depth: 0

      - name: Apply exact pagination correction and remove transient patch workflow
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/final-shift-close-feature-activation.yml')
          text = path.read_text()
          old = '''          runs="$(api "$API_URL/repos/$REPOSITORY/actions/runs?head_sha=$TARGET_HEAD&event=pull_request&per_page=100")"
          for workflow in 'Governance Required Checks' 'PHP Foundation Regression' 'M7.1 Application Regression'; do
            conclusion="$(jq -r --arg name "$workflow" '[.workflow_runs[] | select(.name == $name)][0].conclusion // "missing"' <<<"$runs")"
            [[ "$conclusion" == 'success' ]] || {
              echo "Required exact-head workflow is not success: $workflow ($conclusion)." >&2
              exit 1
            }
          done
'''
          new = '''          runs_file="$(mktemp)"
          trap 'rm -f "$runs_file"' EXIT
          : > "$runs_file"
          page=1
          while :; do
            page_json="$(api "$API_URL/repos/$REPOSITORY/actions/runs?head_sha=$TARGET_HEAD&event=pull_request&per_page=100&page=$page")"
            count="$(jq '.workflow_runs | length' <<<"$page_json")"
            jq -c '.workflow_runs[]' <<<"$page_json" >> "$runs_file"
            if (( count < 100 )); then
              break
            fi
            page=$((page + 1))
            (( page <= 20 )) || {
              echo 'Exact-head workflow pagination exceeded fail-closed page bound.' >&2
              exit 1
            }
          done

          for workflow in 'Governance Required Checks' 'PHP Foundation Regression' 'M7.1 Application Regression'; do
            conclusion="$(jq -rs --arg name "$workflow" '[.[] | select(.name == $name)][0].conclusion // "missing"' "$runs_file")"
            [[ "$conclusion" == 'success' ]] || {
              echo "Required exact-head workflow is not success: $workflow ($conclusion)." >&2
              exit 1
            }
          done
'''
          if text.count(old) != 1:
              raise SystemExit('Sprint250 exact source block mismatch; refusing patch')
          path.write_text(text.replace(old, new))
          PY

          rm .github/workflows/sprint250-apply-activation-pagination-patch.yml

          mapfile -t changed < <(git status --short | awk '{print $2}' | LC_ALL=C sort)
          expected=(
            '.github/workflows/final-shift-close-feature-activation.yml'
            '.github/workflows/sprint250-apply-activation-pagination-patch.yml'
          )
          [[ "${#changed[@]}" -eq 2 ]]
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${changed[@]}")

          git config user.name 'Lab | zefry'
          git config user.email 'lab.zefa@gmail.com'
          git add -A
          git commit -m 'Sprint250: paginate activation workflow exact-head checks' -m 'Author by Lab | zefry'
          git push origin HEAD:sprint250-final-shift-close-activation-workflow-pagination

# Author by Lab | zefry
