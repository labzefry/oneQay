name: Sprint123 Final Shift Close Runtime Binding Manifest Control Plane Registration

# Attribution: Lab | zefry

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  qualify-runtime-binding-manifest-control-plane-registration:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Lock exact Sprint123 source envelope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | sort > /tmp/paths
          cat > /tmp/expected <<'EOF'
          .github/workflows/sprint120-final-shift-close-runtime-binding-manifest-writer.yml
          .github/workflows/sprint121-final-shift-close-runtime-binding-manifest-control-channel.yml
          .github/workflows/sprint122-final-shift-close-runtime-binding-manifest-write-once-cas.yml
          .github/workflows/sprint123-final-shift-close-runtime-binding-manifest-control-plane-registration.yml
          apps/web/app/Providers/FinalShiftCloseRuntimeBindingManifestMaterializationServiceProvider.php
          apps/web/bootstrap/app.php
          apps/web/config/final_shift_close_runtime_binding_materialization.php
          docs/SPRINT123_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MANIFEST_CONTROL_PLANE_REGISTRATION.md
          ops/final-shift-close/RUNTIME_BINDING_MANIFEST_CONTROL_PLANE_REGISTRATION_CONTRACT.json
          EOF
          diff -u /tmp/expected /tmp/paths
          fingerprint="$(sha256sum /tmp/paths | awk '{print $1}')"
          [[ "$fingerprint" == '2b1d247823c556f079521744ded5cc987b0d228794a1237b21aff87937331efb' ]]

      - name: Prove runtime semantics and operational state remain untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- \
            apps/web/bootstrap/providers.php \
            apps/web/config/oneqay.php \
            apps/web/app/Application/Pos/FinalShiftCloseRuntimeBindingManifestMaterializer.php \
            apps/web/app/Infrastructure/Pos/FilesystemFinalShiftCloseRuntimeBindingManifestWriter.php \
            apps/web/app/Delivery/Http/Middleware/RequireFinalShiftCloseRuntimeBindingMaterializationTokenMiddleware.php \
            apps/web/app/Delivery/Http/Pos/FinalShiftCloseRuntimeBindingManifestMaterializationController.php \
            apps/web/routes/final-shift-close-runtime-binding-manifest-materialization.php \
            apps/web/app/Providers/FinalShiftCloseRuntimeDbBindingAttestationServiceProvider.php \
            apps/web/routes/final-shift-close-runtime-db-binding-attestation.php \
            .github/workflows/final-shift-close-migration27-selected-target-db-binding.yml \
            .github/workflows/final-shift-close-migration27-execution.yml \
            apps/web/database/migrations \
            ops/final-shift-close/STATE.json \
            ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json
          [[ "$(grep -Fc 'FinalShiftCloseRuntimeBindingManifestMaterializationServiceProvider::class' apps/web/bootstrap/app.php)" -eq 1 ]]
          ! grep -Fq 'FinalShiftCloseRuntimeBindingManifestMaterializationServiceProvider::class' apps/web/bootstrap/providers.php
          ! grep -Fq 'FinalShiftCloseRuntimeDbBindingAttestationServiceProvider::class' apps/web/bootstrap/app.php
          ! grep -Fq 'FinalShiftCloseRuntimeDbBindingAttestationServiceProvider::class' apps/web/bootstrap/providers.php
          grep -Fq 'return false;' apps/web/app/Providers/FinalShiftCloseRuntimeDbBindingAttestationServiceProvider.php

      - name: Lock registered default-off token-required delivery gate
        shell: bash
        run: |
          set -euo pipefail
          config=apps/web/config/final_shift_close_runtime_binding_materialization.php
          provider=apps/web/app/Providers/FinalShiftCloseRuntimeBindingManifestMaterializationServiceProvider.php
          middleware=apps/web/app/Delivery/Http/Middleware/RequireFinalShiftCloseRuntimeBindingMaterializationTokenMiddleware.php
          grep -Fq "env('ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_ENABLED', false)" "$config"
          grep -Fq "env('ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_TOKEN', '')" "$config"
          grep -Fq "config('final_shift_close_runtime_binding_materialization.enabled', false)" "$provider"
          grep -Fq "config('final_shift_close_runtime_binding_materialization.token', '')" "$provider"
          grep -Fq "return is_string(\$token) && \$token !== '';" "$provider"
          grep -Fq "'throttle:1,1'" "$provider"
          grep -Fq "if (\$this->expectedToken === '')" "$middleware"
          grep -Fq 'abort(503);' "$middleware"
          grep -Fq 'hash_equals($this->expectedToken, $matches[1])' "$middleware"

      - name: Validate Sprint123 machine-readable contract
        shell: bash
        run: |
          set -euo pipefail
          file=ops/final-shift-close/RUNTIME_BINDING_MANIFEST_CONTROL_PLANE_REGISTRATION_CONTRACT.json
          jq -e '
            .schema_version == 1 and
            .feature == "final-shift-close" and
            .sprint == 123 and
            .bounded_objective == "RUNTIME_BINDING_MANIFEST_CONTROL_PLANE_REGISTRATION_DEFAULT_OFF" and
            .control_plane.provider_registration == "REGISTERED_SOURCE_ONLY" and
            .control_plane.delivery == "INACTIVE" and
            .control_plane.delivery_gate == "DEFAULT_OFF_AND_TOKEN_REQUIRED" and
            .control_plane.route_registration_when_disabled == false and
            .configuration.enabled_default == false and
            .configuration.token_default == "EMPTY" and
            .configuration.empty_token_disposition == "FAIL_CLOSED" and
            .successor_compatibility.sprint121_control_channel == "PRESERVED" and
            .successor_compatibility.sprint122_write_once_cas == "PRESERVED" and
            .canonical_boundaries.runtime_manifest_materialization == "NOT_PERFORMED" and
            .canonical_boundaries.selected_target == "NONE" and
            .canonical_boundaries.db_binding_provider_registration == "NOT_REGISTERED" and
            .canonical_boundaries.migration27_execution == "NOT_PERFORMED" and
            .canonical_boundaries.permission_provisioning == "NONE" and
            .canonical_boundaries.feature_activation == "INACTIVE" and
            .source_envelope_sha256 == "2b1d247823c556f079521744ded5cc987b0d228794a1237b21aff87937331efb"
          ' "$file" >/dev/null

      - name: Preserve Sprint121 and Sprint122 security semantics
        shell: bash
        run: |
          set -euo pipefail
          materializer=apps/web/app/Application/Pos/FinalShiftCloseRuntimeBindingManifestMaterializer.php
          writer=apps/web/app/Infrastructure/Pos/FilesystemFinalShiftCloseRuntimeBindingManifestWriter.php
          grep -Fq "'SELECTED_NOT_AUTHORIZED'" "$materializer"
          grep -Fq 'hash_equals($selectionFingerprint, $request->expectedSelectionFingerprintSha256)' "$materializer"
          grep -Fq '@link($temporary, $target)' "$writer"
          ! grep -Fq 'rename($temporary, $target)' "$writer"
          grep -Fq 'Runtime binding manifest immutable conflict detected.' "$writer"

      - name: Validate PHP syntax and executable compatibility regressions
        shell: bash
        run: |
          set -euo pipefail
          find \
            apps/web/bootstrap/app.php \
            apps/web/config/final_shift_close_runtime_binding_materialization.php \
            apps/web/app/Providers/FinalShiftCloseRuntimeBindingManifestMaterializationServiceProvider.php \
            apps/web/app/Application/Pos/FinalShiftCloseRuntimeBindingManifestMaterializer.php \
            apps/web/app/Infrastructure/Pos/FilesystemFinalShiftCloseRuntimeBindingManifestWriter.php \
            apps/web/tests/final-shift-close-runtime-binding-manifest-writer.php \
            apps/web/tests/final-shift-close-runtime-binding-manifest-materialization.php \
            -type f -print0 | xargs -0 -n1 php -l
          cd apps/web
          composer install --no-interaction --prefer-dist --no-progress
          php tests/final-shift-close-runtime-binding-manifest-writer.php
          php tests/final-shift-close-runtime-binding-manifest-materialization.php

      - name: Lock no operational invocation or activation
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq 'workflow_dispatch' .github/workflows/sprint123-final-shift-close-runtime-binding-manifest-control-plane-registration.yml
          grep -Fq 'SPRINT123_CONTROL_CHANNEL_DELIVERY = INACTIVE' docs/SPRINT123_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MANIFEST_CONTROL_PLANE_REGISTRATION.md
          grep -Fq 'SPRINT123_RUNTIME_TOKEN_PROVISIONING = NOT_PERFORMED' docs/SPRINT123_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MANIFEST_CONTROL_PLANE_REGISTRATION.md
          grep -Fq 'SPRINT123_RUNTIME_MANIFEST_MATERIALIZATION = NOT_PERFORMED' docs/SPRINT123_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MANIFEST_CONTROL_PLANE_REGISTRATION.md
          grep -Fq 'MIGRATION_27_EXECUTION = NOT_PERFORMED' docs/SPRINT123_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MANIFEST_CONTROL_PLANE_REGISTRATION.md
          grep -Fq 'FEATURE_ACTIVATION = INACTIVE' docs/SPRINT123_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MANIFEST_CONTROL_PLANE_REGISTRATION.md

      - name: Verify tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "$(git status --porcelain)" ]]
