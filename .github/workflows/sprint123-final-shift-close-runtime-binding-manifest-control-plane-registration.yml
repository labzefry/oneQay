name: Sprint123 Final Shift Close Runtime Binding Manifest Control Plane Registration

# Attribution: Lab | zefry

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  qualify-runtime-binding-manifest-control-plane-registration:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Lock Sprint123 successor-compatible source envelope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | LC_ALL=C sort > /tmp/paths
          cat > /tmp/expected <<'EOF'
          .github/workflows/sprint120-final-shift-close-runtime-binding-manifest-writer.yml
          .github/workflows/sprint121-final-shift-close-runtime-binding-manifest-control-channel.yml
          .github/workflows/sprint122-final-shift-close-runtime-binding-manifest-write-once-cas.yml
          .github/workflows/sprint123-final-shift-close-runtime-binding-manifest-control-plane-registration.yml
          .github/workflows/sprint124-final-shift-close-runtime-db-binding-attestation-control-plane-registration.yml
          .github/workflows/sprint125-final-shift-close-runtime-db-binding-attestation-control-plane-regression.yml
          .github/workflows/sprint126-final-shift-close-runtime-binding-manifest-control-plane-token-hardening.yml
          .github/workflows/sprint127-final-shift-close-runtime-binding-manifest-control-plane-regression.yml
          .github/workflows/sprint128-final-shift-close-runtime-control-plane-token-character-policy.yml
          apps/web/app/Delivery/Http/Middleware/RequireFinalShiftCloseRuntimeBindingMaterializationTokenMiddleware.php
          apps/web/app/Delivery/Http/Middleware/RequireFinalShiftCloseRuntimeBindingTokenMiddleware.php
          apps/web/app/Providers/FinalShiftCloseRuntimeBindingManifestMaterializationServiceProvider.php
          apps/web/app/Providers/FinalShiftCloseRuntimeDbBindingAttestationServiceProvider.php
          apps/web/tests/final-shift-close-runtime-control-plane-token-character-policy.php
          docs/SPRINT128_FINAL_SHIFT_CLOSE_RUNTIME_CONTROL_PLANE_TOKEN_CHARACTER_POLICY.md
          ops/final-shift-close/RUNTIME_CONTROL_PLANE_TOKEN_CHARACTER_POLICY_CONTRACT.json
          EOF
          diff -u /tmp/expected /tmp/paths
          [[ "$(sha256sum /tmp/paths | awk '{print $1}')" == 'e6f251e423857e49f9e0a1a0e2e5b5008934476028fe94d6ae10f3c015be45d1' ]]

      - name: Prove control-plane semantics and operational state remain untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- \
            apps/web/bootstrap/app.php \
            apps/web/bootstrap/providers.php \
            apps/web/config/oneqay.php \
            apps/web/config/final_shift_close_runtime_binding_materialization.php \
            apps/web/config/final_shift_close_runtime_db_binding_attestation.php \
            apps/web/app/Application/Pos/FinalShiftCloseRuntimeBindingManifestMaterializer.php \
            apps/web/app/Infrastructure/Pos/FilesystemFinalShiftCloseRuntimeBindingManifestWriter.php \
            apps/web/app/Delivery/Http/Pos/FinalShiftCloseRuntimeBindingManifestMaterializationController.php \
            apps/web/routes \
            apps/web/database/migrations \
            ops/final-shift-close/STATE.json \
            ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json
          [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" == 'NOT_EXECUTED' ]]
          [[ "$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)" == 'NONE' ]]
          [[ "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]

      - name: Preserve Sprint123 default-off registration and historical materialization semantics
        shell: bash
        run: |
          set -euo pipefail
          config=apps/web/config/final_shift_close_runtime_binding_materialization.php
          provider=apps/web/app/Providers/FinalShiftCloseRuntimeBindingManifestMaterializationServiceProvider.php
          middleware=apps/web/app/Delivery/Http/Middleware/RequireFinalShiftCloseRuntimeBindingMaterializationTokenMiddleware.php
          grep -Fq "env('ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_ENABLED', false)" "$config"
          grep -Fq "env('ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_TOKEN', '')" "$config"
          grep -Fq "config('final_shift_close_runtime_binding_materialization.enabled', false)" "$provider"
          grep -Fq 'strlen($token) >= 32' "$provider"
          grep -Fq 'strlen($token) <= 512' "$provider"
          grep -Fq '[A-Za-z0-9._~+=\/-]{32,512}' "$provider"
          grep -Fq "'throttle:1,1'" "$provider"
          grep -Fq '[A-Za-z0-9._~+=\/-]{32,512}' "$middleware"
          grep -Fq 'hash_equals($this->expectedToken, $matches[1])' "$middleware"
          jq -e '.schema_version == 1 and .feature == "final-shift-close" and .sprint == 123 and .bounded_objective == "RUNTIME_BINDING_MANIFEST_CONTROL_PLANE_REGISTRATION_DEFAULT_OFF" and .control_plane.provider_registration == "REGISTERED_SOURCE_ONLY" and .control_plane.delivery == "INACTIVE" and .configuration.enabled_default == false and .configuration.token_default == "EMPTY" and .canonical_boundaries.runtime_manifest_materialization == "NOT_PERFORMED"' ops/final-shift-close/RUNTIME_BINDING_MANIFEST_CONTROL_PLANE_REGISTRATION_CONTRACT.json >/dev/null
          materializer=apps/web/app/Application/Pos/FinalShiftCloseRuntimeBindingManifestMaterializer.php
          writer=apps/web/app/Infrastructure/Pos/FilesystemFinalShiftCloseRuntimeBindingManifestWriter.php
          grep -Fq "'SELECTED_NOT_AUTHORIZED'" "$materializer"
          grep -Fq 'hash_equals($selectionFingerprint, $request->expectedSelectionFingerprintSha256)' "$materializer"
          grep -Fq '@link($temporary, $target)' "$writer"
          ! grep -Fq 'rename($temporary, $target)' "$writer"

      - name: Validate Sprint128 character policy successor contract
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.sprint == 128 and .successor_compatibility.sprint123_manifest_control_plane_registration == "PRESERVED" and .token_policy.hyphen == "ALLOWED" and .token_policy.colon == "REJECTED" and .canonical_boundaries.valid_control_plane_request == "NOT_PERFORMED" and .canonical_boundaries.runtime_manifest_materialization == "NOT_PERFORMED"' ops/final-shift-close/RUNTIME_CONTROL_PLANE_TOKEN_CHARACTER_POLICY_CONTRACT.json >/dev/null

      - name: Validate PHP syntax and executable compatibility regressions
        shell: bash
        run: |
          set -euo pipefail
          find apps/web/app/Providers/FinalShiftCloseRuntimeBindingManifestMaterializationServiceProvider.php apps/web/app/Delivery/Http/Middleware/RequireFinalShiftCloseRuntimeBindingMaterializationTokenMiddleware.php apps/web/app/Application/Pos/FinalShiftCloseRuntimeBindingManifestMaterializer.php apps/web/app/Infrastructure/Pos/FilesystemFinalShiftCloseRuntimeBindingManifestWriter.php apps/web/tests/final-shift-close-runtime-binding-manifest-writer.php apps/web/tests/final-shift-close-runtime-binding-manifest-materialization.php apps/web/tests/final-shift-close-runtime-control-plane-token-character-policy.php -type f -print0 | xargs -0 -n1 php -l
          cd apps/web
          composer install --no-interaction --prefer-dist --no-progress
          php tests/final-shift-close-runtime-binding-manifest-writer.php
          php tests/final-shift-close-runtime-binding-manifest-materialization.php

      - name: Lock no operational invocation or activation
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq 'workflow_dispatch' .github/workflows/sprint123-final-shift-close-runtime-binding-manifest-control-plane-registration.yml
          grep -Fq 'SPRINT123_CONTROL_CHANNEL_DELIVERY = INACTIVE' docs/SPRINT123_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MANIFEST_CONTROL_PLANE_REGISTRATION.md
          doc=docs/SPRINT128_FINAL_SHIFT_CLOSE_RUNTIME_CONTROL_PLANE_TOKEN_CHARACTER_POLICY.md
          grep -Fq 'SPRINT128_VALID_CONTROL_PLANE_REQUEST = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT128_RUNTIME_MANIFEST_MATERIALIZATION = NOT_PERFORMED' "$doc"
          grep -Fq 'FEATURE_ACTIVATION = INACTIVE' "$doc"

      - name: Verify tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "$(git status --porcelain)" ]]
