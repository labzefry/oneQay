name: M7.1 Application Regression

on:
  push:
    branches:
      - agent/m7-1-application-skeleton-config-boundary
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m7-1-application-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  m7-1-application-regression:
    name: m7-1-application-regression
    runs-on: ubuntu-latest
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: "false"
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      SESSION_DRIVER: array
      CACHE_STORE: array
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate PHP runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          php --version
          php -r 'if (PHP_VERSION_ID < 80200 || PHP_VERSION_ID >= 80600) { fwrite(STDERR, "M7.1 requires governed PHP 8.2-8.5 compatibility.\n"); exit(1); }'
          composer --version

      - name: Preserve root Platform Foundation regression
        run: |
          composer validate --strict --no-check-publish
          composer test

      - name: Setup exact Node LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.19.0

      - name: Show Node and npm versions
        run: |
          node --version
          npm --version

      - name: Require deterministic dependency locks
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/composer.lock
          test -f apps/web/package-lock.json

      - name: Validate application Composer metadata
        working-directory: apps/web
        run: composer validate --no-check-publish

      - name: Install locked Composer dependencies
        working-directory: apps/web
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Reject High or Critical Composer advisories
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          composer audit --locked --format=json > /tmp/oneqay-composer-audit.json || true
          cat /tmp/oneqay-composer-audit.json
          php -r '
            $data = json_decode(file_get_contents("/tmp/oneqay-composer-audit.json"), true, 512, JSON_THROW_ON_ERROR);
            foreach (($data["advisories"] ?? []) as $package => $items) {
                foreach ($items as $item) {
                    $severity = strtolower((string) ($item["severity"] ?? ""));
                    if (in_array($severity, ["high", "critical"], true)) {
                        fwrite(STDERR, "Blocking Composer advisory for {$package}: ".($item["advisoryId"] ?? "unknown")."\n");
                        exit(1);
                    }
                }
            }
          '

      - name: Validate application PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find apps/web/app apps/web/bootstrap apps/web/config apps/web/public apps/web/routes apps/web/tests \
            -type f -name '*.php' -print0 |
            while IFS= read -r -d '' file; do
              php -l "$file"
            done

      - name: Install locked npm dependencies
        working-directory: apps/web
        run: npm ci --ignore-scripts --no-fund

      - name: Reject High or Critical npm advisories
        working-directory: apps/web
        run: npm audit --audit-level=high

      - name: Type-check Vue and TypeScript
        working-directory: apps/web
        run: npm run type-check

      - name: Build Vite assets
        working-directory: apps/web
        run: npm run build

      - name: Run M7.1 application regression
        working-directory: apps/web
        run: composer test
