name: Sprint45 Canonical Reconciliation Blob Materializer

on:
  push:
    branches:
      - sprint45-doc-reconciliation-push-materializer

permissions:
  contents: write

jobs:
  materialize:
    name: materialize
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Materialize exact canonical Sprint45 reconciliation blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SECTION_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          paths = [
              '.github/workflows/README.md',
              'ARCHITECTURE.md',
              'CHANGELOG.md',
              'DATABASE.md',
              'DEPLOYMENT.md',
              'PROJECT_MANIFEST.md',
              'README.md',
              'ROADMAP.md',
              'SECURITY.md',
              'TASKS.md',
              'docs/ai/AI_NEXT_TASK.md',
              'docs/ai/AI_PROJECT_STATE.md',
              'docs/ai/AI_SESSION_STATE.md',
          ]
          section = base64.b64decode(os.environ['SECTION_B64']).decode('utf-8')
          marker = '## Canonical post-Sprint44 source publication reconciliation — 2026-08-29'
          for raw in paths:
              path = Path(raw)
              text = path.read_text(encoding='utf-8')
              if '## Canonical post-Sprint45 source publication reconciliation — 2026-08-29' in text:
                  raise SystemExit(f'{raw}: Sprint45 reconciliation unexpectedly already present')
              if marker not in text:
                  raise SystemExit(f'{raw}: canonical Sprint44 marker missing')
              updated = text.replace(marker, section + '\n\n' + marker, 1)
              out = Path('/tmp') / ('oneqay-' + raw.replace('/', '__'))
              out.write_text(updated, encoding='utf-8', newline='\n')
          PY

          cat > /tmp/reconciliation-paths <<'EOF'
          .github/workflows/README.md
          ARCHITECTURE.md
          CHANGELOG.md
          DATABASE.md
          DEPLOYMENT.md
          PROJECT_MANIFEST.md
          README.md
          ROADMAP.md
          SECURITY.md
          TASKS.md
          docs/ai/AI_NEXT_TASK.md
          docs/ai/AI_PROJECT_STATE.md
          docs/ai/AI_SESSION_STATE.md
          EOF
          LC_ALL=C sort -o /tmp/reconciliation-paths /tmp/reconciliation-paths
          test "$(wc -l < /tmp/reconciliation-paths)" -eq 13
          test "$(sha256sum /tmp/reconciliation-paths | awk '{print $1}')" = 'b129d4b1c1135f2f5aecd5dde5ff1b5f6392eecb4d54006e80fc71889763647d'

          while IFS= read -r path; do
            materialized="/tmp/oneqay-${path//\//__}"
            payload="$(python3 - "$materialized" <<'PY'
          import base64, json, pathlib, sys
          data = base64.b64encode(pathlib.Path(sys.argv[1]).read_bytes()).decode('ascii')
          print(json.dumps({'content': data, 'encoding': 'base64'}))
          PY
          )"
            sha="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha <<<"$payload")"
            printf 'MATERIALIZED_BLOB %s %s\n' "$path" "$sha"
          done < /tmp/reconciliation-paths
