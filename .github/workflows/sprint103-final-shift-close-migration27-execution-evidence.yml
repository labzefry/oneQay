name: Sprint103 Final Shift Close Migration27 Execution Evidence

# Attribution: Lab | zefry

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/final-shift-close-migration27-selected-target-db-binding.yml'
      - '.github/workflows/sprint103-final-shift-close-migration27-execution-evidence.yml'
      - '.github/workflows/sprint117-final-shift-close-migration27-selected-target-binding.yml'
      - '.github/workflows/sprint118-final-shift-close-migration27-selected-target-db-binding.yml'
      - 'docs/SPRINT117_FINAL_SHIFT_CLOSE_MIGRATION27_SELECTED_TARGET_BINDING.md'
      - 'docs/SPRINT118_FINAL_SHIFT_CLOSE_MIGRATION27_SELECTED_TARGET_DB_BINDING.md'
      - 'ops/final-shift-close/MIGRATION27_SELECTED_TARGET_BINDING_CONTRACT.json'

permissions:
  contents: read
  pull-requests: read

jobs:
  qualify-migration27-evidence-producer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Enforce exact Sprint118 successor compatibility envelope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | LC_ALL=C sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          .github/workflows/final-shift-close-migration27-selected-target-db-binding.yml
          .github/workflows/sprint103-final-shift-close-migration27-execution-evidence.yml
          .github/workflows/sprint117-final-shift-close-migration27-selected-target-binding.yml
          .github/workflows/sprint118-final-shift-close-migration27-selected-target-db-binding.yml
          docs/SPRINT117_FINAL_SHIFT_CLOSE_MIGRATION27_SELECTED_TARGET_BINDING.md
          docs/SPRINT118_FINAL_SHIFT_CLOSE_MIGRATION27_SELECTED_TARGET_DB_BINDING.md
          ops/final-shift-close/MIGRATION27_SELECTED_TARGET_BINDING_CONTRACT.json
          EOF
          diff -u /tmp/expected /tmp/actual
          test "$(sha256sum /tmp/actual | awk '{print $1}')" = '1b8a8a9851a5cac94389c6939f4c4f08dd479c108296c3959c996884612ee13c'

      - name: Preserve canonical application operational state migration source and executor
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --exit-code "$BASE_SHA" "$HEAD_SHA" -- \
            .github/workflows/final-shift-close-migration27-execution.yml \
            ops/final-shift-close/STATE.json \
            ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json \
            apps/web/database/migrations \
            apps/web/app \
            apps/web/routes \
            apps/web/resources \
            apps/web/bootstrap \
            apps/web/config
          test "$(git rev-parse "$HEAD_SHA:apps/web/database/migrations/0000_00_00_000027_create_pos_shift_close_evidence_foundation.php")" = 'a412560c2f340f4783a385aef729dbd074389a4c'

      - name: Preserve manual canonical-main migration execution boundary
        shell: bash
        run: |
          set -euo pipefail
          executor=.github/workflows/final-shift-close-migration27-execution.yml
          grep -Fq 'workflow_dispatch:' "$executor"
          ! grep -Eq '^  (pull_request|push|schedule):' "$executor"
          grep -Fq "github.ref == 'refs/heads/main'" "$executor"
          grep -Fq 'environment: final-shift-close-migration27-execution' "$executor"
          grep -Fq 'statuses: write' "$executor"
          grep -Fq 'actions: read' "$executor"
          grep -Fq 'pull-requests: read' "$executor"
          ! grep -Fq 'contents: write' "$executor"
          ! grep -Fq 'deployments: write' "$executor"

      - name: Preserve exact selected-target and authority prerequisites
        shell: bash
        run: |
          set -euo pipefail
          executor=.github/workflows/final-shift-close-migration27-execution.yml
          grep -Fq 'TARGET_SELECTION_FILE: ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json' "$executor"
          grep -Fq 'binding_run_id:' "$executor"
          grep -Fq 'binding_run_attempt:' "$executor"
          grep -Fq 'SELECTED_NOT_AUTHORIZED' "$executor"
          grep -Fq 'selected_target.environment_id' "$executor"
          grep -Fq 'selected_target.runtime_class' "$executor"
          grep -Fq 'selected_target.exact_running_source_commit' "$executor"
          grep -Fq 'selected_target.exact_running_artifact_sha256' "$executor"
          grep -Fq 'selected_target.readiness_attestation_sha256' "$executor"
          grep -Fq 'selected_target.selection_fingerprint_sha256' "$executor"
          grep -Fq 'selected_target.trusted_ingestion.run_id' "$executor"
          grep -Fq 'selected_target.trusted_ingestion.ingestion_fingerprint_sha256' "$executor"
          grep -Fq "require_latest_success 'final-shift-close-migration27-execution-authority'" "$executor"
          grep -Fq "require_latest_success 'product-owner-merge-authority'" "$executor"
          grep -Fq "require_workflow_success 'Governance Required Checks'" "$executor"
          grep -Fq "require_workflow_success 'PHP Foundation Regression'" "$executor"
          grep -Fq "require_workflow_success 'M7.1 Application Regression'" "$executor"

      - name: Preserve selected-target binding evidence consumer semantics
        shell: bash
        run: |
          set -euo pipefail
          executor=.github/workflows/final-shift-close-migration27-execution.yml
          producer=.github/workflows/final-shift-close-migration27-selected-target-db-binding.yml
          grep -Fq 'BINDING_WORKFLOW_PATH: .github/workflows/final-shift-close-migration27-selected-target-db-binding.yml' "$executor"
          grep -Fq 'BINDING_ARTIFACT_NAME: final-shift-close-migration27-selected-target-db-binding' "$executor"
          grep -Fq 'BINDING_EVIDENCE_CONTEXT: final-shift-close-migration27-selected-target-db-binding-evidence' "$executor"
          grep -Fq '.expired == false' "$executor"
          grep -Fq 'binding.json' "$executor"
          grep -Fq 'execution.json' "$executor"
          grep -Fq 'VERIFIED_SELECTED_TARGET_DATABASE' "$executor"
          grep -Fq 'database_binding_sha256' "$executor"
          grep -Fq 'actions/runs/$BINDING_RUN_ID' "$executor"
          test -f "$producer"
          grep -Fq 'workflow_dispatch:' "$producer"
          ! grep -Fq 'inputs:' "$producer"
          grep -Fq 'BINDING_ARTIFACT_NAME: final-shift-close-migration27-selected-target-db-binding' "$producer"
          grep -Fq 'BINDING_EVIDENCE_CONTEXT: final-shift-close-migration27-selected-target-db-binding-evidence' "$producer"

      - name: Preserve pre-mutation database identity binding
        shell: bash
        run: |
          set -euo pipefail
          executor=.github/workflows/final-shift-close-migration27-execution.yml
          grep -Fq 'EXPECTED_DB_BINDING:' "$executor"
          grep -Fq 'SELECT DATABASE() AS database_name, @@hostname AS server_hostname, @@port AS server_port' "$executor"
          grep -Fq "'database_name' => \$databaseName" "$executor"
          grep -Fq "'server_hostname' => \$serverHostname" "$executor"
          grep -Fq "'server_port' => \$serverPort" "$executor"
          grep -Fq "hash('sha256', json_encode(" "$executor"
          grep -Fq 'hash_equals($expectedBinding, $actualBinding)' "$executor"
          grep -Fq 'Migration27 database credentials are not bound to the exact selected durable target.' "$executor"

      - name: Preserve canonical forward-only migration semantics
        shell: bash
        run: |
          set -euo pipefail
          executor=.github/workflows/final-shift-close-migration27-execution.yml
          grep -Fq 'MIGRATION_PATH: database/migrations/0000_00_00_000027_create_pos_shift_close_evidence_foundation.php' "$executor"
          grep -Fq 'MIGRATION_BLOB_SHA: a412560c2f340f4783a385aef729dbd074389a4c' "$executor"
          grep -Fq 'git hash-object "apps/web/$MIGRATION_PATH"' "$executor"
          grep -Fq 'php artisan migrate \' "$executor"
          grep -Fq -- '--path="$MIGRATION_PATH"' "$executor"
          grep -Fq -- '--force' "$executor"
          grep -Fq -- '--no-interaction' "$executor"
          ! grep -Eq '(migrate:rollback|migrate:reset|migrate:refresh|migrate:fresh|php artisan migrate:down)' "$executor"
          ! grep -Eq '(DROP TABLE|TRUNCATE TABLE|DELETE FROM)' "$executor"
          grep -Fq "hasTable('oneqay_pos_shift_close_evidence')" "$executor"
          grep -Fq 'Required canonical predecessor migrations are not fully recorded.' "$executor"
          grep -Fq 'chk_pos_shift_close_variance_review' "$executor"

      - name: Preserve execution evidence lifecycle and no-go boundaries
        shell: bash
        run: |
          set -euo pipefail
          executor=.github/workflows/final-shift-close-migration27-execution.yml
          producer=.github/workflows/final-shift-close-migration27-selected-target-db-binding.yml
          grep -Fq 'EVIDENCE_CONTEXT: final-shift-close-migration27-execution-evidence' "$executor"
          grep -Fq -- '--arg state pending' "$executor"
          grep -Fq 'steps.binding.outputs.verified' "$executor"
          grep -Fq 'steps.execute.outcome' "$executor"
          grep -Fq 'state=success' "$executor"
          grep -Fq 'state=failure' "$executor"
          ! grep -Fq 'ONEQAY_POS_SHIFT_CLOSE_ENABLED=true' "$executor"
          ! grep -Eq '(kubectl |helm |ssh |scp |rsync |gh release|docker push)' "$executor"
          ! grep -Eq '(php artisan migrate|migrate:rollback|migrate:fresh|DROP TABLE|TRUNCATE TABLE)' "$producer"

      - name: Validate Sprint118 successor contract while retaining Sprint117 provenance
        shell: bash
        run: |
          set -euo pipefail
          contract=ops/final-shift-close/MIGRATION27_SELECTED_TARGET_BINDING_CONTRACT.json
          doc103=docs/SPRINT103_FINAL_SHIFT_CLOSE_MIGRATION27_EXECUTION_EVIDENCE.md
          jq -e . "$contract" >/dev/null
          test "$(jq -r '.contract_state' "$contract")" = 'MATERIALIZED_SOURCE_ONLY_NOT_DISPATCHED'
          test "$(jq -r '.required_selection_state' "$contract")" = 'SELECTED_NOT_AUTHORIZED'
          test "$(jq -r '.binding_producer_source_state' "$contract")" = 'SOURCE_MATERIALIZED_NOT_DISPATCHED'
          test "$(jq -r '.database_binding_algorithm' "$contract")" = 'SHA256_CANONICAL_JSON_DATABASE_HOSTNAME_PORT_V1'
          test "$(jq -r '.canonical_boundaries.selected_target' "$contract")" = 'NONE'
          test "$(jq -r '.canonical_boundaries.binding_evidence' "$contract")" = 'NONE'
          test "$(jq -r '.canonical_boundaries.migration27_execution' "$contract")" = 'NOT_PERFORMED'
          test "$(jq -r '.sprint117_source_envelope_sha256' "$contract")" = '0aab6969f2e6fe3e7f23aae2af99bc8fb9d70ac10e6d620bf20bc30a58ba4e25'
          test "$(jq -r '.source_envelope_sha256' "$contract")" = '1b8a8a9851a5cac94389c6939f4c4f08dd479c108296c3959c996884612ee13c'
          grep -Fq 'Sprint117 selected-target binding hardening' "$doc103"
          grep -Fq 'MIGRATION_27_LIVE_EXECUTION = NOT_PERFORMED' "$doc103"

      - name: Verify tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=no)"
