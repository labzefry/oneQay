name: Sprint253 Exact Head Failure Batch Materializer

# Attribution: Lab | zefry

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sprint253-failure-batch-materializer.yml'
      - 'tools/sprint253-failure-batch-correction.py'

permissions:
  contents: write

concurrency:
  group: sprint253-failure-batch-materializer-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_PARENT: 80edc837192342d9b453ff57966e47ec1b2872df
      HEAD_BRANCH: sprint253-post-activation-historical-regression-successor-compatibility
      SOURCE: 59b42137eed717aacc82080a46753440bb4d8537
      ARTIFACT: 8ad4a33196eabd6248c9dfb35eb118e97759e5c17b32384a12b120258bce615c
      READINESS: 4a0772838f25d7ee3a7d57153f76b3b23f5d4722c644a76c287b5005e9c328b2
      FINGERPRINT: 6ecc487cb144e634455de69cc43aa39b1f6880a2256c4b1ab33387096513772b

    steps:
      - name: Checkout exact transient head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Bind exact parent and transient scope
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_HEAD_REF}" = "${HEAD_BRANCH}"
          test "$(git rev-parse HEAD^)" = "${BASE_PARENT}"
          test -f .github/workflows/sprint253-failure-batch-materializer.yml
          test -f tools/sprint253-failure-batch-correction.py
          test "$(git diff --name-only "${BASE_PARENT}" HEAD | LC_ALL=C sort | wc -l)" = '2'
          git diff --name-only "${BASE_PARENT}" HEAD | LC_ALL=C sort > /tmp/transient
          printf '%s\n' \
            '.github/workflows/sprint253-failure-batch-materializer.yml' \
            'tools/sprint253-failure-batch-correction.py' | LC_ALL=C sort > /tmp/transient-expected
          diff -u /tmp/transient-expected /tmp/transient

      - name: Materialize bounded exact-head correction batch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/sprint253-failure-batch-correction.py
          rm -rf tools/__pycache__
          python3 tools/sprint253-failure-batch-correction.py
          git diff --check

      - name: Enforce exact correction path set
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only HEAD | LC_ALL=C sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          .github/workflows/sprint105-final-shift-close-feature-activation-readiness.yml
          .github/workflows/sprint106-final-shift-close-activation-target-contract.yml
          .github/workflows/sprint109-final-shift-close-durable-activation-target-selection.yml
          .github/workflows/sprint111-final-shift-close-durable-runtime-target-selection-contract.yml
          .github/workflows/sprint112-final-shift-close-durable-runtime-attestation-ingestion.yml
          .github/workflows/sprint113-final-shift-close-durable-runtime-attestation-producer.yml
          .github/workflows/sprint114-final-shift-close-durable-runtime-attestation-ingestion-execution.yml
          .github/workflows/sprint116-final-shift-close-post-selection-downstream-readiness.yml
          .github/workflows/sprint152-final-shift-close-permission-selected-target-binding-regression.yml
          .github/workflows/sprint225-historical-selected-target-successor-compatibility.yml
          .github/workflows/sprint228-migration27-state-successor-compatibility.yml
          .github/workflows/sprint229-sprint194-migration27-state-successor-compatibility.yml
          .github/workflows/sprint240-final-shift-close-durable-staging-runtime-promotion-successor-regression.yml
          .github/workflows/sprint243-final-shift-close-feature-activation-guard-successor-regression.yml
          .github/workflows/sprint244-final-shift-close-capability-producer-selection-shape-successor-regression.yml
          .github/workflows/sprint253-final-shift-close-post-activation-historical-regression-successor-compatibility.yml
          apps/web/tests/pos-final-shift-close-activation-workflow-pagination.php
          apps/web/tests/pos-final-shift-close-operator-kit-successor-wiring.php
          EOF
          LC_ALL=C sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual
          test "$(wc -l < /tmp/actual)" = '18'

      - name: Validate workflow and executable regression syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/*.yml)
                ruby -e 'require "yaml"; YAML.safe_load(File.read(ARGV[0]), aliases: true)' "$file"
                ;;
            esac
          done < /tmp/actual
          php -l apps/web/tests/pos-final-shift-close-activation-workflow-pagination.php
          php -l apps/web/tests/pos-final-shift-close-operator-kit-successor-wiring.php
          php apps/web/tests/pos-final-shift-close-activation-workflow-pagination.php
          php apps/web/tests/pos-final-shift-close-operator-kit-successor-wiring.php

      - name: Preserve canonical runtime and operational no-go
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "${BASE_PARENT}" -- \
            apps/web/app \
            apps/web/bootstrap \
            apps/web/config \
            apps/web/database/migrations \
            apps/web/resources \
            apps/web/routes \
            ops/final-shift-close/STATE.json \
            ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json

          state=ops/final-shift-close/STATE.json
          selection=ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json
          test "$(jq -r '.migration27.state' "$state")" = EXECUTED
          test "$(jq -r '.permission_provisioning.state' "$state")" = PROVISIONED
          test "$(jq -r '.permission_provisioning.default_grant' "$state")" = NONE
          test "$(jq -r '.feature_activation.state' "$state")" = ACTIVE
          test "$(jq -r '.deployment_authority' "$state")" = NOT_GRANTED
          test "$(jq -r '.technical_preview_activation' "$state")" = NOT_AUTHORIZED
          test "$(jq -r '.production_activation' "$state")" = NOT_AUTHORIZED
          test "$(jq -r '.updater_activation' "$state")" = INACTIVE
          test "$(jq -r '.selection_state' "$selection")" = SELECTED_NOT_AUTHORIZED
          test "$(jq -r '.selected_target.environment_id' "$selection")" = oneqay-durable-staging-01
          test "$(jq -r '.selected_target.runtime_class' "$selection")" = durable-staging
          test "$(jq -r '.selected_target.exact_running_source_commit' "$selection")" = "${SOURCE}"
          test "$(jq -r '.selected_target.exact_running_artifact_sha256' "$selection")" = "${ARTIFACT}"
          test "$(jq -r '.selected_target.readiness_attestation_sha256' "$selection")" = "${READINESS}"
          test "$(jq -r '.selected_target.selection_fingerprint_sha256' "$selection")" = "${FINGERPRINT}"

      - name: Build one final correction commit without transient materializer
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/sprint253-failure-batch-materializer.yml
          rm -f tools/sprint253-failure-batch-correction.py
          rm -rf tools/__pycache__
          git diff --check

          git diff --name-only "${BASE_PARENT}" | LC_ALL=C sort > /tmp/final-paths
          diff -u /tmp/expected /tmp/final-paths
          test "$(wc -l < /tmp/final-paths)" = '18'

          git config user.name 'Lab | zefry'
          git config user.email 'lab.zefa@gmail.com'
          git add -A
          git commit -m 'Sprint253: close exact-head compatibility failures' -m 'Author by Lab | zefry'

          test "$(git rev-parse HEAD^)" = "${GITHUB_SHA}"
          git diff --name-only "${BASE_PARENT}" HEAD | LC_ALL=C sort > /tmp/committed-paths
          diff -u /tmp/expected /tmp/committed-paths
          test ! -e .github/workflows/sprint253-failure-batch-materializer.yml
          test ! -e tools/sprint253-failure-batch-correction.py

          echo "FINAL_CORRECTION_COMMIT_SHA=$(git rev-parse HEAD)"
          echo "FINAL_CORRECTION_TREE_SHA=$(git rev-parse HEAD^{tree})"
          echo "FINAL_CORRECTION_PATHSET_SHA256=$(sha256sum /tmp/committed-paths | awk '{print $1}')"
          echo "FINAL_CORRECTION_PATH_COUNT=$(wc -l < /tmp/committed-paths)"

      - name: Publish final correction object and fast-forward when permitted
        shell: bash
        run: |
          set -euo pipefail
          set +e
          git push origin "HEAD:refs/heads/${HEAD_BRANCH}"
          rc=$?
          set -e
          echo "FINAL_CORRECTION_PUSH_RC=$rc"
          exit 0
