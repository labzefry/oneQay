name: Sprint152 Final Shift Close Permission Selected Target Binding Regression

# Attribution: Lab | zefry

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sprint152-final-shift-close-permission-selected-target-binding-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify-permission-selected-target-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Qualify exact Sprint152 source envelope
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          expected_hash='052599d3aeb31aacaa4f139cac6ea1b0cd677a86a1c25358136d69b8f5f650c9'
          mapfile -t changed < <(git diff --name-only "$base" "$head" | LC_ALL=C sort)
          test "${#changed[@]}" -eq 6
          printf '%s\n' "${changed[@]}" > /tmp/sprint152-paths
          test "$(sha256sum /tmp/sprint152-paths | awk '{print $1}')" = "$expected_hash"
          expected=(
            '.github/workflows/final-shift-close-permission-provisioning.yml'
            '.github/workflows/sprint104-final-shift-close-permission-provisioning-evidence.yml'
            '.github/workflows/sprint152-final-shift-close-permission-selected-target-binding-regression.yml'
            'docs/SPRINT152_FINAL_SHIFT_CLOSE_PERMISSION_SELECTED_TARGET_BINDING.md'
            'ops/final-shift-close/PERMISSION_PROVISIONING_SELECTED_TARGET_BINDING_CONTRACT.json'
            'ops/final-shift-close/POST_SELECTION_DOWNSTREAM_READINESS.json'
          )
          printf '%s\n' "${expected[@]}" | LC_ALL=C sort > /tmp/sprint152-expected
          diff -u /tmp/sprint152-expected /tmp/sprint152-paths

      - name: Validate Sprint152 machine-readable contract
        shell: bash
        run: |
          set -euo pipefail
          file=ops/final-shift-close/PERMISSION_PROVISIONING_SELECTED_TARGET_BINDING_CONTRACT.json
          jq -e '
            .schema_version == 1 and
            .feature == "final-shift-close" and
            .sprint == 152 and
            .contract_state == "MATERIALIZED_SOURCE_ONLY_NOT_DISPATCHED" and
            .bounded_objective == "PERMISSION_PROVISIONING_SELECTED_TARGET_DATABASE_BINDING" and
            .reused_binding_evidence.producer_workflow_path == ".github/workflows/final-shift-close-migration27-selected-target-db-binding.yml" and
            .reused_binding_evidence.artifact_name == "final-shift-close-migration27-selected-target-db-binding" and
            .source_requirements.exact_selected_target_identity_required == true and
            .source_requirements.immediate_pre_mutation_database_identity_readback_required == true and
            .source_requirements.database_binding_hash_equals_required == true and
            .source_requirements.new_binding_producer_forbidden == true and
            .source_envelope.path_count == 6 and
            .source_envelope.sha256 == "052599d3aeb31aacaa4f139cac6ea1b0cd677a86a1c25358136d69b8f5f650c9" and
            .canonical_boundaries.permission_provisioning == "NONE" and
            .canonical_boundaries.permission_provisioning_selected_target_binding_execution == "NOT_PERFORMED" and
            .attribution == "Author by Lab | zefry"
          ' "$file" >/dev/null

      - name: Prove permission executor requires exact selected target binding
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/final-shift-close-permission-provisioning.yml
          historical=.github/workflows/sprint104-final-shift-close-permission-provisioning-evidence.yml
          grep -Fq 'binding_run_id:' "$workflow"
          grep -Fq 'binding_run_attempt:' "$workflow"
          grep -Fq 'DURABLE_ACTIVATION_TARGET_SELECTION.json' "$workflow"
          grep -Fq '.selection_state' "$workflow"
          grep -Fq 'SELECTED_NOT_AUTHORIZED' "$workflow"
          grep -Fq '.github/workflows/final-shift-close-migration27-selected-target-db-binding.yml' "$workflow"
          grep -Fq 'final-shift-close-migration27-selected-target-db-binding' "$workflow"
          grep -Fq 'binding.json' "$workflow"
          grep -Fq 'execution.json' "$workflow"
          grep -Fq 'database_binding_sha256' "$workflow"
          grep -Fq 'SELECT DATABASE() AS database_name, @@hostname AS server_hostname, @@port AS server_port' "$workflow"
          grep -Fq 'hash_equals($expectedBinding, $actualBinding)' "$workflow"
          grep -Fq 'Canonical migration27 execution record is not exact.' "$workflow"
          grep -Fq "steps.binding.outputs.verified == 'true'" "$workflow"
          grep -Fq 'Preserve Sprint104 historical source boundary' "$historical"
          grep -Fq 'c8e22973b8e5f8ae3f20cc2d1121e78b10e526a6510f38c3b13771c057fe1692' "$historical"
          ! grep -Fq 'Enforce exact Sprint104 source envelope' "$historical"

      - name: Preserve downstream and operational NO-GO boundaries
        shell: bash
        run: |
          set -euo pipefail
          downstream=ops/final-shift-close/POST_SELECTION_DOWNSTREAM_READINESS.json
          state=ops/final-shift-close/STATE.json
          selection=ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json
          jq -e '
            .sprint152_extension.bounded_objective == "PERMISSION_PROVISIONING_SELECTED_TARGET_DATABASE_BINDING" and
            .sprint152_extension.source_only == true and
            .sprint152_extension.provisioning_workflow_dispatch == "NOT_PERFORMED" and
            .sprint152_extension.real_selected_target_database_binding_evidence == "NONE" and
            .sprint152_extension.permission_provisioning == "NONE" and
            .sprint152_extension.source_envelope_sha256 == "052599d3aeb31aacaa4f139cac6ea1b0cd677a86a1c25358136d69b8f5f650c9" and
            .canonical_boundaries.permission_provisioning_selected_target_binding_source == "MATERIALIZED_NOT_DISPATCHED" and
            .canonical_boundaries.permission_provisioning_selected_target_binding_evidence == "NONE" and
            .canonical_boundaries.permission_provisioning == "NONE" and
            .canonical_boundaries.feature_activation == "INACTIVE"
          ' "$downstream" >/dev/null
          test "$(jq -r '.migration27.state' "$state")" = 'NOT_EXECUTED'
          test "$(jq -r '.permission_provisioning.state' "$state")" = 'NONE'
          test "$(jq -r '.feature_activation.state' "$state")" = 'INACTIVE'
          test "$(jq -r '.deployment_authority' "$state")" = 'NOT_GRANTED'
          test "$(jq -r '.technical_preview_activation' "$state")" = 'NOT_AUTHORIZED'
          test "$(jq -r '.production_activation' "$state")" = 'NOT_AUTHORIZED'
          test "$(jq -r '.updater_activation' "$state")" = 'INACTIVE'
          test "$(jq -r '.selection_state' "$selection")" = 'BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET'
          test "$(jq -r '.selected_target' "$selection")" = 'null'

      - name: Preserve Sprint152 documentation boundary
        shell: bash
        run: |
          set -euo pipefail
          doc=docs/SPRINT152_FINAL_SHIFT_CLOSE_PERMISSION_SELECTED_TARGET_BINDING.md
          for heading in '## Purpose / Why' '## Objective / Gap' '## What changed' '## Evidence / Qualification' '## Operational boundaries / NO-GO' '## Next position'; do grep -Fq "$heading" "$doc"; done
          grep -Fq '052599d3aeb31aacaa4f139cac6ea1b0cd677a86a1c25358136d69b8f5f650c9' "$doc"
          grep -Fq 'Real selected-target database-binding evidence remains `NONE`' "$doc"
          grep -Fq 'permission provisioning remains `NONE`' "$doc"
          grep -Fq 'Sprint104' "$doc"

      - name: Verify tracked-source cleanliness
        run: |
          git diff --exit-code
          git diff --cached --exit-code

# Author by Lab | zefry
