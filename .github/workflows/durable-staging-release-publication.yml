# Author by Lab | zefry
# Sprint240 current-canonical-state successor — Lab | zefry
name: Durable Staging Operator Artifact Publication

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/durable-staging-release-publication.yml'
      - 'apps/web/**'
      - 'release/durable-staging-manifest-v1.schema.json'
      - 'tools/build-durable-staging-release.sh'
      - 'tools/validate-durable-staging-release-manifest.php'
      - 'tools/prepare-durable-staging-deployment-handoff.php'
      - 'tools/deployment/durable-staging-deployment-handoff.schema.json'
      - 'ops/final-shift-close/DURABLE_STAGING_RELEASE_ARTIFACT_CONTRACT.json'
      - 'ops/final-shift-close/DURABLE_STAGING_DEPLOYMENT_HANDOFF_CONTRACT.json'
      - 'ops/final-shift-close/DURABLE_STAGING_OPERATOR_ARTIFACT_PUBLICATION_CONTRACT.json'
      - 'ops/final-shift-close/DURABLE_STAGING_RUNTIME_PROMOTION_SUCCESSOR_CONTRACT.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: durable-staging-operator-artifact-publication-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish-durable-staging-operator-artifact:
    name: publish-durable-staging-operator-artifact
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      APP_DEBUG: "false"
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      SESSION_DRIVER: array
      CACHE_STORE: array
      LOG_CHANNEL: stderr
      ONEQAY_BUILD_PROVENANCE: github-actions:${{ github.run_id }}:${{ github.run_attempt }}

    steps:
      - name: Checkout exact main source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Prove exact main publication source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo 'Publication source is not reachable from canonical main.' >&2
            exit 1
          }

      - name: Validate current canonical prerequisite state without operational mutation
        shell: bash
        run: |
          set -euo pipefail
          state=ops/final-shift-close/STATE.json
          selection=ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json

          test "$(jq -r '.migration27.state' "$state")" = EXECUTED
          test "$(jq -r '.permission_provisioning.state' "$state")" = PROVISIONED
          test "$(jq -r '.permission_provisioning.permission_id' "$state")" = pos.shift.close
          test "$(jq -r '.permission_provisioning.default_grant' "$state")" = NONE
          test "$(jq -r '.feature_activation.state' "$state")" = INACTIVE
          test "$(jq -r '.deployment_authority' "$state")" = NOT_GRANTED
          test "$(jq -r '.technical_preview_activation' "$state")" = NOT_AUTHORIZED
          test "$(jq -r '.production_activation' "$state")" = NOT_AUTHORIZED
          test "$(jq -r '.updater_activation' "$state")" = INACTIVE

          test "$(jq -r '.selection_state' "$selection")" = SELECTED_NOT_AUTHORIZED
          test "$(jq -r '.selected_target.environment_id' "$selection")" = oneqay-durable-staging-01
          test "$(jq -r '.selected_target.runtime_class' "$selection")" = durable-staging
          selected_source="$(jq -r '.selected_target.exact_running_source_commit' "$selection")"
          selected_artifact="$(jq -r '.selected_target.exact_running_artifact_sha256' "$selection")"
          selected_attestation="$(jq -r '.selected_target.readiness_attestation_sha256' "$selection")"
          [[ "$selected_source" =~ ^[0-9a-f]{40}$ ]]
          [[ "$selected_artifact" =~ ^[0-9a-f]{64}$ ]]
          [[ "$selected_attestation" =~ ^[0-9a-f]{64}$ ]]
          git merge-base --is-ancestor "$selected_source" "$GITHUB_SHA" || {
            echo 'Current selected durable runtime source is not an ancestor of the successor publication source.' >&2
            exit 1
          }

      - name: Validate publication contracts
        shell: bash
        run: |
          set -euo pipefail
          publication=ops/final-shift-close/DURABLE_STAGING_OPERATOR_ARTIFACT_PUBLICATION_CONTRACT.json
          release=ops/final-shift-close/DURABLE_STAGING_RELEASE_ARTIFACT_CONTRACT.json
          successor=ops/final-shift-close/DURABLE_STAGING_RUNTIME_PROMOTION_SUCCESSOR_CONTRACT.json
          jq -e . "$publication" >/dev/null
          jq -e . "$release" >/dev/null
          jq -e . "$successor" >/dev/null

          test "$(jq -r '.contract_state' "$publication")" = PUBLISHES_SECRET_FREE_OPERATOR_RETRIEVABLE_ARTIFACT_NOT_DEPLOYED
          test "$(jq -r '.current_canonical_state.migration27' "$publication")" = EXECUTED
          test "$(jq -r '.current_canonical_state.permission_provisioning' "$publication")" = PROVISIONED
          test "$(jq -r '.current_canonical_state.feature_activation' "$publication")" = INACTIVE
          test "$(jq -r '.current_canonical_state.selected_target_state' "$publication")" = SELECTED_NOT_AUTHORIZED
          test "$(jq -r '.successor_candidate_policy.publication_mutates_selected_target' "$publication")" = false
          test "$(jq -r '.successor_candidate_policy.deployment_requires_separate_authority' "$publication")" = true
          test "$(jq -r '.successor_candidate_policy.post_deployment_reattestation_required' "$publication")" = true

          test "$(jq -r '.contract_state' "$release")" = MATERIALIZED_SOURCE_ONLY_NOT_DEPLOYED
          test "$(jq -r '.current_canonical_state.migration27' "$release")" = EXECUTED
          test "$(jq -r '.current_canonical_state.permission_provisioning' "$release")" = PROVISIONED
          test "$(jq -r '.current_canonical_state.feature_activation' "$release")" = INACTIVE
          test "$(jq -r '.successor_candidate_policy.runtime_class' "$release")" = durable-staging
          test "$(jq -r '.successor_candidate_policy.deployment_performed_by_builder' "$release")" = false

          test "$(jq -r '.contract_state' "$successor")" = MATERIALIZED_PROMOTION_READY_NOT_DEPLOYED_NOT_ACTIVATED
          test "$(jq -r '.operational_boundaries.deployment_authority' "$successor")" = NOT_GRANTED
          test "$(jq -r '.operational_boundaries.feature_activation' "$successor")" = INACTIVE

      - name: Setup governed PHP runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Setup exact Node LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.19.0

      - name: Install locked build dependencies
        shell: bash
        run: |
          set -euo pipefail
          composer validate --strict --no-check-publish
          composer test
          cd apps/web
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          npm ci --ignore-scripts --no-fund
          npm run type-check
          npm run build

      - name: Build first exact durable staging artifact
        id: durable
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          test "$head_sha" = "$GITHUB_SHA"
          bash tools/build-durable-staging-release.sh "$head_sha"
          release_id="durable-staging-${head_sha:0:12}"
          archive="dist/${release_id}.tar.gz"
          manifest="dist/${release_id}.manifest.json"
          checksum="dist/${release_id}.tar.gz.sha256"
          php tools/validate-durable-staging-release-manifest.php "$manifest" "$archive"
          cp "$manifest" /tmp/oneqay-first-durable-manifest.json
          cp "$checksum" /tmp/oneqay-first-durable-artifact.sha256
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Prove exact artifact reproducibility
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          rm -rf dist
          bash tools/build-durable-staging-release.sh "$head_sha"
          release_id="durable-staging-${head_sha:0:12}"
          diff -u /tmp/oneqay-first-durable-manifest.json "dist/${release_id}.manifest.json"
          diff -u /tmp/oneqay-first-durable-artifact.sha256 "dist/${release_id}.tar.gz.sha256"
          php tools/validate-durable-staging-release-manifest.php \
            "dist/${release_id}.manifest.json" \
            "dist/${release_id}.tar.gz"

      - name: Prepare secret-free deployment handoff
        id: handoff
        shell: bash
        run: |
          set -euo pipefail
          release_id="${{ steps.durable.outputs.release_id }}"
          handoff="dist/${release_id}.deployment-handoff.json"
          php tools/prepare-durable-staging-deployment-handoff.php \
            "${{ steps.durable.outputs.manifest }}" \
            "${{ steps.durable.outputs.archive }}" \
            "$GITHUB_SHA" \
            "$handoff"
          jq -e . "$handoff" >/dev/null
          test "$(jq -r '.handoff_state' "$handoff")" = VALIDATED_FOR_EXTERNAL_DEPLOYMENT_NOT_AUTHORIZED
          test "$(jq -r '.artifact.source_commit' "$handoff")" = "$GITHUB_SHA"
          test "$(jq -r '.runtime.required_runtime_class' "$handoff")" = durable-staging
          test "$(jq -r '.migration.execution_state' "$handoff")" = NOT_PERFORMED
          test "$(jq -r '.deployment.authority_state' "$handoff")" = NOT_GRANTED
          test "$(jq -r '.operational_boundary.environment_deployment' "$handoff")" = NOT_PERFORMED
          echo "handoff=$handoff" >> "$GITHUB_OUTPUT"

      - name: Prove operator bundle contains no embedded secrets
        shell: bash
        run: |
          set -euo pipefail
          archive="${{ steps.durable.outputs.archive }}"
          manifest="${{ steps.durable.outputs.manifest }}"
          handoff="${{ steps.handoff.outputs.handoff }}"
          tar -tzf "$archive" > /tmp/oneqay-durable-publication-list.txt
          ! grep -E '(^|/)(\.env|\.git)(/|$)|(^|/)(node_modules|tests)(/|$)' /tmp/oneqay-durable-publication-list.txt
          ! grep -E -i '"?(password|secret|token)"?[[:space:]]*:[[:space:]]*"[^"]+"' "$manifest" "$handoff"
          test "$(grep -Ec '/apps/web/database/migrations/[^/]+\.php$' /tmp/oneqay-durable-publication-list.txt)" -eq 27

      - name: Upload governed durable staging operator bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oneqay-${{ steps.durable.outputs.release_id }}-operator-bundle
          path: |
            ${{ steps.durable.outputs.archive }}
            ${{ steps.durable.outputs.manifest }}
            ${{ steps.durable.outputs.checksum }}
            ${{ steps.handoff.outputs.handoff }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Confirm tracked source remains unchanged
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          git diff --exit-code
          test -z "$(git status --porcelain)"
