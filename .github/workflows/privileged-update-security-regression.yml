name: Privileged Update Security Regression

# Attribution: Lab | zefry

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/web/app/Application/SystemUpdate/**'
      - 'apps/web/app/Infrastructure/SystemUpdate/**'
      - 'apps/web/app/Delivery/Http/SystemUpdate/**'
      - 'apps/web/app/Providers/SystemUpdateServiceProvider.php'
      - 'apps/web/bootstrap/providers.php'
      - 'apps/web/config/oneqay.php'
      - 'apps/web/routes/web.php'
      - 'apps/web/tests/privileged-update-security.php'
      - 'apps/web/tests/backend-updater-control-plane.php'
      - '.github/workflows/privileged-update-security-regression.yml'
      - '.github/workflows/backend-updater-control-plane-regression.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/web/app/Application/SystemUpdate/**'
      - 'apps/web/app/Infrastructure/SystemUpdate/**'
      - 'apps/web/app/Delivery/Http/SystemUpdate/**'
      - 'apps/web/app/Providers/SystemUpdateServiceProvider.php'
      - 'apps/web/bootstrap/providers.php'
      - 'apps/web/config/oneqay.php'
      - 'apps/web/routes/web.php'
      - 'apps/web/tests/privileged-update-security.php'
      - 'apps/web/tests/backend-updater-control-plane.php'
      - '.github/workflows/privileged-update-security-regression.yml'
      - '.github/workflows/backend-updater-control-plane-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: privileged-update-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  privileged-update-security-regression:
    name: privileged-update-security-regression
    runs-on: ubuntu-latest
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      ONEQAY_SYSTEM_UPDATE_CONTROL_PLANE_ENABLED: 'false'
      SESSION_DRIVER: array
      CACHE_STORE: array
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate PHP runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          php --version
          php -r 'if (PHP_VERSION_ID < 80200 || PHP_VERSION_ID >= 80600) { fwrite(STDERR, "Privileged update security requires governed PHP 8.2-8.5 compatibility.\n"); exit(1); }'
          composer --version

      - name: Preserve root Platform Foundation regression
        run: |
          composer validate --strict --no-check-publish
          composer test

      - name: Validate application Composer metadata
        working-directory: apps/web
        run: composer validate --no-check-publish

      - name: Install locked application dependencies
        working-directory: apps/web
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Reject High or Critical Composer advisories
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          composer audit --locked --format=json > /tmp/oneqay-privileged-security-composer-audit.json || true
          php -r '
            $data = json_decode(file_get_contents("/tmp/oneqay-privileged-security-composer-audit.json"), true, 512, JSON_THROW_ON_ERROR);
            foreach (($data["advisories"] ?? []) as $package => $items) {
                foreach ($items as $item) {
                    $severity = strtolower((string) ($item["severity"] ?? ""));
                    if (in_array($severity, ["high", "critical"], true)) {
                        fwrite(STDERR, "Blocking Composer advisory for {$package}.\n");
                        exit(1);
                    }
                }
            }
          '

      - name: Validate privileged security PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find \
            apps/web/app/Application/SystemUpdate/Security \
            apps/web/app/Infrastructure/SystemUpdate/Security \
            apps/web/tests/privileged-update-security.php \
            -type f -name '*.php' -print0 |
            while IFS= read -r -d '' file; do php -l "$file"; done

      - name: Reject database or schema coupling
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'Illuminate\\Database|Schema::|DB::|new PDO|mysqli_' \
            apps/web/app/Application/SystemUpdate \
            apps/web/app/Infrastructure/SystemUpdate; then
            echo 'Updater security/control-plane must remain database/schema independent.' >&2
            exit 1
          fi

      - name: Run privileged update security regression
        working-directory: apps/web
        run: php tests/privileged-update-security.php

      - name: Prove HTTP install remains disabled and activation is isolated
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "'install_enabled' => false" apps/web/config/oneqay.php
          ! grep -Eq 'ONEQAY_SYSTEM_UPDATE_INSTALL|env\([^)]*INSTALL' apps/web/config/oneqay.php
          grep -Fq "Route::post('/install', 'install')" apps/web/routes/web.php
          grep -Fq 'requestInstall(null)' apps/web/app/Delivery/Http/SystemUpdate/SystemUpdateControlPlaneController.php

          if grep -R -n -E 'PharData|ZipArchive|curl_|Http::|Guzzle|shell_exec|proc_open|exec\(' \
            apps/web/app/Application/SystemUpdate \
            apps/web/app/Infrastructure/SystemUpdate \
            apps/web/app/Delivery/Http/SystemUpdate \
            --exclude-dir=Security; then
            echo 'Privileged security gate detected unauthorized remote download/archive/shell implementation.' >&2
            exit 1
          fi

          mutation_matches="$(grep -R -n -E 'file_put_contents|rename\(|unlink\(|(^|[^[:alnum:]_])(symlink|link)\(' \
            apps/web/app/Application/SystemUpdate \
            apps/web/app/Infrastructure/SystemUpdate \
            apps/web/app/Delivery/Http/SystemUpdate \
            --exclude-dir=Security || true)"

          if [ -n "$mutation_matches" ]; then
            unexpected="$(printf '%s\n' "$mutation_matches" | grep -v '^apps/web/app/Infrastructure/SystemUpdate/Activation/' || true)"
            if [ -n "$unexpected" ]; then
              printf '%s\n' "$unexpected" >&2
              echo 'Updater filesystem mutation escaped the separately tested Activation infrastructure boundary.' >&2
              exit 1
            fi
          fi

      - name: Run backend control-plane fail-closed regression
        working-directory: apps/web
        run: php tests/backend-updater-control-plane.php

      - name: Confirm tracked source remains unchanged
        shell: bash
        run: git diff --exit-code
