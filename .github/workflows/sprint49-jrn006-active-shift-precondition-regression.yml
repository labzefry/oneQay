name: Sprint49 JRN-006 Active Shift Sale Precondition Regression

# Author by Lab | zefry

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sprint49-jrn006-active-shift-precondition-regression.yml'
      - 'apps/web/app/Infrastructure/Pos/LaravelDurablePosSaleRepository.php'
      - 'apps/web/tests/pos-sale-completion-active-shift.php'
      - 'docs/JRN_006_POS_SALE_COMPLETION_PAYMENT_RECEIPT_FOUNDATION.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint49-jrn006-active-shift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sprint49-jrn006-active-shift:
    name: sprint49-jrn006-active-shift
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:c3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3M=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      ONEQAY_PERSISTENCE_ENABLED: 'true'
      ONEQAY_AUTHENTICATION_SESSION_CONTROL_ENABLED: 'true'
      ONEQAY_POS_SALE_COMPLETION_ENABLED: 'true'
      ONEQAY_POS_SHIFT_OPENING_ENABLED: 'true'
      SESSION_DRIVER: array
      CACHE_STORE: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce exact Sprint49 source envelope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$base" "$head" | sort > /tmp/s49-source-paths
          count="$(wc -l < /tmp/s49-source-paths)"
          fingerprint="$(sha256sum /tmp/s49-source-paths | awk '{print $1}')"
          echo 'ONEQAY_SPRINT50_JRN007_SOURCE_SUCCESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT50_COMPATIBILITY_PREDECESSOR=false' >> "$GITHUB_ENV"
          if [[ "$count" -eq 4 && "$fingerprint" == '154e4e0f6fb898b2c5c677764571a5a9a57c31371c852f16e89a74f3b104adec' ]]; then
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations
          elif [[ "$count" -eq 14 && "$fingerprint" == '78628976e4dbfea29ecab4b40ec6bfbdf697564668ef028a5cb77a3b53466451' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s49-source-paths)" -eq 1
            grep -Fxq 'apps/web/database/migrations/0000_00_00_000019_create_pos_sale_void_foundation.php' /tmp/s49-source-paths
            echo 'ONEQAY_SPRINT50_JRN007_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
          elif [[ "$count" -eq 29 && "$fingerprint" == 'e2ab1c790458071afb5e26f9c1525a34386df666851bb77d58c04c15220d1e52' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s49-source-paths)" -eq 0
            echo 'ONEQAY_SPRINT50_COMPATIBILITY_PREDECESSOR=true' >> "$GITHUB_ENV"
          else
            echo 'Sprint49 changed-file envelope mismatch.' >&2
            exit 1
          fi
          ! grep -Eq '(^|/)(composer\.(json|lock)|package(-lock)?\.json|\.env(\.|$))' /tmp/s49-source-paths

      - name: Preserve migration horizon and NO_SCHEMA_CHANGE
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${ONEQAY_SPRINT50_JRN007_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            migration19='apps/web/database/migrations/0000_00_00_000019_create_pos_sale_void_foundation.php'
            changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
            test "$changed" = "$migration19"
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration19"
            git update-index --assume-unchanged "$migration19"
            rm -f "$migration19"
          elif [[ "${ONEQAY_SPRINT50_COMPATIBILITY_PREDECESSOR:-false}" == 'true' ]]; then
            git diff --exit-code "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- apps/web/database/migrations
          fi
          mapfile -t migrations < <(find apps/web/database/migrations -maxdepth 1 -type f -name '*.php' -printf '%f\n' | sort)
          test "${#migrations[@]}" -eq 18
          for index in $(seq 1 18); do
            prefix="$(printf '0000_00_00_%06d_' "$index")"
            test "$(printf '%s\n' "${migrations[@]}" | grep -c "^$prefix")" -eq 1
          done
          test ! -e apps/web/database/migrations/0000_00_00_000019_*
          grep -Fq "Schema::create('oneqay_pos_shifts'" apps/web/database/migrations/0000_00_00_000018_create_pos_shift_opening_foundation.php
          grep -Fq "['tenant_id', 'outlet_id', 'device_id', 'active_slot']" apps/web/database/migrations/0000_00_00_000018_create_pos_shift_opening_foundation.php

      - name: Validate active-shift transaction guard
        shell: bash
        run: |
          set -euo pipefail
          repository='apps/web/app/Infrastructure/Pos/LaravelDurablePosSaleRepository.php'
          grep -Fq "table('oneqay_pos_shifts')" "$repository"
          grep -Fq "where('tenant_id', \$context->tenantId())" "$repository"
          grep -Fq "where('outlet_id', \$context->outletId())" "$repository"
          grep -Fq "where('device_id', \$context->deviceId())" "$repository"
          grep -Fq "where('active_slot', 1)" "$repository"
          grep -Fq -- '->lockForUpdate()' "$repository"
          grep -Fq 'if ($activeShift === null)' "$repository"

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find apps/web/app apps/web/database/migrations apps/web/routes apps/web/tests -type f -name '*.php' -print0 |
            while IFS= read -r -d '' file; do php -l "$file"; done

      - name: Install locked dependencies
        working-directory: apps/web
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Reject High or Critical Composer advisories
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          composer audit --locked --format=json > /tmp/oneqay-composer-audit.json
          php -r '
            $data = json_decode(file_get_contents("/tmp/oneqay-composer-audit.json"), true, 512, JSON_THROW_ON_ERROR);
            foreach (($data["advisories"] ?? []) as $items) {
                foreach ($items as $item) {
                    if (in_array(strtolower((string) ($item["severity"] ?? "")), ["high", "critical"], true)) {
                        fwrite(STDERR, "Blocking Composer advisory.\n");
                        exit(1);
                    }
                }
            }
          '

      - name: Run Sprint49 active-shift sale regression
        working-directory: apps/web
        run: php tests/pos-sale-completion-active-shift.php

      - name: Preserve Sprint48 JRN-005 durable shift regression
        working-directory: apps/web
        run: php tests/pos-shift-opening-durable.php

      - name: Preserve Sprint47 JRN-004 durable catalog regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          migration18='database/migrations/0000_00_00_000018_create_pos_shift_opening_foundation.php'
          backup='/tmp/oneqay-s49-migration18.php'
          cp "$migration18" "$backup"
          restore() { [[ ! -f "$backup" ]] || mv "$backup" "$migration18"; }
          trap restore EXIT
          rm -f "$migration18"
          php tests/pos-catalog-preparation-durable.php
          restore
          trap - EXIT

      - name: Preserve historical Sprint46 JRN-006 durable sale regression
        if: github.event_name == 'pull_request'
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          repository='app/Infrastructure/Pos/LaravelDurablePosSaleRepository.php'
          migration17='database/migrations/0000_00_00_000017_create_pos_catalog_preparation_journal.php'
          migration18='database/migrations/0000_00_00_000018_create_pos_shift_opening_foundation.php'
          repository_backup='/tmp/oneqay-s49-sale-repository.php'
          migration17_backup='/tmp/oneqay-s49-migration17.php'
          migration18_backup='/tmp/oneqay-s49-migration18.php'
          cp "$repository" "$repository_backup"
          cp "$migration17" "$migration17_backup"
          cp "$migration18" "$migration18_backup"
          restore() {
            [[ ! -f "$repository_backup" ]] || mv "$repository_backup" "$repository"
            [[ ! -f "$migration17_backup" ]] || mv "$migration17_backup" "$migration17"
            [[ ! -f "$migration18_backup" ]] || mv "$migration18_backup" "$migration18"
          }
          trap restore EXIT
          git show "$base:apps/web/$repository" > "$repository"
          rm -f "$migration17" "$migration18"
          php tests/pos-sale-completion-durable.php
          restore
          trap - EXIT

      - name: Preserve M7.4 synthetic POS regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          successor='app/Infrastructure/Pos/LaravelShiftOpeningRepository.php'
          backup='/tmp/oneqay-s49-shift-opening-repository.php'
          cp "$successor" "$backup"
          restore() { [[ ! -f "$backup" ]] || mv "$backup" "$successor"; }
          trap restore EXIT
          rm -f "$successor"
          php tests/pos-core-synthetic.php
          restore
          trap - EXIT

      - name: Preserve tracked source cleanliness
        run: git diff --exit-code
