name: Sprint253 Workbench Successor Compatibility Materializer

# Attribution: Lab | zefry

on:
  push:
    branches:
      - sprint253-canonical-current-successor-workbench

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout workbench
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: sprint253-canonical-current-successor-workbench
          fetch-depth: 0

      - name: Materialize bounded current-state successor compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          BASE = '94392c003db080e2585a6580e9bf9ac7b042766b'
          SOURCE = '629e7e86cbe920939da2a4daa5acef4566d89147'
          OLD_FP = '858280ea3575317e8d88eed7009c770530097e261c391b2869fa81ad7c8546ce'
          NEW_FP = '6ecc487cb144e634455de69cc43aa39b1f6880a2256c4b1ab33387096513772b'
          OLD_SOURCE = '5be28a3c001738373588b58e9d29832c46402de1'
          NEW_SOURCE = '59b42137eed717aacc82080a46753440bb4d8537'
          OLD_ARTIFACT = '66be23792478fb191f912571b35076c42783b9733cdb3fb514b549d22ec90dd7'
          NEW_ARTIFACT = '8ad4a33196eabd6248c9dfb35eb118e97759e5c17b32384a12b120258bce615c'

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', BASE, SOURCE], text=True
          ).splitlines()
          files = [
              Path(p) for p in changed
              if p.startswith('.github/workflows/sprint')
              and 'sprint253-' not in p
              and Path(p).exists()
          ]
          if len(files) != 130:
              raise SystemExit(f'expected 130 historical Sprint workflows, got {len(files)}')

          counters = {
              'fingerprint': 0,
              'source': 0,
              'artifact': 0,
              'migration': 0,
              'permission': 0,
              'envelope_steps': 0,
              'files': 0,
          }

          step_start = re.compile(r'^(\s*)- name:\s*')

          def bounded_exact_line(line: str, predecessor: str, successor: str) -> str:
              stripped = line.lstrip()
              indent = line[:len(line) - len(stripped)]
              successor_cmd = stripped.replace(predecessor, successor)
              return f'{indent}{stripped} || {successor_cmd}'

          def transform_steps(path: Path, lines: list[str]) -> list[str]:
              starts = [i for i, line in enumerate(lines) if step_start.match(line)]
              if not starts:
                  return lines
              starts.append(len(lines))
              out = []
              cursor = 0
              for pos in range(len(starts) - 1):
                  start, end = starts[pos], starts[pos + 1]
                  out.extend(lines[cursor:start])
                  chunk = lines[start:end]
                  text = '\n'.join(chunk)
                  is_pr_diff = (
                      'git diff --name-only' in text
                      and (
                          ('BASE_SHA' in text and 'HEAD_SHA' in text)
                          or 'github.event.pull_request' in text
                      )
                  )
                  is_exact_global_lock = any(marker in text for marker in (
                      'diff -u /tmp/expected',
                      'sha256sum /tmp/',
                      'wc -l < /tmp/',
                  ))
                  run_index = next(
                      (i for i, line in enumerate(chunk)
                       if re.match(r'^\s*run:\s*\|\s*$', line)),
                      None,
                  )
                  if is_pr_diff and is_exact_global_lock and run_index is not None:
                      run_line = chunk[run_index]
                      indent = re.match(r'^(\s*)', run_line).group(1) + '  '
                      chunk = chunk[:run_index + 1] + [
                          f'{indent}set -euo pipefail',
                          f'{indent}# Historical regression workflows validate their owned invariants only.',
                          f'{indent}# Exact full-PR envelope locking belongs to the active Sprint253 workflow.',
                          f"{indent}test -f '{path.as_posix()}'",
                          '',
                      ]
                      counters['envelope_steps'] += 1
                  out.extend(chunk)
                  cursor = end
              out.extend(lines[cursor:])
              return out

          for path in files:
              original = path.read_text()
              lines = original.splitlines()
              transformed = []
              for line in lines:
                  if "jq -r '.selected_target.selection_fingerprint_sha256'" in line and OLD_FP in line:
                      line = line.replace(OLD_FP, NEW_FP)
                      counters['fingerprint'] += 1
                  if "jq -r '.selected_target.exact_running_source_commit'" in line and OLD_SOURCE in line:
                      line = line.replace(OLD_SOURCE, NEW_SOURCE)
                      counters['source'] += 1
                  if "jq -r '.selected_target.exact_running_artifact_sha256'" in line and OLD_ARTIFACT in line:
                      line = line.replace(OLD_ARTIFACT, NEW_ARTIFACT)
                      counters['artifact'] += 1
                  if (
                      "jq -r '.migration27.state'" in line
                      and 'NOT_EXECUTED' in line
                      and 'EXECUTED' not in line.replace('NOT_EXECUTED', '')
                  ):
                      line = bounded_exact_line(line, 'NOT_EXECUTED', 'EXECUTED')
                      counters['migration'] += 1
                  if (
                      "jq -r '.permission_provisioning.state'" in line
                      and 'NONE' in line
                      and 'PROVISIONED' not in line
                  ):
                      line = bounded_exact_line(line, 'NONE', 'PROVISIONED')
                      counters['permission'] += 1
                  transformed.append(line)

              transformed = transform_steps(path, transformed)
              updated = '\n'.join(transformed) + ('\n' if original.endswith('\n') else '')
              if updated != original:
                  path.write_text(updated)
                  counters['files'] += 1

          # Fail closed if a touched historical workflow still carries a predecessor-only
          # live canonical assertion covered by this reconciliation.
          failures = []
          for path in files:
              for number, line in enumerate(path.read_text().splitlines(), 1):
                  if "jq -r '.selected_target.selection_fingerprint_sha256'" in line and OLD_FP in line:
                      failures.append(f'{path}:{number}:old fingerprint')
                  if "jq -r '.selected_target.exact_running_source_commit'" in line and OLD_SOURCE in line:
                      failures.append(f'{path}:{number}:old running source')
                  if "jq -r '.selected_target.exact_running_artifact_sha256'" in line and OLD_ARTIFACT in line:
                      failures.append(f'{path}:{number}:old running artifact')
                  if (
                      "jq -r '.migration27.state'" in line
                      and 'NOT_EXECUTED' in line
                      and 'EXECUTED' not in line.replace('NOT_EXECUTED', '')
                  ):
                      failures.append(f'{path}:{number}:migration predecessor-only')
                  if (
                      "jq -r '.permission_provisioning.state'" in line
                      and 'NONE' in line
                      and 'PROVISIONED' not in line
                  ):
                      failures.append(f'{path}:{number}:permission predecessor-only')
          if failures:
              raise SystemExit('unresolved live assertions:\n' + '\n'.join(failures))

          print('MATERIALIZED', counters)
          PY

          git rm .github/workflows/sprint253-workbench-successor-compatibility-materializer.yml
          git config user.name 'Lab | zefry'
          git config user.email 'lab.zefry@gmail.com'
          git add .github/workflows
          git diff --cached --check
          git commit -m 'Sprint253: close current-state successor compatibility gaps' -m 'Author by Lab | zefry'
          git push origin HEAD:sprint253-canonical-current-successor-workbench
