name: Sprint237 Final Shift Close Permission Successor Head Reattestation

# Attribution: Lab | zefry

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/final-shift-close-permission-provisioning.yml'
      - '.github/workflows/sprint236-final-shift-close-permission-evidence-refresh-compatibility.yml'
      - '.github/workflows/sprint237-final-shift-close-permission-successor-head-reattestation.yml'
      - 'docs/SPRINT237_FINAL_SHIFT_CLOSE_PERMISSION_SUCCESSOR_HEAD_REATTESTATION.md'
      - 'ops/final-shift-close/PERMISSION_PROVISIONING_SELECTED_TARGET_BINDING_CONTRACT.json'
      - 'ops/final-shift-close/cpanel-permission-provisioning-successor-evidence-refresh.php'
      - 'ops/final-shift-close/verify-cpanel-permission-provisioning-evidence.php'

permissions:
  contents: read

jobs:
  qualify-successor-head-reattestation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Lock Sprint237 envelope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | LC_ALL=C sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          .github/workflows/final-shift-close-permission-provisioning.yml
          .github/workflows/sprint236-final-shift-close-permission-evidence-refresh-compatibility.yml
          .github/workflows/sprint237-final-shift-close-permission-successor-head-reattestation.yml
          docs/SPRINT237_FINAL_SHIFT_CLOSE_PERMISSION_SUCCESSOR_HEAD_REATTESTATION.md
          ops/final-shift-close/PERMISSION_PROVISIONING_SELECTED_TARGET_BINDING_CONTRACT.json
          ops/final-shift-close/cpanel-permission-provisioning-successor-evidence-refresh.php
          ops/final-shift-close/verify-cpanel-permission-provisioning-evidence.php
          EOF
          diff -u /tmp/expected /tmp/actual

      - name: Preserve runtime and state
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --exit-code "$BASE_SHA" "$HEAD_SHA" --             ops/final-shift-close/STATE.json             ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json             apps/web/app apps/web/config apps/web/database/migrations apps/web/routes

      - name: Qualify successor verifier
        shell: bash
        run: |
          set -euo pipefail
          php -l ops/final-shift-close/verify-cpanel-permission-provisioning-evidence.php
          php -l ops/final-shift-close/cpanel-permission-provisioning-successor-evidence-refresh.php
          grep -Fq 'CPANEL_LOCAL_PERMISSION_PROVISIONING_SUCCESSOR_REATTESTATION' ops/final-shift-close/verify-cpanel-permission-provisioning-evidence.php
          grep -Fq 'MUTATION_ORIGIN_HEAD' ops/final-shift-close/verify-cpanel-permission-provisioning-evidence.php
          grep -Fq 'DATABASE_MUTATION=NONE' ops/final-shift-close/cpanel-permission-provisioning-successor-evidence-refresh.php
          grep -Fq 'Successor-head lineage and exact state blob qualified.' .github/workflows/final-shift-close-permission-provisioning.yml

      - name: Lock contract
        shell: bash
        run: |
          set -euo pipefail
          c=ops/final-shift-close/PERMISSION_PROVISIONING_SELECTED_TARGET_BINDING_CONTRACT.json
          jq -e . "$c" >/dev/null
          test "$(jq -r '.sprint237_successor_head_reattestation.origin_pr' "$c")" = '889'
          test "$(jq -r '.sprint237_successor_head_reattestation.mutation_origin_head' "$c")" = '645c845d997d2d615d7bbaa1bb66c1beb999455c'
          test "$(jq -r '.sprint237_successor_head_reattestation.permission_grant_reexecuted' "$c")" = 'false'
          test "$(jq -r '.sprint237_successor_head_reattestation.database_mutation' "$c")" = 'false'

      - name: Preserve canonical fail-closed state
        shell: bash
        run: |
          set -euo pipefail
          state=ops/final-shift-close/STATE.json
          test "$(jq -r '.migration27.state' "$state")" = 'EXECUTED'
          test "$(jq -r '.permission_provisioning.state' "$state")" = 'NONE'
          test "$(jq -r '.permission_provisioning.default_grant' "$state")" = 'NONE'
          test "$(jq -r '.feature_activation.state' "$state")" = 'INACTIVE'
          test "$(jq -r '.technical_preview_activation' "$state")" = 'NOT_AUTHORIZED'
          test "$(jq -r '.production_activation' "$state")" = 'NOT_AUTHORIZED'
          test "$(jq -r '.updater_activation' "$state")" = 'INACTIVE'
