name: Sprint162 POS Operations Hub Regression

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint162-pos-operations-hub-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  preserve-sprint162-pos-operations-hub:
    name: preserve-sprint162-pos-operations-hub
    runs-on: ubuntu-latest
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:Y2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2M=
      APP_DEBUG: "false"
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      SESSION_DRIVER: array
      CACHE_STORE: array
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve successor-compatible Sprint162 source contract
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            apps/web/app/Application/Pos/PosOperationsHubSnapshot.php \
            apps/web/app/Application/Pos/ViewPosOperationsHub.php \
            apps/web/app/Delivery/Http/Pos/PosOperationsHubController.php \
            apps/web/app/Providers/PosOperationsHubServiceProvider.php \
            apps/web/config/pos_operations_hub.php \
            apps/web/resources/js/pages/Pos/OperationsHub.vue \
            apps/web/tests/pos-operations-hub.php; do
            test -f "$path"
          done
          grep -Fq 'PosOperationsHubServiceProvider::class' apps/web/app/Providers/FinalShiftCloseServiceProvider.php
          grep -Fq "Route::get('/pos', PosOperationsHubController::class)" apps/web/app/Providers/PosOperationsHubServiceProvider.php
          grep -Fq "name('pos.operations.hub')" apps/web/app/Providers/PosOperationsHubServiceProvider.php
          grep -Fq 'ONEQAY_POS_OPERATIONS_HUB_ENABLED' apps/web/config/pos_operations_hub.php
          if [[ "${{ github.head_ref }}" == 'sprint198-pos-business-workspace-delivery-integration' ]]; then
            mapfile -t changed < <(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | LC_ALL=C sort)
            expected=(
              ".github/workflows/m7-2-tenant-isolation-regression.yml"
              ".github/workflows/m7-3-identity-org-context-regression.yml"
              ".github/workflows/m7-4a-technical-preview-interaction-regression.yml"
              ".github/workflows/m7-5-preview-db-qualification-regression.yml"
              ".github/workflows/m7-5-preview-release-artifact.yml"
              ".github/workflows/sprint126-final-shift-close-runtime-binding-manifest-control-plane-token-hardening.yml"
              ".github/workflows/sprint162-pos-operations-hub-regression.yml"
              ".github/workflows/sprint198-pos-business-workspace-delivery-integration-regression.yml"
              ".github/workflows/sprint21-role-permission-policy-regression.yml"
              ".github/workflows/sprint22-policy-administration-regression.yml"
              ".github/workflows/sprint23-initial-tenant-admin-provisioning-regression.yml"
              ".github/workflows/sprint24-protected-control-admin-lifecycle-regression.yml"
              ".github/workflows/sprint25-policy-administration-delivery-regression.yml"
              ".github/workflows/sprint26-identity-credential-verification-regression.yml"
              ".github/workflows/sprint27-first-party-session-establishment-regression.yml"
              ".github/workflows/sprint28-initial-password-enrollment-regression.yml"
              ".github/workflows/sprint29-first-control-principal-credential-bootstrap-regression.yml"
              ".github/workflows/sprint30-privileged-totp-mfa-regression.yml"
              ".github/workflows/sprint31-privileged-reauthentication-step-up-regression.yml"
              ".github/workflows/sprint32-authentication-recovery-proof-regression.yml"
              ".github/workflows/sprint33-recovery-bound-password-reset-regression.yml"
              ".github/workflows/sprint34-authenticated-password-change-regression.yml"
              "apps/web/app/Providers/PosOperationsHubServiceProvider.php"
              "apps/web/bootstrap/providers.php"
              "apps/web/tests/pos-business-workspace-delivery-integration.php"
            )
            diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${changed[@]}")
            test "$(grep -Fc 'App\Providers\PosOperationsHubServiceProvider::class' apps/web/bootstrap/providers.php)" -eq 1
          elif grep -Fq 'App\Providers\PosOperationsHubServiceProvider::class' apps/web/bootstrap/providers.php; then
            if [[ "${{ github.event_name }}" == 'pull_request' ]]; then
              git show "${{ github.event.pull_request.base.sha }}:apps/web/bootstrap/providers.php" | grep -Fq 'App\Providers\PosOperationsHubServiceProvider::class'
            fi
            test "$(grep -Fc 'App\Providers\PosOperationsHubServiceProvider::class' apps/web/bootstrap/providers.php)" -eq 1
          else
            ! grep -Fq 'PosOperationsHubServiceProvider::class' apps/web/bootstrap/providers.php
          fi

      - name: Preserve current operational NO-GO
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" =~ ^(NOT_EXECUTED|EXECUTED)$ ]]
          permission_state="$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)"; [[ "$permission_state" =~ ^(NONE|PROVISIONED)$ ]]; if [[ "$permission_state" == 'PROVISIONED' ]]; then [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" == 'EXECUTED' ]]; fi
          [[ "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" =~ ^(INACTIVE|ACTIVE)$ ]]
          [[ "$(jq -r '.deployment_authority' ops/final-shift-close/STATE.json)" == 'NOT_GRANTED' ]]
          [[ "$(jq -r '.technical_preview_activation' ops/final-shift-close/STATE.json)" == 'NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.production_activation' ops/final-shift-close/STATE.json)" == 'NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.updater_activation' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'SELECTED_NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.selected_target.environment_id' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'oneqay-durable-staging-01' ]]
          [[ "$(jq -r '.selected_target.runtime_class' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'durable-staging' ]]
          [[ "$(jq -r '.selected_target.selection_fingerprint_sha256' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == '858280ea3575317e8d88eed7009c770530097e261c391b2869fa81ad7c8546ce' ]]

      - name: Validate PHP runtime and locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          php -r 'if (PHP_VERSION_ID < 80200 || PHP_VERSION_ID >= 80600) { fwrite(STDERR, "Sprint162 requires governed PHP 8.2-8.5 compatibility.\n"); exit(1); }'
          test -f apps/web/composer.lock
          test -f apps/web/package-lock.json
          cd apps/web
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist

      - name: Execute application and POS hub regressions
        shell: bash
        run: |
          set -euo pipefail
          find apps/web/app apps/web/bootstrap apps/web/config apps/web/routes apps/web/tests \
            -type f -name '*.php' -print0 |
            while IFS= read -r -d '' file; do
              php -l "$file"
            done
          cd apps/web
          composer test
          php tests/pos-operational-reporting.php
          php tests/pos-cashier-workspace.php
          php tests/pos-shift-start-workspace.php
          php tests/pos-sale-correction-workspace.php
          php tests/pos-sale-history-workspace.php
          php tests/pos-catalog-inventory-setup-workspace.php
          php tests/pos-operations-hub.php

      - name: Setup exact Node LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.19.0

      - name: Type-check and build POS operations hub UI
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts --no-fund
          npm run type-check
          npm run build

      - name: Preserve deny-by-default route discovery semantics
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Route::has($routeName)' apps/web/app/Delivery/Http/Pos/PosOperationsHubController.php
          grep -Fq 'PosPermission::openShift()' apps/web/app/Application/Pos/ViewPosOperationsHub.php
          grep -Fq 'PosPermission::recordShiftOpeningCash()' apps/web/app/Application/Pos/ViewPosOperationsHub.php
          grep -Fq 'PosPermission::completeSale()' apps/web/app/Application/Pos/ViewPosOperationsHub.php
          grep -Fq 'pos.reporting.sales-summary.view' apps/web/app/Application/Pos/ViewPosOperationsHub.php
          grep -Fq 'PosPermission::voidSale()' apps/web/app/Application/Pos/ViewPosOperationsHub.php
          grep -Fq 'PosPermission::refundSale()' apps/web/app/Application/Pos/ViewPosOperationsHub.php
          grep -Fq 'PosPermission::prepareCatalog()' apps/web/app/Application/Pos/ViewPosOperationsHub.php
          grep -Fq 'PosPermission::inventoryBaseline()' apps/web/app/Application/Pos/ViewPosOperationsHub.php
          grep -Fq 'FinalShiftClosePermission::identifier()' apps/web/app/Application/Pos/ViewPosOperationsHub.php
          ! grep -R -n -E 'insert\(|update\(|delete\(|increment\(|decrement\(|statement\(' \
            apps/web/app/Application/Pos/PosOperationsHubSnapshot.php \
            apps/web/app/Application/Pos/ViewPosOperationsHub.php \
            apps/web/app/Delivery/Http/Pos/PosOperationsHubController.php

      - name: Verify tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
