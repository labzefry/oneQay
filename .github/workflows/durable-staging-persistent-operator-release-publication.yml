# Author by Lab | zefry
name: Durable Staging Persistent Operator Release Publication

on:
  workflow_dispatch:
    inputs:
      authority_comment_id:
        description: "Issue #856 comment granting exact persistent operator release publication authority"
        required: true
        type: string

permissions:
  actions: read
  contents: write
  issues: read

concurrency:
  group: durable-staging-persistent-operator-release-publication
  cancel-in-progress: false

jobs:
  publish-persistent-operator-release:
    name: publish-persistent-operator-release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact canonical main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Prove exact latest main source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - name: Preserve canonical operational NO-GO
        shell: bash
        run: |
          set -euo pipefail
          state=ops/final-shift-close/STATE.json
          selection=ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json
          test "$(jq -r '.migration27.state' "$state")" = NOT_EXECUTED
          test "$(jq -r '.permission_provisioning.state' "$state")" = NONE
          test "$(jq -r '.feature_activation.state' "$state")" = INACTIVE
          test "$(jq -r '.deployment_authority' "$state")" = NOT_GRANTED
          test "$(jq -r '.technical_preview_activation' "$state")" = NOT_AUTHORIZED
          test "$(jq -r '.production_activation' "$state")" = NOT_AUTHORIZED
          test "$(jq -r '.updater_activation' "$state")" = INACTIVE
          test "$(jq -r '.selection_state' "$selection")" = BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET
          test "$(jq -r '.selected_target' "$selection")" = null

      - name: Validate persistent publication contract
        shell: bash
        run: |
          set -euo pipefail
          contract=ops/final-shift-close/DURABLE_STAGING_PERSISTENT_OPERATOR_RELEASE_PUBLICATION_CONTRACT.json
          jq -e . "$contract" >/dev/null
          test "$(jq -r '.contract_state' "$contract")" = PERSISTENT_RELEASE_PUBLICATION_AVAILABLE_NOT_EXECUTED
          test "$(jq -r '.trigger_policy.workflow_dispatch_only' "$contract")" = true
          test "$(jq -r '.trigger_policy.main_branch_only' "$contract")" = true
          test "$(jq -r '.trigger_policy.automatic_push_publication_forbidden' "$contract")" = true
          test "$(jq -r '.publication_requirements.release_tag_must_not_preexist' "$contract")" = true
          test "$(jq -r '.publication_requirements.asset_overwrite_allowed // false' "$contract")" = false
          test "$(jq -r '.authority_boundary.persistent_repository_asset_publication_requires_separate_authority' "$contract")" = true
          test "$(jq -r '.authority_boundary.publication_is_not_deployment_authority' "$contract")" = true
          test "$(jq -r '.canonical_boundaries.environment_deployment' "$contract")" = NOT_PERFORMED
          test "$(jq -r '.canonical_boundaries.migration27_execution' "$contract")" = NOT_PERFORMED
          test "$(jq -r '.canonical_boundaries.selected_target' "$contract")" = null
          test "$(jq -r '.canonical_boundaries.producer_dispatch' "$contract")" = NOT_PERFORMED

      - name: Verify separate Product Owner publication authority
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHORITY_COMMENT_ID: ${{ inputs.authority_comment_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AUTHORITY_COMMENT_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$AUTHORITY_COMMENT_ID" > /tmp/authority.json
          test "$(jq -r '.issue_url' /tmp/authority.json)" = "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/856"
          association="$(jq -r '.author_association' /tmp/authority.json)"
          case "$association" in
            OWNER|MEMBER|COLLABORATOR) ;;
            *) echo "Authority author association is not accepted." >&2; exit 1 ;;
          esac
          body=/tmp/authority.body
          jq -r '.body' /tmp/authority.json > "$body"
          grep -Fxq 'PERSISTENT OPERATOR RELEASE PUBLICATION AUTHORIZATION' "$body"
          grep -Fxq "EXACT MAIN: $GITHUB_SHA" "$body"
          grep -Fxq 'APPLICATION ARTIFACT ID: 10597712890' "$body"
          grep -Fxq 'CPANEL KIT ARTIFACT ID: 10601606508' "$body"
          grep -Fxq 'RELEASE TAG: operator-handoff-e37300d5d1be-270e8e954e38' "$body"
          grep -Fxq 'PUBLICATION AUTHORITY: GRANTED' "$body"
          grep -Fxq 'DEPLOYMENT AUTHORITY: NOT_GRANTED' "$body"
          grep -Fxq 'MIGRATION #27 AUTHORITY: NOT_GRANTED' "$body"
          grep -Fxq 'PRODUCTION AUTHORITY: NOT_GRANTED' "$body"
          grep -Fxq 'TARGET SELECTION AUTHORITY: NOT_GRANTED' "$body"
          grep -Fxq 'PRODUCER DISPATCH AUTHORITY: NOT_GRANTED' "$body"

      - name: Verify source Actions artifacts and materialize exact bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          contract=ops/final-shift-close/DURABLE_STAGING_PERSISTENT_OPERATOR_RELEASE_PUBLICATION_CONTRACT.json
          app_id="$(jq -r '.application_bundle.actions_artifact_id' "$contract")"
          kit_id="$(jq -r '.cpanel_operator_kit.actions_artifact_id' "$contract")"
          mkdir -p /tmp/oneqay-persistent/app /tmp/oneqay-persistent/kit

          for pair in "app:$app_id" "kit:$kit_id"; do
            kind="${pair%%:*}"
            id="${pair##*:}"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" > "/tmp/$kind-meta.json"
            test "$(jq -r '.expired' "/tmp/$kind-meta.json")" = false
          done

          test "$(jq -r '.name' /tmp/app-meta.json)" = "$(jq -r '.application_bundle.actions_artifact_name' "$contract")"
          test "$(jq -r '.digest' /tmp/app-meta.json)" = "$(jq -r '.application_bundle.actions_artifact_digest' "$contract")"
          test "$(jq -r '.name' /tmp/kit-meta.json)" = "$(jq -r '.cpanel_operator_kit.actions_artifact_name' "$contract")"
          test "$(jq -r '.digest' /tmp/kit-meta.json)" = "$(jq -r '.cpanel_operator_kit.actions_artifact_digest' "$contract")"

          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$app_id/zip" > /tmp/app-actions.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$kit_id/zip" > /tmp/kit-actions.zip

          test "$(sha256sum /tmp/app-actions.zip | awk '{print $1}')" = "$(jq -r '.application_bundle.actions_artifact_digest' "$contract" | sed 's/^sha256://')"
          test "$(sha256sum /tmp/kit-actions.zip | awk '{print $1}')" = "$(jq -r '.cpanel_operator_kit.actions_artifact_digest' "$contract" | sed 's/^sha256://')"

          unzip -q /tmp/app-actions.zip -d /tmp/oneqay-persistent/app
          unzip -q /tmp/kit-actions.zip -d /tmp/oneqay-persistent/kit

      - name: Verify exact governed inner payloads
        shell: bash
        run: |
          set -euo pipefail
          contract=ops/final-shift-close/DURABLE_STAGING_PERSISTENT_OPERATOR_RELEASE_PUBLICATION_CONTRACT.json
          app=/tmp/oneqay-persistent/app
          kit=/tmp/oneqay-persistent/kit

          app_archive="$app/$(jq -r '.application_bundle.archive_filename' "$contract")"
          app_manifest="$app/$(jq -r '.application_bundle.manifest_filename' "$contract")"
          app_checksum="$app/$(jq -r '.application_bundle.checksum_filename' "$contract")"
          app_handoff="$app/$(jq -r '.application_bundle.handoff_filename' "$contract")"
          kit_zip="$kit/$(jq -r '.cpanel_operator_kit.zip_filename' "$contract")"
          kit_manifest="$kit/$(jq -r '.cpanel_operator_kit.manifest_filename' "$contract")"
          kit_checksum="$kit/$(jq -r '.cpanel_operator_kit.checksum_filename' "$contract")"

          test "$(sha256sum "$app_archive" | awk '{print $1}')" = "$(jq -r '.application_bundle.archive_sha256' "$contract")"
          test "$(sha256sum "$app_manifest" | awk '{print $1}')" = "$(jq -r '.application_bundle.manifest_sha256' "$contract")"
          test "$(sha256sum "$app_handoff" | awk '{print $1}')" = "$(jq -r '.application_bundle.handoff_sha256' "$contract")"
          grep -Fq "$(jq -r '.application_bundle.archive_sha256' "$contract")" "$app_checksum"
          test "$(jq -r '.handoff_state' "$app_handoff")" = VALIDATED_FOR_EXTERNAL_DEPLOYMENT_NOT_AUTHORIZED

          test "$(sha256sum "$kit_zip" | awk '{print $1}')" = "$(jq -r '.cpanel_operator_kit.zip_sha256' "$contract")"
          test "$(sha256sum "$kit_manifest" | awk '{print $1}')" = "$(jq -r '.cpanel_operator_kit.manifest_sha256' "$contract")"
          grep -Fq "$(jq -r '.cpanel_operator_kit.zip_sha256' "$contract")" "$kit_checksum"

      - name: Build persistent handoff manifest and release notes
        env:
          AUTHORITY_COMMENT_ID: ${{ inputs.authority_comment_id }}
        shell: bash
        run: |
          set -euo pipefail
          contract=ops/final-shift-close/DURABLE_STAGING_PERSISTENT_OPERATOR_RELEASE_PUBLICATION_CONTRACT.json
          jq -n             --arg repository "$GITHUB_REPOSITORY"             --arg publication_source_commit "$GITHUB_SHA"             --arg authority_comment_id "$AUTHORITY_COMMENT_ID"             --arg release_tag "$(jq -r '.persistent_release.tag' "$contract")"             --arg application_source_commit "$(jq -r '.application_bundle.source_commit' "$contract")"             --arg application_archive_sha256 "$(jq -r '.application_bundle.archive_sha256' "$contract")"             --arg cpanel_kit_source_commit "$(jq -r '.cpanel_operator_kit.source_commit' "$contract")"             --arg cpanel_kit_zip_sha256 "$(jq -r '.cpanel_operator_kit.zip_sha256' "$contract")"             '{
              schema_version: 1,
              state: "PERSISTENT_OPERATOR_HANDOFF_RELEASE_VERIFIED_NOT_DEPLOYED",
              repository: $repository,
              publication_source_commit: $publication_source_commit,
              authority_comment_id: $authority_comment_id,
              release_tag: $release_tag,
              application: {
                source_commit: $application_source_commit,
                archive_sha256: $application_archive_sha256
              },
              cpanel_operator_kit: {
                source_commit: $cpanel_kit_source_commit,
                zip_sha256: $cpanel_kit_zip_sha256
              },
              deployment_authority: "NOT_GRANTED",
              migration27_execution: "NOT_PERFORMED",
              production_activation: "NOT_AUTHORIZED",
              selected_target: null,
              producer_dispatch: "NOT_PERFORMED",
              attribution: "Lab | zefry"
            }' > /tmp/oneqay-persistent-handoff.manifest.json

          cat > /tmp/oneqay-release-notes.md <<'NOTES'
          Author by Lab | zefry

          Persistent repository retention for the exact governed Sprint211 durable-staging application bundle and Sprint214 cPanel no-SSH operator kit.

          This prerelease is an operator-retrieval surface only. It is not deployment authority, migration authority, target-selection authority, producer-dispatch authority, Technical Preview authority, Production authority, or updater authority.

          Canonical operational NO-GO remains unchanged.
          NOTES

      - name: Create draft persistent release with exact assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          contract=ops/final-shift-close/DURABLE_STAGING_PERSISTENT_OPERATOR_RELEASE_PUBLICATION_CONTRACT.json
          tag="$(jq -r '.persistent_release.tag' "$contract")"
          title="$(jq -r '.persistent_release.title' "$contract")"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release tag already exists; refusing overwrite." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Git tag already exists; refusing reuse." >&2
            exit 1
          fi

          app=/tmp/oneqay-persistent/app
          kit=/tmp/oneqay-persistent/kit
          gh release create "$tag"             --target "$GITHUB_SHA"             --title "$title"             --notes-file /tmp/oneqay-release-notes.md             --draft             --prerelease             "$app/$(jq -r '.application_bundle.archive_filename' "$contract")"             "$app/$(jq -r '.application_bundle.manifest_filename' "$contract")"             "$app/$(jq -r '.application_bundle.checksum_filename' "$contract")"             "$app/$(jq -r '.application_bundle.handoff_filename' "$contract")"             "$kit/$(jq -r '.cpanel_operator_kit.zip_filename' "$contract")"             "$kit/$(jq -r '.cpanel_operator_kit.manifest_filename' "$contract")"             "$kit/$(jq -r '.cpanel_operator_kit.checksum_filename' "$contract")"             /tmp/oneqay-persistent-handoff.manifest.json

      - name: Verify draft release metadata before publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          contract=ops/final-shift-close/DURABLE_STAGING_PERSISTENT_OPERATOR_RELEASE_PUBLICATION_CONTRACT.json
          tag="$(jq -r '.persistent_release.tag' "$contract")"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > /tmp/releases.json
          jq --arg tag "$tag" '[.[] | select(.tag_name == $tag)] | length == 1' /tmp/releases.json | grep -Fxq true
          jq --arg tag "$tag" '.[] | select(.tag_name == $tag)' /tmp/releases.json > /tmp/release.json
          test "$(jq -r '.draft' /tmp/release.json)" = true
          test "$(jq -r '.prerelease' /tmp/release.json)" = true
          test "$(jq -r '.target_commitish' /tmp/release.json)" = "$GITHUB_SHA"
          test "$(jq '.assets | length' /tmp/release.json)" -eq 8

          expected=/tmp/expected-assets.txt
          {
            jq -r '.application_bundle.archive_filename' "$contract"
            jq -r '.application_bundle.manifest_filename' "$contract"
            jq -r '.application_bundle.checksum_filename' "$contract"
            jq -r '.application_bundle.handoff_filename' "$contract"
            jq -r '.cpanel_operator_kit.zip_filename' "$contract"
            jq -r '.cpanel_operator_kit.manifest_filename' "$contract"
            jq -r '.cpanel_operator_kit.checksum_filename' "$contract"
            echo oneqay-persistent-handoff.manifest.json
          } | sort > "$expected"
          jq -r '.assets[].name' /tmp/release.json | sort > /tmp/actual-assets.txt
          diff -u "$expected" /tmp/actual-assets.txt

          while IFS= read -r name; do
            remote_size="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .size' /tmp/release.json)"
            case "$name" in
              oneqay-persistent-handoff.manifest.json) local=/tmp/oneqay-persistent-handoff.manifest.json ;;
              durable-staging-*) local="/tmp/oneqay-persistent/app/$name" ;;
              cpanel-no-ssh-*) local="/tmp/oneqay-persistent/kit/$name" ;;
              *) echo "Unexpected asset." >&2; exit 1 ;;
            esac
            test "$remote_size" = "$(stat -c%s "$local")"
          done < "$expected"

      - name: Publish verified prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_id="$(jq -r '.id' /tmp/release.json)"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id"             -F draft=false             -F prerelease=true > /tmp/published-release.json
          test "$(jq -r '.draft' /tmp/published-release.json)" = false
          test "$(jq -r '.prerelease' /tmp/published-release.json)" = true

      - name: Confirm tracked source remains unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
