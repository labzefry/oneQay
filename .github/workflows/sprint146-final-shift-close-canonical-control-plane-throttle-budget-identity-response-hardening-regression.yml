name: Sprint146 Final Shift Close Canonical Control Plane Throttle Budget Identity Response Hardening Regression

# Attribution: Lab | zefry

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sprint146-throttle-budget-identity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify-throttle-budget-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      CACHE_STORE: array
      SESSION_DRIVER: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Preserve successor-compatible historical regression boundary
        shell: bash
        run: |
          set -euo pipefail
          # Sprint146 is historical after its canonical squash merge.
          # Historical regression workflows validate their owned invariants only.
          # Exact full-PR envelope locking belongs to the active sprint workflow.
          test -f apps/web/app/Delivery/Http/Middleware/HardenFinalShiftCloseRuntimeControlPlaneThrottleResponseMiddleware.php
          test -f apps/web/tests/final-shift-close-runtime-control-plane-throttle-budget-identity-response-hardening-regression.php
          test -f docs/SPRINT146_FINAL_SHIFT_CLOSE_CANONICAL_CONTROL_PLANE_THROTTLE_BUDGET_IDENTITY_RESPONSE_HARDENING_REGRESSION.md
          test -f ops/final-shift-close/CANONICAL_RUNTIME_CONTROL_PLANE_THROTTLE_BUDGET_IDENTITY_RESPONSE_HARDENING_REGRESSION_CONTRACT.json

      - name: Preserve Sprint145 successor compatibility
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/sprint145-final-shift-close-canonical-control-plane-action-identity-throttle-response-hardening-regression.yml
          grep -Fq 'Preserve successor-compatible historical regression boundary' "$workflow"
          grep -Fq 'Sprint145 is historical after its canonical squash merge.' "$workflow"

      - name: Validate Sprint146 contract
        shell: bash
        run: |
          set -euo pipefail
          file=ops/final-shift-close/CANONICAL_RUNTIME_CONTROL_PLANE_THROTTLE_BUDGET_IDENTITY_RESPONSE_HARDENING_REGRESSION_CONTRACT.json
          jq -e '
            .schema_version == 1 and
            .feature == "final-shift-close" and
            .sprint == 146 and
            .bounded_objective == "CANONICAL_CONTROL_PLANE_THROTTLE_BUDGET_IDENTITY_RESPONSE_HARDENING_REGRESSION" and
            .qualification.ownership_signal == "ROUTE_NAME_PLUS_ACTION_PLUS_METHOD_PLUS_PATH_PLUS_EXACT_CANONICAL_THROTTLE_LIMIT" and
            .qualification.materialization_canonical_throttle_limit == "1" and
            .qualification.db_attestation_canonical_throttle_limit == "2" and
            .qualification.exact_string_throttle_limit_match_required == true and
            .qualification.materialization_cross_budget_framework_owned == true and
            .qualification.materialization_arbitrary_budget_framework_owned == true and
            .qualification.materialization_numeric_alias_budget_framework_owned == true and
            .qualification.db_get_cross_budget_framework_owned == true and
            .qualification.db_get_arbitrary_budget_framework_owned == true and
            .qualification.db_get_numeric_alias_budget_framework_owned == true and
            .qualification.db_head_cross_budget_framework_owned == true and
            .qualification.db_head_arbitrary_budget_framework_owned == true and
            .qualification.db_head_numeric_alias_budget_framework_owned == true and
            .qualification.canonical_materialization_post_hardened == true and
            .qualification.canonical_db_attestation_get_hardened == true and
            .qualification.canonical_db_attestation_head_hardened == true and
            .historical_ownership.sprint145_action_identity_throttle_response_hardening == "PRESERVED" and
            .source_envelope.path_count == 5 and
            .source_envelope.sha256 == "bbc0da27fe84ca8a1fafcf4b76bcf9e1f42e595c01d35544a94793c1a7fec161" and
            .attribution == "Author by Lab | zefry"
          ' "$file" >/dev/null

      - name: Prove bounded throttle budget identity ownership
        shell: bash
        run: |
          set -euo pipefail
          middleware=apps/web/app/Delivery/Http/Middleware/HardenFinalShiftCloseRuntimeControlPlaneThrottleResponseMiddleware.php
          grep -Fq "private const MATERIALIZATION_THROTTLE_LIMIT = '1';" "$middleware"
          grep -Fq "private const DB_ATTESTATION_THROTTLE_LIMIT = '2';" "$middleware"
          grep -Fq 'private function canonicalThrottleLimit(Request $request): ?string' "$middleware"
          grep -Fq "return self::MATERIALIZATION_THROTTLE_LIMIT;" "$middleware"
          grep -Fq "return self::DB_ATTESTATION_THROTTLE_LIMIT;" "$middleware"
          grep -Fq "\$response->headers->get('X-RateLimit-Limit') !== \$expectedThrottleLimit" "$middleware"
          ! grep -Fq "(int) \$response->headers->get('X-RateLimit-Limit')" "$middleware"

      - name: Preserve canonical route throttle budgets
        shell: bash
        run: |
          set -euo pipefail
          materialization=apps/web/app/Providers/FinalShiftCloseRuntimeBindingManifestMaterializationServiceProvider.php
          db=apps/web/app/Providers/FinalShiftCloseRuntimeDbBindingAttestationServiceProvider.php
          grep -Fq "'throttle:1,1'" "$materialization"
          grep -Fq "'throttle:2,1'" "$db"

      - name: Preserve canonical lifecycle gates
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" == 'NOT_EXECUTED' ]]
          [[ "$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)" == 'NONE' ]]
          [[ "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.deployment_authority' ops/final-shift-close/STATE.json)" == 'NOT_GRANTED' ]]
          [[ "$(jq -r '.technical_preview_activation' ops/final-shift-close/STATE.json)" == 'NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.production_activation' ops/final-shift-close/STATE.json)" == 'NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.updater_activation' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET' ]]
          [[ "$(jq -r '.selected_target' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'null' ]]

      - name: Validate PHP and dependencies
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Delivery/Http/Middleware/HardenFinalShiftCloseRuntimeControlPlaneThrottleResponseMiddleware.php
          php -l tests/final-shift-close-runtime-control-plane-throttle-budget-identity-response-hardening-regression.php
          php -l tests/final-shift-close-runtime-control-plane-action-identity-throttle-response-hardening-regression.php
          php -l tests/final-shift-close-runtime-control-plane-throttle-rejection-response-hardening-regression.php
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          composer audit --locked --no-interaction --abandoned=report

      - name: Execute Sprint146 regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-throttle-budget-identity-response-hardening-regression.php

      - name: Preserve Sprint145 regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-action-identity-throttle-response-hardening-regression.php

      - name: Preserve Sprint142 real HTTP-kernel throttle evidence
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-throttle-rejection-response-hardening-regression.php

      - name: Lock documentation boundary
        shell: bash
        run: |
          set -euo pipefail
          doc=docs/SPRINT146_FINAL_SHIFT_CLOSE_CANONICAL_CONTROL_PLANE_THROTTLE_BUDGET_IDENTITY_RESPONSE_HARDENING_REGRESSION.md
          grep -Fq '## Purpose / Why' "$doc"
          grep -Fq '## Objective / Gap' "$doc"
          grep -Fq '## What changed' "$doc"
          grep -Fq '## Evidence / Qualification' "$doc"
          grep -Fq '## Operational boundaries / NO-GO' "$doc"
          grep -Fq '## Next position' "$doc"
          grep -Fq 'bbc0da27fe84ca8a1fafcf4b76bcf9e1f42e595c01d35544a94793c1a7fec161' "$doc"
          ! grep -Eq '^[[:space:]]*workflow_dispatch[[:space:]]*:' .github/workflows/sprint146-final-shift-close-canonical-control-plane-throttle-budget-identity-response-hardening-regression.yml

      - name: Verify tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code

# Author by Lab | zefry
