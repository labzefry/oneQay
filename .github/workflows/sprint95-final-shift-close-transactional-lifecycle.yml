name: Sprint95 Final Shift Close Transactional Lifecycle

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sprint95-final-shift-close-transactional-lifecycle.yml'
      - 'apps/web/app/Application/Pos/CloseShift.php'
      - 'apps/web/app/Application/Pos/CloseShiftCommand.php'
      - 'apps/web/app/Application/Pos/CloseShiftRepository.php'
      - 'apps/web/app/Application/Pos/CloseShiftResult.php'
      - 'apps/web/app/Application/Pos/ShiftCloseClock.php'
      - 'apps/web/app/Infrastructure/Pos/LaravelCloseShiftRepository.php'
      - 'apps/web/tests/pos-final-shift-close-transactional-lifecycle.php'
      - 'docs/SPRINT95_FINAL_SHIFT_CLOSE_TRANSACTIONAL_LIFECYCLE.md'

permissions:
  contents: read

jobs:
  qualify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Enforce exact Sprint95 source envelope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | LC_ALL=C sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          .github/workflows/sprint95-final-shift-close-transactional-lifecycle.yml
          apps/web/app/Application/Pos/CloseShift.php
          apps/web/app/Application/Pos/CloseShiftCommand.php
          apps/web/app/Application/Pos/CloseShiftRepository.php
          apps/web/app/Application/Pos/CloseShiftResult.php
          apps/web/app/Application/Pos/ShiftCloseClock.php
          apps/web/app/Infrastructure/Pos/LaravelCloseShiftRepository.php
          apps/web/tests/pos-final-shift-close-transactional-lifecycle.php
          docs/SPRINT95_FINAL_SHIFT_CLOSE_TRANSACTIONAL_LIFECYCLE.md
          EOF
          diff -u /tmp/expected /tmp/actual
          test "$(sha256sum /tmp/actual | awk '{print $1}')" = '5cc591d83e40d161fb6a4cf57dd7fc1222ee750b6a3e20c9edfe50934a13ceb8'

      - name: Lock Final Shift Close authorization and input boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "public const IDENTIFIER = 'pos.shift.close';" apps/web/app/Application/Pos/FinalShiftClosePermission.php
          grep -Fq 'FinalShiftClosePermission::identifier()' apps/web/app/Application/Pos/CloseShift.php
          grep -Fq 'NO_DEFAULT_GRANT' docs/SPRINT95_FINAL_SHIFT_CLOSE_TRANSACTIONAL_LIFECYCLE.md
          grep -Fq 'private string $operationId' apps/web/app/Application/Pos/CloseShiftCommand.php
          ! grep -Eq '(shiftId|expectedCash|varianceAtomic|reviewOutcome|reviewerActor|closedAtUnix)' apps/web/app/Application/Pos/CloseShiftCommand.php

      - name: Lock transactional lifecycle semantics
        shell: bash
        run: |
          set -euo pipefail
          repo=apps/web/app/Infrastructure/Pos/LaravelCloseShiftRepository.php
          grep -Fq 'transactionLevel() < 1' "$repo"
          grep -Fq -- '->where('\''active_slot'\'', 1)' "$repo"
          grep -Fq 'LaravelExpectedCashSnapshotReader' "$repo"
          grep -Fq 'DeriveCashVariance' "$repo"
          grep -Fq 'REVIEW_ACCEPTED' "$repo"
          grep -Fq 'requireAuthorizedActors(' "$repo"
          grep -Fq -- "->update(['active_slot' => null])" "$repo"
          grep -Fq "table('oneqay_pos_shift_close_evidence')->insert" "$repo"
          grep -Fq 'return $this->replayOrFail($existing, $fingerprint);' "$repo"

      - name: Preserve migration and activation boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- apps/web/database/migrations | wc -l)" -eq 0
          test "$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- apps/web/app/Providers apps/web/routes routes | wc -l)" -eq 0
          doc=docs/SPRINT95_FINAL_SHIFT_CLOSE_TRANSACTIONAL_LIFECYCLE.md
          grep -Fq 'MIGRATION_27_LIVE_EXECUTION = NOT_AUTHORIZED' "$doc"
          grep -Fq 'TECHNICAL_PREVIEW_ACTIVATION_AUTHORITY = NOT_GRANTED' "$doc"
          grep -Fq 'PRODUCTION_AUTHORITY = NOT_GRANTED' "$doc"
          grep -Fq 'UPDATER_ACTIVATION_AUTHORITY = NOT_GRANTED' "$doc"

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l apps/web/app/Application/Pos/CloseShift.php
          php -l apps/web/app/Application/Pos/CloseShiftCommand.php
          php -l apps/web/app/Application/Pos/CloseShiftRepository.php
          php -l apps/web/app/Application/Pos/CloseShiftResult.php
          php -l apps/web/app/Application/Pos/ShiftCloseClock.php
          php -l apps/web/app/Infrastructure/Pos/LaravelCloseShiftRepository.php
          php -l apps/web/tests/pos-final-shift-close-transactional-lifecycle.php

      - name: Install PHP dependencies
        working-directory: apps/web
        shell: bash
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Reject High or Critical Composer advisories
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          composer audit --locked --format=json > /tmp/oneqay-composer-audit.json || true
          cat /tmp/oneqay-composer-audit.json
          php -r '
            $data = json_decode(file_get_contents("/tmp/oneqay-composer-audit.json"), true, 512, JSON_THROW_ON_ERROR);
            foreach (($data["advisories"] ?? []) as $package => $items) {
                foreach ($items as $item) {
                    $severity = strtolower((string) ($item["severity"] ?? ""));
                    if (in_array($severity, ["high", "critical"], true)) {
                        fwrite(STDERR, "Blocking Composer advisory for {$package}: ".($item["advisoryId"] ?? "unknown")."\n");
                        exit(1);
                    }
                }
            }
          '

      - name: Execute Sprint95 transactional lifecycle regression
        working-directory: apps/web
        shell: bash
        run: php tests/pos-final-shift-close-transactional-lifecycle.php

      - name: Preserve tracked source cleanliness
        shell: bash
        run: git diff --exit-code
