# Author by Lab | zefry
name: cPanel business experience additive successor
on:
  pull_request:
    paths: ['tools/production/cpanel/repair-legacy-business-domain.php', 'tools/production/tests/legacy-business-domain.php', 'tools/production/cpanel/update-oneqaydev-domain-root.php', 'tools/production/package-oneqaydev-domain-root.py', 'tools/production/tests/oneqaydev-domain-root.php', 'tools/production/cpanel/update-oneqaydev-workspace-successor.php', 'tools/production/package-oneqaydev-workspace-successor.py', 'tools/production/tests/oneqaydev-workspace-successor.php', 'tools/production/cpanel/business-experience-migrations.php', 'tools/production/cpanel/update-oneqaydev-business-experience.php', 'tools/production/package-oneqaydev-business-experience.py', 'tools/production/tests/oneqaydev-business-experience-operator.php', '.github/workflows/cpanel-business-experience-update.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify-business-experience-operator:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: synthetic-test-only
          MYSQL_DATABASE: oneqay_platform_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psynthetic-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, mbstring, zip
          coverage: none
      - run: composer install --working-dir=apps/web --no-interaction --prefer-dist
      - run: php tools/production/tests/oneqaydev-workspace-successor.php
      - run: python -m py_compile tools/production/package-oneqaydev-workspace-successor.py
      - run: php -l tools/production/cpanel/update-oneqaydev-domain-root.php
      - run: php tools/production/tests/oneqaydev-domain-root.php
      - run: python -m py_compile tools/production/package-oneqaydev-domain-root.py
      - run: php -l tools/production/cpanel/update-oneqaydev-business-experience.php
      - run: python -m py_compile tools/production/package-oneqaydev-business-experience.py
      - run: php tools/production/tests/oneqaydev-business-experience-operator.php
      - run: mysql --host=127.0.0.1 --user=root --password=synthetic-test-only -e 'CREATE DATABASE oneqay_operator_test;'
      - run: PLATFORM_TEST_ENGINE=mysql php tools/production/tests/oneqaydev-business-experience-operator.php
      - run: php -l tools/production/cpanel/repair-legacy-business-domain.php
      - run: php tools/production/tests/legacy-business-domain.php
      - run: PLATFORM_TEST_ENGINE=mysql php tools/production/tests/legacy-business-domain.php
