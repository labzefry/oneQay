name: Post-Sprint40 Baseline Diagnostic

# Temporary branch-local diagnostic only. Never publish to main.
# Diagnostic revision 5.
# Attribution: Lab | zefry

on:
  push:
    branches:
      - ci/post-sprint40-baseline-diagnostic

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact diagnostic branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Inspect Sprint35 workflow structure
        shell: bash
        run: |
          set -euo pipefail
          wc -c -l .github/workflows/sprint35-privileged-totp-recovery-regression.yml
          python3 - <<'PY'
          from pathlib import Path
          needle = chr(36) + '{{'
          for number, line in enumerate(Path('.github/workflows/sprint35-privileged-totp-recovery-regression.yml').read_text().splitlines(), 1):
              if needle in line:
                  print(f'{number}:{line}')
          PY
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -ignore 'SC2016|SC2251' \
            .github/workflows/sprint32-authentication-recovery-proof-regression.yml \
            .github/workflows/sprint35-privileged-totp-recovery-regression.yml \
            .github/workflows/m7-5-preview-release-artifact.yml
