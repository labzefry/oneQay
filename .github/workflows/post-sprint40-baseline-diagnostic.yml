name: Post-Sprint40 Baseline Diagnostic

# Temporary branch-local diagnostic only. Never publish to main.
# Diagnostic revision 3.
# Attribution: Lab | zefry

on:
  push:
    branches:
      - ci/post-sprint40-baseline-diagnostic

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact diagnostic branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Repair Sprint32 in diagnostic working tree and lint
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/sprint32-authentication-recovery-proof-regression.yml')
          text = p.read_text()
          broken = "-printf '%f\n' | sort)"
          fixed = "-printf '%f\\n' | sort)"
          count = text.count(broken)
          if count != 1:
              raise SystemExit(f'expected exactly one malformed Sprint32 printf, found {count}')
          p.write_text(text.replace(broken, fixed, 1))
          PY
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -ignore 'SC2016|SC2251' \
            .github/workflows/sprint32-authentication-recovery-proof-regression.yml \
            .github/workflows/sprint35-privileged-totp-recovery-regression.yml \
            .github/workflows/m7-5-preview-release-artifact.yml
          git add .github/workflows/sprint32-authentication-recovery-proof-regression.yml
          git config user.name 'labzefry'
          git config user.email 'lab.zefa@gmail.com'
          git commit -m 'ci: repair Sprint32 workflow YAML diagnostic'
          echo "FINAL_DIAGNOSTIC_COMMIT=$(git rev-parse HEAD)"
          echo "FINAL_DIAGNOSTIC_TREE=$(git rev-parse HEAD^{tree})"
          git push origin HEAD:ci/post-sprint40-baseline-diagnostic
