name: Post-Sprint40 Baseline Diagnostic

# Temporary branch-local diagnostic only. Never publish to main.
# Diagnostic revision 8.
# Attribution: Lab | zefry

on:
  push:
    branches:
      - ci/post-sprint40-baseline-diagnostic

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact diagnostic branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Build Sprint35 split-step validation candidate
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:.github/workflows/sprint35-privileged-totp-recovery-regression.yml > .github/workflows/sprint35-privileged-totp-recovery-regression.yml
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/sprint35-privileged-totp-recovery-regression.yml')
          lines = p.read_text().splitlines(True)
          start = next(i for i, line in enumerate(lines) if line == '      - name: Enforce frozen Sprint35 source envelope\n')
          event_line = next(i for i, line in enumerate(lines) if 'github.event_name' in line and line.lstrip().startswith('if [['))
          body_start = start + 3
          if lines[body_start].strip() != 'set -euo pipefail':
              raise SystemExit('unexpected Sprint35 step preamble')
          prefix_body = lines[body_start:event_line]
          suffix_body = lines[event_line:]
          replacement = [
              '      - name: Prepare frozen Sprint35 source manifests\n',
              '        shell: bash\n',
              '        run: |\n',
              *prefix_body,
              '\n',
              '      - name: Enforce frozen Sprint35 source envelope\n',
              '        shell: bash\n',
              '        run: |\n',
              '          set -euo pipefail\n',
              *suffix_body,
          ]
          p.write_text(''.join(lines[:start] + replacement))
          PY
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -ignore 'SC2016|SC2251' .github/workflows/sprint35-privileged-totp-recovery-regression.yml
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/sprint35-privileged-totp-recovery-regression.yml').read_text().splitlines(True)
          sizes=[]
          i=0
          while i < len(lines):
              line=lines[i]; stripped=line.lstrip(' '); indent=len(line)-len(stripped)
              if stripped.startswith('run: |'):
                  body=[]; j=i+1
                  while j < len(lines):
                      nxt=lines[j]
                      if nxt.strip() and len(nxt)-len(nxt.lstrip(' ')) <= indent: break
                      body.append(nxt); j+=1
                  ind=min((len(x)-len(x.lstrip(' ')) for x in body if x.strip()), default=0)
                  sizes.append(len(''.join(x[ind:] if x.strip() else '\n' for x in body)))
                  i=j
              else: i+=1
          print('effective_run_sizes=', sizes)
          if max(sizes) > 21000:
              raise SystemExit('Sprint35 candidate still exceeds GitHub run-command limit')
          PY
          git add .github/workflows/sprint35-privileged-totp-recovery-regression.yml
          git config user.name 'labzefry'
          git config user.email 'lab.zefa@gmail.com'
          git commit -m 'ci: split oversized Sprint35 workflow command'
          echo "FINAL_SPRINT35_COMMIT=$(git rev-parse HEAD)"
          echo "FINAL_SPRINT35_TREE=$(git rev-parse HEAD^{tree})"
