name: Post-Sprint40 Baseline Diagnostic

# Temporary branch-local diagnostic only. Never publish to main.
# Diagnostic revision 11.
# Attribution: Lab | zefry

on:
  push:
    branches:
      - ci/post-sprint40-baseline-diagnostic

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact diagnostic branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Build Sprint39 exact-five-path fixture correction
        shell: bash
        run: |
          set -euo pipefail
          target='.github/workflows/sprint39-first-party-session-organizational-access-revalidation-regression.yml'
          git show origin/ci/post-sprint40-historical-workflow-baseline-closure:"$target" > "$target"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/sprint39-first-party-session-organizational-access-revalidation-regression.yml')
          text = p.read_text()
          old = '''          if [[ "$(wc -l < /tmp/actual-sprint39-source-paths)" -eq 5 ]] && [[ "$(sha256sum /tmp/actual-sprint39-source-paths | awk '{print $1}')" == 'ab09e044925ae98740a49c46a70ff387e5f5445b245d3a556d85ad6a354305ec' ]]; then
            if [[ -f 'apps/web/database/migrations/0000_00_00_000014_add_first_party_authentication_eligibility_to_identities.php' ]]; then
              git update-index --assume-unchanged 'apps/web/database/migrations/0000_00_00_000014_add_first_party_authentication_eligibility_to_identities.php'
              rm -f 'apps/web/database/migrations/0000_00_00_000014_add_first_party_authentication_eligibility_to_identities.php'
              echo "Migration #14 isolated only from historical Sprint39 executable preservation."
            fi
            echo 'Recognized exact post-Sprint39 reconciliation preservation predecessor shape.'
'''
          new = '''          if [[ "$(wc -l < /tmp/actual-sprint39-source-paths)" -eq 5 ]] && [[ "$(sha256sum /tmp/actual-sprint39-source-paths | awk '{print $1}')" == 'ab09e044925ae98740a49c46a70ff387e5f5445b245d3a556d85ad6a354305ec' ]]; then
            echo 'Recognized exact post-Sprint39 reconciliation preservation predecessor shape.'
            echo 'ONEQAY_SPRINT40_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'Bounded Sprint40 fixture isolation enabled for subsequent historical Sprint39 steps.'
'''
          if old not in text:
              raise SystemExit('expected Sprint39 five-path block not found')
          p.write_text(text.replace(old, new, 1))
          PY
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -ignore 'SC2016|SC2251' "$target"
          git diff --check
          git add "$target"
          git config user.name 'labzefry'
          git config user.email 'lab.zefa@gmail.com'
          git commit -m 'ci: use bounded Sprint40 fixture isolation in Sprint39'
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          echo "FINAL_TREE=$(git rev-parse HEAD^{tree})"
          git push origin HEAD:ci/post-sprint40-historical-workflow-baseline-closure
