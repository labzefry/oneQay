name: Post-Sprint40 Baseline Diagnostic

# Temporary branch-local diagnostic only. Never publish to main.
# Diagnostic revision 14.
# Attribution: Lab | zefry

on:
  push:
    branches:
      - ci/post-sprint40-baseline-diagnostic

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact diagnostic branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Finalize Sprint39 exact-five-path fixture correction
        shell: bash
        run: |
          set -euo pipefail
          target='.github/workflows/sprint39-first-party-session-organizational-access-revalidation-regression.yml'
          git show 1c9e9f9902077bfb7e041bbb0cc2747bdcdda30a:"$target" > "$target"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/sprint39-first-party-session-organizational-access-revalidation-regression.yml')
          rows = p.read_text().splitlines(True)
          marker = 'Migration #14 isolated only from historical Sprint39 executable preservation.'
          echo_idx = next(i for i, line in enumerate(rows) if marker in line)
          start = next(i for i in range(echo_idx - 1, max(echo_idx - 5, -1), -1) if "if [[ -f 'apps/web/database/migrations/0000_00_00_000014_" in rows[i])
          end = next(i for i in range(echo_idx + 1, min(echo_idx + 4, len(rows))) if rows[i].strip() == 'fi')
          del rows[start:end + 1]
          p.write_text(''.join(rows))
          PY
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -ignore 'SC2016|SC2251' "$target"
          git diff --check
          grep -Fq "echo 'ONEQAY_SPRINT40_SOURCE_SUCCESSOR=true' >> \"\$GITHUB_ENV\"" "$target"
          test "$(grep -Fc 'Migration #14 isolated only from historical Sprint39 executable preservation.' "$target")" -eq 0
          git add "$target"
          git config user.name 'labzefry'
          git config user.email 'lab.zefa@gmail.com'
          git commit -m 'ci: finalize bounded Sprint39 fixture isolation'
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          echo "FINAL_TREE=$(git rev-parse HEAD^{tree})"
          git push origin HEAD:ci/post-sprint40-historical-workflow-baseline-closure
