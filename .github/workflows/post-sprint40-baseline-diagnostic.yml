name: Post-Sprint40 Baseline Diagnostic

# Temporary branch-local diagnostic only. Never publish to main.
# Diagnostic revision 7.
# Attribution: Lab | zefry

on:
  push:
    branches:
      - ci/post-sprint40-baseline-diagnostic

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact diagnostic branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Measure effective Sprint35 command sizes
        shell: bash
        run: |
          set -euo pipefail
          git show 8bf452e2bf5ffb63725e434c85292965decd221f:.github/workflows/sprint35-privileged-totp-recovery-regression.yml > /tmp/sprint35-post39.yml
          git show origin/main:.github/workflows/sprint35-privileged-totp-recovery-regression.yml > /tmp/sprint35-current.yml
          python3 - <<'PY'
          from pathlib import Path

          def first_run(label, path):
              lines = Path(path).read_text().splitlines(True)
              for i, line in enumerate(lines):
                  stripped = line.lstrip(' ')
                  indent = len(line) - len(stripped)
                  if stripped.startswith('run: |'):
                      body = []
                      j = i + 1
                      while j < len(lines):
                          nxt = lines[j]
                          if nxt.strip() and len(nxt) - len(nxt.lstrip(' ')) <= indent:
                              break
                          body.append(nxt)
                          j += 1
                      nonempty = [len(x) - len(x.lstrip(' ')) for x in body if x.strip()]
                      body_indent = min(nonempty) if nonempty else 0
                      effective = ''.join(x[body_indent:] if x.strip() else '\n' for x in body)
                      print(label, 'raw=', sum(len(x) for x in body), 'body_indent=', body_indent, 'effective=', len(effective), 'lines=', len(body))
                      return
              raise SystemExit(f'no run block in {path}')

          first_run('post39', '/tmp/sprint35-post39.yml')
          first_run('current', '/tmp/sprint35-current.yml')
          PY
