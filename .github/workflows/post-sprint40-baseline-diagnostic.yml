name: Post-Sprint40 Baseline Diagnostic

# Temporary branch-local diagnostic only. Never publish to main.
# Diagnostic revision 12.
# Attribution: Lab | zefry

on:
  push:
    branches:
      - ci/post-sprint40-baseline-diagnostic

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact diagnostic branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Build Sprint39 exact-five-path fixture correction
        shell: bash
        run: |
          set -euo pipefail
          target='.github/workflows/sprint39-first-party-session-organizational-access-revalidation-regression.yml'
          git show origin/ci/post-sprint40-historical-workflow-baseline-closure:"$target" > "$target"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/sprint39-first-party-session-organizational-access-revalidation-regression.yml')
          rows = p.read_text().splitlines(True)
          fp = 'ab09e044925ae98740a49c46a70ff387e5f5445b245d3a556d85ad6a354305ec'
          start = next(i for i, line in enumerate(rows) if fp in line and 'actual-sprint39-source-paths' in line)
          recognized = next(i for i in range(start + 1, min(start + 12, len(rows))) if 'Recognized exact post-Sprint39 reconciliation preservation predecessor shape.' in rows[i])
          branch_indent = rows[start][:len(rows[start]) - len(rows[start].lstrip())]
          replacement = [
              rows[start],
              branch_indent + "  echo 'Recognized exact post-Sprint39 reconciliation preservation predecessor shape.'\n",
              branch_indent + "  echo 'ONEQAY_SPRINT40_SOURCE_SUCCESSOR=true' >> \"$GITHUB_ENV\"\n",
              branch_indent + "  echo 'Bounded Sprint40 fixture isolation enabled for subsequent historical Sprint39 steps.'\n",
          ]
          rows[start:recognized + 1] = replacement
          p.write_text(''.join(rows))
          PY
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -ignore 'SC2016|SC2251' "$target"
          git diff --check
          git add "$target"
          git config user.name 'labzefry'
          git config user.email 'lab.zefa@gmail.com'
          git commit -m 'ci: use bounded Sprint40 fixture isolation in Sprint39'
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          echo "FINAL_TREE=$(git rev-parse HEAD^{tree})"
          git push origin HEAD:ci/post-sprint40-historical-workflow-baseline-closure
