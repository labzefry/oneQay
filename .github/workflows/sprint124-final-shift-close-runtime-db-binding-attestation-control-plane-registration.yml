name: Sprint124 Final Shift Close Runtime DB Binding Attestation Control Plane Registration

# Attribution: Lab | zefry

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  qualify-runtime-db-binding-attestation-control-plane-registration:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Lock exact Sprint124 successor-compatible source envelope
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$base" "$head" | LC_ALL=C sort > /tmp/paths
          cat > /tmp/expected <<'EOF'
          .github/workflows/sprint120-final-shift-close-runtime-binding-manifest-writer.yml
          .github/workflows/sprint121-final-shift-close-runtime-binding-manifest-control-channel.yml
          .github/workflows/sprint122-final-shift-close-runtime-binding-manifest-write-once-cas.yml
          .github/workflows/sprint123-final-shift-close-runtime-binding-manifest-control-plane-registration.yml
          .github/workflows/sprint124-final-shift-close-runtime-db-binding-attestation-control-plane-registration.yml
          .github/workflows/sprint125-final-shift-close-runtime-db-binding-attestation-control-plane-regression.yml
          .github/workflows/sprint126-final-shift-close-runtime-binding-manifest-control-plane-token-hardening.yml
          apps/web/app/Delivery/Http/Middleware/RequireFinalShiftCloseRuntimeBindingMaterializationTokenMiddleware.php
          apps/web/app/Providers/FinalShiftCloseRuntimeBindingManifestMaterializationServiceProvider.php
          docs/SPRINT126_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MANIFEST_CONTROL_PLANE_TOKEN_HARDENING.md
          ops/final-shift-close/RUNTIME_BINDING_MANIFEST_CONTROL_PLANE_TOKEN_HARDENING_CONTRACT.json
          EOF
          diff -u /tmp/expected /tmp/paths
          [[ "$(sha256sum /tmp/paths | awk '{print $1}')" == 'b8a450e65fed26e8114752387a34133cfdd3bfc6979a2d9e447277f949534ed0' ]]

      - name: Prove Sprint124 DB attestation source and operational state remain untouched
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --quiet "$base" "$head" -- \
            apps/web/app/Providers/FinalShiftCloseRuntimeDbBindingAttestationServiceProvider.php \
            apps/web/app/Delivery/Http/Middleware/RequireFinalShiftCloseRuntimeBindingTokenMiddleware.php \
            apps/web/config/final_shift_close_runtime_db_binding_attestation.php \
            apps/web/bootstrap/app.php \
            apps/web/bootstrap/providers.php \
            apps/web/routes \
            apps/web/database/migrations \
            ops/final-shift-close/STATE.json \
            ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json
          [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" == 'NOT_EXECUTED' ]]
          [[ "$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)" == 'NONE' ]]
          [[ "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]

      - name: Lock Sprint124 DB attestation gate
        shell: bash
        run: |
          set -euo pipefail
          provider=apps/web/app/Providers/FinalShiftCloseRuntimeDbBindingAttestationServiceProvider.php
          middleware=apps/web/app/Delivery/Http/Middleware/RequireFinalShiftCloseRuntimeBindingTokenMiddleware.php
          config=apps/web/config/final_shift_close_runtime_db_binding_attestation.php
          grep -Fq "env('ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_DB_BINDING_ATTESTATION_ENABLED', false)" "$config"
          grep -Fq "env('ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_DB_BINDING_ATTESTATION_TOKEN', '')" "$config"
          grep -Fq 'strlen($token) >= 32' "$provider"
          grep -Fq 'strlen($token) <= 512' "$provider"
          grep -Fq "'throttle:2,1'" "$provider"
          grep -Fq 'strlen($this->expectedToken) < 32' "$middleware"
          grep -Fq 'strlen($this->expectedToken) > 512' "$middleware"
          grep -Fq 'hash_equals($this->expectedToken, $matches[1])' "$middleware"
          grep -Fq "response('', 404" "$middleware"

      - name: Preserve read-only Sprint119 attestation semantics
        shell: bash
        run: |
          set -euo pipefail
          reader=apps/web/app/Infrastructure/Pos/LaravelFinalShiftCloseRuntimeDatabaseIdentityReader.php
          service=apps/web/app/Application/Pos/FinalShiftCloseRuntimeDbBindingAttestation.php
          grep -Fq 'SELECT DATABASE() AS database_name, @@hostname AS server_hostname, @@port AS server_port' "$reader"
          ! grep -Eq '(insert\(|update\(|delete\(|statement\(|unprepared\()' "$reader"
          grep -Fq 'SELECTED_NOT_AUTHORIZED' "$service"
          grep -Fq "'secrets_embedded' => false" "$service"

      - name: Validate Sprint124 historical contract
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.schema_version == 1 and .feature == "final-shift-close" and .sprint == 124 and .bounded_objective == "RUNTIME_DB_BINDING_ATTESTATION_CONTROL_PLANE_REGISTRATION_DEFAULT_OFF" and .control_plane.delivery == "INACTIVE" and .control_plane.token_min_length == 32 and .control_plane.token_max_length == 512 and .attestation_boundary.database_identity_mode == "READ_ONLY" and .canonical_boundaries.runtime_db_binding_attestation == "NOT_PERFORMED" and .canonical_boundaries.feature_activation == "INACTIVE"' ops/final-shift-close/RUNTIME_DB_BINDING_ATTESTATION_CONTROL_PLANE_REGISTRATION_CONTRACT.json >/dev/null

      - name: Preserve Sprint126 hardened manifest materialization token boundary
        shell: bash
        run: |
          set -euo pipefail
          provider=apps/web/app/Providers/FinalShiftCloseRuntimeBindingManifestMaterializationServiceProvider.php
          middleware=apps/web/app/Delivery/Http/Middleware/RequireFinalShiftCloseRuntimeBindingMaterializationTokenMiddleware.php
          grep -Fq 'strlen($token) >= 32' "$provider"
          grep -Fq 'strlen($token) <= 512' "$provider"
          grep -Fq 'strlen($this->expectedToken) < 32' "$middleware"
          grep -Fq 'strlen($this->expectedToken) > 512' "$middleware"
          grep -Fq '[A-Za-z0-9._~+\/-=]{32,512}' "$middleware"
          jq -e '.sprint == 126 and .control_plane.delivery == "INACTIVE" and .canonical_boundaries.runtime_token_provisioning == "NOT_PERFORMED" and .canonical_boundaries.runtime_manifest_materialization == "NOT_PERFORMED"' ops/final-shift-close/RUNTIME_BINDING_MANIFEST_CONTROL_PLANE_TOKEN_HARDENING_CONTRACT.json >/dev/null

      - name: Preserve Sprint125 executable DB attestation regression contract
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.sprint == 125 and .registered_route_contract.valid_bearer_request_performed == false and .canonical_boundaries.runtime_db_binding_attestation == "NOT_PERFORMED"' ops/final-shift-close/RUNTIME_DB_BINDING_ATTESTATION_CONTROL_PLANE_REGRESSION_CONTRACT.json >/dev/null

      - name: Validate PHP syntax and executable DB attestation regression
        shell: bash
        run: |
          set -euo pipefail
          find \
            apps/web/app/Providers/FinalShiftCloseRuntimeDbBindingAttestationServiceProvider.php \
            apps/web/app/Delivery/Http/Middleware/RequireFinalShiftCloseRuntimeBindingTokenMiddleware.php \
            apps/web/app/Providers/FinalShiftCloseRuntimeBindingManifestMaterializationServiceProvider.php \
            apps/web/app/Delivery/Http/Middleware/RequireFinalShiftCloseRuntimeBindingMaterializationTokenMiddleware.php \
            apps/web/app/Application/Pos/FinalShiftCloseRuntimeDbBindingAttestation.php \
            apps/web/app/Infrastructure/Pos/LaravelFinalShiftCloseRuntimeDatabaseIdentityReader.php \
            apps/web/tests/final-shift-close-runtime-db-binding-attestation.php \
            -type f -print0 | xargs -0 -n1 php -l
          cd apps/web
          composer install --no-interaction --prefer-dist --no-progress
          php tests/final-shift-close-runtime-db-binding-attestation.php

      - name: Lock no operational invocation or activation
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'SPRINT124_RUNTIME_DB_BINDING_ATTESTATION = NOT_PERFORMED' docs/SPRINT124_FINAL_SHIFT_CLOSE_RUNTIME_DB_BINDING_ATTESTATION_CONTROL_PLANE_REGISTRATION.md
          doc=docs/SPRINT126_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MANIFEST_CONTROL_PLANE_TOKEN_HARDENING.md
          grep -Fq 'SPRINT126_RUNTIME_CONFIGURATION_MUTATION = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT126_RUNTIME_TOKEN_PROVISIONING = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT126_VALID_BEARER_REQUEST = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT126_RUNTIME_MANIFEST_MATERIALIZATION = NOT_PERFORMED' "$doc"
          grep -Fq 'FEATURE_ACTIVATION = INACTIVE' "$doc"
          grep -Fq 'PRODUCTION = NO-GO' "$doc"

      - name: Verify tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "$(git status --porcelain)" ]]
