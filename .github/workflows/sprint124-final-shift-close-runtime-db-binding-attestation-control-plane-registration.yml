name: Sprint124 Final Shift Close Runtime DB Binding Attestation Control Plane Registration

# Attribution: Lab | zefry

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qualify-runtime-db-binding-attestation-control-plane-registration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Lock exact Sprint128 successor envelope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | LC_ALL=C sort > /tmp/paths
          cat > /tmp/expected <<'EOF'
          .github/workflows/sprint119-final-shift-close-runtime-db-binding-attestation.yml
          .github/workflows/sprint120-final-shift-close-runtime-binding-manifest-writer.yml
          .github/workflows/sprint121-final-shift-close-runtime-binding-manifest-control-channel.yml
          .github/workflows/sprint122-final-shift-close-runtime-binding-manifest-write-once-cas.yml
          .github/workflows/sprint123-final-shift-close-runtime-binding-manifest-control-plane-registration.yml
          .github/workflows/sprint124-final-shift-close-runtime-db-binding-attestation-control-plane-registration.yml
          .github/workflows/sprint125-final-shift-close-runtime-db-binding-attestation-control-plane-regression.yml
          .github/workflows/sprint126-final-shift-close-runtime-binding-manifest-control-plane-token-hardening.yml
          .github/workflows/sprint127-final-shift-close-runtime-binding-manifest-control-plane-regression.yml
          .github/workflows/sprint128-final-shift-close-runtime-control-plane-token-character-policy.yml
          apps/web/app/Delivery/Http/Middleware/RequireFinalShiftCloseRuntimeBindingMaterializationTokenMiddleware.php
          apps/web/app/Delivery/Http/Middleware/RequireFinalShiftCloseRuntimeBindingTokenMiddleware.php
          apps/web/app/Providers/FinalShiftCloseRuntimeBindingManifestMaterializationServiceProvider.php
          apps/web/app/Providers/FinalShiftCloseRuntimeDbBindingAttestationServiceProvider.php
          apps/web/tests/final-shift-close-runtime-control-plane-token-character-policy.php
          docs/SPRINT128_FINAL_SHIFT_CLOSE_RUNTIME_CONTROL_PLANE_TOKEN_CHARACTER_POLICY.md
          ops/final-shift-close/RUNTIME_CONTROL_PLANE_TOKEN_CHARACTER_POLICY_CONTRACT.json
          EOF
          diff -u /tmp/expected /tmp/paths
          [[ "$(sha256sum /tmp/paths | awk '{print $1}')" == 'ae8691a2c9be31ba6558145a1162cc0aaa658727ff14279c1e638b0a971dc825' ]]
      - name: Preserve read-only DB attestation and no-go state
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"; head="${{ github.event.pull_request.head.sha }}"
          git diff --quiet "$base" "$head" -- apps/web/config/final_shift_close_runtime_db_binding_attestation.php apps/web/bootstrap/app.php apps/web/routes apps/web/app/Delivery/Http/Pos/FinalShiftCloseRuntimeDbBindingAttestationController.php apps/web/app/Application/Pos/FinalShiftCloseRuntimeDbBindingAttestation.php apps/web/app/Infrastructure/Pos/LaravelFinalShiftCloseRuntimeDatabaseIdentityReader.php apps/web/database/migrations ops/final-shift-close/STATE.json ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json
          provider=apps/web/app/Providers/FinalShiftCloseRuntimeDbBindingAttestationServiceProvider.php
          middleware=apps/web/app/Delivery/Http/Middleware/RequireFinalShiftCloseRuntimeBindingTokenMiddleware.php
          reader=apps/web/app/Infrastructure/Pos/LaravelFinalShiftCloseRuntimeDatabaseIdentityReader.php
          grep -Fq '[A-Za-z0-9._~+=\/-]{32,512}' "$provider"
          grep -Fq '[A-Za-z0-9._~+=\/-]{32,512}' "$middleware"
          grep -Fq 'hash_equals($this->expectedToken, $matches[1])' "$middleware"
          grep -Fq "response('', 404" "$middleware"
          grep -Fq "'throttle:2,1'" "$provider"
          grep -Fq 'SELECT DATABASE() AS database_name, @@hostname AS server_hostname, @@port AS server_port' "$reader"
          ! grep -Eq '(insert\(|update\(|delete\(|statement\(|unprepared\()' "$reader"
          [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" == 'NOT_EXECUTED' ]]
          [[ "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]
          jq -e '.sprint == 128 and .successor_compatibility.sprint124_db_attestation_control_plane_registration == "PRESERVED_WITH_STRONGER_TOKEN_POLICY" and .source_envelope_sha256 == "ae8691a2c9be31ba6558145a1162cc0aaa658727ff14279c1e638b0a971dc825"' ops/final-shift-close/RUNTIME_CONTROL_PLANE_TOKEN_CHARACTER_POLICY_CONTRACT.json >/dev/null
      - name: Run executable DB attestation regression
        shell: bash
        run: |
          set -euo pipefail
          cd apps/web
          composer install --no-interaction --prefer-dist --no-progress
          php tests/final-shift-close-runtime-db-binding-attestation.php
      - name: Lock no operational invocation and cleanliness
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'SPRINT124_RUNTIME_DB_BINDING_ATTESTATION = NOT_PERFORMED' docs/SPRINT124_FINAL_SHIFT_CLOSE_RUNTIME_DB_BINDING_ATTESTATION_CONTROL_PLANE_REGISTRATION.md
          grep -Fq 'SPRINT128_RUNTIME_DB_BINDING_ATTESTATION = NOT_PERFORMED' docs/SPRINT128_FINAL_SHIFT_CLOSE_RUNTIME_CONTROL_PLANE_TOKEN_CHARACTER_POLICY.md
          [[ -z "$(git status --porcelain)" ]]
