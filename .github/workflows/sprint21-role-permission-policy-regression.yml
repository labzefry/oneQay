name: Sprint 21 Role Permission Policy Regression

# Attribution: Lab | zefry

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/app/Application/Authorization/**'
      - 'apps/web/app/Infrastructure/Authorization/**'
      - 'apps/web/app/Providers/AppServiceProvider.php'
      - 'apps/web/database/migrations/**'
      - 'apps/web/tests/initial-tenant-administrator-provisioning.php'
      - 'apps/web/tests/authorization-persistence.php'
      - 'apps/web/tests/authorization-administration-persistence.php'
      - 'apps/web/tests/tenant-isolation.php'
      - 'apps/web/tests/identity-org-context.php'
      - '.github/workflows/m7-2-tenant-isolation-regression.yml'
      - '.github/workflows/m7-3-identity-org-context-regression.yml'
      - '.github/workflows/m7-5-preview-db-qualification-regression.yml'
      - '.github/workflows/sprint21-role-permission-policy-regression.yml'
      - '.github/workflows/sprint22-policy-administration-regression.yml'
      - '.github/workflows/sprint23-initial-tenant-admin-provisioning-regression.yml'
      - 'docs/DURABLE_AUTHORIZATION_POLICY_ADMINISTRATION_FOUNDATION.md'
      - 'docs/INITIAL_TENANT_ADMINISTRATOR_PROVISIONING_FOUNDATION.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint21-role-permission-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sprint21-role-permission-policy-regression:
    name: sprint21-role-permission-policy-regression
    runs-on: ubuntu-latest
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      SESSION_DRIVER: array
      CACHE_STORE: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve dependencies and root regression
        run: |
          composer validate --strict --no-check-publish
          composer test
          cd apps/web
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist

      - name: Preserve Sprint 21 read-only authorization boundary
        shell: bash
        run: |
          set -euo pipefail
          find apps/web/app/Application/Authorization apps/web/app/Infrastructure/Authorization apps/web/database/migrations apps/web/tests -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do php -l "$file"; done
          mapfile -t migrations < <(find apps/web/database/migrations -maxdepth 1 -type f -name '*.php' -printf '%f\n' | sort)
          expected=('0000_00_00_000001_create_foundational_context_graph.php' '0000_00_00_000002_create_organizational_access_grants.php' '0000_00_00_000003_create_scoped_role_permission_policy.php' '0000_00_00_000004_create_policy_mutation_journal.php' '0000_00_00_000005_create_initial_tenant_administrator_provisioning_journal.php')
          test "${migrations[*]}" = "${expected[*]}"
          read_repo='apps/web/app/Infrastructure/Authorization/LaravelDurableRolePermissionRepository.php'
          grep -Fq "in_array(\$runtime, ['local', 'test', 'ci'], true)" "$read_repo"
          grep -Fq -- "->where('tenant_id'," "$read_repo"
          if grep -Eq '\b(insert|insertOrIgnore|update|updateOrInsert|upsert|delete|truncate)\s*\(' "$read_repo"; then exit 1; fi
          grep -Fq 'platform-superadmin' apps/web/app/Application/Authorization/RoleIdentifier.php
          grep -Fq "str_starts_with(\$canonical, 'platform.')" apps/web/app/Application/Authorization/PermissionIdentifier.php
          if grep -R -n -F 'platform.system-update.install' apps/web/app/Application/Authorization apps/web/app/Infrastructure/Authorization; then exit 1; fi
          grep -Fq 'fk_initial_tenant_admin_identity' apps/web/database/migrations/0000_00_00_000005_create_initial_tenant_administrator_provisioning_journal.php
          grep -Fq 'fk_initial_tenant_admin_permission' apps/web/database/migrations/0000_00_00_000005_create_initial_tenant_administrator_provisioning_journal.php

      - name: Run Sprint 21 and Sprint 23 disposable authorization regressions
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php -r 'require "vendor/autoload.php"; $app=require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Http\Kernel::class)->bootstrap(); $assert=static function(bool $c,string $m):void{if(!$c)throw new RuntimeException($m);}; require "tests/authorization-persistence.php"; require "tests/initial-tenant-administrator-provisioning.php";'

      - name: Preserve isolation and privileged updater security
        working-directory: apps/web
        run: |
          php tests/tenant-isolation.php
          php tests/identity-org-context.php
          php tests/privileged-update-security.php

      - name: Preserve Preview and Production denial
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'ONEQAY_PERSISTENCE_ENABLED=false' apps/web/environment.example
          if grep -R -n -E 'LaravelDurableRolePermissionRepository|DurableScopedAuthorizationPolicy|LaravelDurablePolicyAdministrationRepository|DurablePolicyAdministrationService|LaravelInitialTenantAdministratorProvisioningRepository|InitialTenantAdministratorProvisioningService|InitialTenantAdministratorProvisioningAuthority' apps/web/app/Application/Preview apps/web/app/Delivery/Preview 2>/dev/null; then exit 1; fi
          if grep -Fq 'InitialTenantAdministratorProvisioningAuthority::class' apps/web/app/Providers/AppServiceProvider.php; then exit 1; fi
          git diff --exit-code
