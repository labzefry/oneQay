# Author by Lab | zefry
name: Sprint219 cPanel Fixed Public Docroot Bridge Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint219-cpanel-fixed-public-docroot-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Lock exact Sprint219 envelope
        if: github.event_name == 'pull_request' && github.head_ref == 'sprint219-cpanel-fixed-public-docroot-bridge'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_PATH_HASH: 476dcc4c82fe5b1a4924a3678797e32a28b838ab84bcbab79f36ccf2c33189e4
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | LC_ALL=C sort > /tmp/s219-paths
          test "$(wc -l < /tmp/s219-paths)" -eq 18
          test "$(sha256sum /tmp/s219-paths | awk '{print $1}')" = "$EXPECTED_PATH_HASH"
          test -z "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- apps/web)"

      - name: Setup governed PHP runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: curl,pdo_mysql,phar
          coverage: none

      - name: Validate source and contracts
        shell: bash
        run: |
          set -euo pipefail
          php -l tools/cpanel/inspect-durable-staging-cpanel-no-ssh-target.php
          php -l tools/cpanel/prepare-durable-staging-cpanel-no-ssh-target-candidate.php
          php -l tools/prepare-durable-staging-deployment-authority-request.php
          php -l tools/qualify-durable-staging-deployment-authority.php
          php -l tools/prepare-durable-staging-operator-deployment-plan.php
          php -l tools/cpanel/fixed-public-document-root-bridge.php
          php -l tools/cpanel/execute-durable-staging-cpanel-no-ssh-deployment.php
          php -l tools/qualify-durable-staging-deployment-evidence.php
          bash -n tools/cpanel/build-cpanel-no-ssh-operator-qualification-kit.sh

          q=ops/final-shift-close/DURABLE_STAGING_CPANEL_NO_SSH_TARGET_QUALIFICATION_CONTRACT.json
          x=ops/final-shift-close/DURABLE_STAGING_CPANEL_NO_SSH_GUARDED_DEPLOYMENT_EXECUTION_CONTRACT.json
          k=ops/final-shift-close/DURABLE_STAGING_CPANEL_NO_SSH_OPERATOR_KIT_PUBLICATION_CONTRACT.json
          jq -e . "$q" >/dev/null
          jq -e . "$x" >/dev/null
          jq -e . "$k" >/dev/null
          jq -e '.qualification_requirements.document_root_modes == ["ACTIVE_RELEASE_PUBLIC","FIXED_PUBLIC_BRIDGE"]' "$q"
          jq -e '.qualification_requirements.presentation_identity_must_be_authority_bound == true' "$q"
          jq -e '.execution_requirements.fixed_public_bridge_supported == true' "$x"
          jq -e '.execution_requirements.authority_rechecked_before_each_pointer_mutation == true' "$x"
          jq -e '.safety.failure_after_public_bridge_mutation_restores_previous_public_surface == true' "$x"
          jq -e '.kit_contents.fixed_public_document_root_bridge == true' "$k"

      - name: Preserve canonical operational NO-GO
        shell: bash
        run: |
          set -euo pipefail
          state=ops/final-shift-close/STATE.json
          selection=ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json
          test "$(jq -r '.migration27.state' "$state")" = NOT_EXECUTED
          test "$(jq -r '.permission_provisioning.state' "$state")" = NONE
          test "$(jq -r '.feature_activation.state' "$state")" = INACTIVE
          test "$(jq -r '.deployment_authority' "$state")" = NOT_GRANTED
          test "$(jq -r '.technical_preview_activation' "$state")" = NOT_AUTHORIZED
          test "$(jq -r '.production_activation' "$state")" = NOT_AUTHORIZED
          test "$(jq -r '.updater_activation' "$state")" = INACTIVE
          test "$(jq -r '.selection_state' "$selection")" = BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET
          test "$(jq -r '.selected_target' "$selection")" = null

      - name: Build deterministic cPanel kit with fixed-public bridge
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          bash tools/cpanel/build-cpanel-no-ssh-operator-qualification-kit.sh "$head_sha"
          kit_id="cpanel-no-ssh-operator-kit-${head_sha:0:12}"
          cp "dist/${kit_id}.zip" /tmp/s219-first.zip
          cp "dist/${kit_id}.manifest.json" /tmp/s219-first.manifest.json
          cp "dist/${kit_id}.zip.sha256" /tmp/s219-first.sha256
          rm -rf dist
          bash tools/cpanel/build-cpanel-no-ssh-operator-qualification-kit.sh "$head_sha"
          cmp /tmp/s219-first.zip "dist/${kit_id}.zip"
          diff -u /tmp/s219-first.manifest.json "dist/${kit_id}.manifest.json"
          diff -u /tmp/s219-first.sha256 "dist/${kit_id}.zip.sha256"

          root="$RUNNER_TEMP/s219-kit"
          mkdir -p "$root"
          unzip -q "dist/${kit_id}.zip" -d "$root"
          kit="$root/${kit_id}"
          test -f "$kit/tools/cpanel/fixed-public-document-root-bridge.php"
          test "$(jq -r '.filesystem.document_root_mode' "$kit/target-input.template.json")" = ACTIVE_RELEASE_PUBLIC
          grep -Fq 'FIXED_PUBLIC_BRIDGE' "$kit/README.md"
          ! find "$kit" -type f -path '*/apps/web/*' -print -quit | grep -q .
          ! find "$kit" -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' \) -print -quit | grep -q .

      - name: Prepare fixed-public synthetic target and exact release
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/s219"
          deployment="$root/private/oneqay-preview"
          release_root="$deployment/releases"
          shared_root="$deployment/shared"
          active="$deployment/current"
          public_root="$root/public_html/oneqay.n07.my.id"
          previous="$release_root/durable-staging-previous0000"
          source='aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          release='durable-staging-aaaaaaaaaaaa'
          env_id='cpanel-s219-ci'
          stage="$root/archive-stage/$release"
          archive="$root/$release.tar.gz"

          mkdir -p "$release_root" "$shared_root" "$public_root/build" "$previous/apps/web/public"
          mkdir -p "$stage/apps/web/public/build" "$stage/apps/web/vendor" "$stage/apps/web/bootstrap" "$stage/apps/web/database/migrations"

          cat > "$public_root/.htaccess" <<'EOF'
          <IfModule mod_rewrite.c>
          RewriteEngine On
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteRule ^ index.php [L]
          </IfModule>
          EOF
          printf '<?php echo "old-public";\n' > "$public_root/index.php"
          printf '{"release":"old"}\n' > "$public_root/build/manifest.json"
          old_index_sha="$(sha256sum "$public_root/index.php" | awk '{print $1}')"
          old_build_sha="$(sha256sum "$public_root/build/manifest.json" | awk '{print $1}')"
          htaccess_sha="$(sha256sum "$public_root/.htaccess" | awk '{print $1}')"

          printf '<?php echo "private-candidate";\n' > "$stage/apps/web/public/index.php"
          cp apps/web/public/.htaccess "$stage/apps/web/public/.htaccess"
          printf '{"release":"candidate"}\n' > "$stage/apps/web/public/build/manifest.json"
          printf '<?php\n' > "$stage/apps/web/vendor/autoload.php"
          printf '<?php\n' > "$stage/apps/web/bootstrap/app.php"
          for i in $(seq -w 1 26); do printf '<?php\n' > "$stage/apps/web/database/migrations/fixture_${i}.php"; done
          printf '<?php\n' > "$stage/apps/web/database/migrations/0000_00_00_000027_create_pos_shift_close_evidence_foundation.php"

          cat > "$stage/RELEASE.json" <<EOF
          {"payload_metadata_version":1,"product":"oneQay","release_id":"$release","environment":"DURABLE_STAGING","required_runtime_class":"durable-staging","production":false,"synthetic_fixture_runtime":false,"production_data_allowed":false,"source_commit":"$source","migration_source_included":true,"migration_count":27,"latest_migration":"0000_00_00_000027_create_pos_shift_close_evidence_foundation.php","migration_execution_state":"NOT_EXECUTED_BY_ARTIFACT_BUILD","migration_execution_authorized":false,"deployment_authority":"NOT_GRANTED","environment_deployment":"NOT_PERFORMED","feature_activation":"INACTIVE","technical_preview_activation":"NOT_AUTHORIZED","production_activation":"NOT_AUTHORIZED","updater_activation":"INACTIVE","target_selection":"BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET","selected_target":null,"producer_dispatch":"NOT_PERFORMED","attribution":"Lab | zefry"}
          EOF

          tar --sort=name --mtime='@1' --owner=0 --group=0 --numeric-owner -C "$root/archive-stage" -cf - "$release" | gzip -n > "$archive"
          artifact_sha="$(sha256sum "$archive" | awk '{print $1}')"
          artifact_size="$(wc -c < "$archive" | tr -d '[:space:]')"

          token='sprint219-private-attestation-token-0123456789abcdef'
          cat > "$shared_root/private-bindings.json" <<EOF
          {"ONEQAY_RUNTIME_CLASS":"durable-staging","ONEQAY_RUNNING_SOURCE_COMMIT":"$source","ONEQAY_RUNNING_ARTIFACT_SHA256":"$artifact_sha","ONEQAY_DURABLE_RUNTIME_ENVIRONMENT_ID":"$env_id","ONEQAY_DURABLE_RUNTIME_ATTESTATION_TOKEN":"$token","ONEQAY_DURABLE_STAGING_RUNTIME_ENABLED":"true"}
          EOF
          chmod 0600 "$shared_root/private-bindings.json"

          cat > "$shared_root/runtime.env" <<EOF
          APP_NAME=oneQay
          APP_ENV=staging
          APP_DEBUG=false
          ONEQAY_RUNTIME_CLASS=durable-staging
          ONEQAY_RUNNING_SOURCE_COMMIT=$source
          ONEQAY_RUNNING_ARTIFACT_SHA256=$artifact_sha
          ONEQAY_DURABLE_RUNTIME_ENVIRONMENT_ID=$env_id
          ONEQAY_DURABLE_STAGING_RUNTIME_ENABLED=true
          EOF
          chmod 0600 "$shared_root/runtime.env"

          cat > "$root/target-input.json" <<EOF
          {"schema_version":1,"target_class":"CPANEL_NO_SSH","execution_channel":"CPANEL_CRON_PHP_CLI_NO_SSH","environment_id":"$env_id","runtime_class":"durable-staging","production":false,"production_data_allowed":false,"synthetic_fixture_runtime":false,"release_binding":{"source_commit":"$source","artifact_sha256":"$artifact_sha"},"filesystem":{"deployment_root":"$deployment","release_root":"$release_root","shared_runtime_root":"$shared_root","active_release_pointer":"$active","document_root":"$public_root","document_root_mode":"FIXED_PUBLIC_BRIDGE"},"operator_assertions":{"durable_database_persistence":true,"durable_session":true,"authorization":true,"transaction_durability":true,"pos_durability":true,"authenticated_configuration_channel":true,"read_before_write":true,"read_after_write":true,"non_mutating_health_attestation":true,"verified_rollback":true},"attribution":"Lab | zefry"}
          EOF

          mkdir -p "$previous/apps/web/public"
          ln -s "$previous" "$active"

          cat > "$root/handoff.json" <<EOF
          {"schema_version":1,"handoff_state":"VALIDATED_FOR_EXTERNAL_DEPLOYMENT_NOT_AUTHORIZED","product":{"name":"oneQay","repository":"labzefry/oneQay"},"artifact":{"release_id":"$release","source_commit":"$source","artifact_filename":"$release.tar.gz","artifact_sha256":"$artifact_sha","artifact_size_bytes":$artifact_size,"manifest_sha256":"eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"},"runtime":{"release_channel":"STAGING","release_environment":"DURABLE_STAGING","required_runtime_class":"durable-staging","production":false,"production_data_allowed":false,"synthetic_fixture_runtime":false,"environment_values_embedded":false},"migration":{"source_included":true,"expected_count":27,"latest_migration":"0000_00_00_000027_create_pos_shift_close_evidence_foundation.php","execution_state":"NOT_PERFORMED","execution_authorized":false},"deployment":{"execution_state":"NOT_PERFORMED","archive_extraction_state":"NOT_PERFORMED","runtime_configuration_mutation_state":"NOT_PERFORMED","active_release_pointer_mutation_state":"NOT_PERFORMED","authority_state":"NOT_GRANTED"},"required_external_bindings":["ONEQAY_RUNTIME_CLASS","ONEQAY_RUNNING_SOURCE_COMMIT","ONEQAY_RUNNING_ARTIFACT_SHA256","ONEQAY_DURABLE_RUNTIME_ENVIRONMENT_ID","ONEQAY_DURABLE_RUNTIME_ATTESTATION_TOKEN","ONEQAY_DURABLE_STAGING_RUNTIME_ENABLED"],"operational_boundary":{"environment_creation":"NOT_PERFORMED","environment_deployment":"NOT_PERFORMED","migration27_execution":"NOT_PERFORMED","permission_provisioning":"NONE","feature_activation":"INACTIVE","technical_preview_activation":"NOT_AUTHORIZED","production_activation":"NOT_AUTHORIZED","updater_activation":"INACTIVE","target_selection":"BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET","selected_target":null,"producer_dispatch":"NOT_PERFORMED"},"attribution":"Lab | zefry"}
          EOF

          {
            echo "root=$root"
            echo "deployment=$deployment"
            echo "release_root=$release_root"
            echo "shared_root=$shared_root"
            echo "active=$active"
            echo "public_root=$public_root"
            echo "previous=$previous"
            echo "source=$source"
            echo "release=$release"
            echo "environment_id=$env_id"
            echo "archive=$archive"
            echo "artifact_sha=$artifact_sha"
            echo "token=$token"
            echo "old_index_sha=$old_index_sha"
            echo "old_build_sha=$old_build_sha"
            echo "htaccess_sha=$htaccess_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Observe target and bind fixed-public presentation into candidate
        shell: bash
        env:
          ROOT: ${{ steps.fixture.outputs.root }}
          SHARED_ROOT: ${{ steps.fixture.outputs.shared_root }}
          PUBLIC_ROOT: ${{ steps.fixture.outputs.public_root }}
        run: |
          set -euo pipefail
          php tools/cpanel/inspect-durable-staging-cpanel-no-ssh-target.php             "$ROOT/target-input.json" "$SHARED_ROOT/private-bindings.json" "$ROOT/profile.json"
          test "$(jq -r '.profile_state' "$ROOT/profile.json")" = CPANEL_NO_SSH_TARGET_PROFILE_OBSERVED
          test "$(jq -r '.presentation.mode' "$ROOT/profile.json")" = FIXED_PUBLIC_BRIDGE
          test "$(jq -r '.presentation.document_root' "$ROOT/profile.json")" = "$PUBLIC_ROOT"

          php tools/cpanel/prepare-durable-staging-cpanel-no-ssh-target-candidate.php             "$ROOT/profile.json" "$ROOT/candidate.json"
          test "$(jq -r '.target_state' "$ROOT/candidate.json")" = OPERATOR_TARGET_CANDIDATE
          test "$(jq -r '.presentation.mode' "$ROOT/candidate.json")" = FIXED_PUBLIC_BRIDGE
          test "$(jq -r '.presentation.document_root' "$ROOT/candidate.json")" = "$PUBLIC_ROOT"

      - name: Prepare request, exact authority, qualified target, and deployment plan
        id: authority
        shell: bash
        env:
          ROOT: ${{ steps.fixture.outputs.root }}
          TOKEN: ${{ steps.fixture.outputs.token }}
        run: |
          set -euo pipefail
          php tools/prepare-durable-staging-deployment-authority-request.php             "$ROOT/handoff.json" "$ROOT/candidate.json" "$ROOT/request.json"

          request_id="$(jq -r '.request_id' "$ROOT/request.json")"
          request_sha="$(sha256sum "$ROOT/request.json" | awk '{print $1}')"
          target_sha="$(jq -r '.target_descriptor_sha256' "$ROOT/request.json")"
          release_id="$(jq -r '.release_id' "$ROOT/request.json")"
          source="$(jq -r '.source_commit' "$ROOT/request.json")"
          artifact_sha="$(jq -r '.artifact_sha256' "$ROOT/request.json")"
          env_id="$(jq -r '.environment_id' "$ROOT/request.json")"
          token_sha="$(printf '%s' "$TOKEN" | sha256sum | awk '{print $1}')"
          now="$(date +%s)"
          authorized="$((now-5))"
          expires="$((now+600))"

          cat > "$ROOT/authority.json" <<EOF
          {"schema_version":1,"product":"oneQay","authority_id":"durable-staging-deployment-authority-111111111111111111111111","authority_state":"GRANTED","scope":"DEPLOY_EXACT_DURABLE_STAGING_ARTIFACT_TO_EXACT_NON_PRODUCTION_TARGET","request_id":"$request_id","request_sha256":"$request_sha","release_id":"$release_id","source_commit":"$source","artifact_sha256":"$artifact_sha","environment_id":"$env_id","target_descriptor_sha256":"$target_sha","approval_token_sha256":"$token_sha","authorized_at_unix":$authorized,"expires_at_unix":$expires,"deployment_allowed":true,"migration_execution_allowed":false,"production_allowed":false,"technical_preview_activation_allowed":false,"updater_activation_allowed":false,"target_selection_allowed":false,"producer_dispatch_allowed":false,"attribution":"Lab | zefry"}
          EOF
          chmod 0600 "$ROOT/authority.json"

          printf '%s' "$TOKEN" | php tools/qualify-durable-staging-deployment-authority.php             "$ROOT/handoff.json" "$ROOT/candidate.json" "$ROOT/request.json" "$ROOT/authority.json" "$now" "$ROOT/qualified-target.json"
          test "$(jq -r '.target_state' "$ROOT/qualified-target.json")" = OPERATOR_TARGET_DECLARED
          test "$(jq -r '.presentation.mode' "$ROOT/qualified-target.json")" = FIXED_PUBLIC_BRIDGE

          php tools/prepare-durable-staging-operator-deployment-plan.php             "$ROOT/handoff.json" "$ROOT/qualified-target.json" "$ROOT/plan.json"
          test "$(jq -r '.plan_state' "$ROOT/plan.json")" = QUALIFIED_FOR_EXTERNAL_OPERATOR_EXECUTION_NOT_EXECUTED
          test "$(jq -r '.target.presentation.mode' "$ROOT/plan.json")" = FIXED_PUBLIC_BRIDGE
          test "$(jq -r '.target.presentation.document_root' "$ROOT/plan.json")" = "$(jq -r '.presentation.document_root' "$ROOT/candidate.json")"

          echo "authority_sha=$(jq -r '.deployment_authority.authority_sha256' "$ROOT/qualified-target.json")" >> "$GITHUB_OUTPUT"
          echo "plan_fingerprint=$(jq -r '.plan_fingerprint' "$ROOT/plan.json")" >> "$GITHUB_OUTPUT"

      - name: Reject presentation drift after authority request
        shell: bash
        env:
          ROOT: ${{ steps.fixture.outputs.root }}
          TOKEN: ${{ steps.fixture.outputs.token }}
        run: |
          set -euo pipefail
          jq '.presentation.document_root = "/tmp/unauthorized-public-root"' "$ROOT/candidate.json" > "$ROOT/tampered-candidate.json"
          now="$(date +%s)"
          set +e
          printf '%s' "$TOKEN" | php tools/qualify-durable-staging-deployment-authority.php             "$ROOT/handoff.json" "$ROOT/tampered-candidate.json" "$ROOT/request.json" "$ROOT/authority.json" "$now" "$ROOT/tampered-qualified.json"
          rc=$?
          set -e
          test "$rc" -ne 0
          test ! -e "$ROOT/tampered-qualified.json"

      - name: Prove post-mutation failure restores private pointer and public surface
        shell: bash
        env:
          ROOT: ${{ steps.fixture.outputs.root }}
          ARCHIVE: ${{ steps.fixture.outputs.archive }}
          SHARED_ROOT: ${{ steps.fixture.outputs.shared_root }}
          ACTIVE: ${{ steps.fixture.outputs.active }}
          PREVIOUS: ${{ steps.fixture.outputs.previous }}
          PUBLIC_ROOT: ${{ steps.fixture.outputs.public_root }}
          OLD_INDEX_SHA: ${{ steps.fixture.outputs.old_index_sha }}
          OLD_BUILD_SHA: ${{ steps.fixture.outputs.old_build_sha }}
          HTACCESS_SHA: ${{ steps.fixture.outputs.htaccess_sha }}
        run: |
          set -euo pipefail
          cat > "$ROOT/fail-exec.php" <<'PHP'
          <?php
          declare(strict_types=1);
          require getcwd().'/tools/cpanel/execute-durable-staging-cpanel-no-ssh-deployment.php';

          $root=(string)getenv('ROOT');
          $source=(string)getenv('SOURCE');
          $artifact=(string)getenv('ARTIFACT_SHA');
          $env=(string)getenv('ENV_ID');

          $bad=[
            'schema_version'=>1,
            'environment_id'=>$env,
            'runtime_class'=>'durable-staging',
            'runtime_model'=>'NON_SYNTHETIC_DURABLE_RUNTIME',
            'environment_isolation'=>'ISOLATED_NON_PRODUCTION',
            'serving_application_runtime'=>true,
            'synthetic_fixture_runtime'=>false,
            'production_traffic_served'=>false,
            'durable_persistence_enabled'=>true,
            'durable_session_control_enabled'=>true,
            'durable_authorization_enabled'=>true,
            'durable_transaction_boundary_enabled'=>true,
            'durable_pos_persistence_enabled'=>true,
            'exact_running_source_commit'=>$source,
            'exact_running_artifact_sha256'=>$artifact,
            'authenticated_configuration_mutation_channel'=>true,
            'read_before_write_read_after_supported'=>true,
            'non_mutating_health_attestation_supported'=>true,
            'verified_flag_rollback_supported'=>true,
            'activation_authority_binding'=>'SEPARATE_EXPLICIT_ACTIVATION_AUTHORITY',
            'feature_activation_state'=>'ACTIVE',
            'secrets_embedded'=>false,
          ];

          try {
              cpanelExecExecute(
                  $root.'/plan.json',
                  $root.'/profile.json',
                  (string)getenv('ARCHIVE'),
                  (string)getenv('SHARED_ROOT').'/private-bindings.json',
                  (string)getenv('SHARED_ROOT').'/runtime.env',
                  'https://fixture.invalid/readiness',
                  $root.'/failed-evidence.json',
                  static fn(string $url,string $token):array=>$bad,
              );
              exit(2);
          } catch (CpanelNoSshDeploymentExecutionException $expected) {
              if ($expected->getMessage() !== 'readiness_feature_state_invalid') exit(3);
          }
          PHP

          ROOT="$ROOT" SOURCE="${{ steps.fixture.outputs.source }}" ARTIFACT_SHA="${{ steps.fixture.outputs.artifact_sha }}" ENV_ID="${{ steps.fixture.outputs.environment_id }}"             php "$ROOT/fail-exec.php"

          test "$(realpath "$ACTIVE")" = "$(realpath "$PREVIOUS")"
          test "$(sha256sum "$PUBLIC_ROOT/index.php" | awk '{print $1}')" = "$OLD_INDEX_SHA"
          test "$(sha256sum "$PUBLIC_ROOT/build/manifest.json" | awk '{print $1}')" = "$OLD_BUILD_SHA"
          test "$(sha256sum "$PUBLIC_ROOT/.htaccess" | awk '{print $1}')" = "$HTACCESS_SHA"
          test ! -e "$ROOT/failed-evidence.json"
          test -z "$(find "$PUBLIC_ROOT" -maxdepth 1 -name '.oneqay-index-*' -o -name '.oneqay-build-*' | head -n1)"
          test -z "$(find "$SHARED_ROOT" -maxdepth 1 -name '.oneqay-public-bridge-*' | head -n1)"
          rm -rf "$ROOT/private/oneqay-preview/releases/durable-staging-aaaaaaaaaaaa"

      - name: Execute fixed-public deployment successfully
        shell: bash
        env:
          ROOT: ${{ steps.fixture.outputs.root }}
          ARCHIVE: ${{ steps.fixture.outputs.archive }}
          SHARED_ROOT: ${{ steps.fixture.outputs.shared_root }}
          ACTIVE: ${{ steps.fixture.outputs.active }}
          PUBLIC_ROOT: ${{ steps.fixture.outputs.public_root }}
          HTACCESS_SHA: ${{ steps.fixture.outputs.htaccess_sha }}
        run: |
          set -euo pipefail
          cat > "$ROOT/success-exec.php" <<'PHP'
          <?php
          declare(strict_types=1);
          require getcwd().'/tools/cpanel/execute-durable-staging-cpanel-no-ssh-deployment.php';

          $root=(string)getenv('ROOT');
          $source=(string)getenv('SOURCE');
          $artifact=(string)getenv('ARTIFACT_SHA');
          $env=(string)getenv('ENV_ID');

          $ok=[
            'schema_version'=>1,
            'environment_id'=>$env,
            'runtime_class'=>'durable-staging',
            'runtime_model'=>'NON_SYNTHETIC_DURABLE_RUNTIME',
            'environment_isolation'=>'ISOLATED_NON_PRODUCTION',
            'serving_application_runtime'=>true,
            'synthetic_fixture_runtime'=>false,
            'production_traffic_served'=>false,
            'durable_persistence_enabled'=>true,
            'durable_session_control_enabled'=>true,
            'durable_authorization_enabled'=>true,
            'durable_transaction_boundary_enabled'=>true,
            'durable_pos_persistence_enabled'=>true,
            'exact_running_source_commit'=>$source,
            'exact_running_artifact_sha256'=>$artifact,
            'authenticated_configuration_mutation_channel'=>true,
            'read_before_write_read_after_supported'=>true,
            'non_mutating_health_attestation_supported'=>true,
            'verified_flag_rollback_supported'=>true,
            'activation_authority_binding'=>'SEPARATE_EXPLICIT_ACTIVATION_AUTHORITY',
            'feature_activation_state'=>'INACTIVE',
            'secrets_embedded'=>false,
          ];

          $evidence=cpanelExecExecute(
              $root.'/plan.json',
              $root.'/profile.json',
              (string)getenv('ARCHIVE'),
              (string)getenv('SHARED_ROOT').'/private-bindings.json',
              (string)getenv('SHARED_ROOT').'/runtime.env',
              'https://fixture.invalid/readiness',
              $root.'/evidence.json',
              static fn(string $url,string $token):array=>$ok,
          );
          if (($evidence['evidence_state'] ?? null) !== 'DEPLOYED_VERIFIED_NOT_SELECTED') exit(4);
          PHP

          ROOT="$ROOT" SOURCE="${{ steps.fixture.outputs.source }}" ARTIFACT_SHA="${{ steps.fixture.outputs.artifact_sha }}" ENV_ID="${{ steps.fixture.outputs.environment_id }}"             php "$ROOT/success-exec.php"

          test "$(realpath "$ACTIVE")" = "$(realpath "$ROOT/private/oneqay-preview/releases/durable-staging-aaaaaaaaaaaa")"
          grep -Fq 'Author by Lab | zefry' "$PUBLIC_ROOT/index.php"
          grep -Fq "$ACTIVE/apps/web" "$PUBLIC_ROOT/index.php"
          test "$(jq -r '.release' "$PUBLIC_ROOT/build/manifest.json")" = candidate
          test "$(sha256sum "$PUBLIC_ROOT/.htaccess" | awk '{print $1}')" = "$HTACCESS_SHA"
          test "$(jq -r '.evidence_state' "$ROOT/evidence.json")" = DEPLOYED_VERIFIED_NOT_SELECTED
          test "$(jq -r '.verification.rollback_path_verified' "$ROOT/evidence.json")" = true
          test -z "$(find "$PUBLIC_ROOT" -maxdepth 1 -name '.oneqay-index-*' -o -name '.oneqay-build-*' | head -n1)"
          test -z "$(find "$SHARED_ROOT" -maxdepth 1 -name '.oneqay-public-bridge-*' | head -n1)"

      - name: Qualify resulting deployment evidence
        shell: bash
        env:
          ROOT: ${{ steps.fixture.outputs.root }}
          ENV_ID: ${{ steps.fixture.outputs.environment_id }}
          SOURCE: ${{ steps.fixture.outputs.source }}
          ARTIFACT_SHA: ${{ steps.fixture.outputs.artifact_sha }}
          PLAN_FINGERPRINT: ${{ steps.authority.outputs.plan_fingerprint }}
          AUTHORITY_SHA: ${{ steps.authority.outputs.authority_sha }}
        run: |
          set -euo pipefail
          php tools/qualify-durable-staging-deployment-evidence.php             "$ROOT/evidence.json" "$ENV_ID" durable-staging "$SOURCE" "$ARTIFACT_SHA" "$PLAN_FINGERPRINT" "$AUTHORITY_SHA"             > "$ROOT/evidence-qualification.json"
          test "$(jq -r '.qualification_state' "$ROOT/evidence-qualification.json")" = QUALIFIED_DEPLOYMENT_EVIDENCE_NOT_SELECTED
          test "$(jq -r '.selected_target' "$ROOT/evidence-qualification.json")" = null
          test "$(jq -r '.producer_dispatch' "$ROOT/evidence-qualification.json")" = NOT_PERFORMED

      - name: Preserve direct active-release-public mode compatibility
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'ACTIVE_RELEASE_PUBLIC' tools/cpanel/inspect-durable-staging-cpanel-no-ssh-target.php
          grep -Fq 'document_root_must_follow_active_release_public' tools/cpanel/inspect-durable-staging-cpanel-no-ssh-target.php

      - name: Prove no automatic privileged side effects
        shell: bash
        run: |
          set -euo pipefail
          for file in tools/cpanel/execute-durable-staging-cpanel-no-ssh-deployment.php tools/cpanel/fixed-public-document-root-bridge.php tools/cpanel/build-cpanel-no-ssh-operator-qualification-kit.sh; do
            ! grep -Fq 'php artisan migrate' "$file"
            ! grep -Fq 'Artisan::call' "$file"
            ! grep -E '(^|[^A-Za-z_])(exec|shell_exec|system|passthru|proc_open|popen)[[:space:]]*\(' "$file"
          done

      - name: Confirm tracked source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          git diff --exit-code
          test -z "$(git status --porcelain)"
