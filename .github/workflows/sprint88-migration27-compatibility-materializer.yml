# Sprint88 migration #27 historical compatibility exporter — Lab | zefry
# Author by Lab | zefry
name: Sprint88 Migration27 Compatibility Materializer

on:
  push:
    branches:
      - sprint88-migration27-historical-compatibility
    paths:
      - '.github/workflows/sprint88-migration27-compatibility-materializer.yml'

permissions:
  contents: write

concurrency:
  group: sprint88-migration27-compatibility-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout compatibility branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: sprint88-migration27-historical-compatibility

      - name: Generate exact 11 workflow outputs
        shell: bash
        run: |
          set -euo pipefail
          python tools/sprint88_materialize_compat.py
          test "$(find docs/_sprint88_materialized -maxdepth 1 -type f -name '*.yml' | wc -l)" -eq 11

      - name: Commit generated non-workflow outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Lab | zefry'
          git config user.email 'lab.zefry@users.noreply.github.com'
          git add docs/_sprint88_materialized
          test "$(git diff --cached --name-only | wc -l)" -eq 11
          git commit -m 'ci(sprint88): export migration #27 compatibility outputs' -m 'Author by Lab | zefry'
          git push origin HEAD:sprint88-migration27-historical-compatibility
