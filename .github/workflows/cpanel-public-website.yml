# Author by Lab | zefry
name: cPanel Public Website CMS Upgrade
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpanel-website-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: synthetic-test-only
          MYSQL_DATABASE: oneqay_website_upgrade_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psynthetic-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, dom, zlib
          tools: composer:v2
          coverage: none
      - name: Install locked dependencies
        working-directory: apps/web
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Qualify exact 31-receipt predecessor and one additive migration
        run: |
          set -euo pipefail
          php -l tools/production/cpanel/update-oneqaydev-public-website.php
          php -l tools/production/cpanel/install-oneqaydev-public-website.php
          php tools/production/tests/oneqaydev-website-operator.php | tee /tmp/website-operator.log
          grep -Fxq 'WEBSITE_OPERATOR_TOTAL=40' /tmp/website-operator.log
          php tools/production/tests/oneqaydev-website-upgrade.php | tee /tmp/website-sqlite.log
          grep -Fxq 'WEBSITE_UPGRADE_sqlite_PASS assertions=19' /tmp/website-sqlite.log
          WEBSITE_TEST_ENGINE=mysql php tools/production/tests/oneqaydev-website-upgrade.php | tee /tmp/website-mysql.log
          grep -Fxq 'WEBSITE_UPGRADE_mysql_PASS assertions=19' /tmp/website-mysql.log
