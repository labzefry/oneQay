name: Sprint 22 Policy Administration Regression

# Attribution: Lab | zefry

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/app/Application/Authorization/**'
      - 'apps/web/app/Infrastructure/Authorization/**'
      - 'apps/web/app/Providers/AppServiceProvider.php'
      - 'apps/web/database/migrations/0000_00_00_000004_create_policy_mutation_journal.php'
      - 'apps/web/tests/authorization-administration-persistence.php'
      - 'apps/web/tests/authorization-persistence.php'
      - 'apps/web/tests/tenant-isolation.php'
      - 'apps/web/tests/identity-org-context.php'
      - '.github/workflows/m7-2-tenant-isolation-regression.yml'
      - '.github/workflows/m7-3-identity-org-context-regression.yml'
      - '.github/workflows/m7-5-preview-db-qualification-regression.yml'
      - '.github/workflows/sprint21-role-permission-policy-regression.yml'
      - '.github/workflows/sprint22-policy-administration-regression.yml'
      - 'docs/DURABLE_AUTHORIZATION_POLICY_ADMINISTRATION_FOUNDATION.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint22-policy-administration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sprint22-policy-administration-regression:
    name: sprint22-policy-administration-regression
    runs-on: ubuntu-latest
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      SESSION_DRIVER: array
      CACHE_STORE: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve dependency manifests and root foundations
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Eq '(^|/)(composer\.(json|lock)|package(-lock)?\.json)$'; then exit 1; fi
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Eq '^(src/Auth/|src/Persistence/|src/Authorization/Foundation\.php)'; then exit 1; fi

      - name: Preserve root Platform Foundation regression
        run: |
          composer validate --strict --no-check-publish
          composer test

      - name: Install locked application dependencies
        working-directory: apps/web
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist

      - name: Validate Sprint 22 PHP and Application boundaries
        shell: bash
        run: |
          set -euo pipefail
          find apps/web/app/Application/Authorization apps/web/app/Infrastructure/Authorization apps/web/database/migrations/0000_00_00_000004_create_policy_mutation_journal.php apps/web/tests/authorization-administration-persistence.php -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do php -l "$file"; done
          if grep -R -n -E 'Illuminate\\|Schema::|DB::|new PDO|mysqli_' apps/web/app/Application/Authorization; then exit 1; fi
          grep -Fq 'authorization.policy.manage' apps/web/app/Application/Authorization/AdministrationPermission.php
          grep -Fq 'VerifiedOrganizationalContext' apps/web/app/Application/Authorization/DurablePolicyAdministrationService.php
          grep -Fq 'PersistenceTransaction' apps/web/app/Application/Authorization/DurablePolicyAdministrationService.php

      - name: Enforce four-migration journal and protected-control boundary
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t migrations < <(find apps/web/database/migrations -maxdepth 1 -type f -name '*.php' -printf '%f\n' | sort)
          expected=('0000_00_00_000001_create_foundational_context_graph.php' '0000_00_00_000002_create_organizational_access_grants.php' '0000_00_00_000003_create_scoped_role_permission_policy.php' '0000_00_00_000004_create_policy_mutation_journal.php')
          test "${migrations[*]}" = "${expected[*]}"
          migration='apps/web/database/migrations/0000_00_00_000004_create_policy_mutation_journal.php'
          repo='apps/web/app/Infrastructure/Authorization/LaravelDurablePolicyAdministrationRepository.php'
          read_repo='apps/web/app/Infrastructure/Authorization/LaravelDurableRolePermissionRepository.php'
          grep -Fq 'oneqay_policy_mutations' "$migration"
          grep -Fq "primary(['tenant_id', 'mutation_id']" "$migration"
          grep -Fq 'fk_policy_mutation_actor' "$migration"
          grep -Fq 'Forward-only generated migration; rollback is not authorized.' "$migration"
          grep -Fq "in_array(\$runtime, ['local', 'test', 'ci'], true)" "$repo"
          grep -Fq -- "->where('tenant_id'," "$repo"
          grep -Fq "->where('permission_id', AdministrationPermission::MANAGE)" "$repo"
          grep -Fq 'oneqay_identity_organizations' "$repo"
          grep -Fq 'oneqay_outlet_access_grants' "$repo"
          grep -Fq 'oneqay_device_access_grants' "$repo"
          if grep -Eq '\b(updateOrInsert|upsert)\s*\(' "$repo"; then exit 1; fi
          if grep -Eq '\b(insert|insertOrIgnore|update|updateOrInsert|upsert|delete|truncate)\s*\(' "$read_repo"; then exit 1; fi

      - name: Run Sprint 21 and Sprint 22 disposable policy regressions
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          composer test
          php -r 'require "vendor/autoload.php"; $app=require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Http\Kernel::class)->bootstrap(); $assert=static function(bool $c,string $m):void{if(!$c)throw new RuntimeException($m);}; require "tests/authorization-persistence.php"; require "tests/authorization-administration-persistence.php";'

      - name: Preserve isolation and privileged updater security
        working-directory: apps/web
        run: |
          php tests/tenant-isolation.php
          php tests/identity-org-context.php
          php tests/privileged-update-security.php

      - name: Preserve Preview Production and tracked-source boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'ONEQAY_PERSISTENCE_ENABLED=false' apps/web/environment.example
          if grep -R -n -E 'LaravelDurablePolicyAdministrationRepository|DurablePolicyAdministrationService' apps/web/app/Application/Preview apps/web/app/Delivery/Preview 2>/dev/null; then exit 1; fi
          git diff --exit-code
