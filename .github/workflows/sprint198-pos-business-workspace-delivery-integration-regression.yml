# Author by Lab | zefry
name: Sprint198 POS Business Workspace Delivery Integration Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint198-pos-business-workspace-delivery-integration-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify-sprint198-pos-business-workspace-delivery-integration:
    name: qualify-sprint198-pos-business-workspace-delivery-integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      APP_DEBUG: "false"
      APP_URL: http://127.0.0.1
      ONEQAY_RUNTIME_CLASS: ci
      SESSION_DRIVER: array
      CACHE_STORE: array
      LOG_CHANNEL: stderr

    steps:
      - name: Checkout exact Sprint198 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Qualify exact Sprint198 engineering envelope
        if: github.event_name == 'pull_request' && github.head_ref == 'sprint198-pos-business-workspace-delivery-integration'
        shell: bash
        env:
          EXPECTED_PATH_HASH: 4e04f75c0df2b340b0a66ad5d2fa545d364a088740e0af92861909c4848d0a45
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          mapfile -t paths < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | LC_ALL=C sort)
          expected=(
            ".github/workflows/m7-2-tenant-isolation-regression.yml"
            ".github/workflows/m7-3-identity-org-context-regression.yml"
            ".github/workflows/m7-4a-technical-preview-interaction-regression.yml"
            ".github/workflows/m7-5-preview-db-qualification-regression.yml"
            ".github/workflows/m7-5-preview-release-artifact.yml"
            ".github/workflows/sprint126-final-shift-close-runtime-binding-manifest-control-plane-token-hardening.yml"
            ".github/workflows/sprint162-pos-operations-hub-regression.yml"
            ".github/workflows/sprint198-pos-business-workspace-delivery-integration-regression.yml"
            ".github/workflows/sprint21-role-permission-policy-regression.yml"
            ".github/workflows/sprint22-policy-administration-regression.yml"
            ".github/workflows/sprint23-initial-tenant-admin-provisioning-regression.yml"
            ".github/workflows/sprint24-protected-control-admin-lifecycle-regression.yml"
            ".github/workflows/sprint25-policy-administration-delivery-regression.yml"
            ".github/workflows/sprint26-identity-credential-verification-regression.yml"
            ".github/workflows/sprint27-first-party-session-establishment-regression.yml"
            ".github/workflows/sprint28-initial-password-enrollment-regression.yml"
            ".github/workflows/sprint29-first-control-principal-credential-bootstrap-regression.yml"
            ".github/workflows/sprint30-privileged-totp-mfa-regression.yml"
            ".github/workflows/sprint31-privileged-reauthentication-step-up-regression.yml"
            ".github/workflows/sprint32-authentication-recovery-proof-regression.yml"
            ".github/workflows/sprint33-recovery-bound-password-reset-regression.yml"
            ".github/workflows/sprint34-authenticated-password-change-regression.yml"
            "apps/web/app/Providers/PosOperationsHubServiceProvider.php"
            "apps/web/bootstrap/providers.php"
            "apps/web/tests/pos-business-workspace-delivery-integration.php"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${paths[@]}")
          actual_hash="$(printf '%s\n' "${paths[@]}" | sha256sum | awk '{print $1}')"
          test "$actual_hash" = "$EXPECTED_PATH_HASH"

      - name: Preserve operational NO-GO
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" = NOT_EXECUTED
          test "$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)" = NONE
          test "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" = INACTIVE
          test "$(jq -r '.deployment_authority' ops/final-shift-close/STATE.json)" = NOT_GRANTED
          test "$(jq -r '.technical_preview_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
          test "$(jq -r '.production_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
          test "$(jq -r '.updater_activation' ops/final-shift-close/STATE.json)" = INACTIVE
          test "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET
          test "$(jq -r '.selected_target' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = null

      - name: Setup PHP 8.3 runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Validate Sprint198 source
        shell: bash
        run: |
          set -euo pipefail
          php -l apps/web/app/Providers/PosOperationsHubServiceProvider.php
          php -l apps/web/bootstrap/providers.php
          php -l apps/web/tests/pos-business-workspace-delivery-integration.php
          grep -Fq 'App\Providers\PosOperationsHubServiceProvider::class' apps/web/bootstrap/providers.php
          test "$(grep -Fc 'App\Providers\PosOperationsHubServiceProvider::class' apps/web/bootstrap/providers.php)" -eq 1
          grep -Fq 'Author by Lab | zefry' apps/web/bootstrap/providers.php
          grep -Fq 'Author by Lab | zefry' apps/web/app/Providers/PosOperationsHubServiceProvider.php
          ! grep -R -E 'ChatGPT|OpenAI|Copilot|Gemini' \
            apps/web/app/Providers/PosOperationsHubServiceProvider.php \
            apps/web/bootstrap/providers.php \
            apps/web/tests/pos-business-workspace-delivery-integration.php

      - name: Install locked application dependencies
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          composer audit --locked --abandoned=report

      - name: Preserve POS business workspace regressions
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php -d zend.assertions=1 -d assert.exception=1 tests/pos-operations-hub.php
          php -d zend.assertions=1 -d assert.exception=1 tests/pos-catalog-inventory-setup-workspace.php
          php -d zend.assertions=1 -d assert.exception=1 tests/pos-inventory-replenishment-workspace.php
          php -d zend.assertions=1 -d assert.exception=1 tests/pos-inventory-accountability-workspace.php
          php -d zend.assertions=1 -d assert.exception=1 tests/pos-shift-start-workspace.php
          php -d zend.assertions=1 -d assert.exception=1 tests/pos-cashier-workspace.php
          php -d zend.assertions=1 -d assert.exception=1 tests/pos-sale-correction-workspace.php
          php -d zend.assertions=1 -d assert.exception=1 tests/pos-sale-history-workspace.php
          php -d zend.assertions=1 -d assert.exception=1 tests/pos-active-shift-performance-workspace.php
          php -d zend.assertions=1 -d assert.exception=1 tests/pos-shift-history-performance-workspace.php
          php -d zend.assertions=1 -d assert.exception=1 tests/pos-product-sales-performance-workspace.php
          php -d zend.assertions=1 -d assert.exception=1 tests/pos-cash-variance-reconciliation-workspace.php

      - name: Execute Sprint198 delivery integration regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php -d zend.assertions=1 -d assert.exception=1 tests/pos-business-workspace-delivery-integration.php

      - name: Confirm source cleanliness
        shell: bash
        run: git diff --exit-code
