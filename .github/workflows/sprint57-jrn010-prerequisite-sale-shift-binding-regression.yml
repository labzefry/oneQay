# Sprint90 post-close mutation historical compatibility — Lab | zefry
name: Sprint57 JRN-010 Prerequisite Sale Shift Binding Regression

# Author by Lab | zefry

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sprint57-jrn010-prerequisite-sale-shift-binding-regression.yml'
      - 'apps/web/app/Infrastructure/Pos/LaravelDurablePosSaleRepository.php'
      - 'apps/web/database/migrations/0000_00_00_000024_add_immutable_shift_binding_to_pos_sales.php'
      - 'apps/web/tests/pos-sale-shift-binding-durable.php'
      - 'docs/JRN_010_PREREQUISITE_IMMUTABLE_SALE_TO_SHIFT_BINDING_SOURCE_FOUNDATION.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint57-jrn010-sale-shift-binding-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sprint57-jrn010-sale-shift-binding:
    name: sprint57-jrn010-sale-shift-binding
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:cXFxcXFxcXFxcXFxcXFxcXFxcXFxcXFxcXFxcXFxcXE=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      ONEQAY_PERSISTENCE_ENABLED: 'true'
      ONEQAY_AUTHENTICATION_SESSION_CONTROL_ENABLED: 'true'
      ONEQAY_POS_SHIFT_OPENING_ENABLED: 'true'
      ONEQAY_POS_SHIFT_OPENING_CASH_EVIDENCE_ENABLED: 'true'
      ONEQAY_POS_SHIFT_CLOSING_CASH_EVIDENCE_ENABLED: 'true'
      ONEQAY_POS_SALE_COMPLETION_ENABLED: 'true'
      ONEQAY_POS_SALE_VOID_ENABLED: 'true'
      ONEQAY_POS_SALE_CASH_REFUND_ENABLED: 'true'
      ONEQAY_POS_CATALOG_PREPARATION_ENABLED: 'true'
      ONEQAY_POS_INVENTORY_BASELINE_ENABLED: 'true'
      SESSION_DRIVER: array
      CACHE_STORE: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce exact Sprint57 source envelope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$base" "$head" | sort > /tmp/s57-source-paths
          count="$(wc -l < /tmp/s57-source-paths)"
          fingerprint="$(sha256sum /tmp/s57-source-paths | awk '{print $1}')"
          if [[ "$count" -eq 5 && "$fingerprint" == '43e53ee63fdf476b91f9dd2fa0d2d6ab32f710e0d26e144ad119f4da60a2149c' ]]; then
            for expected in \
              '.github/workflows/sprint90-post-close-sale-mutation-freeze-regression.yml' \
              'apps/web/app/Infrastructure/Pos/LaravelDurablePosSaleRepository.php' \
              'apps/web/app/Infrastructure/Pos/LaravelSaleCashRefundRepository.php' \
              'apps/web/tests/pos-post-close-sale-mutation-freeze.php' \
              'docs/SPRINT90_POST_CLOSE_SALE_MUTATION_FREEZE.md'
            do
              grep -Fxq "$expected" /tmp/s57-source-paths
            done
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations
            for repository in \
              'apps/web/app/Infrastructure/Pos/LaravelDurablePosSaleRepository.php' \
              'apps/web/app/Infrastructure/Pos/LaravelSaleCashRefundRepository.php'
            do
              git update-index --assume-unchanged "$repository"
              git show "$base:$repository" > "$repository"
            done
            for index in 25 26 27; do
              migration="$(find apps/web/database/migrations -maxdepth 1 -type f -name "$(printf '0000_00_00_%06d_*' "$index")" -print -quit)"
              if [[ -n "$migration" && -f "$migration" ]]; then
                git update-index --assume-unchanged "$migration"
                rm -f "$migration"
              fi
            done
            echo 'Recognized exact Sprint90 post-close mutation source at Sprint57 migration #24 horizon.'
          elif [[ "$count" -eq 6 && "$fingerprint" == '232e112191b5ea0fb6b7aa402443692af512bcf66101f0d235525862cb586462' ]]; then
            for expected in \
              '.github/workflows/m7-4-pos-core-synthetic-regression.yml' \
              '.github/workflows/sprint46-jrn006-durable-sale-completion-regression.yml' \
              '.github/workflows/sprint49-jrn006-active-shift-precondition-regression.yml' \
              '.github/workflows/sprint50-jrn007-completed-sale-void-regression.yml' \
              '.github/workflows/sprint52-jrn007-bounded-full-cash-refund-regression.yml' \
              '.github/workflows/sprint57-jrn010-prerequisite-sale-shift-binding-regression.yml'
            do
              grep -Fxq "$expected" /tmp/s57-source-paths
            done
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations
            for index in 25 26 27; do
              migration="$(find apps/web/database/migrations -maxdepth 1 -type f -name "$(printf '0000_00_00_%06d_*' "$index")" -print -quit)"
              if [[ -n "$migration" && -f "$migration" ]]; then
                git update-index --assume-unchanged "$migration"
                rm -f "$migration"
              fi
            done
            echo 'Recognized exact Sprint90 six-workflow compatibility self-qualification at Sprint57 migration #24 horizon.'
          else
            test "$count" -eq 5
            test "$fingerprint" = '26d2d48f114c88d60dc302dccd8d41118bc730c309c9d79b71f5e516731a0b25'
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s57-source-paths)" -eq 1
            grep -Fxq '.github/workflows/sprint57-jrn010-prerequisite-sale-shift-binding-regression.yml' /tmp/s57-source-paths
            grep -Fxq 'apps/web/app/Infrastructure/Pos/LaravelDurablePosSaleRepository.php' /tmp/s57-source-paths
            grep -Fxq 'apps/web/database/migrations/0000_00_00_000024_add_immutable_shift_binding_to_pos_sales.php' /tmp/s57-source-paths
            grep -Fxq 'apps/web/tests/pos-sale-shift-binding-durable.php' /tmp/s57-source-paths
            grep -Fxq 'docs/JRN_010_PREREQUISITE_IMMUTABLE_SALE_TO_SHIFT_BINDING_SOURCE_FOUNDATION.md' /tmp/s57-source-paths
          fi
          ! grep -Eq '(^|/)(composer\.(json|lock)|package(-lock)?\.json|\.env(\.|$))' /tmp/s57-source-paths

      - name: Preserve migrations one through twenty-three and validate migration twenty-four
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          migration='apps/web/database/migrations/0000_00_00_000024_add_immutable_shift_binding_to_pos_sales.php'
          git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration"
          mapfile -t migrations < <(find apps/web/database/migrations -maxdepth 1 -type f -name '*.php' -printf '%f\n' | sort)
          test "${#migrations[@]}" -eq 24
          for index in $(seq 1 24); do
            prefix="$(printf '0000_00_00_%06d_' "$index")"
            test "$(printf '%s\n' "${migrations[@]}" | grep -c "^$prefix")" -eq 1
          done
          grep -Fq "Schema::table('oneqay_pos_shifts'" "$migration"
          grep -Fq "['tenant_id', 'shift_id', 'organization_id', 'outlet_id', 'device_id']" "$migration"
          grep -Fq "Schema::table('oneqay_pos_sales'" "$migration"
          grep -Fq "char('shift_id', 32)->nullable()" "$migration"
          grep -Fq "['tenant_id', 'shift_id', 'completed_at_unix']" "$migration"
          grep -Fq "'fk_pos_sales_shift_context'" "$migration"
          grep -Fq "on('oneqay_pos_shifts')" "$migration"
          grep -Fq 'restrictOnDelete()' "$migration"
          grep -Fq 'restrictOnUpdate()' "$migration"
          ! grep -Eq '(^|[^A-Za-z])(update|insert|upsert)[[:space:]]*\(' "$migration"
          grep -Fq "throw new LogicException('Forward-only generated migration; rollback is not authorized.');" "$migration"

      - name: Validate server-owned binding source locks
        shell: bash
        run: |
          set -euo pipefail
          source='apps/web/app/Infrastructure/Pos/LaravelDurablePosSaleRepository.php'
          grep -Fq "table('oneqay_pos_shifts')" "$source"
          grep -Fq "where('tenant_id', \$context->tenantId())" "$source"
          grep -Fq "where('organization_id', \$context->organizationId())" "$source"
          grep -Fq "where('outlet_id', \$context->outletId())" "$source"
          grep -Fq "where('device_id', \$context->deviceId())" "$source"
          grep -Fq "where('active_slot', 1)" "$source"
          grep -Fq 'lockForUpdate()' "$source"
          grep -Fq "'shift_id' => \$activeShift->shift_id" "$source"
          grep -Fq "! is_string(\$activeShift->shift_id)" "$source"
          grep -Fq "trim(\$activeShift->shift_id) === ''" "$source"
          awk '/if \(\$existing !== null\)/,/^            }/' "$source" > /tmp/s57-replay-block
          ! grep -Fq "table('oneqay_pos_shifts')" /tmp/s57-replay-block
          ! grep -Fq "'shift_id' =>" /tmp/s57-replay-block

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l apps/web/app/Infrastructure/Pos/LaravelDurablePosSaleRepository.php
          php -l apps/web/database/migrations/0000_00_00_000024_add_immutable_shift_binding_to_pos_sales.php
          php -l apps/web/tests/pos-sale-shift-binding-durable.php

      - name: Install locked dependencies
        working-directory: apps/web
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Reject High or Critical Composer advisories
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          composer audit --locked --format=json > /tmp/oneqay-composer-audit.json
          php -r '
            $data = json_decode(file_get_contents("/tmp/oneqay-composer-audit.json"), true, 512, JSON_THROW_ON_ERROR);
            foreach (($data["advisories"] ?? []) as $items) {
                foreach ($items as $item) {
                    if (in_array(strtolower((string) ($item["severity"] ?? "")), ["high", "critical"], true)) {
                        fwrite(STDERR, "Blocking Composer advisory.\n");
                        exit(1);
                    }
                }
            }
          '

      - name: Run Sprint57 immutable sale-to-shift binding regression
        working-directory: apps/web
        run: php tests/pos-sale-shift-binding-durable.php

      - name: Preserve Sprint49 active-shift sale regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          migrations=(
            database/migrations/0000_00_00_000019_create_pos_sale_void_foundation.php
            database/migrations/0000_00_00_000020_create_pos_inventory_baseline_foundation.php
            database/migrations/0000_00_00_000021_create_pos_sale_cash_refund_foundation.php
            database/migrations/0000_00_00_000022_create_pos_shift_opening_cash_evidence_foundation.php
            database/migrations/0000_00_00_000023_create_pos_shift_closing_cash_evidence_foundation.php
            database/migrations/0000_00_00_000024_add_immutable_shift_binding_to_pos_sales.php
          )
          backups=()
          restore() {
            for index in "${!migrations[@]}"; do
              [[ ! -f "${backups[$index]}" ]] || mv "${backups[$index]}" "${migrations[$index]}"
            done
          }
          trap restore EXIT
          for index in "${!migrations[@]}"; do
            backup="/tmp/oneqay-s57-active-$index.php"
            cp "${migrations[$index]}" "$backup"
            backups+=("$backup")
            rm -f "${migrations[$index]}"
          done
          php tests/pos-sale-completion-active-shift.php
          restore
          trap - EXIT

      - name: Preserve Sprint50 full-sale void regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          migrations=(
            database/migrations/0000_00_00_000020_create_pos_inventory_baseline_foundation.php
            database/migrations/0000_00_00_000021_create_pos_sale_cash_refund_foundation.php
            database/migrations/0000_00_00_000022_create_pos_shift_opening_cash_evidence_foundation.php
            database/migrations/0000_00_00_000023_create_pos_shift_closing_cash_evidence_foundation.php
            database/migrations/0000_00_00_000024_add_immutable_shift_binding_to_pos_sales.php
          )
          backups=()
          restore() {
            for index in "${!migrations[@]}"; do
              [[ ! -f "${backups[$index]}" ]] || mv "${backups[$index]}" "${migrations[$index]}"
            done
          }
          trap restore EXIT
          for index in "${!migrations[@]}"; do
            backup="/tmp/oneqay-s57-void-$index.php"
            cp "${migrations[$index]}" "$backup"
            backups+=("$backup")
            rm -f "${migrations[$index]}"
          done
          php tests/pos-sale-void-durable.php
          restore
          trap - EXIT

      - name: Preserve Sprint52 full CASH refund regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          migrations=(
            database/migrations/0000_00_00_000022_create_pos_shift_opening_cash_evidence_foundation.php
            database/migrations/0000_00_00_000023_create_pos_shift_closing_cash_evidence_foundation.php
            database/migrations/0000_00_00_000024_add_immutable_shift_binding_to_pos_sales.php
          )
          backups=()
          restore() {
            for index in "${!migrations[@]}"; do
              [[ ! -f "${backups[$index]}" ]] || mv "${backups[$index]}" "${migrations[$index]}"
            done
          }
          trap restore EXIT
          for index in "${!migrations[@]}"; do
            backup="/tmp/oneqay-s57-refund-$index.php"
            cp "${migrations[$index]}" "$backup"
            backups+=("$backup")
            rm -f "${migrations[$index]}"
          done
          php tests/pos-sale-cash-refund-durable.php
          restore
          trap - EXIT

      - name: Assert lifecycle locks remain documentation-only
        shell: bash
        run: |
          set -euo pipefail
          doc='docs/JRN_010_PREREQUISITE_IMMUTABLE_SALE_TO_SHIFT_BINDING_SOURCE_FOUNDATION.md'
          grep -Fq 'Migration #24: **SOURCE-PUBLISHED ONLY / NOT EXECUTED / NOT APPLIED / NOT ACTIVATED**' "$doc"
          grep -Fq 'Technical Preview: **INACTIVE**' "$doc"
          grep -Fq 'Production: **NO-GO**' "$doc"
          grep -Fq 'Updater: **INACTIVE**' "$doc"
          grep -Fq 'Migration execution/application: **NOT AUTHORIZED**' "$doc"
          grep -Fq 'EXPECTED-CASH IMPLEMENTATION NOT SELECTED' "$doc"
          grep -Fq 'JRN-010 SHIFT CLOSE NOT SELECTED' "$doc"
