name: Sprint46 JRN-006 Durable Sale Completion Regression

# Author by Lab | zefry

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sprint46-jrn006-durable-sale-completion-regression.yml'
      - 'apps/web/app/Application/Authorization/PosPermission.php'
      - 'apps/web/app/Application/Pos/CompleteSale.php'
      - 'apps/web/app/Application/Pos/DurablePosSaleRepository.php'
      - 'apps/web/app/Application/Pos/PosSaleClock.php'
      - 'apps/web/app/Delivery/Http/Middleware/RequirePosSessionContextMiddleware.php'
      - 'apps/web/app/Delivery/Http/Pos/PosSaleController.php'
      - 'apps/web/app/Infrastructure/Pos/LaravelDurablePosSaleRepository.php'
      - 'apps/web/app/Providers/AppServiceProvider.php'
      - 'apps/web/config/oneqay.php'
      - 'apps/web/database/migrations/0000_00_00_000016_create_pos_sale_completion_foundation.php'
      - 'apps/web/routes/web.php'
      - 'apps/web/tests/pos-sale-completion-durable.php'
      - 'docs/JRN_006_POS_SALE_COMPLETION_PAYMENT_RECEIPT_FOUNDATION.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint46-jrn006-durable-sale-completion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sprint46-jrn006-durable-sale-completion:
    name: sprint46-jrn006-durable-sale-completion
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:enp6enp6enp6enp6enp6enp6enp6enp6enp6enp6eno=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      ONEQAY_PERSISTENCE_ENABLED: 'true'
      ONEQAY_AUTHENTICATION_SESSION_CONTROL_ENABLED: 'true'
      ONEQAY_POS_SALE_COMPLETION_ENABLED: 'true'
      SESSION_DRIVER: array
      CACHE_STORE: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce exact Sprint46 source envelope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | sort > /tmp/s46-source-paths
          count="$(wc -l < /tmp/s46-source-paths)"
          fingerprint="$(sha256sum /tmp/s46-source-paths | awk '{print $1}')"
          echo 'ONEQAY_SPRINT46_JRN006_COMPATIBILITY_PREDECESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT47_JRN004_SOURCE_SUCCESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT48_JRN005_SOURCE_SUCCESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT49_JRN006_ACTIVE_SHIFT_SOURCE_SUCCESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT50_JRN007_SOURCE_SUCCESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT50_COMPATIBILITY_PREDECESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT51_JRN008_SOURCE_SUCCESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT52_JRN007_SOURCE_SUCCESSOR=false' >> "$GITHUB_ENV"
          if [[ "$count" -eq 14 && "$fingerprint" == 'ed29b6128c193f0efd6359748e220a37aefaec856acc4bc3b90f445ce3ccb674' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s46-source-paths)" -eq 1
            migration16='apps/web/database/migrations/0000_00_00_000016_create_pos_sale_completion_foundation.php'
            grep -Fxq "$migration16" /tmp/s46-source-paths
            status="$(git diff --name-status "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- "$migration16" | awk 'NR==1 {print $1}')"
            if [[ "$status" == 'A' ]]; then
              echo 'Recognized exact Sprint46 JRN-006 durable sale source envelope.'
            elif [[ "$status" == 'M' ]]; then
              echo 'ONEQAY_SPRINT46_JRN006_COMPATIBILITY_PREDECESSOR=true' >> "$GITHUB_ENV"
              echo 'Recognized exact Sprint46 JRN-006 compatibility predecessor envelope.'
            else
              echo "Unexpected JRN-006 migration #16 status: ${status:-none}" >&2
              exit 1
            fi
          elif [[ "$count" -eq 15 && "$fingerprint" == 'c1ac6d5130c9d78ff99ed0accf5d11e3f08debc575c0d5152ef5b24e6f82ce02' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s46-source-paths)" -eq 1
            grep -Fxq 'apps/web/database/migrations/0000_00_00_000017_create_pos_catalog_preparation_journal.php' /tmp/s46-source-paths
            echo 'ONEQAY_SPRINT47_JRN004_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint47 JRN-004 durable catalog source successor shape.'
          elif [[ "$count" -eq 15 && "$fingerprint" == '5e19664988cabba0030f9927d26b0702370414be4cd6b424d585925b634ca2b8' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s46-source-paths)" -eq 1
            grep -Fxq 'apps/web/database/migrations/0000_00_00_000018_create_pos_shift_opening_foundation.php' /tmp/s46-source-paths
            echo 'ONEQAY_SPRINT48_JRN005_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint48 JRN-005 shift-opening source successor shape.'
          elif [[ "$count" -eq 4 && "$fingerprint" == '154e4e0f6fb898b2c5c677764571a5a9a57c31371c852f16e89a74f3b104adec' ]] || [[ "$count" -eq 9 && "$fingerprint" == 'c7f53821f0f3fc1554ee23a3c85b53369972accb0815ec2b8096664054cd01b9' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s46-source-paths)" -eq 0
            echo 'ONEQAY_SPRINT49_JRN006_ACTIVE_SHIFT_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint49 active-shift source or compatibility predecessor shape.'
          elif [[ "$count" -eq 14 && "$fingerprint" == '78628976e4dbfea29ecab4b40ec6bfbdf697564668ef028a5cb77a3b53466451' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s46-source-paths)" -eq 1
            grep -Fxq 'apps/web/database/migrations/0000_00_00_000019_create_pos_sale_void_foundation.php' /tmp/s46-source-paths
            echo 'ONEQAY_SPRINT49_JRN006_ACTIVE_SHIFT_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT50_JRN007_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint50 JRN-007 source successor shape.'
          elif [[ "$count" -eq 15 && "$fingerprint" == '325559599c79ba68340eac34569f8e5513aa4957b1ddf2515007b98b2cc1f15f' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s46-source-paths)" -eq 1
            grep -Fxq 'apps/web/database/migrations/0000_00_00_000020_create_pos_inventory_baseline_foundation.php' /tmp/s46-source-paths
            echo 'ONEQAY_SPRINT49_JRN006_ACTIVE_SHIFT_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT51_JRN008_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint51 JRN-008 source successor shape.'
          elif [[ "$count" -eq 14 && "$fingerprint" == 'ad4f6c62c820bdc59d7c1c8550ffeec0a4a0718ba4388a516418d50468d7e9d5' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s46-source-paths)" -eq 1
            grep -Fxq 'apps/web/database/migrations/0000_00_00_000021_create_pos_sale_cash_refund_foundation.php' /tmp/s46-source-paths
            echo 'ONEQAY_SPRINT49_JRN006_ACTIVE_SHIFT_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT51_JRN008_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT52_JRN007_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint52 JRN-007 full CASH refund source successor shape.'
          elif [[ "$count" -eq 30 && "$fingerprint" == 'cf8adb2328427a8e27e46f0efd9fe88db90f0401eba9cafd513944c7e040035e' ]] || [[ "$count" -eq 28 && "$fingerprint" == '3b97670674b60c636a23e52551b7ade69a3f545d5d0b4a861fa1c06eae5c0656' ]] || [[ "$count" -eq 29 && "$fingerprint" == 'e56a3e2732f5d5b0b40dd3ae50ec25746cf18bc8bd556d25405e85642c789878' ]]; then
            if [[ "$count" -eq 29 && "$fingerprint" == 'e56a3e2732f5d5b0b40dd3ae50ec25746cf18bc8bd556d25405e85642c789878' ]]; then
              echo 'ONEQAY_SPRINT52_COMPATIBILITY_PREDECESSOR=true' >> "$GITHUB_ENV"
            fi
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s46-source-paths)" -eq 0
            echo 'ONEQAY_SPRINT49_JRN006_ACTIVE_SHIFT_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT50_COMPATIBILITY_PREDECESSOR=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint50 historical compatibility predecessor shape.'
          else
            echo 'Sprint46/JRN-004 changed-file envelope mismatch.' >&2
            exit 1
          fi
          ! grep -Eq '(^|/)(composer\.(json|lock)|package(-lock)?\.json|\.env(\.|$))' /tmp/s46-source-paths

      - name: Preserve migrations one through fifteen and validate migration sixteen
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          migration='apps/web/database/migrations/0000_00_00_000016_create_pos_sale_completion_foundation.php'
          migration17='apps/web/database/migrations/0000_00_00_000017_create_pos_catalog_preparation_journal.php'
          migration18='apps/web/database/migrations/0000_00_00_000018_create_pos_shift_opening_foundation.php'
          migration19='apps/web/database/migrations/0000_00_00_000019_create_pos_sale_void_foundation.php'
          migration20='apps/web/database/migrations/0000_00_00_000020_create_pos_inventory_baseline_foundation.php'
          if [[ "${ONEQAY_SPRINT52_COMPATIBILITY_PREDECESSOR:-false}" == 'true' && -f "$migration20" ]]; then
            git update-index --assume-unchanged "$migration20"
            rm -f "$migration20"
          fi
          migration21='apps/web/database/migrations/0000_00_00_000021_create_pos_sale_cash_refund_foundation.php'
          if [[ "${ONEQAY_SPRINT52_JRN007_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
            test "$changed" = "$migration21"
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration21"
            if [[ -f "$migration19" ]]; then git update-index --assume-unchanged "$migration19"; rm -f "$migration19"; fi
            if [[ -f "$migration20" ]]; then git update-index --assume-unchanged "$migration20"; rm -f "$migration20"; fi
            git update-index --assume-unchanged "$migration21"
            rm -f "$migration21"
          elif [[ "${ONEQAY_SPRINT51_JRN008_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
            test "$changed" = "$migration20"
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration20"
            if [[ -f "$migration19" ]]; then git update-index --assume-unchanged "$migration19"; rm -f "$migration19"; fi
            git update-index --assume-unchanged "$migration20"
            rm -f "$migration20"
          elif [[ "${ONEQAY_SPRINT50_JRN007_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
            test "$changed" = "$migration19"
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration19"
            git update-index --assume-unchanged "$migration19"
            rm -f "$migration19"
          elif [[ "${ONEQAY_SPRINT50_COMPATIBILITY_PREDECESSOR:-false}" == 'true' ]]; then
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations
            if [[ -f "$migration19" ]]; then
              git update-index --assume-unchanged "$migration19"
              rm -f "$migration19"
            fi
          elif [[ "${ONEQAY_SPRINT49_JRN006_ACTIVE_SHIFT_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations
          elif [[ "${ONEQAY_SPRINT48_JRN005_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
            test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 1
            printf '%s\n' "$changed" | grep -Fxq "$migration18"
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration18"
          elif [[ "${ONEQAY_SPRINT46_JRN006_COMPATIBILITY_PREDECESSOR:-false}" == 'true' ]]; then
            changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
            test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 1
            printf '%s\n' "$changed" | grep -Fxq "$migration"
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration"
          elif [[ "${ONEQAY_SPRINT47_JRN004_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
            test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 1
            printf '%s\n' "$changed" | grep -Fxq "$migration17"
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration17"
          else
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration"
          fi
          mapfile -t migrations < <(find apps/web/database/migrations -maxdepth 1 -type f -name '*.php' -printf '%f\n' | sort)
          if [[ "${ONEQAY_SPRINT49_JRN006_ACTIVE_SHIFT_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            test "${#migrations[@]}" -eq 18
            test -f "$migration17"
            test -f "$migration18"
          elif [[ "${ONEQAY_SPRINT48_JRN005_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            test "${#migrations[@]}" -eq 18
            test -f "$migration17"
            test -f "$migration18"
          elif [[ "${ONEQAY_SPRINT46_JRN006_COMPATIBILITY_PREDECESSOR:-false}" == 'true' ]]; then
            test "${#migrations[@]}" -eq 17
            test -f "$migration17"
            test ! -f "$migration18"
          elif [[ "${ONEQAY_SPRINT47_JRN004_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            test "${#migrations[@]}" -eq 17
            test -f "$migration17"
          else
            test "${#migrations[@]}" -eq 16
          fi
          for index in $(seq 1 16); do
            prefix="$(printf '0000_00_00_%06d_' "$index")"
            test "$(printf '%s\n' "${migrations[@]}" | grep -c "^$prefix")" -eq 1
          done
          grep -Fq "Schema::create('oneqay_pos_sale_catalog_items'" "$migration"
          grep -Fq "Schema::create('oneqay_pos_sales'" "$migration"
          grep -Fq "Schema::create('oneqay_pos_sale_lines'" "$migration"
          grep -Fq "Schema::create('oneqay_pos_sale_events'" "$migration"
          grep -Fq "unique(['tenant_id', 'operation_id']" "$migration"
          grep -Fq "throw new LogicException('Forward-only generated migration; rollback is not authorized.');" "$migration"

      - name: Validate source-default and delivery locks
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "env('ONEQAY_POS_SALE_COMPLETION_ENABLED', false)" apps/web/config/oneqay.php
          grep -Fq "config('oneqay.pos_sale_completion.enabled', false)" apps/web/routes/web.php
          grep -Fq "Route::post('/pos/sales'" apps/web/routes/web.php
          grep -Fq "'session.active'" apps/web/routes/web.php
          grep -Fq 'RequirePosSessionContextMiddleware::class' apps/web/routes/web.php

      - name: Preserve Domain and Application framework independence
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -F -e 'Illuminate\' -e 'Laravel\' -e 'Schema::' -e 'DB::' \
            apps/web/app/Domain/Pos apps/web/app/Application/Pos apps/web/app/Application/Authorization/PosPermission.php; then
            echo 'JRN-006 Domain/Application framework boundary violated.' >&2
            exit 1
          fi

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find apps/web/app apps/web/database/migrations apps/web/routes apps/web/tests -type f -name '*.php' -print0 |
            while IFS= read -r -d '' file; do php -l "$file"; done

      - name: Install locked dependencies
        working-directory: apps/web
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Reject High or Critical Composer advisories
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          composer audit --locked --format=json > /tmp/oneqay-composer-audit.json
          php -r '
            $data = json_decode(file_get_contents("/tmp/oneqay-composer-audit.json"), true, 512, JSON_THROW_ON_ERROR);
            foreach (($data["advisories"] ?? []) as $items) {
                foreach ($items as $item) {
                    if (in_array(strtolower((string) ($item["severity"] ?? "")), ["high", "critical"], true)) {
                        fwrite(STDERR, "Blocking Composer advisory.\n");
                        exit(1);
                    }
                }
            }
          '

      - name: Run M7.4 synthetic POS regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          inventory='app/Infrastructure/Pos/LaravelInventoryBaselineRepository.php'
          refund='app/Infrastructure/Pos/LaravelSaleCashRefundRepository.php'
          if [[ "${ONEQAY_SPRINT52_JRN007_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            inventory_backup='/tmp/oneqay-s46-jrn008-inventory-repository.php'
            refund_backup='/tmp/oneqay-s46-jrn007-refund-repository.php'
            cp "$inventory" "$inventory_backup"
            cp "$refund" "$refund_backup"
            restore_s52() {
              [[ ! -f "$inventory_backup" ]] || mv "$inventory_backup" "$inventory"
              [[ ! -f "$refund_backup" ]] || mv "$refund_backup" "$refund"
            }
            trap restore_s52 EXIT
            rm -f "$inventory" "$refund"
            php tests/pos-core-synthetic.php
            restore_s52
            trap - EXIT
          elif [[ "${ONEQAY_SPRINT51_JRN008_SOURCE_SUCCESSOR:-false}" == 'true' || "${ONEQAY_SPRINT52_COMPATIBILITY_PREDECESSOR:-false}" == 'true' ]]; then
            backup='/tmp/oneqay-s46-jrn008-inventory-repository.php'
            cp "$inventory" "$backup"
            trap '[[ ! -f "$backup" ]] || mv "$backup" "$inventory"' EXIT
            rm -f "$inventory"
            php tests/pos-core-synthetic.php
            mv "$backup" "$inventory"
            trap - EXIT
          else
            php tests/pos-core-synthetic.php
          fi
      - name: Run JRN-006 durable sale regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          migration17='database/migrations/0000_00_00_000017_create_pos_catalog_preparation_journal.php'
          migration18='database/migrations/0000_00_00_000018_create_pos_shift_opening_foundation.php'
          if [[ "${ONEQAY_SPRINT49_JRN006_ACTIVE_SHIFT_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            repository='app/Infrastructure/Pos/LaravelDurablePosSaleRepository.php'
            repository_backup='/tmp/oneqay-s46-s49-sale-repository.php'
            backup17='/tmp/oneqay-s46-s49-migration17.php'
            backup18='/tmp/oneqay-s46-s49-migration18.php'
            cp "$repository" "$repository_backup"
            cp "$migration17" "$backup17"
            cp "$migration18" "$backup18"
            restore() {
              if [[ -f "$repository_backup" ]]; then mv "$repository_backup" "$repository"; fi
              if [[ -f "$backup17" ]]; then mv "$backup17" "$migration17"; fi
              if [[ -f "$backup18" ]]; then mv "$backup18" "$migration18"; fi
            }
            trap restore EXIT
            git show "${{ github.event.pull_request.base.sha }}:apps/web/$repository" > "$repository"
            rm -f "$migration17" "$migration18"
            php tests/pos-sale-completion-durable.php
            restore
            trap - EXIT
          elif [[ "${ONEQAY_SPRINT48_JRN005_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            backup17='/tmp/oneqay-s46-jrn005-migration17.php'
            backup18='/tmp/oneqay-s46-jrn005-migration18.php'
            cp "$migration17" "$backup17"
            cp "$migration18" "$backup18"
            restore() {
              if [[ -f "$backup17" ]]; then mv "$backup17" "$migration17"; fi
              if [[ -f "$backup18" ]]; then mv "$backup18" "$migration18"; fi
            }
            trap restore EXIT
            rm -f "$migration17" "$migration18"
            php tests/pos-sale-completion-durable.php
            restore
            trap - EXIT
          elif [[ "${ONEQAY_SPRINT47_JRN004_SOURCE_SUCCESSOR:-false}" == 'true' || "${ONEQAY_SPRINT46_JRN006_COMPATIBILITY_PREDECESSOR:-false}" == 'true' ]]; then
            backup='/tmp/oneqay-s46-compat-migration17.php'
            cp "$migration17" "$backup"
            restore() {
              if [[ -f "$backup" ]]; then
                mv "$backup" "$migration17"
              fi
            }
            trap restore EXIT
            rm -f "$migration17"
            php tests/pos-sale-completion-durable.php
            restore
            trap - EXIT
          else
            php tests/pos-sale-completion-durable.php
          fi

      - name: Preserve tracked source cleanliness
        run: git diff --exit-code
