name: Sprint164 POS Inventory Replenishment Foundation Workspace Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint164-pos-inventory-replenishment-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  preserve-sprint164-pos-inventory-replenishment:
    runs-on: ubuntu-latest
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3d3c=
      APP_DEBUG: "false"
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      SESSION_DRIVER: array
      CACHE_STORE: array
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve Sprint164 source contract
        run: |
          set -euo pipefail
          test -f apps/web/app/Application/Pos/ReplenishInventory.php
          test -f apps/web/app/Application/Pos/InventoryReplenishmentCommand.php
          test -f apps/web/app/Application/Pos/InventoryReplenishmentRepository.php
          test -f apps/web/app/Application/Pos/InventoryReplenishmentResult.php
          test -f apps/web/app/Application/Pos/PosInventoryReplenishmentWorkspaceSnapshot.php
          test -f apps/web/app/Infrastructure/Pos/LaravelInventoryReplenishmentRepository.php
          test -f apps/web/app/Infrastructure/Pos/LaravelPosInventoryReplenishmentWorkspaceRepository.php
          test -f apps/web/app/Providers/PosInventoryReplenishmentWorkspaceServiceProvider.php
          test -f apps/web/resources/js/pages/Pos/InventoryReplenishment.vue
          test -f apps/web/tests/pos-inventory-replenishment-workspace.php
          test -f apps/web/database/module-migrations/pos/0000_00_00_000028_create_pos_inventory_replenishment_foundation.php
          grep -Fq "loadMigrationsFrom(base_path('database/module-migrations/pos'))" apps/web/app/Providers/PosInventoryReplenishmentWorkspaceServiceProvider.php
          grep -Fq 'PosInventoryReplenishmentWorkspaceServiceProvider::class' apps/web/app/Providers/PosOperationsHubServiceProvider.php
          grep -Fq 'ONEQAY_POS_INVENTORY_REPLENISHMENT_ENABLED' apps/web/config/pos_inventory_replenishment.php

      - name: Preserve positive-only deny-by-default replenishment invariants
        run: |
          set -euo pipefail
          grep -Fq "public const REPLENISH_PERMISSION = 'pos.inventory.replenish';" apps/web/app/Application/Pos/ReplenishInventory.php
          grep -Fq 'PermissionIdentifier::fromString(self::REPLENISH_PERMISSION)' apps/web/app/Application/Pos/ReplenishInventory.php
          grep -Fq 'PermissionIdentifier::fromString(ReplenishInventory::REPLENISH_PERMISSION)' apps/web/app/Application/Pos/ViewPosInventoryReplenishmentWorkspace.php
          grep -Fq 'PermissionIdentifier::fromString(ReplenishInventory::REPLENISH_PERMISSION)' apps/web/app/Application/Pos/ViewPosOperationsHub.php
          ! grep -Fq 'pos.inventory.replenish' apps/web/app/Application/Authorization/PosPermission.php
          grep -Fq 'replenishedQuantity <= 0' apps/web/app/Application/Pos/InventoryReplenishmentCommand.php
          grep -Fq 'oneqay_pos_inventory_baselines' apps/web/app/Infrastructure/Pos/LaravelInventoryReplenishmentRepository.php
          grep -Fq "where('active', true)" apps/web/app/Infrastructure/Pos/LaravelInventoryReplenishmentRepository.php
          grep -Fq 'oneqay_pos_inventory_replenishments' apps/web/app/Infrastructure/Pos/LaravelInventoryReplenishmentRepository.php
          grep -Fq "where('available_quantity', \$before)" apps/web/app/Infrastructure/Pos/LaravelInventoryReplenishmentRepository.php
          ! grep -Eq "decrement\(|replenished_quantity[^\n]*-" apps/web/app/Infrastructure/Pos/LaravelInventoryReplenishmentRepository.php
          test ! -f apps/web/database/migrations/0000_00_00_000028_create_pos_inventory_replenishment_foundation.php

      - name: Preserve operational NO-GO
        run: |
          set -euo pipefail
          test "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" = NOT_EXECUTED
          test "$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)" = NONE
          test "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" = INACTIVE
          test "$(jq -r '.deployment_authority' ops/final-shift-close/STATE.json)" = NOT_GRANTED
          test "$(jq -r '.technical_preview_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
          test "$(jq -r '.production_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
          test "$(jq -r '.updater_activation' ops/final-shift-close/STATE.json)" = INACTIVE
          test "$(jq -r '.selected_target' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = null

      - name: Install PHP dependencies
        working-directory: apps/web
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist

      - name: Validate PHP syntax
        working-directory: apps/web
        run: |
          find app config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          cat /tmp/php-lint.log

      - name: Execute preserved application and POS regressions
        working-directory: apps/web
        run: |
          composer test
          php tests/pos-operational-reporting.php
          php tests/pos-cashier-workspace.php
          php tests/pos-shift-start-workspace.php
          php tests/pos-sale-correction-workspace.php
          php tests/pos-sale-history-workspace.php
          php tests/pos-catalog-inventory-setup-workspace.php
          php tests/pos-operations-hub.php
          php tests/pos-cash-variance-reconciliation-workspace.php
          php tests/pos-inventory-replenishment-workspace.php

      - name: Setup exact Node LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.19.0

      - name: Type-check and build UI
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts --no-fund
          npm run type-check
          npm run build

      - name: Preserve guarded route discovery and refresh semantics
        run: |
          set -euo pipefail
          grep -Fq 'Route::has($routeName)' apps/web/app/Delivery/Http/Pos/PosOperationsHubController.php
          grep -Fq 'pos.inventory.replenishment.workspace' apps/web/app/Delivery/Http/Pos/PosOperationsHubController.php
          grep -Fq 'refreshRequired.value = true' apps/web/resources/js/pages/Pos/InventoryReplenishment.vue
          grep -Fq 'Tidak ada retry otomatis' apps/web/resources/js/pages/Pos/InventoryReplenishment.vue

      - name: Verify tracked-source cleanliness
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
