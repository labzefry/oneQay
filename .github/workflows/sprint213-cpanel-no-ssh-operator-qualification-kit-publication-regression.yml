# Author by Lab | zefry
name: Sprint213 cPanel No-SSH Operator Qualification Kit Publication Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint213-cpanel-no-ssh-operator-kit-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify-sprint213-cpanel-no-ssh-operator-kit:
    name: qualify-sprint213-cpanel-no-ssh-operator-kit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Lock exact Sprint213 engineering envelope
        if: github.event_name == 'pull_request' && github.head_ref == 'sprint213-cpanel-no-ssh-operator-qualification-kit-publication'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | LC_ALL=C sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          .github/workflows/cpanel-no-ssh-operator-qualification-kit-publication.yml
          .github/workflows/sprint213-cpanel-no-ssh-operator-qualification-kit-publication-regression.yml
          DEPLOYMENT.md
          INSTALLER.md
          ops/final-shift-close/DURABLE_STAGING_CPANEL_NO_SSH_OPERATOR_KIT_PUBLICATION_CONTRACT.json
          tools/cpanel/build-cpanel-no-ssh-operator-qualification-kit.sh
          EOF
          diff -u /tmp/expected /tmp/actual
          test "$(sha256sum /tmp/actual | awk '{print $1}')" = '7ccb0d202041e8968e7d526d6ee3fc7d76fd68048fc062993a8172b53a95e6be'

      - name: Validate Sprint213 source syntax and contract
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/cpanel/build-cpanel-no-ssh-operator-qualification-kit.sh
          php -l tools/cpanel/inspect-durable-staging-cpanel-no-ssh-target.php
          php -l tools/cpanel/prepare-durable-staging-cpanel-no-ssh-target-candidate.php
          php -l tools/prepare-durable-staging-deployment-authority-request.php
          php -l tools/qualify-durable-staging-deployment-authority.php
          php -l tools/prepare-durable-staging-operator-deployment-plan.php
          php -l tools/qualify-durable-staging-deployment-evidence.php

          contract=ops/final-shift-close/DURABLE_STAGING_CPANEL_NO_SSH_OPERATOR_KIT_PUBLICATION_CONTRACT.json
          jq -e . "$contract" >/dev/null
          test "$(jq -r '.contract_state' "$contract")" = PUBLISHES_SECRET_FREE_CPANEL_NO_SSH_OPERATOR_KIT_NOT_DEPLOYED
          test "$(jq -r '.application_release_reference.actions_artifact_id' "$contract")" = 10608272778
          test "$(jq -r '.application_release_reference.release_id' "$contract")" = durable-staging-5be28a3c0017
          test "$(jq -r '.application_release_reference.publication_run_id' "$contract")" = 35522953555
          test "$(jq -r '.application_release_reference.actions_artifact_name' "$contract")" = oneqay-durable-staging-5be28a3c0017-operator-bundle
          test "$(jq -r '.application_release_reference.actions_outer_digest' "$contract")" = sha256:1e0bd4b514f4c36afaf83e4dc9e2fbb012953edacdf3e56945a6e53aeb508db8
          test "$(jq -r '.application_release_reference.handoff_sha256' "$contract")" = 628a3b2aa2d0e165a641f32ee29edaee7e681dcdbd6f8e22bbd908b09c12af9a
          test "$(jq -r '.publication_requirements.deterministic_zip' "$contract")" = true
          test "$(jq -r '.publication_requirements.application_release_bytes_embedded' "$contract")" = false
          test "$(jq -r '.authority_boundary.kit_is_not_deployment_authority' "$contract")" = true

      - name: Preserve canonical operational NO-GO
        shell: bash
        run: |
          set -euo pipefail
          state=ops/final-shift-close/STATE.json
          selection=ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json
          test "$(jq -r '.migration27.state' "$state")" = NOT_EXECUTED
          test "$(jq -r '.permission_provisioning.state' "$state")" = NONE
          test "$(jq -r '.feature_activation.state' "$state")" = INACTIVE
          test "$(jq -r '.deployment_authority' "$state")" = NOT_GRANTED
          test "$(jq -r '.technical_preview_activation' "$state")" = NOT_AUTHORIZED
          test "$(jq -r '.production_activation' "$state")" = NOT_AUTHORIZED
          test "$(jq -r '.updater_activation' "$state")" = INACTIVE
          test "$(jq -r '.selection_state' "$selection")" = SELECTED_NOT_AUTHORIZED
          test "$(jq -r '.selected_target.environment_id' "$selection")" = 'oneqay-durable-staging-01'
          test "$(jq -r '.selected_target.runtime_class' "$selection")" = 'durable-staging'
          test "$(jq -r '.selected_target.selection_fingerprint_sha256' "$selection")" = '858280ea3575317e8d88eed7009c770530097e261c391b2869fa81ad7c8546ce'

      - name: Build and prove deterministic operator kit
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          bash tools/cpanel/build-cpanel-no-ssh-operator-qualification-kit.sh "$head_sha"
          kit_id="cpanel-no-ssh-operator-kit-${head_sha:0:12}"
          cp "dist/${kit_id}.zip" /tmp/kit-first.zip
          cp "dist/${kit_id}.manifest.json" /tmp/kit-first.manifest.json
          cp "dist/${kit_id}.zip.sha256" /tmp/kit-first.zip.sha256

          rm -rf dist
          bash tools/cpanel/build-cpanel-no-ssh-operator-qualification-kit.sh "$head_sha"
          cmp /tmp/kit-first.zip "dist/${kit_id}.zip"
          diff -u /tmp/kit-first.manifest.json "dist/${kit_id}.manifest.json"
          diff -u /tmp/kit-first.zip.sha256 "dist/${kit_id}.zip.sha256"

          test "$(jq -r '.kit_source_commit' "dist/${kit_id}.manifest.json")" = "$head_sha"
          test "$(jq -r '.application_release_reference.release_id' "dist/${kit_id}.manifest.json")" = durable-staging-5be28a3c0017
          test "$(jq -r '.application_release_reference.actions_artifact_id' "dist/${kit_id}.manifest.json")" = 10608272778
          test "$(jq -r '.application_release_reference.handoff_sha256' "dist/${kit_id}.manifest.json")" = 628a3b2aa2d0e165a641f32ee29edaee7e681dcdbd6f8e22bbd908b09c12af9a
          test "$(jq -r '.secret_values_embedded' "dist/${kit_id}.manifest.json")" = false
          test "$(jq -r '.deployment_authority' "dist/${kit_id}.manifest.json")" = NOT_GRANTED
          test "$(jq -r '.selected_target' "dist/${kit_id}.manifest.json")" = null

      - name: Validate self-contained ZIP contents
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          kit_id="cpanel-no-ssh-operator-kit-${head_sha:0:12}"
          unzip -l "dist/${kit_id}.zip" > /tmp/kit-list.txt

          for required in             "README.md"             "KIT.json"             "kit.manifest.json"             "target-input.template.json"             "private-bindings.template.json"             "tools/cpanel/inspect-durable-staging-cpanel-no-ssh-target.php"             "tools/cpanel/prepare-durable-staging-cpanel-no-ssh-target-candidate.php"             "tools/prepare-durable-staging-deployment-authority-request.php"             "tools/qualify-durable-staging-deployment-authority.php"             "tools/prepare-durable-staging-operator-deployment-plan.php"             "tools/qualify-durable-staging-deployment-evidence.php"
          do
            grep -Fq "${kit_id}/${required}" /tmp/kit-list.txt
          done

          ! grep -Fq "/apps/web/" /tmp/kit-list.txt
          ! grep -E '(^|/)(\.env|id_rsa|id_ed25519)(/|$)|\.(pem|key|p12|pfx)$' /tmp/kit-list.txt

      - name: Exercise packaged cPanel target qualification to Sprint208 request
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          kit_id="cpanel-no-ssh-operator-kit-${head_sha:0:12}"
          root="$RUNNER_TEMP/sprint213-kit"
          mkdir -p "$root"
          unzip -q "dist/${kit_id}.zip" -d "$root"
          kit="$root/${kit_id}"

          deployment="$root/host/deployment"
          release_root="$deployment/releases"
          shared_root="$deployment/shared"
          active_pointer="$deployment/current"
          document_root="$active_pointer/apps/web/public"
          private="$root/host/private"
          mkdir -p "$release_root" "$shared_root" "$private"

          jq             --arg env_id "cpanel-kit-ci"             --arg deployment "$deployment"             --arg release_root "$release_root"             --arg shared_root "$shared_root"             --arg active "$active_pointer"             --arg docroot "$document_root"             '.environment_id = $env_id
             | .filesystem.deployment_root = $deployment
             | .filesystem.release_root = $release_root
             | .filesystem.shared_runtime_root = $shared_root
             | .filesystem.active_release_pointer = $active
             | .filesystem.document_root = $docroot
             | .operator_assertions |= with_entries(.value = true)'             "$kit/target-input.template.json" > "$private/target-input.json"

          token='sprint213-ci-private-attestation-token-0123456789abcdef'
          jq             --arg env_id "cpanel-kit-ci"             --arg token "$token"             '.ONEQAY_DURABLE_RUNTIME_ENVIRONMENT_ID = $env_id
             | .ONEQAY_DURABLE_RUNTIME_ATTESTATION_TOKEN = $token'             "$kit/private-bindings.template.json" > "$private/bindings.json"
          chmod 0600 "$private/bindings.json"

          php "$kit/tools/cpanel/inspect-durable-staging-cpanel-no-ssh-target.php"             "$private/target-input.json"             "$private/bindings.json"             "$private/target-profile.json"

          test "$(jq -r '.profile_state' "$private/target-profile.json")" = CPANEL_NO_SSH_TARGET_PROFILE_OBSERVED
          ! grep -Fq "$token" "$private/target-profile.json"

          php "$kit/tools/cpanel/prepare-durable-staging-cpanel-no-ssh-target-candidate.php"             "$private/target-profile.json"             "$private/target-candidate.json"

          test "$(jq -r '.target_state' "$private/target-candidate.json")" = OPERATOR_TARGET_CANDIDATE
          ! grep -Fq "$token" "$private/target-candidate.json"

          cat > "$private/handoff.json" <<'EOF'
          {
            "schema_version": 1,
            "handoff_state": "VALIDATED_FOR_EXTERNAL_DEPLOYMENT_NOT_AUTHORIZED",
            "product": {
              "name": "oneQay",
              "repository": "labzefry/oneQay"
            },
            "artifact": {
              "release_id": "durable-staging-5be28a3c0017",
              "source_commit": "5be28a3c001738373588b58e9d29832c46402de1",
              "artifact_filename": "durable-staging-5be28a3c0017.tar.gz",
              "artifact_sha256": "66be23792478fb191f912571b35076c42783b9733cdb3fb514b549d22ec90dd7",
              "artifact_size_bytes": 4786075,
              "manifest_sha256": "d24c8961100be308599b469a2f87485c9a1646f57c435118990141c2f85f8ec9"
            },
            "runtime": {
              "required_runtime_class": "durable-staging",
              "production": false,
              "production_data_allowed": false,
              "synthetic_fixture_runtime": false
            },
            "migration": {
              "expected_count": 27,
              "execution_state": "NOT_PERFORMED",
              "execution_authorized": false
            },
            "deployment": {
              "execution_state": "NOT_PERFORMED",
              "authority_state": "NOT_GRANTED"
            }
          }
          EOF

          php "$kit/tools/prepare-durable-staging-deployment-authority-request.php"             "$private/handoff.json"             "$private/target-candidate.json"             "$private/authority-request.json"

          test "$(jq -r '.request_state' "$private/authority-request.json")" = DURABLE_STAGING_DEPLOYMENT_AUTHORITY_REQUEST_PENDING_APPROVAL
          test "$(jq -r '.environment_id' "$private/authority-request.json")" = cpanel-kit-ci
          test "$(jq -r '.required_authority.maximum_lifetime_seconds' "$private/authority-request.json")" = 900
          test "$(jq -r '.migration_execution_authorized' "$private/authority-request.json")" = false
          test "$(jq -r '.production_authorized' "$private/authority-request.json")" = false
          test "$(jq -r '.target_selection_authorized' "$private/authority-request.json")" = false
          test "$(jq -r '.producer_dispatch_authorized' "$private/authority-request.json")" = false

      - name: Prove publication and builder have no deployment side effects
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/cpanel-no-ssh-operator-qualification-kit-publication.yml
          builder=tools/cpanel/build-cpanel-no-ssh-operator-qualification-kit.sh

          grep -Fq 'branches: [main]' "$workflow"
          grep -Fq "if: github.ref == 'refs/heads/main'" "$workflow"
          grep -Fq 'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02' "$workflow"
          grep -Fq 'retention-days: 30' "$workflow"

          for file in "$workflow" "$builder"; do
            ! grep -E '(^|[[:space:]])(ssh|scp|rsync|kubectl)([[:space:]]|$)' "$file"
            ! grep -Fq 'php artisan migrate' "$file"
            ! grep -Fq 'ONEQAY_DURABLE_RUNTIME_ATTESTATION_TOKEN=' "$file"
          done

      - name: Prove application source remains untouched or exact Sprint220 bounded updater
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- apps/web/database/migrations)"
          if [ "$HEAD_REF" = 'sprint220-governed-cpanel-bootstrap-development-updater' ]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- apps/web | LC_ALL=C sort > /tmp/s220-app-paths
            test -s /tmp/s220-app-paths
            while IFS= read -r changed; do
              case "$changed" in
                apps/web/app/Console/Commands/DiscoverGovernedDevelopmentUpdateCommand.php|apps/web/app/Console/Commands/ProcessGovernedDevelopmentUpdateCommand.php|apps/web/app/Delivery/Http/SystemUpdate/DevelopmentUpdateRequestController.php|apps/web/app/Delivery/Http/SystemUpdate/SystemUpdatePageController.php|apps/web/app/Infrastructure/SystemUpdate/Development/*|apps/web/app/Providers/SystemUpdateServiceProvider.php|apps/web/config/oneqay_development_updater.php|apps/web/resources/js/pages/System/UpdateDeployment.vue|apps/web/tests/read-only-update-deployment-ui.php|apps/web/tests/sprint220-governed-development-updater.php)
                  ;;
                *)
                  echo "Unexpected Sprint220 application path: $changed" >&2
                  exit 1
                  ;;
              esac
            done < /tmp/s220-app-paths
          else
            test -z "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- apps/web)"
          fi

      - name: Confirm tracked source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          git diff --exit-code
          test -z "$(git status --porcelain)"
