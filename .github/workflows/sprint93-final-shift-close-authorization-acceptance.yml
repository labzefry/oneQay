name: Sprint93 Final Shift Close Authorization Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sprint93-final-shift-close-authorization-acceptance.yml'
      - 'docs/SPRINT93_FINAL_SHIFT_CLOSE_AUTHORIZATION_ACCEPTANCE.md'
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  qualify-source:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Enforce exact Sprint93 evidence envelope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | LC_ALL=C sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          .github/workflows/sprint93-final-shift-close-authorization-acceptance.yml
          docs/SPRINT93_FINAL_SHIFT_CLOSE_AUTHORIZATION_ACCEPTANCE.md
          EOF
          diff -u /tmp/expected /tmp/actual
          test "$(sha256sum /tmp/actual | awk '{print $1}')" = "ee299a361a6aa086a634807776aa21c87ba39431ef7aed247451fb64d3cd95b3"

      - name: Preserve unselected Final Shift Close source state
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R --line-number --fixed-strings "pos.shift.close" apps/web/app/Application/Authorization/PosPermission.php
          for path in \
            apps/web/app/Application/Pos/CloseShift.php \
            apps/web/app/Application/Pos/CloseShiftCommand.php \
            apps/web/app/Application/Pos/CloseShiftRepository.php \
            apps/web/app/Application/Pos/CloseShiftResult.php \
            apps/web/app/Infrastructure/Pos/LaravelCloseShiftRepository.php; do
            test ! -e "$path"
          done

      - name: Lock acceptance semantics
        shell: bash
        run: |
          set -euo pipefail
          doc=docs/SPRINT93_FINAL_SHIFT_CLOSE_AUTHORIZATION_ACCEPTANCE.md
          grep -Fq 'PRODUCT OWNER AUTHORIZATION: SELECT SPRINT92 RECOMMENDED FINAL SHIFT CLOSE SECURITY POSTURE' "$doc"
          grep -Fq 'FINAL_SHIFT_CLOSE_PERMISSION = NOT_DEFINED' "$doc"
          grep -Fq 'FINAL_SHIFT_CLOSE_AUTHORITY = NOT_SELECTED' "$doc"
          grep -Fq 'NO_DEFAULT_GRANT' "$doc"
          grep -Fq 'final-shift-close-authorization-selection' "$doc"
          grep -Fq 'MIGRATION_27_LIVE_EXECUTION = NOT_AUTHORIZED' "$doc"
          grep -Fq 'TECHNICAL_PREVIEW_ACTIVATION_AUTHORITY = NOT_GRANTED' "$doc"
          grep -Fq 'PRODUCTION_AUTHORITY = NOT_GRANTED' "$doc"
          grep -Fq 'UPDATER_ACTIVATION_AUTHORITY = NOT_GRANTED' "$doc"

  accept-selection:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.body == 'PRODUCT OWNER AUTHORIZATION: SELECT SPRINT92 RECOMMENDED FINAL SHIFT CLOSE SECURITY POSTURE'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve exact pull request head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.issue.pull_request.url }}
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${PR_URL}" | jq -r '.head.sha')"
          test "$head_sha" != "null"
          test -n "$head_sha"
          echo "sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Record exact-head Product Owner authorization selection
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.head.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}"
          payload='{"state":"success","context":"final-shift-close-authorization-selection","description":"Exact Product Owner Final Shift Close security posture selected."}'
          curl --fail --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api" \
            -d "$payload" > /dev/null
