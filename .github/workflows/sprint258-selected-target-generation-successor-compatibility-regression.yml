name: Sprint258 Selected Target Generation Successor Compatibility Regression

# Attribution: Lab | zefry

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sprint258-selected-target-generation-successor-compatibility-regression-916
  cancel-in-progress: true

jobs:
  qualify-successor-compatible-selected-target-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ed664564627c3111a740d2f61134d917bcc81b4b
          fetch-depth: 0

      - name: Validate stable target identity and generation shape
        shell: bash
        run: |
          set -euo pipefail
          selection=ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json
          state=ops/final-shift-close/STATE.json
          test "$(jq -r '.selection_state' "$selection")" = SELECTED_NOT_AUTHORIZED
          test "$(jq -r '.selected_target.environment_id' "$selection")" = oneqay-durable-staging-01
          test "$(jq -r '.selected_target.runtime_class' "$selection")" = durable-staging
          source="$(jq -r '.selected_target.exact_running_source_commit' "$selection")"; [[ "$source" =~ ^[0-9a-f]{40}$ ]]
          artifact="$(jq -r '.selected_target.exact_running_artifact_sha256' "$selection")"; [[ "$artifact" =~ ^[0-9a-f]{64}$ ]]
          readiness="$(jq -r '.selected_target.readiness_attestation_sha256' "$selection")"; [[ "$readiness" =~ ^[0-9a-f]{64}$ ]]
          fingerprint="$(jq -r '.selected_target.selection_fingerprint_sha256' "$selection")"; [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]]
          ingestion_run="$(jq -r '.selected_target.trusted_ingestion.run_id' "$selection")"; [[ "$ingestion_run" =~ ^[1-9][0-9]*$ ]]
          ingestion_fp="$(jq -r '.selected_target.trusted_ingestion.ingestion_fingerprint_sha256' "$selection")"; [[ "$ingestion_fp" =~ ^[0-9a-f]{64}$ ]]
          test "$(jq -r '.deployment_authority' "$state")" = NOT_GRANTED
          test "$(jq -r '.technical_preview_activation' "$state")" = NOT_AUTHORIZED
          test "$(jq -r '.production_activation' "$state")" = NOT_AUTHORIZED
          test "$(jq -r '.updater_activation' "$state")" = INACTIVE

      - name: Prove retired generation is not asserted as current selected target
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          retired = {
              '.selected_target.exact_running_source_commit': '59b42137eed717aacc82080a46753440bb4d8537',
              '.selected_target.exact_running_artifact_sha256': '8ad4a33196eabd6248c9dfb35eb118e97759e5c17b32384a12b120258bce615c',
              '.selected_target.readiness_attestation_sha256': '4a0772838f25d7ee3a7d57153f76b3b23f5d4722c644a76c287b5005e9c328b2',
              '.selected_target.selection_fingerprint_sha256': '6ecc487cb144e634455de69cc43aa39b1f6880a2256c4b1ab33387096513772b',
              '.selected_target.trusted_ingestion.run_id': '36008213090',
              '.selected_target.trusted_ingestion.ingestion_fingerprint_sha256': 'a007a97b0b822895ffcdc3453594dae7d4a3f5dab1358390f030c7793b7c79fb',
          }
          failures = []
          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  stripped = line.lstrip()
                  if stripped.startswith('#'):
                      continue
                  for field, literal in retired.items():
                      if field in line and literal in line:
                          failures.append(f'{path}:{number}:{field}')
          if failures:
              raise SystemExit('Retired current-generation assertions remain:\n' + '\n'.join(failures[:40]))
          PY

      - name: Validate Sprint258 contract and path manifest
        shell: bash
        run: |
          set -euo pipefail
          contract=ops/final-shift-close/SELECTED_TARGET_GENERATION_SUCCESSOR_COMPATIBILITY_CONTRACT.json
          paths=ops/final-shift-close/SELECTED_TARGET_GENERATION_SUCCESSOR_COMPATIBILITY_PATHS.txt
          jq -e '
            .schema_version == 1 and
            .feature == "final-shift-close" and
            .sprint == 258 and
            .bounded_objective == "SELECTED_TARGET_GENERATION_SUCCESSOR_COMPATIBILITY" and
            .compatibility_state == "RETIRED_GENERATION_PIN_REMOVED_FROM_HISTORICAL_RUNTIME_ASSERTIONS" and
            (.historical_workflows_updated > 0) and
            .stable_invariants.selection_state == "SELECTED_NOT_AUTHORIZED" and
            .stable_invariants.environment_id == "oneqay-durable-staging-01" and
            .stable_invariants.runtime_class == "durable-staging" and
            .operational_boundaries.target_reselection == "NOT_PERFORMED" and
            .operational_boundaries.feature_activation_mutation == "NOT_PERFORMED" and
            .operational_boundaries.migration27_replay == "NOT_PERFORMED" and
            .operational_boundaries.permission_reprovisioning == "NOT_PERFORMED" and
            .operational_boundaries.technical_preview_activation == "NOT_AUTHORIZED" and
            .operational_boundaries.production_activation == "NOT_AUTHORIZED" and
            .operational_boundaries.updater_activation == "INACTIVE" and
            .operational_boundaries.producer_dispatch == "NOT_PERFORMED" and
            .attribution == "Author by Lab | zefry"
          ' "$contract" >/dev/null
          test -s "$paths"
          test "$(wc -l < "$paths")" = "$(jq -r '.historical_workflows_updated' "$contract")"
          while IFS= read -r path; do test -f "$path"; done < "$paths"

      - name: Verify tracked source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code

# Author by Lab | zefry
