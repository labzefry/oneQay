name: Sprint36 First-Party Session Inventory Revocation Regression

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint36-session-control-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sprint36-session-control:
    name: sprint36-session-control
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:c3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3M=
      APP_DEBUG: "false"
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      ONEQAY_PERSISTENCE_ENABLED: "false"
      ONEQAY_AUTHENTICATION_SESSION_CONTROL_ENABLED: "false"
      SESSION_DRIVER: array
      CACHE_STORE: array
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce frozen Sprint36 source envelope
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/sprint36-paths <<'EOF'
          .github/workflows/sprint36-first-party-session-inventory-revocation-regression.yml
          apps/web/app/Application/Identity/FirstPartySessionAuthorityClock.php
          apps/web/app/Application/Identity/FirstPartySessionAuthorityRepository.php
          apps/web/app/Application/Identity/FirstPartySessionAuthorityService.php
          apps/web/app/Application/Identity/FirstPartySessionAuthorityViolation.php
          apps/web/app/Application/Identity/FirstPartySessionInventoryItem.php
          apps/web/app/Application/Identity/IssuedFirstPartySessionAuthority.php
          apps/web/app/Delivery/Http/Identity/FirstPartySessionController.php
          apps/web/app/Delivery/Http/Identity/FirstPartySessionControlController.php
          apps/web/app/Delivery/Http/Identity/FirstPartySessionKeys.php
          apps/web/app/Delivery/Http/Identity/PrivilegedReauthenticationController.php
          apps/web/app/Delivery/Http/Identity/PrivilegedTotpMfaController.php
          apps/web/app/Delivery/Http/Middleware/EnforceActiveFirstPartySessionAuthorityMiddleware.php
          apps/web/app/Delivery/Http/Middleware/RequireFirstPartySessionControlMutationContextMiddleware.php
          apps/web/app/Infrastructure/Identity/LaravelFirstPartySessionAuthorityRepository.php
          apps/web/app/Providers/AppServiceProvider.php
          apps/web/bootstrap/app.php
          apps/web/config/oneqay.php
          apps/web/database/migrations/0000_00_00_000013_create_first_party_session_authority.php
          apps/web/routes/web.php
          apps/web/tests/first-party-session-inventory-revocation.php
          apps/web/tests/run.php
          docs/FIRST_PARTY_SESSION_INVENTORY_REVOCATION_FOUNDATION.md
          EOF
          sort -o /tmp/sprint36-paths /tmp/sprint36-paths
          test "$(sha256sum /tmp/sprint36-paths | awk '{print $1}')" = "ea735f8f5ee06d480863f9d1ba7ae58a91642109963c3f340e8453f3205bb7ae"

          cat > /tmp/post-sprint36-reconciliation-paths <<'EOF'
          docs/ai/AI_NEXT_TASK.md
          docs/ai/AI_POST_SPRINT_36_CANONICAL_STATE.md
          EOF
          sort -o /tmp/post-sprint36-reconciliation-paths /tmp/post-sprint36-reconciliation-paths
          test "$(sha256sum /tmp/post-sprint36-reconciliation-paths | awk '{print $1}')" = "2e2c88793557dc4a0bed42a3610bc83f1c811a469dd50636f62b5c9397e9683d"

          cat > /tmp/post-sprint36-compatibility-correction-paths <<'EOF'
          .github/workflows/sprint35-privileged-totp-recovery-regression.yml
          .github/workflows/sprint36-first-party-session-inventory-revocation-regression.yml
          EOF
          sort -o /tmp/post-sprint36-compatibility-correction-paths /tmp/post-sprint36-compatibility-correction-paths
          test "$(sha256sum /tmp/post-sprint36-compatibility-correction-paths | awk '{print $1}')" = "c333c5a6ac31588aa9b0520160a1a1080a22af2971658d742ba9456eff94cbc8"

          cat > /tmp/sprint37-preservation-compatibility-paths <<'EOF'
          .github/workflows/m7-2-tenant-isolation-regression.yml
          .github/workflows/m7-3-identity-org-context-regression.yml
          .github/workflows/m7-4a-technical-preview-interaction-regression.yml
          .github/workflows/m7-5-preview-db-qualification-regression.yml
          .github/workflows/m7-5-preview-release-artifact.yml
          .github/workflows/sprint21-role-permission-policy-regression.yml
          .github/workflows/sprint22-policy-administration-regression.yml
          .github/workflows/sprint23-initial-tenant-admin-provisioning-regression.yml
          .github/workflows/sprint24-protected-control-admin-lifecycle-regression.yml
          .github/workflows/sprint25-policy-administration-delivery-regression.yml
          .github/workflows/sprint26-identity-credential-verification-regression.yml
          .github/workflows/sprint27-first-party-session-establishment-regression.yml
          .github/workflows/sprint28-initial-password-enrollment-regression.yml
          .github/workflows/sprint29-first-control-principal-credential-bootstrap-regression.yml
          .github/workflows/sprint30-privileged-totp-mfa-regression.yml
          .github/workflows/sprint31-privileged-reauthentication-step-up-regression.yml
          .github/workflows/sprint33-recovery-bound-password-reset-regression.yml
          .github/workflows/sprint34-authenticated-password-change-regression.yml
          .github/workflows/sprint35-privileged-totp-recovery-regression.yml
          EOF
          sort -o /tmp/sprint37-preservation-compatibility-paths /tmp/sprint37-preservation-compatibility-paths
          test "$(sha256sum /tmp/sprint37-preservation-compatibility-paths | awk '{print $1}')" = "fc2b578fc9d090dfce1fd34c5acfa7a07f065979a94f62becb3dc54dee664920"

          cat > /tmp/sprint37-entry-gate-paths <<'EOF'
          docs/SPRINT_37_FIRST_PARTY_ALL_SESSION_TERMINATION_ENTRY_GATE.md
          EOF
          sort -o /tmp/sprint37-entry-gate-paths /tmp/sprint37-entry-gate-paths
          test "$(sha256sum /tmp/sprint37-entry-gate-paths | awk '{print $1}')" = "0a3fe02e88dd12689eee39b1940642e61a91afb1bc985086a6cbdd9a10d30e2b"

          cat > /tmp/sprint37-schema-source-envelope-gate-paths <<'EOF'
          docs/SPRINT_37_FIRST_PARTY_ALL_SESSION_TERMINATION_SCHEMA_SOURCE_ENVELOPE_GATE.md
          EOF
          sort -o /tmp/sprint37-schema-source-envelope-gate-paths /tmp/sprint37-schema-source-envelope-gate-paths
          test "$(sha256sum /tmp/sprint37-schema-source-envelope-gate-paths | awk '{print $1}')" = "872d2c9cc2e535bfc2882ad64927cc9873fe001af4ece3bb75308e66d1008b32"

          cat > /tmp/sprint37-source-paths <<'EOF'
          .github/workflows/sprint35-privileged-totp-recovery-regression.yml
          .github/workflows/sprint36-first-party-session-inventory-revocation-regression.yml
          .github/workflows/sprint37-first-party-all-session-termination-regression.yml
          apps/web/app/Application/Identity/FirstPartySessionAuthorityRepository.php
          apps/web/app/Application/Identity/FirstPartySessionAuthorityService.php
          apps/web/app/Delivery/Http/Identity/FirstPartySessionControlController.php
          apps/web/app/Infrastructure/Identity/LaravelFirstPartySessionAuthorityRepository.php
          apps/web/routes/web.php
          apps/web/tests/first-party-session-all-session-termination.php
          apps/web/tests/first-party-session-inventory-revocation.php
          docs/FIRST_PARTY_ALL_SESSION_TERMINATION_FOUNDATION.md
          EOF
          sort -o /tmp/sprint37-source-paths /tmp/sprint37-source-paths
          test "$(sha256sum /tmp/sprint37-source-paths | awk '{print $1}')" = "a221779e05b1e8ab220610b5068be5d1eb01bc08b516b338ba8f22373e7d89d0"

          cat > /tmp/post-sprint37-preservation-paths <<'EOF'
          .github/workflows/sprint35-privileged-totp-recovery-regression.yml
          .github/workflows/sprint36-first-party-session-inventory-revocation-regression.yml
          .github/workflows/sprint37-first-party-all-session-termination-regression.yml
          EOF
          sort -o /tmp/post-sprint37-preservation-paths /tmp/post-sprint37-preservation-paths
          test "$(sha256sum /tmp/post-sprint37-preservation-paths | awk '{print $1}')" = "93fe19acad52a31981ecea81ab1dc65c730f0f01729959ca6eaedb0de5b128b7"

          cat > /tmp/post-sprint38-preservation-paths <<'EOF'
          .github/workflows/sprint35-privileged-totp-recovery-regression.yml
          .github/workflows/sprint36-first-party-session-inventory-revocation-regression.yml
          .github/workflows/sprint37-first-party-all-session-termination-regression.yml
          .github/workflows/sprint38-first-party-session-absolute-lifetime-regression.yml
          EOF
          sort -o /tmp/post-sprint38-preservation-paths /tmp/post-sprint38-preservation-paths
          test "$(sha256sum /tmp/post-sprint38-preservation-paths | awk '{print $1}')" = "f6064e6563ec987fc487162fc29285870fab4869509a626c1b9a9280dc6ebafe"

          cat > /tmp/post-sprint37-reconciliation-paths <<'EOF'
          docs/ai/AI_NEXT_TASK.md
          docs/ai/AI_POST_SPRINT_37_CANONICAL_STATE.md
          EOF
          sort -o /tmp/post-sprint37-reconciliation-paths /tmp/post-sprint37-reconciliation-paths
          test "$(sha256sum /tmp/post-sprint37-reconciliation-paths | awk '{print $1}')" = "2b3a711f5cb921dea0fb51a005c0bc742186bce526a0a7e87b10215733215dbe"

          cat > /tmp/post-sprint38-reconciliation-paths <<'EOF'
          docs/ai/AI_NEXT_TASK.md
          docs/ai/AI_POST_SPRINT_38_CANONICAL_STATE.md
          EOF
          sort -o /tmp/post-sprint38-reconciliation-paths /tmp/post-sprint38-reconciliation-paths
          test "$(sha256sum /tmp/post-sprint38-reconciliation-paths | awk '{print $1}')" = "e1bd5f1acb858e3b8e91f3b57dfe8505c4142564142bf9a32b98240c1dd9c472"

          cat > /tmp/sprint38-entry-gate-paths <<'EOF'
          docs/SPRINT_38_FIRST_PARTY_SESSION_ABSOLUTE_LIFETIME_ENTRY_GATE.md
          EOF
          sort -o /tmp/sprint38-entry-gate-paths /tmp/sprint38-entry-gate-paths
          test "$(sha256sum /tmp/sprint38-entry-gate-paths | awk '{print $1}')" = "b5e631b39dee456c18e2f14ab3266db599a97d3b5f3778c8d8dfdd3243658434"

          cat > /tmp/sprint39-entry-gate-paths <<'EOF'
          docs/SPRINT_39_FIRST_PARTY_SESSION_ORGANIZATIONAL_ACCESS_REVALIDATION_ENTRY_GATE.md
          EOF
          sort -o /tmp/sprint39-entry-gate-paths /tmp/sprint39-entry-gate-paths
          test "$(sha256sum /tmp/sprint39-entry-gate-paths | awk '{print $1}')" = "b2c4936a3315788100b47537b32474e7079143942c38684cf2394628f1084dd2"

          cat > /tmp/sprint39-schema-source-envelope-gate-paths <<'EOF'
          docs/SPRINT_39_FIRST_PARTY_SESSION_ORGANIZATIONAL_ACCESS_REVALIDATION_SCHEMA_SOURCE_ENVELOPE_GATE.md
          EOF
          sort -o /tmp/sprint39-schema-source-envelope-gate-paths /tmp/sprint39-schema-source-envelope-gate-paths
          test "$(sha256sum /tmp/sprint39-schema-source-envelope-gate-paths | awk '{print $1}')" = "c66722c0e61aac85deb260fb5f8989aeae55cacdd61bb60ed9beadc161b570af"

          cat > /tmp/sprint39-source-paths <<'EOF'
          .github/workflows/sprint35-privileged-totp-recovery-regression.yml
          .github/workflows/sprint36-first-party-session-inventory-revocation-regression.yml
          .github/workflows/sprint37-first-party-all-session-termination-regression.yml
          .github/workflows/sprint38-first-party-session-absolute-lifetime-regression.yml
          .github/workflows/sprint39-first-party-session-organizational-access-revalidation-regression.yml
          apps/web/app/Delivery/Http/Middleware/EnforceActiveFirstPartySessionAuthorityMiddleware.php
          apps/web/tests/first-party-session-organizational-access-revalidation.php
          docs/FIRST_PARTY_SESSION_ORGANIZATIONAL_ACCESS_REVALIDATION_FOUNDATION.md
          EOF
          sort -o /tmp/sprint39-source-paths /tmp/sprint39-source-paths
          test "$(sha256sum /tmp/sprint39-source-paths | awk '{print $1}')" = "2cfc92c34f46375b11bf3fe92f9094cefa598d234133847fdd6629be211f12c4"

          cat > /tmp/sprint38-schema-source-envelope-gate-paths <<'EOF'
          docs/SPRINT_38_FIRST_PARTY_SESSION_ABSOLUTE_LIFETIME_SCHEMA_SOURCE_ENVELOPE_GATE.md
          EOF
          sort -o /tmp/sprint38-schema-source-envelope-gate-paths /tmp/sprint38-schema-source-envelope-gate-paths
          test "$(sha256sum /tmp/sprint38-schema-source-envelope-gate-paths | awk '{print $1}')" = "ce1f2c0f1f1aaa0bab782eab85f6b023e2749cd98835812288711d37117887f9"

          cat > /tmp/sprint38-source-paths <<'EOF'
          .github/workflows/sprint35-privileged-totp-recovery-regression.yml
          .github/workflows/sprint36-first-party-session-inventory-revocation-regression.yml
          .github/workflows/sprint37-first-party-all-session-termination-regression.yml
          .github/workflows/sprint38-first-party-session-absolute-lifetime-regression.yml
          apps/web/app/Application/Identity/FirstPartySessionAuthorityService.php
          apps/web/app/Providers/AppServiceProvider.php
          apps/web/config/oneqay.php
          apps/web/tests/first-party-session-absolute-lifetime.php
          apps/web/tests/first-party-session-inventory-revocation.php
          docs/FIRST_PARTY_SESSION_ABSOLUTE_LIFETIME_FOUNDATION.md
          EOF
          sort -o /tmp/sprint38-source-paths /tmp/sprint38-source-paths
          test "$(sha256sum /tmp/sprint38-source-paths | awk '{print $1}')" = "411950d5602dc7160668c88e08a3941ebccc8bdc82d20bee77ce4004f039d216"

          if [[ "${{ github.event_name }}" = "pull_request" ]]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | sort > /tmp/actual-sprint36-paths
            if cmp -s /tmp/actual-sprint36-paths /tmp/post-sprint36-reconciliation-paths; then
              echo "Recognized exact post-Sprint36 canonical reconciliation successor shape."
            elif cmp -s /tmp/actual-sprint36-paths /tmp/post-sprint36-compatibility-correction-paths; then
              echo "Recognized exact post-Sprint36 two-workflow compatibility correction shape."
            elif cmp -s /tmp/actual-sprint36-paths /tmp/sprint37-preservation-compatibility-paths; then
              echo "Recognized exact 19-path historical preservation predecessor shape."
            elif cmp -s /tmp/actual-sprint36-paths /tmp/sprint37-entry-gate-paths; then
              echo "Recognized exact Sprint37 entry-gate successor shape."
            elif cmp -s /tmp/actual-sprint36-paths /tmp/sprint37-schema-source-envelope-gate-paths; then
              echo "Recognized exact Sprint37 schema/source-envelope gate successor shape."
            elif cmp -s /tmp/actual-sprint36-paths /tmp/sprint37-source-paths; then
              echo "Recognized exact Sprint37 source successor shape."
            elif cmp -s /tmp/actual-sprint36-paths /tmp/post-sprint37-preservation-paths; then
              echo "Recognized exact post-Sprint37 preservation predecessor shape."
            elif cmp -s /tmp/actual-sprint36-paths /tmp/post-sprint38-preservation-paths; then
              echo "Recognized exact post-Sprint38 preservation predecessor shape."
            elif cmp -s /tmp/actual-sprint36-paths /tmp/post-sprint37-reconciliation-paths; then
              echo "Recognized exact post-Sprint37 canonical reconciliation successor shape."
            elif cmp -s /tmp/actual-sprint36-paths /tmp/post-sprint38-reconciliation-paths; then
              echo "Recognized exact post-Sprint38 canonical reconciliation successor shape."
            elif cmp -s /tmp/actual-sprint36-paths /tmp/sprint38-entry-gate-paths; then
              echo "Recognized exact Sprint38 entry-gate successor shape."
            elif cmp -s /tmp/actual-sprint36-paths /tmp/sprint39-entry-gate-paths; then
              echo "Recognized exact Sprint39 organizational-access revalidation entry-gate successor shape."
            elif cmp -s /tmp/actual-sprint36-paths /tmp/sprint39-schema-source-envelope-gate-paths; then
              echo "Recognized exact Sprint39 organizational-access revalidation schema/source-envelope gate successor shape."
            elif cmp -s /tmp/actual-sprint36-paths /tmp/sprint39-source-paths; then
              echo "Recognized exact Sprint39 organizational-access revalidation source successor shape."
            elif cmp -s /tmp/actual-sprint36-paths /tmp/sprint38-schema-source-envelope-gate-paths; then
              echo "Recognized exact Sprint38 schema/source-envelope gate successor shape."
            elif cmp -s /tmp/actual-sprint36-paths /tmp/sprint38-source-paths; then
              echo "Recognized exact Sprint38 source successor shape."
            else
              cmp -s /tmp/actual-sprint36-paths /tmp/sprint36-paths || {
                echo "Sprint36 changed-file envelope mismatch." >&2
                diff -u /tmp/sprint36-paths /tmp/actual-sprint36-paths >&2 || true
                exit 1
              }
            fi
            if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- apps/web/database/migrations/ | grep -E '0000_00_00_00000[1-9]|0000_00_00_00001[0-2]' ; then
              echo "Historical migrations #1-#12 are immutable." >&2
              exit 1
            fi
          fi

      - name: Validate migration thirteen and feature defaults
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/database/migrations/0000_00_00_000013_create_first_party_session_authority.php
          grep -F "ONEQAY_AUTHENTICATION_SESSION_CONTROL_ENABLED" apps/web/config/oneqay.php
          grep -F "env('ONEQAY_AUTHENTICATION_SESSION_CONTROL_ENABLED', false)" apps/web/config/oneqay.php
          grep -F "'idle_ttl_seconds' => 7200" apps/web/config/oneqay.php
          grep -F "'absolute_ttl_seconds' => 43200" apps/web/config/oneqay.php
          grep -F "throw new LogicException('Forward-only generated migration; rollback is not authorized.')" apps/web/database/migrations/0000_00_00_000013_create_first_party_session_authority.php

      - name: Validate PHP runtime and syntax
        shell: bash
        run: |
          set -euo pipefail
          php -r 'if (PHP_VERSION_ID < 80200 || PHP_VERSION_ID >= 80600) { exit(1); }'
          find apps/web/app apps/web/database/migrations apps/web/routes apps/web/tests -type f -name '*.php' -print0 |
            while IFS= read -r -d '' file; do php -l "$file"; done

      - name: Install locked Composer dependencies
        working-directory: apps/web
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run Sprint36 authority regression
        working-directory: apps/web
        run: php tests/first-party-session-inventory-revocation.php

      - name: Preserve full application regression
        working-directory: apps/web
        run: php tests/run.php

      - name: Preserve activation boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "${ONEQAY_PERSISTENCE_ENABLED}" = "false"
          test "${ONEQAY_AUTHENTICATION_SESSION_CONTROL_ENABLED}" = "false"
          ! grep -R --exclude='sprint36-first-party-session-inventory-revocation-regression.yml' -E 'ONEQAY_TECHNICAL_PREVIEW_ENABLED[[:space:]]*=[[:space:]]*true' apps/web .github/workflows
          grep -F 'Technical Preview remains `NO_SCHEMA_CHANGE`.' docs/FIRST_PARTY_SESSION_INVENTORY_REVOCATION_FOUNDATION.md
          grep -F 'Production remains `NO-GO / NOT AUTHORIZED`.' docs/FIRST_PARTY_SESSION_INVENTORY_REVOCATION_FOUNDATION.md
          grep -F 'Updater remains `DISABLED / UNWIRED`.' docs/FIRST_PARTY_SESSION_INVENTORY_REVOCATION_FOUNDATION.md
