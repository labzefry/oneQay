name: Sprint180 Merchant Initial Context Assisted Sign-In Foundation Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint180-assisted-sign-in-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  preserve-sprint180-assisted-sign-in:
    name: preserve-sprint180-assisted-sign-in
    runs-on: ubuntu-latest
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:Y2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2M=
      APP_DEBUG: "false"
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      SESSION_DRIVER: array
      CACHE_STORE: array
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Qualify exact Sprint180 reconciliation envelope
        if: github.event_name == 'pull_request' && github.head_ref == 'sprint180-canonical-reconciliation'
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          mapfile -t paths < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | LC_ALL=C sort)
          expected=(
            ".github/workflows/sprint180-merchant-initial-context-assisted-sign-in-foundation-regression.yml"
            "CHANGELOG.md"
            "PROJECT_MANIFEST.md"
            "README.md"
            "ROADMAP.md"
            "TASKS.md"
          )
          [[ "${#paths[@]}" -eq "${#expected[@]}" ]]
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${paths[@]}")
          actual_hash="$(printf '%s\n' "${paths[@]}" | sha256sum | awk '{print $1}')"
          [[ "$actual_hash" == "eb9b36e214455c09714f9d03f034e85aec06506d43b64be314b2b95b00b4f41b" ]]

      - name: Preserve canonical Sprint180 engineering evidence
        if: github.event_name == 'pull_request' && github.head_ref == 'sprint180-canonical-reconciliation'
        shell: bash
        run: |
          set -euo pipefail
          for FILE in PROJECT_MANIFEST.md README.md CHANGELOG.md TASKS.md ROADMAP.md; do
            grep -Fq '8451470f2eb37b45df53ac0d6f30e73c1e9cb5ad' "$FILE"
            ! grep -Fq '${{ github.event.pull_request.head.sha }}' "$FILE"
          done
          grep -Fq '**Engineering PR:** #787' PROJECT_MANIFEST.md
          grep -Fq 'e4844d47cc99c8f655c09e358b224f45c29513e1' PROJECT_MANIFEST.md
          grep -Fq '2c122014511daaeb8ca1d5cbd2ee4bb184733ed1154e08c8e0000f3b758c9c6c' PROJECT_MANIFEST.md
          grep -Fq 'eb9b36e214455c09714f9d03f034e85aec06506d43b64be314b2b95b00b4f41b' PROJECT_MANIFEST.md

      - name: Preserve existing first-party auth authority
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "Route::post('/auth/login'" apps/web/routes/web.php
          grep -Fq "final class FirstPartySessionController" apps/web/app/Delivery/Http/Identity/FirstPartySessionController.php
          grep -Fq "'tenant_id'," apps/web/app/Delivery/Http/Identity/FirstPartySessionController.php
          grep -Fq "'identity_id'," apps/web/app/Delivery/Http/Identity/FirstPartySessionController.php
          grep -Fq "'organization_id'," apps/web/app/Delivery/Http/Identity/FirstPartySessionController.php
          grep -Fq "'outlet_id'," apps/web/app/Delivery/Http/Identity/FirstPartySessionController.php
          grep -Fq "'device_id'," apps/web/app/Delivery/Http/Identity/FirstPartySessionController.php

      - name: Preserve assisted sign-in security boundary
        shell: bash
        run: |
          set -euo pipefail
          BLADE=apps/web/resources/views/app.blade.php
          PAGE=apps/web/resources/js/pages/Foundation.vue
          grep -Fq "config('merchant_context_bootstrap.grant', [])" "$BLADE"
          grep -Fq "['tenant_id', 'identity_id', 'organization_id', 'outlet_id', 'device_id']" "$BLADE"
          grep -Fq "['local', 'test', 'ci']" "$BLADE"
          grep -Fq "config('database.oneqay_persistence_enabled', false)" "$BLADE"
          grep -Fq "config('oneqay.session_control.enabled', false)" "$BLADE"
          grep -Fq 'count($merchantLoginContext) === 5' "$BLADE"
          grep -Fq 'id="oneqay-merchant-login-context"' "$BLADE"
          ! grep -Fq 'provisioning_id' "$BLADE"
          grep -Fq 'const enabled = entryFlag && merchantContext !== null' "$PAGE"
          grep -Fq '...merchantContext' "$PAGE"
          grep -Fq 'password: password.value' "$PAGE"
          grep -Fq 'v-if="enabled"' "$PAGE"
          ! grep -Fq 'v-model="tenantId"' "$PAGE"
          ! grep -Fq 'v-model="identityId"' "$PAGE"
          ! grep -Fq 'v-model="organizationId"' "$PAGE"
          ! grep -Fq 'v-model="outletId"' "$PAGE"
          ! grep -Fq 'v-model="deviceId"' "$PAGE"
          ! grep -Fq "Route::post('/register" apps/web/routes/web.php

      - name: Preserve operational NO-GO
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" =~ ^(NOT_EXECUTED|EXECUTED)$ ]]
          permission_state="$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)"; [[ "$permission_state" =~ ^(NONE|PROVISIONED)$ ]]; if [[ "$permission_state" == 'PROVISIONED' ]]; then [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" == 'EXECUTED' ]]; fi
          [[ "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" =~ ^(INACTIVE|ACTIVE)$ ]]
          [[ "$(jq -r '.deployment_authority' ops/final-shift-close/STATE.json)" == 'NOT_GRANTED' ]]
          [[ "$(jq -r '.technical_preview_activation' ops/final-shift-close/STATE.json)" == 'NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.production_activation' ops/final-shift-close/STATE.json)" == 'NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.updater_activation' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'SELECTED_NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.selected_target.environment_id' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'oneqay-durable-staging-01' ]]
          [[ "$(jq -r '.selected_target.runtime_class' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'durable-staging' ]]
          [[ "$(jq -r '.selected_target.selection_fingerprint_sha256' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == '6ecc487cb144e634455de69cc43aa39b1f6880a2256c4b1ab33387096513772b' ]]

      - name: Validate PHP and execute assisted sign-in regressions
        shell: bash
        run: |
          set -euo pipefail
          cd apps/web
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          find app bootstrap config routes tests -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do php -l "$file"; done
          composer test
          php tests/merchant-first-party-application-entry.php
          php tests/merchant-initial-context-assisted-sign-in.php
          php tests/merchant-pos-ready-bootstrap.php
          php tests/pos-operations-hub.php

      - name: Setup exact Node LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.19.0

      - name: Type-check and build assisted merchant entry
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts --no-fund
          npm run type-check
          npm run build

      - name: Verify tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
