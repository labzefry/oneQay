name: Sprint116 Final Shift Close Post-Selection Downstream Readiness

# Attribution: Lab | zefry

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/sprint116-final-shift-close-post-selection-downstream-readiness.yml'
      - 'docs/SPRINT116_FINAL_SHIFT_CLOSE_POST_SELECTION_DOWNSTREAM_READINESS.md'
      - 'ops/final-shift-close/POST_SELECTION_DOWNSTREAM_READINESS.json'

permissions:
  contents: read

concurrency:
  group: sprint116-final-shift-close-post-selection-downstream-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify-post-selection-downstream-readiness:
    name: qualify-post-selection-downstream-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Preserve successor-compatible historical regression boundary
        shell: bash
        run: |
          set -euo pipefail
          # Sprint116 is historical after its canonical squash merge.
          # Historical regression validates owned readiness invariants without
          # locking every successor PR to the original Sprint116 three-path envelope.
          test -f docs/SPRINT116_FINAL_SHIFT_CLOSE_POST_SELECTION_DOWNSTREAM_READINESS.md
          test -f ops/final-shift-close/POST_SELECTION_DOWNSTREAM_READINESS.json
          test -f ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json
          test -f ops/final-shift-close/STATE.json

      - name: Validate historical post-selection readiness contract
        shell: bash
        run: |
          set -euo pipefail
          contract=ops/final-shift-close/POST_SELECTION_DOWNSTREAM_READINESS.json
          jq -e . "$contract" >/dev/null
          test "$(jq -r '.contract_state' "$contract")" = 'MATERIALIZED_SOURCE_ONLY'
          test "$(jq -r '.selection_prerequisite.required_selection_state' "$contract")" = 'SELECTED_NOT_AUTHORIZED'
          test "$(jq -r '.selection_prerequisite.current_selection_state' "$contract")" = 'BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET'
          test "$(jq -r '.selection_prerequisite.current_selected_target' "$contract")" = 'null'
          test "$(jq -r '.selection_prerequisite.current_eligibility' "$contract")" = 'BLOCKED_SELECTION_NOT_PERSISTED'
          test "$(jq -r '.downstream_components.migration27_execution.current_eligibility' "$contract")" = 'NOT_ELIGIBLE_SELECTED_TARGET_BINDING_MISSING'
          permission_eligibility="$(jq -r '.downstream_components.permission_provisioning.current_eligibility' "$contract")"
          case "$permission_eligibility" in
            NOT_ELIGIBLE_SELECTED_TARGET_BINDING_MISSING)
              ;;
            NOT_ELIGIBLE_SELECTED_TARGET_BINDING_EVIDENCE_MISSING)
              test "$(jq -r '.downstream_components.permission_provisioning.selected_target_binding_source_materialized' "$contract")" = 'true'
              test "$(jq -r '.downstream_components.permission_provisioning.selected_target_binding_present' "$contract")" = 'false'
              test "$(jq -r '.downstream_components.permission_provisioning.selected_target_binding_execution' "$contract")" = 'NOT_PERFORMED'
              ;;
            *)
              echo "Unexpected permission provisioning eligibility successor state: $permission_eligibility" >&2
              exit 1
              ;;
          esac
          feature_eligibility="$(jq -r '.downstream_components.feature_activation.current_eligibility' "$contract")"
          case "$feature_eligibility" in
            NOT_ELIGIBLE_EXECUTOR_NOT_IMPLEMENTED)
              ;;
            NOT_ELIGIBLE_DISPATCHABLE_EXECUTOR_AND_TRANSPORT_NOT_IMPLEMENTED)
              test "$(jq -r '.downstream_components.feature_activation.source_foundation_materialized' "$contract")" = 'true'
              test "$(jq -r '.downstream_components.feature_activation.dispatchable_executor_materialized' "$contract")" = 'false'
              test "$(jq -r '.downstream_components.feature_activation.configuration_mutation_transport' "$contract")" = 'NOT_IMPLEMENTED'
              test "$(jq -r '.canonical_boundaries.activation_executor_source_foundation' "$contract")" = 'MATERIALIZED_SOURCE_ONLY'
              test "$(jq -r '.canonical_boundaries.feature_activation_executor' "$contract")" = 'NOT_IMPLEMENTED'
              ;;
            *)
              echo "Unexpected feature activation eligibility successor state: $feature_eligibility" >&2
              exit 1
              ;;
          esac
          test "$(jq -r '.downstream_components.runtime_allowlist.current_eligibility' "$contract")" = 'NOT_ELIGIBLE_SELECTED_RUNTIME_NOT_QUALIFIED'
          test "$(jq -r '.source_envelope_sha256' "$contract")" = '6583f7e9e4b1cce966f166c4e650e42e8c106b9c5354e75adceb10ace5688c18'
          test "$(jq -r '.required_target_binding.environment_id' "$contract")" = 'true'
          test "$(jq -r '.required_target_binding.exact_running_source_commit' "$contract")" = 'true'
          test "$(jq -r '.required_target_binding.exact_running_artifact_sha256' "$contract")" = 'true'
          test "$(jq -r '.required_target_binding.selection_fingerprint_sha256' "$contract")" = 'true'
          test "$(jq -r '.required_target_binding.trusted_ingestion_run_id' "$contract")" = 'true'
          test "$(jq -r '.required_target_binding.operator_secrets_or_control_channel_must_be_cryptographically_or_configuration_bound_to_selected_environment' "$contract")" = 'true'
          test "$(jq -r '.required_target_binding.runtime_readback_must_confirm_same_selected_environment_before_mutation' "$contract")" = 'true'

      - name: Prove canonical selection remains blocked and operational state inactive
        shell: bash
        run: |
          set -euo pipefail
          selection=ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json
          state=ops/final-shift-close/STATE.json
          sprint115=ops/final-shift-close/DURABLE_RUNTIME_TARGET_SELECTION_PERSISTENCE_CONTRACT.json
          jq -e . "$selection" >/dev/null
          jq -e . "$state" >/dev/null
          jq -e . "$sprint115" >/dev/null
          test "$(jq -r '.selection_state' "$selection")" = 'BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET'
          test "$(jq -r '.selected_target' "$selection")" = 'null'
          test "$(jq -r '.target_selection_state' "$sprint115")" = 'SELECTED_NOT_AUTHORIZED'
          test "$(jq -r '.target_selected_target_source' "$sprint115")" = 'EXACT_SPRINT111_SELECTOR_OUTPUT_PLUS_TRUSTED_INGESTION_BINDING'
          test "$(jq -r '.migration27.state' "$state")" = 'NOT_EXECUTED'
          test "$(jq -r '.permission_provisioning.state' "$state")" = 'NONE'
          test "$(jq -r '.feature_activation.state' "$state")" = 'INACTIVE'

      - name: Preserve selected-target binding fail-closed progression
        shell: bash
        run: |
          set -euo pipefail
          migration=.github/workflows/final-shift-close-migration27-execution.yml
          permission=.github/workflows/final-shift-close-permission-provisioning.yml
          contract=ops/final-shift-close/POST_SELECTION_DOWNSTREAM_READINESS.json
          grep -Fq 'DURABLE_ACTIVATION_TARGET_SELECTION.json' "$migration"
          grep -Fq 'selection_fingerprint_sha256' "$migration"
          grep -Fq 'final-shift-close-migration27-selected-target-db-binding.yml' "$migration"
          grep -Fq 'DURABLE_ACTIVATION_TARGET_SELECTION.json' "$permission"
          grep -Fq 'selection_fingerprint_sha256' "$permission"
          grep -Fq 'final-shift-close-migration27-selected-target-db-binding.yml' "$permission"
          test "$(jq -r '.downstream_components.permission_provisioning.selected_target_binding_present' "$contract")" = 'false'
          test "$(jq -r '.downstream_components.permission_provisioning.selected_target_binding_execution' "$contract")" = 'NOT_PERFORMED'
          test ! -e .github/workflows/final-shift-close-feature-activation.yml

      - name: Preserve runtime allowlist and downstream fail-closed ordering
        shell: bash
        run: |
          set -euo pipefail
          provider=apps/web/app/Providers/FinalShiftCloseServiceProvider.php
          contract=ops/final-shift-close/POST_SELECTION_DOWNSTREAM_READINESS.json
          grep -Fq "['local', 'test', 'ci']" "$provider"
          test "$(jq -r '.ordering[0]' "$contract")" = 'PERSIST_SELECTED_NOT_AUTHORIZED_TARGET'
          test "$(jq -r '.ordering[1]' "$contract")" = 'BIND_AND_QUALIFY_MIGRATION27_EXECUTION_TO_SELECTED_TARGET'
          test "$(jq -r '.ordering[2]' "$contract")" = 'EXECUTE_AND_PROVE_MIGRATION27_ON_SELECTED_TARGET'
          test "$(jq -r '.ordering[3]' "$contract")" = 'BIND_AND_QUALIFY_PERMISSION_PROVISIONING_TO_SAME_SELECTED_TARGET'
          test "$(jq -r '.ordering[4]' "$contract")" = 'PROVISION_AND_PROVE_POS_SHIFT_CLOSE_ON_SELECTED_TARGET'
          test "$(jq -r '.forbidden_shortcuts | index("RUN_MIGRATION27_AGAINST_UNBOUND_DB_SECRETS") != null' "$contract")" = 'true'
          test "$(jq -r '.forbidden_shortcuts | index("RUN_PERMISSION_PROVISIONING_AGAINST_UNBOUND_DB_SECRETS") != null' "$contract")" = 'true'
          test "$(jq -r '.forbidden_shortcuts | index("TREAT_SELECTED_NOT_AUTHORIZED_AS_ACTIVATION_AUTHORITY") != null' "$contract")" = 'true'
          test "$(jq -r '.forbidden_shortcuts | index("TREAT_STATE_JSON_AS_LIVE_RUNTIME_EVIDENCE") != null' "$contract")" = 'true'

      - name: Preserve Sprint116 source-only no-go disposition
        shell: bash
        run: |
          set -euo pipefail
          doc=docs/SPRINT116_FINAL_SHIFT_CLOSE_POST_SELECTION_DOWNSTREAM_READINESS.md
          grep -Fq 'POST_SELECTION_DOWNSTREAM_READINESS_CONTRACT = MATERIALIZED_SOURCE_ONLY' "$doc"
          grep -Fq 'CURRENT_SELECTION_STATE = BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET' "$doc"
          grep -Fq 'SELECTED_TARGET = NONE' "$doc"
          grep -Fq 'MIGRATION_27_EXECUTION = NOT_PERFORMED' "$doc"
          grep -Fq 'PERMISSION_PROVISIONING = NONE' "$doc"
          grep -Fq 'FEATURE_ACTIVATION = INACTIVE' "$doc"
          grep -Fq 'DEPLOYMENT_AUTHORITY = NOT_GRANTED' "$doc"
          grep -Fq 'TECHNICAL_PREVIEW_ACTIVATION = NOT_AUTHORIZED' "$doc"
          grep -Fq 'PRODUCTION_ACTIVATION = NOT_AUTHORIZED' "$doc"
          grep -Fq 'UPDATER_ACTIVATION = INACTIVE' "$doc"

      - name: Confirm tracked source remains unchanged
        shell: bash
        run: git diff --exit-code

# Author by Lab | zefry
