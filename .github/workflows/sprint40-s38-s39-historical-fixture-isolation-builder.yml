name: Sprint40 Sprint38 Sprint39 Historical Fixture Isolation Builder

# Temporary branch-local construction workflow. Final PR excludes this file.
# Attribution: Lab | zefry

on:
  push:
    branches:
      - ci/sprint40-s38-s39-historical-fixture-isolation-builder

permissions:
  contents: write

concurrency:
  group: sprint40-s38-s39-historical-fixture-isolation-builder
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact builder branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ci/sprint40-s38-s39-historical-fixture-isolation-builder
          fetch-depth: 0

      - name: Materialize exact six-workflow correction
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/sprint40_fixture_isolation_builder.py
          rm '.github/scripts/sprint40_fixture_isolation_builder.py'
          rm '.github/workflows/sprint40-s38-s39-historical-fixture-isolation-builder.yml'
          git add -A
          git diff --cached --name-only | sort >/tmp/s40-fixture-isolation-staged.txt
          grep -vFx '.github/scripts/sprint40_fixture_isolation_builder.py' /tmp/s40-fixture-isolation-staged.txt | grep -vFx '.github/workflows/sprint40-s38-s39-historical-fixture-isolation-builder.yml' >/tmp/s40-fixture-isolation-final.txt
          test "$(wc -l </tmp/s40-fixture-isolation-final.txt)" -eq 6
          test "$(sha256sum /tmp/s40-fixture-isolation-final.txt | awk '{print $1}')" = '671946562a3eef1375d87b70936bac263aa18f660d6ea274406ed57f1c653351'
          grep -Fq 'restore_sprint40_fixture' '.github/workflows/sprint38-first-party-session-absolute-lifetime-regression.yml'
          grep -Fq 'restore_sprint40_fixture' '.github/workflows/sprint39-first-party-session-organizational-access-revalidation-regression.yml'
          git config user.name 'labzefry'
          git config user.email 'lab.zefa@gmail.com'
          git commit -m 'ci: isolate Sprint38 and Sprint39 historical fixtures for Sprint40'
          echo "FINAL_CORRECTION_COMMIT=$(git rev-parse HEAD)"
          echo "FINAL_CORRECTION_TREE=$(git rev-parse HEAD^{tree})"
          git push origin HEAD:ci/sprint40-s38-s39-historical-fixture-isolation-builder
