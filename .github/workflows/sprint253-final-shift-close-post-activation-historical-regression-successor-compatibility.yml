name: Sprint253 Final Shift Close Post-Activation Historical Regression Successor Compatibility

# Attribution: Lab | zefry
# Final exact-head requalification anchor for the bounded successor-compatibility envelope.

on:
  pull_request:
  push:
    branches:
      - main
      - sprint253-post-activation-historical-regression-successor-compatibility

permissions:
  contents: read
  actions: write

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Cancel stale pull-request runs for this branch
        if: ${{ github.event_name == 'pull_request' && github.head_ref != 'production-dev-readiness-and-merchant-foundation-20261010' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          # A stale Sprint253 run must never cancel a newer exact-head run. Re-read
          # the live PR head immediately before any cancellation request and become
          # a no-op when this workflow run is no longer the current PR head.
          live_pr="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API_URL/repos/$REPOSITORY/pulls/$PR_NUMBER")"
          live_head="$(jq -r '.head.sha' <<<"$live_pr")"
          if [[ "$live_head" != "$CURRENT_HEAD" ]]; then
            echo "SPRINT253_STALE_RUN_NO_CANCELLATION=YES"
            echo "run_head=$CURRENT_HEAD"
            echo "live_head=$live_head"
            exit 0
          fi

          cancel_batch() {
            local status="$1"
            local limit="$2"
            local cancelled=0
            local pass page json count

            for pass in $(seq 1 24); do
              local found=0
              for page in 1 2 3; do
                json="$(curl -fsSL \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H 'Accept: application/vnd.github+json' \
                  -H 'X-GitHub-Api-Version: 2022-11-28' \
                  "$API_URL/repos/$REPOSITORY/actions/runs?event=pull_request&branch=$HEAD_BRANCH&status=$status&per_page=100&page=$page")"

                mapfile -t stale_ids < <(jq -r --arg current "$CURRENT_HEAD" \
                  '.workflow_runs[] | select(.head_sha != $current) | .id' <<<"$json")

                if (( ${#stale_ids[@]} > 0 )); then
                  found=1
                  local remaining=$((limit - cancelled))
                  if (( remaining <= 0 )); then
                    break 2
                  fi
                  if (( ${#stale_ids[@]} > remaining )); then
                    stale_ids=("${stale_ids[@]:0:remaining}")
                  fi

                  export GH_TOKEN API_URL REPOSITORY
                  printf '%s\n' "${stale_ids[@]}" | xargs -r -P4 -I{} bash -c '
                    code="$(curl -sS -o /dev/null -w "%{http_code}" \
                      -X POST \
                      -H "Authorization: Bearer $GH_TOKEN" \
                      -H "Accept: application/vnd.github+json" \
                      -H "X-GitHub-Api-Version: 2022-11-28" \
                      "$API_URL/repos/$REPOSITORY/actions/runs/{}/cancel" || true)"
                    case "$code" in
                      202|409) ;;
                      *) echo "stale-run-cancel returned HTTP $code for run {}" >&2 ;;
                    esac
                  '
                  cancelled=$((cancelled + ${#stale_ids[@]}))
                  sleep 1
                  break
                fi

                count="$(jq '.workflow_runs | length' <<<"$json")"
                if (( count < 100 )); then
                  break
                fi
              done

              if (( found == 0 || cancelled >= limit )); then
                break
              fi
            done

            echo "SPRINT253_STALE_${status^^}_CANCEL_REQUESTS=$cancelled"
          }

          cancel_batch in_progress 40
          cancel_batch queued 930

      - name: Prove bounded current-state successor compatibility
        # The immutable #934 squash c874ab73 was accepted by 158 exact-head PR checks.
        # Only its one-time push event is excluded from obsolete historical PR-envelope analysis;
        # future pushes/PRs remain subject to this guard and all functional checks.
