name: Sprint253 Final Shift Close Post-Activation Historical Regression Successor Compatibility

on:
  pull_request:
  push:
    branches:
      - main
      - sprint253-post-activation-historical-regression-successor-compatibility

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Prove historical workflows accept active successor state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY2'
          from pathlib import Path
          import re
          inactive = re.compile(r'\bINACTIVE\b')
          active = re.compile(r'\bACTIVE\b')
          offenders = []
          def activation_related(line):
              lower = line.lower()
              return 'feature_activation' in lower or 'feature activation' in lower or '.feature_activation.state' in lower
          def predecessor_only_guard(line):
              if not activation_related(line) or not inactive.search(line) or active.search(line):
                  return False
              stripped = line.strip()
              if 'grep ' in stripped:
                  return False
              if '[[' in stripped and re.search(r'(?:==|=|=~)\s*[\'\"]?INACTIVE[\'\"]?', stripped):
                  return True
              if re.search(r'\btest\s+.+?\s+=\s*[\'\"]?INACTIVE[\'\"]?(?:\s|;|$)', stripped):
                  return True
              return False
          for path in sorted(Path('.github/workflows').glob('sprint*.yml')):
              if path.name.startswith('sprint253-'):
                  continue
              for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), start=1):
                  if predecessor_only_guard(line):
                      offenders.append(f'{path}:{number}:{line.strip()}')
          if offenders:
              raise SystemExit('\n'.join(offenders))
          print('POST_ACTIVATION_HISTORICAL_SUCCESSOR_COMPATIBILITY_OK')
          PY2
