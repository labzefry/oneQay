name: Sprint253 Final Shift Close Post-Activation Historical Regression Successor Compatibility

# Attribution: Lab | zefry
# Final exact-head requalification anchor for the bounded successor-compatibility envelope.

on:
  pull_request:
  push:
    branches:
      - main
      - sprint253-post-activation-historical-regression-successor-compatibility

permissions:
  contents: read
  actions: write

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Cancel stale pull-request runs for this branch
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          cancel_batch() {
            local status="$1"
            local limit="$2"
            local cancelled=0
            local pass page json count

            for pass in $(seq 1 24); do
              local found=0
              for page in 1 2 3; do
                json="$(curl -fsSL \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H 'Accept: application/vnd.github+json' \
                  -H 'X-GitHub-Api-Version: 2022-11-28' \
                  "$API_URL/repos/$REPOSITORY/actions/runs?event=pull_request&branch=$HEAD_BRANCH&status=$status&per_page=100&page=$page")"

                mapfile -t stale_ids < <(jq -r --arg current "$CURRENT_HEAD" \
                  '.workflow_runs[] | select(.head_sha != $current) | .id' <<<"$json")

                if (( ${#stale_ids[@]} > 0 )); then
                  found=1
                  local remaining=$((limit - cancelled))
                  if (( remaining <= 0 )); then
                    break 2
                  fi
                  if (( ${#stale_ids[@]} > remaining )); then
                    stale_ids=("${stale_ids[@]:0:remaining}")
                  fi

                  export GH_TOKEN API_URL REPOSITORY
                  printf '%s\n' "${stale_ids[@]}" | xargs -r -P4 -I{} bash -c '
                    code="$(curl -sS -o /dev/null -w "%{http_code}" \
                      -X POST \
                      -H "Authorization: Bearer $GH_TOKEN" \
                      -H "Accept: application/vnd.github+json" \
                      -H "X-GitHub-Api-Version: 2022-11-28" \
                      "$API_URL/repos/$REPOSITORY/actions/runs/{}/cancel" || true)"
                    case "$code" in
                      202|409) ;;
                      *) echo "stale-run-cancel returned HTTP $code for run {}" >&2 ;;
                    esac
                  '
                  cancelled=$((cancelled + ${#stale_ids[@]}))
                  sleep 1
                  break
                fi

                count="$(jq '.workflow_runs | length' <<<"$json")"
                if (( count < 100 )); then
                  break
                fi
              done

              if (( found == 0 || cancelled >= limit )); then
                break
              fi
            done

            echo "SPRINT253_STALE_${status^^}_CANCEL_REQUESTS=$cancelled"
          }

          # Bound requests below the per-job API budget while preferentially
          # removing stale runs that consume runner capacity ahead of exact head.
          cancel_batch in_progress 40
          cancel_batch queued 930

      - name: Prove bounded current-state successor compatibility
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess

          old_fp = '858280ea3575317e8d88eed7009c770530097e261c391b2869fa81ad7c8546ce'
          old_source = '5be28a3c001738373588b58e9d29832c46402de1'
          old_artifact = '66be23792478fb191f912571b35076c42783b9733cdb3fb514b549d22ec90dd7'

          base = os.environ.get('PR_BASE_SHA') or os.environ.get('PUSH_BEFORE_SHA')
          head = os.environ.get('PR_HEAD_SHA') or os.environ.get('PUSH_AFTER_SHA')
          if not base or not head or set(base) == {'0'}:
              raise SystemExit('Unable to resolve bounded comparison range.')

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', base, head], text=True
          ).splitlines()
          workflows = [
              Path(p) for p in changed
              if p.startswith('.github/workflows/sprint')
              and p.endswith('.yml')
              and not Path(p).name.startswith('sprint253-')
              and Path(p).exists()
          ]
          if not workflows:
              raise SystemExit('No historical Sprint workflow is present in the Sprint253 compatibility envelope.')

          inactive = re.compile(r'\bINACTIVE\b')
          active = re.compile(r'\bACTIVE\b')
          step_start = re.compile(r'^(\s*)- name:\s*')
          offenders = []

          def predecessor_only_activation(line):
              # Only canonical live-state assertions are successor-sensitive.
              # Historical contract/source fields such as required_feature_activation_state
              # remain valid provenance and must not be rewritten as if they were live state.
              if '.feature_activation.state' not in line or not inactive.search(line) or active.search(line):
                  return False
              stripped = line.strip()
              if 'grep ' in stripped:
                  return False
              if '[[' in stripped and re.search(r'(?:==|=|=~)\s*[\'\"]?INACTIVE[\'\"]?', stripped):
                  return True
              return bool(re.search(r'\btest\s+.+?\s+=\s*[\'\"]?INACTIVE[\'\"]?(?:\s|;|$)', stripped))

          for path in sorted(workflows):
              lines = path.read_text(encoding='utf-8').splitlines()
              for number, line in enumerate(lines, start=1):
                  if predecessor_only_activation(line):
                      offenders.append(f'{path}:{number}:feature predecessor-only guard')
                  if "jq -r '.migration27.state'" in line and 'NOT_EXECUTED' in line and 'EXECUTED' not in line.replace('NOT_EXECUTED', ''):
                      offenders.append(f'{path}:{number}:migration predecessor-only guard')
                  if "jq -r '.permission_provisioning.state'" in line and 'NONE' in line and 'PROVISIONED' not in line:
                      offenders.append(f'{path}:{number}:permission predecessor-only guard')
                  if "jq -r '.selected_target.selection_fingerprint_sha256'" in line and old_fp in line:
                      offenders.append(f'{path}:{number}:stale selected-target fingerprint')
                  if "jq -r '.selected_target.exact_running_source_commit'" in line and old_source in line:
                      offenders.append(f'{path}:{number}:stale selected-target running source')
                  if "jq -r '.selected_target.exact_running_artifact_sha256'" in line and old_artifact in line:
                      offenders.append(f'{path}:{number}:stale selected-target running artifact')

              starts = [i for i, line in enumerate(lines) if step_start.match(line)]
              starts.append(len(lines))
              for pos in range(max(0, len(starts) - 1)):
                  start, end = starts[pos], starts[pos + 1]
                  chunk = '\n'.join(lines[start:end])
                  full_pr_diff = 'git diff --name-only' in chunk and (
                      ('BASE_SHA' in chunk and 'HEAD_SHA' in chunk)
                      or 'github.event.pull_request' in chunk
                  )
                  exact_global_lock = any(marker in chunk for marker in (
                      'diff -u /tmp/expected',
                      'sha256sum /tmp/',
                      'wc -l < /tmp/',
                  ))
                  if full_pr_diff and exact_global_lock:
                      offenders.append(f'{path}:exact full-PR historical envelope lock')

          if offenders:
              raise SystemExit('\n'.join(offenders))

          print(f'SPRINT253_SUCCESSOR_COMPATIBILITY_OK workflows={len(workflows)}')
          PY

      - name: Preserve operational no-go boundaries
        shell: bash
        run: |
          set -euo pipefail
          state=ops/final-shift-close/STATE.json
          selection=ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json
          test "$(jq -r '.migration27.state' "$state")" = 'EXECUTED'
          test "$(jq -r '.permission_provisioning.state' "$state")" = 'PROVISIONED'
          test "$(jq -r '.feature_activation.state' "$state")" = 'ACTIVE'
          test "$(jq -r '.deployment_authority' "$state")" = 'NOT_GRANTED'
          test "$(jq -r '.technical_preview_activation' "$state")" = 'NOT_AUTHORIZED'
          test "$(jq -r '.production_activation' "$state")" = 'NOT_AUTHORIZED'
          test "$(jq -r '.updater_activation' "$state")" = 'INACTIVE'
          test "$(jq -r '.selection_state' "$selection")" = 'SELECTED_NOT_AUTHORIZED'
          selected_target_source="$(jq -r '.selected_target.exact_running_source_commit' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)"; [[ "$selected_target_source" =~ ^[0-9a-f]{40}$ ]]
          selected_target_artifact="$(jq -r '.selected_target.exact_running_artifact_sha256' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)"; [[ "$selected_target_artifact" =~ ^[0-9a-f]{64}$ ]]
          selected_target_fingerprint="$(jq -r '.selected_target.selection_fingerprint_sha256' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)"; [[ "$selected_target_fingerprint" =~ ^[0-9a-f]{64}$ ]]

      - name: Verify tracked source cleanliness
        shell: bash
        run: git diff --exit-code
