# Sprint57 immutable sale-to-shift binding Sprint50 compatibility — Lab | zefry
# Sprint54 bounded 12-workflow source-preservation correction — Lab | zefry
# Sprint54 bounded successor compatibility predecessor — Lab | zefry
# Sprint53 bounded third historical fixture compatibility closure — Lab | zefry
# Sprint53 bounded second historical fixture compatibility closure — Lab | zefry
name: Sprint50 JRN-007 Completed Sale Void Regression

# Author by Lab | zefry

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sprint50-jrn007-completed-sale-void-regression.yml'
      - 'apps/web/app/Application/Authorization/PosPermission.php'
      - 'apps/web/app/Application/Pos/DurablePosSaleRepository.php'
      - 'apps/web/app/Application/Pos/SaleVoidCommand.php'
      - 'apps/web/app/Application/Pos/SaleVoidResult.php'
      - 'apps/web/app/Application/Pos/VoidSale.php'
      - 'apps/web/app/Delivery/Http/Pos/PosSaleVoidController.php'
      - 'apps/web/app/Infrastructure/Pos/LaravelDurablePosSaleRepository.php'
      - 'apps/web/app/Providers/AppServiceProvider.php'
      - 'apps/web/config/oneqay.php'
      - 'apps/web/database/migrations/0000_00_00_000019_create_pos_sale_void_foundation.php'
      - 'apps/web/routes/web.php'
      - 'apps/web/tests/pos-sale-void-durable.php'
      - 'docs/JRN_007_POS_COMPLETED_SALE_VOID_FOUNDATION.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint50-jrn007-sale-void-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sprint50-jrn007-sale-void:
    name: sprint50-jrn007-sale-void
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnY=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      ONEQAY_PERSISTENCE_ENABLED: 'true'
      ONEQAY_AUTHENTICATION_SESSION_CONTROL_ENABLED: 'true'
      ONEQAY_POS_SALE_COMPLETION_ENABLED: 'true'
      ONEQAY_POS_SALE_VOID_ENABLED: 'true'
      SESSION_DRIVER: array
      CACHE_STORE: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce exact Sprint50 source envelope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$base" "$head" | sort > /tmp/s50-source-paths
          count="$(wc -l < /tmp/s50-source-paths)"
          fingerprint="$(sha256sum /tmp/s50-source-paths | awk '{print $1}')"
          echo 'ONEQAY_SPRINT51_JRN008_SOURCE_SUCCESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT52_JRN007_SOURCE_SUCCESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT53_JRN010_PREREQ_SOURCE_SUCCESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT54_JRN010_PREREQ_SOURCE_SUCCESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT51_COMPATIBILITY_PREDECESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT57_SOURCE_SUCCESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT57_S50_COMPATIBILITY=false' >> "$GITHUB_ENV"
          isolate_sprint74_migration_successors() {
            for index in $(seq 20 25); do
              migration="$(find apps/web/database/migrations -maxdepth 1 -type f -name "$(printf '0000_00_00_%06d_*' "$index")" -print -quit)"
              if [[ -n "$migration" && -f "$migration" ]]; then
                git update-index --assume-unchanged "$migration"
                rm -f "$migration"
              fi
            done
          }

          echo 'ONEQAY_SPRINT74_POS_HISTORICAL=false' >> "$GITHUB_ENV"
          if [[ "$count" -eq 5 && "$fingerprint" == '43e53ee63fdf476b91f9dd2fa0d2d6ab32f710e0d26e144ad119f4da60a2149c' ]]; then
            for expected in \
              '.github/workflows/sprint90-post-close-sale-mutation-freeze-regression.yml' \
              'apps/web/app/Infrastructure/Pos/LaravelDurablePosSaleRepository.php' \
              'apps/web/app/Infrastructure/Pos/LaravelSaleCashRefundRepository.php' \
              'apps/web/tests/pos-post-close-sale-mutation-freeze.php' \
              'docs/SPRINT90_POST_CLOSE_SALE_MUTATION_FREEZE.md'
            do
              grep -Fxq "$expected" /tmp/s50-source-paths
            done
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations
            for repository in \
              'apps/web/app/Infrastructure/Pos/LaravelDurablePosSaleRepository.php' \
              'apps/web/app/Infrastructure/Pos/LaravelSaleCashRefundRepository.php'
            do
              git update-index --assume-unchanged "$repository"
              git show "$base:$repository" > "$repository"
            done
            for index in $(seq 20 27); do
              migration="$(find apps/web/database/migrations -maxdepth 1 -type f -name "$(printf '0000_00_00_%06d_*' "$index")" -print -quit)"
              if [[ -n "$migration" && -f "$migration" ]]; then
                git update-index --assume-unchanged "$migration"
                rm -f "$migration"
              fi
            done
            echo 'ONEQAY_SPRINT74_POS_HISTORICAL=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint90 post-close mutation source at Sprint50 migration #19 horizon.'
          elif [[ "$count" -eq 6 && "$fingerprint" == '232e112191b5ea0fb6b7aa402443692af512bcf66101f0d235525862cb586462' ]]; then
            for expected in \
              '.github/workflows/m7-4-pos-core-synthetic-regression.yml' \
              '.github/workflows/sprint46-jrn006-durable-sale-completion-regression.yml' \
              '.github/workflows/sprint49-jrn006-active-shift-precondition-regression.yml' \
              '.github/workflows/sprint50-jrn007-completed-sale-void-regression.yml' \
              '.github/workflows/sprint52-jrn007-bounded-full-cash-refund-regression.yml' \
              '.github/workflows/sprint57-jrn010-prerequisite-sale-shift-binding-regression.yml'
            do
              grep -Fxq "$expected" /tmp/s50-source-paths
            done
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations
            for index in $(seq 20 27); do
              migration="$(find apps/web/database/migrations -maxdepth 1 -type f -name "$(printf '0000_00_00_%06d_*' "$index")" -print -quit)"
              if [[ -n "$migration" && -f "$migration" ]]; then
                git update-index --assume-unchanged "$migration"
                rm -f "$migration"
              fi
            done
            echo 'ONEQAY_SPRINT74_POS_HISTORICAL=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint90 six-workflow compatibility self-qualification at Sprint50 migration #19 horizon.'
          elif [[ "$count" -eq 6 && "$fingerprint" == 'cc40f08beda780e4aa4795f29aa7533bbde1029d11855d43f180812502c4d80b' ]]; then
            for expected in \
              '.github/workflows/sprint69-jrn010-prerequisite-cash-variance-explanation-source-regression.yml' \
              'apps/web/app/Application/Authorization/PosPermission.php' \
              'apps/web/app/Application/Pos/RecordCashVarianceExplanation.php' \
              'apps/web/tests/pos-cash-variance-explanation-authorization.php' \
              'apps/web/tests/pos-cash-variance-explanation-durable.php' \
              'docs/JRN_010_PREREQUISITE_CASH_VARIANCE_EXPLANATION_AUTHORIZATION_SOURCE_FOUNDATION.md'
            do
              grep -Fxq "$expected" /tmp/s50-source-paths
            done
            isolate_sprint74_migration_successors
            echo 'ONEQAY_SPRINT74_POS_HISTORICAL=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint74 authorization source successor shape at migration #19 horizon.'
          elif [[ "$count" -eq 8 && "$fingerprint" == '3e5b516b17bfc4b2b4e8694248672ff7a4298a3e080e0617a70b1bb1d8aa6194' ]]; then
            for expected in \
              '.github/workflows/sprint46-jrn006-durable-sale-completion-regression.yml' \
              '.github/workflows/sprint47-jrn004-catalog-preparation-regression.yml' \
              '.github/workflows/sprint48-jrn005-shift-register-opening-regression.yml' \
              '.github/workflows/sprint50-jrn007-completed-sale-void-regression.yml' \
              '.github/workflows/sprint51-jrn008-bounded-outlet-inventory-baseline-regression.yml' \
              '.github/workflows/sprint52-jrn007-bounded-full-cash-refund-regression.yml' \
              '.github/workflows/sprint53-jrn010-prerequisite-shift-opening-cash-evidence-regression.yml' \
              '.github/workflows/sprint54-jrn010-prerequisite-shift-closing-cash-evidence-regression.yml'
            do
              grep -Fxq "$expected" /tmp/s50-source-paths
            done
            isolate_sprint74_migration_successors
            echo 'ONEQAY_SPRINT74_POS_HISTORICAL=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint74 POS historical compatibility self-qualification shape at migration #19 horizon.'
          elif [[ "$count" -eq 1 && "$fingerprint" == 'eb31f0e3031eb66daeea92d2a85da337c2860362ca15a8d22187f3b27a34cb0c' ]]; then
            grep -Fxq '.github/workflows/sprint50-jrn007-completed-sale-void-regression.yml' /tmp/s50-source-paths
            echo 'ONEQAY_SPRINT57_S50_COMPATIBILITY=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint57 Sprint50 workflow-only compatibility correction shape.'
          elif [[ "$count" -eq 5 && "$fingerprint" == '26d2d48f114c88d60dc302dccd8d41118bc730c309c9d79b71f5e516731a0b25' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s50-source-paths)" -eq 1
            grep -Fxq 'apps/web/database/migrations/0000_00_00_000024_add_immutable_shift_binding_to_pos_sales.php' /tmp/s50-source-paths
            grep -Fxq 'apps/web/app/Infrastructure/Pos/LaravelDurablePosSaleRepository.php' /tmp/s50-source-paths
            echo 'ONEQAY_SPRINT57_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint57 immutable sale-to-shift binding source successor shape.'
          elif [[ "$count" -eq 14 && "$fingerprint" == '78628976e4dbfea29ecab4b40ec6bfbdf697564668ef028a5cb77a3b53466451' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s50-source-paths)" -eq 1
            grep -Fxq 'apps/web/database/migrations/0000_00_00_000019_create_pos_sale_void_foundation.php' /tmp/s50-source-paths
          elif [[ "$count" -eq 15 && "$fingerprint" == '325559599c79ba68340eac34569f8e5513aa4957b1ddf2515007b98b2cc1f15f' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s50-source-paths)" -eq 1
            grep -Fxq 'apps/web/database/migrations/0000_00_00_000020_create_pos_inventory_baseline_foundation.php' /tmp/s50-source-paths
            echo 'ONEQAY_SPRINT51_JRN008_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
          elif [[ "$count" -eq 14 && "$fingerprint" == 'ad4f6c62c820bdc59d7c1c8550ffeec0a4a0718ba4388a516418d50468d7e9d5' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s50-source-paths)" -eq 1
            grep -Fxq 'apps/web/database/migrations/0000_00_00_000021_create_pos_sale_cash_refund_foundation.php' /tmp/s50-source-paths
            echo 'ONEQAY_SPRINT51_JRN008_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT52_JRN007_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
          elif [[ "$count" -eq 14 && "$fingerprint" == 'a0914d7db5c1636e909e331e8b72653bc9814eb74e3a3823d7db36bd3b73b624' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s50-source-paths)" -eq 1
            grep -Fxq 'apps/web/database/migrations/0000_00_00_000023_create_pos_shift_closing_cash_evidence_foundation.php' /tmp/s50-source-paths
            echo 'ONEQAY_SPRINT52_JRN007_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT53_JRN010_PREREQ_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT54_JRN010_PREREQ_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
          elif [[ "$count" -eq 14 && "$fingerprint" == '1d75fe26236e2bb56c113713e878e81d3df72cee9aa647b3f7759b9d1bec9164' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s50-source-paths)" -eq 1
            grep -Fxq 'apps/web/database/migrations/0000_00_00_000022_create_pos_shift_opening_cash_evidence_foundation.php' /tmp/s50-source-paths
            echo 'ONEQAY_SPRINT52_JRN007_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT53_JRN010_PREREQ_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
          elif [[ "$count" -eq 12 && "$fingerprint" == '77a408974add7f466ed746b8b47c10d5fec45c8073ab32e0450abd95f206bf1f' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s50-source-paths)" -eq 0
            echo 'ONEQAY_SPRINT53_JRN010_PREREQ_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
          elif [[ "$count" -eq 30 && "$fingerprint" == '930cd1237722f4dd0af03e85d684ffa435adab6a1ae16db96d78243510fd85bc' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s50-source-paths)" -eq 0
            echo 'ONEQAY_SPRINT53_JRN010_PREREQ_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
          elif [[ "$count" -eq 28 && "$fingerprint" == '3b97670674b60c636a23e52551b7ade69a3f545d5d0b4a861fa1c06eae5c0656' ]] || [[ "$count" -eq 29 && "$fingerprint" == 'e56a3e2732f5d5b0b40dd3ae50ec25746cf18bc8bd556d25405e85642c789878' ]]; then
            if [[ "$count" -eq 29 && "$fingerprint" == 'e56a3e2732f5d5b0b40dd3ae50ec25746cf18bc8bd556d25405e85642c789878' ]]; then
              echo 'ONEQAY_SPRINT52_COMPATIBILITY_PREDECESSOR=true' >> "$GITHUB_ENV"
            fi
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s50-source-paths)" -eq 0
            echo 'ONEQAY_SPRINT51_COMPATIBILITY_PREDECESSOR=true' >> "$GITHUB_ENV"
          else
            echo 'Sprint50/JRN-008 changed-file envelope mismatch.' >&2
            exit 1
          fi
          ! grep -Eq '(^|/)(composer\.(json|lock)|package(-lock)?\.json|\.env(\.|$))' /tmp/s50-source-paths

      - name: Preserve migrations one through eighteen and validate migration nineteen
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          migration='apps/web/database/migrations/0000_00_00_000019_create_pos_sale_void_foundation.php'
          migration20='apps/web/database/migrations/0000_00_00_000020_create_pos_inventory_baseline_foundation.php'
          if [[ "${ONEQAY_SPRINT52_COMPATIBILITY_PREDECESSOR:-false}" == 'true' && -f "$migration20" ]]; then
            git update-index --assume-unchanged "$migration20"
            rm -f "$migration20"
          fi
          migration21='apps/web/database/migrations/0000_00_00_000021_create_pos_sale_cash_refund_foundation.php'
          migration22='apps/web/database/migrations/0000_00_00_000022_create_pos_shift_opening_cash_evidence_foundation.php'
          migration23='apps/web/database/migrations/0000_00_00_000023_create_pos_shift_closing_cash_evidence_foundation.php'
          migration24='apps/web/database/migrations/0000_00_00_000024_add_immutable_shift_binding_to_pos_sales.php'
          repository='apps/web/app/Infrastructure/Pos/LaravelDurablePosSaleRepository.php'
          if [[ "${ONEQAY_SPRINT57_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
            test "$changed" = "$migration24"
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration24"
            git update-index --assume-unchanged "$repository"
            git show "$base:$repository" > "$repository"
            for historical_migration in "$migration20" "$migration21" "$migration22" "$migration23" "$migration24"; do
              if [[ -f "$historical_migration" ]]; then git update-index --assume-unchanged "$historical_migration"; rm -f "$historical_migration"; fi
            done
          elif [[ "${ONEQAY_SPRINT57_S50_COMPATIBILITY:-false}" == 'true' ]]; then
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations
            for historical_migration in "$migration20" "$migration21" "$migration22" "$migration23"; do
              if [[ -f "$historical_migration" ]]; then git update-index --assume-unchanged "$historical_migration"; rm -f "$historical_migration"; fi
            done
          elif [[ "${ONEQAY_SPRINT54_JRN010_PREREQ_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
            changed_count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)"
            if [[ "$changed_count" -eq 1 ]]; then printf '%s\n' "$changed" | grep -Fxq "$migration23"; else test "$changed_count" -eq 0; fi
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration23"
            for historical_migration in $migration20 $migration21 $migration22 $migration23; do
              if [[ -f "$historical_migration" ]]; then git update-index --assume-unchanged "$historical_migration"; rm -f "$historical_migration"; fi
            done
          elif [[ "${ONEQAY_SPRINT53_JRN010_PREREQ_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
            changed_count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)"
            if [[ "$changed_count" -eq 1 ]]; then printf '%s\n' "$changed" | grep -Fxq "$migration22"; else test "$changed_count" -eq 0; fi
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration22"
            for historical_migration in $migration20 $migration21 $migration22; do
              if [[ -f "$historical_migration" ]]; then git update-index --assume-unchanged "$historical_migration"; rm -f "$historical_migration"; fi
            done
          elif [[ "${ONEQAY_SPRINT52_JRN007_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration21"
            test "$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sed '/^$/d' | wc -l)" -eq 1
            git diff --diff-filter=A --name-only "$base" "$head" -- apps/web/database/migrations | grep -Fxq "$migration21"
            if [[ -f "$migration20" ]]; then git update-index --assume-unchanged "$migration20"; rm -f "$migration20"; fi
            git update-index --assume-unchanged "$migration21"
            rm -f "$migration21"
          elif [[ "${ONEQAY_SPRINT51_JRN008_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration20"
            test "$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sed '/^$/d' | wc -l)" -eq 1
            git diff --diff-filter=A --name-only "$base" "$head" -- apps/web/database/migrations | grep -Fxq "$migration20"
            git update-index --assume-unchanged "$migration20"
            rm -f "$migration20"
          elif [[ "${ONEQAY_SPRINT51_COMPATIBILITY_PREDECESSOR:-false}" == 'true' ]]; then
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations
          else
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration"
          fi
          mapfile -t migrations < <(find apps/web/database/migrations -maxdepth 1 -type f -name '*.php' -printf '%f\n' | sort)
          test "${#migrations[@]}" -eq 19
          for index in $(seq 1 19); do
            prefix="$(printf '0000_00_00_%06d_' "$index")"
            test "$(printf '%s\n' "${migrations[@]}" | grep -c "^$prefix")" -eq 1
          done
          grep -Fq "Schema::create('oneqay_pos_sale_voids'" "$migration"
          grep -Fq "unique(['tenant_id', 'operation_id']" "$migration"
          grep -Fq "unique(['tenant_id', 'sale_id']" "$migration"
          grep -Fq "throw new LogicException('Forward-only generated migration; rollback is not authorized.');" "$migration"

      - name: Validate source-default authorization and delivery locks
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "public const VOID_SALE = 'pos.sale.void';" apps/web/app/Application/Authorization/PosPermission.php
          grep -Fq "env('ONEQAY_POS_SALE_VOID_ENABLED', false)" apps/web/config/oneqay.php
          grep -Fq "config('oneqay.pos_sale_void.enabled', false)" apps/web/routes/web.php
          grep -Fq "Route::post('/pos/sales/void'" apps/web/routes/web.php
          grep -Fq "'session.active'" apps/web/routes/web.php
          grep -Fq 'RequirePosSessionContextMiddleware::class' apps/web/routes/web.php
          grep -Fq "table('oneqay_pos_sale_voids')" apps/web/app/Infrastructure/Pos/LaravelDurablePosSaleRepository.php
          grep -Fq "'event_type' => 'VOIDED'" apps/web/app/Infrastructure/Pos/LaravelDurablePosSaleRepository.php
          grep -Fq "'FULL_SALE_VOID'" apps/web/app/Infrastructure/Pos/LaravelDurablePosSaleRepository.php

      - name: Preserve Application framework independence
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -F -e 'Illuminate\' -e 'Laravel\' -e 'Schema::' -e 'DB::' \
            apps/web/app/Application/Pos apps/web/app/Application/Authorization/PosPermission.php; then
            echo 'Sprint50 JRN-007 Application framework boundary violated.' >&2
            exit 1
          fi

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find apps/web/app apps/web/database/migrations apps/web/routes apps/web/tests -type f -name '*.php' -print0 |
            while IFS= read -r -d '' file; do php -l "$file"; done

      - name: Install locked dependencies
        working-directory: apps/web
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Reject High or Critical Composer advisories
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          composer audit --locked --format=json > /tmp/oneqay-composer-audit.json
          php -r '
            $data = json_decode(file_get_contents("/tmp/oneqay-composer-audit.json"), true, 512, JSON_THROW_ON_ERROR);
            foreach (($data["advisories"] ?? []) as $items) {
                foreach ($items as $item) {
                    if (in_array(strtolower((string) ($item["severity"] ?? "")), ["high", "critical"], true)) {
                        fwrite(STDERR, "Blocking Composer advisory.\n");
                        exit(1);
                    }
                }
            }
          '

      - name: Run Sprint50 JRN-007 durable sale void regression
