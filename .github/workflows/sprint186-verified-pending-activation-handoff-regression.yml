# Author by Lab | zefry
name: Sprint186 Verified Pending Activation Handoff Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint186-verified-pending-activation-handoff-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify-sprint186-verified-pending-activation-handoff:
    name: qualify-sprint186-verified-pending-activation-handoff
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: oneqay-s186-root
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -poneqay-s186-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      APP_DEBUG: "false"
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      SESSION_DRIVER: array
      CACHE_STORE: array
      LOG_CHANNEL: stderr
      ONEQAY_BUILD_PROVENANCE: github-actions:${{ github.run_id }}:${{ github.run_attempt }}

    steps:
      - name: Checkout exact Sprint186 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Qualify exact Sprint186 engineering envelope
        if: github.event_name == 'pull_request' && github.head_ref == 'sprint186-verified-pending-activation-handoff'
        shell: bash
        env:
          EXPECTED_PATH_HASH: f477b728c781b8b8c944a8e054f79eeea20d60addbfd2593661b9a8412f02f07
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          mapfile -t paths < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | LC_ALL=C sort)
          expected=(
            ".github/workflows/m7-5-preview-release-artifact.yml"
            ".github/workflows/sprint186-verified-pending-activation-handoff-regression.yml"
            ".github/workflows/sprint32-authentication-recovery-proof-regression.yml"
            ".github/workflows/sprint33-recovery-bound-password-reset-regression.yml"
            ".github/workflows/sprint34-authenticated-password-change-regression.yml"
            "apps/web/app/Infrastructure/Installation/PrebootInstallationActivationHandoff.php"
            "apps/web/app/Infrastructure/Installation/PrebootInstallationConfiguration.php"
            "apps/web/tests/preboot-installation-activation-handoff.php"
            "tools/build-m7-5-preview-release.sh"
            "tools/installation/public-installer.php"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${paths[@]}")
          actual_hash="$(printf '%s\n' "${paths[@]}" | sha256sum | awk '{print $1}')"
          test "$actual_hash" = "$EXPECTED_PATH_HASH"

      - name: Preserve operational NO-GO
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" = NOT_EXECUTED
          test "$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)" = NONE
          test "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" = INACTIVE
          test "$(jq -r '.deployment_authority' ops/final-shift-close/STATE.json)" = NOT_GRANTED
          test "$(jq -r '.technical_preview_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
          test "$(jq -r '.production_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
          test "$(jq -r '.updater_activation' ops/final-shift-close/STATE.json)" = INACTIVE
          test "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET
          test "$(jq -r '.selected_target' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = null

      - name: Setup PHP 8.3 runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Setup exact Node LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.19.0

      - name: Validate Sprint186 source
        shell: bash
        run: |
          set -euo pipefail
          php -l apps/web/app/Infrastructure/Installation/PrebootInstallationActivationHandoff.php
          php -l apps/web/app/Infrastructure/Installation/PrebootInstallationConfiguration.php
          php -l apps/web/tests/preboot-installation-activation-handoff.php
          php -l tools/installation/public-installer.php
          bash -n tools/build-m7-5-preview-release.sh

      - name: Install locked application dependencies
        working-directory: apps/web
        run: |
          set -euo pipefail
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          npm ci --ignore-scripts --no-fund
          npm run type-check
          npm run build

      - name: Bootstrap least-privilege MySQL preservation fixture
        shell: bash
        env:
          MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
          MYSQL_ROOT_PASSWORD: oneqay-s186-root
        run: |
          set -euo pipefail
          php <<'PHP'
          <?php
          $port = (int) getenv('MYSQL_PORT');
          $rootPassword = (string) getenv('MYSQL_ROOT_PASSWORD');
          $pdo = new PDO(
              "mysql:host=127.0.0.1;port={$port};charset=utf8mb4",
              'root',
              $rootPassword,
              [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION],
          );
          $pdo->exec('DROP DATABASE IF EXISTS oneqay_s186');
          $pdo->exec('CREATE DATABASE oneqay_s186 CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci');
          $pdo->exec("DROP USER IF EXISTS 'oneqay_s186'@'%'");
          $pdo->exec("CREATE USER 'oneqay_s186'@'%' IDENTIFIED BY 'oneqay-s186-runtime-secret'");
          $pdo->exec("GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, INDEX, DROP ON oneqay_s186.* TO 'oneqay_s186'@'%'");
          PHP

      - name: Preserve Sprint185 live database verification
        working-directory: apps/web
        env:
          ONEQAY_SPRINT185_DB_HOST: 127.0.0.1
          ONEQAY_SPRINT185_DB_PORT: ${{ job.services.mysql.ports[3306] }}
          ONEQAY_SPRINT185_DB_DATABASE: oneqay_s186
          ONEQAY_SPRINT185_DB_USERNAME: oneqay_s186
          ONEQAY_SPRINT185_DB_PASSWORD: oneqay-s186-runtime-secret
        run: php -d zend.assertions=1 -d assert.exception=1 tests/preboot-database-compatibility-verification.php

      - name: Execute Sprint186 handoff regression
        working-directory: apps/web
        run: php -d zend.assertions=1 -d assert.exception=1 tests/preboot-installation-activation-handoff.php

      - name: Build governed release with non-activating handoff contract
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          bash tools/build-m7-5-preview-release.sh "$HEAD_SHA"
          release_id="m75-preview-${HEAD_SHA:0:12}"
          artifact="dist/${release_id}.tar.gz"
          test -f "$artifact"

          tar -tzf "$artifact" > /tmp/oneqay-s186-release-list.txt
          grep -Fxq "$release_id/public-surface/install.php" /tmp/oneqay-s186-release-list.txt
          grep -Fxq "$release_id/apps/web/app/Infrastructure/Installation/PrebootInstallationActivationHandoff.php" /tmp/oneqay-s186-release-list.txt
          grep -Fxq "$release_id/apps/web/app/Infrastructure/Installation/PrebootInstallationConfiguration.php" /tmp/oneqay-s186-release-list.txt
          ! grep -F '/apps/web/database/migrations/' /tmp/oneqay-s186-release-list.txt

          release_json="dist/stage/${release_id}/RELEASE.json"
          test -f "$release_json"
          test "$(jq -r '.preboot_installation.activation_handoff_request_relative_path' "$release_json")" = "oneqay-preview/shared/install/activation-request.json"
          test "$(jq -r '.preboot_installation.activation_authority_required' "$release_json")" = true
          test "$(jq -r '.preboot_installation.activation_authorized' "$release_json")" = false

          tar -xOzf "$artifact" "$release_id/public-surface/install.php" > /tmp/oneqay-s186-install.php
          php -l /tmp/oneqay-s186-install.php
          grep -Fq 'PrebootInstallationActivationHandoff.php' /tmp/oneqay-s186-install.php
          grep -Fq 'PENDING_CONFIGURATION_VERIFIED_HANDOFF_READY' /tmp/oneqay-s186-install.php
          grep -Fq 'Technical Preview</span><strong>NOT AUTHORIZED' /tmp/oneqay-s186-install.php
          grep -Fq 'Production</span><strong>NOT AUTHORIZED' /tmp/oneqay-s186-install.php

      - name: Preserve handoff-only boundary
        shell: bash
        run: |
          set -euo pipefail
          HANDOFF=apps/web/app/Infrastructure/Installation/PrebootInstallationActivationHandoff.php
          CONFIG=apps/web/app/Infrastructure/Installation/PrebootInstallationConfiguration.php
          PAGE=tools/installation/public-installer.php

          grep -Fq "'activation_authorized' => false" "$HANDOFF"
          grep -Fq "'activation_authority_required' => true" "$HANDOFF"
          grep -Fq "'migration_execution_authorized' => false" "$HANDOFF"
          grep -Fq "'technical_preview_authorized' => false" "$HANDOFF"
          grep -Fq "'production_authorized' => false" "$HANDOFF"
          grep -Fq "CONFIGURATION_PREPARED_HANDOFF_READY" "$CONFIG"
          grep -Fq "PENDING_CONFIGURATION_VERIFIED_HANDOFF_READY" "$CONFIG"
          grep -Fq "activation-request.json" "$HANDOFF"

          ! grep -Eq 'Artisan::call|migrate|requestInstall\(|checkAvailability\(' "$HANDOFF" "$CONFIG" "$PAGE"
          ! grep -Eq -- '->(insert|update|delete|increment|decrement)\(' "$HANDOFF" "$CONFIG" "$PAGE"
          ! grep -Fq 'ONEQAY_INSTALLATION_ACTIVATION_AUTHORIZED="true"' "$HANDOFF" "$CONFIG" "$PAGE"
          ! grep -Fq 'ONEQAY_TECHNICAL_PREVIEW_ENABLED="true"' "$HANDOFF" "$CONFIG" "$PAGE"
          ! grep -Fq 'ONEQAY_PERSISTENCE_ENABLED="true"' "$HANDOFF" "$CONFIG" "$PAGE"

      - name: Verify tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          git diff --exit-code
          test -z "$(git status --porcelain)"
