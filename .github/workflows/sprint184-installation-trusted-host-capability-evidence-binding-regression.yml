# Author by Lab | zefry
name: Sprint184 Installation Trusted Host Capability Evidence Binding Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint184-installation-trusted-host-capability-evidence-binding-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify-sprint184-installation-trusted-host-capability-evidence-binding:
    name: qualify-sprint184-installation-trusted-host-capability-evidence-binding
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:aGhoaGhoaGhoaGhoaGhoaGhoaGhoaGhoaGhoaGhoaGg=
      APP_DEBUG: "false"
      APP_URL: https://localhost
      ONEQAY_RUNTIME_CLASS: ci
      ONEQAY_SYSTEM_UPDATE_CONTROL_PLANE_ENABLED: "false"
      SESSION_DRIVER: array
      CACHE_STORE: array
      LOG_CHANNEL: stderr

    steps:
      - name: Checkout exact Sprint184 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Qualify exact Sprint184 engineering envelope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ github.head_ref }}" == "sprint184-installation-trusted-host-capability-evidence-binding-foundation" ]]
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"

          mapfile -t paths < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | LC_ALL=C sort)
          expected=(
            ".github/workflows/m7-5-preview-release-artifact.yml"
            ".github/workflows/sprint181-installation-readiness-wizard-delivery-foundation-regression.yml"
            ".github/workflows/sprint184-installation-trusted-host-capability-evidence-binding-regression.yml"
            ".github/workflows/sprint32-authentication-recovery-proof-regression.yml"
            ".github/workflows/sprint33-recovery-bound-password-reset-regression.yml"
            ".github/workflows/sprint34-authenticated-password-change-regression.yml"
            "apps/web/app/Delivery/Http/SystemUpdate/SystemUpdatePageController.php"
            "apps/web/app/Infrastructure/Installation/TrustedInstallationHostCapabilityEvidence.php"
            "apps/web/resources/js/pages/System/UpdateDeployment.vue"
            "apps/web/tests/installation-trusted-host-capability-evidence-binding.php"
          )
          [[ "${#paths[@]}" -eq "${#expected[@]}" ]]
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${paths[@]}")
          actual_hash="$(printf '%s\n' "${paths[@]}" | sha256sum | awk '{print $1}')"
          [[ "$actual_hash" == "af18386e9314e02ae2e1530d3f1704dceda9e08696d24dbe586907529a28c646" ]]

      - name: Preserve operational NO-GO
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" == 'NOT_EXECUTED' ]]
          [[ "$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)" == 'NONE' ]]
          [[ "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.deployment_authority' ops/final-shift-close/STATE.json)" == 'NOT_GRANTED' ]]
          [[ "$(jq -r '.technical_preview_activation' ops/final-shift-close/STATE.json)" == 'NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.production_activation' ops/final-shift-close/STATE.json)" == 'NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.updater_activation' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET' ]]
          [[ "$(jq -r '.selected_target' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'null' ]]

      - name: Preserve trusted evidence source boundary
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE=apps/web/app/Infrastructure/Installation/TrustedInstallationHostCapabilityEvidence.php
          CONTROLLER=apps/web/app/Delivery/Http/SystemUpdate/SystemUpdatePageController.php
          PAGE=apps/web/resources/js/pages/System/UpdateDeployment.vue
          TEST=apps/web/tests/installation-trusted-host-capability-evidence-binding.php

          for file in "$EVIDENCE" "$CONTROLLER" "$PAGE" "$TEST"; do
            test -f "$file"
          done

          grep -Fq 'Author by Lab | zefry' "$EVIDENCE"
          grep -Fq 'host-platform-evidence.json' "$CONTROLLER"
          grep -Fq 'SERVER_PLUS_TRUSTED_ATTESTATION' "$CONTROLLER"
          grep -Fq 'SERVER_PLUS_TRUSTED_ATTESTATION' "$PAGE"
          grep -Fq 'hash_equals' "$EVIDENCE"
          grep -Fq "'time_sync'" "$EVIDENCE"
          grep -Fq "'outbound_allowlist'" "$EVIDENCE"
          grep -Fq "'scheduler'" "$EVIDENCE"
          grep -Fq "'required_tools'" "$EVIDENCE"

          ! grep -Eq 'curl_exec|curl_multi_exec|fsockopen|pfsockopen|stream_socket_client' "$EVIDENCE" "$CONTROLLER"
          ! grep -Eq 'shell_exec|proc_open|popen\(|passthru\(|system\(|exec\(' "$EVIDENCE" "$CONTROLLER"
          ! grep -Eq 'Artisan::call|file_put_contents|fwrite|unlink|rename|copy\(|chmod|chown|mkdir|rmdir' "$EVIDENCE" "$CONTROLLER"
          ! grep -Eq -- '->(insert|update|delete|increment|decrement)\(' "$EVIDENCE" "$CONTROLLER"

      - name: Setup PHP 8.3 runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup exact Node LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.19.0

      - name: Preserve root Platform Foundation regression
        run: |
          composer validate --strict --no-check-publish
          composer test

      - name: Install locked application dependencies
        working-directory: apps/web
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist

      - name: Reject High or Critical Composer advisories
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          composer audit --locked --format=json > /tmp/oneqay-s184-composer-audit.json || true
          php -r '$data=json_decode(file_get_contents("/tmp/oneqay-s184-composer-audit.json"),true,512,JSON_THROW_ON_ERROR); foreach (($data["advisories"] ?? []) as $package=>$items) { foreach ($items as $item) { if (in_array(strtolower((string)($item["severity"] ?? "")), ["high","critical"], true)) { fwrite(STDERR,"Blocking Composer advisory for {$package}.\n"); exit(1); } } }'

      - name: Validate trusted host evidence binding
        working-directory: apps/web
        run: |
          php -l app/Infrastructure/Installation/TrustedInstallationHostCapabilityEvidence.php
          php -l app/Delivery/Http/SystemUpdate/SystemUpdatePageController.php
          php -l tests/installation-trusted-host-capability-evidence-binding.php
          php tests/installation-trusted-host-capability-evidence-binding.php
          php tests/secure-installation-readiness.php
          php tests/installation-readiness-wizard-delivery.php
          composer test

      - name: Install locked frontend dependencies
        working-directory: apps/web
        run: npm ci --ignore-scripts --no-fund

      - name: Type-check frontend
        working-directory: apps/web
        run: npm run type-check

      - name: Build frontend assets
        working-directory: apps/web
        run: npm run build

      - name: Verify tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
