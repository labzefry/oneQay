# Technical Preview sale adjustment journey qualification — Lab | zefry
# Author by Lab | zefry
name: Technical Preview Sale Adjustment Journey Regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/app/Application/Preview/PreviewFixtureGateway.php'
      - 'apps/web/app/Application/Preview/TechnicalPreviewJourney.php'
      - 'apps/web/app/Delivery/Preview/TechnicalPreviewController.php'
      - 'apps/web/app/Infrastructure/Preview/DeterministicPreviewFixture.php'
      - 'apps/web/resources/js/pages/Preview/Receipt.vue'
      - 'apps/web/resources/js/pages/Preview/Reconciliation.vue'
      - 'apps/web/routes/technical-preview-cash-control.php'
      - 'apps/web/tests/technical-preview-sale-adjustment-journey.php'
      - '.github/workflows/preview-sale-adjustment-journey-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-sale-adjustment-journey-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview-sale-adjustment-journey-regression:
    name: preview-sale-adjustment-journey-regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      ONEQAY_TECHNICAL_PREVIEW_ENABLED: 'true'
      SESSION_DRIVER: array
      CACHE_STORE: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce exact bounded journey envelope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$base" "$head" | sort > /tmp/preview-adjustment-paths
          test "$(wc -l < /tmp/preview-adjustment-paths)" -eq 9
          test "$(sha256sum /tmp/preview-adjustment-paths | awk '{print $1}')" = '4248ca961d3283913908d694d30f628768db6c3a70674e1eabafbc97f45589ee'
          for expected in \
            '.github/workflows/preview-sale-adjustment-journey-regression.yml' \
            'apps/web/app/Application/Preview/PreviewFixtureGateway.php' \
            'apps/web/app/Application/Preview/TechnicalPreviewJourney.php' \
            'apps/web/app/Delivery/Preview/TechnicalPreviewController.php' \
            'apps/web/app/Infrastructure/Preview/DeterministicPreviewFixture.php' \
            'apps/web/resources/js/pages/Preview/Receipt.vue' \
            'apps/web/resources/js/pages/Preview/Reconciliation.vue' \
            'apps/web/routes/technical-preview-cash-control.php' \
            'apps/web/tests/technical-preview-sale-adjustment-journey.php'
          do
            grep -Fxq "$expected" /tmp/preview-adjustment-paths
          done

      - name: Validate PHP runtime and locked dependencies
        working-directory: apps/web
        run: |
          set -euo pipefail
          php -v
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          composer audit --locked --no-interaction --abandoned=report

      - name: Validate changed PHP syntax and Preview-only boundary
        shell: bash
        run: |
          set -euo pipefail
          php -l apps/web/app/Application/Preview/PreviewFixtureGateway.php
          php -l apps/web/app/Application/Preview/TechnicalPreviewJourney.php
          php -l apps/web/app/Delivery/Preview/TechnicalPreviewController.php
          php -l apps/web/app/Infrastructure/Preview/DeterministicPreviewFixture.php
          php -l apps/web/routes/technical-preview-cash-control.php
          php -l apps/web/tests/technical-preview-sale-adjustment-journey.php
          ! git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -E '^apps/web/(database/migrations|app/Infrastructure/Pos|app/Providers/AppServiceProvider.php)'
          grep -Fq "Route::post('/sale/void'" apps/web/routes/technical-preview-cash-control.php
          grep -Fq "Route::post('/sale/refund'" apps/web/routes/technical-preview-cash-control.php
          grep -Fq 'full CASH refund' apps/web/resources/js/pages/Preview/Receipt.vue
          grep -Fq 'cash_refunds_atomic' apps/web/resources/js/pages/Preview/Reconciliation.vue

      - name: Setup exact Node LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.19.0

      - name: Qualify frontend contract
        working-directory: apps/web
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-fund
          npm audit --audit-level=high
          npm run type-check
          npm run build

      - name: Run focused sale adjustment journey regression
        working-directory: apps/web
        run: php tests/technical-preview-sale-adjustment-journey.php
