name: Sprint64 JRN-010 Prerequisite Cash Variance Source Regression

# Author by Lab | zefry

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sprint63-jrn010-prerequisite-cash-variance-source-regression.yml'
      - 'apps/web/app/Application/Pos/CashVarianceResult.php'
      - 'apps/web/app/Application/Pos/DeriveCashVariance.php'
      - 'apps/web/tests/pos-cash-variance-derivation.php'
      - 'docs/JRN_010_PREREQUISITE_CASH_VARIANCE_SOURCE_FOUNDATION.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint64-jrn010-cash-variance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sprint64-jrn010-cash-variance:
    name: sprint64-jrn010-cash-variance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:cXFxcXFxcXFxcXFxcXFxcXFxcXFxcXFxcXFxcXFxcXE=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      SESSION_DRIVER: array
      CACHE_STORE: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce exact Sprint64 source envelope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$base" "$head" | sort > /tmp/s64-source-paths
          test "$(wc -l < /tmp/s64-source-paths)" -eq 5
          test "$(sha256sum /tmp/s64-source-paths | awk '{print $1}')" = 'f668cbbe0bd82b75171a34b410138d1c0c8c8c4196d14f964617e513f2aa59e3'
          grep -Fxq '.github/workflows/sprint63-jrn010-prerequisite-cash-variance-source-regression.yml' /tmp/s64-source-paths
          grep -Fxq 'apps/web/app/Application/Pos/CashVarianceResult.php' /tmp/s64-source-paths
          grep -Fxq 'apps/web/app/Application/Pos/DeriveCashVariance.php' /tmp/s64-source-paths
          grep -Fxq 'apps/web/tests/pos-cash-variance-derivation.php' /tmp/s64-source-paths
          grep -Fxq 'docs/JRN_010_PREREQUISITE_CASH_VARIANCE_SOURCE_FOUNDATION.md' /tmp/s64-source-paths
          test "$(grep -c '^apps/web/database/migrations/' /tmp/s64-source-paths || true)" -eq 0
          ! grep -Eq '(^|/)(composer\.(json|lock)|package(-lock)?\.json|\.env(\.|$))' /tmp/s64-source-paths

      - name: Preserve migrations one through twenty-four and reject migration twenty-five
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --exit-code "$base" "$head" -- apps/web/database/migrations
          mapfile -t migrations < <(find apps/web/database/migrations -maxdepth 1 -type f -name '*.php' -printf '%f\n' | sort)
          test "${#migrations[@]}" -eq 24
          for index in $(seq 1 24); do
            prefix="$(printf '0000_00_00_%06d_' "$index")"
            test "$(printf '%s\n' "${migrations[@]}" | grep -c "^$prefix")" -eq 1
          done
          ! printf '%s\n' "${migrations[@]}" | grep -Eq '^0000_00_00_000025_'

      - name: Validate pure stateless variance source locks
        shell: bash
        run: |
          set -euo pipefail
          service='apps/web/app/Application/Pos/DeriveCashVariance.php'
          result='apps/web/app/Application/Pos/CashVarianceResult.php'
          testfile='apps/web/tests/pos-cash-variance-derivation.php'

          grep -Fq 'ExpectedCashResult $expectedCash' "$service"
          grep -Fq 'ShiftClosingCashResult $closingCashEvidence' "$service"
          grep -Fq 'CashVarianceResult' "$service"
          grep -Fq 'DIRECTION_MATCH' "$result"
          grep -Fq 'DIRECTION_OVER' "$result"
          grep -Fq 'DIRECTION_SHORT' "$result"
          grep -Fq 'private int $varianceAtomic' "$result"
          grep -Fq 'final readonly class CashVarianceResult' "$result"
          grep -Fq 'PHP_INT_MAX' "$testfile"
          grep -Fq 'deterministic repeat' "$testfile"

          ! grep -Eq 'Illuminate\\|Repository|DB::|->table\(|->insert\(|->update\(|->upsert\(|->delete\(|->increment\(|->decrement\(' "$service" "$result"
          ! grep -Eqi 'tolerance|explanation|approval|reviewer|mfa|step.?up|shift.?state|feature.?flag' "$service" "$result"
          ! grep -Eq '\b(float|double)\b' "$service" "$result"

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l apps/web/app/Application/Pos/CashVarianceResult.php
          php -l apps/web/app/Application/Pos/DeriveCashVariance.php
          php -l apps/web/tests/pos-cash-variance-derivation.php

      - name: Install locked dependencies
        working-directory: apps/web
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Reject High or Critical Composer advisories
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          composer audit --locked --format=json > /tmp/oneqay-composer-audit.json
          php -r '
            $data = json_decode(file_get_contents("/tmp/oneqay-composer-audit.json"), true, 512, JSON_THROW_ON_ERROR);
            foreach (($data["advisories"] ?? []) as $items) {
                foreach ($items as $item) {
                    if (in_array(strtolower((string) ($item["severity"] ?? "")), ["high", "critical"], true)) {
                        fwrite(STDERR, "Blocking Composer advisory.\n");
                        exit(1);
                    }
                }
            }
          '

      - name: Run Sprint64 cash variance regression
        working-directory: apps/web
        run: php tests/pos-cash-variance-derivation.php

      - name: Preserve Sprint60 expected-cash regression
        working-directory: apps/web
        run: php tests/pos-expected-cash-derivation.php

      - name: Preserve Sprint57 immutable sale-to-shift binding regression
        working-directory: apps/web
        run: php tests/pos-sale-shift-binding-durable.php

      - name: Preserve Sprint54 closing-cash regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          migration='database/migrations/0000_00_00_000024_add_immutable_shift_binding_to_pos_sales.php'
          backup='/tmp/oneqay-s64-m24.php'
          cp "$migration" "$backup"
          trap 'mv "$backup" "$migration"' EXIT
          rm -f "$migration"
          php tests/pos-shift-closing-cash-durable.php
          mv "$backup" "$migration"
          trap - EXIT

      - name: Preserve Sprint52 full CASH refund regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          migrations=(
            database/migrations/0000_00_00_000022_create_pos_shift_opening_cash_evidence_foundation.php
            database/migrations/0000_00_00_000023_create_pos_shift_closing_cash_evidence_foundation.php
            database/migrations/0000_00_00_000024_add_immutable_shift_binding_to_pos_sales.php
          )
          backups=()
          restore() {
            for index in "${!migrations[@]}"; do
              [[ ! -f "${backups[$index]}" ]] || mv "${backups[$index]}" "${migrations[$index]}"
            done
          }
          trap restore EXIT
          for index in "${!migrations[@]}"; do
            backup="/tmp/oneqay-s64-refund-$index.php"
            cp "${migrations[$index]}" "$backup"
            backups+=("$backup")
            rm -f "${migrations[$index]}"
          done
          php tests/pos-sale-cash-refund-durable.php
          restore
          trap - EXIT

      - name: Assert lifecycle and dependency locks
        shell: bash
        run: |
          set -euo pipefail
          doc='docs/JRN_010_PREREQUISITE_CASH_VARIANCE_SOURCE_FOUNDATION.md'
          grep -Fq 'Migration #24: **SOURCE-PUBLISHED ONLY / NOT EXECUTED / NOT APPLIED / NOT ACTIVATED**' "$doc"
          grep -Fq 'Migration #25: **NOT SELECTED**' "$doc"
          grep -Fq 'Technical Preview: **INACTIVE**' "$doc"
          grep -Fq 'Production: **NO-GO**' "$doc"
          grep -Fq 'Updater: **INACTIVE**' "$doc"
          grep -Fq 'JRN-010 Shift Close: **NOT SELECTED**' "$doc"
