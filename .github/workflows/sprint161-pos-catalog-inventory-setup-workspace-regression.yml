name: Sprint161 POS Catalog Inventory Setup Workspace Regression

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint161-pos-catalog-inventory-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify-sprint161-pos-catalog-inventory-setup-workspace:
    name: qualify-sprint161-pos-catalog-inventory-setup-workspace
    runs-on: ubuntu-latest
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:Y2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2M=
      APP_DEBUG: "false"
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      SESSION_DRIVER: array
      CACHE_STORE: array
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Lock exact Sprint161 engineering envelope
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          base="${{ github.event.pull_request.base.sha || '92d932020ef95bdc26460a4944841d141d6fad5b' }}"
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --name-only "$base" "$head" | LC_ALL=C sort > /tmp/sprint161-paths
          count="$(wc -l < /tmp/sprint161-paths | tr -d ' ')"
          fingerprint="$(sha256sum /tmp/sprint161-paths | awk '{print $1}')"
          [[ "$count" == '11' ]]
          [[ "$fingerprint" == '66d7c616fbe8ae0e6c3c262fc8054db26bcbaa67e07ed77000363041b056f613' ]]
          cat > /tmp/sprint161-expected <<'EOF'
          .github/workflows/sprint161-pos-catalog-inventory-setup-workspace-regression.yml
          apps/web/app/Application/Pos/PosCatalogInventorySetupWorkspaceRepository.php
          apps/web/app/Application/Pos/PosCatalogInventorySetupWorkspaceSnapshot.php
          apps/web/app/Application/Pos/ViewPosCatalogInventorySetupWorkspace.php
          apps/web/app/Delivery/Http/Pos/PosCatalogInventorySetupWorkspaceController.php
          apps/web/app/Infrastructure/Pos/LaravelPosCatalogInventorySetupWorkspaceRepository.php
          apps/web/app/Providers/FinalShiftCloseServiceProvider.php
          apps/web/app/Providers/PosCatalogInventorySetupWorkspaceServiceProvider.php
          apps/web/config/pos_catalog_inventory_setup.php
          apps/web/resources/js/pages/Pos/CatalogInventorySetup.vue
          apps/web/tests/pos-catalog-inventory-setup-workspace.php
          EOF
          diff -u /tmp/sprint161-expected /tmp/sprint161-paths

      - name: Preserve canonical mutation owners and operational NO-GO
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || '92d932020ef95bdc26460a4944841d141d6fad5b' }}"
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --quiet "$base" "$head" -- \
            ops/final-shift-close/STATE.json \
            ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json \
            ops/final-shift-close/POST_SELECTION_DOWNSTREAM_READINESS.json \
            apps/web/routes/web.php \
            apps/web/bootstrap/providers.php \
            apps/web/composer.json \
            apps/web/database/migrations \
            apps/web/app/Application/Pos/PrepareCatalogItem.php \
            apps/web/app/Application/Pos/EstablishInventoryBaseline.php \
            apps/web/app/Infrastructure/Pos/LaravelCatalogPreparationRepository.php \
            apps/web/app/Infrastructure/Pos/LaravelInventoryBaselineRepository.php \
            apps/web/app/Delivery/Http/Pos/PosCatalogPreparationController.php \
            apps/web/app/Delivery/Http/Pos/PosInventoryBaselineController.php
          [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" == 'NOT_EXECUTED' ]]
          [[ "$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)" == 'NONE' ]]
          [[ "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.deployment_authority' ops/final-shift-close/STATE.json)" == 'NOT_GRANTED' ]]
          [[ "$(jq -r '.technical_preview_activation' ops/final-shift-close/STATE.json)" == 'NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.production_activation' ops/final-shift-close/STATE.json)" == 'NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.updater_activation' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET' ]]
          [[ "$(jq -r '.selected_target' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'null' ]]

      - name: Validate PHP runtime and locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          php -r 'if (PHP_VERSION_ID < 80200 || PHP_VERSION_ID >= 80600) { fwrite(STDERR, "Sprint161 requires governed PHP 8.2-8.5 compatibility.\n"); exit(1); }'
          test -f apps/web/composer.lock
          test -f apps/web/package-lock.json
          cd apps/web
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist

      - name: Validate Sprint161 PHP syntax and executable regressions
        shell: bash
        run: |
          set -euo pipefail
          find apps/web/app apps/web/bootstrap apps/web/config apps/web/routes apps/web/tests \
            -type f -name '*.php' -print0 |
            while IFS= read -r -d '' file; do
              php -l "$file"
            done
          cd apps/web
          composer test
          php tests/pos-operational-reporting.php
          php tests/pos-cashier-workspace.php
          php tests/pos-shift-start-workspace.php
          php tests/pos-sale-correction-workspace.php
          php tests/pos-sale-history-workspace.php
          php tests/pos-catalog-inventory-setup-workspace.php

      - name: Setup exact Node LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.19.0

      - name: Type-check and build catalog inventory setup UI
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts --no-fund
          npm run type-check
          npm run build

      - name: Prove canonical authority reuse and bounded setup semantics
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'PosPermission::prepareCatalog()' apps/web/app/Application/Pos/ViewPosCatalogInventorySetupWorkspace.php
          grep -Fq 'PosPermission::inventoryBaseline()' apps/web/app/Application/Pos/ViewPosCatalogInventorySetupWorkspace.php
          grep -Fq "Route::get('/pos/catalog-inventory/setup'" apps/web/app/Providers/PosCatalogInventorySetupWorkspaceServiceProvider.php
          grep -Fq "route('pos.catalog.prepare')" apps/web/app/Delivery/Http/Pos/PosCatalogInventorySetupWorkspaceController.php
          grep -Fq "route('pos.inventory.baseline')" apps/web/app/Delivery/Http/Pos/PosCatalogInventorySetupWorkspaceController.php
          grep -Fq "where('tenant_id', \$context->tenantId())" apps/web/app/Infrastructure/Pos/LaravelPosCatalogInventorySetupWorkspaceRepository.php
          grep -Fq "where('outlet_id', \$context->outletId())" apps/web/app/Infrastructure/Pos/LaravelPosCatalogInventorySetupWorkspaceRepository.php
          grep -Fq 'oneqay_pos_inventory_baselines' apps/web/app/Infrastructure/Pos/LaravelPosCatalogInventorySetupWorkspaceRepository.php
          grep -Fq 'oneqay_pos_sale_lines as lines' apps/web/app/Infrastructure/Pos/LaravelPosCatalogInventorySetupWorkspaceRepository.php
          grep -Fq 'ONEQAY_POS_CATALOG_INVENTORY_SETUP_ENABLED' apps/web/config/pos_catalog_inventory_setup.php
          grep -Fq 'refreshRequired.value = true' apps/web/resources/js/pages/Pos/CatalogInventorySetup.vue
          grep -Fq 'Tidak ada retry otomatis' apps/web/resources/js/pages/Pos/CatalogInventorySetup.vue
          ! grep -R -n -E 'insert\(|update\(|delete\(|increment\(|decrement\(|statement\(' \
            apps/web/app/Application/Pos/PosCatalogInventorySetupWorkspaceRepository.php \
            apps/web/app/Application/Pos/PosCatalogInventorySetupWorkspaceSnapshot.php \
            apps/web/app/Application/Pos/ViewPosCatalogInventorySetupWorkspace.php \
            apps/web/app/Delivery/Http/Pos/PosCatalogInventorySetupWorkspaceController.php \
            apps/web/app/Infrastructure/Pos/LaravelPosCatalogInventorySetupWorkspaceRepository.php

      - name: Verify tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
