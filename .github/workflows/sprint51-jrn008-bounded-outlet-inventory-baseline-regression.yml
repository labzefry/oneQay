# Sprint53 bounded second historical fixture compatibility closure — Lab | zefry
name: Sprint51 JRN-008 Bounded Outlet Inventory Baseline Regression

# Author by Lab | zefry

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sprint51-jrn008-bounded-outlet-inventory-baseline-regression.yml'
      - 'apps/web/app/Application/Authorization/PosPermission.php'
      - 'apps/web/app/Application/Pos/EstablishInventoryBaseline.php'
      - 'apps/web/app/Application/Pos/InventoryBaselineClock.php'
      - 'apps/web/app/Application/Pos/InventoryBaselineCommand.php'
      - 'apps/web/app/Application/Pos/InventoryBaselineRepository.php'
      - 'apps/web/app/Application/Pos/InventoryBaselineResult.php'
      - 'apps/web/app/Delivery/Http/Pos/PosInventoryBaselineController.php'
      - 'apps/web/app/Infrastructure/Pos/LaravelInventoryBaselineRepository.php'
      - 'apps/web/app/Providers/AppServiceProvider.php'
      - 'apps/web/config/oneqay.php'
      - 'apps/web/database/migrations/0000_00_00_000020_create_pos_inventory_baseline_foundation.php'
      - 'apps/web/routes/web.php'
      - 'apps/web/tests/pos-inventory-baseline-durable.php'
      - 'docs/JRN_008_POS_BOUNDED_OUTLET_INVENTORY_BASELINE_FOUNDATION.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint51-jrn008-inventory-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sprint51-jrn008-inventory-baseline:
    name: sprint51-jrn008-inventory-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:aWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWk=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      ONEQAY_PERSISTENCE_ENABLED: 'true'
      ONEQAY_AUTHENTICATION_SESSION_CONTROL_ENABLED: 'true'
      ONEQAY_POS_SALE_COMPLETION_ENABLED: 'true'
      ONEQAY_POS_SALE_VOID_ENABLED: 'true'
      ONEQAY_POS_CATALOG_PREPARATION_ENABLED: 'true'
      ONEQAY_POS_INVENTORY_BASELINE_ENABLED: 'true'
      SESSION_DRIVER: array
      CACHE_STORE: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce exact Sprint51 source envelope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$base" "$head" | sort > /tmp/s51-source-paths
          count="$(wc -l < /tmp/s51-source-paths)"
          fingerprint="$(sha256sum /tmp/s51-source-paths | awk '{print $1}')"
          echo 'ONEQAY_SPRINT52_JRN007_SOURCE_SUCCESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT53_JRN010_PREREQ_SOURCE_SUCCESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT52_COMPATIBILITY_PREDECESSOR=false' >> "$GITHUB_ENV"
          if [[ "$count" -eq 15 && "$fingerprint" == '325559599c79ba68340eac34569f8e5513aa4957b1ddf2515007b98b2cc1f15f' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s51-source-paths)" -eq 1
            grep -Fxq 'apps/web/database/migrations/0000_00_00_000020_create_pos_inventory_baseline_foundation.php' /tmp/s51-source-paths
          elif [[ "$count" -eq 14 && "$fingerprint" == 'ad4f6c62c820bdc59d7c1c8550ffeec0a4a0718ba4388a516418d50468d7e9d5' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s51-source-paths)" -eq 1
            grep -Fxq 'apps/web/database/migrations/0000_00_00_000021_create_pos_sale_cash_refund_foundation.php' /tmp/s51-source-paths
            echo 'ONEQAY_SPRINT52_JRN007_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
          elif [[ "$count" -eq 14 && "$fingerprint" == '1d75fe26236e2bb56c113713e878e81d3df72cee9aa647b3f7759b9d1bec9164' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s51-source-paths)" -eq 1
            grep -Fxq 'apps/web/database/migrations/0000_00_00_000022_create_pos_shift_opening_cash_evidence_foundation.php' /tmp/s51-source-paths
            echo 'ONEQAY_SPRINT52_JRN007_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT53_JRN010_PREREQ_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
          elif [[ "$count" -eq 30 && "$fingerprint" == '930cd1237722f4dd0af03e85d684ffa435adab6a1ae16db96d78243510fd85bc' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s51-source-paths)" -eq 0
            echo 'ONEQAY_SPRINT53_JRN010_PREREQ_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
          elif [[ "$count" -eq 29 && "$fingerprint" == 'e56a3e2732f5d5b0b40dd3ae50ec25746cf18bc8bd556d25405e85642c789878' ]] || [[ "$count" -eq 20 && "$fingerprint" == 'b25a8747bd003c6952e86f97982ee7cfd504e9ffffda137fca52fb6dd597d663' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s51-source-paths)" -eq 0
            echo 'ONEQAY_SPRINT52_COMPATIBILITY_PREDECESSOR=true' >> "$GITHUB_ENV"
          else
            echo 'Sprint51/Sprint52 changed-file envelope mismatch.' >&2
            exit 1
          fi
          ! grep -Eq '(^|/)(composer\.(json|lock)|package(-lock)?\.json|\.env(\.|$))' /tmp/s51-source-paths

      - name: Preserve migrations one through nineteen and validate migration twenty
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          migration='apps/web/database/migrations/0000_00_00_000020_create_pos_inventory_baseline_foundation.php'
          migration21='apps/web/database/migrations/0000_00_00_000021_create_pos_sale_cash_refund_foundation.php'
          migration22='apps/web/database/migrations/0000_00_00_000022_create_pos_shift_opening_cash_evidence_foundation.php'
          if [[ "${ONEQAY_SPRINT53_JRN010_PREREQ_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
            changed_count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)"
            if [[ "$changed_count" -eq 1 ]]; then printf '%s\n' "$changed" | grep -Fxq "$migration22"; else test "$changed_count" -eq 0; fi
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration22"
            for historical_migration in $migration21 $migration22; do
              if [[ -f "$historical_migration" ]]; then git update-index --assume-unchanged "$historical_migration"; rm -f "$historical_migration"; fi
            done
          elif [[ "${ONEQAY_SPRINT52_JRN007_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration21"
            git update-index --assume-unchanged "$migration21"
            rm -f "$migration21"
          elif [[ "${ONEQAY_SPRINT52_COMPATIBILITY_PREDECESSOR:-false}" == 'true' ]]; then
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations
          else
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration"
          fi
          mapfile -t migrations < <(find apps/web/database/migrations -maxdepth 1 -type f -name '*.php' -printf '%f\n' | sort)
          test "${#migrations[@]}" -eq 20
          for index in $(seq 1 20); do
            prefix="$(printf '0000_00_00_%06d_' "$index")"
            test "$(printf '%s\n' "${migrations[@]}" | grep -c "^$prefix")" -eq 1
          done
          grep -Fq "Schema::create('oneqay_pos_inventory_baselines'" "$migration"
          grep -Fq "unique(['tenant_id', 'operation_id']" "$migration"
          grep -Fq "unique(['tenant_id', 'outlet_id', 'product_id']" "$migration"
          grep -Fq "foreign(['tenant_id', 'outlet_id', 'product_id']" "$migration"
          grep -Fq "on('oneqay_pos_sale_catalog_items')" "$migration"
          grep -Fq "throw new LogicException('Forward-only generated migration; rollback is not authorized.');" "$migration"

      - name: Validate source-default authorization and delivery locks
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "public const INVENTORY_BASELINE = 'pos.inventory.baseline';" apps/web/app/Application/Authorization/PosPermission.php
          grep -Fq "env('ONEQAY_POS_INVENTORY_BASELINE_ENABLED', false)" apps/web/config/oneqay.php
          grep -Fq "config('oneqay.pos_inventory_baseline.enabled', false)" apps/web/routes/web.php
          grep -Fq "Route::post('/pos/inventory/baseline'" apps/web/routes/web.php
          grep -Fq "'session.active'" apps/web/routes/web.php
          grep -Fq 'RequirePosSessionContextMiddleware::class' apps/web/routes/web.php
          grep -Fq "table('oneqay_pos_inventory_baselines')" apps/web/app/Infrastructure/Pos/LaravelInventoryBaselineRepository.php
          grep -Fq "table('oneqay_pos_sale_lines as lines')" apps/web/app/Infrastructure/Pos/LaravelInventoryBaselineRepository.php
          grep -Fq "where('available_quantity', 0)" apps/web/app/Infrastructure/Pos/LaravelInventoryBaselineRepository.php
          grep -Fq "'opening_quantity'" apps/web/app/Delivery/Http/Pos/PosInventoryBaselineController.php

      - name: Preserve Application framework independence
        shell: bash
        run: |
          set -euo pipefail
          if grep -n -F -e 'Illuminate\' -e 'Laravel\' -e 'Schema::' -e 'DB::'             apps/web/app/Application/Authorization/PosPermission.php             apps/web/app/Application/Pos/EstablishInventoryBaseline.php             apps/web/app/Application/Pos/InventoryBaselineClock.php             apps/web/app/Application/Pos/InventoryBaselineCommand.php             apps/web/app/Application/Pos/InventoryBaselineRepository.php             apps/web/app/Application/Pos/InventoryBaselineResult.php; then
            echo 'Sprint51 JRN-008 Application framework boundary violated.' >&2
            exit 1
          fi

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find apps/web/app apps/web/database/migrations apps/web/routes apps/web/tests -type f -name '*.php' -print0 |
            while IFS= read -r -d '' file; do php -l "$file"; done

      - name: Install locked dependencies
        working-directory: apps/web
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Reject High or Critical Composer advisories
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          composer audit --locked --format=json > /tmp/oneqay-composer-audit.json
          php -r '
            $data = json_decode(file_get_contents("/tmp/oneqay-composer-audit.json"), true, 512, JSON_THROW_ON_ERROR);
            foreach (($data["advisories"] ?? []) as $items) {
                foreach ($items as $item) {
                    if (in_array(strtolower((string) ($item["severity"] ?? "")), ["high", "critical"], true)) {
                        fwrite(STDERR, "Blocking Composer advisory.\n");
                        exit(1);
                    }
                }
            }
          '

      - name: Run Sprint51 JRN-008 durable inventory baseline regression
        working-directory: apps/web
        run: php tests/pos-inventory-baseline-durable.php

      - name: Preserve Sprint50 JRN-007 sale void regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          migration20='database/migrations/0000_00_00_000020_create_pos_inventory_baseline_foundation.php'
          backup20='/tmp/oneqay-s51-migration20-void.php'
          cp "$migration20" "$backup20"
          restore() { [[ ! -f "$backup20" ]] || mv "$backup20" "$migration20"; }
          trap restore EXIT
          rm -f "$migration20"
          php tests/pos-sale-void-durable.php
          restore
          trap - EXIT

      - name: Preserve Sprint49 active-shift sale regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          migration19='database/migrations/0000_00_00_000019_create_pos_sale_void_foundation.php'
          migration20='database/migrations/0000_00_00_000020_create_pos_inventory_baseline_foundation.php'
          backup19='/tmp/oneqay-s51-migration19-active-shift.php'
          backup20='/tmp/oneqay-s51-migration20-active-shift.php'
          cp "$migration19" "$backup19"
          cp "$migration20" "$backup20"
          restore() {
            [[ ! -f "$backup19" ]] || mv "$backup19" "$migration19"
            [[ ! -f "$backup20" ]] || mv "$backup20" "$migration20"
          }
          trap restore EXIT
          rm -f "$migration19" "$migration20"
          php tests/pos-sale-completion-active-shift.php
          restore
          trap - EXIT

      - name: Preserve Sprint48 JRN-005 shift regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          migration19='database/migrations/0000_00_00_000019_create_pos_sale_void_foundation.php'
          migration20='database/migrations/0000_00_00_000020_create_pos_inventory_baseline_foundation.php'
          backup19='/tmp/oneqay-s51-migration19-shift.php'
          backup20='/tmp/oneqay-s51-migration20-shift.php'
          cp "$migration19" "$backup19"
          cp "$migration20" "$backup20"
          restore() {
            [[ ! -f "$backup19" ]] || mv "$backup19" "$migration19"
            [[ ! -f "$backup20" ]] || mv "$backup20" "$migration20"
          }
          trap restore EXIT
          rm -f "$migration19" "$migration20"
          php tests/pos-shift-opening-durable.php
          restore
          trap - EXIT

      - name: Preserve Sprint47 JRN-004 catalog regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          migration18='database/migrations/0000_00_00_000018_create_pos_shift_opening_foundation.php'
          migration19='database/migrations/0000_00_00_000019_create_pos_sale_void_foundation.php'
          migration20='database/migrations/0000_00_00_000020_create_pos_inventory_baseline_foundation.php'
          backup18='/tmp/oneqay-s51-migration18-catalog.php'
          backup19='/tmp/oneqay-s51-migration19-catalog.php'
          backup20='/tmp/oneqay-s51-migration20-catalog.php'
          cp "$migration18" "$backup18"
          cp "$migration19" "$backup19"
          cp "$migration20" "$backup20"
          restore() {
            [[ ! -f "$backup18" ]] || mv "$backup18" "$migration18"
            [[ ! -f "$backup19" ]] || mv "$backup19" "$migration19"
            [[ ! -f "$backup20" ]] || mv "$backup20" "$migration20"
          }
          trap restore EXIT
          rm -f "$migration18" "$migration19" "$migration20"
          php tests/pos-catalog-preparation-durable.php
          restore
          trap - EXIT

      - name: Preserve historical Sprint46 JRN-006 durable sale regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          repository='app/Infrastructure/Pos/LaravelDurablePosSaleRepository.php'
          migration17='database/migrations/0000_00_00_000017_create_pos_catalog_preparation_journal.php'
          migration18='database/migrations/0000_00_00_000018_create_pos_shift_opening_foundation.php'
          migration19='database/migrations/0000_00_00_000019_create_pos_sale_void_foundation.php'
          migration20='database/migrations/0000_00_00_000020_create_pos_inventory_baseline_foundation.php'
          repository_backup='/tmp/oneqay-s51-sale-repository.php'
          migration17_backup='/tmp/oneqay-s51-migration17.php'
          migration18_backup='/tmp/oneqay-s51-migration18.php'
          migration19_backup='/tmp/oneqay-s51-migration19.php'
          migration20_backup='/tmp/oneqay-s51-migration20.php'
          cp "$repository" "$repository_backup"
          cp "$migration17" "$migration17_backup"
          cp "$migration18" "$migration18_backup"
          cp "$migration19" "$migration19_backup"
          cp "$migration20" "$migration20_backup"
          restore() {
            [[ ! -f "$repository_backup" ]] || mv "$repository_backup" "$repository"
            [[ ! -f "$migration17_backup" ]] || mv "$migration17_backup" "$migration17"
            [[ ! -f "$migration18_backup" ]] || mv "$migration18_backup" "$migration18"
            [[ ! -f "$migration19_backup" ]] || mv "$migration19_backup" "$migration19"
            [[ ! -f "$migration20_backup" ]] || mv "$migration20_backup" "$migration20"
          }
          trap restore EXIT
          git show cc55ad9c981cceb287206db8a3001e629b1d8d57:apps/web/app/Infrastructure/Pos/LaravelDurablePosSaleRepository.php > "$repository"
          rm -f "$migration17" "$migration18" "$migration19" "$migration20"
          php tests/pos-sale-completion-durable.php
          restore
          trap - EXIT

      - name: Preserve M7.4 synthetic POS regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          shift_successor='app/Infrastructure/Pos/LaravelShiftOpeningRepository.php'
          inventory_successor='app/Infrastructure/Pos/LaravelInventoryBaselineRepository.php'
          refund_successor='app/Infrastructure/Pos/LaravelSaleCashRefundRepository.php'
          opening_cash_successor='app/Infrastructure/Pos/LaravelShiftOpeningCashRepository.php'
          shift_backup='/tmp/oneqay-s51-shift-opening-repository.php'
          inventory_backup='/tmp/oneqay-s51-inventory-baseline-repository.php'
          refund_backup='/tmp/oneqay-s51-cash-refund-repository.php'
          opening_cash_backup='/tmp/oneqay-s51-opening-cash-repository.php'
          cp "$shift_successor" "$shift_backup"
          cp "$inventory_successor" "$inventory_backup"
          if [[ -f "$refund_successor" ]]; then cp "$refund_successor" "$refund_backup"; fi
          if [[ -f "$opening_cash_successor" ]]; then cp "$opening_cash_successor" "$opening_cash_backup"; fi
          restore() {
            [[ ! -f "$shift_backup" ]] || mv "$shift_backup" "$shift_successor"
            [[ ! -f "$inventory_backup" ]] || mv "$inventory_backup" "$inventory_successor"
            [[ ! -f "$refund_backup" ]] || mv "$refund_backup" "$refund_successor"
            [[ ! -f "$opening_cash_backup" ]] || mv "$opening_cash_backup" "$opening_cash_successor"
          }
          trap restore EXIT
          rm -f "$shift_successor" "$inventory_successor"
          if [[ -f "$refund_successor" ]]; then rm -f "$refund_successor"; fi
          if [[ -f "$opening_cash_successor" ]]; then rm -f "$opening_cash_successor"; fi
          php tests/pos-core-synthetic.php
          restore
          trap - EXIT

      - name: Preserve tracked source cleanliness
        run: git diff --exit-code
