name: Sprint253 Bounded Successor Compatibility Correction Materializer

# Attribution: Lab | zefry
# Transient revision: PR exact-head execution

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'sprint253-post-activation-historical-regression-successor-compatibility'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify bounded lineage
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$HEAD_REF" = 'sprint253-post-activation-historical-regression-successor-compatibility'
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor fc6c94ee6f3da7702026c7db444d71b623ce7022 HEAD
          test -f tools/sprint253-bounded-successor-correction.py

      - name: Normalize residual bounded correction inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/sprint253-bounded-successor-correction.py')
          text = path.read_text()

          old_s115 = "'.github/workflows/sprint115-final-shift-close-durable-target-selection-persistence.yml'"
          new_s115 = "'.github/workflows/sprint115-final-shift-close-durable-runtime-target-selection-persistence.yml'"
          if text.count(old_s115) != 1:
              raise SystemExit(f'expected one stale Sprint115 workflow path, found {text.count(old_s115)}')
          text = text.replace(old_s115, new_s115, 1)

          strict_loop_guard = "    if text.count(marker) != 1:\n        raise SystemExit(f'{path}: expected one historical workflow loop')"
          bounded_loop_guard = "    if text.count(marker) < 1:\n        raise SystemExit(f'{path}: expected at least one historical workflow loop')"
          if text.count(strict_loop_guard) != 1:
              raise SystemExit(f'expected one strict historical-loop guard, found {text.count(strict_loop_guard)}')
          text = text.replace(strict_loop_guard, bounded_loop_guard, 1)

          marker = '# Transient materializer/script must not survive final PR tree.\n'
          if text.count(marker) != 1:
              raise SystemExit('expected one transient-retirement marker')

          residual = r'''# Residual exact-head successor oracles: preserve runtime/state ownership while retiring stale PR-shape locks.
          replace_once(
              '.github/workflows/sprint223-durable-runtime-ingestion-null-boundary-regression.yml',
              "          grep -Fq 'Sprint223 exact bounded ingestion null-boundary correction envelope recognized.' .github/workflows/sprint114-final-shift-close-durable-runtime-attestation-ingestion-execution.yml",
              "          test -f .github/workflows/sprint114-final-shift-close-durable-runtime-attestation-ingestion-execution.yml",
          )
          remove_token_once(
              '.github/workflows/sprint235-final-shift-close-permission-cpanel-local-execution-compatibility.yml',
              '.github/workflows/sprint102-final-shift-close-operational-sequencing-gate.yml',
          )
          replace_step(
              '.github/workflows/sprint248-final-shift-close-operator-kit-successor-wiring-regression.yml',
              'Enforce exact Sprint248 envelope',
              """      - name: Validate Sprint248 owned successor sources
                  shell: bash
                  run: |
                    set -euo pipefail
                    test -f .github/workflows/final-shift-close-feature-activation.yml
                    test -f .github/workflows/sprint248-final-shift-close-operator-kit-successor-wiring-regression.yml
                    test -f apps/web/tests/pos-final-shift-close-operator-kit-successor-wiring.php""",
          )

          '''
          text = text.replace(marker, residual + marker, 1)
          path.write_text(text)
          PY
          python3 -m py_compile tools/sprint253-bounded-successor-correction.py

      - name: Materialize one bounded successor correction
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/sprint253-bounded-successor-correction.py
          git diff --check
          php -l apps/web/tests/pos-final-shift-close-durable-staging-delivery-gate.php
          php -l apps/web/tests/pos-business-workspace-delivery-integration.php
          test ! -e tools/sprint253-bounded-successor-correction.py
          test ! -e .github/workflows/sprint253-bounded-successor-correction-materializer.yml

      - name: Commit bounded correction and retire transient machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Lab | zefry'
          git config user.email 'lab.zefa@gmail.com'
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Sprint253: close active-state historical regression compatibility'
          git push origin HEAD:sprint253-post-activation-historical-regression-successor-compatibility

