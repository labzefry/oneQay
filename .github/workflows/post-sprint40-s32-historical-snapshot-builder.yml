name: Post-Sprint40 Sprint32 Historical Snapshot Builder

# Attribution: Lab | zefry

on:
  push:
    branches:
      - ci/post-sprint40-s32-historical-snapshot-builder

permissions:
  contents: write

jobs:
  build-clean-sprint32-historical-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout builder head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Transform and validate Sprint32 historical preservation
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          git diff --check
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= .github/workflows/sprint32-authentication-recovery-proof-regression.yml

      - name: Commit clean correction and expose commit object
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'labzefry'
          git config user.email 'lab.zefa@gmail.com'
          git rm .github/workflows/post-sprint40-s32-historical-snapshot-builder.yml
          git add .github/workflows/sprint32-authentication-recovery-proof-regression.yml
          git commit -m 'ci: pin Sprint32 historical regressions to Sprint31 snapshot'
          printf '%s\n' '.github/workflows/sprint32-authentication-recovery-proof-regression.yml' > /tmp/expected
          git diff --name-only ab36d01ea7e82f439fa640437d3555135a85a3d2 HEAD | sort > /tmp/actual
          cmp -s /tmp/expected /tmp/actual
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          echo "FINAL_TREE=$(git rev-parse HEAD^{tree})"
          set +e
          git push origin HEAD:ci/post-sprint40-s32-historical-snapshot-builder
          echo "PUSH_RC=$?"
          exit 0
