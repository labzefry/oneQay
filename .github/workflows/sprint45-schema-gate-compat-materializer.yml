name: Sprint45 Schema Gate Compatibility Materializer

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/sprint45-schema-gate-compat-materializer.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'sprint45-schema-gate-compat-materializer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact materializer branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: sprint45-schema-gate-compat-materializer
          fetch-depth: 0

      - name: Materialize bounded five-workflow schema-gate compatibility blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old = 'c2531ec04dd34198ac94aee5d5f39c271440101541817c1f12bcfb0140a2dca0'
          new = '94430119e646c8ab2fca48233276b8155c8f8769965532b3c739479510f10017'
          recognizers = [
              Path('.github/workflows/sprint35-privileged-totp-recovery-regression.yml'),
              Path('.github/workflows/sprint36-first-party-session-inventory-revocation-regression.yml'),
              Path('.github/workflows/sprint37-first-party-all-session-termination-regression.yml'),
          ]
          for path in recognizers:
              lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
              matches = [i for i, line in enumerate(lines) if old in line]
              if len(matches) != 1:
                  raise SystemExit(f'{path}: expected exactly one Sprint45 entry-gate fingerprint, found {len(matches)}')
              start = matches[0]
              stripped = lines[start].lstrip()
              if not stripped.startswith('elif '):
                  raise SystemExit(f'{path}: source recognizer is not an elif line')
              indent = lines[start][:len(lines[start]) - len(stripped)]
              end = None
              for i in range(start + 1, len(lines)):
                  if lines[i].startswith(indent + 'elif '):
                      end = i
                      break
              if end is None:
                  raise SystemExit(f'{path}: could not bound entry-gate recognizer block')
              cloned = []
              for line in lines[start:end]:
                  line = line.replace(old, new)
                  if 'Recognized exact Sprint45 pending-MFA identity-eligibility revalidation entry-gate successor shape.' in line:
                      line_indent = line[:len(line) - len(line.lstrip())]
                      quote = "'" if "echo '" in line else '"'
                      line = line_indent + f"echo {quote}Recognized exact Sprint45 pending-MFA identity-eligibility revalidation schema/source-envelope gate successor shape.{quote}\n"
                  cloned.append(line)
              text = ''.join(lines[:end] + cloned + lines[end:])
              if text.count(new) != 1:
                  raise SystemExit(f'{path}: new fingerprint count is not exactly one')
              path.write_text(text, encoding='utf-8', newline='\n')

          anchors = {
              Path('.github/workflows/sprint38-first-party-session-absolute-lifetime-regression.yml'):
                  '# Sprint45 pending-MFA eligibility schema/source-envelope gate compatibility preservation anchor.\n',
              Path('.github/workflows/sprint39-first-party-session-organizational-access-revalidation-regression.yml'):
                  '# Sprint45 pending-MFA eligibility schema/source-envelope gate compatibility preservation anchor.\n',
          }
          for path, anchor in anchors.items():
              text = path.read_text(encoding='utf-8')
              if anchor.strip() in text:
                  raise SystemExit(f'{path}: unexpected pre-existing schema-gate anchor')
              path.write_text(anchor + text, encoding='utf-8', newline='\n')
          PY

          git diff --check
          mapfile -t changed < <(git diff --name-only | LC_ALL=C sort)
          printf '%s\n' "${changed[@]}" > /tmp/changed.txt
          test "$(wc -l < /tmp/changed.txt)" -eq 5
          test "$(sha256sum /tmp/changed.txt | awk '{print $1}')" = 'ab09e044925ae98740a49c46a70ff387e5f5445b245d3a556d85ad6a354305ec'
          echo "ENVELOPE_SHA256 $(sha256sum /tmp/changed.txt | awk '{print $1}')"

          while IFS= read -r path; do
            payload="$(python3 - "$path" <<'PY'
          import base64, json, pathlib, sys
          data = base64.b64encode(pathlib.Path(sys.argv[1]).read_bytes()).decode('ascii')
          print(json.dumps({'content': data, 'encoding': 'base64'}))
          PY
          )"
            sha="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha <<<"$payload")"
            printf 'MATERIALIZED_BLOB %s %s\n' "$path" "$sha"
          done < /tmp/changed.txt
