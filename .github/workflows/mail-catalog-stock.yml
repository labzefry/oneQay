# Author by Lab | zefry
name: Mail Delivery and Explicit Stock Modes
on:
  push:
    branches: [mail-catalog-stock-20261021]
  pull_request:
    branches: [main]
    paths: ['apps/web/**', 'apps/pos-desktop/**', '.github/workflows/mail-catalog-stock.yml']
permissions:
  contents: read
jobs:
  relational-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: mail-delivery-retention
            database: oneqay_platform_test
            marker: MAIL_DELIVERY_RETENTION
          - suite: catalog-stock-modes
            database: oneqay_merchandising_test
            marker: CATALOG_STOCK_MODES
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: synthetic-test-only
          MYSQL_DATABASE: ${{ matrix.database }}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psynthetic-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite, mbstring, dom
          tools: composer:v2
          coverage: none
      - run: composer install --working-dir=apps/web --no-interaction --no-progress --prefer-dist
      - name: Real SQL, adapter, replay, retention and stock effects
        env:
          SUITE: ${{ matrix.suite }}
          MARKER: ${{ matrix.marker }}
        run: |
          set -euo pipefail
          php "apps/web/tests/$SUITE.php" | tee /tmp/sqlite.log
          grep -Eq "^${MARKER}_sqlite_PASS assertions=[0-9]+$" /tmp/sqlite.log
          PLATFORM_TEST_ENGINE=mysql MERCH_TEST_ENGINE=mysql php "apps/web/tests/$SUITE.php" | tee /tmp/mysql.log
          grep -Eq "^${MARKER}_mysql_PASS assertions=[0-9]+$" /tmp/mysql.log
