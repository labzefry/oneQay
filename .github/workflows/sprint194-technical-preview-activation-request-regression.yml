# Author by Lab | zefry
name: Sprint194 Technical Preview Activation Request Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint194-technical-preview-activation-request-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify-sprint194-technical-preview-activation-request:
    name: qualify-sprint194-technical-preview-activation-request
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      APP_DEBUG: "false"
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      SESSION_DRIVER: array
      CACHE_STORE: array
      LOG_CHANNEL: stderr
      ONEQAY_BUILD_PROVENANCE: github-actions:${{ github.run_id }}:${{ github.run_attempt }}

    steps:
      - name: Checkout exact Sprint194 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Qualify exact Sprint194 engineering envelope
        if: github.event_name == 'pull_request' && github.head_ref == 'sprint194-technical-preview-activation-request'
        shell: bash
        env:
          EXPECTED_PATH_HASH: a85b8ceffbf533ea5f3aff7555dba90129c2c851bb8d9bb8ed427ce2e572f804
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          mapfile -t paths < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | LC_ALL=C sort)
          expected=(
            ".github/workflows/m7-5-preview-release-artifact.yml"
            ".github/workflows/sprint194-technical-preview-activation-request-regression.yml"
            ".github/workflows/sprint32-authentication-recovery-proof-regression.yml"
            ".github/workflows/sprint33-recovery-bound-password-reset-regression.yml"
            ".github/workflows/sprint34-authenticated-password-change-regression.yml"
            "apps/web/app/Infrastructure/Installation/PrebootTechnicalPreviewActivationRequest.php"
            "apps/web/tests/preboot-technical-preview-activation-request.php"
            "tools/build-m7-5-preview-release.sh"
            "tools/installation/public-installer.php"
            "tools/installation/technical-preview-activation-request.schema.json"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${paths[@]}")
          actual_hash="$(printf '%s\n' "${paths[@]}" | sha256sum | awk '{print $1}')"
          test "$actual_hash" = "$EXPECTED_PATH_HASH"

      - name: Preserve operational NO-GO
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" = NOT_EXECUTED
          test "$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)" = NONE
          test "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" = INACTIVE
          test "$(jq -r '.deployment_authority' ops/final-shift-close/STATE.json)" = NOT_GRANTED
          test "$(jq -r '.technical_preview_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
          test "$(jq -r '.production_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
          test "$(jq -r '.updater_activation' ops/final-shift-close/STATE.json)" = INACTIVE
          test "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = SELECTED_NOT_AUTHORIZED
          test "$(jq -r '.selected_target.environment_id' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = 'oneqay-durable-staging-01'
          test "$(jq -r '.selected_target.runtime_class' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = 'durable-staging'
          test "$(jq -r '.selected_target.selection_fingerprint_sha256' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = '858280ea3575317e8d88eed7009c770530097e261c391b2869fa81ad7c8546ce'

      - name: Setup PHP 8.3 runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Setup exact Node LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.19.0

      - name: Validate Sprint194 source and request schema
        shell: bash
        run: |
          set -euo pipefail
          php -l apps/web/app/Infrastructure/Installation/PrebootTechnicalPreviewActivationRequest.php
          php -l apps/web/tests/preboot-technical-preview-activation-request.php
          php -l tools/installation/public-installer.php
          bash -n tools/build-m7-5-preview-release.sh
          jq -e '.properties.request_state.const == "TECHNICAL_PREVIEW_ACTIVATION_REQUEST_PENDING_APPROVAL"' tools/installation/technical-preview-activation-request.schema.json
          jq -e '.properties.requested_operation.const == "ENABLE_SYNTHETIC_TECHNICAL_PREVIEW_RUNTIME"' tools/installation/technical-preview-activation-request.schema.json
          jq -e '.properties.required_authority.properties.state.const == "NOT_GRANTED"' tools/installation/technical-preview-activation-request.schema.json
          jq -e '.properties.technical_preview_authorized.const == false' tools/installation/technical-preview-activation-request.schema.json
          jq -e '.properties.persistence_authorized.const == false' tools/installation/technical-preview-activation-request.schema.json
          jq -e '.properties.production_authorized.const == false' tools/installation/technical-preview-activation-request.schema.json

      - name: Install locked application dependencies
        working-directory: apps/web
        run: |
          set -euo pipefail
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          npm ci --ignore-scripts --no-fund
          npm run type-check
          npm run build

      - name: Preserve Sprint184 through Sprint193 installation regressions
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php -d zend.assertions=1 -d assert.exception=1 tests/preboot-installation-configuration.php
          php -d zend.assertions=1 -d assert.exception=1 tests/preboot-database-compatibility-verification.php
          php -d zend.assertions=1 -d assert.exception=1 tests/preboot-installation-activation-readiness.php
          php -d zend.assertions=1 -d assert.exception=1 tests/preboot-runtime-configuration-promotion-request.php
          php -d zend.assertions=1 -d assert.exception=1 tests/preboot-runtime-configuration-promotion-qualification.php
          php -d zend.assertions=1 -d assert.exception=1 tests/preboot-runtime-configuration-promotion-readiness.php
          php -d zend.assertions=1 -d assert.exception=1 tests/preboot-runtime-configuration-promotion-execution.php
          php -d zend.assertions=1 -d assert.exception=1 tests/preboot-runtime-configuration-promotion-operator-delivery.php
          php -d zend.assertions=1 -d assert.exception=1 tests/preboot-runtime-configuration-post-promotion-verification.php
          php -d zend.assertions=1 -d assert.exception=1 tests/preboot-installation-completion-handoff.php

      - name: Execute Sprint194 technical preview activation request regression
        working-directory: apps/web
        run: php -d zend.assertions=1 -d assert.exception=1 tests/preboot-technical-preview-activation-request.php

      - name: Build governed release with activation request capability
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          bash tools/build-m7-5-preview-release.sh "$HEAD_SHA"
          release_id="m75-preview-${HEAD_SHA:0:12}"
          artifact="dist/${release_id}.tar.gz"
          test -f "$artifact"

          tar -tzf "$artifact" > /tmp/oneqay-s194-release-list.txt
          grep -Fxq "$release_id/apps/web/app/Infrastructure/Installation/PrebootTechnicalPreviewActivationRequest.php" /tmp/oneqay-s194-release-list.txt
          grep -Fxq "$release_id/installation/technical-preview-activation-request.schema.json" /tmp/oneqay-s194-release-list.txt
          ! grep -F '/apps/web/database/migrations/' /tmp/oneqay-s194-release-list.txt

          tar -xOzf "$artifact" "$release_id/RELEASE.json" > /tmp/oneqay-s194-release.json
          grep -Fq '"technical_preview_activation_request_relative_path": "oneqay-preview/shared/install/technical-preview-activation-request.json"' /tmp/oneqay-s194-release.json
          grep -Fq '"technical_preview_activation_request_schema_relative_path": "installation/technical-preview-activation-request.schema.json"' /tmp/oneqay-s194-release.json
          grep -Fq '"technical_preview_activation_request_registration_state": "REGISTERED_GUARDED_OPERATOR_ACTION"' /tmp/oneqay-s194-release.json
          grep -Fq '"technical_preview_activation_request_action": "create_technical_preview_activation_request"' /tmp/oneqay-s194-release.json
          grep -Fq '"technical_preview_activation_request_confirmation_required": true' /tmp/oneqay-s194-release.json
          grep -Fq '"technical_preview_activation_request_state": "NOT_CREATED_AT_BUILD"' /tmp/oneqay-s194-release.json
          grep -Fq '"technical_preview_authorized": false' /tmp/oneqay-s194-release.json
          grep -Fq '"activation_authorized": false' /tmp/oneqay-s194-release.json

          tar -xOzf "$artifact" "$release_id/public-surface/install.php" > /tmp/oneqay-s194-install.php
          php -l /tmp/oneqay-s194-install.php
          grep -Fq 'create_technical_preview_activation_request' /tmp/oneqay-s194-install.php
          grep -Fq 'REQUEST_TECHNICAL_PREVIEW_ACTIVATION' /tmp/oneqay-s194-install.php
          grep -Fq 'PENDING APPROVAL / NOT AUTHORIZED' /tmp/oneqay-s194-install.php

      - name: Prove request-only lifecycle boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R --line-number --fixed-strings 'Artisan::call' apps/web/app/Infrastructure/Installation/PrebootTechnicalPreviewActivationRequest.php apps/web/tests/preboot-technical-preview-activation-request.php tools/installation/public-installer.php
          ! grep -Fq 'file_put_contents($this->activeEnvironmentPath()' apps/web/app/Infrastructure/Installation/PrebootTechnicalPreviewActivationRequest.php
          ! grep -Fq 'unlink($this->activeEnvironmentPath()' apps/web/app/Infrastructure/Installation/PrebootTechnicalPreviewActivationRequest.php
          test "$(jq -r '.technical_preview_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
          test "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" = NOT_EXECUTED

      - name: Confirm attribution and source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Author by Lab | zefry' apps/web/app/Infrastructure/Installation/PrebootTechnicalPreviewActivationRequest.php
          grep -Fq 'Lab | zefry' tools/installation/technical-preview-activation-request.schema.json
          ! grep -R -E 'ChatGPT|OpenAI|Copilot|Gemini' \
            apps/web/app/Infrastructure/Installation/PrebootTechnicalPreviewActivationRequest.php \
            apps/web/tests/preboot-technical-preview-activation-request.php \
            tools/installation/technical-preview-activation-request.schema.json \
            tools/installation/public-installer.php \
            tools/build-m7-5-preview-release.sh
