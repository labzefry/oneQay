name: Post-Sprint40 M7.5 Fixture Builder

on:
  push:
    branches:
      - ci/m75-fixture-builder-20260826

permissions:
  contents: write

jobs:
  expand-to-seven-path-precedent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Build seven-path preservation child
        shell: bash
        run: |
          set -euo pipefail
          parent='f447a112040c3025b39ebc902f00882195172b83'
          canonical='517d6fc92c8becf225e9997899d96bf53da28433'
          git checkout --detach "$parent"
          git config user.name 'labzefry'
          git config user.email 'lab.zefa@gmail.com'
          python3 - <<'PY'
          from pathlib import Path
          anchor = '# Post-Sprint40 M7.5 canonical-main fixture isolation anchor.\n'
          for name in [
              '.github/workflows/sprint33-recovery-bound-password-reset-regression.yml',
              '.github/workflows/sprint34-authenticated-password-change-regression.yml',
          ]:
              p = Path(name)
              text = p.read_text()
              if anchor not in text:
                  p.write_text(anchor + text)
          PY
          git diff --check
          printf '%s\n' \
            .github/workflows/m7-5-preview-release-artifact.yml \
            .github/workflows/sprint33-recovery-bound-password-reset-regression.yml \
            .github/workflows/sprint34-authenticated-password-change-regression.yml \
            .github/workflows/sprint35-privileged-totp-recovery-regression.yml \
            .github/workflows/sprint36-first-party-session-inventory-revocation-regression.yml \
            .github/workflows/sprint37-first-party-all-session-termination-regression.yml \
            .github/workflows/sprint38-first-party-session-absolute-lifetime-regression.yml \
            | sort > /tmp/expected-paths
          git diff --name-only "$canonical...HEAD" | sort > /tmp/before-paths
          test "$(wc -l < /tmp/before-paths)" -eq 5
          git add \
            .github/workflows/sprint33-recovery-bound-password-reset-regression.yml \
            .github/workflows/sprint34-authenticated-password-change-regression.yml
          tree="$(git write-tree)"
          final_commit="$(printf '%s\n\n%s\n' 'ci: align M7.5 closure with seven-path preservation precedent' 'Attribution: Lab | zefry' | git commit-tree "$tree" -p "$parent")"
          git diff-tree --no-commit-id --name-only -r "$canonical" "$final_commit" | sort > /tmp/actual-paths
          cmp -s /tmp/expected-paths /tmp/actual-paths
          test "$(sha256sum /tmp/actual-paths | awk '{print $1}')" = '4784ffca1c940d3fa54a2a3988ead07e2de993bde8d3af2bd41014dbdf905be0'
          git checkout --detach "$final_commit"
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= \
            .github/workflows/m7-5-preview-release-artifact.yml \
            .github/workflows/sprint33-recovery-bound-password-reset-regression.yml \
            .github/workflows/sprint34-authenticated-password-change-regression.yml \
            .github/workflows/sprint35-privileged-totp-recovery-regression.yml \
            .github/workflows/sprint36-first-party-session-inventory-revocation-regression.yml \
            .github/workflows/sprint37-first-party-all-session-termination-regression.yml \
            .github/workflows/sprint38-first-party-session-absolute-lifetime-regression.yml
          echo "FINAL_COMMIT=$final_commit"
          echo "FINAL_TREE=$tree"
          set +e
          git push origin "$final_commit":refs/heads/ci/post-sprint40-m75-main-push-closure
          echo "PUSH_RC=$?"
          exit 0
