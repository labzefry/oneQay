                rm -f "$historical_migration"
              fi
            done
            echo 'Migrations #16-#18 isolated only from exact Sprint48 JRN-005 historical Sprint42 execution.'
          elif [[ "${ONEQAY_SPRINT47_JRN004_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            for historical_migration in "$migration16" "$migration17"; do
              if [[ -f "$historical_migration" ]]; then
                git update-index --assume-unchanged "$historical_migration"
                rm -f "$historical_migration"
              fi
            done
            echo 'Migrations #16-#17 isolated only from exact Sprint47 JRN-004 historical Sprint42 execution.'
          elif [[ "${ONEQAY_SPRINT46_JRN006_SOURCE_SUCCESSOR:-false}" == 'true' || "${ONEQAY_SPRINT43_PRESERVATION:-false}" == 'true' ]]; then
            test "$(printf '%s\n' "${migrations[@]}" | grep -c '^0000_00_00_000016_create_pos_sale_completion_foundation\.php$')" -eq 1
            git update-index --assume-unchanged "$migration16"
            rm -f "$migration16"
            echo 'Migration #16 isolated only from exact governed post-Sprint43/JRN-006 historical Sprint42 execution.'
          else
            ! printf '%s\n' "${migrations[@]}" | grep -q '^0000_00_00_000016_'
          fi

      - name: Preserve excluded public configuration dependency and authority surfaces
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [[ "${ONEQAY_SPRINT46_JRN006_SOURCE_SUCCESSOR:-false}" == 'true' || "${ONEQAY_SPRINT47_JRN004_SOURCE_SUCCESSOR:-false}" == 'true' || "${ONEQAY_SPRINT48_JRN005_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            git diff --exit-code "$base" "$head" --               apps/web/app/Application/Identity/FirstPartySessionAuthorityRepository.php               apps/web/app/Infrastructure/Identity/LaravelFirstPartySessionAuthorityRepository.php               apps/web/app/Delivery/Http/Identity/FirstPartySessionControlController.php               apps/web/app/Delivery/Http/Middleware/EnforceActiveFirstPartySessionAuthorityMiddleware.php               apps/web/config/database.php               apps/web/composer.json               apps/web/composer.lock               apps/web/package.json               apps/web/package-lock.json
          elif [[ "${ONEQAY_SPRINT43_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            git diff --exit-code "$base" "$head" --               apps/web/app/Application/Identity/FirstPartySessionAuthorityRepository.php               apps/web/app/Infrastructure/Identity/LaravelFirstPartySessionAuthorityRepository.php               apps/web/app/Delivery/Http/Identity/FirstPartySessionControlController.php               apps/web/app/Delivery/Http/Middleware/EnforceActiveFirstPartySessionAuthorityMiddleware.php               apps/web/config/oneqay.php               apps/web/config/database.php               apps/web/composer.json               apps/web/composer.lock               apps/web/package.json               apps/web/package-lock.json
          else
            git diff --exit-code "$base" "$head" --               apps/web/routes/web.php               apps/web/app/Delivery/Http/Identity/FirstPartyIdentityEligibilityAdministrationController.php               apps/web/app/Application/Identity/FirstPartySessionAuthorityRepository.php               apps/web/app/Infrastructure/Identity/LaravelFirstPartySessionAuthorityRepository.php               apps/web/app/Delivery/Http/Identity/FirstPartySessionControlController.php               apps/web/app/Delivery/Http/Middleware/EnforceActiveFirstPartySessionAuthorityMiddleware.php               apps/web/config/oneqay.php               apps/web/config/database.php               apps/web/composer.json               apps/web/composer.lock               apps/web/package.json               apps/web/package-lock.json
          fi

      - name: Validate dedicated termination contract and adapter
        shell: bash
        run: |
