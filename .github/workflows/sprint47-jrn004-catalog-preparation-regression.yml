name: Sprint47 JRN-004 Catalog Preparation Regression

# Author by Lab | zefry

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sprint47-jrn004-catalog-preparation-regression.yml'
      - 'apps/web/app/Application/Authorization/PosPermission.php'
      - 'apps/web/app/Application/Pos/CatalogPreparationClock.php'
      - 'apps/web/app/Application/Pos/CatalogPreparationCommand.php'
      - 'apps/web/app/Application/Pos/CatalogPreparationRepository.php'
      - 'apps/web/app/Application/Pos/CatalogPreparationResult.php'
      - 'apps/web/app/Application/Pos/PrepareCatalogItem.php'
      - 'apps/web/app/Delivery/Http/Pos/PosCatalogPreparationController.php'
      - 'apps/web/app/Infrastructure/Pos/LaravelCatalogPreparationRepository.php'
      - 'apps/web/app/Providers/AppServiceProvider.php'
      - 'apps/web/config/oneqay.php'
      - 'apps/web/database/migrations/0000_00_00_000017_create_pos_catalog_preparation_journal.php'
      - 'apps/web/routes/web.php'
      - 'apps/web/tests/pos-catalog-preparation-durable.php'
      - 'docs/JRN_004_POS_CATALOG_PRICE_AVAILABILITY_PREPARATION_FOUNDATION.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint47-jrn004-catalog-preparation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sprint47-jrn004-catalog-preparation:
    name: sprint47-jrn004-catalog-preparation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:enp6enp6enp6enp6enp6enp6enp6enp6enp6enp6eno=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      ONEQAY_PERSISTENCE_ENABLED: 'true'
      ONEQAY_AUTHENTICATION_SESSION_CONTROL_ENABLED: 'true'
      ONEQAY_POS_SALE_COMPLETION_ENABLED: 'true'
      ONEQAY_POS_CATALOG_PREPARATION_ENABLED: 'true'
      SESSION_DRIVER: array
      CACHE_STORE: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce exact Sprint47 JRN-004 source envelope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | sort > /tmp/s47-jrn004-source-paths
          count="$(wc -l < /tmp/s47-jrn004-source-paths)"
          fingerprint="$(sha256sum /tmp/s47-jrn004-source-paths | awk '{print $1}')"
          echo 'ONEQAY_SPRINT46_JRN006_COMPATIBILITY_PREDECESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT47_JRN004_COMPATIBILITY_PREDECESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT48_JRN005_SOURCE_SUCCESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT50_JRN007_SOURCE_SUCCESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT50_COMPATIBILITY_PREDECESSOR=false' >> "$GITHUB_ENV"
          if [[ "$count" -eq 15 && "$fingerprint" == 'c1ac6d5130c9d78ff99ed0accf5d11e3f08debc575c0d5152ef5b24e6f82ce02' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s47-jrn004-source-paths)" -eq 1
            grep -Fxq 'apps/web/database/migrations/0000_00_00_000017_create_pos_catalog_preparation_journal.php' /tmp/s47-jrn004-source-paths
            migration17='apps/web/database/migrations/0000_00_00_000017_create_pos_catalog_preparation_journal.php'
            status="$(git diff --name-status "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- "$migration17" | awk 'NR==1 {print $1}')"
            if [[ "$status" == 'A' ]]; then
              echo 'Recognized exact Sprint47 JRN-004 source envelope.'
            elif [[ "$status" == 'M' ]]; then
              echo 'ONEQAY_SPRINT47_JRN004_COMPATIBILITY_PREDECESSOR=true' >> "$GITHUB_ENV"
              echo 'Recognized exact Sprint47 JRN-004 compatibility predecessor envelope.'
            else
              echo "Unexpected JRN-004 migration #17 status: ${status:-none}" >&2
              exit 1
            fi
          elif [[ "$count" -eq 14 && "$fingerprint" == 'ed29b6128c193f0efd6359748e220a37aefaec856acc4bc3b90f445ce3ccb674' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s47-jrn004-source-paths)" -eq 1
            grep -Fxq 'apps/web/database/migrations/0000_00_00_000016_create_pos_sale_completion_foundation.php' /tmp/s47-jrn004-source-paths
            echo 'ONEQAY_SPRINT46_JRN006_COMPATIBILITY_PREDECESSOR=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint46 JRN-006 compatibility predecessor shape.'
          elif [[ "$count" -eq 15 && "$fingerprint" == '5e19664988cabba0030f9927d26b0702370414be4cd6b424d585925b634ca2b8' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s47-jrn004-source-paths)" -eq 1
            grep -Fxq 'apps/web/database/migrations/0000_00_00_000018_create_pos_shift_opening_foundation.php' /tmp/s47-jrn004-source-paths
            echo 'ONEQAY_SPRINT48_JRN005_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint48 JRN-005 shift-opening source successor shape.'
          elif [[ "$count" -eq 14 && "$fingerprint" == '78628976e4dbfea29ecab4b40ec6bfbdf697564668ef028a5cb77a3b53466451' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s47-jrn004-source-paths)" -eq 1
            grep -Fxq 'apps/web/database/migrations/0000_00_00_000019_create_pos_sale_void_foundation.php' /tmp/s47-jrn004-source-paths
            echo 'ONEQAY_SPRINT48_JRN005_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT50_JRN007_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint50 JRN-007 source successor shape.'
          elif [[ "$count" -eq 30 && "$fingerprint" == 'cf8adb2328427a8e27e46f0efd9fe88db90f0401eba9cafd513944c7e040035e' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s47-jrn004-source-paths)" -eq 0
            echo 'ONEQAY_SPRINT48_JRN005_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT50_COMPATIBILITY_PREDECESSOR=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint50 historical compatibility predecessor shape.'
          else
            echo 'Sprint47 changed-file envelope mismatch.' >&2
            exit 1
          fi
          ! grep -Eq '(^|/)(composer\.(json|lock)|package(-lock)?\.json|\.env(\.|$))' /tmp/s47-jrn004-source-paths

      - name: Preserve migrations one through sixteen and validate migration seventeen
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          migration16='apps/web/database/migrations/0000_00_00_000016_create_pos_sale_completion_foundation.php'
          migration='apps/web/database/migrations/0000_00_00_000017_create_pos_catalog_preparation_journal.php'
          migration18='apps/web/database/migrations/0000_00_00_000018_create_pos_shift_opening_foundation.php'
          migration19='apps/web/database/migrations/0000_00_00_000019_create_pos_sale_void_foundation.php'
          if [[ "${ONEQAY_SPRINT50_JRN007_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
            test "$changed" = "$migration19"
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration19"
            git update-index --assume-unchanged "$migration19"
            rm -f "$migration19"
          elif [[ "${ONEQAY_SPRINT50_COMPATIBILITY_PREDECESSOR:-false}" == 'true' ]]; then
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations
          elif [[ "${ONEQAY_SPRINT48_JRN005_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            mapfile -t migration_diff < <(git diff --name-status "$base" "$head" -- apps/web/database/migrations)
            test "${#migration_diff[@]}" -eq 1
            status="$(printf '%s\n' "${migration_diff[0]}" | awk '{print $1}')"
            changed_path="$(printf '%s\n' "${migration_diff[0]}" | awk '{print $2}')"
            test "$status" = 'A'
            test "$changed_path" = "$migration18"
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration18"
          elif [[ "${ONEQAY_SPRINT46_JRN006_COMPATIBILITY_PREDECESSOR:-false}" == 'true' ]]; then
            mapfile -t migration_diff < <(git diff --name-status "$base" "$head" -- apps/web/database/migrations)
            test "${#migration_diff[@]}" -eq 1
            status="$(printf '%s\n' "${migration_diff[0]}" | awk '{print $1}')"
            changed_path="$(printf '%s\n' "${migration_diff[0]}" | awk '{print $2}')"
            test "$status" = 'M'
            test "$changed_path" = "$migration16"
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration16"
          elif [[ "${ONEQAY_SPRINT47_JRN004_COMPATIBILITY_PREDECESSOR:-false}" == 'true' ]]; then
            mapfile -t migration_diff < <(git diff --name-status "$base" "$head" -- apps/web/database/migrations)
            test "${#migration_diff[@]}" -eq 1
            status="$(printf '%s\n' "${migration_diff[0]}" | awk '{print $1}')"
            changed_path="$(printf '%s\n' "${migration_diff[0]}" | awk '{print $2}')"
            test "$status" = 'M'
            test "$changed_path" = "$migration"
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration"
          else
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration"
          fi

          mapfile -t migrations < <(find apps/web/database/migrations -maxdepth 1 -type f -name '*.php' -printf '%f\n' | sort)
          if [[ "${ONEQAY_SPRINT48_JRN005_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            test "${#migrations[@]}" -eq 18
            test -f "$migration18"
          else
            test "${#migrations[@]}" -eq 17
            test ! -f "$migration18"
          fi
          for index in $(seq 1 17); do
            prefix="$(printf '0000_00_00_%06d_' "$index")"
            test "$(printf '%s\n' "${migrations[@]}" | grep -c "^$prefix")" -eq 1
          done

          grep -Fq "Schema::create('oneqay_pos_catalog_preparation_journal'" "$migration"
          grep -Fq "\$table->primary(['tenant_id', 'mutation_id']" "$migration"
          grep -Fq "\$table->unique(['tenant_id', 'operation_id']" "$migration"
          grep -Fq "['tenant_id', 'outlet_id', 'product_id', 'occurred_at_unix']" "$migration"
          grep -Fq "foreign(['tenant_id', 'actor_identity_id']" "$migration"
          grep -Fq "foreign(['tenant_id', 'organization_id']" "$migration"
          grep -Fq "foreign(['tenant_id', 'outlet_id']" "$migration"
          grep -Fq "foreign(['tenant_id', 'device_id']" "$migration"
          grep -Fq "throw new LogicException('Forward-only generated migration; rollback is not authorized.');" "$migration"

      - name: Validate source-default delivery and permission locks
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "env('ONEQAY_POS_CATALOG_PREPARATION_ENABLED', false)" apps/web/config/oneqay.php
          grep -Fq "config('oneqay.pos_catalog_preparation.enabled', false)" apps/web/routes/web.php
          grep -Fq "Route::post('/pos/catalog/preparation'" apps/web/routes/web.php
          grep -Fq "'session.active'" apps/web/routes/web.php
          grep -Fq 'RequirePosSessionContextMiddleware::class' apps/web/routes/web.php
          grep -Fq "public const PREPARE_CATALOG = 'pos.catalog.prepare';" apps/web/app/Application/Authorization/PosPermission.php
          grep -Fq 'PosPermission::prepareCatalog()' apps/web/app/Application/Pos/PrepareCatalogItem.php
          ! grep -Fq 'available_quantity' apps/web/app/Application/Pos/CatalogPreparationCommand.php
          ! grep -Fq 'available_quantity' apps/web/app/Delivery/Http/Pos/PosCatalogPreparationController.php
          grep -Fq "'available_quantity' => 0" apps/web/app/Infrastructure/Pos/LaravelCatalogPreparationRepository.php

      - name: Preserve Domain and Application framework independence
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -F -e 'Illuminate\' -e 'Laravel\' -e 'Schema::' -e 'DB::' \
            apps/web/app/Domain/Pos \
            apps/web/app/Application/Pos \
            apps/web/app/Application/Authorization/PosPermission.php; then
            echo 'Sprint47 JRN-004 Domain/Application framework boundary violated.' >&2
            exit 1
          fi

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find apps/web/app apps/web/database/migrations apps/web/routes apps/web/tests -type f -name '*.php' -print0 |
            while IFS= read -r -d '' file; do php -l "$file"; done

      - name: Install locked dependencies
        working-directory: apps/web
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Reject High or Critical Composer advisories
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          composer audit --locked --format=json > /tmp/oneqay-composer-audit.json
          php -r '
            $data = json_decode(file_get_contents("/tmp/oneqay-composer-audit.json"), true, 512, JSON_THROW_ON_ERROR);
            foreach (($data["advisories"] ?? []) as $items) {
                foreach ($items as $item) {
                    if (in_array(strtolower((string) ($item["severity"] ?? "")), ["high", "critical"], true)) {
                        fwrite(STDERR, "Blocking Composer advisory.\n");
                        exit(1);
                    }
                }
            }
          '

      - name: Run Sprint47 JRN-004 durable catalog regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          migration18='database/migrations/0000_00_00_000018_create_pos_shift_opening_foundation.php'
          if [[ "${ONEQAY_SPRINT48_JRN005_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            backup='/tmp/oneqay-s47-jrn005-migration18.php'
            cp "$migration18" "$backup"
            restore() {
              if [[ -f "$backup" ]]; then mv "$backup" "$migration18"; fi
            }
            trap restore EXIT
            rm -f "$migration18"
            php tests/pos-catalog-preparation-durable.php
            restore
            trap - EXIT
          else
            php tests/pos-catalog-preparation-durable.php
          fi

      - name: Run M7.4 synthetic POS regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          successor='app/Infrastructure/Pos/LaravelShiftOpeningRepository.php'
          if [[ "${ONEQAY_SPRINT48_JRN005_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            backup='/tmp/oneqay-s47-jrn005-shift-opening-repository.php'
            cp "$successor" "$backup"
            restore() {
              if [[ -f "$backup" ]]; then mv "$backup" "$successor"; fi
            }
            trap restore EXIT
            rm -f "$successor"
            php tests/pos-core-synthetic.php
            restore
            trap - EXIT
          else
            php tests/pos-core-synthetic.php
          fi

      - name: Preserve tracked source cleanliness
        run: git diff --exit-code
