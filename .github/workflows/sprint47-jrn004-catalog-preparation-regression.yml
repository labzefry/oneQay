# Sprint54 bounded successor compatibility predecessor — Lab | zefry
# Sprint53 bounded third historical fixture compatibility closure — Lab | zefry
name: Sprint47 JRN-004 Catalog Preparation Regression

# Author by Lab | zefry

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sprint47-jrn004-catalog-preparation-regression.yml'
      - 'apps/web/app/Application/Authorization/PosPermission.php'
      - 'apps/web/app/Application/Pos/CatalogPreparationClock.php'
      - 'apps/web/app/Application/Pos/CatalogPreparationCommand.php'
      - 'apps/web/app/Application/Pos/CatalogPreparationRepository.php'
      - 'apps/web/app/Application/Pos/CatalogPreparationResult.php'
      - 'apps/web/app/Application/Pos/PrepareCatalogItem.php'
      - 'apps/web/app/Delivery/Http/Pos/PosCatalogPreparationController.php'
      - 'apps/web/app/Infrastructure/Pos/LaravelCatalogPreparationRepository.php'
      - 'apps/web/app/Providers/AppServiceProvider.php'
      - 'apps/web/config/oneqay.php'
      - 'apps/web/database/migrations/0000_00_00_000017_create_pos_catalog_preparation_journal.php'
      - 'apps/web/routes/web.php'
      - 'apps/web/tests/pos-catalog-preparation-durable.php'
      - 'docs/JRN_004_POS_CATALOG_PRICE_AVAILABILITY_PREPARATION_FOUNDATION.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint47-jrn004-catalog-preparation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sprint47-jrn004-catalog-preparation:
    name: sprint47-jrn004-catalog-preparation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:enp6enp6enp6enp6enp6enp6enp6enp6enp6enp6eno=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      ONEQAY_PERSISTENCE_ENABLED: 'true'
      ONEQAY_AUTHENTICATION_SESSION_CONTROL_ENABLED: 'true'
      ONEQAY_POS_SALE_COMPLETION_ENABLED: 'true'
      ONEQAY_POS_CATALOG_PREPARATION_ENABLED: 'true'
      SESSION_DRIVER: array
      CACHE_STORE: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce exact Sprint47 JRN-004 source envelope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | sort > /tmp/s47-jrn004-source-paths
          count="$(wc -l < /tmp/s47-jrn004-source-paths)"
          fingerprint="$(sha256sum /tmp/s47-jrn004-source-paths | awk '{print $1}')"
          echo 'ONEQAY_SPRINT46_JRN006_COMPATIBILITY_PREDECESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT47_JRN004_COMPATIBILITY_PREDECESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT48_JRN005_SOURCE_SUCCESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT50_JRN007_SOURCE_SUCCESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT50_COMPATIBILITY_PREDECESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT51_JRN008_SOURCE_SUCCESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT52_JRN007_SOURCE_SUCCESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT53_JRN010_PREREQ_SOURCE_SUCCESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT54_JRN010_PREREQ_SOURCE_SUCCESSOR=false' >> "$GITHUB_ENV"
          if [[ "$count" -eq 6 && "$fingerprint" == 'cc40f08beda780e4aa4795f29aa7533bbde1029d11855d43f180812502c4d80b' ]]; then
            for expected in \
              '.github/workflows/sprint69-jrn010-prerequisite-cash-variance-explanation-source-regression.yml' \
              'apps/web/app/Application/Authorization/PosPermission.php' \
              'apps/web/app/Application/Pos/RecordCashVarianceExplanation.php' \
              'apps/web/tests/pos-cash-variance-explanation-authorization.php' \
              'apps/web/tests/pos-cash-variance-explanation-durable.php' \
              'docs/JRN_010_PREREQUISITE_CASH_VARIANCE_EXPLANATION_AUTHORIZATION_SOURCE_FOUNDATION.md' \
            do
              grep -Fxq "$expected" /tmp/s47-jrn004-source-paths
            done
            echo 'Recognized exact Sprint74 authorization source successor shape.'
          elif [[ "$count" -eq 8 && "$fingerprint" == '3e5b516b17bfc4b2b4e8694248672ff7a4298a3e080e0617a70b1bb1d8aa6194' ]]; then
            for expected in \
              '.github/workflows/sprint46-jrn006-durable-sale-completion-regression.yml' \
              '.github/workflows/sprint47-jrn004-catalog-preparation-regression.yml' \
              '.github/workflows/sprint48-jrn005-shift-register-opening-regression.yml' \
              '.github/workflows/sprint50-jrn007-completed-sale-void-regression.yml' \
              '.github/workflows/sprint51-jrn008-bounded-outlet-inventory-baseline-regression.yml' \
              '.github/workflows/sprint52-jrn007-bounded-full-cash-refund-regression.yml' \
              '.github/workflows/sprint53-jrn010-prerequisite-shift-opening-cash-evidence-regression.yml' \
              '.github/workflows/sprint54-jrn010-prerequisite-shift-closing-cash-evidence-regression.yml' \
            do
              grep -Fxq "$expected" /tmp/s47-jrn004-source-paths
            done
            echo 'Recognized exact Sprint74 POS historical compatibility self-qualification shape.'
          elif [[ "$count" -eq 15 && "$fingerprint" == 'c1ac6d5130c9d78ff99ed0accf5d11e3f08debc575c0d5152ef5b24e6f82ce02' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s47-jrn004-source-paths)" -eq 1
            grep -Fxq 'apps/web/database/migrations/0000_00_00_000017_create_pos_catalog_preparation_journal.php' /tmp/s47-jrn004-source-paths
            migration17='apps/web/database/migrations/0000_00_00_000017_create_pos_catalog_preparation_journal.php'
            status="$(git diff --name-status "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- "$migration17" | awk 'NR==1 {print $1}')"
            if [[ "$status" == 'A' ]]; then
              echo 'Recognized exact Sprint47 JRN-004 source envelope.'
            elif [[ "$status" == 'M' ]]; then
              echo 'ONEQAY_SPRINT47_JRN004_COMPATIBILITY_PREDECESSOR=true' >> "$GITHUB_ENV"
              echo 'Recognized exact Sprint47 JRN-004 compatibility predecessor envelope.'
            else
              echo "Unexpected JRN-004 migration #17 status: ${status:-none}" >&2
              exit 1
            fi
          elif [[ "$count" -eq 14 && "$fingerprint" == 'ed29b6128c193f0efd6359748e220a37aefaec856acc4bc3b90f445ce3ccb674' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s47-jrn004-source-paths)" -eq 1
            grep -Fxq 'apps/web/database/migrations/0000_00_00_000016_create_pos_sale_completion_foundation.php' /tmp/s47-jrn004-source-paths
            echo 'ONEQAY_SPRINT46_JRN006_COMPATIBILITY_PREDECESSOR=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint46 JRN-006 compatibility predecessor shape.'
          elif [[ "$count" -eq 15 && "$fingerprint" == '5e19664988cabba0030f9927d26b0702370414be4cd6b424d585925b634ca2b8' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s47-jrn004-source-paths)" -eq 1
            grep -Fxq 'apps/web/database/migrations/0000_00_00_000018_create_pos_shift_opening_foundation.php' /tmp/s47-jrn004-source-paths
            echo 'ONEQAY_SPRINT48_JRN005_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint48 JRN-005 shift-opening source successor shape.'
          elif [[ "$count" -eq 14 && "$fingerprint" == '78628976e4dbfea29ecab4b40ec6bfbdf697564668ef028a5cb77a3b53466451' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s47-jrn004-source-paths)" -eq 1
            grep -Fxq 'apps/web/database/migrations/0000_00_00_000019_create_pos_sale_void_foundation.php' /tmp/s47-jrn004-source-paths
            echo 'ONEQAY_SPRINT48_JRN005_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT50_JRN007_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint50 JRN-007 source successor shape.'
          elif [[ "$count" -eq 15 && "$fingerprint" == '325559599c79ba68340eac34569f8e5513aa4957b1ddf2515007b98b2cc1f15f' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s47-jrn004-source-paths)" -eq 1
            grep -Fxq 'apps/web/database/migrations/0000_00_00_000020_create_pos_inventory_baseline_foundation.php' /tmp/s47-jrn004-source-paths
            echo 'ONEQAY_SPRINT48_JRN005_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT51_JRN008_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint51 JRN-008 source successor shape.'
          elif [[ "$count" -eq 14 && "$fingerprint" == 'ad4f6c62c820bdc59d7c1c8550ffeec0a4a0718ba4388a516418d50468d7e9d5' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s47-jrn004-source-paths)" -eq 1
            grep -Fxq 'apps/web/database/migrations/0000_00_00_000021_create_pos_sale_cash_refund_foundation.php' /tmp/s47-jrn004-source-paths
            echo 'ONEQAY_SPRINT48_JRN005_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT51_JRN008_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT52_JRN007_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint52 JRN-007 full CASH refund source successor shape.'
          elif [[ "$count" -eq 14 && "$fingerprint" == 'a0914d7db5c1636e909e331e8b72653bc9814eb74e3a3823d7db36bd3b73b624' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s47-jrn004-source-paths)" -eq 1
            grep -Fxq 'apps/web/database/migrations/0000_00_00_000023_create_pos_shift_closing_cash_evidence_foundation.php' /tmp/s47-jrn004-source-paths
            echo 'ONEQAY_SPRINT48_JRN005_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT51_JRN008_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT52_JRN007_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT53_JRN010_PREREQ_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT54_JRN010_PREREQ_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint54 closing-cash source successor shape.'
          elif [[ "$count" -eq 14 && "$fingerprint" == '1d75fe26236e2bb56c113713e878e81d3df72cee9aa647b3f7759b9d1bec9164' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s47-jrn004-source-paths)" -eq 1
            grep -Fxq 'apps/web/database/migrations/0000_00_00_000022_create_pos_shift_opening_cash_evidence_foundation.php' /tmp/s47-jrn004-source-paths
            echo 'ONEQAY_SPRINT48_JRN005_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT51_JRN008_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT52_JRN007_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT53_JRN010_PREREQ_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint53 opening-cash source successor shape.'
          elif [[ "$count" -eq 30 && "$fingerprint" == '930cd1237722f4dd0af03e85d684ffa435adab6a1ae16db96d78243510fd85bc' ]] || [[ "$count" -eq 6 && "$fingerprint" == 'ee7e3bdc0de47cf8a762635a5ca69af1afde8cb2048363f4902b42a1290c9f14' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s47-jrn004-source-paths)" -eq 0
            echo 'ONEQAY_SPRINT50_COMPATIBILITY_PREDECESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT53_JRN010_PREREQ_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint53 workflow-only compatibility correction shape.'
          elif [[ "$count" -eq 30 && "$fingerprint" == 'cf8adb2328427a8e27e46f0efd9fe88db90f0401eba9cafd513944c7e040035e' ]] || [[ "$count" -eq 28 && "$fingerprint" == '3b97670674b60c636a23e52551b7ade69a3f545d5d0b4a861fa1c06eae5c0656' ]] || [[ "$count" -eq 29 && "$fingerprint" == 'e56a3e2732f5d5b0b40dd3ae50ec25746cf18bc8bd556d25405e85642c789878' ]]; then
            if [[ "$count" -eq 29 && "$fingerprint" == 'e56a3e2732f5d5b0b40dd3ae50ec25746cf18bc8bd556d25405e85642c789878' ]]; then
              echo 'ONEQAY_SPRINT52_COMPATIBILITY_PREDECESSOR=true' >> "$GITHUB_ENV"
            fi
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s47-jrn004-source-paths)" -eq 0
            echo 'ONEQAY_SPRINT48_JRN005_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT50_COMPATIBILITY_PREDECESSOR=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint50 historical compatibility predecessor shape.'
          else
            echo 'Sprint47 changed-file envelope mismatch.' >&2
            exit 1
          fi
          ! grep -Eq '(^|/)(composer\.(json|lock)|package(-lock)?\.json|\.env(\.|$))' /tmp/s47-jrn004-source-paths

      - name: Preserve migrations one through sixteen and validate migration seventeen
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          migration16='apps/web/database/migrations/0000_00_00_000016_create_pos_sale_completion_foundation.php'
          migration='apps/web/database/migrations/0000_00_00_000017_create_pos_catalog_preparation_journal.php'
          migration18='apps/web/database/migrations/0000_00_00_000018_create_pos_shift_opening_foundation.php'
          migration19='apps/web/database/migrations/0000_00_00_000019_create_pos_sale_void_foundation.php'
          migration20='apps/web/database/migrations/0000_00_00_000020_create_pos_inventory_baseline_foundation.php'
          if [[ "${ONEQAY_SPRINT52_COMPATIBILITY_PREDECESSOR:-false}" == 'true' && -f "$migration20" ]]; then
            git update-index --assume-unchanged "$migration20"
            rm -f "$migration20"
          fi
          migration21='apps/web/database/migrations/0000_00_00_000021_create_pos_sale_cash_refund_foundation.php'
          migration22='apps/web/database/migrations/0000_00_00_000022_create_pos_shift_opening_cash_evidence_foundation.php'
          migration23='apps/web/database/migrations/0000_00_00_000023_create_pos_shift_closing_cash_evidence_foundation.php'
          if [[ "${ONEQAY_SPRINT54_JRN010_PREREQ_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
            changed_count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)"
            if [[ "$changed_count" -eq 1 ]]; then printf '%s\n' "$changed" | grep -Fxq "$migration23"; else test "$changed_count" -eq 0; fi
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration23"
            for historical_migration in "$migration18" "$migration19" "$migration20" "$migration21" "$migration22" "$migration23"; do
              if [[ -f "$historical_migration" ]]; then git update-index --assume-unchanged "$historical_migration"; rm -f "$historical_migration"; fi
            done
          elif [[ "${ONEQAY_SPRINT53_JRN010_PREREQ_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
            changed_count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)"
            if [[ "$changed_count" -eq 1 ]]; then printf '%s\n' "$changed" | grep -Fxq "$migration22"; else test "$changed_count" -eq 0; fi
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration22"
            for historical_migration in "$migration18" "$migration19" "$migration20" "$migration21" "$migration22"; do
              if [[ -f "$historical_migration" ]]; then git update-index --assume-unchanged "$historical_migration"; rm -f "$historical_migration"; fi
            done
          elif [[ "${ONEQAY_SPRINT52_JRN007_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
            test "$changed" = "$migration21"
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration21"
            if [[ -f "$migration19" ]]; then git update-index --assume-unchanged "$migration19"; rm -f "$migration19"; fi
            if [[ -f "$migration20" ]]; then git update-index --assume-unchanged "$migration20"; rm -f "$migration20"; fi
            git update-index --assume-unchanged "$migration21"
            rm -f "$migration21"
          elif [[ "${ONEQAY_SPRINT51_JRN008_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
            test "$changed" = "$migration20"
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration20"
            if [[ -f "$migration19" ]]; then git update-index --assume-unchanged "$migration19"; rm -f "$migration19"; fi
            git update-index --assume-unchanged "$migration20"
            rm -f "$migration20"
          elif [[ "${ONEQAY_SPRINT50_JRN007_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
            test "$changed" = "$migration19"
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration19"
            git update-index --assume-unchanged "$migration19"
            rm -f "$migration19"
          elif [[ "${ONEQAY_SPRINT50_COMPATIBILITY_PREDECESSOR:-false}" == 'true' ]]; then
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations
            if [[ -f "$migration19" ]]; then
              git update-index --assume-unchanged "$migration19"
              rm -f "$migration19"
            fi
          elif [[ "${ONEQAY_SPRINT48_JRN005_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            mapfile -t migration_diff < <(git diff --name-status "$base" "$head" -- apps/web/database/migrations)
            test "${#migration_diff[@]}" -eq 1
            status="$(printf '%s\n' "${migration_diff[0]}" | awk '{print $1}')"
            changed_path="$(printf '%s\n' "${migration_diff[0]}" | awk '{print $2}')"
            test "$status" = 'A'
            test "$changed_path" = "$migration18"
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration18"
          elif [[ "${ONEQAY_SPRINT46_JRN006_COMPATIBILITY_PREDECESSOR:-false}" == 'true' ]]; then
            mapfile -t migration_diff < <(git diff --name-status "$base" "$head" -- apps/web/database/migrations)
            test "${#migration_diff[@]}" -eq 1
            status="$(printf '%s\n' "${migration_diff[0]}" | awk '{print $1}')"
            changed_path="$(printf '%s\n' "${migration_diff[0]}" | awk '{print $2}')"
            test "$status" = 'M'
            test "$changed_path" = "$migration16"
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration16"
          elif [[ "${ONEQAY_SPRINT47_JRN004_COMPATIBILITY_PREDECESSOR:-false}" == 'true' ]]; then
            mapfile -t migration_diff < <(git diff --name-status "$base" "$head" -- apps/web/database/migrations)
            test "${#migration_diff[@]}" -eq 1
            status="$(printf '%s\n' "${migration_diff[0]}" | awk '{print $1}')"
            changed_path="$(printf '%s\n' "${migration_diff[0]}" | awk '{print $2}')"
            test "$status" = 'M'
            test "$changed_path" = "$migration"
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration"
          else
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration"
          fi

          mapfile -t migrations < <(find apps/web/database/migrations -maxdepth 1 -type f -name '*.php' -printf '%f\n' | sort)
          if [[ "${ONEQAY_SPRINT53_JRN010_PREREQ_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            test "${#migrations[@]}" -eq 17
            test ! -f "$migration18"
          elif [[ "${ONEQAY_SPRINT48_JRN005_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            test "${#migrations[@]}" -eq 18
            test -f "$migration18"
          else
            test "${#migrations[@]}" -eq 17
            test ! -f "$migration18"
          fi
          for index in $(seq 1 17); do
            prefix="$(printf '0000_00_00_%06d_' "$index")"
            test "$(printf '%s\n' "${migrations[@]}" | grep -c "^$prefix")" -eq 1
          done

          grep -Fq "Schema::create('oneqay_pos_catalog_preparation_journal'" "$migration"
          grep -Fq "\$table->primary(['tenant_id', 'mutation_id']" "$migration"
          grep -Fq "\$table->unique(['tenant_id', 'operation_id']" "$migration"
          grep -Fq "['tenant_id', 'outlet_id', 'product_id', 'occurred_at_unix']" "$migration"
          grep -Fq "foreign(['tenant_id', 'actor_identity_id']" "$migration"
          grep -Fq "foreign(['tenant_id', 'organization_id']" "$migration"
          grep -Fq "foreign(['tenant_id', 'outlet_id']" "$migration"
          grep -Fq "foreign(['tenant_id', 'device_id']" "$migration"
          grep -Fq "throw new LogicException('Forward-only generated migration; rollback is not authorized.');" "$migration"

      - name: Validate source-default delivery and permission locks
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "env('ONEQAY_POS_CATALOG_PREPARATION_ENABLED', false)" apps/web/config/oneqay.php
          grep -Fq "config('oneqay.pos_catalog_preparation.enabled', false)" apps/web/routes/web.php
          grep -Fq "Route::post('/pos/catalog/preparation'" apps/web/routes/web.php
          grep -Fq "'session.active'" apps/web/routes/web.php
          grep -Fq 'RequirePosSessionContextMiddleware::class' apps/web/routes/web.php
          grep -Fq "public const PREPARE_CATALOG = 'pos.catalog.prepare';" apps/web/app/Application/Authorization/PosPermission.php
          grep -Fq 'PosPermission::prepareCatalog()' apps/web/app/Application/Pos/PrepareCatalogItem.php
          ! grep -Fq 'available_quantity' apps/web/app/Application/Pos/CatalogPreparationCommand.php
          ! grep -Fq 'available_quantity' apps/web/app/Delivery/Http/Pos/PosCatalogPreparationController.php
          grep -Fq "'available_quantity' => 0" apps/web/app/Infrastructure/Pos/LaravelCatalogPreparationRepository.php

      - name: Preserve Domain and Application framework independence
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -F -e 'Illuminate\' -e 'Laravel\' -e 'Schema::' -e 'DB::' \
            apps/web/app/Domain/Pos \
            apps/web/app/Application/Pos \
            apps/web/app/Application/Authorization/PosPermission.php; then
            echo 'Sprint47 JRN-004 Domain/Application framework boundary violated.' >&2
            exit 1
          fi

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find apps/web/app apps/web/database/migrations apps/web/routes apps/web/tests -type f -name '*.php' -print0 |
            while IFS= read -r -d '' file; do php -l "$file"; done

      - name: Install locked dependencies
        working-directory: apps/web
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Reject High or Critical Composer advisories
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          composer audit --locked --format=json > /tmp/oneqay-composer-audit.json
          php -r '
            $data = json_decode(file_get_contents("/tmp/oneqay-composer-audit.json"), true, 512, JSON_THROW_ON_ERROR);
            foreach (($data["advisories"] ?? []) as $items) {
                foreach ($items as $item) {
                    if (in_array(strtolower((string) ($item["severity"] ?? "")), ["high", "critical"], true)) {
                        fwrite(STDERR, "Blocking Composer advisory.\n");
                        exit(1);
                    }
                }
            }
          '

      - name: Run Sprint47 JRN-004 durable catalog regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          migration18='database/migrations/0000_00_00_000018_create_pos_shift_opening_foundation.php'
          if [[ "${ONEQAY_SPRINT53_JRN010_PREREQ_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            test ! -f "$migration18"
            php tests/pos-catalog-preparation-durable.php
          elif [[ "${ONEQAY_SPRINT48_JRN005_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            backup='/tmp/oneqay-s47-jrn005-migration18.php'
            cp "$migration18" "$backup"
            restore() {
              if [[ -f "$backup" ]]; then mv "$backup" "$migration18"; fi
            }
            trap restore EXIT
            rm -f "$migration18"
            php tests/pos-catalog-preparation-durable.php
            restore
            trap - EXIT
          else
            php tests/pos-catalog-preparation-durable.php
          fi

      - name: Run M7.4 synthetic POS regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          successor='app/Infrastructure/Pos/LaravelShiftOpeningRepository.php'
          inventory='app/Infrastructure/Pos/LaravelInventoryBaselineRepository.php'
          refund='app/Infrastructure/Pos/LaravelSaleCashRefundRepository.php'
          opening_cash='app/Infrastructure/Pos/LaravelShiftOpeningCashRepository.php'
          closing_cash='app/Infrastructure/Pos/LaravelShiftClosingCashRepository.php'
          if [[ "${ONEQAY_SPRINT53_JRN010_PREREQ_SOURCE_SUCCESSOR:-false}" == 'true' || "${ONEQAY_SPRINT52_JRN007_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            shift_backup='/tmp/oneqay-s47-jrn008-shift-opening-repository.php'
            inventory_backup='/tmp/oneqay-s47-jrn008-inventory-repository.php'
            refund_backup='/tmp/oneqay-s47-jrn007-refund-repository.php'
            opening_cash_backup='/tmp/oneqay-s53-opening-cash-repository.php'
            closing_cash_backup='/tmp/oneqay-s54-closing-cash-repository.php'
            cp "$successor" "$shift_backup"
            cp "$inventory" "$inventory_backup"
            cp "$refund" "$refund_backup"
            if [[ -f "$opening_cash" ]]; then cp "$opening_cash" "$opening_cash_backup"; fi
            if [[ -f "$closing_cash" ]]; then cp "$closing_cash" "$closing_cash_backup"; fi
            restore_s52() {
              [[ ! -f "$shift_backup" ]] || mv "$shift_backup" "$successor"
              [[ ! -f "$inventory_backup" ]] || mv "$inventory_backup" "$inventory"
              [[ ! -f "$refund_backup" ]] || mv "$refund_backup" "$refund"
              [[ ! -f "$opening_cash_backup" ]] || mv "$opening_cash_backup" "$opening_cash"
              [[ ! -f "$closing_cash_backup" ]] || mv "$closing_cash_backup" "$closing_cash"
            }
            trap restore_s52 EXIT
            rm -f "$successor" "$inventory" "$refund" "$opening_cash" "$closing_cash"
            php tests/pos-core-synthetic.php
            restore_s52
            trap - EXIT
          elif [[ "${ONEQAY_SPRINT51_JRN008_SOURCE_SUCCESSOR:-false}" == 'true' || "${ONEQAY_SPRINT52_COMPATIBILITY_PREDECESSOR:-false}" == 'true' ]]; then
            shift_backup='/tmp/oneqay-s47-jrn008-shift-opening-repository.php'
            inventory_backup='/tmp/oneqay-s47-jrn008-inventory-repository.php'
            cp "$successor" "$shift_backup"
            cp "$inventory" "$inventory_backup"
            restore() {
              [[ ! -f "$shift_backup" ]] || mv "$shift_backup" "$successor"
              [[ ! -f "$inventory_backup" ]] || mv "$inventory_backup" "$inventory"
            }
            trap restore EXIT
            rm -f "$successor" "$inventory"
            php tests/pos-core-synthetic.php
            restore
            trap - EXIT
          elif [[ "${ONEQAY_SPRINT48_JRN005_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            backup='/tmp/oneqay-s47-jrn005-shift-opening-repository.php'
            cp "$successor" "$backup"
            restore() {
              if [[ -f "$backup" ]]; then mv "$backup" "$successor"; fi
            }
            trap restore EXIT
            rm -f "$successor"
            php tests/pos-core-synthetic.php
            restore
            trap - EXIT
          else
            php tests/pos-core-synthetic.php
          fi
      - name: Preserve tracked source cleanliness
        run: git diff --exit-code
