name: Sprint48 JRN-005 Shift Register Opening Regression

# Author by Lab | zefry

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sprint48-jrn005-shift-register-opening-regression.yml'
      - 'apps/web/app/Application/Authorization/PosPermission.php'
      - 'apps/web/app/Application/Pos/ShiftOpeningClock.php'
      - 'apps/web/app/Application/Pos/ShiftOpeningCommand.php'
      - 'apps/web/app/Application/Pos/ShiftOpeningRepository.php'
      - 'apps/web/app/Application/Pos/ShiftOpeningResult.php'
      - 'apps/web/app/Application/Pos/OpenShift.php'
      - 'apps/web/app/Delivery/Http/Pos/PosShiftOpeningController.php'
      - 'apps/web/app/Infrastructure/Pos/LaravelShiftOpeningRepository.php'
      - 'apps/web/app/Providers/AppServiceProvider.php'
      - 'apps/web/config/oneqay.php'
      - 'apps/web/database/migrations/0000_00_00_000018_create_pos_shift_opening_foundation.php'
      - 'apps/web/routes/web.php'
      - 'apps/web/tests/pos-shift-opening-durable.php'
      - 'docs/JRN_005_POS_SHIFT_REGISTER_OPENING_FOUNDATION.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint48-jrn005-shift-opening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sprint48-jrn005-shift-opening:
    name: sprint48-jrn005-shift-opening
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:enp6enp6enp6enp6enp6enp6enp6enp6enp6enp6eno=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      ONEQAY_PERSISTENCE_ENABLED: 'true'
      ONEQAY_AUTHENTICATION_SESSION_CONTROL_ENABLED: 'true'
      ONEQAY_POS_SHIFT_OPENING_ENABLED: 'true'
      SESSION_DRIVER: array
      CACHE_STORE: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce exact Sprint48 JRN-005 source envelope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | sort > /tmp/s48-jrn005-source-paths
          test "$(wc -l < /tmp/s48-jrn005-source-paths)" -eq 15
          test "$(sha256sum /tmp/s48-jrn005-source-paths | awk '{print $1}')" = '5e19664988cabba0030f9927d26b0702370414be4cd6b424d585925b634ca2b8'
          test "$(grep -c '^apps/web/database/migrations/' /tmp/s48-jrn005-source-paths)" -eq 1
          grep -Fxq 'apps/web/database/migrations/0000_00_00_000018_create_pos_shift_opening_foundation.php' /tmp/s48-jrn005-source-paths
          ! grep -Eq '(^|/)(composer\.(json|lock)|package(-lock)?\.json|\.env(\.|$))' /tmp/s48-jrn005-source-paths

      - name: Preserve migrations one through seventeen and validate migration eighteen
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          migration='apps/web/database/migrations/0000_00_00_000018_create_pos_shift_opening_foundation.php'
          git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration"
          mapfile -t migrations < <(find apps/web/database/migrations -maxdepth 1 -type f -name '*.php' -printf '%f\n' | sort)
          test "${#migrations[@]}" -eq 18
          for index in $(seq 1 18); do
            prefix="$(printf '0000_00_00_%06d_' "$index")"
            test "$(printf '%s\n' "${migrations[@]}" | grep -c "^$prefix")" -eq 1
          done
          grep -Fq "Schema::create('oneqay_pos_shifts'" "$migration"
          grep -Fq "unique(['tenant_id', 'operation_id']" "$migration"
          grep -Fq "['tenant_id', 'outlet_id', 'device_id', 'active_slot']" "$migration"
          grep -Fq "throw new LogicException('Forward-only generated migration; rollback is not authorized.');" "$migration"

      - name: Validate source-default and delivery locks
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "env('ONEQAY_POS_SHIFT_OPENING_ENABLED', false)" apps/web/config/oneqay.php
          grep -Fq "config('oneqay.pos_shift_opening.enabled', false)" apps/web/routes/web.php
          grep -Fq "Route::post('/pos/shifts/open'" apps/web/routes/web.php
          grep -Fq "'session.active'" apps/web/routes/web.php
          grep -Fq 'RequirePosSessionContextMiddleware::class' apps/web/routes/web.php
          grep -Fq "public const OPEN_SHIFT = 'pos.shift.open';" apps/web/app/Application/Authorization/PosPermission.php

      - name: Preserve Application framework independence
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -F -e 'Illuminate\' -e 'Laravel\' -e 'Schema::' -e 'DB::' \
            apps/web/app/Application/Pos apps/web/app/Application/Authorization/PosPermission.php; then
            echo 'Sprint48 JRN-005 Application framework boundary violated.' >&2
            exit 1
          fi

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find apps/web/app apps/web/database/migrations apps/web/routes apps/web/tests -type f -name '*.php' -print0 |
            while IFS= read -r -d '' file; do php -l "$file"; done

      - name: Install locked dependencies
        working-directory: apps/web
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Reject High or Critical Composer advisories
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          composer audit --locked --format=json > /tmp/oneqay-composer-audit.json
          php -r '
            $data = json_decode(file_get_contents("/tmp/oneqay-composer-audit.json"), true, 512, JSON_THROW_ON_ERROR);
            foreach (($data["advisories"] ?? []) as $items) {
                foreach ($items as $item) {
                    if (in_array(strtolower((string) ($item["severity"] ?? "")), ["high", "critical"], true)) {
                        fwrite(STDERR, "Blocking Composer advisory.\n");
                        exit(1);
                    }
                }
            }
          '

      - name: Run Sprint48 JRN-005 durable shift regression
        working-directory: apps/web
        run: php tests/pos-shift-opening-durable.php

      - name: Run M7.4 synthetic POS regression
        working-directory: apps/web
        run: php tests/pos-core-synthetic.php

      - name: Preserve JRN-004 durable catalog regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          migration18='database/migrations/0000_00_00_000018_create_pos_shift_opening_foundation.php'
          cp "$migration18" /tmp/oneqay-s48-migration18.php
          rm -f "$migration18"
          php tests/pos-catalog-preparation-durable.php
          mv /tmp/oneqay-s48-migration18.php "$migration18"

      - name: Preserve JRN-006 durable sale regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          migration17='database/migrations/0000_00_00_000017_create_pos_catalog_preparation_journal.php'
          migration18='database/migrations/0000_00_00_000018_create_pos_shift_opening_foundation.php'
          cp "$migration17" /tmp/oneqay-s48-migration17.php
          cp "$migration18" /tmp/oneqay-s48-migration18.php
          rm -f "$migration17" "$migration18"
          php tests/pos-sale-completion-durable.php
          mv /tmp/oneqay-s48-migration17.php "$migration17"
          mv /tmp/oneqay-s48-migration18.php "$migration18"

      - name: Preserve tracked source cleanliness
        run: git diff --exit-code
