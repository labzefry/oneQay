name: Sprint48 JRN-005 Shift Register Opening Regression

# Author by Lab | zefry

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sprint48-jrn005-shift-register-opening-regression.yml'
      - 'apps/web/app/Application/Authorization/PosPermission.php'
      - 'apps/web/app/Application/Pos/ShiftOpeningClock.php'
      - 'apps/web/app/Application/Pos/ShiftOpeningCommand.php'
      - 'apps/web/app/Application/Pos/ShiftOpeningRepository.php'
      - 'apps/web/app/Application/Pos/ShiftOpeningResult.php'
      - 'apps/web/app/Application/Pos/OpenShift.php'
      - 'apps/web/app/Delivery/Http/Pos/PosShiftOpeningController.php'
      - 'apps/web/app/Infrastructure/Pos/LaravelShiftOpeningRepository.php'
      - 'apps/web/app/Providers/AppServiceProvider.php'
      - 'apps/web/config/oneqay.php'
      - 'apps/web/database/migrations/0000_00_00_000018_create_pos_shift_opening_foundation.php'
      - 'apps/web/routes/web.php'
      - 'apps/web/tests/pos-shift-opening-durable.php'
      - 'docs/JRN_005_POS_SHIFT_REGISTER_OPENING_FOUNDATION.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint48-jrn005-shift-opening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sprint48-jrn005-shift-opening:
    name: sprint48-jrn005-shift-opening
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:enp6enp6enp6enp6enp6enp6enp6enp6enp6enp6eno=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      ONEQAY_PERSISTENCE_ENABLED: 'true'
      ONEQAY_AUTHENTICATION_SESSION_CONTROL_ENABLED: 'true'
      ONEQAY_POS_SHIFT_OPENING_ENABLED: 'true'
      SESSION_DRIVER: array
      CACHE_STORE: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce exact Sprint48 JRN-005 source envelope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | sort > /tmp/s48-jrn005-source-paths
          count="$(wc -l < /tmp/s48-jrn005-source-paths)"
          fingerprint="$(sha256sum /tmp/s48-jrn005-source-paths | awk '{print $1}')"
          echo 'ONEQAY_SPRINT50_JRN007_SOURCE_SUCCESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT50_COMPATIBILITY_PREDECESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT51_JRN008_SOURCE_SUCCESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT52_JRN007_SOURCE_SUCCESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT53_JRN010_PREREQ_SOURCE_SUCCESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT54_JRN010_PREREQ_SOURCE_SUCCESSOR=false' >> "$GITHUB_ENV"
          if [[ "$count" -eq 6 && "$fingerprint" == 'cc40f08beda780e4aa4795f29aa7533bbde1029d11855d43f180812502c4d80b' ]]; then
            for expected in \
              '.github/workflows/sprint69-jrn010-prerequisite-cash-variance-explanation-source-regression.yml' \
              'apps/web/app/Application/Authorization/PosPermission.php' \
              'apps/web/app/Application/Pos/RecordCashVarianceExplanation.php' \
              'apps/web/tests/pos-cash-variance-explanation-authorization.php' \
              'apps/web/tests/pos-cash-variance-explanation-durable.php' \
              'docs/JRN_010_PREREQUISITE_CASH_VARIANCE_EXPLANATION_AUTHORIZATION_SOURCE_FOUNDATION.md' \
            do
              grep -Fxq "$expected" /tmp/s48-jrn005-source-paths
            done
            echo 'Recognized exact Sprint74 authorization source successor shape.'
          elif [[ "$count" -eq 8 && "$fingerprint" == '3e5b516b17bfc4b2b4e8694248672ff7a4298a3e080e0617a70b1bb1d8aa6194' ]]; then
            for expected in \
              '.github/workflows/sprint46-jrn006-durable-sale-completion-regression.yml' \
              '.github/workflows/sprint47-jrn004-catalog-preparation-regression.yml' \
              '.github/workflows/sprint48-jrn005-shift-register-opening-regression.yml' \
              '.github/workflows/sprint50-jrn007-completed-sale-void-regression.yml' \
              '.github/workflows/sprint51-jrn008-bounded-outlet-inventory-baseline-regression.yml' \
              '.github/workflows/sprint52-jrn007-bounded-full-cash-refund-regression.yml' \
              '.github/workflows/sprint53-jrn010-prerequisite-shift-opening-cash-evidence-regression.yml' \
              '.github/workflows/sprint54-jrn010-prerequisite-shift-closing-cash-evidence-regression.yml' \
            do
              grep -Fxq "$expected" /tmp/s48-jrn005-source-paths
            done
            echo 'Recognized exact Sprint74 POS historical compatibility self-qualification shape.'
          elif [[ "$count" -eq 15 && "$fingerprint" == '5e19664988cabba0030f9927d26b0702370414be4cd6b424d585925b634ca2b8' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s48-jrn005-source-paths)" -eq 1
            grep -Fxq 'apps/web/database/migrations/0000_00_00_000018_create_pos_shift_opening_foundation.php' /tmp/s48-jrn005-source-paths
          elif [[ "$count" -eq 14 && "$fingerprint" == '78628976e4dbfea29ecab4b40ec6bfbdf697564668ef028a5cb77a3b53466451' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s48-jrn005-source-paths)" -eq 1
            grep -Fxq 'apps/web/database/migrations/0000_00_00_000019_create_pos_sale_void_foundation.php' /tmp/s48-jrn005-source-paths
            echo 'ONEQAY_SPRINT50_JRN007_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
          elif [[ "$count" -eq 15 && "$fingerprint" == '325559599c79ba68340eac34569f8e5513aa4957b1ddf2515007b98b2cc1f15f' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s48-jrn005-source-paths)" -eq 1
            grep -Fxq 'apps/web/database/migrations/0000_00_00_000020_create_pos_inventory_baseline_foundation.php' /tmp/s48-jrn005-source-paths
            echo 'ONEQAY_SPRINT51_JRN008_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
          elif [[ "$count" -eq 14 && "$fingerprint" == 'ad4f6c62c820bdc59d7c1c8550ffeec0a4a0718ba4388a516418d50468d7e9d5' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s48-jrn005-source-paths)" -eq 1
            grep -Fxq 'apps/web/database/migrations/0000_00_00_000021_create_pos_sale_cash_refund_foundation.php' /tmp/s48-jrn005-source-paths
            echo 'ONEQAY_SPRINT51_JRN008_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT52_JRN007_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
          elif [[ "$count" -eq 14 && "$fingerprint" == 'a0914d7db5c1636e909e331e8b72653bc9814eb74e3a3823d7db36bd3b73b624' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s48-jrn005-source-paths)" -eq 1
            grep -Fxq 'apps/web/database/migrations/0000_00_00_000023_create_pos_shift_closing_cash_evidence_foundation.php' /tmp/s48-jrn005-source-paths
            echo 'ONEQAY_SPRINT51_JRN008_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT52_JRN007_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT53_JRN010_PREREQ_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT54_JRN010_PREREQ_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
          elif [[ "$count" -eq 14 && "$fingerprint" == '1d75fe26236e2bb56c113713e878e81d3df72cee9aa647b3f7759b9d1bec9164' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s48-jrn005-source-paths)" -eq 1
            grep -Fxq 'apps/web/database/migrations/0000_00_00_000022_create_pos_shift_opening_cash_evidence_foundation.php' /tmp/s48-jrn005-source-paths
            echo 'ONEQAY_SPRINT51_JRN008_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT52_JRN007_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT53_JRN010_PREREQ_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
          elif [[ "$count" -eq 12 && "$fingerprint" == '77a408974add7f466ed746b8b47c10d5fec45c8073ab32e0450abd95f206bf1f' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s48-jrn005-source-paths)" -eq 0
            echo 'ONEQAY_SPRINT50_COMPATIBILITY_PREDECESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT53_JRN010_PREREQ_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
          elif [[ "$count" -eq 30 && "$fingerprint" == '930cd1237722f4dd0af03e85d684ffa435adab6a1ae16db96d78243510fd85bc' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s48-jrn005-source-paths)" -eq 0
            echo 'ONEQAY_SPRINT50_COMPATIBILITY_PREDECESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT53_JRN010_PREREQ_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
          elif [[ "$count" -eq 30 && "$fingerprint" == 'cf8adb2328427a8e27e46f0efd9fe88db90f0401eba9cafd513944c7e040035e' ]] || [[ "$count" -eq 28 && "$fingerprint" == '3b97670674b60c636a23e52551b7ade69a3f545d5d0b4a861fa1c06eae5c0656' ]] || [[ "$count" -eq 29 && "$fingerprint" == 'e56a3e2732f5d5b0b40dd3ae50ec25746cf18bc8bd556d25405e85642c789878' ]]; then
            if [[ "$count" -eq 29 && "$fingerprint" == 'e56a3e2732f5d5b0b40dd3ae50ec25746cf18bc8bd556d25405e85642c789878' ]]; then
              echo 'ONEQAY_SPRINT52_COMPATIBILITY_PREDECESSOR=true' >> "$GITHUB_ENV"
            fi
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s48-jrn005-source-paths)" -eq 0
            echo 'ONEQAY_SPRINT50_COMPATIBILITY_PREDECESSOR=true' >> "$GITHUB_ENV"
          else
            echo 'Sprint48 changed-file envelope mismatch.' >&2
            exit 1
          fi
          ! grep -Eq '(^|/)(composer\.(json|lock)|package(-lock)?\.json|\.env(\.|$))' /tmp/s48-jrn005-source-paths

      - name: Preserve migrations one through seventeen and validate migration eighteen
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          migration='apps/web/database/migrations/0000_00_00_000018_create_pos_shift_opening_foundation.php'
          migration19='apps/web/database/migrations/0000_00_00_000019_create_pos_sale_void_foundation.php'
          migration20='apps/web/database/migrations/0000_00_00_000020_create_pos_inventory_baseline_foundation.php'
          if [[ "${ONEQAY_SPRINT52_COMPATIBILITY_PREDECESSOR:-false}" == 'true' && -f "$migration20" ]]; then
            git update-index --assume-unchanged "$migration20"
            rm -f "$migration20"
          fi
          migration21='apps/web/database/migrations/0000_00_00_000021_create_pos_sale_cash_refund_foundation.php'
          migration22='apps/web/database/migrations/0000_00_00_000022_create_pos_shift_opening_cash_evidence_foundation.php'
          migration23='apps/web/database/migrations/0000_00_00_000023_create_pos_shift_closing_cash_evidence_foundation.php'
          if [[ "${ONEQAY_SPRINT54_JRN010_PREREQ_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
            changed_count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)"
            if [[ "$changed_count" -eq 1 ]]; then printf '%s\n' "$changed" | grep -Fxq "$migration23"; else test "$changed_count" -eq 0; fi
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration23"
            for historical_migration in "$migration19" "$migration20" "$migration21" "$migration22" "$migration23"; do
              if [[ -f "$historical_migration" ]]; then git update-index --assume-unchanged "$historical_migration"; rm -f "$historical_migration"; fi
            done
          elif [[ "${ONEQAY_SPRINT53_JRN010_PREREQ_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
            changed_count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)"
            if [[ "$changed_count" -eq 1 ]]; then printf '%s\n' "$changed" | grep -Fxq "$migration22"; else test "$changed_count" -eq 0; fi
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration22"
            for historical_migration in "$migration19" "$migration20" "$migration21" "$migration22"; do
              if [[ -f "$historical_migration" ]]; then git update-index --assume-unchanged "$historical_migration"; rm -f "$historical_migration"; fi
            done
          elif [[ "${ONEQAY_SPRINT53_JRN010_PREREQ_SOURCE_SUCCESSOR:-false}" == 'true' || "${ONEQAY_SPRINT52_JRN007_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
            test "$changed" = "$migration21"
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration21"
            if [[ -f "$migration19" ]]; then git update-index --assume-unchanged "$migration19"; rm -f "$migration19"; fi
            if [[ -f "$migration20" ]]; then git update-index --assume-unchanged "$migration20"; rm -f "$migration20"; fi
            git update-index --assume-unchanged "$migration21"
            rm -f "$migration21"
          elif [[ "${ONEQAY_SPRINT51_JRN008_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
            test "$changed" = "$migration20"
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration20"
            if [[ -f "$migration19" ]]; then git update-index --assume-unchanged "$migration19"; rm -f "$migration19"; fi
            git update-index --assume-unchanged "$migration20"
            rm -f "$migration20"
          elif [[ "${ONEQAY_SPRINT50_JRN007_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
            test "$changed" = "$migration19"
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration19"
            git update-index --assume-unchanged "$migration19"
            rm -f "$migration19"
          elif [[ "${ONEQAY_SPRINT50_COMPATIBILITY_PREDECESSOR:-false}" == 'true' ]]; then
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations
            if [[ -f "$migration19" ]]; then
              git update-index --assume-unchanged "$migration19"
              rm -f "$migration19"
            fi
          else
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration"
          fi
          mapfile -t migrations < <(find apps/web/database/migrations -maxdepth 1 -type f -name '*.php' -printf '%f\n' | sort)
          test "${#migrations[@]}" -eq 18
          for index in $(seq 1 18); do
            prefix="$(printf '0000_00_00_%06d_' "$index")"
            test "$(printf '%s\n' "${migrations[@]}" | grep -c "^$prefix")" -eq 1
          done
          grep -Fq "Schema::create('oneqay_pos_shifts'" "$migration"
          grep -Fq "unique(['tenant_id', 'operation_id']" "$migration"
          grep -Fq "['tenant_id', 'outlet_id', 'device_id', 'active_slot']" "$migration"
          grep -Fq "throw new LogicException('Forward-only generated migration; rollback is not authorized.');" "$migration"

      - name: Validate source-default and delivery locks
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "env('ONEQAY_POS_SHIFT_OPENING_ENABLED', false)" apps/web/config/oneqay.php
          grep -Fq "config('oneqay.pos_shift_opening.enabled', false)" apps/web/routes/web.php
          grep -Fq "Route::post('/pos/shifts/open'" apps/web/routes/web.php
          grep -Fq "'session.active'" apps/web/routes/web.php
          grep -Fq 'RequirePosSessionContextMiddleware::class' apps/web/routes/web.php
          grep -Fq "public const OPEN_SHIFT = 'pos.shift.open';" apps/web/app/Application/Authorization/PosPermission.php

      - name: Preserve Application framework independence
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -F -e 'Illuminate\' -e 'Laravel\' -e 'Schema::' -e 'DB::' \
            apps/web/app/Application/Pos apps/web/app/Application/Authorization/PosPermission.php; then
            echo 'Sprint48 JRN-005 Application framework boundary violated.' >&2
            exit 1
          fi

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find apps/web/app apps/web/database/migrations apps/web/routes apps/web/tests -type f -name '*.php' -print0 |
            while IFS= read -r -d '' file; do php -l "$file"; done

      - name: Install locked dependencies
        working-directory: apps/web
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Reject High or Critical Composer advisories
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          composer audit --locked --format=json > /tmp/oneqay-composer-audit.json
          php -r '
            $data = json_decode(file_get_contents("/tmp/oneqay-composer-audit.json"), true, 512, JSON_THROW_ON_ERROR);
            foreach (($data["advisories"] ?? []) as $items) {
                foreach ($items as $item) {
                    if (in_array(strtolower((string) ($item["severity"] ?? "")), ["high", "critical"], true)) {
                        fwrite(STDERR, "Blocking Composer advisory.\n");
                        exit(1);
                    }
                }
            }
          '

      - name: Run Sprint48 JRN-005 durable shift regression
        working-directory: apps/web
        run: php tests/pos-shift-opening-durable.php

      - name: Run M7.4 synthetic POS regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          successor='app/Infrastructure/Pos/LaravelShiftOpeningRepository.php'
          inventory='app/Infrastructure/Pos/LaravelInventoryBaselineRepository.php'
          refund='app/Infrastructure/Pos/LaravelSaleCashRefundRepository.php'
          opening_cash='app/Infrastructure/Pos/LaravelShiftOpeningCashRepository.php'
          closing_cash='app/Infrastructure/Pos/LaravelShiftClosingCashRepository.php'
          backup='/tmp/oneqay-s48-laravel-shift-opening-repository.php'
          inventory_backup='/tmp/oneqay-s48-inventory-baseline-repository.php'
          refund_backup='/tmp/oneqay-s48-cash-refund-repository.php'
          opening_cash_backup='/tmp/oneqay-s48-opening-cash-repository.php'

          closing_cash_backup='/tmp/oneqay-s48-closing-cash-repository.php'
          cp "$successor" "$backup"
          if [[ "${ONEQAY_SPRINT51_JRN008_SOURCE_SUCCESSOR:-false}" == 'true' || "${ONEQAY_SPRINT52_COMPATIBILITY_PREDECESSOR:-false}" == 'true' || "${ONEQAY_SPRINT53_JRN010_PREREQ_SOURCE_SUCCESSOR:-false}" == 'true' || "${ONEQAY_SPRINT52_JRN007_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            cp "$inventory" "$inventory_backup"
          fi
          if [[ "${ONEQAY_SPRINT53_JRN010_PREREQ_SOURCE_SUCCESSOR:-false}" == 'true' || "${ONEQAY_SPRINT52_JRN007_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            cp "$refund" "$refund_backup"
            if [[ -f "$opening_cash" ]]; then cp "$opening_cash" "$opening_cash_backup"; fi

            if [[ -f "$closing_cash" ]]; then cp "$closing_cash" "$closing_cash_backup"; fi
          fi
          restore() {
            [[ ! -f "$backup" ]] || mv "$backup" "$successor"
            [[ ! -f "$inventory_backup" ]] || mv "$inventory_backup" "$inventory"
            [[ ! -f "$refund_backup" ]] || mv "$refund_backup" "$refund"
            [[ ! -f "$opening_cash_backup" ]] || mv "$opening_cash_backup" "$opening_cash"

            [[ ! -f "$closing_cash_backup" ]] || mv "$closing_cash_backup" "$closing_cash"
          }
          trap restore EXIT
          rm -f "$successor"
          if [[ "${ONEQAY_SPRINT51_JRN008_SOURCE_SUCCESSOR:-false}" == 'true' || "${ONEQAY_SPRINT52_COMPATIBILITY_PREDECESSOR:-false}" == 'true' || "${ONEQAY_SPRINT53_JRN010_PREREQ_SOURCE_SUCCESSOR:-false}" == 'true' || "${ONEQAY_SPRINT52_JRN007_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            rm -f "$inventory"
          fi
          if [[ "${ONEQAY_SPRINT53_JRN010_PREREQ_SOURCE_SUCCESSOR:-false}" == 'true' || "${ONEQAY_SPRINT52_JRN007_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            rm -f "$refund" "$opening_cash" "$closing_cash"
          fi
          php tests/pos-core-synthetic.php
          restore
          trap - EXIT
      - name: Preserve JRN-004 durable catalog regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          migration18='database/migrations/0000_00_00_000018_create_pos_shift_opening_foundation.php'
          cp "$migration18" /tmp/oneqay-s48-migration18.php
          rm -f "$migration18"
          php tests/pos-catalog-preparation-durable.php
          mv /tmp/oneqay-s48-migration18.php "$migration18"

      - name: Preserve JRN-006 durable sale regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          migration17='database/migrations/0000_00_00_000017_create_pos_catalog_preparation_journal.php'
          migration18='database/migrations/0000_00_00_000018_create_pos_shift_opening_foundation.php'
          cp "$migration17" /tmp/oneqay-s48-migration17.php
          cp "$migration18" /tmp/oneqay-s48-migration18.php
          rm -f "$migration17" "$migration18"
          php tests/pos-sale-completion-durable.php
          mv /tmp/oneqay-s48-migration17.php "$migration17"
          mv /tmp/oneqay-s48-migration18.php "$migration18"

      - name: Preserve tracked source cleanliness
        run: git diff --exit-code
