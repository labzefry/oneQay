name: Platform Foundation Controlled Bootstrap

"on":
  push:
    branches:
      - agent/platform-foundation-skeleton

permissions:
  contents: write

concurrency:
  group: platform-foundation-controlled-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: bootstrap-platform-foundation
    if: contains(github.event.head_commit.message, '[bootstrap-platform-foundation]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout authorized branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/platform-foundation-skeleton
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact bootstrap conditions
        shell: bash
        env:
          EXPECTED_BRANCH: refs/heads/agent/platform-foundation-skeleton
          EXPECTED_BASE: 68df196efdf38919d73a6b6345b973d2c3698b29
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "$EXPECTED_BRANCH"
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          test -f .github/bootstrap/patcher.part00
          test -f .github/bootstrap/archive.part00
          test -f .github/workflows/platform-foundation-bootstrap.yml

      - name: Materialize candidate tree
        shell: bash
        run: |
          set -euo pipefail
          cat .github/bootstrap/patcher.part* | base64 --decode | gzip --decompress > .github/bootstrap/platform_foundation_bootstrap.py
          python3 -m py_compile .github/bootstrap/platform_foundation_bootstrap.py
          python3 .github/bootstrap/platform_foundation_bootstrap.py
          git diff --check

      - name: Resolve and lock dependencies
        shell: bash
        run: |
          set -euo pipefail
          php --version
          composer --version
          node --version
          npm --version
          composer update --no-interaction --prefer-dist --no-progress
          npm install --no-audit --no-fund

      - name: Normalize source formatting
        shell: bash
        run: |
          set -euo pipefail
          ./vendor/bin/pint --parallel
          npx prettier --write resources/js resources/css
          npx eslint . --fix

      - name: Validate executable foundation
        shell: bash
        run: |
          set -euo pipefail
          composer validate --strict
          composer audit --no-interaction
          composer check
          npm audit --audit-level=high
          npm run check
          npm run build
          python3 scripts/quality/scan_repository.py
          git diff --check

      - name: Remove temporary write-capable bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/bootstrap
          rm -f .github/workflows/platform-foundation-bootstrap.yml
          test ! -e .github/bootstrap
          test ! -e .github/workflows/platform-foundation-bootstrap.yml

      - name: Commit validated candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Lab | zefry'
          git config user.email 'labzefry@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'feat(platform): establish technical preview foundation'
          git push origin HEAD:agent/platform-foundation-skeleton
