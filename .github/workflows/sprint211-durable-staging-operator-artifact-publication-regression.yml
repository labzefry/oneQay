# Author by Lab | zefry
name: Sprint211 Durable Staging Operator Artifact Publication Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint211-durable-staging-operator-artifact-publication-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify-sprint211-durable-staging-operator-artifact-publication:
    name: qualify-sprint211-durable-staging-operator-artifact-publication
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Lock exact Sprint211 engineering envelope
        if: github.event_name == 'pull_request' && github.head_ref == 'sprint211-durable-staging-operator-artifact-publication'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | LC_ALL=C sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          .github/workflows/durable-staging-release-publication.yml
          .github/workflows/m7-5-preview-release-artifact.yml
          .github/workflows/sprint211-durable-staging-operator-artifact-publication-regression.yml
          .github/workflows/sprint32-authentication-recovery-proof-regression.yml
          .github/workflows/sprint33-recovery-bound-password-reset-regression.yml
          .github/workflows/sprint34-authenticated-password-change-regression.yml
          DEPLOYMENT.md
          ops/final-shift-close/DURABLE_STAGING_OPERATOR_ARTIFACT_PUBLICATION_CONTRACT.json
          EOF
          diff -u /tmp/expected /tmp/actual
          test "$(sha256sum /tmp/actual | awk '{print $1}')" = 'ebdfb33a02475c8292ac9968297d5ad5d7dbc4e58056af4bad488f8af03c33ff'

      - name: Preserve canonical operational NO-GO
        shell: bash
        run: |
          set -euo pipefail
          state=ops/final-shift-close/STATE.json
          selection=ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json
          test "$(jq -r '.migration27.state' "$state")" = NOT_EXECUTED
          test "$(jq -r '.permission_provisioning.state' "$state")" = NONE
          test "$(jq -r '.feature_activation.state' "$state")" = INACTIVE
          test "$(jq -r '.deployment_authority' "$state")" = NOT_GRANTED
          test "$(jq -r '.technical_preview_activation' "$state")" = NOT_AUTHORIZED
          test "$(jq -r '.production_activation' "$state")" = NOT_AUTHORIZED
          test "$(jq -r '.updater_activation' "$state")" = INACTIVE
          test "$(jq -r '.selection_state' "$selection")" = SELECTED_NOT_AUTHORIZED
          test "$(jq -r '.selected_target.environment_id' "$selection")" = 'oneqay-durable-staging-01'
          test "$(jq -r '.selected_target.runtime_class' "$selection")" = 'durable-staging'
          test "$(jq -r '.selected_target.selection_fingerprint_sha256' "$selection")" = '858280ea3575317e8d88eed7009c770530097e261c391b2869fa81ad7c8546ce'

      - name: Validate publication contract
        shell: bash
        run: |
          set -euo pipefail
          contract=ops/final-shift-close/DURABLE_STAGING_OPERATOR_ARTIFACT_PUBLICATION_CONTRACT.json
          jq -e . "$contract" >/dev/null
          test "$(jq -r '.contract_state' "$contract")" = PUBLISHES_SECRET_FREE_OPERATOR_RETRIEVABLE_ARTIFACT_NOT_DEPLOYED
          test "$(jq -r '.publication_requirements.artifact_reproducibility_verified_before_upload' "$contract")" = true
          test "$(jq -r '.publication_requirements.deployment_handoff_validated' "$contract")" = true
          test "$(jq -r '.publication_requirements.retention_days' "$contract")" = 30
          test "$(jq -r '.qualification_requirements.sprint205_builder_reused' "$contract")" = true
          test "$(jq -r '.qualification_requirements.sprint206_handoff_tool_reused' "$contract")" = true
          test "$(jq -r '.qualification_requirements.published_bundle_is_not_deployment_authority' "$contract")" = true
          test "$(jq -r '.canonical_boundaries.environment_deployment' "$contract")" = NOT_PERFORMED
          test "$(jq -r '.canonical_boundaries.migration27_execution' "$contract")" = NOT_PERFORMED
          test "$(jq -r '.canonical_boundaries.selected_target' "$contract")" = null
          test "$(jq -r '.canonical_boundaries.producer_dispatch' "$contract")" = NOT_PERFORMED

      - name: Prove publication workflow is main-only and retrieval-only
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/durable-staging-release-publication.yml
          grep -Fq 'name: Durable Staging Operator Artifact Publication' "$workflow"
          grep -Fq 'branches: [main]' "$workflow"
          grep -Fq 'workflow_dispatch:' "$workflow"
          grep -Fq "if: github.ref == 'refs/heads/main'" "$workflow"
          grep -Fq 'tools/build-durable-staging-release.sh' "$workflow"
          grep -Fq 'tools/validate-durable-staging-release-manifest.php' "$workflow"
          grep -Fq 'tools/prepare-durable-staging-deployment-handoff.php' "$workflow"
          grep -Fq 'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02' "$workflow"
          grep -Fq 'retention-days: 30' "$workflow"
          grep -Fq 'compression-level: 0' "$workflow"
          grep -Fq 'VALIDATED_FOR_EXTERNAL_DEPLOYMENT_NOT_AUTHORIZED' "$workflow"
          grep -Fq 'deployment.authority_state' "$workflow"
          grep -Fq 'operational_boundary.selected_target' "$workflow"

      - name: Prove workflow cannot deploy or execute migration
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/durable-staging-release-publication.yml
          ! grep -E '(^|[[:space:]])(ssh|scp|rsync|kubectl)([[:space:]]|$)' "$workflow"
          ! grep -Fq 'php artisan migrate' "$workflow"
          ! grep -Fq 'Artisan::call' "$workflow"
          ! grep -Fq 'ONEQAY_DURABLE_RUNTIME_ATTESTATION_TOKEN=' "$workflow"
          ! grep -Fq 'workflow_run:' "$workflow"
          ! grep -Fq 'repository_dispatch:' "$workflow"

      - name: Prove exact historical compatibility is bounded
        shell: bash
        run: |
          set -euo pipefail
          branch='sprint211-durable-staging-operator-artifact-publication'
          hash='ebdfb33a02475c8292ac9968297d5ad5d7dbc4e58056af4bad488f8af03c33ff'
          for workflow in             .github/workflows/m7-5-preview-release-artifact.yml             .github/workflows/sprint32-authentication-recovery-proof-regression.yml             .github/workflows/sprint33-recovery-bound-password-reset-regression.yml             .github/workflows/sprint34-authenticated-password-change-regression.yml
          do
            grep -Fq "$branch" "$workflow"
            grep -Fq "$hash" "$workflow"
          done

      - name: Prove application source remains untouched or exact Sprint220 bounded updater
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- apps/web/database/migrations)"
          if [ "$HEAD_REF" = 'sprint220-governed-cpanel-bootstrap-development-updater' ]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- apps/web | LC_ALL=C sort > /tmp/s220-app-paths
            test -s /tmp/s220-app-paths
            while IFS= read -r changed; do
              case "$changed" in
                apps/web/app/Console/Commands/DiscoverGovernedDevelopmentUpdateCommand.php|apps/web/app/Console/Commands/ProcessGovernedDevelopmentUpdateCommand.php|apps/web/app/Delivery/Http/SystemUpdate/DevelopmentUpdateRequestController.php|apps/web/app/Delivery/Http/SystemUpdate/SystemUpdatePageController.php|apps/web/app/Infrastructure/SystemUpdate/Development/*|apps/web/app/Providers/SystemUpdateServiceProvider.php|apps/web/config/oneqay_development_updater.php|apps/web/resources/js/pages/System/UpdateDeployment.vue|apps/web/tests/read-only-update-deployment-ui.php|apps/web/tests/sprint220-governed-development-updater.php)
                  ;;
                *)
                  echo "Unexpected Sprint220 application path: $changed" >&2
                  exit 1
                  ;;
              esac
            done < /tmp/s220-app-paths
          else
            test -z "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- apps/web)"
          fi

      - name: Confirm tracked source cleanliness
        run: git diff --exit-code
