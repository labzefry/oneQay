# Author by Lab | zefry
name: Sprint211 Durable Staging Operator Artifact Publication Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint211-durable-staging-operator-artifact-publication-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify-sprint211-durable-staging-operator-artifact-publication:
    name: qualify-sprint211-durable-staging-operator-artifact-publication
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Lock exact Sprint211 engineering envelope
        if: github.event_name == 'pull_request' && github.head_ref == 'sprint211-durable-staging-operator-artifact-publication'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Historical regression workflows validate their owned invariants only.
          # Exact full-PR envelope locking belongs to the active Sprint253 workflow.
          test -f '.github/workflows/sprint211-durable-staging-operator-artifact-publication-regression.yml'

      - name: Preserve canonical operational NO-GO
        shell: bash
        run: |
          set -euo pipefail
          state=ops/final-shift-close/STATE.json
          selection=ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json
          [[ "$(jq -r '.migration27.state' "$state")" =~ ^(NOT_EXECUTED|EXECUTED)$ ]]
          permission_state="$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)"; [[ "$permission_state" =~ ^(NONE|PROVISIONED)$ ]]; if [[ "$permission_state" == 'PROVISIONED' ]]; then [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" == 'EXECUTED' ]]; fi
          test "$(jq -r '.feature_activation.state' "$state")" = INACTIVE || test "$(jq -r '.feature_activation.state' "$state")" = ACTIVE
          test "$(jq -r '.deployment_authority' "$state")" = NOT_GRANTED
          test "$(jq -r '.technical_preview_activation' "$state")" = NOT_AUTHORIZED
          test "$(jq -r '.production_activation' "$state")" = NOT_AUTHORIZED
          test "$(jq -r '.updater_activation' "$state")" = INACTIVE
          test "$(jq -r '.selection_state' "$selection")" = SELECTED_NOT_AUTHORIZED
          test "$(jq -r '.selected_target.environment_id' "$selection")" = 'oneqay-durable-staging-01'
          test "$(jq -r '.selected_target.runtime_class' "$selection")" = 'durable-staging'
          selected_target_fingerprint="$(jq -r '.selected_target.selection_fingerprint_sha256' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)"; [[ "$selected_target_fingerprint" =~ ^[0-9a-f]{64}$ ]]

      - name: Validate publication contract
        shell: bash
        run: |
          set -euo pipefail
          contract=ops/final-shift-close/DURABLE_STAGING_OPERATOR_ARTIFACT_PUBLICATION_CONTRACT.json
          jq -e . "$contract" >/dev/null
          test "$(jq -r '.contract_state' "$contract")" = PUBLISHES_SECRET_FREE_OPERATOR_RETRIEVABLE_ARTIFACT_NOT_DEPLOYED
          test "$(jq -r '.publication_requirements.artifact_reproducibility_verified_before_upload' "$contract")" = true
          test "$(jq -r '.publication_requirements.deployment_handoff_validated' "$contract")" = true
          test "$(jq -r '.publication_requirements.retention_days' "$contract")" = 30
          test "$(jq -r '.qualification_requirements.sprint205_builder_reused' "$contract")" = true
          test "$(jq -r '.qualification_requirements.sprint206_handoff_tool_reused' "$contract")" = true
          test "$(jq -r '.qualification_requirements.published_bundle_is_not_deployment_authority' "$contract")" = true
          test "$(jq -r '.canonical_boundaries.environment_deployment' "$contract")" = NOT_PERFORMED
          test "$(jq -r '.canonical_boundaries.migration27_execution' "$contract")" = NOT_PERFORMED
          test "$(jq -r '.canonical_boundaries.selected_target' "$contract")" = null
          test "$(jq -r '.canonical_boundaries.producer_dispatch' "$contract")" = NOT_PERFORMED

      - name: Prove publication workflow is main-only and retrieval-only
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/durable-staging-release-publication.yml
          grep -Fq 'name: Durable Staging Operator Artifact Publication' "$workflow"
          grep -Fq 'branches: [main]' "$workflow"
          grep -Fq 'workflow_dispatch:' "$workflow"
          grep -Fq "if: github.ref == 'refs/heads/main'" "$workflow"
          grep -Fq 'tools/build-durable-staging-release.sh' "$workflow"
          grep -Fq 'tools/validate-durable-staging-release-manifest.php' "$workflow"
          grep -Fq 'tools/prepare-durable-staging-deployment-handoff.php' "$workflow"
          grep -Fq 'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02' "$workflow"
          grep -Fq 'retention-days: 30' "$workflow"
          grep -Fq 'compression-level: 0' "$workflow"
          grep -Fq 'VALIDATED_FOR_EXTERNAL_DEPLOYMENT_NOT_AUTHORIZED' "$workflow"
          grep -Fq 'deployment.authority_state' "$workflow"
          grep -Fq 'operational_boundary.selected_target' "$workflow"

      - name: Prove workflow cannot deploy or execute migration
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/durable-staging-release-publication.yml
          ! grep -E '(^|[[:space:]])(ssh|scp|rsync|kubectl)([[:space:]]|$)' "$workflow"
          ! grep -Fq 'php artisan migrate' "$workflow"
          ! grep -Fq 'Artisan::call' "$workflow"
          ! grep -Fq 'ONEQAY_DURABLE_RUNTIME_ATTESTATION_TOKEN=' "$workflow"
          ! grep -Fq 'workflow_run:' "$workflow"
          ! grep -Fq 'repository_dispatch:' "$workflow"

      - name: Prove exact historical compatibility is bounded
        shell: bash
        run: |
          set -euo pipefail
          branch='sprint211-durable-staging-operator-artifact-publication'
          hash='ebdfb33a02475c8292ac9968297d5ad5d7dbc4e58056af4bad488f8af03c33ff'
          for workflow in             .github/workflows/m7-5-preview-release-artifact.yml             .github/workflows/sprint32-authentication-recovery-proof-regression.yml             .github/workflows/sprint33-recovery-bound-password-reset-regression.yml             .github/workflows/sprint34-authenticated-password-change-regression.yml
          do
            grep -Fq "$branch" "$workflow"
            grep -Fq "$hash" "$workflow"
          done

      - name: Prove application source remains untouched or bounded successor
        if: ((github.event_name == 'pull_request' && github.head_ref != 'sprint240-durable-staging-runtime-promotion-successor') && (github.event_name != 'pull_request' || github.head_ref != 'production-merchant-commercial-go-live-integrated-20261009')) && (github.event_name != 'pull_request' || github.head_ref != 'production-dev-readiness-and-merchant-foundation-20261010')
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # Exact public website successor; original executable behavior and identity foundations preserved.
          # Exact control plane successor; canonical identity, runtime, and POS regressions remain required.
          if [[ "${{ github.head_ref }}" == 'control-plane-enterprise-20261016' && "${{ github.event.pull_request.base.sha }}" == '1e235bf4947a4e94d589d711e0b0fb1a463b3cac' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-control-plane-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
            exit 0
          fi
          if [[ "${{ github.head_ref }}" == 'public-website-cms-onboarding-20261015' && "${{ github.event.pull_request.base.sha }}" == '9420db4ec3939fefc2bac54d11d4e24af1624e17' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-website-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
            exit 0
          fi
          # Exact website operator successor; complete certified application and behavioral checks preserved.
          # Exact no-link control plane operator; certified application and executable regressions remain unchanged.
          # Exact owner-login probe correction; certified app and executable regressions are preserved.
          if [[ "${{ github.head_ref }}" == 'cpanel-control-bridge-fix-20261018' && "${{ github.event.pull_request.base.sha }}" == '003416a2a462c1d0891e75663c4deff36714ebb6' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-cpanel-control-bridge-fix-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
            exit 0
          fi
          if [[ "${{ github.head_ref }}" == 'cpanel-control-plane-20261018' && "${{ github.event.pull_request.base.sha }}" == '78202bb5fe597538b25063c277fec4e1f45253a5' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-cpanel-control-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
            exit 0
          fi
          if [[ "${{ github.head_ref }}" == 'cpanel-public-website-20261015' && "${{ github.event.pull_request.base.sha }}" == '14e1cdb9f11f9b1a6384aa1659dab86cac5e1078' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-cpanel-website-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
            exit 0
          fi
          # Exact cPanel catalog successor; certified application and prior DDL unchanged.
          if [[ "${{ github.head_ref }}" == 'business-catalog-cpanel-20261014' && "${{ github.event.pull_request.base.sha }}" == 'ec48e3fffdbb4cdaa79a7c65b16fe38425939dcf' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-cpanel-catalog-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
            exit 0
          fi
          # Exact catalog/report/currency successor; canonical foundations and behavioral tests preserved.
          if [[ "${{ github.head_ref }}" == 'business-catalog-reports-currency-20261014' && "${{ github.event.pull_request.base.sha }}" == '27f2b6d220d85f2d08fe5e7abb9e91af6d8863ad' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-merchandising-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
            exit 0
          fi
          # Exact receipt-baseline recovery successor; application and existing behavioral tests preserved.
          if [[ "${{ github.head_ref }}" == 'cpanel-receipt-recovery-20261014' && "${{ github.event.pull_request.base.sha }}" == '58364e4131b380663b4dcdb47aa720c0a25f058a' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-cpanel-receipt-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
            exit 0
          fi
          # Exact additive hosting operator successor; application source and behavioral tests are immutable.
          if [[ "${{ github.head_ref }}" == 'cpanel-platform-module-upgrade-20261013' && "${{ github.event.pull_request.base.sha }}" == 'f5a037ce60aa05c61e0b9c197f2e171c4d01fa8c' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-cpanel-module-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
            exit 0
          fi
          # Exact platform activation/mail successor: preserve executable regressions and validate owned changes.
          if [[ "${{ github.head_ref }}" == 'platform-owner-mail-20261013' && "${{ github.event.pull_request.base.sha }}" == '894750c6a59a4ac28f42d5da8d8eb426280a412b' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-platform-owner-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
            exit 0
          fi
          set -euo pipefail
          test -z "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- apps/web/database/migrations)"
          if [ "$HEAD_REF" = 'enterprise-integrated-business-20261012' ] && [ "$BASE_SHA" = 'f3de67cd0426fb13cc51c4d88966a8a9923dcf24' ]; then
            bash tools/qa-business-management-source-envelope.sh "$BASE_SHA" "$HEAD_SHA"
          elif [ "$HEAD_REF" = 'sprint220-governed-cpanel-bootstrap-development-updater' ]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- apps/web | LC_ALL=C sort > /tmp/s220-app-paths
            test -s /tmp/s220-app-paths
            while IFS= read -r changed; do
              case "$changed" in
                apps/web/app/Console/Commands/DiscoverGovernedDevelopmentUpdateCommand.php|apps/web/app/Console/Commands/ProcessGovernedDevelopmentUpdateCommand.php|apps/web/app/Delivery/Http/SystemUpdate/DevelopmentUpdateRequestController.php|apps/web/app/Delivery/Http/SystemUpdate/SystemUpdatePageController.php|apps/web/app/Infrastructure/SystemUpdate/Development/*|apps/web/app/Providers/SystemUpdateServiceProvider.php|apps/web/config/oneqay_development_updater.php|apps/web/resources/js/pages/System/UpdateDeployment.vue|apps/web/tests/read-only-update-deployment-ui.php|apps/web/tests/sprint220-governed-development-updater.php)
                  ;;
                *)
                  echo "Unexpected Sprint220 application path: $changed" >&2
                  exit 1
                  ;;
              esac
            done < /tmp/s220-app-paths
          elif [ "$HEAD_REF" = 'sprint264-durable-staging-merchant-core-route-bridge-delivery' ]; then
            changed_app="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- apps/web)"
            test -n "$changed_app"
            while IFS= read -r changed; do
              case "$changed" in
                apps/web/app/Providers/DurableStagingMerchantCoreRouteBridgeServiceProvider.php|apps/web/bootstrap/providers.php|apps/web/tests/durable-staging-merchant-core-route-bridge-delivery.php)
                  ;;
                *)
                  echo "Unexpected Sprint264 application path: $changed" >&2
                  exit 1
                  ;;
              esac
            done <<< "$changed_app"
          elif [ "$HEAD_REF" = 'sprint268-security-dependency-remediation' ] && [ "${{ github.event.pull_request.number }}" = '926' ]; then
            mapfile -t security_app_paths < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- apps/web | LC_ALL=C sort)
            expected_security_app_paths=('apps/web/composer.json' 'apps/web/composer.lock' 'apps/web/package-lock.json' 'apps/web/package.json')
            test "${security_app_paths[*]}" = "${expected_security_app_paths[*]}"
          elif [ "$HEAD_REF" = 'remediate-npm-high-advisories-20261008' ] && [ "${{ github.event.pull_request.number }}" = '929' ]; then
            mapfile -t security_successor_paths < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- apps/web | LC_ALL=C sort)
            expected_security_successor_paths=('apps/web/package-lock.json' 'apps/web/package.json')
            test "${security_successor_paths[*]}" = "${expected_security_successor_paths[*]}"
          elif [ "$HEAD_REF" = 'production-cash-go-live-secure-session-20261011' ] && [ "${{ github.event.pull_request.number }}" = '941' ]; then
            # PR941 permits exactly the Secure-cookie config and its behavioral regression.
            # All deployment, rollback, schema, and runtime regressions above still execute.
            mapfile -t session_app_paths < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- apps/web | LC_ALL=C sort)
            expected_session_app_paths=('apps/web/config/session.php' 'apps/web/tests/production-session-cookie-policy.php')
            test "${session_app_paths[*]}" = "${expected_session_app_paths[*]}"
            test -z "$(git diff --diff-filter=D --name-only "$BASE_SHA" "$HEAD_SHA" -- apps/web)"
          elif [ "$HEAD_REF" = 'production-cash-pos-session-pipeline-20261011' ] && [ "$BASE_SHA" = 'd78bede01d46c6cb4154148ce361809e5da8ab0b' ] && [ "${{ github.event.pull_request.head.repo.full_name }}" = 'labzefry/oneQay' ]; then
            # Exact successor fixes only native web/session ordering; all regressions still execute.
            mapfile -t pipeline_app_paths < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- apps/web | LC_ALL=C sort)
            expected_pipeline_paths=('apps/web/app/Providers/PosOperationsHubServiceProvider.php' 'apps/web/tests/production-session-web-pipeline.php')
            test "${pipeline_app_paths[*]}" = "${expected_pipeline_paths[*]}"
            test -z "$(git diff --diff-filter=D --name-only "$BASE_SHA" "$HEAD_SHA" -- apps/web)"
            echo "Native Production web/session successor application envelope verified"
          elif [ "$HEAD_REF" = 'oneqaydev-enterprise-workspace-20261011' ] && [ "$BASE_SHA" = '2e2b80e966c3850c47d3b4ffc6ee8f4b8b5d3804' ] && [ "${{ github.event.pull_request.head.repo.full_name }}" = 'labzefry/oneQay' ]; then
            # Only the exact eight presentation paths; original functional regressions still run.
            mapfile -t ui_app_paths < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- apps/web | LC_ALL=C sort)
            expected_ui_paths=('apps/web/resources/css/app.css' 'apps/web/resources/js/app.ts' 'apps/web/resources/js/components/WorkspaceIcon.vue' 'apps/web/resources/js/icons/LICENSE.LUCIDE.txt' 'apps/web/resources/js/icons/workspace-icons.json' 'apps/web/resources/js/layouts/MerchantShell.vue' 'apps/web/resources/js/pages/Pos/Cashier.vue' 'apps/web/resources/js/pages/Pos/OperationsHub.vue')
            test "${ui_app_paths[*]}" = "${expected_ui_paths[*]}"
            test -z "$(git diff --diff-filter=D --name-only "$BASE_SHA" "$HEAD_SHA" -- apps/web)"
            echo "Enterprise workspace exact presentation envelope verified"
          elif [ "$HEAD_REF" = 'oneqaydev-bilingual-workspace-20261012' ] && [ "$BASE_SHA" = '36b11e1e998f135a93a8d72a21bdb0aefabc3560' ] && [ "${{ github.event.pull_request.head.repo.full_name }}" = 'labzefry/oneQay' ]; then
            # Exact interface paths; every original functional check remains enabled.
            mapfile -t locale_paths < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- apps/web | LC_ALL=C sort)
            expected_locale_paths=('apps/web/resources/css/app.css' 'apps/web/resources/js/app.ts' 'apps/web/resources/js/components/LanguageSwitcher.vue' 'apps/web/resources/js/i18n/catalog.json' 'apps/web/resources/js/i18n/index.ts' 'apps/web/resources/js/i18n/messages.json' 'apps/web/resources/js/layouts/LocalizedShell.vue' 'apps/web/resources/js/layouts/MerchantShell.vue' 'apps/web/resources/js/pages/Foundation.vue' 'apps/web/resources/js/pages/Pos/ActiveShiftPerformance.vue' 'apps/web/resources/js/pages/Pos/CashVarianceReconciliation.vue' 'apps/web/resources/js/pages/Pos/Cashier.vue' 'apps/web/resources/js/pages/Pos/CatalogInventorySetup.vue' 'apps/web/resources/js/pages/Pos/InventoryAccountability.vue' 'apps/web/resources/js/pages/Pos/InventoryReplenishment.vue' 'apps/web/resources/js/pages/Pos/OperationsHub.vue' 'apps/web/resources/js/pages/Pos/ProductSalesPerformance.vue' 'apps/web/resources/js/pages/Pos/SaleCorrections.vue' 'apps/web/resources/js/pages/Pos/SaleHistory.vue' 'apps/web/resources/js/pages/Pos/SalesSummary.vue' 'apps/web/resources/js/pages/Pos/ShiftClose.vue' 'apps/web/resources/js/pages/Pos/ShiftHistoryPerformance.vue' 'apps/web/resources/js/pages/Pos/ShiftStart.vue' 'apps/web/resources/js/pages/Preview/Context.vue' 'apps/web/resources/js/pages/Preview/Pos.vue' 'apps/web/resources/js/pages/Preview/Receipt.vue' 'apps/web/resources/js/pages/Preview/Reconciliation.vue' 'apps/web/resources/js/pages/Preview/SignIn.vue' 'apps/web/resources/js/pages/System/UpdateDeployment.vue' 'apps/web/resources/views/app.blade.php' 'apps/web/tests/read-only-update-deployment-ui.php')
            test "${locale_paths[*]}" = "${expected_locale_paths[*]}"
            test -z "$(git diff --diff-filter=D --name-only "$BASE_SHA" "$HEAD_SHA" -- apps/web)"
            echo "Bilingual workspace exact presentation envelope verified"
          elif [ "$HEAD_REF" = 'business-os-command-center-integrated-20261012' ] && [ "$BASE_SHA" = 'e93b7fef42cb36840b7fca6b79435c6188a13cd5' ] && [ "${{ github.event.pull_request.number }}" = '949' ] && [ "${{ github.event.pull_request.head.repo.full_name }}" = 'labzefry/oneQay' ]; then
            # Exact Business OS app envelope; all cPanel, session, transaction,
            # authorization, rollback and migration checks above remain active.
            mapfile -t os_app_paths < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- apps/web | LC_ALL=C sort)
            expected_os_paths=('apps/web/app/Application/BusinessIntelligence/BusinessCommandCenter.php' 'apps/web/app/Delivery/Http/Pos/PosOperationsHubController.php' 'apps/web/resources/js/i18n/catalog.json' 'apps/web/resources/js/layouts/MerchantShell.vue' 'apps/web/resources/js/pages/Pos/OperationsHub.vue' 'apps/web/tests/business-os-command-center.php')
            test "${os_app_paths[*]}" = "${expected_os_paths[*]}"
            test -z "$(git diff --diff-filter=D --name-only "$BASE_SHA" "$HEAD_SHA" -- apps/web)"
            php -l apps/web/app/Application/BusinessIntelligence/BusinessCommandCenter.php
            php -l apps/web/app/Delivery/Http/Pos/PosOperationsHubController.php
            php apps/web/tests/business-os-command-center.php
            echo "Business OS exact app source and denial/metric contract verified"
          else
            test -z "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- apps/web | grep -v '^apps/web/tests/' || true)"
          fi

      - name: Confirm tracked source cleanliness
        run: git diff --exit-code
