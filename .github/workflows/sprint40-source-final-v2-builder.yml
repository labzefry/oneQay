name: Sprint40 Source Final V2 Builder

# Temporary branch-local construction workflow. Final PR excludes this file.
# Attribution: Lab | zefry

on:
  push:
    branches:
      - feat/sprint40-identity-disablement-revalidation-v2-builder

permissions:
  contents: write

concurrency:
  group: sprint40-source-final-v2-builder
  cancel-in-progress: false

jobs:
  materialize:
    if: github.ref == 'refs/heads/feat/sprint40-identity-disablement-revalidation-v2-builder'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact builder branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/sprint40-identity-disablement-revalidation-v2-builder
          fetch-depth: 0

      - name: Materialize exact eight-path Sprint40 source successor
        shell: bash
        run: |
          set -euo pipefail
          source_ref='origin/feat/sprint40-identity-disablement-revalidation'
          files=(
            '.github/workflows/sprint40-first-party-session-identity-disablement-revalidation-regression.yml'
            'apps/web/app/Application/Identity/FirstPartyIdentityEligibilityVerifier.php'
            'apps/web/app/Delivery/Http/Middleware/EnforceActiveFirstPartySessionAuthorityMiddleware.php'
            'apps/web/app/Infrastructure/Identity/LaravelFirstPartyIdentityEligibilityVerifier.php'
            'apps/web/app/Providers/AppServiceProvider.php'
            'apps/web/database/migrations/0000_00_00_000014_add_first_party_authentication_eligibility_to_identities.php'
            'apps/web/tests/first-party-session-identity-disablement-revalidation.php'
            'docs/FIRST_PARTY_SESSION_IDENTITY_DISABLEMENT_REVALIDATION_FOUNDATION.md'
          )

          for file in "${files[@]}"; do
            mkdir -p "$(dirname "$file")"
            git show "$source_ref:$file" > "$file"
          done

          rm '.github/workflows/sprint40-source-final-v2-builder.yml'
          git add -A
          git diff --cached --name-only | sort >/tmp/s40-source-v2-staged.txt
          test "$(wc -l </tmp/s40-source-v2-staged.txt)" -eq 9
          grep -Fxq '.github/workflows/sprint40-source-final-v2-builder.yml' /tmp/s40-source-v2-staged.txt
          grep -vFx '.github/workflows/sprint40-source-final-v2-builder.yml' /tmp/s40-source-v2-staged.txt >/tmp/s40-source-v2-final.txt
          test "$(wc -l </tmp/s40-source-v2-final.txt)" -eq 8
          test "$(sha256sum /tmp/s40-source-v2-final.txt | awk '{print $1}')" = 'a9caf2b68210a38687fee543256aec04dc1e67ee1ef403608f7db69139957ff8'
          grep -Fxq '.github/workflows/sprint40-first-party-session-identity-disablement-revalidation-regression.yml' /tmp/s40-source-v2-final.txt
          grep -Fxq 'apps/web/database/migrations/0000_00_00_000014_add_first_party_authentication_eligibility_to_identities.php' /tmp/s40-source-v2-final.txt
          grep -Fq 'first_party_authentication_enabled' 'apps/web/database/migrations/0000_00_00_000014_add_first_party_authentication_eligibility_to_identities.php'
          grep -Fq 'FirstPartyIdentityEligibilityVerifier' 'apps/web/app/Delivery/Http/Middleware/EnforceActiveFirstPartySessionAuthorityMiddleware.php'

          git config user.name 'labzefry'
          git config user.email 'lab.zefa@gmail.com'
          git commit -m 'feat: implement Sprint40 identity disablement revalidation'
          echo "FINAL_SOURCE_COMMIT=$(git rev-parse HEAD)"
          echo "FINAL_SOURCE_TREE=$(git rev-parse HEAD^{tree})"
          git push origin HEAD:feat/sprint40-identity-disablement-revalidation-v2-builder
