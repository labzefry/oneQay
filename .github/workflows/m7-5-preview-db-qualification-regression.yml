name: M7.5 Preview Database Qualification Regression

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/web/app/Application/Preview/TechnicalPreviewJourney.php'
      - 'apps/web/app/Delivery/Preview/TechnicalPreviewDatabaseQualificationController.php'
      - 'apps/web/app/Infrastructure/Persistence/PreviewDatabaseQualification.php'
      - 'apps/web/config/oneqay.php'
      - 'apps/web/environment.example'
      - 'apps/web/routes/web.php'
      - 'apps/web/tests/preview-database-qualification.php'
      - '.github/workflows/m7-5-preview-db-qualification-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m7-5-preview-db-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  m7-5-preview-db-qualification-regression:
    name: m7-5-preview-db-qualification-regression
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve dependency manifests and lockfiles
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Eq '(^|/)(composer\.(json|lock)|package(-lock)?\.json)$'; then
            echo 'M7.5 Preview DB qualification does not authorize dependency manifest or lockfile changes.' >&2
            exit 1
          fi

      - name: Validate locked Composer dependencies
        working-directory: apps/web
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l apps/web/app/Application/Preview/TechnicalPreviewJourney.php
          php -l apps/web/app/Delivery/Preview/TechnicalPreviewDatabaseQualificationController.php
          php -l apps/web/app/Infrastructure/Persistence/PreviewDatabaseQualification.php
          php -l apps/web/config/oneqay.php
          php -l apps/web/routes/web.php
          php -l apps/web/tests/preview-database-qualification.php

      - name: Reject permanent schema or credential material
        shell: bash
        run: |
          set -euo pipefail
          test ! -d apps/web/database/migrations
          if grep -R -n -E 'CREATE[[:space:]]+TABLE|ALTER[[:space:]]+TABLE|DROP[[:space:]]+TABLE' \
            apps/web/app/Infrastructure/Persistence/PreviewDatabaseQualification.php; then
            echo 'Preview DB qualification must not create or mutate permanent schema.' >&2
            exit 1
          fi
          if grep -R -n -E 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}' \
            apps/web/app/Application/Preview/TechnicalPreviewJourney.php \
            apps/web/app/Delivery/Preview/TechnicalPreviewDatabaseQualificationController.php \
            apps/web/app/Infrastructure/Persistence/PreviewDatabaseQualification.php \
            apps/web/config/oneqay.php \
            apps/web/environment.example; then
            echo 'Preview DB qualification source contains forbidden credential material.' >&2
            exit 1
          fi

      - name: Enforce verified-context tenant isolation source boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'withinVerifiedContext' apps/web/app/Application/Preview/TechnicalPreviewJourney.php
          grep -Fq 'VerifiedTenantContext $tenantContext' apps/web/app/Infrastructure/Persistence/PreviewDatabaseQualification.php
          grep -Fq '$journey->withinVerifiedContext' apps/web/app/Delivery/Preview/TechnicalPreviewDatabaseQualificationController.php

      - name: Run Preview database qualification regression
        working-directory: apps/web
        run: php tests/preview-database-qualification.php

      - name: Preserve established application regressions
        working-directory: apps/web
        run: |
          php tests/run.php
          php tests/tenant-isolation.php
          php tests/identity-org-context.php
          php tests/pos-core-synthetic.php
          php tests/technical-preview-interaction.php
