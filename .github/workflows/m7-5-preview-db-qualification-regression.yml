name: M7.5 Preview Database Qualification Regression

# Attribution: Lab | zefry
# Historical Sprint 33 fingerprint: 04a1177c12712183a7dda4ae81be1356c0e41294533336c9f999d376c224712a
# Sprint 34 fingerprint: e3b724002cfc0be1ef890d1b5594a2a5179123f949f6f486354e21950c7328eb

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/m7-5-preview-db-qualification-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m7-5-preview-db-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  m7-5-preview-db-qualification-regression:
    name: m7-5-preview-db-qualification-regression
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      ONEQAY_PERSISTENCE_ENABLED: 'false'
      SESSION_DRIVER: array
      CACHE_STORE: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce exact Sprint 34 bounded successor without mutating worktree
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          base="origin/${{ github.base_ref }}"
          test "$(git rev-parse "$base")" = '8b4fc5425ba8d98f35f02c39bd1880ce50c4759b'
          test "$(git rev-list --count "$base..HEAD")" -eq 1
          test "$(git rev-parse HEAD^)" = '8b4fc5425ba8d98f35f02c39bd1880ce50c4759b'
          git diff --name-only "$base...HEAD" | sort > /tmp/s34-files.txt
          test "$(wc -l < /tmp/s34-files.txt)" -eq 35
          test "$(sha256sum /tmp/s34-files.txt | awk '{print $1}')" = 'e3b724002cfc0be1ef890d1b5594a2a5179123f949f6f486354e21950c7328eb'
          test -f apps/web/database/migrations/0000_00_00_000010_create_identity_recovery_codes.php
          test -f apps/web/database/migrations/0000_00_00_000011_add_credential_epoch_to_identity_password_credentials.php
          git diff --exit-code

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Preserve root Platform Foundation regression
        run: |
          composer validate --strict --no-check-publish
          composer test

      - name: Install locked Composer dependencies
        working-directory: apps/web
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist

      - name: Validate Preview database boundary
        shell: bash
        run: |
          set -euo pipefail
          find apps/web/app apps/web/routes apps/web/tests -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do php -l "$file"; done
          grep -Fq 'ONEQAY_PERSISTENCE_ENABLED=false' apps/web/environment.example
          if grep -R -n -E 'CREATE[[:space:]]+TABLE|ALTER[[:space:]]+TABLE|DROP[[:space:]]+TABLE|Schema::create|Schema::table' apps/web/app/Infrastructure/Persistence/PreviewDatabaseQualification.php; then exit 1; fi
          if grep -R -n -E 'AuthenticatedPasswordChange|password/change' apps/web/app/Application/Preview apps/web/app/Delivery/Preview 2>/dev/null; then exit 1; fi

      - name: Run Preview database qualification
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php tests/preview-database-qualification.php 2>&1 | tee /tmp/m75-db.log
          grep -Fq 'Preview database qualification regression passed' /tmp/m75-db.log

      - name: Preserve established application regressions on full Sprint 34 schema
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php tests/run.php
          php tests/tenant-isolation.php
          php tests/identity-org-context.php
          php tests/pos-core-synthetic.php
          php tests/technical-preview-interaction.php

      - name: Preserve NO_SCHEMA_CHANGE and tracked source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'NO_SCHEMA_CHANGE' .github/workflows/m7-5-preview-release-artifact.yml
          git diff --exit-code
