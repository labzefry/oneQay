name: M7.5 Preview Database Qualification Regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/app/Application/Preview/TechnicalPreviewJourney.php'
      - 'apps/web/app/Delivery/Preview/TechnicalPreviewDatabaseQualificationController.php'
      - 'apps/web/app/Infrastructure/Persistence/PreviewDatabaseQualification.php'
      - 'apps/web/app/Infrastructure/Persistence/LaravelDurableContextGraphRepository.php'
      - 'apps/web/app/Infrastructure/Persistence/LaravelPersistenceTransaction.php'
      - 'apps/web/app/Application/Access/**'
      - 'apps/web/app/Infrastructure/Access/**'
      - 'apps/web/app/Application/Authorization/**'
      - 'apps/web/app/Infrastructure/Authorization/**'
      - 'apps/web/app/Infrastructure/Tenancy/LaravelTenantMembershipVerifier.php'
      - 'apps/web/app/Infrastructure/Organization/LaravelOrganizationalRelationshipVerifier.php'
      - 'apps/web/config/oneqay.php'
      - 'apps/web/config/database.php'
      - 'apps/web/environment.example'
      - 'apps/web/database/migrations/**'
      - 'apps/web/routes/web.php'
      - 'apps/web/tests/persistence.php'
      - 'apps/web/tests/access-persistence.php'
      - 'apps/web/tests/authorization-persistence.php'
      - 'apps/web/tests/preview-database-qualification.php'
      - 'apps/web/tests/run.php'
      - 'apps/web/tests/tenant-isolation.php'
      - 'apps/web/tests/identity-org-context.php'
      - '.github/workflows/m7-5-preview-db-qualification-regression.yml'
      - '.github/workflows/sprint21-role-permission-policy-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m7-5-preview-db-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  m7-5-preview-db-qualification-regression:
    name: m7-5-preview-db-qualification-regression
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve dependency manifests and lockfiles
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Eq '(^|/)(composer\.(json|lock)|package(-lock)?\.json)$'; then
            echo 'M7.5 Preview DB qualification does not authorize dependency manifest or lockfile changes.' >&2
            exit 1
          fi

      - name: Validate locked Composer dependencies
        working-directory: apps/web
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l apps/web/app/Application/Preview/TechnicalPreviewJourney.php
          php -l apps/web/app/Delivery/Preview/TechnicalPreviewDatabaseQualificationController.php
          php -l apps/web/app/Infrastructure/Persistence/PreviewDatabaseQualification.php
          php -l apps/web/app/Infrastructure/Persistence/LaravelDurableContextGraphRepository.php
          php -l apps/web/app/Infrastructure/Persistence/LaravelPersistenceTransaction.php
          php -l apps/web/app/Application/Authorization/RoleIdentifier.php
          php -l apps/web/app/Application/Authorization/PermissionIdentifier.php
          php -l apps/web/app/Application/Authorization/DurableRolePermissionRepository.php
          php -l apps/web/app/Application/Authorization/DurableScopedAuthorizationPolicy.php
          php -l apps/web/app/Application/Authorization/DurableAuthorizationViolation.php
          php -l apps/web/app/Infrastructure/Authorization/LaravelDurableRolePermissionRepository.php
          php -l apps/web/app/Infrastructure/Access/LaravelDurableOrganizationalAccessRepository.php
          php -l apps/web/app/Infrastructure/Tenancy/LaravelTenantMembershipVerifier.php
          php -l apps/web/app/Infrastructure/Organization/LaravelOrganizationalRelationshipVerifier.php
          php -l apps/web/config/oneqay.php
          php -l apps/web/config/database.php
          php -l apps/web/database/migrations/0000_00_00_000001_create_foundational_context_graph.php
          php -l apps/web/database/migrations/0000_00_00_000002_create_organizational_access_grants.php
          php -l apps/web/database/migrations/0000_00_00_000003_create_scoped_role_permission_policy.php
          php -l apps/web/routes/web.php
          php -l apps/web/tests/persistence.php
          php -l apps/web/tests/access-persistence.php
          php -l apps/web/tests/authorization-persistence.php
          php -l apps/web/tests/preview-database-qualification.php

      - name: Preserve non-mutating Preview qualification and durable-policy denial
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/database/migrations/0000_00_00_000001_create_foundational_context_graph.php
          test -f apps/web/database/migrations/0000_00_00_000002_create_organizational_access_grants.php
          test -f apps/web/database/migrations/0000_00_00_000003_create_scoped_role_permission_policy.php
          grep -Fq 'ONEQAY_PERSISTENCE_ENABLED=false' apps/web/environment.example
          grep -Fq "in_array(\$runtime, ['local', 'test', 'ci'], true)" apps/web/app/Infrastructure/Persistence/LaravelDurableContextGraphRepository.php
          grep -Fq "in_array(\$runtime, ['local', 'test', 'ci'], true)" apps/web/app/Infrastructure/Persistence/LaravelPersistenceTransaction.php
          grep -Fq "in_array(\$runtime, ['local', 'test', 'ci'], true)" apps/web/app/Infrastructure/Access/LaravelDurableOrganizationalAccessRepository.php
          grep -Fq "in_array(\$runtime, ['local', 'test', 'ci'], true)" apps/web/app/Infrastructure/Authorization/LaravelDurableRolePermissionRepository.php
          if grep -R -n -E 'CREATE[[:space:]]+TABLE|ALTER[[:space:]]+TABLE|DROP[[:space:]]+TABLE|Schema::create|Schema::table' apps/web/app/Infrastructure/Persistence/PreviewDatabaseQualification.php; then
            echo 'Preview DB qualification must not create or mutate permanent schema.' >&2
            exit 1
          fi
          if grep -R -n -E 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}' \
            apps/web/app/Application/Preview \
            apps/web/app/Delivery/Preview \
            apps/web/app/Infrastructure/Persistence/PreviewDatabaseQualification.php \
            apps/web/app/Infrastructure/Authorization \
            apps/web/config apps/web/environment.example; then
            echo 'Preview DB qualification or durable policy source contains forbidden credential material.' >&2
            exit 1
          fi

      - name: Enforce verified-context and Preview isolation boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'withinVerifiedContext' apps/web/app/Application/Preview/TechnicalPreviewJourney.php
          grep -Fq 'VerifiedTenantContext $tenantContext' apps/web/app/Infrastructure/Persistence/PreviewDatabaseQualification.php
          grep -Fq '$journey->withinVerifiedContext' apps/web/app/Delivery/Preview/TechnicalPreviewDatabaseQualificationController.php
          for forbidden in LaravelTenantMembershipVerifier LaravelOrganizationalRelationshipVerifier LaravelDurableRolePermissionRepository DurableScopedAuthorizationPolicy; do
            if grep -R -n -F "$forbidden" apps/web/app/Application/Preview apps/web/app/Delivery/Preview; then
              echo "Technical Preview must not switch to durable policy surface: $forbidden" >&2
              exit 1
            fi
          done

      - name: Run Preview database qualification regression
        working-directory: apps/web
        run: php tests/preview-database-qualification.php

      - name: Preserve established application regressions without Preview migration execution
        working-directory: apps/web
        run: |
          php tests/run.php
          php tests/tenant-isolation.php
          php tests/identity-org-context.php
          php tests/pos-core-synthetic.php
          php tests/technical-preview-interaction.php
