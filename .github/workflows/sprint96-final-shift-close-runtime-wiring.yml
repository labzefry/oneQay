name: Sprint96 Final Shift Close Runtime Wiring

# Attribution: Lab | zefry

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sprint96-final-shift-close-runtime-wiring.yml'
      - 'apps/web/app/Providers/FinalShiftCloseServiceProvider.php'
      - 'apps/web/app/Providers/FinalShiftCloseDurableStagingDeliveryServiceProvider.php'
      - 'apps/web/app/Providers/PosOperationsHubServiceProvider.php'
      - 'apps/web/app/Application/Pos/FinalShiftCloseDurableStagingDeliveryGate.php'
      - 'apps/web/bootstrap/app.php'
      - 'apps/web/tests/pos-final-shift-close-runtime-wiring.php'
      - 'apps/web/tests/pos-final-shift-close-durable-staging-delivery-gate.php'
      - 'docs/SPRINT96_FINAL_SHIFT_CLOSE_RUNTIME_WIRING.md'

permissions:
  contents: read

jobs:
  qualify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Preserve historical provider and bootstrap boundaries
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --exit-code "$BASE_SHA" "$HEAD_SHA" -- \
            apps/web/app/Providers/FinalShiftCloseServiceProvider.php \
            apps/web/bootstrap/app.php \
            apps/web/bootstrap/providers.php \
            apps/web/config/oneqay.php \
            apps/web/database/migrations \
            apps/web/routes/pos-final-shift-close.php
          grep -Fq "['local', 'test', 'ci']" apps/web/app/Providers/FinalShiftCloseServiceProvider.php
          ! grep -Fq "'durable-staging'" apps/web/app/Providers/FinalShiftCloseServiceProvider.php

      - name: Lock fail-closed original runtime wiring
        shell: bash
        run: |
          set -euo pipefail
          provider=apps/web/app/Providers/FinalShiftCloseServiceProvider.php
          grep -Fq 'scoped(CloseShiftRepository::class' "$provider"
          grep -Fq 'new LaravelCloseShiftRepository(' "$provider"
          grep -Fq '$this->featureEnabled()' "$provider"
          grep -Fq 'scoped(CloseShift::class' "$provider"
          grep -Fq 'scoped(ShiftCloseClock::class' "$provider"
          grep -Fq "env('ONEQAY_POS_SHIFT_CLOSE_ENABLED', false)" "$provider"
          grep -Fq 'FILTER_VALIDATE_BOOL' "$provider"
          grep -Fq 'use App\Providers\FinalShiftCloseServiceProvider;' apps/web/bootstrap/app.php
          grep -Fq 'FinalShiftCloseServiceProvider::class,' apps/web/bootstrap/app.php

      - name: Qualify durable-staging successor registration without feature activation
        shell: bash
        run: |
          set -euo pipefail
          gate=apps/web/app/Application/Pos/FinalShiftCloseDurableStagingDeliveryGate.php
          provider=apps/web/app/Providers/FinalShiftCloseDurableStagingDeliveryServiceProvider.php
          aggregate=apps/web/app/Providers/PosOperationsHubServiceProvider.php
          state=ops/final-shift-close/STATE.json
          selection=ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json

          grep -Fq 'DURABLE_STAGING_DELIVERY_SUCCESSOR_V1' "$gate"
          grep -Fq 'durable-staging' "$gate"
          grep -Fq 'DurableStagingMerchantCoreBridge::armedFor($runtimeClass)' "$provider"
          grep -Fq 'ONEQAY_RUNNING_SOURCE_COMMIT' "$provider"
          grep -Fq 'ONEQAY_RUNNING_ARTIFACT_SHA256' "$provider"
          grep -Fq 'ONEQAY_POS_SHIFT_CLOSE_ENABLED' "$provider"
          grep -Fq 'RELEASE.json' "$provider"
          grep -Fq "'session.active'" "$provider"
          grep -Fq 'RequirePosSessionContextMiddleware::class' "$provider"
          grep -Fq '$this->app->register(FinalShiftCloseDurableStagingDeliveryServiceProvider::class);' "$aggregate"
          grep -Fq "'GET /pos/shifts/close'" "$aggregate"
          grep -Fq "'POST /pos/shifts/close'" "$aggregate"
          ! grep -Fq 'FinalShiftCloseDurableStagingDeliveryServiceProvider' apps/web/bootstrap/app.php

          test "$(jq -r '.migration27.state' "$state")" = EXECUTED
          test "$(jq -r '.permission_provisioning.state' "$state")" = PROVISIONED
          test "$(jq -r '.feature_activation.state' "$state")" = INACTIVE || test "$(jq -r '.feature_activation.state' "$state")" = ACTIVE
          test "$(jq -r '.deployment_authority' "$state")" = NOT_GRANTED
          test "$(jq -r '.technical_preview_activation' "$state")" = NOT_AUTHORIZED
          test "$(jq -r '.production_activation' "$state")" = NOT_AUTHORIZED
          test "$(jq -r '.updater_activation' "$state")" = INACTIVE
          test "$(jq -r '.selection_state' "$selection")" = SELECTED_NOT_AUTHORIZED
          test "$(jq -r '.selected_target.environment_id' "$selection")" = oneqay-durable-staging-01
          test "$(jq -r '.selected_target.runtime_class' "$selection")" = durable-staging

      - name: Preserve historical runtime authority boundaries
        shell: bash
        run: |
          set -euo pipefail
          doc=docs/SPRINT96_FINAL_SHIFT_CLOSE_RUNTIME_WIRING.md
          grep -Fq 'FINAL_SHIFT_CLOSE_RUNTIME_FEATURE_FLAG_DEFAULT = DISABLED' "$doc"
          grep -Fq 'FINAL_SHIFT_CLOSE_ROUTE_DELIVERY = NOT_IMPLEMENTED' "$doc"
          grep -Fq 'FINAL_SHIFT_CLOSE_UI_DELIVERY = NOT_IMPLEMENTED' "$doc"
          grep -Fq 'MIGRATION_27_LIVE_EXECUTION = NOT_AUTHORIZED' "$doc"
          grep -Fq 'TECHNICAL_PREVIEW_ACTIVATION_AUTHORITY = NOT_GRANTED' "$doc"
          grep -Fq 'PRODUCTION_AUTHORITY = NOT_GRANTED' "$doc"
          grep -Fq 'UPDATER_ACTIVATION_AUTHORITY = NOT_GRANTED' "$doc"

      - name: Validate PHP syntax and successor gate
        shell: bash
        run: |
          set -euo pipefail
          php -l apps/web/app/Providers/FinalShiftCloseServiceProvider.php
          php -l apps/web/app/Application/Pos/FinalShiftCloseDurableStagingDeliveryGate.php
          php -l apps/web/app/Providers/FinalShiftCloseDurableStagingDeliveryServiceProvider.php
          php -l apps/web/app/Providers/PosOperationsHubServiceProvider.php
          php -l apps/web/bootstrap/app.php
          php -l apps/web/tests/pos-final-shift-close-runtime-wiring.php
          php -l apps/web/tests/pos-final-shift-close-durable-staging-delivery-gate.php
          php apps/web/tests/pos-final-shift-close-durable-staging-delivery-gate.php

      - name: Install PHP dependencies
        working-directory: apps/web
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Reject High or Critical Composer advisories
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          composer audit --locked --format=json > /tmp/oneqay-composer-audit.json || true
          cat /tmp/oneqay-composer-audit.json
          php -r '
            $data = json_decode(file_get_contents("/tmp/oneqay-composer-audit.json"), true, 512, JSON_THROW_ON_ERROR);
            foreach (($data["advisories"] ?? []) as $package => $items) {
                foreach ($items as $item) {
                    $severity = strtolower((string) ($item["severity"] ?? ""));
                    if (in_array($severity, ["high", "critical"], true)) {
                        fwrite(STDERR, "Blocking Composer advisory for {$package}: ".($item["advisoryId"] ?? "unknown")."\n");
                        exit(1);
                    }
                }
            }
          '

      - name: Execute Sprint96 runtime wiring regression
        working-directory: apps/web
        run: php tests/pos-final-shift-close-runtime-wiring.php

      - name: Preserve tracked source cleanliness
        run: git diff --exit-code
