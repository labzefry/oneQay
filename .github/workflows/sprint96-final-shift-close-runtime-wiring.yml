name: Sprint96 Final Shift Close Runtime Wiring

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sprint96-final-shift-close-runtime-wiring.yml'
      - 'apps/web/app/Providers/FinalShiftCloseServiceProvider.php'
      - 'apps/web/bootstrap/app.php'
      - 'apps/web/tests/pos-final-shift-close-runtime-wiring.php'
      - 'docs/SPRINT96_FINAL_SHIFT_CLOSE_RUNTIME_WIRING.md'

permissions:
  contents: read

jobs:
  qualify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Enforce exact Sprint96 source envelope
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$base" "$head" | LC_ALL=C sort > /tmp/actual
          count="$(wc -l < /tmp/actual)"
          fingerprint="$(sha256sum /tmp/actual | awk '{print $1}')"
          echo 'ONEQAY_SPRINT97_HTTP_SUCCESSOR=false' >> "$GITHUB_ENV"

          if [[ "$count" -eq 5 && "$fingerprint" == '6a76872dafb8fe8cc111371f00344e53f44950e05b04500873586b49ee2b65a7' ]]; then
            cat > /tmp/expected <<'EOF'
          .github/workflows/sprint96-final-shift-close-runtime-wiring.yml
          apps/web/app/Providers/FinalShiftCloseServiceProvider.php
          apps/web/bootstrap/app.php
          apps/web/tests/pos-final-shift-close-runtime-wiring.php
          docs/SPRINT96_FINAL_SHIFT_CLOSE_RUNTIME_WIRING.md
          EOF
            diff -u /tmp/expected /tmp/actual
            echo 'Recognized exact Sprint96 source shape.'
          elif [[ "$count" -eq 1 && "$fingerprint" == 'b93da83e5db0b2e66c2c98f447259b9e39c260e647622774213b77f18360ae79' ]]; then
            grep -Fxq '.github/workflows/sprint96-final-shift-close-runtime-wiring.yml' /tmp/actual
            echo 'Recognized exact Sprint97 Sprint96 workflow-only compatibility self shape.'
          elif [[ "$count" -eq 6 && "$fingerprint" == '2582b4a7112c580b5f3fa986e2bf5f7cf92cecda4b9806310e8cf1f0b669ff8a' ]]; then
            for expected in \
              '.github/workflows/sprint97-final-shift-close-http-delivery.yml' \
              'apps/web/app/Delivery/Http/Pos/PosShiftCloseController.php' \
              'apps/web/app/Providers/FinalShiftCloseServiceProvider.php' \
              'apps/web/routes/pos-final-shift-close.php' \
              'apps/web/tests/pos-final-shift-close-http-delivery.php' \
              'docs/SPRINT97_FINAL_SHIFT_CLOSE_HTTP_DELIVERY.md'
            do
              grep -Fxq "$expected" /tmp/actual
            done
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations apps/web/resources apps/web/routes/web.php apps/web/bootstrap/app.php apps/web/bootstrap/providers.php apps/web/config/oneqay.php

            provider='apps/web/app/Providers/FinalShiftCloseServiceProvider.php'
            route='apps/web/routes/pos-final-shift-close.php'
            git update-index --assume-unchanged "$provider" "$route"
            git show "$base:$provider" > "$provider"
            rm -f "$route"
            echo 'ONEQAY_SPRINT97_HTTP_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint97 HTTP delivery successor at Sprint96 runtime-wiring horizon.'
          else
            echo "Unrecognized Sprint96 qualification shape: count=$count fingerprint=$fingerprint" >&2
            cat /tmp/actual >&2
            exit 1
          fi

      - name: Lock fail-closed runtime wiring
        shell: bash
        run: |
          set -euo pipefail
          provider=apps/web/app/Providers/FinalShiftCloseServiceProvider.php
          grep -Fq 'scoped(CloseShiftRepository::class' "$provider"
          grep -Fq 'new LaravelCloseShiftRepository(' "$provider"
          grep -Fq '$this->featureEnabled()' "$provider"
          grep -Fq 'scoped(CloseShift::class' "$provider"
          grep -Fq 'scoped(ShiftCloseClock::class' "$provider"
          grep -Fq "env('ONEQAY_POS_SHIFT_CLOSE_ENABLED', false)" "$provider"
          grep -Fq 'FILTER_VALIDATE_BOOL' "$provider"
          grep -Fq 'use App\Providers\FinalShiftCloseServiceProvider;' apps/web/bootstrap/app.php
          grep -Fq 'FinalShiftCloseServiceProvider::class,' apps/web/bootstrap/app.php

      - name: Preserve historical shared runtime and delivery boundaries
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --exit-code "$base" "$head" -- apps/web/bootstrap/providers.php apps/web/config/oneqay.php

          if [[ "${ONEQAY_SPRINT97_HTTP_SUCCESSOR:-false}" == 'true' ]]; then
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations apps/web/resources apps/web/routes/web.php
            route_diff="$(git diff --name-only "$base" "$head" -- apps/web/routes | LC_ALL=C sort)"
            test "$route_diff" = 'apps/web/routes/pos-final-shift-close.php'
          else
            test "$(git diff --name-only "$base" "$head" -- apps/web/database/migrations apps/web/routes routes apps/web/resources | wc -l)" -eq 0
          fi

          doc=docs/SPRINT96_FINAL_SHIFT_CLOSE_RUNTIME_WIRING.md
          grep -Fq 'FINAL_SHIFT_CLOSE_RUNTIME_FEATURE_FLAG_DEFAULT = DISABLED' "$doc"
          grep -Fq 'FINAL_SHIFT_CLOSE_ROUTE_DELIVERY = NOT_IMPLEMENTED' "$doc"
          grep -Fq 'FINAL_SHIFT_CLOSE_UI_DELIVERY = NOT_IMPLEMENTED' "$doc"
          grep -Fq 'MIGRATION_27_LIVE_EXECUTION = NOT_AUTHORIZED' "$doc"
          grep -Fq 'TECHNICAL_PREVIEW_ACTIVATION_AUTHORITY = NOT_GRANTED' "$doc"
          grep -Fq 'PRODUCTION_AUTHORITY = NOT_GRANTED' "$doc"
          grep -Fq 'UPDATER_ACTIVATION_AUTHORITY = NOT_GRANTED' "$doc"

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l apps/web/app/Providers/FinalShiftCloseServiceProvider.php
          php -l apps/web/bootstrap/app.php
          php -l apps/web/tests/pos-final-shift-close-runtime-wiring.php

      - name: Install PHP dependencies
        working-directory: apps/web
        shell: bash
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Reject High or Critical Composer advisories
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          composer audit --locked --format=json > /tmp/oneqay-composer-audit.json || true
          cat /tmp/oneqay-composer-audit.json
          php -r '
            $data = json_decode(file_get_contents("/tmp/oneqay-composer-audit.json"), true, 512, JSON_THROW_ON_ERROR);
            foreach (($data["advisories"] ?? []) as $package => $items) {
                foreach ($items as $item) {
                    $severity = strtolower((string) ($item["severity"] ?? ""));
                    if (in_array($severity, ["high", "critical"], true)) {
                        fwrite(STDERR, "Blocking Composer advisory for {$package}: ".($item["advisoryId"] ?? "unknown")."\n");
                        exit(1);
                    }
                }
            }
          '

      - name: Execute Sprint96 runtime wiring regression
        working-directory: apps/web
        shell: bash
        run: php tests/pos-final-shift-close-runtime-wiring.php

      - name: Restore Sprint97 successor source after historical regression
        if: env.ONEQAY_SPRINT97_HTTP_SUCCESSOR == 'true'
        shell: bash
        run: |
          set -euo pipefail
          head="${{ github.event.pull_request.head.sha }}"
          provider='apps/web/app/Providers/FinalShiftCloseServiceProvider.php'
          route='apps/web/routes/pos-final-shift-close.php'
          git show "$head:$provider" > "$provider"
          git show "$head:$route" > "$route"
          git update-index --no-assume-unchanged "$provider" "$route"

      - name: Preserve tracked source cleanliness
        shell: bash
        run: git diff --exit-code
