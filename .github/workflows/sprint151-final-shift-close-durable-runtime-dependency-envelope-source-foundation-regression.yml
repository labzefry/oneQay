name: Sprint151 Final Shift Close Durable Runtime Dependency Envelope Source Foundation Regression

# Attribution: Lab | zefry

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sprint151-durable-runtime-dependency-envelope-source-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preserve-source-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      CACHE_STORE: array
      SESSION_DRIVER: array
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Preserve Sprint151 machine-readable contract
        shell: bash
        run: |
          set -euo pipefail
          file=ops/final-shift-close/DURABLE_RUNTIME_DEPENDENCY_ENVELOPE_SOURCE_FOUNDATION_CONTRACT.json
          jq -e '
            .schema_version == 1 and
            .feature == "final-shift-close" and
            .sprint == 151 and
            .contract_state == "MATERIALIZED_SOURCE_ONLY" and
            .bounded_objective == "DURABLE_RUNTIME_TARGET_BOUND_DEPENDENCY_ENVELOPE_EVIDENCE_SOURCE_FOUNDATION" and
            .required_component_count == 9 and
            .source_requirements.exact_component_set_required == true and
            .source_requirements.exact_component_source_paths_required == true and
            .source_requirements.exact_selected_target_binding_required == true and
            .source_requirements.synthetic_mixing_forbidden == true and
            .source_requirements.sprint150_qualification_required_for_output == true and
            .source_envelope.path_count == 5 and
            .source_envelope.sha256 == "ef000ec9172dcee1f08a6c8ea9149fb957a307e7929eaaa42c5d4b08bad94c54" and
            .canonical_boundaries.source_foundation == "MATERIALIZED_SOURCE_ONLY" and
            .canonical_boundaries.dispatchable_dependency_evidence_producer == "NOT_IMPLEMENTED" and
            .canonical_boundaries.real_dependency_envelope_evidence == "NONE" and
            .canonical_boundaries.runtime_allowlist_change == "NOT_IMPLEMENTED" and
            .attribution == "Author by Lab | zefry"
          ' "$file" >/dev/null

      - name: Preserve Sprint151 source and runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          source=apps/web/app/Application/Pos/FinalShiftCloseDurableRuntimeDependencyEnvelopeEvidenceProducer.php
          provider=apps/web/app/Providers/FinalShiftCloseServiceProvider.php
          php -l "$source"
          grep -Fq 'TARGET_BOUND_DURABLE_RUNTIME_DEPENDENCY_OBSERVATIONS' "$source"
          grep -Fq 'TARGET_BOUND_DEPENDENCY_ENVELOPE_EVIDENCE_PRODUCED_NOT_AUTHORIZED' "$source"
          grep -Fq 'produced_dependency_evidence_fails_sprint150_qualification' "$source"
          grep -Fq 'synthetic_dependency_component_observation_forbidden' "$source"
          grep -Fq "runtime_allowlist_change' => 'NOT_IMPLEMENTED'" "$source"
          grep -Fq "activation_authority_state' => 'NOT_GRANTED'" "$source"
          grep -Fq "['local', 'test', 'ci']" "$provider"
          ! grep -Fq "'preview'" "$provider"

      - name: Preserve dependency and predecessor qualification
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          composer audit --locked --no-interaction --abandoned=report
          php tests/pos-final-shift-close-durable-runtime-dependency-envelope-qualification.php
          php tests/pos-final-shift-close-durable-runtime-capability-evidence-producer.php
          php tests/pos-final-shift-close-durable-runtime-capability-evidence-binding.php
          php tests/pos-final-shift-close-durable-runtime-readiness.php
          php tests/pos-final-shift-close-durable-runtime-target-selection.php

      - name: Preserve downstream and operational NO-GO boundaries
        shell: bash
        run: |
          set -euo pipefail
          downstream=ops/final-shift-close/POST_SELECTION_DOWNSTREAM_READINESS.json
          state=ops/final-shift-close/STATE.json
          selection=ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json
          jq -e '
            .sprint151_extension.bounded_objective == "DURABLE_RUNTIME_TARGET_BOUND_DEPENDENCY_ENVELOPE_EVIDENCE_SOURCE_FOUNDATION" and
            .sprint151_extension.source_foundation == "MATERIALIZED_SOURCE_ONLY" and
            .sprint151_extension.dispatchable_dependency_evidence_producer == "NOT_IMPLEMENTED" and
            .sprint151_extension.real_dependency_envelope_evidence == "NONE" and
            .canonical_boundaries.dependency_evidence_source_foundation == "MATERIALIZED_SOURCE_ONLY" and
            .canonical_boundaries.dependency_evidence_producer == "NOT_IMPLEMENTED" and
            .canonical_boundaries.real_dependency_envelope_evidence == "NONE" and
            .canonical_boundaries.runtime_allowlist_change == "NOT_IMPLEMENTED"
          ' "$downstream" >/dev/null
          test "$(jq -r '.migration27.state' "$state")" = 'NOT_EXECUTED'
          test "$(jq -r '.permission_provisioning.state' "$state")" = 'NONE'
          test "$(jq -r '.feature_activation.state' "$state")" = 'INACTIVE'
          test "$(jq -r '.deployment_authority' "$state")" = 'NOT_GRANTED'
          test "$(jq -r '.technical_preview_activation' "$state")" = 'NOT_AUTHORIZED'
          test "$(jq -r '.production_activation' "$state")" = 'NOT_AUTHORIZED'
          test "$(jq -r '.updater_activation' "$state")" = 'INACTIVE'
          test "$(jq -r '.selection_state' "$selection")" = 'BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET'
          test "$(jq -r '.selected_target' "$selection")" = 'null'

      - name: Preserve Sprint151 documentation boundary
        shell: bash
        run: |
          set -euo pipefail
          doc=docs/SPRINT151_FINAL_SHIFT_CLOSE_DURABLE_RUNTIME_DEPENDENCY_ENVELOPE_SOURCE_FOUNDATION.md
          for heading in '## Purpose / Why' '## Objective / Gap' '## What changed' '## Evidence / Qualification' '## Operational boundaries / NO-GO' '## Next position'; do grep -Fq "$heading" "$doc"; done
          grep -Fq 'ef000ec9172dcee1f08a6c8ea9149fb957a307e7929eaaa42c5d4b08bad94c54' "$doc"
          grep -Fq 'real dependency-envelope evidence remains `NONE`' "$doc"
          grep -Fq 'dispatchable operational producer remains `NOT_IMPLEMENTED`' "$doc"

      - name: Verify tracked-source cleanliness
        run: |
          git diff --exit-code
          git diff --cached --exit-code

# Author by Lab | zefry
