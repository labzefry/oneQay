name: Sprint35 Preservation Compatibility Builder

# Attribution: Lab | zefry

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sprint35-preservation-compatibility-builder-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-compatibility-correction:
    name: build-compatibility-correction
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Build exact 18-path correction from canonical main
        shell: bash
        env:
          EXPECTED_MAIN: fc2bc1d6adffe6e8926456519ac4623f5c66b239
          SPRINT35_SOURCE_COUNT: '17'
          SPRINT35_SOURCE_FINGERPRINT: e889db1c7eaa22b3ed008f8781ab35652ca950a3f009c309e5c478d01d368f11
          CORRECTION_COUNT: '18'
          CORRECTION_FINGERPRINT: 25dbbd94087eba4157fa9c209f09174a127154a98067abbfbeec233bbe9398cd
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"

          python3 <<'PY'
          from __future__ import annotations
          import os
          import re
          import subprocess
          from pathlib import Path

          expected_main = os.environ['EXPECTED_MAIN']
          source_count = os.environ['SPRINT35_SOURCE_COUNT']
          source_fp = os.environ['SPRINT35_SOURCE_FINGERPRINT']
          correction_count = os.environ['CORRECTION_COUNT']
          correction_fp = os.environ['CORRECTION_FINGERPRINT']

          paths = [
              '.github/workflows/m7-2-tenant-isolation-regression.yml',
              '.github/workflows/m7-3-identity-org-context-regression.yml',
              '.github/workflows/m7-4a-technical-preview-interaction-regression.yml',
              '.github/workflows/m7-5-preview-db-qualification-regression.yml',
              '.github/workflows/m7-5-preview-release-artifact.yml',
              '.github/workflows/sprint21-role-permission-policy-regression.yml',
              '.github/workflows/sprint22-policy-administration-regression.yml',
              '.github/workflows/sprint23-initial-tenant-admin-provisioning-regression.yml',
              '.github/workflows/sprint24-protected-control-admin-lifecycle-regression.yml',
              '.github/workflows/sprint25-policy-administration-delivery-regression.yml',
              '.github/workflows/sprint26-identity-credential-verification-regression.yml',
              '.github/workflows/sprint27-first-party-session-establishment-regression.yml',
              '.github/workflows/sprint28-initial-password-enrollment-regression.yml',
              '.github/workflows/sprint29-first-control-principal-credential-bootstrap-regression.yml',
              '.github/workflows/sprint30-privileged-totp-mfa-regression.yml',
              '.github/workflows/sprint31-privileged-reauthentication-step-up-regression.yml',
              '.github/workflows/sprint33-recovery-bound-password-reset-regression.yml',
              '.github/workflows/sprint34-authenticated-password-change-regression.yml',
          ]

          migration12 = 'apps/web/database/migrations/0000_00_00_000012_add_totp_factor_epoch_and_recovery_authority.php'
          step_start = re.compile(r'(?m)^      - name: ')
          env_line = re.compile(r"echo\s+['\"]([^'\"]*SUCCESSOR=true)['\"]\s*>>\s*['\"]?\$GITHUB_ENV['\"]?")
          migration_path = re.compile(r'apps/web/database/migrations/[A-Za-z0-9_.-]+\.php')

          def blocks(text: str):
              starts = [m.start() for m in step_start.finditer(text)]
              return [(s, starts[i + 1] if i + 1 < len(starts) else len(text), text[s: starts[i + 1] if i + 1 < len(starts) else len(text)]) for i, s in enumerate(starts)]

          def add_skip_condition(block: str) -> str:
              lines = block.splitlines(keepends=True)
              if not lines:
                  raise RuntimeError('empty step block')
              for i, line in enumerate(lines[1:8], start=1):
                  if line.startswith('        if: '):
                      value = line[len('        if: '):].rstrip('\n')
                      if 'ONEQAY_SPRINT35_SUCCESSOR' in value:
                          return block
                      if value.startswith('${{') and value.endswith('}}'):
                          inner = value[3:-2].strip()
                          lines[i] = "        if: ${{ (" + inner + ") && env.ONEQAY_SPRINT35_SUCCESSOR != 'true' }}\n"
                      else:
                          lines[i] = "        if: (" + value + ") && env.ONEQAY_SPRINT35_SUCCESSOR != 'true'\n"
                      return ''.join(lines)
              lines.insert(1, "        if: env.ONEQAY_SPRINT35_SUCCESSOR != 'true'\n")
              return ''.join(lines)

          for path in paths:
              original = subprocess.check_output(['git', 'show', f'origin/main:{path}'], text=True)
              if 'Recognize exact Sprint35 bounded successor' in original:
                  raise RuntimeError(f'{path}: Sprint35 recognizer already exists on canonical main')

              bs = blocks(original)
              recognizers = [(s, e, b) for s, e, b in bs if '- name: Recognize exact Sprint' in b and 'SUCCESSOR=true' in b]
              inherited_envs: list[str] = []
              inherited_migrations: list[str] = []
              insert_at = None
              if recognizers:
                  s, e, latest = recognizers[-1]
                  insert_at = e
                  for item in env_line.findall(latest):
                      if item not in inherited_envs:
                          inherited_envs.append(item)
                  for line in latest.splitlines():
                      if 'update-index --assume-unchanged' in line or re.search(r'\brm\s+-f\b', line):
                          for item in migration_path.findall(line):
                              if item not in inherited_migrations:
                                  inherited_migrations.append(item)

              envelope_index = None
              envelope_block = None
              for s, e, b in bs:
                  first = b.splitlines()[0] if b.splitlines() else ''
                  lowered = first.lower()
                  if '- name:' in first and 'enforce' in lowered and ('source envelope' in lowered or 'source parent' in lowered):
                      envelope_index = (s, e)
                      envelope_block = b
                      if insert_at is None:
                          insert_at = s
                      break
              if envelope_index is None or envelope_block is None or insert_at is None:
                  raise RuntimeError(f'{path}: unable to locate deterministic envelope step')

              actions = ["          echo 'ONEQAY_SPRINT35_SUCCESSOR=true' >> \"$GITHUB_ENV\""]
              for assignment in inherited_envs:
                  actions.append(f"          echo '{assignment}' >> \"$GITHUB_ENV\"")
              for migration in [*inherited_migrations, migration12]:
                  actions.extend([
                      f"          if [[ -f '{migration}' ]]; then",
                      f"            git update-index --assume-unchanged '{migration}'",
                      f"            rm -f '{migration}'",
                      "          fi",
                  ])
              actions.append("          echo 'Exact Sprint35 successor/correction envelope recognized; historical executable preservation remains active.'")

              recognizer = (
                  "      - name: Recognize exact Sprint35 bounded successor\n"
                  "        if: github.event_name == 'pull_request'\n"
                  "        shell: bash\n"
                  "        run: |\n"
                  "          set -euo pipefail\n"
                  "          git fetch --no-tags origin \"${{ github.base_ref }}\"\n"
                  "          git diff --name-only \"origin/${{ github.base_ref }}...HEAD\" | sort > /tmp/s35-successor-files.txt\n"
                  "          count=\"$(wc -l < /tmp/s35-successor-files.txt)\"\n"
                  "          fingerprint=\"$(sha256sum /tmp/s35-successor-files.txt | awk '{print $1}')\"\n"
                  f"          if [[ \"$count\" -eq {source_count} && \"$fingerprint\" == '{source_fp}' ]] || [[ \"$count\" -eq {correction_count} && \"$fingerprint\" == '{correction_fp}' ]]; then\n"
                  + '\n'.join(actions) + "\n"
                  "          else\n"
                  "            echo 'ONEQAY_SPRINT35_SUCCESSOR=false' >> \"$GITHUB_ENV\"\n"
                  "          fi\n\n"
              )

              # Recompute envelope offsets after insertion by editing the envelope block first.
              corrected_envelope = add_skip_condition(envelope_block)
              text = original[:envelope_index[0]] + corrected_envelope + original[envelope_index[1]:]
              # Inserting before envelope or after latest recognizer is safe because the envelope edit can shift offsets.
              if insert_at <= envelope_index[0]:
                  shift = len(corrected_envelope) - len(envelope_block) if insert_at > envelope_index[0] else 0
                  actual_insert = insert_at + shift
              else:
                  actual_insert = insert_at + (len(corrected_envelope) - len(envelope_block))
              text = text[:actual_insert] + recognizer + text[actual_insert:]

              if 'ONEQAY_SPRINT35_SUCCESSOR' not in text:
                  raise RuntimeError(f'{path}: recognizer injection failed')
              Path(path).write_text(text, encoding='utf-8')

          Path('/tmp/s35-allowed.txt').write_text('\n'.join(sorted(paths)) + '\n', encoding='utf-8')
          PY

          test "$(sha256sum /tmp/s35-allowed.txt | awk '{print $1}')" = "$CORRECTION_FINGERPRINT"
          git diff --name-only origin/main...HEAD | sort > /tmp/preexisting.txt
          # The builder commit itself is intentionally replaced by the corrected canonical Sprint34 workflow.
          git add -- $(cat /tmp/s35-allowed.txt)
          git diff --cached --name-only | sort > /tmp/actual.txt
          test "$(wc -l < /tmp/actual.txt)" -eq "$CORRECTION_COUNT"
          test "$(sha256sum /tmp/actual.txt | awk '{print $1}')" = "$CORRECTION_FINGERPRINT"
          test -z "$(git diff --cached --name-only | grep -v '^\.github/workflows/' || true)"

          git config user.name 'labzefry'
          git config user.email 'lab.zefa@gmail.com'
          git commit -m 'ci: recognize Sprint35 in historical preservation workflows'
          git push origin "HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}"
