# Author by Lab | zefry
name: Sprint184 Preboot Installation Configuration Preparation Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint184-preboot-installation-configuration-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify-sprint184-preboot-installation-configuration:
    name: qualify-sprint184-preboot-installation-configuration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      APP_DEBUG: "false"
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      SESSION_DRIVER: array
      CACHE_STORE: array
      LOG_CHANNEL: stderr
      ONEQAY_BUILD_PROVENANCE: github-actions:${{ github.run_id }}:${{ github.run_attempt }}

    steps:
      - name: Checkout exact Sprint184 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Qualify exact Sprint184 engineering envelope
        if: github.event_name == 'pull_request' && github.head_ref == 'sprint184-preboot-installation-configuration-preparation'
        shell: bash
        env:
          EXPECTED_PATH_HASH: e2537851052c57b1ec3b7d2e99e1b5d0208fb3c54da207d5280682eb85c686a0
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          mapfile -t paths < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | LC_ALL=C sort)
          expected=(
            ".github/workflows/m7-5-preview-release-artifact.yml"
            ".github/workflows/sprint184-preboot-installation-configuration-preparation-regression.yml"
            ".github/workflows/sprint32-authentication-recovery-proof-regression.yml"
            ".github/workflows/sprint33-recovery-bound-password-reset-regression.yml"
            ".github/workflows/sprint34-authenticated-password-change-regression.yml"
            "apps/web/app/Infrastructure/Installation/PrebootInstallationConfiguration.php"
            "apps/web/tests/preboot-installation-configuration.php"
            "tools/build-m7-5-preview-release.sh"
            "tools/installation/public-installer.php"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${paths[@]}")
          actual_hash="$(printf '%s\n' "${paths[@]}" | sha256sum | awk '{print $1}')"
          test "$actual_hash" = "$EXPECTED_PATH_HASH"

      - name: Preserve operational NO-GO
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" = NOT_EXECUTED
          test "$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)" = NONE
          test "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" = INACTIVE
          test "$(jq -r '.deployment_authority' ops/final-shift-close/STATE.json)" = NOT_GRANTED
          test "$(jq -r '.technical_preview_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
          test "$(jq -r '.production_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
          test "$(jq -r '.updater_activation' ops/final-shift-close/STATE.json)" = INACTIVE
          test "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET
          test "$(jq -r '.selected_target' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = null

      - name: Setup PHP 8.3 build runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup exact Node LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.19.0

      - name: Validate Sprint184 PHP and shell source
        shell: bash
        run: |
          set -euo pipefail
          php -l apps/web/app/Infrastructure/Installation/PrebootInstallationConfiguration.php
          php -l apps/web/tests/preboot-installation-configuration.php
          php -l tools/installation/public-installer.php
          bash -n tools/build-m7-5-preview-release.sh

      - name: Install locked web dependencies
        working-directory: apps/web
        run: |
          set -euo pipefail
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          npm ci --ignore-scripts --no-fund
          npm run type-check
          npm run build

      - name: Execute preboot preparation regression
        working-directory: apps/web
        run: |
          set -euo pipefail
          php -d zend.assertions=1 -d assert.exception=1 tests/preboot-installation-configuration.php

      - name: Build governed artifact with preboot installer
        id: package
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          bash tools/build-m7-5-preview-release.sh "$HEAD_SHA"

          release_id="m75-preview-${HEAD_SHA:0:12}"
          artifact="dist/${release_id}.tar.gz"
          test -f "$artifact"
          tar -tzf "$artifact" > /tmp/oneqay-s184-release-list.txt

          grep -Fxq "$release_id/public-surface/install.php" /tmp/oneqay-s184-release-list.txt
          grep -Fxq "$release_id/apps/web/app/Infrastructure/Installation/PrebootInstallationConfiguration.php" /tmp/oneqay-s184-release-list.txt
          ! grep -E '(^|/)(\.env|\.env\.pending)(/|$)' /tmp/oneqay-s184-release-list.txt
          ! grep -F '/apps/web/database/migrations/' /tmp/oneqay-s184-release-list.txt

          tar -xOzf "$artifact" "$release_id/public-surface/install.php" > /tmp/oneqay-s184-install.php
          php -l /tmp/oneqay-s184-install.php
          grep -Fq "$release_id" /tmp/oneqay-s184-install.php
          ! grep -Fq '__ONEQAY_RELEASE_ID__' /tmp/oneqay-s184-install.php
          grep -Fq 'Prepare runtime configuration' /tmp/oneqay-s184-install.php
          grep -Fq 'Technical Preview</span><strong>NOT AUTHORIZED' /tmp/oneqay-s184-install.php
          grep -Fq 'Production</span><strong>NOT AUTHORIZED' /tmp/oneqay-s184-install.php

          tar -xOzf "$artifact" "$release_id/RELEASE.json" > /tmp/oneqay-s184-release.json
          test "$(jq -r '.migration_classification' /tmp/oneqay-s184-release.json)" = NO_SCHEMA_CHANGE
          test "$(jq -r '.updater_activation' /tmp/oneqay-s184-release.json)" = DISABLED
          test "$(jq -r '.preboot_installation.public_entry' /tmp/oneqay-s184-release.json)" = install.php
          test "$(jq -r '.preboot_installation.pending_environment_relative_path' /tmp/oneqay-s184-release.json)" = oneqay-preview/shared/runtime/.env.pending
          test "$(jq -r '.preboot_installation.activation_authorized' /tmp/oneqay-s184-release.json)" = false

      - name: Prove deterministic governed artifact reproduction
        shell: bash
        run: |
          set -euo pipefail
          first_sha="${{ steps.package.outputs.artifact_sha256 }}"
          first_size="${{ steps.package.outputs.artifact_size }}"
          source_sha="${{ github.event.pull_request.head.sha || github.sha }}"

          bash tools/build-m7-5-preview-release.sh "$source_sha"

          artifact="dist/m75-preview-${source_sha:0:12}.tar.gz"
          test "$(sha256sum "$artifact" | awk '{print $1}')" = "$first_sha"
          test "$(wc -c < "$artifact" | tr -d '[:space:]')" = "$first_size"

      - name: Preserve pending-only installation boundary
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=apps/web/app/Infrastructure/Installation/PrebootInstallationConfiguration.php
          PAGE=tools/installation/public-installer.php
          grep -Fq "'.env.pending'" "$SOURCE"
          grep -Fq "'activation_authorized' => false" "$SOURCE"
          grep -Fq "'ONEQAY_TECHNICAL_PREVIEW_ENABLED' => 'false'" "$SOURCE"
          grep -Fq "'ONEQAY_PERSISTENCE_ENABLED' => 'false'" "$SOURCE"
          grep -Fq "'ONEQAY_SYSTEM_UPDATE_CONTROL_PLANE_ENABLED' => 'false'" "$SOURCE"
          grep -Fq 'oneqay-preview/shared' "$PAGE"
          ! grep -Eq 'Artisan::call|migrate|requestInstall\(|checkAvailability\(' "$SOURCE" "$PAGE"
          ! grep -Eq -- '->(insert|update|delete|increment|decrement)\(' "$SOURCE" "$PAGE"

      - name: Verify tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
