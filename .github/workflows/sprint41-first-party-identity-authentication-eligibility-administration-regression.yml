name: Sprint41 First-Party Identity Authentication Eligibility Administration Regression

# Attribution: Lab | zefry

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sprint41-first-party-identity-authentication-eligibility-administration-regression.yml'
      - 'apps/web/app/Application/Identity/FirstPartyIdentityEligibilityAdministrationRepository.php'
      - 'apps/web/app/Application/Identity/FirstPartyIdentityEligibilityAdministrationService.php'
      - 'apps/web/app/Application/Identity/FirstPartyIdentityEligibilityAdministrationViolation.php'
      - 'apps/web/app/Application/Identity/IdentityAuthenticationEligibilityMutationId.php'
      - 'apps/web/app/Delivery/Http/Identity/FirstPartyIdentityEligibilityAdministrationController.php'
      - 'apps/web/app/Infrastructure/Identity/LaravelFirstPartyIdentityEligibilityAdministrationRepository.php'
      - 'apps/web/app/Providers/AppServiceProvider.php'
      - 'apps/web/database/migrations/0000_00_00_000015_create_identity_authentication_eligibility_administration_journal.php'
      - 'apps/web/routes/web.php'
      - 'apps/web/tests/first-party-identity-authentication-eligibility-administration.php'
      - 'docs/FIRST_PARTY_IDENTITY_AUTHENTICATION_ELIGIBILITY_ADMINISTRATION_FOUNDATION.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint41-identity-authentication-eligibility-administration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sprint41-identity-authentication-eligibility-administration:
    name: sprint41-identity-authentication-eligibility-administration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:cXFxcXFxcXFxcXFxcXFxcXFxcXFxcXFxcXFxcXFxcXE=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      ONEQAY_PERSISTENCE_ENABLED: 'true'
      ONEQAY_AUTHENTICATION_SESSION_CONTROL_ENABLED: 'true'
      ONEQAY_PRIVILEGED_TOTP_MFA_ENABLED: 'false'
      SESSION_DRIVER: array
      CACHE_STORE: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup exact PHP runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Enforce exact Sprint41 source envelope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/sprint41-source-paths <<'EOF'
          .github/workflows/sprint41-first-party-identity-authentication-eligibility-administration-regression.yml
          apps/web/app/Application/Identity/FirstPartyIdentityEligibilityAdministrationRepository.php
          apps/web/app/Application/Identity/FirstPartyIdentityEligibilityAdministrationService.php
          apps/web/app/Application/Identity/FirstPartyIdentityEligibilityAdministrationViolation.php
          apps/web/app/Application/Identity/IdentityAuthenticationEligibilityMutationId.php
          apps/web/app/Delivery/Http/Identity/FirstPartyIdentityEligibilityAdministrationController.php
          apps/web/app/Infrastructure/Identity/LaravelFirstPartyIdentityEligibilityAdministrationRepository.php
          apps/web/app/Providers/AppServiceProvider.php
          apps/web/database/migrations/0000_00_00_000015_create_identity_authentication_eligibility_administration_journal.php
          apps/web/routes/web.php
          apps/web/tests/first-party-identity-authentication-eligibility-administration.php
          docs/FIRST_PARTY_IDENTITY_AUTHENTICATION_ELIGIBILITY_ADMINISTRATION_FOUNDATION.md
          EOF
          sort -o /tmp/sprint41-source-paths /tmp/sprint41-source-paths
          test "$(wc -l < /tmp/sprint41-source-paths)" -eq 12
          test "$(sha256sum /tmp/sprint41-source-paths | awk '{print $1}')" = 'b2c5fc10a8baa2d56991d6dbd36b0407159d70953654ef322a9a11d23660489b'
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | sort > /tmp/actual-sprint41-source-paths
          cmp -s /tmp/sprint41-source-paths /tmp/actual-sprint41-source-paths || {
            echo 'Sprint41 changed-file envelope mismatch.' >&2
            diff -u /tmp/sprint41-source-paths /tmp/actual-sprint41-source-paths >&2 || true
            exit 1
          }
          test "$(sha256sum /tmp/actual-sprint41-source-paths | awk '{print $1}')" = 'b2c5fc10a8baa2d56991d6dbd36b0407159d70953654ef322a9a11d23660489b'

      - name: Enforce migration fifteen exclusivity and prior migration immutability
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          migration='apps/web/database/migrations/0000_00_00_000015_create_identity_authentication_eligibility_administration_journal.php'
          changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 1
          printf '%s\n' "$changed" | grep -Fxq "$migration"
          git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration"

          mapfile -t migrations < <(find apps/web/database/migrations -maxdepth 1 -type f -name '*.php' -printf '%f\n' | sort)
          test "${#migrations[@]}" -eq 15
          for index in $(seq 1 15); do
            prefix="$(printf '0000_00_00_%06d_' "$index")"
            test "$(printf '%s\n' "${migrations[@]}" | grep -c "^$prefix")" -eq 1
          done
          test "$(printf '%s\n' "${migrations[@]}" | grep -c '^0000_00_00_000014_add_first_party_authentication_eligibility_to_identities\.php$')" -eq 1
          test "$(printf '%s\n' "${migrations[@]}" | grep -c '^0000_00_00_000015_create_identity_authentication_eligibility_administration_journal\.php$')" -eq 1

      - name: Validate exact migration fifteen schema
        shell: bash
        run: |
          set -euo pipefail
          migration='apps/web/database/migrations/0000_00_00_000015_create_identity_authentication_eligibility_administration_journal.php'
          grep -Fq "Schema::create('oneqay_identity_authentication_eligibility_mutations'" "$migration"
          for column in tenant_id mutation_id actor_identity_id target_identity_id operation payload_fingerprint outcome occurred_at_unix; do
            grep -Fq "'$column'" "$migration"
          done
          grep -Fq "['tenant_id', 'mutation_id']" "$migration"
          grep -Fq "'pk_oneqay_identity_authentication_eligibility_mutations'" "$migration"
          grep -Fq "throw new LogicException('Forward-only generated migration; rollback is not authorized.');" "$migration"
          ! grep -Eq 'Schema::table|->(index|unique|foreign|timestamp|timestamps|enum)|DB::|first_party_authentication_enabled' "$migration"

      - name: Validate disable-only application contracts
        shell: bash
        run: |
          set -euo pipefail
          contract='apps/web/app/Application/Identity/FirstPartyIdentityEligibilityAdministrationRepository.php'
          service='apps/web/app/Application/Identity/FirstPartyIdentityEligibilityAdministrationService.php'
          adapter='apps/web/app/Infrastructure/Identity/LaravelFirstPartyIdentityEligibilityAdministrationRepository.php'
          controller='apps/web/app/Delivery/Http/Identity/FirstPartyIdentityEligibilityAdministrationController.php'
          provider='apps/web/app/Providers/AppServiceProvider.php'
          routes='apps/web/routes/web.php'

          grep -Fq "public const OPERATION_DISABLE = 'disable';" "$contract"
          grep -Fq 'public function disable(' "$service"
          grep -Fq 'PersistenceTransaction $transaction' "$service"
          grep -Fq 'PolicyAdministrationClock $clock' "$service"
          grep -Fq "private const JOURNAL_TABLE = 'oneqay_identity_authentication_eligibility_mutations';" "$adapter"
          grep -Fq -- "->where('first_party_authentication_enabled', 1)" "$adapter"
          grep -Fq -- "->update(['first_party_authentication_enabled' => false])" "$adapter"
          grep -Fq 'AdministrationPermission::MANAGE' "$adapter"
          grep -Fq "['local', 'test', 'ci']" "$adapter"
          grep -Fq 'count($payload) !== 1' "$controller"
          grep -Fq "array_key_exists('mutation_id', \$payload)" "$controller"
          grep -Fq 'IDENTITY_AUTHENTICATION_ELIGIBILITY_ADMINISTRATION_REJECTED' "$controller"
          grep -Fq 'FirstPartyIdentityEligibilityAdministrationRepository::class' "$provider"
          grep -Fq 'FirstPartyIdentityEligibilityAdministrationService::class' "$provider"
          grep -Fq "Route::post('/administration/identities/{identity_id}/authentication-disablement'" "$routes"
          grep -Fq -- "->name('identity.authentication-eligibility.disable')" "$routes"
          grep -Fq "'session.active', 'throttle:5,1', 'throttle:20,60', RequirePolicyAdministrationSessionContextMiddleware::class" "$routes"

          ! grep -RInE "authentication-(enable|reactivat)|authentication_eligibility_(enable|reactivat)|identity\.authentication-eligibility\.(enable|reactivate)" \
            apps/web/app/Application/Identity/FirstPartyIdentityEligibilityAdministration*.php \
            apps/web/app/Delivery/Http/Identity/FirstPartyIdentityEligibilityAdministrationController.php \
            apps/web/app/Infrastructure/Identity/LaravelFirstPartyIdentityEligibilityAdministrationRepository.php \
            apps/web/routes/web.php
          ! grep -Fq -- "->update(['first_party_authentication_enabled' => true])" "$adapter"

      - name: Lint Sprint41 source
        shell: bash
        run: |
          set -euo pipefail
          php -l apps/web/app/Application/Identity/FirstPartyIdentityEligibilityAdministrationRepository.php
          php -l apps/web/app/Application/Identity/FirstPartyIdentityEligibilityAdministrationService.php
          php -l apps/web/app/Application/Identity/FirstPartyIdentityEligibilityAdministrationViolation.php
          php -l apps/web/app/Application/Identity/IdentityAuthenticationEligibilityMutationId.php
          php -l apps/web/app/Delivery/Http/Identity/FirstPartyIdentityEligibilityAdministrationController.php
          php -l apps/web/app/Infrastructure/Identity/LaravelFirstPartyIdentityEligibilityAdministrationRepository.php
          php -l apps/web/app/Providers/AppServiceProvider.php
          php -l apps/web/database/migrations/0000_00_00_000015_create_identity_authentication_eligibility_administration_journal.php
          php -l apps/web/routes/web.php
          php -l apps/web/tests/first-party-identity-authentication-eligibility-administration.php

      - name: Install locked application dependencies
        working-directory: apps/web
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist

      - name: Run dedicated Sprint41 administration regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          output="$(php tests/first-party-identity-authentication-eligibility-administration.php 2>&1)" || {
            printf '%s\n' "$output"
            exit 1
          }
          printf '%s\n' "$output"
          grep -Fq 'Sprint41 first-party identity authentication eligibility administration regression passed.' <<<"$output"

      - name: Preserve Sprint40 request-time eligibility regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          migration='database/migrations/0000_00_00_000015_create_identity_authentication_eligibility_administration_journal.php'
          cp "$migration" /tmp/oneqay-s41-migration15.php
          rm "$migration"
          output="$(php tests/first-party-session-identity-disablement-revalidation.php 2>&1)" || {
            printf '%s\n' "$output"
            mv /tmp/oneqay-s41-migration15.php "$migration"
            exit 1
          }
          printf '%s\n' "$output"
          grep -Fq 'Sprint40 first-party session identity disablement revalidation regression passed.' <<<"$output"
          mv /tmp/oneqay-s41-migration15.php "$migration"

      - name: Preserve runtime and activation boundaries
        shell: bash
        run: |
          set -euo pipefail
          doc='docs/FIRST_PARTY_IDENTITY_AUTHENTICATION_ELIGIBILITY_ADMINISTRATION_FOUNDATION.md'
          grep -Fq 'Local / Test / CI only' "$doc"
          grep -Fq 'NO_SCHEMA_CHANGE / SPRINT40 NOT ACTIVATED' "$doc"
          grep -Fq 'NO-GO / NOT AUTHORIZED' "$doc"
          grep -Fq 'DISABLED / UNWIRED' "$doc"
          grep -Fq 'NOT AUTHORIZED' "$doc"
          ! grep -RInE 'ONEQAY_TECHNICAL_PREVIEW_ENABLED[[:space:]]*=[[:space:]]*true|runtime_class.*production.*eligibility' \
            apps/web/app/Application/Identity/FirstPartyIdentityEligibilityAdministration*.php \
            apps/web/app/Infrastructure/Identity/LaravelFirstPartyIdentityEligibilityAdministrationRepository.php \
            apps/web/app/Providers/AppServiceProvider.php

      - name: Confirm tracked source cleanliness
        run: git diff --exit-code
