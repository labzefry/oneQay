          grep -Fq "throw new LogicException('Forward-only generated migration; rollback is not authorized.');" "$migration"
          ! grep -Eq 'Schema::table|->(index|unique|foreign|timestamp|timestamps|enum)|DB::|first_party_authentication_enabled' "$migration"

      - name: Validate disable-only application contracts
        shell: bash
        run: |
          set -euo pipefail
          contract='apps/web/app/Application/Identity/FirstPartyIdentityEligibilityAdministrationRepository.php'
          service='apps/web/app/Application/Identity/FirstPartyIdentityEligibilityAdministrationService.php'
          adapter='apps/web/app/Infrastructure/Identity/LaravelFirstPartyIdentityEligibilityAdministrationRepository.php'
          controller='apps/web/app/Delivery/Http/Identity/FirstPartyIdentityEligibilityAdministrationController.php'
          provider='apps/web/app/Providers/AppServiceProvider.php'
          routes='apps/web/routes/web.php'

          grep -Fq "public const OPERATION_DISABLE = 'disable';" "$contract"
          grep -Fq 'public function disable(' "$service"
          grep -Fq 'PersistenceTransaction $transaction' "$service"
          grep -Fq 'PolicyAdministrationClock $clock' "$service"
          grep -Fq "private const JOURNAL_TABLE = 'oneqay_identity_authentication_eligibility_mutations';" "$adapter"
          grep -Fq -- "->where('first_party_authentication_enabled', 1)" "$adapter"
          grep -Fq -- "->update(['first_party_authentication_enabled' => false])" "$adapter"
          grep -Fq 'AdministrationPermission::MANAGE' "$adapter"
          grep -Fq "['local', 'test', 'ci']" "$adapter"
          grep -Fq 'count($payload) !== 1' "$controller"
          grep -Fq "array_key_exists('mutation_id', \$payload)" "$controller"
          grep -Fq 'IDENTITY_AUTHENTICATION_ELIGIBILITY_ADMINISTRATION_REJECTED' "$controller"
          grep -Fq 'FirstPartyIdentityEligibilityAdministrationRepository::class' "$provider"
          grep -Fq 'FirstPartyIdentityEligibilityAdministrationService::class' "$provider"
          grep -Fq "Route::post('/administration/identities/{identity_id}/authentication-disablement'" "$routes"
          grep -Fq -- "->name('identity.authentication-eligibility.disable')" "$routes"
          grep -Fq "'session.active', 'throttle:5,1', 'throttle:20,60', RequirePolicyAdministrationSessionContextMiddleware::class" "$routes"

          if [[ "${ONEQAY_SPRINT43_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            grep -Fq "public const OPERATION_REACTIVATE = 'reactivate';" "$contract"
            grep -Fq 'public function reactivate(' "$service"
