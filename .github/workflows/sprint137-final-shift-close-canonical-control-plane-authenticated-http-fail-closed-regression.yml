name: Sprint137 Final Shift Close Canonical Control Plane Authenticated HTTP Fail Closed Regression

# Attribution: Lab | zefry

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sprint137-final-shift-close-canonical-control-plane-authenticated-http-fail-closed-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify-canonical-control-plane-authenticated-http-fail-closed-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      CACHE_STORE: array
      SESSION_DRIVER: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Lock exact Sprint137 source envelope
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$base" "$head" | LC_ALL=C sort > /tmp/paths
          cat > /tmp/expected <<'EOF'
          .github/workflows/sprint137-final-shift-close-canonical-control-plane-authenticated-http-fail-closed-regression.yml
          apps/web/tests/final-shift-close-runtime-control-plane-authenticated-http-fail-closed-regression.php
          docs/SPRINT137_FINAL_SHIFT_CLOSE_CANONICAL_CONTROL_PLANE_AUTHENTICATED_HTTP_FAIL_CLOSED_REGRESSION.md
          ops/final-shift-close/CANONICAL_RUNTIME_CONTROL_PLANE_AUTHENTICATED_HTTP_FAIL_CLOSED_REGRESSION_CONTRACT.json
          EOF
          diff -u /tmp/expected /tmp/paths
          [[ "$(sha256sum /tmp/paths | awk '{print $1}')" == '52a6fd043b7004add6d454feba69de97ae859a6a8e7a27cd97f25ca891516f5d' ]]

      - name: Preserve Sprint136 historical successor compatibility
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/sprint136-final-shift-close-canonical-control-plane-authenticated-http-positive-path-regression.yml
          grep -Fq 'Preserve successor-compatible historical regression boundary' "$workflow"
          grep -Fq 'Sprint136 is historical after its canonical squash merge.' "$workflow"
          ! grep -Fq 'Lock exact Sprint136 source envelope' "$workflow"

      - name: Validate Sprint137 machine-readable contract
        shell: bash
        run: |
          set -euo pipefail
          file=ops/final-shift-close/CANONICAL_RUNTIME_CONTROL_PLANE_AUTHENTICATED_HTTP_FAIL_CLOSED_REGRESSION_CONTRACT.json
          jq -e '
            .schema_version == 1 and
            .feature == "final-shift-close" and
            .sprint == 137 and
            .bounded_objective == "CANONICAL_CONTROL_PLANE_AUTHENTICATED_HTTP_FAIL_CLOSED_REGRESSION" and
            .execution_mode == "CI_ONLY_SYNTHETIC_AUTHENTICATED_HTTP_FAIL_CLOSED_REGRESSION" and
            .qualification.dispatch_mode == "IN_PROCESS_CANONICAL_HTTP_KERNEL" and
            .qualification.new_executable_gap == "CROSS_PROVIDER_CANONICAL_VALID_TOKEN_AUTHENTICATED_ROUTE_MIDDLEWARE_CONTROLLER_FAIL_CLOSED_COMPOSITION" and
            .qualification.canonical_token_policy_owner == "SPRINT130" and
            .qualification.fixture_length == "CANONICAL_MINIMUM" and
            .qualification.fixture_canonical_validity == true and
            .qualification.shared_fixture_across_both_control_planes == true and
            .qualification.materialization.route_name == "internal.final-shift-close.runtime-binding-manifest.materialize" and
            .qualification.materialization.method == "POST" and
            .qualification.materialization.authenticated_http_dispatch == "PERFORMED_IN_TEST_PROCESS_ONLY" and
            .qualification.materialization.expected_status == 503 and
            .qualification.materialization.expected_error == "materialization_unavailable" and
            .qualification.materialization.real_route == true and
            .qualification.materialization.real_token_middleware == true and
            .qualification.materialization.real_controller == true and
            .qualification.materialization.application_service == "SYNTHETIC_TEST_OWNED_INSTANCE" and
            .qualification.materialization.failure_source == "BLOCKED_SYNTHETIC_TARGET_SELECTION" and
            .qualification.materialization.writer == "IN_MEMORY_TEST_DOUBLE" and
            .qualification.materialization.writer_invocations == 0 and
            .qualification.materialization.production_writer_bomb_resolution_attempts == 0 and
            .qualification.materialization.canonical_runtime_manifest_write == false and
            .qualification.db_attestation.route_name == "internal.final-shift-close.runtime-db-binding-attestation" and
            .qualification.db_attestation.method == "GET" and
            .qualification.db_attestation.authenticated_http_dispatch == "PERFORMED_IN_TEST_PROCESS_ONLY" and
            .qualification.db_attestation.expected_status == 503 and
            .qualification.db_attestation.expected_error == "RUNTIME_DB_BINDING_ATTESTATION_UNAVAILABLE" and
            .qualification.db_attestation.real_route == true and
            .qualification.db_attestation.real_token_middleware == true and
            .qualification.db_attestation.real_controller == true and
            .qualification.db_attestation.application_service == "SYNTHETIC_TEST_OWNED_INSTANCE" and
            .qualification.db_attestation.database_identity_reader == "THROWING_IN_MEMORY_TEST_DOUBLE" and
            .qualification.db_attestation.database_identity_reader_invocations == 1 and
            .qualification.db_attestation.production_database_identity_reader_bomb_resolution_attempts == 0 and
            .qualification.db_attestation.real_database_connection == false and
            .qualification.db_attestation.real_database_identity_read == false and
            .qualification.db_attestation.attestation_mode == "READ_ONLY" and
            .qualification.db_attestation.migration27_state == "NOT_EXECUTED" and
            .qualification.response_leakage == "FORBIDDEN" and
            .qualification.valid_operational_control_plane_request == false and
            .qualification.operational_runtime_token == false and
            .historical_ownership.sprint133_controller_fail_closed == "PRESERVED" and
            .historical_ownership.sprint136_authenticated_http_positive_path == "PRESERVED" and
            .successor_compatibility.sprint136_historical_workflow == "SUCCESSOR_COMPATIBLE" and
            .successor_compatibility.sprint136_full_pr_envelope_lock == "ABSENT" and
            .successor_compatibility.active_sprint_envelope_authority == "SPRINT137_WORKFLOW_ONLY" and
            .source_envelope.path_count == 4 and
            .source_envelope.sha256 == "52a6fd043b7004add6d454feba69de97ae859a6a8e7a27cd97f25ca891516f5d" and
            .canonical_boundaries.synthetic_authenticated_http_route_invocation == "PERFORMED_IN_TEST_PROCESS_ONLY" and
            .canonical_boundaries.operational_control_plane_request == "NOT_PERFORMED" and
            .canonical_boundaries.production_filesystem_adapter_resolution == "NOT_PERFORMED" and
            .canonical_boundaries.canonical_runtime_manifest_write == "NOT_PERFORMED" and
            .canonical_boundaries.production_database_identity_reader_resolution == "NOT_PERFORMED" and
            .canonical_boundaries.real_database_connection == "NOT_PERFORMED" and
            .canonical_boundaries.real_database_identity_read == "NOT_PERFORMED" and
            .canonical_boundaries.runtime_token_provisioning == "NOT_PERFORMED" and
            .canonical_boundaries.selected_target == null and
            .canonical_boundaries.migration27_execution == "NOT_PERFORMED" and
            .canonical_boundaries.permission_provisioning == "NONE" and
            .canonical_boundaries.feature_activation == "INACTIVE" and
            .canonical_boundaries.deployment_authority == "NOT_GRANTED" and
            .canonical_boundaries.technical_preview == "NO-GO" and
            .canonical_boundaries.production == "NO-GO" and
            .canonical_boundaries.updater == "INACTIVE" and
            .attribution == "Author by Lab | zefry"
          ' "$file" >/dev/null

      - name: Prove Sprint137 test remains synthetic and production-adapter isolated
        shell: bash
        run: |
          set -euo pipefail
          test_file=apps/web/tests/final-shift-close-runtime-control-plane-authenticated-http-fail-closed-regression.php
          grep -Fq 'FinalShiftCloseRuntimeControlPlaneTokenPolicy::MINIMUM_LENGTH' "$test_file"
          grep -Fq 'FinalShiftCloseRuntimeControlPlaneTokenPolicy::isValidToken($validToken) === true' "$test_file"
          grep -Fq '/internal/final-shift-close/runtime-binding-manifest/materialize' "$test_file"
          grep -Fq '/internal/final-shift-close/runtime-db-binding-attestation' "$test_file"
          grep -Fq 'HTTP_AUTHORIZATION' "$test_file"
          grep -Fq '$kernel->handle($materializationRequest)' "$test_file"
          grep -Fq '$kernel->handle($attestationRequest)' "$test_file"
          grep -Fq "'materialization_unavailable'" "$test_file"
          grep -Fq "'RUNTIME_DB_BINDING_ATTESTATION_UNAVAILABLE'" "$test_file"
          grep -Fq '$writer->writes === 0' "$test_file"
          grep -Fq '$throwingReader->reads === 1' "$test_file"
          grep -Fq '$productionWriterResolutionAttempts === 0' "$test_file"
          grep -Fq '$productionDatabaseReaderResolutionAttempts === 0' "$test_file"
          grep -Fq '! file_exists($canonicalManifestPath)' "$test_file"
          ! grep -Fq 'FilesystemFinalShiftCloseRuntimeBindingManifestWriter' "$test_file"
          ! grep -Fq 'LaravelFinalShiftCloseRuntimeDatabaseIdentityReader' "$test_file"
          ! grep -Fq "connection('oneqay')" "$test_file"

      - name: Prove operational NO-GO state remains intact
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" == 'NOT_EXECUTED' ]]
          [[ "$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)" == 'NONE' ]]
          [[ "$(jq -r '.permission_provisioning.default_grant' ops/final-shift-close/STATE.json)" == 'NONE' ]]
          [[ "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.deployment_authority' ops/final-shift-close/STATE.json)" == 'NOT_GRANTED' ]]
          [[ "$(jq -r '.technical_preview_activation' ops/final-shift-close/STATE.json)" == 'NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.production_activation' ops/final-shift-close/STATE.json)" == 'NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.updater_activation' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET' ]]
          [[ "$(jq -r '.selected_target' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'null' ]]

      - name: Validate PHP syntax and locked dependencies
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php -l tests/final-shift-close-runtime-control-plane-authenticated-http-fail-closed-regression.php
          php -l tests/final-shift-close-runtime-control-plane-authenticated-http-positive-path-regression.php
          php -l tests/final-shift-close-runtime-control-plane-controller-fail-closed-regression.php
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          composer audit --locked --no-interaction --abandoned=report

      - name: Execute Sprint137 authenticated HTTP fail-closed regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-authenticated-http-fail-closed-regression.php

      - name: Preserve Sprint136 authenticated HTTP positive-path regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-authenticated-http-positive-path-regression.php

      - name: Preserve Sprint133 direct controller fail-closed regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-controller-fail-closed-regression.php

      - name: Preserve Sprint134 delivery-gate registration regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-delivery-gate-registration-regression.php

      - name: Verify tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git status --short --untracked-files=no
