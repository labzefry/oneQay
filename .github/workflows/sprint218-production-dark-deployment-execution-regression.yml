# Author by Lab | zefry
name: Sprint218 Production Dark Deployment Execution Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint218-production-dark-deployment-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Lock exact Sprint218 envelope
        if: github.event_name == 'pull_request' && github.head_ref == 'sprint218-production-dark-deployment-execution-foundation'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_PATH_HASH: 8049c4b0b9dce606c9b66d464f99255a1d17043659fb20142d2c3d6a7984a5fa
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | LC_ALL=C sort > /tmp/s218-paths
          test "$(wc -l < /tmp/s218-paths)" -eq 15
          test "$(sha256sum /tmp/s218-paths | awk '{print $1}')" = "$EXPECTED_PATH_HASH"
          test -z "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- apps/web)"

      - name: Setup governed PHP runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: curl,pdo_mysql,phar
          coverage: none

      - name: Validate Sprint218 source and contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/production/build-production-operator-kit.sh
          php -l tools/execute-production-dark-deployment.php
          php -l tools/inspect-production-operator-target.php
          php -l tools/prepare-production-operator-target-candidate.php
          php -l tools/prepare-production-deployment-authority-request.php
          php -l tools/qualify-production-deployment-authority.php
          php -l tools/prepare-production-deployment-plan.php
          php -l tools/qualify-production-deployment-evidence.php
          jq -e '.contract_state == "SOURCE_READY_AUTHORITY_BOUND_PRODUCTION_DARK_DEPLOYMENT_EXECUTOR_NOT_EXECUTED"' ops/final-shift-close/PRODUCTION_DARK_DEPLOYMENT_EXECUTION_CONTRACT.json
          jq -e '.contract_state == "PUBLISHES_SECRET_FREE_PRODUCTION_DARK_DEPLOYMENT_OPERATOR_KIT_NOT_DEPLOYED_NOT_ACTIVATED"' ops/final-shift-close/PRODUCTION_OPERATOR_KIT_PUBLICATION_CONTRACT.json
          jq -e '.safety.migration_execution == false' ops/final-shift-close/PRODUCTION_DARK_DEPLOYMENT_EXECUTION_CONTRACT.json
          jq -e '.safety.production_traffic_activation == false' ops/final-shift-close/PRODUCTION_DARK_DEPLOYMENT_EXECUTION_CONTRACT.json
          jq -e '.operator_requirements.business_readiness_endpoint_not_used_for_dark_deploy == "/health/ready"' ops/final-shift-close/PRODUCTION_OPERATOR_KIT_PUBLICATION_CONTRACT.json

      - name: Preserve canonical operational NO-GO
        shell: bash
        run: |
          set -euo pipefail
          state=ops/final-shift-close/STATE.json
          selection=ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json
          test "$(jq -r '.migration27.state' "$state")" = NOT_EXECUTED
          test "$(jq -r '.permission_provisioning.state' "$state")" = NONE
          test "$(jq -r '.feature_activation.state' "$state")" = INACTIVE
          test "$(jq -r '.deployment_authority' "$state")" = NOT_GRANTED
          test "$(jq -r '.technical_preview_activation' "$state")" = NOT_AUTHORIZED
          test "$(jq -r '.production_activation' "$state")" = NOT_AUTHORIZED
          test "$(jq -r '.updater_activation' "$state")" = INACTIVE
          test "$(jq -r '.selection_state' "$selection")" = BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET
          test "$(jq -r '.selected_target' "$selection")" = null

      - name: Build deterministic Production operator kit
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          bash tools/production/build-production-operator-kit.sh "$head_sha"
          kit_id="production-operator-kit-${head_sha:0:12}"
          cp "dist/${kit_id}.zip" /tmp/s218-kit-first.zip
          cp "dist/${kit_id}.manifest.json" /tmp/s218-kit-first.manifest.json
          cp "dist/${kit_id}.zip.sha256" /tmp/s218-kit-first.sha256
          rm -rf dist
          bash tools/production/build-production-operator-kit.sh "$head_sha"
          cmp /tmp/s218-kit-first.zip "dist/${kit_id}.zip"
          diff -u /tmp/s218-kit-first.manifest.json "dist/${kit_id}.manifest.json"
          diff -u /tmp/s218-kit-first.sha256 "dist/${kit_id}.zip.sha256"
          test "$(jq -r '.production_release_reference.actions_artifact_id' "dist/${kit_id}.manifest.json")" = 10603358335
          test "$(jq -r '.staging_prerequisite_reference.actions_artifact_id' "dist/${kit_id}.manifest.json")" = 10603323419
          test "$(jq -r '.production_release_reference.source_commit' "dist/${kit_id}.manifest.json")" = "$(jq -r '.staging_prerequisite_reference.source_commit' "dist/${kit_id}.manifest.json")"
          test "$(jq -r '.secret_values_embedded' "dist/${kit_id}.manifest.json")" = false
          test "$(jq -r '.application_release_bytes_embedded' "dist/${kit_id}.manifest.json")" = false
          test "$(jq -r '.production_traffic_activation' "dist/${kit_id}.manifest.json")" = NOT_AUTHORIZED
          unzip -l "dist/${kit_id}.zip" > /tmp/s218-kit-list
          ! grep -Fq '/apps/web/' /tmp/s218-kit-list

      - name: Prepare synthetic exact Production artifact and same-source staging evidence
        id: fixture
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/s218"
          source='aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          release='production-aaaaaaaaaaaa'
          env_id='production-s218-ci'
          stage="$root/artifact-stage/$release"
          deployment="$root/production"
          release_root="$deployment/releases"
          shared_root="$deployment/shared"
          active="$deployment/current"
          document_root="$active/apps/web/public"
          private="$shared_root/private"
          previous="$release_root/production-previous000"

          mkdir -p "$stage/apps/web/public" "$stage/apps/web/vendor" "$stage/apps/web/bootstrap" "$stage/apps/web/database/migrations"
          mkdir -p "$release_root" "$shared_root" "$private" "$previous/apps/web/public"
          printf '<?php echo "oneQay";\n' > "$stage/apps/web/public/index.php"
          printf 'RewriteEngine On\n' > "$stage/apps/web/public/.htaccess"
          printf '<?php\n' > "$stage/apps/web/vendor/autoload.php"
          printf '<?php\n' > "$stage/apps/web/bootstrap/app.php"
          for i in $(seq -w 1 27); do printf '<?php\n' > "$stage/apps/web/database/migrations/0000_00_00_0000${i}_fixture.php"; done
          cat > "$stage/RELEASE.json" <<EOF
          {"payload_metadata_version":1,"product":"oneQay","release_id":"$release","environment":"PRODUCTION","required_runtime_class":"production","production":true,"production_data_allowed":true,"source_commit":"$source","application_tree_sha":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb","business_runtime_activation_ready":false,"dark_deploy_health_endpoint":"/health/live","migration_source_included":true,"migration_count":27,"latest_migration":"0000_00_00_000027_create_pos_shift_close_evidence_foundation.php","migration_execution_state":"NOT_PERFORMED_BY_ARTIFACT_BUILD","migration_execution_authorized":false,"deployment_authority":"NOT_GRANTED","environment_deployment":"NOT_PERFORMED","production_traffic_activation":"NOT_AUTHORIZED","production_activation":"NOT_AUTHORIZED","updater_activation":"INACTIVE","target_selection":"NOT_PERFORMED","selected_target":null,"producer_dispatch":"NOT_PERFORMED","attribution":"Lab | zefry"}
          EOF

          mkdir -p "$root"
          tar --sort=name --mtime='@1' --owner=0 --group=0 --numeric-owner -C "$root/artifact-stage" -cf - "$release" | gzip -n > "$root/$release.tar.gz"
          artifact_sha="$(sha256sum "$root/$release.tar.gz" | awk '{print $1}')"
          artifact_size="$(wc -c < "$root/$release.tar.gz" | tr -d '[:space:]')"

          cat > "$root/manifest.json" <<EOF
          {"manifest_version":1,"schema_id":"oneqay.production-release-manifest.v1","product":{"name":"oneQay","repository":"labzefry/oneQay"},"release":{"id":"$release","channel":"PRODUCTION_CANDIDATE","environment":"PRODUCTION","production":true,"production_data_allowed":true},"source":{"commit_sha":"$source","application_tree_sha":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"},"build":{"provider":"GITHUB_ACTIONS_OR_EQUIVALENT_TRUSTED_CI","source_date_epoch":1,"provenance_reference":"sprint218-ci"},"artifact":{"filename":"$release.tar.gz","format":"tar.gz","media_type":"application/gzip","size_bytes":$artifact_size,"sha256":"$artifact_sha"},"runtime":{"required_runtime_class":"production","business_runtime_activation_ready":false,"dark_deploy_health_endpoint":"/health/live","php_constraint":"^8.2","build_php":"8.3","build_node":"24.19.0","runtime_build_tools_required":false},"migration":{"source_included":true,"expected_count":27,"latest_migration":"0000_00_00_000027_create_pos_shift_close_evidence_foundation.php","execution_state":"NOT_PERFORMED_BY_ARTIFACT_BUILD","execution_authorized":false},"promotion_gate":{"verified_durable_staging_evidence_required":true,"same_source_commit_required":true,"production_traffic_activation_authorized":false},"operational_boundary":{"environment_deployment":"NOT_PERFORMED","migration27_execution":"NOT_PERFORMED","permission_provisioning":"NONE","feature_activation":"INACTIVE","deployment_authority":"NOT_GRANTED","technical_preview_activation":"NOT_AUTHORIZED","production_activation":"NOT_AUTHORIZED","updater_activation":"INACTIVE","target_selection":"NOT_PERFORMED","selected_target":null,"producer_dispatch":"NOT_PERFORMED"},"attribution":"Lab | zefry"}
          EOF

          cat > "$root/staging-evidence.json" <<EOF
          {"schema_version":1,"product":"oneQay","evidence_state":"DEPLOYED_VERIFIED_NOT_SELECTED","environment_id":"staging-s218-ci","runtime_class":"durable-staging","release_id":"durable-staging-aaaaaaaaaaaa","source_commit":"$source","artifact_sha256":"cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc","deployment_plan_fingerprint":"dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd","deployment_authority_id":"durable-staging-deployment-authority-111111111111111111111111","deployment_authority_sha256":"eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee","deployment_request_id":"durable-staging-deployment-request-222222222222222222222222","deployment_request_sha256":"ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff","verification":{"preflight_passed":true,"previous_active_release_preserved":true,"immutable_release_extracted":true,"public_document_root_verified":true,"external_runtime_configuration_bound":true,"provenance_readback_verified":true,"configuration_read_before_write_verified":true,"configuration_read_after_write_verified":true,"non_mutating_health_attestation_verified":true,"rollback_path_verified":true},"runtime_readback":{"environment_id":"staging-s218-ci","runtime_class":"durable-staging","exact_running_source_commit":"$source","exact_running_artifact_sha256":"cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc","durable_staging_runtime_enabled":true,"production_data_allowed":false},"secrets_embedded":false,"attribution":"Lab | zefry"}
          EOF

          cat > "$private/bindings.json" <<EOF
          {"ONEQAY_PRODUCTION_ATTESTATION_TOKEN":"sprint218-private-attestation-token-0123456789abcdef","ONEQAY_PRODUCTION_ENVIRONMENT_ID":"$env_id","ONEQAY_RUNNING_ARTIFACT_SHA256":"$artifact_sha","ONEQAY_RUNNING_SOURCE_COMMIT":"$source","ONEQAY_RUNTIME_CLASS":"production"}
          EOF
          chmod 0600 "$private/bindings.json"

          cat > "$private/runtime.env" <<EOF
          APP_NAME=oneQay
          APP_ENV=production
          APP_DEBUG=false
          APP_KEY=base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
          ONEQAY_RUNTIME_CLASS=production
          EOF
          chmod 0600 "$private/runtime.env"

          cat > "$root/target-input.json" <<EOF
          {"schema_version":1,"target_class":"OPERATOR_MANAGED_FILESYSTEM","execution_channel":"PHP_CLI","environment_id":"$env_id","runtime_class":"production","production":true,"production_data_allowed":true,"isolated_environment":true,"release_binding":{"release_id":"$release","source_commit":"$source","artifact_sha256":"$artifact_sha"},"filesystem":{"deployment_root":"$deployment","release_root":"$release_root","shared_runtime_root":"$shared_root","active_release_pointer":"$active","document_root":"$document_root"},"health":{"url":"https://production.example.invalid/health/live","path":"/health/live"},"operator_assertions":{"durable_database_persistence":true,"durable_session":true,"authorization":true,"transaction_durability":true,"pos_durability":true,"authenticated_configuration_channel":true,"read_before_write":true,"read_after_write":true,"non_mutating_health_attestation":true,"verified_rollback":true},"attribution":"Lab | zefry"}
          EOF

          ln -s "$previous" "$active"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "artifact_sha=$artifact_sha" >> "$GITHUB_OUTPUT"
          echo "active=$active" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

      - name: Build target request authority and exact plan through real tools
        shell: bash
        env:
          ROOT: ${{ steps.fixture.outputs.root }}
        run: |
          set -euo pipefail
          php tools/inspect-production-operator-target.php "$ROOT/target-input.json" "$ROOT/production/shared/private/bindings.json" "$ROOT/target-profile.json"
          test "$(jq -r '.profile_state' "$ROOT/target-profile.json")" = PRODUCTION_OPERATOR_TARGET_PROFILE_OBSERVED

          php tools/prepare-production-operator-target-candidate.php "$ROOT/target-profile.json" "$ROOT/target-candidate.json"
          test "$(jq -r '.target_state' "$ROOT/target-candidate.json")" = PRODUCTION_TARGET_CANDIDATE

          php tools/prepare-production-deployment-authority-request.php "$ROOT/manifest.json" "$ROOT/production-aaaaaaaaaaaa.tar.gz" "$ROOT/staging-evidence.json" "$ROOT/target-candidate.json" "$ROOT/request.json"
          test "$(jq -r '.request_state' "$ROOT/request.json")" = PRODUCTION_DEPLOYMENT_AUTHORITY_REQUEST_PENDING_APPROVAL
          test "$(jq -r '.production_traffic_activation_authorized' "$ROOT/request.json")" = false

          request_id="$(jq -r '.request_id' "$ROOT/request.json")"
          request_sha="$(sha256sum "$ROOT/request.json" | awk '{print $1}')"
          target_sha="$(jq -r '.target_descriptor_sha256' "$ROOT/request.json")"
          artifact_sha="$(jq -r '.artifact_sha256' "$ROOT/request.json")"
          release_id="$(jq -r '.release_id' "$ROOT/request.json")"
          env_id="$(jq -r '.environment_id' "$ROOT/request.json")"
          now="$(date +%s)"
          from="$((now-5))"
          expires="$((now+600))"
          cat > "$ROOT/authority.json" <<EOF
          {"schema_version":1,"authority_state":"GRANTED_FOR_EXACT_PRODUCTION_DEPLOYMENT_NOT_TRAFFIC_ACTIVATION","authority_id":"production-deployment-authority-111111111111111111111111","request_id":"$request_id","request_sha256":"$request_sha","environment_id":"$env_id","target_descriptor_sha256":"$target_sha","release_id":"$release_id","artifact_sha256":"$artifact_sha","authorized_at_unix":$from,"expires_at_unix":$expires,"approval_token":"sprint218-production-deployment-approval-token-0123456789abcdef","deployment_allowed":true,"production_allowed":true,"migration_execution_allowed":false,"production_traffic_activation_allowed":false,"target_selection_allowed":false,"producer_dispatch_allowed":false,"attribution":"Lab | zefry"}
          EOF
          chmod 0600 "$ROOT/authority.json"

          php tools/qualify-production-deployment-authority.php "$ROOT/request.json" "$ROOT/authority.json" "$ROOT/authority-binding.json"
          test "$(jq -r '.binding_state' "$ROOT/authority-binding.json")" = EXTERNAL_PRODUCTION_DEPLOYMENT_AUTHORITY_QUALIFIED_NOT_EXECUTED

          php tools/prepare-production-deployment-plan.php "$ROOT/manifest.json" "$ROOT/request.json" "$ROOT/authority-binding.json" "$ROOT/target-candidate.json" "$ROOT/plan.json"
          test "$(jq -r '.plan_state' "$ROOT/plan.json")" = QUALIFIED_FOR_PRODUCTION_DEPLOYMENT_NOT_EXECUTED_NOT_ACTIVATED
          test "$(jq -r '.traffic_activation.state' "$ROOT/plan.json")" = NOT_AUTHORIZED
          test "$(jq -r '.migration.execution_authorized' "$ROOT/plan.json")" = false

      - name: Prove post-mutation failure restores previous active release
        shell: bash
        env:
          ROOT: ${{ steps.fixture.outputs.root }}
          ACTIVE: ${{ steps.fixture.outputs.active }}
          PREVIOUS: ${{ steps.fixture.outputs.previous }}
        run: |
          set -euo pipefail
          cat > "$ROOT/fail-exec.php" <<'PHP'
          <?php
          require getcwd().'/tools/execute-production-dark-deployment.php';
          try {
              prodExecExecute(
                  getenv('ROOT').'/plan.json',
                  getenv('ROOT').'/target-profile.json',
                  getenv('ROOT').'/production-aaaaaaaaaaaa.tar.gz',
                  getenv('ROOT').'/production/shared/private/bindings.json',
                  getenv('ROOT').'/production/shared/private/runtime.env',
                  getenv('ROOT').'/failed-evidence.json',
                  static fn (string $url): array => ['status'=>'wrong','service'=>'oneqay-web','correlation_id'=>'s218-fail'],
              );
              exit(2);
          } catch (ProductionDarkDeploymentExecutionException $failure) {
              if ($failure->getMessage() !== 'health_status_invalid') exit(3);
          }
          PHP
          ROOT="$ROOT" php "$ROOT/fail-exec.php"
          test "$(realpath "$ACTIVE")" = "$(realpath "$PREVIOUS")"
          test ! -e "$ROOT/failed-evidence.json"
          rm -rf "$ROOT/production/releases/production-aaaaaaaaaaaa"

      - name: Execute successful dark deployment and qualify evidence
        shell: bash
        env:
          ROOT: ${{ steps.fixture.outputs.root }}
          ACTIVE: ${{ steps.fixture.outputs.active }}
        run: |
          set -euo pipefail
          cat > "$ROOT/success-exec.php" <<'PHP'
          <?php
          require getcwd().'/tools/execute-production-dark-deployment.php';
          $evidence=prodExecExecute(
              getenv('ROOT').'/plan.json',
              getenv('ROOT').'/target-profile.json',
              getenv('ROOT').'/production-aaaaaaaaaaaa.tar.gz',
              getenv('ROOT').'/production/shared/private/bindings.json',
              getenv('ROOT').'/production/shared/private/runtime.env',
              getenv('ROOT').'/evidence-candidate.json',
              static fn (string $url): array => ['status'=>'ok','service'=>'oneqay-web','correlation_id'=>'s218-success'],
          );
          if (($evidence['evidence_state'] ?? null) !== 'PRODUCTION_DEPLOYMENT_EVIDENCE_CANDIDATE') exit(4);
          PHP
          ROOT="$ROOT" php "$ROOT/success-exec.php"
          test "$(realpath "$ACTIVE")" = "$(realpath "$ROOT/production/releases/production-aaaaaaaaaaaa")"
          test "$(jq -r '.verification.rollback_path_verified' "$ROOT/evidence-candidate.json")" = true
          test "$(jq -r '.verification.candidate_restored_after_rollback_rehearsal' "$ROOT/evidence-candidate.json")" = true
          test "$(jq -r '.runtime_readback.business_runtime_activation_ready' "$ROOT/evidence-candidate.json")" = false
          test "$(jq -r '.runtime_readback.production_traffic_active' "$ROOT/evidence-candidate.json")" = false

          php tools/qualify-production-deployment-evidence.php "$ROOT/plan.json" "$ROOT/evidence-candidate.json" "$ROOT/qualified-evidence.json"
          test "$(jq -r '.evidence_state' "$ROOT/qualified-evidence.json")" = PRODUCTION_DEPLOYED_VERIFIED_NOT_ACTIVATED
          test "$(jq -r '.operational_boundary.migration27_execution' "$ROOT/qualified-evidence.json")" = NOT_PERFORMED
          test "$(jq -r '.operational_boundary.production_activation' "$ROOT/qualified-evidence.json")" = NOT_AUTHORIZED
          test "$(jq -r '.operational_boundary.selected_target' "$ROOT/qualified-evidence.json")" = null
          test "$(jq -r '.operational_boundary.producer_dispatch' "$ROOT/qualified-evidence.json")" = NOT_PERFORMED

      - name: Prove no automatic activation side effects
        shell: bash
        run: |
          set -euo pipefail
          for file in tools/execute-production-dark-deployment.php tools/production/build-production-operator-kit.sh .github/workflows/production-operator-kit-publication.yml; do
            ! grep -Fq 'php artisan migrate' "$file"
            ! grep -E '(^|[[:space:]])(ssh|scp|rsync|kubectl)([[:space:]]|$)' "$file"
          done

      - name: Prove application source remains untouched
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- apps/web)"

      - name: Confirm tracked source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          git diff --exit-code
          test -z "$(git status --porcelain)"
