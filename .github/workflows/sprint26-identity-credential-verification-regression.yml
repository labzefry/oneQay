name: Sprint 26 Identity Credential Verification Regression

# Attribution: Lab | zefry

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/app/Application/Identity/FirstPartyIdentityCredentialVerifier.php'
      - 'apps/web/app/Application/Identity/VerifyFirstPartyIdentityCredential.php'
      - 'apps/web/app/Infrastructure/Identity/LaravelFirstPartyIdentityCredentialVerifier.php'
      - 'apps/web/app/Delivery/Http/Identity/**'
      - 'apps/web/app/Delivery/Http/Middleware/RequirePolicyAdministrationSessionContextMiddleware.php'
      - 'apps/web/app/Providers/AppServiceProvider.php'
      - 'apps/web/routes/web.php'
      - 'apps/web/database/migrations/0000_00_00_000007_create_identity_password_credentials.php'
      - 'apps/web/tests/first-party-session-establishment.php'
      - 'apps/web/tests/identity-credential-verification.php'
      - '.github/workflows/sprint26-identity-credential-verification-regression.yml'
      - '.github/workflows/sprint27-first-party-session-establishment-regression.yml'
      - 'docs/FIRST_PARTY_IDENTITY_CREDENTIAL_VERIFICATION_FOUNDATION.md'
      - 'docs/FIRST_PARTY_LOGIN_SESSION_ESTABLISHMENT_FOUNDATION.md'
      - 'apps/web/tests/authorization-persistence.php'
      - 'apps/web/tests/authorization-administration-persistence.php'
      - 'apps/web/tests/initial-tenant-administrator-provisioning.php'
      - 'apps/web/tests/protected-control-administrator-lifecycle.php'
      - 'apps/web/tests/tenant-isolation.php'
      - 'apps/web/tests/identity-org-context.php'
      - 'apps/web/tests/policy-administration-delivery.php'
      - '.github/workflows/m7-2-tenant-isolation-regression.yml'
      - '.github/workflows/m7-3-identity-org-context-regression.yml'
      - '.github/workflows/m7-4a-technical-preview-interaction-regression.yml'
      - '.github/workflows/m7-5-preview-db-qualification-regression.yml'
      - '.github/workflows/sprint21-role-permission-policy-regression.yml'
      - '.github/workflows/sprint22-policy-administration-regression.yml'
      - '.github/workflows/sprint23-initial-tenant-admin-provisioning-regression.yml'
      - '.github/workflows/sprint24-protected-control-admin-lifecycle-regression.yml'
      - '.github/workflows/sprint25-policy-administration-delivery-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint26-identity-credential-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sprint26-identity-credential-verification-regression:
    name: sprint26-identity-credential-verification-regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      SESSION_DRIVER: array
      CACHE_STORE: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce exact Sprint 27 source envelope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/sprint27-files.txt
          test -s /tmp/sprint27-files.txt
          while IFS= read -r file; do
            case "$file" in
              apps/web/app/Delivery/Http/Identity/FirstPartySessionKeys.php|\
              apps/web/app/Delivery/Http/Identity/FirstPartySessionController.php|\
              apps/web/app/Delivery/Http/Middleware/RequirePolicyAdministrationSessionContextMiddleware.php|\
              apps/web/routes/web.php|\
              apps/web/tests/first-party-session-establishment.php|\
              .github/workflows/sprint27-first-party-session-establishment-regression.yml|\
              docs/FIRST_PARTY_LOGIN_SESSION_ESTABLISHMENT_FOUNDATION.md|\
              .github/workflows/m7-2-tenant-isolation-regression.yml|\
              .github/workflows/m7-3-identity-org-context-regression.yml|\
              .github/workflows/m7-4a-technical-preview-interaction-regression.yml|\
              .github/workflows/m7-5-preview-db-qualification-regression.yml|\
              .github/workflows/sprint21-role-permission-policy-regression.yml|\
              .github/workflows/sprint22-policy-administration-regression.yml|\
              .github/workflows/sprint23-initial-tenant-admin-provisioning-regression.yml|\
              .github/workflows/sprint24-protected-control-admin-lifecycle-regression.yml|\
              .github/workflows/sprint25-policy-administration-delivery-regression.yml|\
              .github/workflows/sprint26-identity-credential-verification-regression.yml)
                ;;
              *) echo "Unauthorized Sprint 27 changed path: $file" >&2; exit 1 ;;
            esac
          done < /tmp/sprint27-files.txt
          test "$(wc -l < /tmp/sprint27-files.txt)" -eq 17
          if grep -Eq '(^|/)(composer\.(json|lock)|package(-lock)?\.json)$' /tmp/sprint27-files.txt; then
            echo 'Sprint 27 authorizes zero dependency manifest or lock changes.' >&2; exit 1
          fi
          git diff --exit-code "origin/${{ github.base_ref }}...HEAD" -- apps/web/database/migrations

      - name: Preserve root Platform Foundation regression
        run: |
          composer validate --strict --no-check-publish
          composer test

      - name: Install locked application dependencies
        working-directory: apps/web
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find apps/web/app apps/web/bootstrap apps/web/config apps/web/database apps/web/public apps/web/routes apps/web/tests -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do php -l "$file"; done

      - name: Enforce exact seven-migration set
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t migrations < <(find apps/web/database/migrations -maxdepth 1 -type f -name '*.php' -printf '%f\n' | sort)
          expected=(
            '0000_00_00_000001_create_foundational_context_graph.php'
            '0000_00_00_000002_create_organizational_access_grants.php'
            '0000_00_00_000003_create_scoped_role_permission_policy.php'
            '0000_00_00_000004_create_policy_mutation_journal.php'
            '0000_00_00_000005_create_initial_tenant_administrator_provisioning_journal.php'
            '0000_00_00_000006_create_protected_control_administrator_mutation_journal.php'
            '0000_00_00_000007_create_identity_password_credentials.php'
          )
          test "${migrations[*]}" = "${expected[*]}"

      - name: Enforce Application credential boundary
        shell: bash
        run: |
          set -euo pipefail
          files=(
            apps/web/app/Application/Identity/FirstPartyIdentityCredentialVerifier.php
            apps/web/app/Application/Identity/VerifyFirstPartyIdentityCredential.php
          )
          if grep -n -E 'Illuminate\\|Schema::|DB::|new PDO|mysqli_|ConnectionInterface|Query\\' "${files[@]}"; then
            echo 'Sprint 26 Application credential source gained framework/database mechanics.' >&2; exit 1
          fi
          grep -Fq '#[\SensitiveParameter]' apps/web/app/Application/Identity/FirstPartyIdentityCredentialVerifier.php
          grep -Fq '#[\SensitiveParameter]' apps/web/app/Application/Identity/VerifyFirstPartyIdentityCredential.php
          grep -Fq 'MAX_PASSWORD_BYTES = 4096' apps/web/app/Application/Identity/VerifyFirstPartyIdentityCredential.php

      - name: Enforce migration seven schema contract
        shell: bash
        run: |
          set -euo pipefail
          migration='apps/web/database/migrations/0000_00_00_000007_create_identity_password_credentials.php'
          grep -Fq "Schema::create('oneqay_identity_password_credentials'" "$migration"
          grep -Fq "string('tenant_id', 64)" "$migration"
          grep -Fq "string('identity_id', 96)" "$migration"
          grep -Fq "string('password_hash', 255)" "$migration"
          grep -Fq "primary(['tenant_id', 'identity_id'], 'pk_identity_password_credentials')" "$migration"
          grep -Fq "['tenant_id', 'identity_id']" "$migration"
          grep -Fq "references(['tenant_id', 'id'])" "$migration"
          grep -Fq "on('oneqay_identities')" "$migration"
          grep -Fq 'Forward-only generated migration; rollback is not authorized.' "$migration"

      - name: Enforce read-only tenant-scoped verifier and anti-enumeration boundary
        shell: bash
        run: |
          set -euo pipefail
          verifier='apps/web/app/Infrastructure/Identity/LaravelFirstPartyIdentityCredentialVerifier.php'
          test "$(grep -Fc -- "->where('tenant_id'," "$verifier")" -eq 1
          test "$(grep -Fc -- "->where('identity_id'," "$verifier")" -eq 1
          grep -Fq 'password_verify(' "$verifier"
          grep -Fq 'DUMMY_HASH' "$verifier"
          grep -Fq "['local', 'test', 'ci']" "$verifier"
          if grep -Eq '\b(insert|insertOrIgnore|update|updateOrInsert|upsert|delete|truncate)\s*\(' "$verifier"; then
            echo 'Sprint 26 credential verifier gained write mechanics.' >&2; exit 1
          fi
          if grep -Fq 'password_hash(' "$verifier"; then
            echo 'Sprint 26 production verifier gained password writer behavior.' >&2; exit 1
          fi
          if grep -Ei '\b(log|logger|debug|info|warning|error)\s*\(' "$verifier"; then
            echo 'Sprint 26 credential verifier gained logging mechanics.' >&2; exit 1
          fi

      - name: Preserve provider runtime persistence and credential separation
        shell: bash
        run: |
          set -euo pipefail
          provider='apps/web/app/Providers/AppServiceProvider.php'
          grep -Fq 'FirstPartyIdentityCredentialVerifier::class' "$provider"
          grep -Fq 'LaravelFirstPartyIdentityCredentialVerifier' "$provider"
          grep -Fq "database.oneqay_persistence_enabled" "$provider"
          grep -Fq "oneqay.runtime_class" "$provider"
          grep -Fq 'ONEQAY_PERSISTENCE_ENABLED=false' apps/web/environment.example
          if grep -R -n -E 'FirstPartyIdentityCredentialVerifier|VerifyFirstPartyIdentityCredential|LaravelFirstPartyIdentityCredentialVerifier' apps/web/app/Application/Preview apps/web/app/Delivery/Preview; then
            echo 'Sprint 26 credential verifier was wired into Preview delivery.' >&2; exit 1
          fi
          if grep -R -n -E 'password_(change|reset)|forgot.password|remember.me|register|oauth|oidc|saml|webauthn|passkey|totp' \
            apps/web/app/Application/Identity/FirstPartyIdentityCredentialVerifier.php \
            apps/web/app/Application/Identity/VerifyFirstPartyIdentityCredential.php \
            apps/web/app/Infrastructure/Identity/LaravelFirstPartyIdentityCredentialVerifier.php; then
            echo 'Sprint 26 credential source gained unauthorized credential lifecycle behavior.' >&2; exit 1
          fi
          controller='apps/web/app/Delivery/Http/Identity/FirstPartySessionController.php'
          grep -Fq 'VerifyFirstPartyIdentityCredential' "$controller"
          if grep -n -E 'password_(verify|hash)\s*\(|->table\(' "$controller"; then
            echo 'Sprint 27 duplicated Sprint 26 credential mechanics.' >&2; exit 1
          fi

      - name: Preserve Technical Preview Production and updater separation
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '/apps/web/database/migrations/' .github/workflows/m7-5-preview-release-artifact.yml
          grep -Fq 'NO_SCHEMA_CHANGE' .github/workflows/m7-5-preview-release-artifact.yml
          grep -Fq 'php tests/privileged-update-security.php' .github/workflows/sprint22-policy-administration-regression.yml
          if grep -R -n -E 'ONEQAY_PERSISTENCE_ENABLED=true|runtime_class.*production.*credential|credential.*runtime_class.*production' apps/web/environment.example apps/web/config apps/web/app/Infrastructure/Identity; then
            echo 'Sprint 27 weakened Production or persistence default boundary.' >&2; exit 1
          fi
          if grep -R -n -E 'FirstPartySessionController|FirstPartySessionKeys' apps/web/app/Application/Preview apps/web/app/Delivery/Preview; then
            echo 'Sprint 27 first-party session source entered Technical Preview.' >&2; exit 1
          fi

      - name: Run Sprint 26 disposable credential regression
        working-directory: apps/web
        run: php tests/identity-credential-verification.php

      - name: Preserve Sprint 21 through Sprint 27 regressions
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          composer test
          php -r 'require "vendor/autoload.php"; $app=require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Http\Kernel::class)->bootstrap(); $assert=static function(bool $c,string $m):void{if(!$c)throw new RuntimeException($m);}; require "tests/authorization-persistence.php"; require "tests/authorization-administration-persistence.php"; require "tests/initial-tenant-administrator-provisioning.php"; require "tests/protected-control-administrator-lifecycle.php";'
          php tests/tenant-isolation.php
          php tests/identity-org-context.php
          php tests/policy-administration-delivery.php
          php tests/privileged-update-security.php
          php tests/first-party-session-establishment.php

      - name: Preserve tracked source
        run: git diff --exit-code
