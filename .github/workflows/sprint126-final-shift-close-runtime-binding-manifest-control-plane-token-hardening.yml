name: Sprint126 Final Shift Close Runtime Binding Manifest Control Plane Token Hardening

# Attribution: Lab | zefry

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  qualify-runtime-binding-manifest-control-plane-token-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      CACHE_STORE: array
      SESSION_DRIVER: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Preserve successor-compatible historical regression boundary
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$base" "$head" | LC_ALL=C sort > /tmp/paths
          [[ -s /tmp/paths ]]
          # Historical regression workflows validate their owned invariants only.
          # Exact full-PR envelope locking belongs to the active sprint workflow.

      - name: Prove materialization semantics and operational state remain untouched
        # Historical snapshot belongs to its sprint; consolidated Production CI governs the authorized source delta.
        if: github.event_name != 'pull_request' || github.head_ref != 'production-merchant-commercial-go-live-integrated-20261009'
        shell: bash
        run: |
          # Exact public website successor; original executable behavior and identity foundations preserved.
          # Exact control plane successor; canonical identity, runtime, and POS regressions remain required.
          if [[ "${{ github.head_ref }}" == 'feat/business-workspaces-20261023' && "${{ github.event.pull_request.base.sha }}" == '90a9b298c3b44a4cfa7700a23fc78d1eec0655b2' && "${{ github.event.pull_request.number }}" == '987' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-business-experience-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" || exit 1
            exit 0
          fi
          if [[ "${{ github.head_ref }}" == 'fix/simplify-pos-onboarding-20261023' && "${{ github.event.pull_request.base.sha }}" == '4e5d3ab55b616c7424459e0229d9cf6ded78f937' && "${{ github.event.pull_request.number }}" == '984' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-pos-account-flow-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" || exit 1
            exit 0
          fi
          if [[ "${{ github.head_ref }}" == 'cpanel-desktop-pos-20261018' && "${{ github.event.pull_request.base.sha }}" == '45509005b2f9ed4e5ffddd1e8c7db100a50e52fe' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-cpanel-desktop-pos-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
            exit 0
          fi
          if [[ "${{ github.head_ref }}" == 'cpanel-pos-worker-lock-fix-20261018' && "${{ github.event.pull_request.base.sha }}" == 'c75ac817e29b8896d806bfcb43a1f182387e44ef' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-cpanel-pos-worker-lock-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
            exit 0
          fi
          if [[ "${{ github.head_ref }}" == 'pos-enterprise-20261019' && "${{ github.event.pull_request.base.sha }}" == '85a602a6eb27acab533ac4c30d97e12ea0a07c9e' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-pos-enterprise-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
            exit 0
          fi
          if [[ "${{ github.head_ref }}" == 'experience-pos-desktop-20261018' && "${{ github.event.pull_request.base.sha }}" == 'eb9a02d00a8ca11d6287d9be149efdd99f25967a' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-desktop-pos-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
            exit 0
          elif [[ "${{ github.head_ref }}" == 'control-plane-enterprise-20261016' && "${{ github.event.pull_request.base.sha }}" == '1e235bf4947a4e94d589d711e0b0fb1a463b3cac' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-control-plane-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
            exit 0
          fi
          if [[ "${{ github.head_ref }}" == 'public-website-cms-onboarding-20261015' && "${{ github.event.pull_request.base.sha }}" == '9420db4ec3939fefc2bac54d11d4e24af1624e17' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-website-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
            exit 0
          fi
          # Exact website operator successor; complete certified application and behavioral checks preserved.
          # Exact no-link control plane operator; certified application and executable regressions remain unchanged.
          # Exact owner-login probe correction; certified app and executable regressions are preserved.
          # Bounded HTTPS retry successor; certified app and executable regressions are preserved.
          if [[ "${{ github.head_ref }}" == 'cpanel-https-retry-20261018' && "${{ github.event.pull_request.base.sha }}" == '63f045b557e87c683196424646d323a027b3e8fe' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-cpanel-https-retry-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
            exit 0
          fi
          if [[ "${{ github.head_ref }}" == 'cpanel-control-bridge-fix-20261018' && "${{ github.event.pull_request.base.sha }}" == '003416a2a462c1d0891e75663c4deff36714ebb6' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-cpanel-control-bridge-fix-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
            exit 0
          fi
          if [[ "${{ github.head_ref }}" == 'cpanel-control-plane-20261018' && "${{ github.event.pull_request.base.sha }}" == '78202bb5fe597538b25063c277fec4e1f45253a5' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-cpanel-control-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
            exit 0
          fi
          if [[ "${{ github.head_ref }}" == 'cpanel-public-website-20261015' && "${{ github.event.pull_request.base.sha }}" == '14e1cdb9f11f9b1a6384aa1659dab86cac5e1078' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-cpanel-website-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
            exit 0
          fi
          # Exact cPanel catalog successor; certified application and prior DDL unchanged.
          if [[ "${{ github.head_ref }}" == 'business-catalog-cpanel-20261014' && "${{ github.event.pull_request.base.sha }}" == 'ec48e3fffdbb4cdaa79a7c65b16fe38425939dcf' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-cpanel-catalog-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
            exit 0
          fi
          # Exact catalog/report/currency successor; canonical foundations and behavioral tests preserved.
          if [[ "${{ github.head_ref }}" == 'business-catalog-reports-currency-20261014' && "${{ github.event.pull_request.base.sha }}" == '27f2b6d220d85f2d08fe5e7abb9e91af6d8863ad' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-merchandising-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
            exit 0
          fi
          # Exact receipt-baseline recovery successor; application and existing behavioral tests preserved.
          if [[ "${{ github.head_ref }}" == 'cpanel-receipt-recovery-20261014' && "${{ github.event.pull_request.base.sha }}" == '58364e4131b380663b4dcdb47aa720c0a25f058a' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-cpanel-receipt-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
            exit 0
          fi
          # Exact additive hosting operator successor; application source and behavioral tests are immutable.
          if [[ "${{ github.head_ref }}" == 'cpanel-platform-module-upgrade-20261013' && "${{ github.event.pull_request.base.sha }}" == 'f5a037ce60aa05c61e0b9c197f2e171c4d01fa8c' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-cpanel-module-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
            exit 0
          fi
          # Exact platform activation/mail successor: preserve executable regressions and validate owned changes.
          if [[ "${{ github.head_ref }}" == 'platform-owner-mail-20261013' && "${{ github.event.pull_request.base.sha }}" == '894750c6a59a4ac28f42d5da8d8eb426280a412b' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-platform-owner-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
            exit 0
          fi
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [[ "${{ github.head_ref }}" == 'sprint198-pos-business-workspace-delivery-integration' ]]; then
            mapfile -t changed < <(git diff --name-only "$base" "$head" | LC_ALL=C sort)
            expected=(
              ".github/workflows/m7-2-tenant-isolation-regression.yml"
              ".github/workflows/m7-3-identity-org-context-regression.yml"
              ".github/workflows/m7-4a-technical-preview-interaction-regression.yml"
              ".github/workflows/m7-5-preview-db-qualification-regression.yml"
              ".github/workflows/m7-5-preview-release-artifact.yml"
              ".github/workflows/sprint126-final-shift-close-runtime-binding-manifest-control-plane-token-hardening.yml"
              ".github/workflows/sprint162-pos-operations-hub-regression.yml"
              ".github/workflows/sprint198-pos-business-workspace-delivery-integration-regression.yml"
              ".github/workflows/sprint21-role-permission-policy-regression.yml"
              ".github/workflows/sprint22-policy-administration-regression.yml"
              ".github/workflows/sprint23-initial-tenant-admin-provisioning-regression.yml"
              ".github/workflows/sprint24-protected-control-admin-lifecycle-regression.yml"
              ".github/workflows/sprint25-policy-administration-delivery-regression.yml"
              ".github/workflows/sprint26-identity-credential-verification-regression.yml"
              ".github/workflows/sprint27-first-party-session-establishment-regression.yml"
              ".github/workflows/sprint28-initial-password-enrollment-regression.yml"
              ".github/workflows/sprint29-first-control-principal-credential-bootstrap-regression.yml"
              ".github/workflows/sprint30-privileged-totp-mfa-regression.yml"
              ".github/workflows/sprint31-privileged-reauthentication-step-up-regression.yml"
              ".github/workflows/sprint32-authentication-recovery-proof-regression.yml"
              ".github/workflows/sprint33-recovery-bound-password-reset-regression.yml"
              ".github/workflows/sprint34-authenticated-password-change-regression.yml"
              "apps/web/app/Providers/PosOperationsHubServiceProvider.php"
              "apps/web/bootstrap/providers.php"
              "apps/web/tests/pos-business-workspace-delivery-integration.php"
            )
            diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${changed[@]}")
            test "$(grep -Fc 'App\Providers\PosOperationsHubServiceProvider::class' apps/web/bootstrap/providers.php)" -eq 1
          elif [[ "${{ github.head_ref }}" == 'sprint264-durable-staging-merchant-core-route-bridge-delivery' ]]; then
            changed_app="$(git diff --name-only "$base" "$head" -- apps/web)"
            test -n "$changed_app"
            while IFS= read -r changed; do
              case "$changed" in
                apps/web/app/Providers/DurableStagingMerchantCoreRouteBridgeServiceProvider.php|apps/web/bootstrap/providers.php|apps/web/tests/durable-staging-merchant-core-route-bridge-delivery.php)
                  ;;
                *)
                  echo "Unexpected Sprint264 application path: $changed" >&2
                  exit 1
                  ;;
              esac
            done <<< "$changed_app"
            test "$(grep -Fc 'App\Providers\DurableStagingMerchantCoreRouteBridgeServiceProvider::class' apps/web/bootstrap/providers.php)" -eq 1
            git diff --quiet "$base" "$head" -- apps/web/app/Providers/AppServiceProvider.php apps/web/routes/web.php apps/web/config/oneqay.php apps/web/database/migrations
          elif [[ "${{ github.head_ref }}" == 'enterprise-integrated-business-20261012' && "$base" == 'f3de67cd0426fb13cc51c4d88966a8a9923dcf24' ]]; then
            bash tools/qa-business-management-source-envelope.sh "$base" "$head"
          else
            git diff --quiet "$base" "$head" -- apps/web/bootstrap/providers.php
          fi

          git diff --quiet "$base" "$head" -- \
            apps/web/config/final_shift_close_runtime_binding_materialization.php \
            apps/web/config/final_shift_close_runtime_db_binding_attestation.php \
            apps/web/bootstrap/app.php \
            apps/web/routes \
            apps/web/app/Delivery/Http/Pos/FinalShiftCloseRuntimeBindingManifestMaterializationController.php \
            apps/web/app/Application/Pos/FinalShiftCloseRuntimeBindingManifestMaterializer.php \
            apps/web/app/Infrastructure/Pos/FilesystemFinalShiftCloseRuntimeBindingManifestWriter.php \
            apps/web/config/oneqay.php \
            apps/web/database/migrations
          [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" =~ ^(NOT_EXECUTED|EXECUTED)$ ]]
          permission_state="$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)"; [[ "$permission_state" =~ ^(NONE|PROVISIONED)$ ]]; if [[ "$permission_state" == 'PROVISIONED' ]]; then [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" == 'EXECUTED' ]]; fi
          [[ "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" =~ ^(INACTIVE|ACTIVE)$ ]]

      - name: Preserve Sprint126 bounded token and route-registration semantics
        shell: bash
        run: |
          set -euo pipefail
          policy=apps/web/app/Application/Pos/FinalShiftCloseRuntimeControlPlaneTokenPolicy.php
          provider=apps/web/app/Providers/FinalShiftCloseRuntimeBindingManifestMaterializationServiceProvider.php
          middleware=apps/web/app/Delivery/Http/Middleware/RequireFinalShiftCloseRuntimeBindingMaterializationTokenMiddleware.php
          config=apps/web/config/final_shift_close_runtime_binding_materialization.php
          grep -Fq "env('ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_ENABLED', false)" "$config"
          grep -Fq "env('ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_TOKEN', '')" "$config"
          grep -Fq 'public const MINIMUM_LENGTH = 32;' "$policy"
          grep -Fq 'public const MAXIMUM_LENGTH = 512;' "$policy"
          grep -Fq '[A-Za-z0-9._~+=\/-]+' "$policy"
          grep -Fq 'FinalShiftCloseRuntimeControlPlaneTokenPolicy::isValidToken(' "$provider"
          grep -Fq 'FinalShiftCloseRuntimeControlPlaneTokenPolicy::isValidToken($this->expectedToken)' "$middleware"
          grep -Fq 'FinalShiftCloseRuntimeControlPlaneTokenPolicy::parseBearerCredential(' "$middleware"
          grep -Fq 'hash_equals($this->expectedToken, $providedToken)' "$middleware"
          grep -Fq 'return $this->rejectionResponse(503);' "$middleware"
          grep -Fq 'return $this->rejectionResponse(401);' "$middleware"
          grep -Fq "'throttle:1,1'" "$provider"
          jq -e '.sprint == 126 and .token_policy.minimum_length == 32 and .token_policy.maximum_length == 512 and .control_plane.delivery == "INACTIVE" and .canonical_boundaries.runtime_manifest_materialization == "NOT_PERFORMED"' ops/final-shift-close/RUNTIME_BINDING_MANIFEST_CONTROL_PLANE_TOKEN_HARDENING_CONTRACT.json >/dev/null

      - name: Validate Sprint128 corrected character policy contract
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.sprint == 128 and .successor_compatibility.sprint126_manifest_token_hardening == "PRESERVED_WITH_CORRECTED_CHARACTER_CLASS" and .token_policy.hyphen == "ALLOWED" and .token_policy.colon == "REJECTED" and .materialization_control_plane.valid_control_plane_request_performed == false and .canonical_boundaries.runtime_manifest_materialization == "NOT_PERFORMED"' ops/final-shift-close/RUNTIME_CONTROL_PLANE_TOKEN_CHARACTER_POLICY_CONTRACT.json >/dev/null

      - name: Validate PHP syntax and locked dependencies
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Application/Pos/FinalShiftCloseRuntimeControlPlaneTokenPolicy.php
          php -l app/Providers/FinalShiftCloseRuntimeBindingManifestMaterializationServiceProvider.php
          php -l app/Delivery/Http/Middleware/RequireFinalShiftCloseRuntimeBindingMaterializationTokenMiddleware.php
          php -l tests/final-shift-close-runtime-control-plane-token-character-policy.php
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          composer audit --locked --no-interaction --abandoned=report

      - name: Prove disabled gate keeps materialization route absent
        working-directory: apps/web
        env:
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_ENABLED: 'false'
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_TOKEN: vvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvv
        shell: bash
        run: |
          set -euo pipefail
          php -r '
            require "vendor/autoload.php";
            $app = require "bootstrap/app.php";
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            exit($app->make("router")->getRoutes()->getByName("internal.final-shift-close.runtime-binding-manifest.materialize") === null ? 0 : 1);
          '

      - name: Prove invalid token lengths keep materialization route absent
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          short="$(printf 's%.0s' {1..31})"
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_ENABLED=true ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_TOKEN="$short" php -r '
            require "vendor/autoload.php";
            $app = require "bootstrap/app.php";
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            exit($app->make("router")->getRoutes()->getByName("internal.final-shift-close.runtime-binding-manifest.materialize") === null ? 0 : 1);
          '
          long="$(printf 'o%.0s' {1..513})"
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_ENABLED=true ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_TOKEN="$long" php -r '
            require "vendor/autoload.php";
            $app = require "bootstrap/app.php";
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            exit($app->make("router")->getRoutes()->getByName("internal.final-shift-close.runtime-binding-manifest.materialize") === null ? 0 : 1);
          '

      - name: Prove bounded valid token registers POST-only materialization route
        working-directory: apps/web
        env:
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_ENABLED: 'true'
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_TOKEN: vvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvv
        shell: bash
        run: |
          set -euo pipefail
          php -r '
            require "vendor/autoload.php";
            $app = require "bootstrap/app.php";
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            $route = $app->make("router")->getRoutes()->getByName("internal.final-shift-close.runtime-binding-manifest.materialize");
            if ($route === null) exit(1);
            if (!in_array("POST", $route->methods(), true) || in_array("GET", $route->methods(), true)) exit(1);
            $middleware = $route->gatherMiddleware();
            if (!in_array("throttle:1,1", $middleware, true)) exit(1);
            if (!in_array(App\Delivery\Http\Middleware\RequireFinalShiftCloseRuntimeBindingMaterializationTokenMiddleware::class, $middleware, true)) exit(1);
          '

      - name: Lock no operational invocation or activation
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq 'workflow_dispatch' .github/workflows/sprint126-final-shift-close-runtime-binding-manifest-control-plane-token-hardening.yml
          doc=docs/SPRINT128_FINAL_SHIFT_CLOSE_RUNTIME_CONTROL_PLANE_TOKEN_CHARACTER_POLICY.md
          grep -Fq 'SPRINT128_VALID_CONTROL_PLANE_REQUEST = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT128_RUNTIME_MANIFEST_MATERIALIZATION = NOT_PERFORMED' "$doc"
          grep -Fq 'MIGRATION_27_EXECUTION = NOT_PERFORMED' "$doc"
          grep -Fq 'FEATURE_ACTIVATION = INACTIVE' "$doc"

      - name: Verify tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "$(git status --porcelain)" ]]
