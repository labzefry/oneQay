            bash tools/qa-cpanel-website-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
            exit 0
          fi
          # Exact cPanel catalog successor; certified application and prior DDL unchanged.
          if [[ "${{ github.head_ref }}" == 'business-catalog-cpanel-20261014' && "${{ github.event.pull_request.base.sha }}" == 'ec48e3fffdbb4cdaa79a7c65b16fe38425939dcf' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
