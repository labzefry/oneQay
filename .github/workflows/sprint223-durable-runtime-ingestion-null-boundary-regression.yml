          if [[ "${{ github.head_ref }}" == 'platform-owner-mail-20261013' && "${{ github.event.pull_request.base.sha }}" == '894750c6a59a4ac28f42d5da8d8eb426280a412b' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-platform-owner-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
