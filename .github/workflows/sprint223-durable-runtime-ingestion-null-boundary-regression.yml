            elif [ "$HEAD_REF" = 'sprint240-durable-staging-runtime-promotion-successor' ]; then
              git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- apps/web | grep -v '^apps/web/tests/' | LC_ALL=C sort > /tmp/s240-app-paths
              printf '%s\n' \
                'apps/web/app/Application/Pos/FinalShiftCloseDurableStagingDeliveryGate.php' \
                'apps/web/app/Providers/FinalShiftCloseDurableStagingDeliveryServiceProvider.php' \
