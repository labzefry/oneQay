# Author by Lab | zefry
name: Sprint208 Durable Staging Deployment Authority Binding Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint208-durable-staging-deployment-authority-binding-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify-sprint208-durable-staging-deployment-authority-binding:
    name: qualify-sprint208-durable-staging-deployment-authority-binding
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact Sprint208 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Qualify exact Sprint208 engineering envelope
        if: github.event_name == 'pull_request' && github.head_ref == 'sprint208-durable-staging-deployment-authority-binding-foundation'
        shell: bash
        env:
          EXPECTED_PATH_HASH: 5852e772a37b334987cdf5bcca0327a4e1b90d18a6affa02d6a9c3f44b6bf616
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          mapfile -t paths < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | LC_ALL=C sort)
          expected=(
            ".github/workflows/sprint207-durable-staging-operator-deployment-plan-regression.yml"
            ".github/workflows/sprint208-durable-staging-deployment-authority-binding-regression.yml"
            "DEPLOYMENT.md"
            "ops/final-shift-close/DURABLE_STAGING_DEPLOYMENT_AUTHORITY_BINDING_CONTRACT.json"
            "tools/deployment/durable-staging-deployment-authority-request.schema.json"
            "tools/deployment/durable-staging-deployment-authority.schema.json"
            "tools/deployment/durable-staging-operator-deployment-plan.schema.json"
            "tools/deployment/durable-staging-operator-target-candidate.schema.json"
            "tools/deployment/durable-staging-operator-target.schema.json"
            "tools/prepare-durable-staging-deployment-authority-request.php"
            "tools/prepare-durable-staging-operator-deployment-plan.php"
            "tools/qualify-durable-staging-deployment-authority.php"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${paths[@]}")
          test "$(printf '%s\n' "${paths[@]}" | sha256sum | awk '{print $1}')" = "$EXPECTED_PATH_HASH"

      - name: Preserve canonical operational NO-GO
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" =~ ^(NOT_EXECUTED|EXECUTED)$ ]]
          permission_state="$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)"; [[ "$permission_state" =~ ^(NONE|PROVISIONED)$ ]]; if [[ "$permission_state" == 'PROVISIONED' ]]; then [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" == 'EXECUTED' ]]; fi
          test "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" = INACTIVE || test "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" = ACTIVE
          test "$(jq -r '.deployment_authority' ops/final-shift-close/STATE.json)" = NOT_GRANTED
          test "$(jq -r '.technical_preview_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
          test "$(jq -r '.production_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
          test "$(jq -r '.updater_activation' ops/final-shift-close/STATE.json)" = INACTIVE
          test "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = SELECTED_NOT_AUTHORIZED
          test "$(jq -r '.selected_target.environment_id' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = 'oneqay-durable-staging-01'
          test "$(jq -r '.selected_target.runtime_class' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = 'durable-staging'
          test "$(jq -r '.selected_target.selection_fingerprint_sha256' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = '858280ea3575317e8d88eed7009c770530097e261c391b2869fa81ad7c8546ce'

      - name: Setup governed PHP runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate Sprint208 source contracts
        shell: bash
        run: |
          set -euo pipefail
          php -l tools/prepare-durable-staging-deployment-authority-request.php
          php -l tools/qualify-durable-staging-deployment-authority.php
          php -l tools/prepare-durable-staging-operator-deployment-plan.php
          jq -e '.contract_state == "SOURCE_READY_AUTHORITY_BINDING_ONLY_NOT_DEPLOYED"' ops/final-shift-close/DURABLE_STAGING_DEPLOYMENT_AUTHORITY_BINDING_CONTRACT.json
          jq -e '.authority_policy.maximum_lifetime_seconds == 900' ops/final-shift-close/DURABLE_STAGING_DEPLOYMENT_AUTHORITY_BINDING_CONTRACT.json
          jq -e '.authority_policy.approval_token_required == true' ops/final-shift-close/DURABLE_STAGING_DEPLOYMENT_AUTHORITY_BINDING_CONTRACT.json
          jq -e '.authority_policy.migration_execution_allowed == false' ops/final-shift-close/DURABLE_STAGING_DEPLOYMENT_AUTHORITY_BINDING_CONTRACT.json
          jq -e '.properties.target_state.const == "OPERATOR_TARGET_CANDIDATE"' tools/deployment/durable-staging-operator-target-candidate.schema.json
          jq -e '.properties.request_state.const == "DURABLE_STAGING_DEPLOYMENT_AUTHORITY_REQUEST_PENDING_APPROVAL"' tools/deployment/durable-staging-deployment-authority-request.schema.json
          jq -e '.properties.authority_state.const == "GRANTED"' tools/deployment/durable-staging-deployment-authority.schema.json
          jq -e '.properties.deployment_authority.properties.request_id.pattern != null' tools/deployment/durable-staging-operator-target.schema.json
          jq -e '.properties.authority_binding.properties.expires_at_unix.minimum == 1' tools/deployment/durable-staging-operator-deployment-plan.schema.json

      - name: Prepare exact-head authority fixtures
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          release_id="durable-staging-${HEAD_SHA:0:12}"
          artifact_sha="$(printf 'artifact:%s' "$HEAD_SHA" | sha256sum | awk '{print $1}')"
          manifest_sha="$(printf 'manifest:%s' "$HEAD_SHA" | sha256sum | awk '{print $1}')"

          jq -n \
            --arg release "$release_id" \
            --arg source "$HEAD_SHA" \
            --arg artifact "$artifact_sha" \
            --arg manifest "$manifest_sha" \
            '{
              schema_version:1,
              handoff_state:"VALIDATED_FOR_EXTERNAL_DEPLOYMENT_NOT_AUTHORIZED",
              product:{name:"oneQay",repository:"labzefry/oneQay"},
              artifact:{release_id:$release,source_commit:$source,artifact_filename:($release+".tar.gz"),artifact_sha256:$artifact,artifact_size_bytes:123,manifest_sha256:$manifest},
              runtime:{release_channel:"STAGING",release_environment:"DURABLE_STAGING",required_runtime_class:"durable-staging",production:false,production_data_allowed:false,synthetic_fixture_runtime:false,environment_values_embedded:false},
              migration:{source_included:true,expected_count:27,latest_migration:"0000_00_00_000027_create_pos_shift_close_evidence_foundation.php",execution_state:"NOT_PERFORMED",execution_authorized:false},
              deployment:{execution_state:"NOT_PERFORMED",archive_extraction_state:"NOT_PERFORMED",runtime_configuration_mutation_state:"NOT_PERFORMED",active_release_pointer_mutation_state:"NOT_PERFORMED",authority_state:"NOT_GRANTED"},
              required_external_bindings:["ONEQAY_RUNTIME_CLASS","ONEQAY_RUNNING_SOURCE_COMMIT","ONEQAY_RUNNING_ARTIFACT_SHA256","ONEQAY_DURABLE_RUNTIME_ENVIRONMENT_ID","ONEQAY_DURABLE_RUNTIME_ATTESTATION_TOKEN","ONEQAY_DURABLE_STAGING_RUNTIME_ENABLED"],
              operational_boundary:{environment_creation:"NOT_PERFORMED",environment_deployment:"NOT_PERFORMED",migration27_execution:"NOT_PERFORMED",permission_provisioning:"NONE",feature_activation:"INACTIVE",technical_preview_activation:"NOT_AUTHORIZED",production_activation:"NOT_AUTHORIZED",updater_activation:"INACTIVE",target_selection:"BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET",selected_target:null,producer_dispatch:"NOT_PERFORMED"},
              attribution:"Lab | zefry"
            }' > /tmp/sprint208-handoff.json

          jq -n '{
            schema_version:1,
            target_state:"OPERATOR_TARGET_CANDIDATE",
            environment_id:"durable-staging-ci-01",
            runtime_class:"durable-staging",
            production:false,
            production_data_allowed:false,
            synthetic_fixture_runtime:false,
            filesystem:{deployment_root:"/srv/oneqay",release_root:"/srv/oneqay/releases",shared_runtime_root:"/srv/oneqay/shared/runtime",active_release_pointer:"/srv/oneqay/active-release.json"},
            capabilities:{durable_database_persistence:true,durable_session:true,authorization:true,transaction_durability:true,pos_durability:true,authenticated_configuration_channel:true,read_before_write:true,read_after_write:true,non_mutating_health_attestation:true,verified_rollback:true},
            configuration:{secret_values_embedded:false,required_binding_presence:{ONEQAY_RUNTIME_CLASS:true,ONEQAY_RUNNING_SOURCE_COMMIT:true,ONEQAY_RUNNING_ARTIFACT_SHA256:true,ONEQAY_DURABLE_RUNTIME_ENVIRONMENT_ID:true,ONEQAY_DURABLE_RUNTIME_ATTESTATION_TOKEN:true,ONEQAY_DURABLE_STAGING_RUNTIME_ENABLED:true}},
            attribution:"Lab | zefry"
          }' > /tmp/sprint208-candidate.json

      - name: Prepare deterministic deployment authority request
        shell: bash
        run: |
          set -euo pipefail
          php tools/prepare-durable-staging-deployment-authority-request.php /tmp/sprint208-handoff.json /tmp/sprint208-candidate.json /tmp/sprint208-request-1.json
          php tools/prepare-durable-staging-deployment-authority-request.php /tmp/sprint208-handoff.json /tmp/sprint208-candidate.json /tmp/sprint208-request-2.json
          diff -u /tmp/sprint208-request-1.json /tmp/sprint208-request-2.json
          test "$(stat -c '%a' /tmp/sprint208-request-1.json)" = 600
          jq -e '.request_state == "DURABLE_STAGING_DEPLOYMENT_AUTHORITY_REQUEST_PENDING_APPROVAL"' /tmp/sprint208-request-1.json
          jq -e '.required_authority.state == "NOT_GRANTED"' /tmp/sprint208-request-1.json
          jq -e '.required_authority.approval_token_required == true' /tmp/sprint208-request-1.json
          jq -e '.migration_execution_authorized == false and .production_authorized == false and .target_selection_authorized == false and .producer_dispatch_authorized == false' /tmp/sprint208-request-1.json

      - name: Qualify exact short-lived deployment authority
        shell: bash
        run: |
          set -euo pipefail
          request_id="$(jq -r '.request_id' /tmp/sprint208-request-1.json)"
          request_sha="$(sha256sum /tmp/sprint208-request-1.json | awk '{print $1}')"
          release_id="$(jq -r '.release_id' /tmp/sprint208-request-1.json)"
          source_commit="$(jq -r '.source_commit' /tmp/sprint208-request-1.json)"
          artifact_sha="$(jq -r '.artifact_sha256' /tmp/sprint208-request-1.json)"
          target_sha="$(jq -r '.target_descriptor_sha256' /tmp/sprint208-request-1.json)"
          token='sprint208-ci-approval-token-0123456789abcdef'
          token_sha="$(printf '%s' "$token" | sha256sum | awk '{print $1}')"
          now_unix="$(date +%s)"
          authorized_at="$((now_unix - 10))"
          expires_at="$((now_unix + 600))"

          jq -n \
            --arg request_id "$request_id" \
            --arg request_sha "$request_sha" \
            --arg release "$release_id" \
            --arg source "$source_commit" \
            --arg artifact "$artifact_sha" \
            --arg target "$target_sha" \
            --arg token "$token_sha" \
            --argjson authorized "$authorized_at" \
            --argjson expires "$expires_at" \
            '{
              schema_version:1,
              product:"oneQay",
              authority_id:"durable-staging-deployment-authority-0123456789abcdef01234567",
              authority_state:"GRANTED",
              scope:"DEPLOY_EXACT_DURABLE_STAGING_ARTIFACT_TO_EXACT_NON_PRODUCTION_TARGET",
              request_id:$request_id,
              request_sha256:$request_sha,
              release_id:$release,
              source_commit:$source,
              artifact_sha256:$artifact,
              environment_id:"durable-staging-ci-01",
              target_descriptor_sha256:$target,
              approval_token_sha256:$token,
              authorized_at_unix:$authorized,
              expires_at_unix:$expires,
              deployment_allowed:true,
              migration_execution_allowed:false,
              production_allowed:false,
              technical_preview_activation_allowed:false,
              updater_activation_allowed:false,
              target_selection_allowed:false,
              producer_dispatch_allowed:false,
              attribution:"Lab | zefry"
            }' > /tmp/sprint208-authority.json

          printf '%s' "$token" | php tools/qualify-durable-staging-deployment-authority.php \
            /tmp/sprint208-handoff.json /tmp/sprint208-candidate.json /tmp/sprint208-request-1.json /tmp/sprint208-authority.json "$now_unix" /tmp/sprint208-target.json

          test "$(stat -c '%a' /tmp/sprint208-target.json)" = 600
          jq -e '.target_state == "OPERATOR_TARGET_DECLARED"' /tmp/sprint208-target.json
          jq -e '.deployment_authority.state == "EXTERNALLY_GRANTED_FOR_EXACT_TARGET"' /tmp/sprint208-target.json
          jq -e '.deployment_authority.request_id == $request' --arg request "$request_id" /tmp/sprint208-target.json
          jq -e '.deployment_authority.request_sha256 == $request' --arg request "$request_sha" /tmp/sprint208-target.json
          jq -e '.deployment_authority.target_descriptor_sha256 == $target' --arg target "$target_sha" /tmp/sprint208-target.json

          php tools/prepare-durable-staging-operator-deployment-plan.php /tmp/sprint208-handoff.json /tmp/sprint208-target.json /tmp/sprint208-plan.json
          jq -e '.authority_binding.request_id == $request' --arg request "$request_id" /tmp/sprint208-plan.json
          jq -e '.authority_binding.expires_at_unix == $expires' --argjson expires "$expires_at" /tmp/sprint208-plan.json
          jq -e '.operational_boundary.environment_deployment == "NOT_PERFORMED"' /tmp/sprint208-plan.json

      - name: Fail closed on authority and target drift
        shell: bash
        run: |
          set -euo pipefail
          token='sprint208-ci-approval-token-0123456789abcdef'
          now_unix="$(date +%s)"

          if printf '%s' 'wrong-approval-token-0123456789abcdef' | php tools/qualify-durable-staging-deployment-authority.php \
            /tmp/sprint208-handoff.json /tmp/sprint208-candidate.json /tmp/sprint208-request-1.json /tmp/sprint208-authority.json "$now_unix" /tmp/should-not-exist.json; then
            echo "Accepted wrong approval token." >&2
            exit 1
          fi

          jq '.expires_at_unix = .authorized_at_unix + 1' /tmp/sprint208-authority.json > /tmp/sprint208-expired-authority.json
          if printf '%s' "$token" | php tools/qualify-durable-staging-deployment-authority.php \
            /tmp/sprint208-handoff.json /tmp/sprint208-candidate.json /tmp/sprint208-request-1.json /tmp/sprint208-expired-authority.json "$now_unix" /tmp/should-not-exist.json; then
            echo "Accepted expired authority." >&2
            exit 1
          fi

          jq '.migration_execution_allowed = true' /tmp/sprint208-authority.json > /tmp/sprint208-migration-authority.json
          if printf '%s' "$token" | php tools/qualify-durable-staging-deployment-authority.php \
            /tmp/sprint208-handoff.json /tmp/sprint208-candidate.json /tmp/sprint208-request-1.json /tmp/sprint208-migration-authority.json "$now_unix" /tmp/should-not-exist.json; then
            echo "Accepted migration authority widening." >&2
            exit 1
          fi

          jq '.production = true' /tmp/sprint208-candidate.json > /tmp/sprint208-production-candidate.json
          if php tools/prepare-durable-staging-deployment-authority-request.php \
            /tmp/sprint208-handoff.json /tmp/sprint208-production-candidate.json /tmp/should-not-exist.json; then
            echo "Accepted Production target candidate." >&2
            exit 1
          fi

          jq '.filesystem.release_root = "/srv/oneqay/../escape"' /tmp/sprint208-candidate.json > /tmp/sprint208-unsafe-candidate.json
          if php tools/prepare-durable-staging-deployment-authority-request.php \
            /tmp/sprint208-handoff.json /tmp/sprint208-unsafe-candidate.json /tmp/should-not-exist.json; then
            echo "Accepted unsafe target candidate." >&2
            exit 1
          fi

          jq '.deployment_authority.expires_at_unix = (.deployment_authority.authorized_at_unix + 1)' /tmp/sprint208-target.json > /tmp/sprint208-expired-target.json
          sleep 2
          if php tools/prepare-durable-staging-operator-deployment-plan.php \
            /tmp/sprint208-handoff.json /tmp/sprint208-expired-target.json /tmp/should-not-exist.json; then
            echo "Planner accepted expired authority." >&2
            exit 1
          fi

      - name: Prove authority path is non-operational
        shell: bash
        run: |
          set -euo pipefail
          files=(
            tools/prepare-durable-staging-deployment-authority-request.php
            tools/qualify-durable-staging-deployment-authority.php
            tools/prepare-durable-staging-operator-deployment-plan.php
          )
          ! grep -Eq 'Artisan::call|php artisan migrate|migrate --force|PDO\(|mysqli_|curl_exec|ssh |scp |rsync |tar -x|system\(|shell_exec\(|proc_open\(' "${files[@]}"
          ! grep -Eq 'SystemUpdateActivationCoordinator|FilesystemSystemUpdateActiveReleasePointerStore' "${files[@]}"
          jq -e '.canonical_boundaries.environment_deployment == "NOT_PERFORMED"' ops/final-shift-close/DURABLE_STAGING_DEPLOYMENT_AUTHORITY_BINDING_CONTRACT.json
          jq -e '.canonical_boundaries.migration27_execution == "NOT_PERFORMED"' ops/final-shift-close/DURABLE_STAGING_DEPLOYMENT_AUTHORITY_BINDING_CONTRACT.json
          jq -e '.canonical_boundaries.selected_target == null' ops/final-shift-close/DURABLE_STAGING_DEPLOYMENT_AUTHORITY_BINDING_CONTRACT.json

      - name: Preserve Preview and Sprint207 boundaries
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.contract_state == "SOURCE_READY_PLAN_PREPARATION_ONLY_NOT_DEPLOYED"' ops/final-shift-close/DURABLE_STAGING_OPERATOR_DEPLOYMENT_PLAN_CONTRACT.json
          jq -e '.authority_binding.migration_execution_allowed == false' ops/final-shift-close/DURABLE_STAGING_OPERATOR_DEPLOYMENT_PLAN_CONTRACT.json
          grep -Fq "/\\Am75-preview-[0-9a-f]{12}\\z/" apps/web/app/Application/SystemUpdate/SystemUpdateReleaseIdentity.php
          ! grep -Fq "durable-staging" apps/web/app/Application/SystemUpdate/SystemUpdateReleaseIdentity.php

      - name: Confirm attribution and tracked source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Author by Lab | zefry' tools/prepare-durable-staging-deployment-authority-request.php
          grep -Fq 'Author by Lab | zefry' tools/qualify-durable-staging-deployment-authority.php
          ! grep -R -E 'ChatGPT|OpenAI|Copilot|Gemini' \
            tools/prepare-durable-staging-deployment-authority-request.php \
            tools/qualify-durable-staging-deployment-authority.php \
            tools/deployment/durable-staging-deployment-authority-request.schema.json \
            tools/deployment/durable-staging-deployment-authority.schema.json \
            ops/final-shift-close/DURABLE_STAGING_DEPLOYMENT_AUTHORITY_BINDING_CONTRACT.json
          git diff --exit-code
          test -z "$(git status --porcelain)"
