name: Sprint154 Final Shift Close Feature Activation Executor Source Foundation Regression

# Attribution: Lab | zefry
# Historical engineering envelope SHA-256: 5dcf1fcd0b638ed9ec3d311947055a2b2c96c74d8e8fb5b74ff1f1b96bd1296f

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sprint154-final-shift-close-feature-activation-executor-source-foundation-regression.yml'
      - 'apps/web/app/Application/Pos/FinalShiftCloseFeatureActivationExecutionPlan.php'
      - 'apps/web/tests/pos-final-shift-close-feature-activation-execution-plan.php'
      - 'docs/SPRINT154_FINAL_SHIFT_CLOSE_FEATURE_ACTIVATION_EXECUTOR_SOURCE_FOUNDATION.md'
      - 'ops/final-shift-close/FEATURE_ACTIVATION_EXECUTOR_SOURCE_FOUNDATION_CONTRACT.json'
      - 'ops/final-shift-close/POST_SELECTION_DOWNSTREAM_READINESS.json'

permissions:
  contents: read

concurrency:
  group: sprint154-feature-activation-executor-source-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preserve-feature-activation-executor-source-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      CACHE_STORE: array
      SESSION_DRIVER: array
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Preserve Sprint154 machine-readable contract
        shell: bash
        run: |
          set -euo pipefail
          file=ops/final-shift-close/FEATURE_ACTIVATION_EXECUTOR_SOURCE_FOUNDATION_CONTRACT.json
          jq -e '
            .schema_version == 1 and
            .feature == "final-shift-close" and
            .sprint == 154 and
            .contract_state == "MATERIALIZED_SOURCE_ONLY" and
            .bounded_objective == "FINAL_SHIFT_CLOSE_FEATURE_ACTIVATION_EXECUTOR_SOURCE_FOUNDATION" and
            .source_envelope.path_count == 7 and
            .source_envelope.sha256 == "5dcf1fcd0b638ed9ec3d311947055a2b2c96c74d8e8fb5b74ff1f1b96bd1296f" and
            .canonical_boundaries.activation_executor_source_foundation == "MATERIALIZED_SOURCE_ONLY" and
            .canonical_boundaries.dispatchable_feature_activation_executor == "NOT_IMPLEMENTED" and
            .canonical_boundaries.configuration_mutation_transport == "NOT_IMPLEMENTED" and
            .canonical_boundaries.executor_dispatch == "NOT_PERFORMED" and
            .canonical_boundaries.runtime_allowlist_change == "NOT_IMPLEMENTED" and
            .canonical_boundaries.feature_activation == "INACTIVE" and
            .attribution == "Author by Lab | zefry"
          ' "$file" >/dev/null

      - name: Preserve executable Sprint154 regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          composer audit --locked --no-interaction --abandoned=report
          php -l app/Application/Pos/FinalShiftCloseFeatureActivationExecutionPlan.php
          php -l tests/pos-final-shift-close-feature-activation-execution-plan.php
          php tests/pos-final-shift-close-feature-activation-execution-plan.php

      - name: Preserve downstream and operational NO-GO
        shell: bash
        run: |
          set -euo pipefail
          downstream=ops/final-shift-close/POST_SELECTION_DOWNSTREAM_READINESS.json
          state=ops/final-shift-close/STATE.json
          selection=ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json
          provider=apps/web/app/Providers/FinalShiftCloseServiceProvider.php
          jq -e '.sprint154_extension.activation_executor_source_foundation == "MATERIALIZED_SOURCE_ONLY" and .sprint154_extension.dispatchable_feature_activation_executor == "NOT_IMPLEMENTED" and .sprint154_extension.configuration_mutation_transport == "NOT_IMPLEMENTED" and .sprint154_extension.executor_dispatch == "NOT_PERFORMED" and .canonical_boundaries.feature_activation == "INACTIVE"' "$downstream" >/dev/null
          jq -e '.migration27.state == "NOT_EXECUTED" and .permission_provisioning.state == "NONE" and .feature_activation.state == "INACTIVE" and .deployment_authority == "NOT_GRANTED" and .technical_preview_activation == "NOT_AUTHORIZED" and .production_activation == "NOT_AUTHORIZED" and .updater_activation == "INACTIVE"' "$state" >/dev/null
          jq -e '.selection_state == "BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET" and .selected_target == null' "$selection" >/dev/null
          grep -Fq "['local', 'test', 'ci']" "$provider"

      - name: Preserve Sprint154 documentation and cleanliness
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'FINAL_SHIFT_CLOSE_FEATURE_ACTIVATION_EXECUTOR_SOURCE_FOUNDATION' docs/SPRINT154_FINAL_SHIFT_CLOSE_FEATURE_ACTIVATION_EXECUTOR_SOURCE_FOUNDATION.md
          grep -Fq 'Author by Lab | zefry' docs/SPRINT154_FINAL_SHIFT_CLOSE_FEATURE_ACTIVATION_EXECUTOR_SOURCE_FOUNDATION.md
          git diff --exit-code

# Author by Lab | zefry
