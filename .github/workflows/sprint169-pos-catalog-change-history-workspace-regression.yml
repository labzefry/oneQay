name: Sprint169 POS Catalog Change History Workspace Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint169-pos-catalog-change-history-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify-sprint169-pos-catalog-change-history:
    runs-on: ubuntu-latest
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      APP_DEBUG: "false"
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      SESSION_DRIVER: array
      CACHE_STORE: array
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Qualify exact Sprint169 engineering envelope
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_PATH_HASH: ac972d62801f4228896317743f786957eb4878a340847881ca782600b67c5459
          EXPECTED_PATH_COUNT: "14"
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" | LC_ALL=C sort > /tmp/s169-paths.txt
          test "$(wc -l < /tmp/s169-paths.txt | tr -d ' ')" = "$EXPECTED_PATH_COUNT"
          test "$(sha256sum /tmp/s169-paths.txt | awk '{print $1}')" = "$EXPECTED_PATH_HASH"
          cat > /tmp/s169-expected.txt <<'EOF'
          .github/workflows/sprint169-pos-catalog-change-history-workspace-regression.yml
          apps/web/app/Application/Pos/PosCatalogChangeHistoryWorkspaceRepository.php
          apps/web/app/Application/Pos/PosCatalogChangeHistoryWorkspaceSnapshot.php
          apps/web/app/Application/Pos/PosOperationsHubSnapshot.php
          apps/web/app/Application/Pos/ViewPosCatalogChangeHistoryWorkspace.php
          apps/web/app/Application/Pos/ViewPosOperationsHub.php
          apps/web/app/Delivery/Http/Pos/PosCatalogChangeHistoryWorkspaceController.php
          apps/web/app/Delivery/Http/Pos/PosOperationsHubController.php
          apps/web/app/Infrastructure/Pos/LaravelPosCatalogChangeHistoryWorkspaceRepository.php
          apps/web/app/Providers/PosCatalogChangeHistoryWorkspaceServiceProvider.php
          apps/web/app/Providers/PosOperationsHubServiceProvider.php
          apps/web/config/pos_catalog_change_history.php
          apps/web/resources/js/pages/Pos/CatalogChangeHistory.vue
          apps/web/tests/pos-catalog-change-history-workspace.php
          EOF
          sed -i 's/^          //' /tmp/s169-expected.txt
          diff -u /tmp/s169-expected.txt /tmp/s169-paths.txt

      - name: Preserve canonical owners outside Sprint169
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          BASE="origin/${{ github.base_ref }}"
          git diff --quiet "$BASE...HEAD" -- apps/web/app/Application/Authorization/PosPermission.php
          git diff --quiet "$BASE...HEAD" -- apps/web/app/Application/Pos/CatalogPreparationCommand.php
          git diff --quiet "$BASE...HEAD" -- apps/web/app/Application/Pos/CatalogPreparationRepository.php
          git diff --quiet "$BASE...HEAD" -- apps/web/app/Application/Pos/PrepareCatalogItem.php
          git diff --quiet "$BASE...HEAD" -- apps/web/app/Infrastructure/Pos/LaravelCatalogPreparationRepository.php
          git diff --quiet "$BASE...HEAD" -- apps/web/database/migrations/0000_00_00_000017_create_pos_catalog_preparation_journal.php
          git diff --quiet "$BASE...HEAD" -- apps/web/database/migrations apps/web/database/module-migrations
          git diff --quiet "$BASE...HEAD" -- apps/web/routes/web.php apps/web/bootstrap/providers.php
          git diff --quiet "$BASE...HEAD" -- apps/web/app/Providers/FinalShiftCloseServiceProvider.php
          git diff --quiet "$BASE...HEAD" -- ops/final-shift-close/STATE.json ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json ops/final-shift-close/POST_SELECTION_DOWNSTREAM_READINESS.json

      - name: Preserve operational NO-GO
        run: |
          set -euo pipefail
          test "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" = NOT_EXECUTED
          test "$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)" = NONE
          test "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" = INACTIVE
          test "$(jq -r '.deployment_authority' ops/final-shift-close/STATE.json)" = NOT_GRANTED
          test "$(jq -r '.technical_preview_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
          test "$(jq -r '.production_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
          test "$(jq -r '.updater_activation' ops/final-shift-close/STATE.json)" = INACTIVE
          test "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET
          test "$(jq -r '.selected_target' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = null
          test "$(jq -r '.contract_state' ops/final-shift-close/POST_SELECTION_DOWNSTREAM_READINESS.json)" = MATERIALIZED_SOURCE_ONLY

      - name: Preserve read-only catalog history contract
        run: |
          set -euo pipefail
          grep -Fq 'PosPermission::prepareCatalog()' apps/web/app/Application/Pos/ViewPosCatalogChangeHistoryWorkspace.php
          grep -Fq "oneqay_pos_catalog_preparation_journal" apps/web/app/Infrastructure/Pos/LaravelPosCatalogChangeHistoryWorkspaceRepository.php
          grep -Fq "organization_id" apps/web/app/Infrastructure/Pos/LaravelPosCatalogChangeHistoryWorkspaceRepository.php
          grep -Fq "outlet_id" apps/web/app/Infrastructure/Pos/LaravelPosCatalogChangeHistoryWorkspaceRepository.php
          ! grep -Fq "where('device_id'" apps/web/app/Infrastructure/Pos/LaravelPosCatalogChangeHistoryWorkspaceRepository.php
          ! grep -Eq -- '->(insert|update|delete|increment|decrement)\(' apps/web/app/Infrastructure/Pos/LaravelPosCatalogChangeHistoryWorkspaceRepository.php
          grep -Fq "ONEQAY_POS_CATALOG_CHANGE_HISTORY_ENABLED" apps/web/config/pos_catalog_change_history.php
          grep -Fq "PosCatalogChangeHistoryWorkspaceServiceProvider::class" apps/web/app/Providers/PosOperationsHubServiceProvider.php
          grep -Fq "pos.catalog.history" apps/web/app/Providers/PosCatalogChangeHistoryWorkspaceServiceProvider.php
          grep -Fq "pos.catalog.history" apps/web/app/Delivery/Http/Pos/PosOperationsHubController.php
          grep -Fq 'Route::has($routeName)' apps/web/app/Delivery/Http/Pos/PosOperationsHubController.php

      - name: Install PHP dependencies
        working-directory: apps/web
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist

      - name: Validate PHP syntax
        working-directory: apps/web
        run: |
          find app config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          cat /tmp/php-lint.log

      - name: Execute canonical and POS regressions
        working-directory: apps/web
        run: |
          composer test
          php tests/pos-operational-reporting.php
          php tests/pos-cashier-workspace.php
          php tests/pos-shift-start-workspace.php
          php tests/pos-sale-correction-workspace.php
          php tests/pos-sale-history-workspace.php
          php tests/pos-catalog-inventory-setup-workspace.php
          php tests/pos-operations-hub.php
          php tests/pos-cash-variance-reconciliation-workspace.php
          php tests/pos-inventory-replenishment-workspace.php
          php tests/pos-inventory-accountability-workspace.php
          php tests/pos-product-sales-performance-workspace.php
          php tests/pos-active-shift-performance-workspace.php
          php tests/pos-shift-history-performance-workspace.php
          php tests/pos-catalog-change-history-workspace.php

      - name: Setup exact Node LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.19.0

      - name: Type-check and build catalog history UI
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts --no-fund
          npm run type-check
          npm run build

      - name: Verify tracked-source cleanliness
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
