name: Sprint171 Installation Governed Release Artifact Readiness Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint171-installation-governed-release-artifact-readiness-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  preserve-sprint171-installation-governed-release-artifact-readiness:
    runs-on: ubuntu-latest
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      APP_DEBUG: "false"
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      SESSION_DRIVER: array
      CACHE_STORE: array
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checked-out head
        run: |
          set -euo pipefail
          EXPECTED_HEAD="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Qualify exact Sprint171 reconciliation envelope
        if: github.event_name == 'pull_request' && github.head_ref == 'sprint171-canonical-reconciliation-v2'
        env:
          EXPECTED_PATH_HASH: a8627a615280e7592638964a5d7f496f77310ef28f085439f2ba584d6a97d301
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git cat-file -e "${BASE_SHA}^{commit}"
          mapfile -t CHANGED < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | LC_ALL=C sort)
          EXPECTED=(
            '.github/workflows/sprint171-installation-governed-release-artifact-readiness-regression.yml'
            'CHANGELOG.md'
            'PROJECT_MANIFEST.md'
            'README.md'
            'ROADMAP.md'
            'TASKS.md'
          )
          test "${#CHANGED[@]}" -eq "${#EXPECTED[@]}"
          diff -u <(printf '%s\n' "${EXPECTED[@]}") <(printf '%s\n' "${CHANGED[@]}")
          ACTUAL_HASH="$(printf '%s\n' "${CHANGED[@]}" | sha256sum | awk '{print $1}')"
          test "$ACTUAL_HASH" = "$EXPECTED_PATH_HASH"

      - name: Preserve Sprint171 source contract
        run: |
          set -euo pipefail
          SOURCE=apps/web/app/Infrastructure/Installation/SecureInstallationReadiness.php
          TEST=apps/web/tests/secure-installation-readiness.php
          test -f "$SOURCE"
          test -f "$TEST"
          grep -Fq 'Author by Lab | zefry' "$SOURCE"
          grep -Fq 'REQUIRED_WRITABLE_PATHS' "$SOURCE"
          grep -Fq 'REQUIRED_RELEASE_MANIFEST_KEYS' "$SOURCE"
          grep -Fq "'release_manifest'" "$SOURCE"
          grep -Fq "'artifact_integrity'" "$SOURCE"
          grep -Fq 'NO_SCHEMA_CHANGE' "$SOURCE"
          grep -Fq 'labzefry/oneQay' "$SOURCE"
          grep -Fq 'Lab | zefry' "$SOURCE"
          grep -Fq 'hash_equals' "$SOURCE"
          ! grep -Eq -- '->(insert|update|delete|increment|decrement)\(' "$SOURCE"
          ! grep -Eq 'Artisan::call|migrate|file_put_contents|fwrite|unlink|rename|copy\(|chmod|chown|mkdir|rmdir' "$SOURCE"
          ! grep -Eq 'curl_exec|file_get_contents|fopen\(|PharData|ZipArchive|extractTo' "$SOURCE"

      - name: Preserve canonical engineering evidence
        run: |
          set -euo pipefail
          for doc in PROJECT_MANIFEST.md README.md CHANGELOG.md TASKS.md ROADMAP.md; do
            grep -Fq 'cbf26a53c1a784b8e6eda65cc1d047c90ea590e8' "$doc"
            grep -Fq 'cf2f56c6ba42404726fe225a559b7262580191a9bf1c8b03c4ebf39fe2f29d88' "$doc"
          done
          grep -Fq 'a8627a615280e7592638964a5d7f496f77310ef28f085439f2ba584d6a97d301' PROJECT_MANIFEST.md

      - name: Preserve operational NO-GO
        run: |
          set -euo pipefail
          test "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" = NOT_EXECUTED
          test "$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)" = NONE
          test "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" = INACTIVE
          test "$(jq -r '.deployment_authority' ops/final-shift-close/STATE.json)" = NOT_GRANTED
          test "$(jq -r '.technical_preview_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
          test "$(jq -r '.production_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
          test "$(jq -r '.updater_activation' ops/final-shift-close/STATE.json)" = INACTIVE
          test "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET
          test "$(jq -r '.selected_target' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = null

      - name: Install PHP dependencies
        working-directory: apps/web
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist

      - name: Validate and execute readiness regression
        working-directory: apps/web
        run: |
          php -l app/Infrastructure/Installation/SecureInstallationReadiness.php
          php -l tests/secure-installation-readiness.php
          php -d zend.assertions=1 -d assert.exception=1 tests/secure-installation-readiness.php
          composer test

      - name: Verify tracked-source cleanliness
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
