name: Sprint119 Final Shift Close Runtime DB Binding Attestation

# Attribution: Lab | zefry

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/sprint119-final-shift-close-runtime-db-binding-attestation.yml'
      - '.github/workflows/sprint128-final-shift-close-runtime-control-plane-token-character-policy.yml'
      - 'apps/web/app/Application/Pos/FinalShiftCloseRuntimeControlPlaneTokenPolicy.php'
      - 'apps/web/app/Application/Pos/FinalShiftCloseRuntimeDatabaseIdentity.php'
      - 'apps/web/app/Application/Pos/FinalShiftCloseRuntimeDatabaseIdentityReader.php'
      - 'apps/web/app/Application/Pos/FinalShiftCloseRuntimeDbBindingAttestation.php'
      - 'apps/web/app/Delivery/Http/Middleware/RequireFinalShiftCloseRuntimeBindingTokenMiddleware.php'
      - 'apps/web/app/Delivery/Http/Pos/FinalShiftCloseRuntimeDbBindingAttestationController.php'
      - 'apps/web/app/Infrastructure/Pos/LaravelFinalShiftCloseRuntimeDatabaseIdentityReader.php'
      - 'apps/web/app/Providers/FinalShiftCloseRuntimeDbBindingAttestationServiceProvider.php'
      - 'apps/web/routes/final-shift-close-runtime-db-binding-attestation.php'
      - 'apps/web/tests/final-shift-close-runtime-db-binding-attestation.php'
      - 'apps/web/tests/final-shift-close-runtime-control-plane-token-character-policy.php'
      - 'docs/SPRINT119_FINAL_SHIFT_CLOSE_RUNTIME_DB_BINDING_ATTESTATION.md'
      - 'docs/SPRINT128_FINAL_SHIFT_CLOSE_RUNTIME_CONTROL_PLANE_TOKEN_CHARACTER_POLICY.md'
      - 'ops/final-shift-close/RUNTIME_DB_BINDING_ATTESTATION_CONTRACT.json'
      - 'ops/final-shift-close/RUNTIME_CONTROL_PLANE_TOKEN_CHARACTER_POLICY_CONTRACT.json'

permissions:
  contents: read

concurrency:
  group: sprint119-final-shift-close-runtime-db-binding-attestation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify-runtime-db-binding-attestation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Preserve successor-compatible historical regression boundary
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$base" "$head" | LC_ALL=C sort > /tmp/paths
          [[ -s /tmp/paths ]]
          # Historical regression workflows validate their owned invariants only.
          # Exact full-PR envelope locking belongs to the active sprint workflow.

      - name: Prove historical DB attestation source and operational state remain bounded
        shell: bash
        run: |
          menu_verified_exclusions=()
          if [[ "${{ github.event_name }}" == 'pull_request' && "${{ github.event.pull_request.number }}" == '992' && "${{ github.head_ref }}" == 'feature/menu-membership-20261029' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            python3 tools/ci/verify-menu-successor.py --frozen-inputs || exit 1
            menu_verified_exclusions=(':(exclude)apps/web/bootstrap/app.php' ':(exclude)apps/web/composer.lock' ':(exclude)apps/web/package.json' ':(exclude)apps/web/package-lock.json')
          fi
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [[ "${{ github.head_ref }}" == 'feat/business-workspaces-20261023' && "${{ github.event.pull_request.base.sha }}" == '90a9b298c3b44a4cfa7700a23fc78d1eec0655b2' && "${{ github.event.pull_request.number }}" == '987' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-business-experience-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" || exit 1
            exit 0
          fi
          if [[ "${{ github.head_ref }}" == 'fix/simplify-pos-onboarding-20261023' && "${{ github.event.pull_request.base.sha }}" == '4e5d3ab55b616c7424459e0229d9cf6ded78f937' && "${{ github.event.pull_request.number }}" == '984' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-pos-account-flow-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" || exit 1
            exit 0
          fi
          if [[ "${{ github.head_ref }}" == 'cpanel-desktop-pos-20261018' && "${{ github.event.pull_request.base.sha }}" == '45509005b2f9ed4e5ffddd1e8c7db100a50e52fe' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-cpanel-desktop-pos-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
            exit 0
          fi
          if [[ "${{ github.head_ref }}" == 'cpanel-pos-worker-lock-fix-20261018' && "${{ github.event.pull_request.base.sha }}" == 'c75ac817e29b8896d806bfcb43a1f182387e44ef' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-cpanel-pos-worker-lock-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
            exit 0
          fi
          if [[ "${{ github.head_ref }}" == 'pos-enterprise-20261019' && "${{ github.event.pull_request.base.sha }}" == '85a602a6eb27acab533ac4c30d97e12ea0a07c9e' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-pos-enterprise-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
            exit 0
          fi
          if [[ "${{ github.head_ref }}" == 'experience-pos-desktop-20261018' && "${{ github.event.pull_request.base.sha }}" == 'eb9a02d00a8ca11d6287d9be149efdd99f25967a' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-desktop-pos-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.head_ref }}" == 'control-plane-enterprise-20261016' && "${{ github.event.pull_request.base.sha }}" == '1e235bf4947a4e94d589d711e0b0fb1a463b3cac' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-control-plane-source-envelope.sh "$base" "$head"
          else
          git diff --quiet "$base" "$head" -- \
            apps/web/app/Application/Pos/FinalShiftCloseRuntimeDatabaseIdentity.php \
            apps/web/app/Application/Pos/FinalShiftCloseRuntimeDatabaseIdentityReader.php \
            apps/web/app/Application/Pos/FinalShiftCloseRuntimeDbBindingAttestation.php \
            apps/web/app/Delivery/Http/Pos/FinalShiftCloseRuntimeDbBindingAttestationController.php \
            apps/web/app/Infrastructure/Pos/LaravelFinalShiftCloseRuntimeDatabaseIdentityReader.php \
            apps/web/routes/final-shift-close-runtime-db-binding-attestation.php \
            apps/web/config/final_shift_close_runtime_db_binding_attestation.php \
            apps/web/config/final_shift_close_runtime_binding_materialization.php \
            apps/web/bootstrap/app.php \
            apps/web/config/oneqay.php \
            apps/web/database/migrations \
            ops/final-shift-close/STATE.json \
            ops/final-shift-close/STATE.json \
            ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json "${menu_verified_exclusions[@]}"
          fi
          [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" == 'EXECUTED' ]]
          permission_state="$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)"
          [[ "$permission_state" =~ ^(NONE|PROVISIONED)$ ]]
          if [[ "$permission_state" == 'PROVISIONED' ]]; then
            [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" == 'EXECUTED' ]]
          fi
          [[ "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" =~ ^(INACTIVE|ACTIVE)$ ]]
          [[ "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'SELECTED_NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.selected_target.environment_id' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'oneqay-durable-staging-01' ]]
          [[ "$(jq -r '.selected_target.runtime_class' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'durable-staging' ]]
          selected_target_fingerprint="$(jq -r '.selected_target.selection_fingerprint_sha256' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)"; [[ "$selected_target_fingerprint" =~ ^[0-9a-f]{64}$ ]]

      - name: Preserve Sprint119 read-only attestation semantics
        shell: bash
        run: |
          set -euo pipefail
          contract=ops/final-shift-close/RUNTIME_DB_BINDING_ATTESTATION_CONTRACT.json
          jq -e '.schema_version == 1 and .database_identity.read_only == true and .database_identity.algorithm == "SHA256_CANONICAL_JSON_DATABASE_HOSTNAME_PORT_V1" and .canonical_boundaries.runtime_endpoint_delivery == "INACTIVE"' "$contract" >/dev/null
          service=apps/web/app/Application/Pos/FinalShiftCloseRuntimeDbBindingAttestation.php
          reader=apps/web/app/Infrastructure/Pos/LaravelFinalShiftCloseRuntimeDatabaseIdentityReader.php
          grep -Fq 'SELECTED_NOT_AUTHORIZED' "$service"
          grep -Fq "'secrets_embedded' => false" "$service"
          grep -Fq 'SELECT DATABASE() AS database_name, @@hostname AS server_hostname, @@port AS server_port' "$reader"
          ! grep -Eq '(insert\(|update\(|delete\(|statement\(|unprepared\()' "$reader"

      - name: Preserve registered default-off endpoint and corrected token boundary
        shell: bash
        run: |
          set -euo pipefail
          policy=apps/web/app/Application/Pos/FinalShiftCloseRuntimeControlPlaneTokenPolicy.php
          provider=apps/web/app/Providers/FinalShiftCloseRuntimeDbBindingAttestationServiceProvider.php
          middleware=apps/web/app/Delivery/Http/Middleware/RequireFinalShiftCloseRuntimeBindingTokenMiddleware.php
          config=apps/web/config/final_shift_close_runtime_db_binding_attestation.php
          grep -Fq "env('ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_DB_BINDING_ATTESTATION_ENABLED', false)" "$config"
          grep -Fq "env('ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_DB_BINDING_ATTESTATION_TOKEN', '')" "$config"
          grep -Fq 'public const MINIMUM_LENGTH = 32;' "$policy"
          grep -Fq 'public const MAXIMUM_LENGTH = 512;' "$policy"
          grep -Fq '[A-Za-z0-9._~+=\/-]+' "$policy"
          ! grep -Fq '[A-Za-z0-9._~+\/-=]' "$policy"
          grep -Fq 'FinalShiftCloseRuntimeControlPlaneTokenPolicy::isValidToken(' "$provider"
          grep -Fq 'FinalShiftCloseRuntimeControlPlaneTokenPolicy::parseBearerCredential(' "$middleware"
          grep -Fq 'hash_equals($this->expectedToken, $providedToken)' "$middleware"
          grep -Fq "response('', 404" "$middleware"
          grep -Fq "'Cache-Control' => 'no-store, private'" "$middleware"
          grep -Fq "'throttle:2,1'" "$provider"

      - name: Validate Sprint128 successor contract
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.sprint == 128 and .token_policy.hyphen == "ALLOWED" and .token_policy.colon == "REJECTED" and .db_attestation_control_plane.valid_control_plane_request_performed == false and .canonical_boundaries.runtime_db_binding_attestation == "NOT_PERFORMED" and .source_envelope_sha256 == "ae8691a2c9be31ba6558145a1162cc0aaa658727ff14279c1e638b0a971dc825"' ops/final-shift-close/RUNTIME_CONTROL_PLANE_TOKEN_CHARACTER_POLICY_CONTRACT.json >/dev/null

      - name: Validate PHP syntax and executable Sprint119 regression
        shell: bash
        run: |
          set -euo pipefail
          find \
            apps/web/app/Application/Pos/FinalShiftCloseRuntimeControlPlaneTokenPolicy.php \
            apps/web/app/Application/Pos/FinalShiftCloseRuntimeDatabaseIdentity.php \
            apps/web/app/Application/Pos/FinalShiftCloseRuntimeDatabaseIdentityReader.php \
            apps/web/app/Application/Pos/FinalShiftCloseRuntimeDbBindingAttestation.php \
            apps/web/app/Delivery/Http/Middleware/RequireFinalShiftCloseRuntimeBindingTokenMiddleware.php \
            apps/web/app/Delivery/Http/Pos/FinalShiftCloseRuntimeDbBindingAttestationController.php \
            apps/web/app/Infrastructure/Pos/LaravelFinalShiftCloseRuntimeDatabaseIdentityReader.php \
            apps/web/app/Providers/FinalShiftCloseRuntimeDbBindingAttestationServiceProvider.php \
            apps/web/tests/final-shift-close-runtime-db-binding-attestation.php \
            apps/web/tests/final-shift-close-runtime-control-plane-token-character-policy.php \
            -type f -print0 | xargs -0 -n1 php -l
          cd apps/web
          composer install --no-interaction --prefer-dist --no-progress
          php tests/final-shift-close-runtime-db-binding-attestation.php

      - name: Lock no operational invocation
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'SPRINT119_RUNTIME_DB_BINDING_ATTESTATION_DELIVERY = INACTIVE' docs/SPRINT119_FINAL_SHIFT_CLOSE_RUNTIME_DB_BINDING_ATTESTATION.md
          doc=docs/SPRINT128_FINAL_SHIFT_CLOSE_RUNTIME_CONTROL_PLANE_TOKEN_CHARACTER_POLICY.md
          grep -Fq 'SPRINT128_VALID_CONTROL_PLANE_REQUEST = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT128_RUNTIME_DB_BINDING_ATTESTATION = NOT_PERFORMED' "$doc"
          grep -Fq 'MIGRATION_27_EXECUTION = NOT_PERFORMED' "$doc"
          grep -Fq 'FEATURE_ACTIVATION = INACTIVE' "$doc"
          grep -Fq 'PRODUCTION = NO-GO' "$doc"

      - name: Verify tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "$(git status --porcelain)" ]]
