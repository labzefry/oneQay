name: Sprint139 Final Shift Close Canonical Control Plane Auth Before Throttle Regression

# Attribution: Lab | zefry

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sprint139-final-shift-close-canonical-control-plane-auth-before-throttle-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify-canonical-control-plane-auth-before-throttle-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      CACHE_STORE: array
      SESSION_DRIVER: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Preserve successor-compatible historical regression boundary
        shell: bash
        run: |
          set -euo pipefail
          echo 'Sprint139 is historical after its canonical squash merge.'

      - name: Preserve Sprint138 historical successor compatibility
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/sprint138-final-shift-close-canonical-control-plane-authenticated-http-throttle-regression.yml
          grep -Fq 'Preserve successor-compatible historical regression boundary' "$workflow"
          grep -Fq 'Sprint138 is historical after its canonical squash merge.' "$workflow"
          ! grep -Fq 'Lock exact Sprint138 source envelope' "$workflow"

      - name: Validate Sprint139 machine-readable contract invariants
        shell: bash
        run: |
          set -euo pipefail
          file=ops/final-shift-close/CANONICAL_RUNTIME_CONTROL_PLANE_AUTH_BEFORE_THROTTLE_REGRESSION_CONTRACT.json
          jq -e '
            .schema_version == 1 and
            .feature == "final-shift-close" and
            .sprint == 139 and
            .bounded_objective == "CANONICAL_CONTROL_PLANE_AUTH_BEFORE_THROTTLE_REGRESSION" and
            .execution_mode == "CI_ONLY_SYNTHETIC_AUTH_BEFORE_THROTTLE_REGRESSION" and
            .qualification.dispatch_mode == "IN_PROCESS_CANONICAL_HTTP_KERNEL" and
            .qualification.new_executable_gap == "CROSS_PROVIDER_UNAUTHENTICATED_TRAFFIC_MUST_NOT_CONSUME_AUTHENTICATED_THROTTLE_BUDGET" and
            .qualification.middleware_order_change_only == true and
            .qualification.throttle_limits_changed == false and
            .qualification.canonical_token_policy_owner == "SPRINT130" and
            .qualification.canonical_valid_expected_token == true and
            .qualification.canonical_valid_wrong_bearer_fixture == true and
            .qualification.same_ip_auth_failure_then_valid_requests == true and
            .qualification.materialization.auth_middleware_before_throttle == true and
            .qualification.materialization.configured_throttle == "1,1" and
            .qualification.materialization.wrong_bearer_status == 401 and
            .qualification.materialization.wrong_bearer_writer_invocations == 0 and
            .qualification.materialization.first_valid_status == 200 and
            .qualification.materialization.second_valid_status == 429 and
            .qualification.materialization.writer == "IN_MEMORY_TEST_DOUBLE" and
            .qualification.materialization.writer_invocations_after_first_valid == 1 and
            .qualification.materialization.writer_invocations_after_second_valid == 1 and
            .qualification.materialization.production_writer_bomb_resolution_attempts == 0 and
            .qualification.materialization.canonical_runtime_manifest_write == false and
            .qualification.db_attestation.auth_middleware_before_throttle == true and
            .qualification.db_attestation.configured_throttle == "2,1" and
            .qualification.db_attestation.wrong_bearer_status == 404 and
            .qualification.db_attestation.wrong_bearer_reader_invocations == 0 and
            .qualification.db_attestation.first_valid_status == 200 and
            .qualification.db_attestation.second_valid_status == 200 and
            .qualification.db_attestation.third_valid_status == 429 and
            .qualification.db_attestation.database_identity_reader == "IN_MEMORY_TEST_DOUBLE" and
            .qualification.db_attestation.reader_invocations_after_two_valid == 2 and
            .qualification.db_attestation.reader_invocations_after_third_valid == 2 and
            .qualification.db_attestation.production_database_identity_reader_bomb_resolution_attempts == 0 and
            .qualification.db_attestation.real_database_connection == false and
            .qualification.db_attestation.real_database_identity_read == false and
            .qualification.db_attestation.attestation_mode == "READ_ONLY" and
            .qualification.db_attestation.migration27_state == "NOT_EXECUTED" and
            .qualification.real_route == true and
            .qualification.real_token_middleware == true and
            .qualification.real_throttle_middleware == true and
            .qualification.real_controller_for_allowed_requests == true and
            .qualification.production_filesystem_adapter_resolution == false and
            .qualification.production_database_identity_reader_resolution == false and
            .qualification.operational_runtime_token == false and
            .qualification.valid_operational_control_plane_request == false and
            .qualification.response_leakage == "FORBIDDEN" and
            .historical_ownership.sprint130_token_policy == "PRESERVED" and
            .historical_ownership.sprint135_registration_metadata == "PRESERVED" and
            .historical_ownership.sprint136_authenticated_http_positive_path == "PRESERVED" and
            .historical_ownership.sprint137_authenticated_http_fail_closed == "PRESERVED" and
            .historical_ownership.sprint138_authenticated_http_throttle == "PRESERVED" and
            .successor_compatibility.sprint138_historical_workflow == "SUCCESSOR_COMPATIBLE" and
            .successor_compatibility.sprint138_full_pr_envelope_lock == "ABSENT" and
            .source_envelope.path_count == 6 and
            .source_envelope.sha256 == "be9546afdf82465da5f9d160845edc4cf6599f306445f941226e12288a7b2286" and
            .canonical_boundaries.synthetic_authenticated_http_route_invocation == "PERFORMED_IN_TEST_PROCESS_ONLY" and
            .canonical_boundaries.operational_control_plane_request == "NOT_PERFORMED" and
            .canonical_boundaries.production_filesystem_adapter_resolution == "NOT_PERFORMED" and
            .canonical_boundaries.canonical_runtime_manifest_write == "NOT_PERFORMED" and
            .canonical_boundaries.production_database_identity_reader_resolution == "NOT_PERFORMED" and
            .canonical_boundaries.real_database_connection == "NOT_PERFORMED" and
            .canonical_boundaries.real_database_identity_read == "NOT_PERFORMED" and
            .canonical_boundaries.runtime_token_provisioning == "NOT_PERFORMED" and
            .canonical_boundaries.selected_target == null and
            .canonical_boundaries.migration27_execution == "NOT_PERFORMED" and
            .canonical_boundaries.permission_provisioning == "NONE" and
            .canonical_boundaries.feature_activation == "INACTIVE" and
            .canonical_boundaries.deployment_authority == "NOT_GRANTED" and
            .canonical_boundaries.technical_preview == "NO-GO" and
            .canonical_boundaries.production == "NO-GO" and
            .canonical_boundaries.updater == "INACTIVE" and
            .attribution == "Author by Lab | zefry"
          ' "$file" >/dev/null

      - name: Prove auth precedes throttle in both canonical providers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          materialization = Path('apps/web/app/Providers/FinalShiftCloseRuntimeBindingManifestMaterializationServiceProvider.php').read_text()
          db_attestation = Path('apps/web/app/Providers/FinalShiftCloseRuntimeDbBindingAttestationServiceProvider.php').read_text()

          materialization_auth = 'RequireFinalShiftCloseRuntimeBindingMaterializationTokenMiddleware::class,'
          materialization_throttle = "'throttle:1,1',"
          db_auth = 'RequireFinalShiftCloseRuntimeBindingTokenMiddleware::class,'
          db_throttle = "'throttle:2,1',"

          assert materialization.count(materialization_auth) >= 1
          assert materialization.count(materialization_throttle) == 1
          assert materialization.index(materialization_auth, materialization.index('Route::middleware([')) < materialization.index(materialization_throttle)

          assert db_attestation.count(db_auth) >= 1
          assert db_attestation.count(db_throttle) == 1
          assert db_attestation.index(db_auth, db_attestation.index('Route::middleware([')) < db_attestation.index(db_throttle)
          PY

      - name: Prove Sprint139 regression remains synthetic and same-IP budget bounded
        shell: bash
        run: |
          set -euo pipefail
          test_file=apps/web/tests/final-shift-close-runtime-control-plane-auth-before-throttle-regression.php
          grep -Fq 'FinalShiftCloseRuntimeControlPlaneTokenPolicy::MINIMUM_LENGTH' "$test_file"
          grep -Fq "str_repeat('W', FinalShiftCloseRuntimeControlPlaneTokenPolicy::MINIMUM_LENGTH)" "$test_file"
          grep -Fq "'REMOTE_ADDR' => '127.0.0.139'" "$test_file"
          grep -Fq "'REMOTE_ADDR' => '127.0.1.139'" "$test_file"
          grep -Fq '$materializationWrongResponse->getStatusCode() === 401' "$test_file"
          grep -Fq '$materializationValidResponseOne->getStatusCode() === 200' "$test_file"
          grep -Fq '$materializationValidResponseTwo->getStatusCode() === 429' "$test_file"
          grep -Fq '$writer->writes === 1' "$test_file"
          grep -Fq '$attestationWrongResponse->getStatusCode() === 404' "$test_file"
          grep -Fq '$attestationValidResponseOne->getStatusCode() === 200' "$test_file"
          grep -Fq '$attestationValidResponseTwo->getStatusCode() === 200' "$test_file"
          grep -Fq '$attestationValidResponseThree->getStatusCode() === 429' "$test_file"
          grep -Fq '$reader->reads === 2' "$test_file"
          grep -Fq '$productionWriterResolutionAttempts === 0' "$test_file"
          grep -Fq '$productionDatabaseReaderResolutionAttempts === 0' "$test_file"
          grep -Fq '! file_exists($canonicalManifestPath)' "$test_file"
          ! grep -Fq 'FilesystemFinalShiftCloseRuntimeBindingManifestWriter' "$test_file"
          ! grep -Fq 'LaravelFinalShiftCloseRuntimeDatabaseIdentityReader' "$test_file"
          ! grep -Fq "connection('oneqay')" "$test_file"

      - name: Prove operational NO-GO state remains intact
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" == 'NOT_EXECUTED' ]]
          [[ "$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)" == 'NONE' ]]
          [[ "$(jq -r '.permission_provisioning.default_grant' ops/final-shift-close/STATE.json)" == 'NONE' ]]
          [[ "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.deployment_authority' ops/final-shift-close/STATE.json)" == 'NOT_GRANTED' ]]
          [[ "$(jq -r '.technical_preview_activation' ops/final-shift-close/STATE.json)" == 'NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.production_activation' ops/final-shift-close/STATE.json)" == 'NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.updater_activation' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET' ]]
          [[ "$(jq -r '.selected_target' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'null' ]]

      - name: Validate PHP syntax and locked dependencies
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Providers/FinalShiftCloseRuntimeBindingManifestMaterializationServiceProvider.php
          php -l app/Providers/FinalShiftCloseRuntimeDbBindingAttestationServiceProvider.php
          php -l tests/final-shift-close-runtime-control-plane-auth-before-throttle-regression.php
          php -l tests/final-shift-close-runtime-control-plane-authenticated-http-throttle-regression.php
          php -l tests/final-shift-close-runtime-control-plane-authenticated-http-fail-closed-regression.php
          php -l tests/final-shift-close-runtime-control-plane-authenticated-http-positive-path-regression.php
          php -l tests/final-shift-close-runtime-control-plane-positive-registration-metadata-regression.php
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          composer audit --locked --no-interaction --abandoned=report

      - name: Execute Sprint139 auth-before-throttle regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-auth-before-throttle-regression.php

      - name: Preserve Sprint138 authenticated HTTP throttle regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-authenticated-http-throttle-regression.php

      - name: Preserve Sprint137 authenticated HTTP fail-closed regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-authenticated-http-fail-closed-regression.php

      - name: Preserve Sprint136 authenticated HTTP positive-path regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-authenticated-http-positive-path-regression.php

      - name: Preserve Sprint135 registration metadata regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-positive-registration-metadata-regression.php

      - name: Verify tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git status --short --untracked-files=no
