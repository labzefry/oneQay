name: Post-Sprint40 Sprint32 Preservation Bridge Builder

# Attribution: Lab | zefry

on:
  push:
    branches:
      - ci/post-sprint40-s32-preservation-bridge-builder

permissions:
  contents: write

jobs:
  build-clean-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout builder head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Build and validate bounded five-workflow bridge
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          git diff --check
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= \
            .github/workflows/sprint35-privileged-totp-recovery-regression.yml \
            .github/workflows/sprint36-first-party-session-inventory-revocation-regression.yml \
            .github/workflows/sprint37-first-party-all-session-termination-regression.yml \
            .github/workflows/sprint38-first-party-session-absolute-lifetime-regression.yml \
            .github/workflows/sprint39-first-party-session-organizational-access-revalidation-regression.yml

      - name: Commit clean bridge and expose commit object
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'labzefry'
          git config user.email 'lab.zefa@gmail.com'
          git rm .github/workflows/post-sprint40-s32-preservation-bridge-builder.yml
          git add \
            .github/workflows/sprint35-privileged-totp-recovery-regression.yml \
            .github/workflows/sprint36-first-party-session-inventory-revocation-regression.yml \
            .github/workflows/sprint37-first-party-all-session-termination-regression.yml \
            .github/workflows/sprint38-first-party-session-absolute-lifetime-regression.yml \
            .github/workflows/sprint39-first-party-session-organizational-access-revalidation-regression.yml
          git commit -m 'ci: preserve Sprint32 YAML closure through session regressions'
          cat > /tmp/expected <<'EOF'
          .github/workflows/sprint35-privileged-totp-recovery-regression.yml
          .github/workflows/sprint36-first-party-session-inventory-revocation-regression.yml
          .github/workflows/sprint37-first-party-all-session-termination-regression.yml
          .github/workflows/sprint38-first-party-session-absolute-lifetime-regression.yml
          .github/workflows/sprint39-first-party-session-organizational-access-revalidation-regression.yml
          EOF
          sort -o /tmp/expected /tmp/expected
          git diff --name-only 14e39fe1d4a0cef83afe25ef5da502f1cc8892eb HEAD | sort > /tmp/actual
          cmp -s /tmp/expected /tmp/actual
          test "$(sha256sum /tmp/actual | awk '{print $1}')" = 'ab09e044925ae98740a49c46a70ff387e5f5445b245d3a556d85ad6a354305ec'
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          echo "FINAL_TREE=$(git rev-parse HEAD^{tree})"
          set +e
          git push origin HEAD:ci/post-sprint40-s32-preservation-bridge-builder
          echo "PUSH_RC=$?"
          exit 0
