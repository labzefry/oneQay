# Author by Lab | zefry
name: Durable Staging Runtime Promotion Kit

on:
  workflow_run:
    workflows: ["Durable Staging Operator Artifact Publication"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: durable-staging-runtime-promotion-kit-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  publish-promotion-kit:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      REPOSITORY: ${{ github.repository }}
      API_URL: ${{ github.api_url }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact upstream canonical source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Validate upstream source and current canonical boundaries
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch origin main --quiet
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main

          state=ops/final-shift-close/STATE.json
          selection=ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json
          contract=ops/final-shift-close/DURABLE_STAGING_RUNTIME_PROMOTION_SUCCESSOR_CONTRACT.json

          test "$(jq -r '.migration27.state' "$state")" = EXECUTED
          test "$(jq -r '.permission_provisioning.state' "$state")" = PROVISIONED
          test "$(jq -r '.feature_activation.state' "$state")" = INACTIVE
          test "$(jq -r '.deployment_authority' "$state")" = NOT_GRANTED
          test "$(jq -r '.technical_preview_activation' "$state")" = NOT_AUTHORIZED
          test "$(jq -r '.production_activation' "$state")" = NOT_AUTHORIZED
          test "$(jq -r '.updater_activation' "$state")" = INACTIVE

          test "$(jq -r '.selection_state' "$selection")" = SELECTED_NOT_AUTHORIZED
          test "$(jq -r '.selected_target.environment_id' "$selection")" = oneqay-durable-staging-01
          test "$(jq -r '.selected_target.runtime_class' "$selection")" = durable-staging

          jq -e . "$contract" >/dev/null
          test "$(jq -r '.contract_state' "$contract")" = MATERIALIZED_PROMOTION_READY_NOT_DEPLOYED_NOT_ACTIVATED
          test "$(jq -r '.promotion_kit.application_deployment_performed' "$contract")" = false
          test "$(jq -r '.promotion_kit.feature_activation_performed' "$contract")" = false
          test "$(jq -r '.promotion_kit.post_deployment_reattestation_required' "$contract")" = true

      - name: Resolve exact upstream durable-staging artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail

          api() {
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$1"
          }

          run="$(api "$API_URL/repos/$REPOSITORY/actions/runs/$UPSTREAM_RUN_ID")"
          test "$(jq -r '.conclusion' <<<"$run")" = success
          test "$(jq -r '.head_branch' <<<"$run")" = main
          test "$(jq -r '.head_sha' <<<"$run")" = "$SOURCE_SHA"
          test "$(jq -r '.path' <<<"$run")" = .github/workflows/durable-staging-release-publication.yml

          release_id="durable-staging-${SOURCE_SHA:0:12}"
          expected_name="oneqay-${release_id}-operator-bundle"
          artifacts="$(api "$API_URL/repos/$REPOSITORY/actions/runs/$UPSTREAM_RUN_ID/artifacts?per_page=100")"
          matches="$(jq --arg name "$expected_name" '[.artifacts[] | select(.name == $name and .expired == false)]' <<<"$artifacts")"
          test "$(jq 'length' <<<"$matches")" = 1
          artifact_id="$(jq -r '.[0].id' <<<"$matches")"
          artifact_size="$(jq -r '.[0].size_in_bytes' <<<"$matches")"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
          (( artifact_size > 0 && artifact_size <= 33554432 ))

          mkdir -p /tmp/upstream
          curl --fail-with-body --silent --show-error --location \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$API_URL/repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" \
            --output /tmp/upstream.zip
          (( $(wc -c < /tmp/upstream.zip) <= 33554432 ))
          unzip -qq /tmp/upstream.zip -d /tmp/upstream

          archive="/tmp/upstream/${release_id}.tar.gz"
          manifest="/tmp/upstream/${release_id}.manifest.json"
          checksum="/tmp/upstream/${release_id}.tar.gz.sha256"
          handoff="/tmp/upstream/${release_id}.deployment-handoff.json"
          for path in "$archive" "$manifest" "$checksum" "$handoff"; do test -f "$path"; done

          php tools/validate-durable-staging-release-manifest.php "$manifest" "$archive"
          (cd /tmp/upstream && sha256sum -c "$(basename "$checksum")")
          test "$(jq -r '.source.commit_sha' "$manifest")" = "$SOURCE_SHA"
          test "$(jq -r '.runtime.required_runtime_class' "$manifest")" = durable-staging
          test "$(jq -r '.release.production' "$manifest")" = false
          test "$(jq -r '.release.synthetic_fixture_runtime' "$manifest")" = false
          test "$(jq -r '.artifact.sha256' "$manifest")" = "$(sha256sum "$archive" | awk '{print $1}')"
          test "$(jq -r '.handoff_state' "$handoff")" = VALIDATED_FOR_EXTERNAL_DEPLOYMENT_NOT_AUTHORIZED
          test "$(jq -r '.artifact.source_commit' "$handoff")" = "$SOURCE_SHA"
          test "$(jq -r '.deployment.authority_state' "$handoff")" = NOT_GRANTED

          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "handoff=$handoff" >> "$GITHUB_OUTPUT"

      - name: Build secret-free promotion kit
        id: kit
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          release_id="${{ steps.artifact.outputs.release_id }}"
          kit_id="runtime-promotion-${release_id}"
          kit="/tmp/$kit_id"
          mkdir -p "$kit/release" "$kit/tools/cpanel" "$kit/tools/deployment" "$kit/ops"

          cp "${{ steps.artifact.outputs.archive }}" "$kit/release/"
          cp "${{ steps.artifact.outputs.manifest }}" "$kit/release/"
          cp "${{ steps.artifact.outputs.checksum }}" "$kit/release/"
          cp "${{ steps.artifact.outputs.handoff }}" "$kit/release/"

          cp tools/cpanel/inspect-durable-staging-cpanel-no-ssh-target.php "$kit/tools/cpanel/"
          cp tools/cpanel/prepare-durable-staging-cpanel-no-ssh-target-candidate.php "$kit/tools/cpanel/"
          cp tools/cpanel/execute-durable-staging-cpanel-no-ssh-deployment.php "$kit/tools/cpanel/"
          cp tools/cpanel/fixed-public-document-root-bridge.php "$kit/tools/cpanel/"
          cp tools/cpanel/execute-final-shift-close-feature-activation.php "$kit/tools/cpanel/"
          cp tools/prepare-durable-staging-deployment-authority-request.php "$kit/tools/"
          cp tools/qualify-durable-staging-deployment-authority.php "$kit/tools/"
          cp tools/prepare-durable-staging-operator-deployment-plan.php "$kit/tools/"
          cp tools/qualify-durable-staging-deployment-evidence.php "$kit/tools/"
          cp tools/deployment/durable-staging-*.schema.json "$kit/tools/deployment/"
          cp ops/final-shift-close/DURABLE_STAGING_RUNTIME_PROMOTION_SUCCESSOR_CONTRACT.json "$kit/ops/"
          cp ops/final-shift-close/STATE.json "$kit/ops/canonical-state-at-publication.json"
          cp ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json "$kit/ops/selected-target-before-promotion.json"

          current_selected_source="$(jq -r '.selected_target.exact_running_source_commit' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)"
          candidate_artifact="$(jq -r '.artifact.sha256' "${{ steps.artifact.outputs.manifest }}")"
          jq -n \
            --arg source "$SOURCE_SHA" \
            --arg release_id "$release_id" \
            --arg candidate_artifact "$candidate_artifact" \
            --arg selected_source_before "$current_selected_source" \
            --argjson upstream_run_id "$UPSTREAM_RUN_ID" \
            --argjson upstream_artifact_id "${{ steps.artifact.outputs.artifact_id }}" \
            '{
              schema_version: 1,
              product: "oneQay",
              purpose: "DURABLE_STAGING_SUCCESSOR_PROMOTION_OPERATOR_HANDOFF",
              candidate: {
                environment_id: "oneqay-durable-staging-01",
                runtime_class: "durable-staging",
                release_id: $release_id,
                source_commit: $source,
                artifact_sha256: $candidate_artifact,
                upstream_publication_run_id: $upstream_run_id,
                upstream_artifact_id: $upstream_artifact_id
              },
              pre_promotion_selected_target: {
                source_commit: $selected_source_before,
                selection_state: "SELECTED_NOT_AUTHORIZED"
              },
              execution_boundary: {
                deployment_authority: "NOT_GRANTED",
                deployment_performed: false,
                migration_execution_performed: false,
                permission_provisioning_performed: false,
                feature_activation_performed: false,
                technical_preview_activation: "NOT_AUTHORIZED",
                production_activation: "NOT_AUTHORIZED",
                updater_activation: "INACTIVE"
              },
              required_after_authorized_deployment: {
                exact_running_source_reattestation: true,
                exact_running_artifact_reattestation: true,
                non_mutating_health_attestation: true,
                selected_target_generation_update: true,
                feature_activation_authority_still_separate: true
              },
              attribution: "Author by Lab | zefry"
            }' > "$kit/PROMOTION.json"

          cat > "$kit/README.md" <<'EOF'
          # oneQay durable-staging runtime promotion kit

          Author by Lab | zefry

          This kit is an operator handoff only. It does not grant deployment or feature-activation authority.

          The candidate release is bound to the exact current-main source and must be deployed only after a separate, current, short-lived deployment authority is qualified. After deployment, produce a fresh durable-runtime attestation and update selected-target identity before any Final Shift Close activation attempt.

          Never reuse historical deployment authority, historical selected-target evidence, or a stale approval token.
          EOF

          (
            cd "$kit"
            find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          chmod -R go-rwx "$kit"
          (cd /tmp && zip -q -X -r "${kit_id}.zip" "$kit_id")
          (( $(wc -c < "/tmp/${kit_id}.zip") <= 16777216 ))
          echo "kit_id=$kit_id" >> "$GITHUB_OUTPUT"
          echo "zip=/tmp/${kit_id}.zip" >> "$GITHUB_OUTPUT"

      - name: Upload governed promotion kit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oneqay-${{ steps.kit.outputs.kit_id }}
          path: ${{ steps.kit.outputs.zip }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Confirm no repository mutation
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
