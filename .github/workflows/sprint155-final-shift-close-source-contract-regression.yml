name: Sprint155 Final Shift Close Source Contract Regression

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  preserve-sprint155-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install locked PHP dependencies
        working-directory: apps/web
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Validate PHP syntax
        run: |
          set -euo pipefail
          find apps/web/app apps/web/tests -type f -name '*.php' -print0 |
            while IFS= read -r -d '' file; do
              php -l "$file"
            done

      - name: Run application regression suite
        working-directory: apps/web
        run: composer test
