name: Sprint140 Final Shift Close Canonical Control Plane Auth Rejection Response Hardening Regression

# Attribution: Lab | zefry

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sprint140-final-shift-close-canonical-control-plane-auth-rejection-response-hardening-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify-canonical-control-plane-auth-rejection-response-hardening-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      CACHE_STORE: array
      SESSION_DRIVER: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Lock exact Sprint140 source envelope
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$base" "$head" | LC_ALL=C sort > /tmp/paths
          cat > /tmp/expected <<'EOF'
          .github/workflows/sprint126-final-shift-close-runtime-binding-manifest-control-plane-token-hardening.yml
          .github/workflows/sprint130-final-shift-close-canonical-runtime-control-plane-token-policy.yml
          .github/workflows/sprint131-final-shift-close-canonical-control-plane-positive-path-regression.yml
          .github/workflows/sprint140-final-shift-close-canonical-control-plane-auth-rejection-response-hardening-regression.yml
          apps/web/app/Delivery/Http/Middleware/RequireFinalShiftCloseRuntimeBindingMaterializationTokenMiddleware.php
          apps/web/app/Delivery/Http/Middleware/RequireFinalShiftCloseRuntimeBindingTokenMiddleware.php
          apps/web/tests/final-shift-close-runtime-control-plane-auth-rejection-response-hardening-regression.php
          docs/SPRINT140_FINAL_SHIFT_CLOSE_CANONICAL_CONTROL_PLANE_AUTH_REJECTION_RESPONSE_HARDENING_REGRESSION.md
          ops/final-shift-close/CANONICAL_RUNTIME_CONTROL_PLANE_AUTH_REJECTION_RESPONSE_HARDENING_REGRESSION_CONTRACT.json
          EOF
          diff -u /tmp/expected /tmp/paths
          [[ "$(sha256sum /tmp/paths | awk '{print $1}')" == '58f0fe3105a12fc3c6cac98e736743349237a5221a63376f668358c5c09fe1b3' ]]

      - name: Preserve Sprint139 historical successor compatibility
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/sprint139-final-shift-close-canonical-control-plane-auth-before-throttle-regression.yml
          grep -Fq 'Preserve successor-compatible historical regression boundary' "$workflow"
          grep -Fq 'Sprint139 is historical after its canonical squash merge.' "$workflow"
          ! grep -Fq 'Lock exact Sprint139 source envelope' "$workflow"

      - name: Prove historical rejection representation compatibility corrections
        shell: bash
        run: |
          set -euo pipefail
          for workflow in \
            .github/workflows/sprint126-final-shift-close-runtime-binding-manifest-control-plane-token-hardening.yml \
            .github/workflows/sprint130-final-shift-close-canonical-runtime-control-plane-token-policy.yml \
            .github/workflows/sprint131-final-shift-close-canonical-control-plane-positive-path-regression.yml
          do
            grep -Fq 'return $this->rejectionResponse(503);' "$workflow"
            grep -Fq 'return $this->rejectionResponse(401);' "$workflow"
            ! grep -Fq "grep -Fq 'abort(503);'" "$workflow"
            ! grep -Fq "grep -Fq 'abort(401);'" "$workflow"
          done

      - name: Validate Sprint140 machine-readable contract
        shell: bash
        run: |
          set -euo pipefail
          file=ops/final-shift-close/CANONICAL_RUNTIME_CONTROL_PLANE_AUTH_REJECTION_RESPONSE_HARDENING_REGRESSION_CONTRACT.json
          jq -e '
            .schema_version == 1 and
            .feature == "final-shift-close" and
            .sprint == 140 and
            .bounded_objective == "CANONICAL_CONTROL_PLANE_AUTH_REJECTION_RESPONSE_HARDENING_REGRESSION" and
            .execution_mode == "CI_ONLY_SYNTHETIC_AUTH_REJECTION_RESPONSE_HARDENING_REGRESSION" and
            .qualification.new_executable_gap == "CROSS_PROVIDER_AUTH_REJECTION_RESPONSE_PRIVACY_SECURITY_METADATA" and
            .qualification.direct_middleware_invocation == true and
            .qualification.real_route_invocation == false and
            .qualification.real_controller_invocation == false and
            .qualification.canonical_token_policy_owner == "SPRINT130" and
            .qualification.token_policy_changed == false and
            .qualification.route_registration_changed == false and
            .qualification.middleware_order_changed == false and
            .qualification.throttle_limits_changed == false and
            .qualification.historical_workflow_representation_correction == "SPRINT126_SPRINT130_SPRINT131_ONLY" and
            .qualification.materialization.invalid_expected_token_status == 503 and
            .qualification.materialization.missing_bearer_status == 401 and
            .qualification.materialization.malformed_bearer_status == 401 and
            .qualification.materialization.mismatched_bearer_status == 401 and
            .qualification.materialization.matching_bearer_next_status == 204 and
            .qualification.materialization.rejection_body == "EMPTY" and
            .qualification.materialization.cache_control_no_store == true and
            .qualification.materialization.cache_control_private == true and
            .qualification.materialization.pragma_no_cache == true and
            .qualification.materialization.x_content_type_options_nosniff == true and
            .qualification.materialization.x_robots_tag == "noindex, nofollow, noarchive" and
            .qualification.db_attestation.invalid_expected_token_status == 404 and
            .qualification.db_attestation.missing_bearer_status == 404 and
            .qualification.db_attestation.malformed_bearer_status == 404 and
            .qualification.db_attestation.mismatched_bearer_status == 404 and
            .qualification.db_attestation.matching_bearer_next_status == 204 and
            .qualification.db_attestation.rejection_body == "EMPTY" and
            .qualification.db_attestation.cache_control_no_store == true and
            .qualification.db_attestation.cache_control_private == true and
            .qualification.db_attestation.pragma_no_cache == true and
            .qualification.db_attestation.x_content_type_options_nosniff == true and
            .qualification.db_attestation.x_robots_tag == "noindex, nofollow, noarchive" and
            .qualification.bearer_fixture_leakage == "FORBIDDEN" and
            .qualification.internal_path_leakage == "FORBIDDEN" and
            .qualification.production_filesystem_adapter_resolution == false and
            .qualification.production_database_identity_reader_resolution == false and
            .qualification.real_database_connection == false and
            .qualification.operational_runtime_token == false and
            .qualification.operational_runtime_target_invocation == false and
            .historical_ownership.sprint126_manifest_token_hardening == "PRESERVED_WITH_HARDENED_REJECTION_REPRESENTATION" and
            .historical_ownership.sprint130_token_policy == "PRESERVED_WITH_HARDENED_REJECTION_REPRESENTATION" and
            .historical_ownership.sprint131_middleware_positive_path == "PRESERVED_WITH_HARDENED_REJECTION_REPRESENTATION" and
            .historical_ownership.sprint134_delivery_gate_route_absence == "PRESERVED" and
            .historical_ownership.sprint135_registration_metadata == "PRESERVED" and
            .historical_ownership.sprint136_authenticated_http_positive_path == "PRESERVED" and
            .historical_ownership.sprint137_authenticated_http_fail_closed == "PRESERVED" and
            .historical_ownership.sprint138_authenticated_http_throttle == "PRESERVED" and
            .historical_ownership.sprint139_auth_before_throttle == "PRESERVED" and
            .successor_compatibility.sprint139_historical_workflow == "SUCCESSOR_COMPATIBLE" and
            .successor_compatibility.sprint139_full_pr_envelope_lock == "ABSENT" and
            .successor_compatibility.active_sprint_envelope_authority == "SPRINT140_WORKFLOW_ONLY" and
            .source_envelope.path_count == 9 and
            .source_envelope.sha256 == "58f0fe3105a12fc3c6cac98e736743349237a5221a63376f668358c5c09fe1b3" and
            .canonical_boundaries.operational_control_plane_request == "NOT_PERFORMED" and
            .canonical_boundaries.production_filesystem_adapter_resolution == "NOT_PERFORMED" and
            .canonical_boundaries.canonical_runtime_manifest_write == "NOT_PERFORMED" and
            .canonical_boundaries.production_database_identity_reader_resolution == "NOT_PERFORMED" and
            .canonical_boundaries.real_database_connection == "NOT_PERFORMED" and
            .canonical_boundaries.real_database_identity_read == "NOT_PERFORMED" and
            .canonical_boundaries.runtime_token_provisioning == "NOT_PERFORMED" and
            .canonical_boundaries.selected_target == null and
            .canonical_boundaries.migration27_execution == "NOT_PERFORMED" and
            .canonical_boundaries.permission_provisioning == "NONE" and
            .canonical_boundaries.feature_activation == "INACTIVE" and
            .canonical_boundaries.deployment_authority == "NOT_GRANTED" and
            .canonical_boundaries.technical_preview == "NO-GO" and
            .canonical_boundaries.production == "NO-GO" and
            .canonical_boundaries.updater == "INACTIVE" and
            .attribution == "Author by Lab | zefry"
          ' "$file" >/dev/null

      - name: Prove canonical auth rejection source hardening
        shell: bash
        run: |
          set -euo pipefail
          materialization=apps/web/app/Delivery/Http/Middleware/RequireFinalShiftCloseRuntimeBindingMaterializationTokenMiddleware.php
          db=apps/web/app/Delivery/Http/Middleware/RequireFinalShiftCloseRuntimeBindingTokenMiddleware.php

          grep -Fq 'return $this->rejectionResponse(503);' "$materialization"
          grep -Fq 'return $this->rejectionResponse(401);' "$materialization"
          ! grep -Fq 'abort(' "$materialization"
          grep -Fq "'Cache-Control' => 'no-store, private'" "$materialization"
          grep -Fq "'Pragma' => 'no-cache'" "$materialization"
          grep -Fq "'X-Content-Type-Options' => 'nosniff'" "$materialization"
          grep -Fq "'X-Robots-Tag' => 'noindex, nofollow, noarchive'" "$materialization"

          grep -Fq 'return $this->rejectionResponse();' "$db"
          grep -Fq "return response('', 404" "$db"
          grep -Fq "'Cache-Control' => 'no-store, private'" "$db"
          grep -Fq "'Pragma' => 'no-cache'" "$db"
          grep -Fq "'X-Content-Type-Options' => 'nosniff'" "$db"
          grep -Fq "'X-Robots-Tag' => 'noindex, nofollow, noarchive'" "$db"

      - name: Preserve Sprint139 auth-before-throttle ordering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          materialization = Path('apps/web/app/Providers/FinalShiftCloseRuntimeBindingManifestMaterializationServiceProvider.php').read_text()
          db_attestation = Path('apps/web/app/Providers/FinalShiftCloseRuntimeDbBindingAttestationServiceProvider.php').read_text()

          m_auth = 'RequireFinalShiftCloseRuntimeBindingMaterializationTokenMiddleware::class,'
          m_throttle = "'throttle:1,1',"
          d_auth = 'RequireFinalShiftCloseRuntimeBindingTokenMiddleware::class,'
          d_throttle = "'throttle:2,1',"

          assert materialization.index(m_auth, materialization.index('Route::middleware([')) < materialization.index(m_throttle)
          assert db_attestation.index(d_auth, db_attestation.index('Route::middleware([')) < db_attestation.index(d_throttle)
          PY

      - name: Prove Sprint140 regression remains direct middleware and synthetic
        shell: bash
        run: |
          set -euo pipefail
          test_file=apps/web/tests/final-shift-close-runtime-control-plane-auth-rejection-response-hardening-regression.php
          grep -Fq 'RequireFinalShiftCloseRuntimeBindingMaterializationTokenMiddleware' "$test_file"
          grep -Fq 'RequireFinalShiftCloseRuntimeBindingTokenMiddleware' "$test_file"
          grep -Fq "new Response('', 204)" "$test_file"
          grep -Fq "'AUTH-RESP-005 materialization invalid expected token'" "$test_file"
          grep -Fq "'AUTH-RESP-009 materialization mismatched bearer'" "$test_file"
          grep -Fq "'AUTH-RESP-013 DB attestation invalid expected token remains cloaked'" "$test_file"
          grep -Fq "'AUTH-RESP-017 DB attestation mismatched bearer remains cloaked'" "$test_file"
          grep -Fq "'X-Robots-Tag'" "$test_file"
          grep -Fq '$nextInvocations === 2' "$test_file"
          grep -Fq 'production manifest writer remains unresolved' "$test_file"
          grep -Fq 'production database identity reader remains unresolved' "$test_file"
          grep -Fq 'materialization controller remains unresolved' "$test_file"
          grep -Fq 'DB attestation controller remains unresolved' "$test_file"
          ! grep -Fq '$kernel->handle(' "$test_file"
          ! grep -Fq 'FilesystemFinalShiftCloseRuntimeBindingManifestWriter' "$test_file"
          ! grep -Fq "connection('oneqay')" "$test_file"

      - name: Prove operational NO-GO state remains intact
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" == 'NOT_EXECUTED' ]]
          [[ "$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)" == 'NONE' ]]
          [[ "$(jq -r '.permission_provisioning.default_grant' ops/final-shift-close/STATE.json)" == 'NONE' ]]
          [[ "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.deployment_authority' ops/final-shift-close/STATE.json)" == 'NOT_GRANTED' ]]
          [[ "$(jq -r '.technical_preview_activation' ops/final-shift-close/STATE.json)" == 'NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.production_activation' ops/final-shift-close/STATE.json)" == 'NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.updater_activation' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET' ]]
          [[ "$(jq -r '.selected_target' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'null' ]]

      - name: Validate PHP syntax and locked dependencies
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Delivery/Http/Middleware/RequireFinalShiftCloseRuntimeBindingMaterializationTokenMiddleware.php
          php -l app/Delivery/Http/Middleware/RequireFinalShiftCloseRuntimeBindingTokenMiddleware.php
          php -l tests/final-shift-close-runtime-control-plane-auth-rejection-response-hardening-regression.php
          php -l tests/final-shift-close-runtime-control-plane-auth-before-throttle-regression.php
          php -l tests/final-shift-close-runtime-control-plane-authenticated-http-throttle-regression.php
          php -l tests/final-shift-close-runtime-control-plane-authenticated-http-fail-closed-regression.php
          php -l tests/final-shift-close-runtime-control-plane-authenticated-http-positive-path-regression.php
          php -l tests/final-shift-close-runtime-control-plane-positive-registration-metadata-regression.php
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          composer audit --locked --no-interaction --abandoned=report

      - name: Execute Sprint140 auth rejection response hardening regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-auth-rejection-response-hardening-regression.php

      - name: Preserve Sprint139 auth-before-throttle regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-auth-before-throttle-regression.php

      - name: Preserve Sprint138 authenticated HTTP throttle regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-authenticated-http-throttle-regression.php

      - name: Preserve Sprint137 authenticated HTTP fail-closed regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-authenticated-http-fail-closed-regression.php

      - name: Preserve Sprint136 authenticated HTTP positive-path regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-authenticated-http-positive-path-regression.php

      - name: Preserve Sprint135 registration metadata regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-positive-registration-metadata-regression.php

      - name: Verify tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git status --short --untracked-files=no
