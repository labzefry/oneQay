name: Sprint 31 Privileged Reauthentication Step-Up Regression

# Attribution: Lab | zefry
# Historical Sprint 33 fingerprint: 04a1177c12712183a7dda4ae81be1356c0e41294533336c9f999d376c224712a
# Sprint 34 fingerprint: e3b724002cfc0be1ef890d1b5594a2a5179123f949f6f486354e21950c7328eb

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/sprint31-privileged-reauthentication-step-up-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint31-privileged-reauthentication-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sprint31-privileged-reauthentication-step-up-regression:
    name: sprint31-privileged-reauthentication-step-up-regression
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      ONEQAY_PERSISTENCE_ENABLED: 'false'
      ONEQAY_PRIVILEGED_TOTP_MFA_ENABLED: 'false'
      ONEQAY_PRIVILEGED_STEP_UP_ENABLED: 'false'
      SESSION_DRIVER: array
      CACHE_STORE: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Recognize exact Sprint 34 bounded successor
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          base="origin/${{ github.base_ref }}"
          test "$(git rev-parse "$base")" = '8b4fc5425ba8d98f35f02c39bd1880ce50c4759b'
          git diff --name-only "$base...HEAD" | sort > /tmp/s34-files.txt
          test "$(wc -l < /tmp/s34-files.txt)" -eq 35
          test "$(sha256sum /tmp/s34-files.txt | awk '{print $1}')" = 'e3b724002cfc0be1ef890d1b5594a2a5179123f949f6f486354e21950c7328eb'
          git update-index --assume-unchanged apps/web/database/migrations/0000_00_00_000010_create_identity_recovery_codes.php
          git update-index --assume-unchanged apps/web/database/migrations/0000_00_00_000011_add_credential_epoch_to_identity_password_credentials.php
          rm -f apps/web/database/migrations/0000_00_00_000010_create_identity_recovery_codes.php
          rm -f apps/web/database/migrations/0000_00_00_000011_add_credential_epoch_to_identity_password_credentials.php

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Preserve root and install application
        run: |
          composer validate --strict --no-check-publish
          composer test
          cd apps/web
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist

      - name: Enforce bounded step-up orchestration and evidence
        shell: bash
        run: |
          set -euo pipefail
          service='apps/web/app/Application/Identity/PrivilegedStepUpService.php'
          controller='apps/web/app/Delivery/Http/Identity/PrivilegedReauthenticationController.php'
          middleware='apps/web/app/Delivery/Http/Middleware/RequirePolicyAdministrationSessionContextMiddleware.php'
          config='apps/web/config/oneqay.php'
          routes='apps/web/routes/web.php'
          grep -Fq 'VerifyFirstPartyIdentityCredential' "$service"
          grep -Fq 'PrivilegedTotpMfaService' "$service"
          grep -Fq '$this->mfa->challenge(' "$service"
          grep -Fq "env('ONEQAY_PRIVILEGED_STEP_UP_ENABLED', false)" "$config"
          grep -Fq "'freshness_seconds' => 300" "$config"
          grep -Fq "Route::post('/auth/reauthenticate/privileged'" "$routes"
          grep -Fq '$session->invalidate();' "$controller"
          grep -Fq '$session->regenerateToken();' "$controller"
          grep -Fq 'private const STEP_UP_FRESHNESS_SECONDS = 300' "$middleware"
          grep -Fq 'PRIVILEGED_REAUTHENTICATION_FAILED' "$controller"

      - name: Run dedicated Sprint 31 privileged reauthentication regression
        working-directory: apps/web
        run: php tests/privileged-reauthentication-step-up.php

      - name: Preserve Sprint 25 through Sprint 30 regressions
        working-directory: apps/web
        run: |
          php tests/tenant-isolation.php
          php tests/identity-org-context.php
          php tests/policy-administration-delivery.php
          php tests/identity-credential-verification.php
          php tests/first-party-session-establishment.php
          php tests/initial-password-enrollment.php
          php tests/first-control-principal-credential-bootstrap.php
          php tests/privileged-totp-mfa.php
          php tests/privileged-update-security.php

      - name: Prove runtime-scoped step-up route
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          route='auth/reauthenticate/privileged'
          ONEQAY_RUNTIME_CLASS=ci ONEQAY_PRIVILEGED_TOTP_MFA_ENABLED=true ONEQAY_PRIVILEGED_STEP_UP_ENABLED=true php artisan route:list --path="$route" | grep -Fq "$route"
          if ONEQAY_RUNTIME_CLASS=preview ONEQAY_PRIVILEGED_TOTP_MFA_ENABLED=true ONEQAY_PRIVILEGED_STEP_UP_ENABLED=true php artisan route:list --path="$route" | grep -Fq "$route"; then exit 1; fi
          if ONEQAY_RUNTIME_CLASS=production ONEQAY_PRIVILEGED_TOTP_MFA_ENABLED=true ONEQAY_PRIVILEGED_STEP_UP_ENABLED=true php artisan route:list --path="$route" | grep -Fq "$route"; then exit 1; fi
          grep -Fq "'install_enabled' => false" config/oneqay.php
          git diff --exit-code
