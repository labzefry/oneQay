name: Sprint268 Dependency Security Remediation Regression
# Author by Lab | zefry
on:
  pull_request:
    branches: [main]
    paths:
      - apps/web/composer.json
      - apps/web/composer.lock
      - apps/web/package.json
      - apps/web/package-lock.json
      - src/SchemaPlanning/LaravelMigrationMaterialization.php
      - tests/migration.php
      - .github/workflows/sprint32-authentication-recovery-proof-regression.yml
      - .github/workflows/sprint33-recovery-bound-password-reset-regression.yml
      - .github/workflows/sprint34-authenticated-password-change-regression.yml
      - .github/workflows/sprint253-final-shift-close-post-activation-historical-regression-successor-compatibility.yml
      - .github/workflows/sprint222-cpanel-fixed-public-php-symlink-policy-fallback-regression.yml
      - .github/workflows/sprint31-privileged-reauthentication-step-up-regression.yml
      - .github/workflows/sprint211-durable-staging-operator-artifact-publication-regression.yml
      - .github/workflows/sprint212-cpanel-no-ssh-durable-staging-target-qualification-regression.yml
      - .github/workflows/sprint213-cpanel-no-ssh-operator-qualification-kit-publication-regression.yml
      - .github/workflows/sprint214-cpanel-no-ssh-guarded-deployment-execution-regression.yml
      - .github/workflows/sprint218-production-dark-deployment-execution-regression.yml
      - .github/workflows/sprint223-durable-runtime-ingestion-null-boundary-regression.yml
      - .github/workflows/sprint30-privileged-totp-mfa-regression.yml
      - .github/workflows/sprint268-dependency-security-remediation-regression.yml
  push:
    branches: [main]
    paths:
      - apps/web/composer.json
      - apps/web/composer.lock
      - apps/web/package.json
      - apps/web/package-lock.json
      - src/SchemaPlanning/LaravelMigrationMaterialization.php
      - tests/migration.php
      - .github/workflows/sprint32-authentication-recovery-proof-regression.yml
      - .github/workflows/sprint33-recovery-bound-password-reset-regression.yml
      - .github/workflows/sprint34-authenticated-password-change-regression.yml
      - .github/workflows/sprint253-final-shift-close-post-activation-historical-regression-successor-compatibility.yml
      - .github/workflows/sprint222-cpanel-fixed-public-php-symlink-policy-fallback-regression.yml
      - .github/workflows/sprint31-privileged-reauthentication-step-up-regression.yml
      - .github/workflows/sprint211-durable-staging-operator-artifact-publication-regression.yml
      - .github/workflows/sprint212-cpanel-no-ssh-durable-staging-target-qualification-regression.yml
      - .github/workflows/sprint213-cpanel-no-ssh-operator-qualification-kit-publication-regression.yml
      - .github/workflows/sprint214-cpanel-no-ssh-guarded-deployment-execution-regression.yml
      - .github/workflows/sprint218-production-dark-deployment-execution-regression.yml
      - .github/workflows/sprint223-durable-runtime-ingestion-null-boundary-regression.yml
      - .github/workflows/sprint30-privileged-totp-mfa-regression.yml
      - .github/workflows/sprint268-dependency-security-remediation-regression.yml
permissions:
  contents: read
jobs:
  audit-patched-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact proposed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Verify historical or exact bounded npm-security successor paths
        if: (github.event_name == 'pull_request') && (github.event_name != 'pull_request' || github.head_ref != 'production-merchant-commercial-go-live-integrated-20261009')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import subprocess
          historical_expected = sorted([
            'apps/web/composer.json',
            'apps/web/composer.lock',
            'apps/web/package.json',
            'apps/web/package-lock.json',
            '.github/workflows/sprint268-dependency-security-remediation-regression.yml',
            'src/SchemaPlanning/LaravelMigrationMaterialization.php',
            'tests/migration.php',
            '.github/workflows/sprint32-authentication-recovery-proof-regression.yml',
            '.github/workflows/sprint33-recovery-bound-password-reset-regression.yml',
            '.github/workflows/sprint34-authenticated-password-change-regression.yml',
            '.github/workflows/sprint31-privileged-reauthentication-step-up-regression.yml',
            '.github/workflows/sprint222-cpanel-fixed-public-php-symlink-policy-fallback-regression.yml',
            '.github/workflows/sprint253-final-shift-close-post-activation-historical-regression-successor-compatibility.yml',
            '.github/workflows/sprint211-durable-staging-operator-artifact-publication-regression.yml',
            '.github/workflows/sprint212-cpanel-no-ssh-durable-staging-target-qualification-regression.yml',
            '.github/workflows/sprint213-cpanel-no-ssh-operator-qualification-kit-publication-regression.yml',
            '.github/workflows/sprint214-cpanel-no-ssh-guarded-deployment-execution-regression.yml',
            '.github/workflows/sprint218-production-dark-deployment-execution-regression.yml',
            '.github/workflows/sprint223-durable-runtime-ingestion-null-boundary-regression.yml',
            '.github/workflows/sprint30-privileged-totp-mfa-regression.yml',
          ])

          successor_expected = sorted([
            ".github/workflows/sprint211-durable-staging-operator-artifact-publication-regression.yml",
            ".github/workflows/sprint212-cpanel-no-ssh-durable-staging-target-qualification-regression.yml",
            ".github/workflows/sprint213-cpanel-no-ssh-operator-qualification-kit-publication-regression.yml",
            ".github/workflows/sprint214-cpanel-no-ssh-guarded-deployment-execution-regression.yml",
            ".github/workflows/sprint218-production-dark-deployment-execution-regression.yml",
            ".github/workflows/sprint222-cpanel-fixed-public-php-symlink-policy-fallback-regression.yml",
            ".github/workflows/sprint223-durable-runtime-ingestion-null-boundary-regression.yml",
            ".github/workflows/sprint268-dependency-security-remediation-regression.yml",
            "apps/web/package-lock.json",
            "apps/web/package.json",
          ])
          successor = (os.environ.get('HEAD_REF') == 'remediate-npm-high-advisories-20261008'
                       and os.environ.get('PR_NUMBER') == '929')
          if successor:
              base = os.environ.get('BASE_SHA', '')
              assert len(base) == 40 and all(ch in '0123456789abcdef' for ch in base)
              actual = sorted(subprocess.check_output(
                  ['git','diff','--name-only','--diff-filter=ACMRT',base,'HEAD'],
                  text=True).splitlines())
              assert actual == successor_expected, f'Unsafe bounded security successor paths: {actual}'
              print('SPRINT268_NPM_SUCCESSOR_TEN_PATH_ENVELOPE=PASS')
          else:
              actual = sorted(subprocess.check_output(
                  ['git','diff','--name-only','--diff-filter=ACMRT',
                   'c83d5131d7aaab19ddbd001223236aa424d2ea48','HEAD'],
                  text=True).splitlines())
              assert actual == historical_expected, f'Unsafe Sprint268 historical paths: {actual}'
              print('SPRINT268_TWENTY_PATH_ENVELOPE=PASS')
          PY
      - name: Verify patched dependency floors and historical migration source preservation
        run: |
          set -euo pipefail
          php -r '
          $manifest=json_decode(file_get_contents("apps/web/composer.json"),true,512,JSON_THROW_ON_ERROR);
          $lock=json_decode(file_get_contents("apps/web/composer.lock"),true,512,JSON_THROW_ON_ERROR);
          $floors=["laravel/framework"=>"12.69.0","league/commonmark"=>"2.10.2","league/flysystem"=>"3.35.3"];
          foreach($floors as $name=>$min) {
              $found=false;
              foreach($lock["packages"] as $pkg) {
                  if($pkg["name"]!==$name) continue;
                  if(!version_compare(ltrim($pkg["version"],"v"),$min,">=")) exit(1);
                  $found=true;
                  echo $name."=".$pkg["version"].PHP_EOL;
              }
              if(!$found) exit(1);
          }
          if($manifest["require"]["laravel/framework"]!=="12.69.0") exit(1);
          '
          git diff --exit-code 505518f79e8a70f789b94f5074a040eae785aeb0 HEAD -- apps/web/database/migrations
          grep -Fq "public const FRAMEWORK_VERSION = '12.64.0';" src/SchemaPlanning/LaravelMigrationGeneration.php
          echo 'SPRINT268_ORIGINAL_MIGRATION_SOURCE_PRESERVED=PASS'
      - name: Verify Composer manifest lock and install
        working-directory: apps/web
        run: |
          set -euo pipefail
          composer validate --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress --no-scripts
          composer audit --locked --format=plain
          echo 'SPRINT268_COMPOSER_AUDIT=PASS'
      - name: Run application regression on patched graph
        working-directory: apps/web
        run: |
          set -euo pipefail
          composer test
          echo 'SPRINT268_APPLICATION_REGRESSION=PASS'
      - name: Setup security-patched Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.19.0
      - name: Verify locked security-patched Axios and complete frontend checks
        working-directory: apps/web
        run: |
          set -euo pipefail
          node -e 'const p=require("./package.json"),l=require("./package-lock.json");if(p.dependencies.axios!=="1.20.0"||l.packages[""].dependencies.axios!=="1.20.0"||l.packages["node_modules/axios"].version!=="1.20.0")process.exit(1)'
          npm ci --ignore-scripts --no-fund
          npm audit --audit-level=high
          npm run type-check
          npm run build
          echo 'SPRINT268_NPM_SECURITY_AND_FRONTEND_REGRESSION=PASS'

      - name: Preserve Production operational boundary
        run: |
          jq -e '.migration27.state=="EXECUTED" and .permission_provisioning.default_grant=="NONE" and .feature_activation.state=="ACTIVE" and .deployment_authority=="NOT_GRANTED" and .technical_preview_activation=="NOT_AUTHORIZED" and .production_activation=="NOT_AUTHORIZED" and .updater_activation=="INACTIVE"' ops/final-shift-close/STATE.json
          echo 'PRODUCTION_DEPLOYMENT=NOT_PERFORMED'
          echo 'PRODUCTION_DATABASE_MUTATION=NOT_PERFORMED'
          echo 'STAGING_MUTATION=NOT_PERFORMED'
