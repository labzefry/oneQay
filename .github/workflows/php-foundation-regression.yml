name: PHP Foundation Regression

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: php-foundation-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  php-foundation-regression:
    name: php-foundation-regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Show and validate PHP version
        shell: bash
        run: |
          set -euo pipefail
          php --version
          php -r 'if (PHP_VERSION_ID < 80200) { fwrite(STDERR, "PHP >= 8.2 is required.\n"); exit(1); }'

      - name: Show Composer version
        run: composer --version

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-publish

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' php_files < <(find src tests -type f -name '*.php' -print0)

          if [[ "${#php_files[@]}" -eq 0 ]]; then
            echo "No PHP files found under src/ or tests/." >&2
            exit 1
          fi

          for file in "${php_files[@]}"; do
            php -l "$file"
          done

      - name: Run full foundation regression
        run: composer test
