# Sprint54 bounded successor bridge — Lab | zefry
name: Sprint53 JRN-010 Prerequisite Shift Opening Cash Evidence Regression

# Author by Lab | zefry

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sprint53-jrn010-prerequisite-shift-opening-cash-evidence-regression.yml'
      - 'apps/web/app/Application/Authorization/PosPermission.php'
      - 'apps/web/app/Application/Pos/RecordShiftOpeningCash.php'
      - 'apps/web/app/Application/Pos/ShiftOpeningCashCommand.php'
      - 'apps/web/app/Application/Pos/ShiftOpeningCashRepository.php'
      - 'apps/web/app/Application/Pos/ShiftOpeningCashResult.php'
      - 'apps/web/app/Delivery/Http/Pos/PosShiftOpeningCashController.php'
      - 'apps/web/app/Infrastructure/Pos/LaravelShiftOpeningCashRepository.php'
      - 'apps/web/app/Providers/AppServiceProvider.php'
      - 'apps/web/config/oneqay.php'
      - 'apps/web/database/migrations/0000_00_00_000022_create_pos_shift_opening_cash_evidence_foundation.php'
      - 'apps/web/routes/web.php'
      - 'apps/web/tests/pos-shift-opening-cash-durable.php'
      - 'docs/JRN_010_PREREQUISITE_POS_BOUNDED_SHIFT_OPENING_CASH_EVIDENCE_FOUNDATION.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint53-jrn010-opening-cash-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sprint53-jrn010-opening-cash:
    name: sprint53-jrn010-opening-cash
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:cXFxcXFxcXFxcXFxcXFxcXFxcXFxcXFxcXFxcXFxcXE=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      ONEQAY_PERSISTENCE_ENABLED: 'true'
      ONEQAY_AUTHENTICATION_SESSION_CONTROL_ENABLED: 'true'
      ONEQAY_POS_SHIFT_OPENING_ENABLED: 'true'
      ONEQAY_POS_SHIFT_OPENING_CASH_EVIDENCE_ENABLED: 'true'
      ONEQAY_POS_SALE_COMPLETION_ENABLED: 'true'
      ONEQAY_POS_SALE_VOID_ENABLED: 'true'
      ONEQAY_POS_SALE_CASH_REFUND_ENABLED: 'true'
      ONEQAY_POS_CATALOG_PREPARATION_ENABLED: 'true'
      ONEQAY_POS_INVENTORY_BASELINE_ENABLED: 'true'
      SESSION_DRIVER: array
      CACHE_STORE: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce exact Sprint53 source envelope or bounded Sprint54 successor
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$base" "$head" | sort > /tmp/s53-source-paths
          count="$(wc -l < /tmp/s53-source-paths)"
          fingerprint="$(sha256sum /tmp/s53-source-paths | awk '{print $1}')"
          echo 'ONEQAY_SPRINT54_JRN010_PREREQ_SOURCE_SUCCESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT53_WORKFLOW_BRIDGE=false' >> "$GITHUB_ENV"

          isolate_sprint74_migration_successors() {
            for index in $(seq 23 25); do
              migration="$(find apps/web/database/migrations -maxdepth 1 -type f -name "$(printf '0000_00_00_%06d_*' "$index")" -print -quit)"
              if [[ -n "$migration" && -f "$migration" ]]; then
                git update-index --assume-unchanged "$migration"
                rm -f "$migration"
              fi
            done
          }

          if [[ "$count" -eq 6 && "$fingerprint" == 'cc40f08beda780e4aa4795f29aa7533bbde1029d11855d43f180812502c4d80b' ]]; then
            for expected in \
              '.github/workflows/sprint69-jrn010-prerequisite-cash-variance-explanation-source-regression.yml' \
              'apps/web/app/Application/Authorization/PosPermission.php' \
              'apps/web/app/Application/Pos/RecordCashVarianceExplanation.php' \
              'apps/web/tests/pos-cash-variance-explanation-authorization.php' \
              'apps/web/tests/pos-cash-variance-explanation-durable.php' \
              'docs/JRN_010_PREREQUISITE_CASH_VARIANCE_EXPLANATION_AUTHORIZATION_SOURCE_FOUNDATION.md' \
            do
              grep -Fxq "$expected" /tmp/s53-source-paths
            done
            isolate_sprint74_migration_successors
            echo 'Recognized exact Sprint74 authorization source successor shape at migration #22 horizon.'
          elif [[ "$count" -eq 8 && "$fingerprint" == '3e5b516b17bfc4b2b4e8694248672ff7a4298a3e080e0617a70b1bb1d8aa6194' ]]; then
            for expected in \
              '.github/workflows/sprint46-jrn006-durable-sale-completion-regression.yml' \
              '.github/workflows/sprint47-jrn004-catalog-preparation-regression.yml' \
              '.github/workflows/sprint48-jrn005-shift-register-opening-regression.yml' \
              '.github/workflows/sprint50-jrn007-completed-sale-void-regression.yml' \
              '.github/workflows/sprint51-jrn008-bounded-outlet-inventory-baseline-regression.yml' \
              '.github/workflows/sprint52-jrn007-bounded-full-cash-refund-regression.yml' \
              '.github/workflows/sprint53-jrn010-prerequisite-shift-opening-cash-evidence-regression.yml' \
              '.github/workflows/sprint54-jrn010-prerequisite-shift-closing-cash-evidence-regression.yml' \
            do
              grep -Fxq "$expected" /tmp/s53-source-paths
            done
            isolate_sprint74_migration_successors
            echo 'Recognized exact Sprint74 POS historical compatibility self-qualification shape at migration #22 horizon.'
          elif [[ "$count" -eq 1 && "$fingerprint" == '60da6bcaf9c659bf159316880fcd674036e68bdb51aa257befb717817713a702' ]]; then
            grep -Fxq '.github/workflows/sprint53-jrn010-prerequisite-shift-opening-cash-evidence-regression.yml' /tmp/s53-source-paths
            echo 'ONEQAY_SPRINT53_WORKFLOW_BRIDGE=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint53 dedicated-workflow Sprint54 compatibility bridge.'
          elif [[ "$count" -eq 14 && "$fingerprint" == '1d75fe26236e2bb56c113713e878e81d3df72cee9aa647b3f7759b9d1bec9164' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s53-source-paths)" -eq 1
            grep -Fxq 'apps/web/database/migrations/0000_00_00_000022_create_pos_shift_opening_cash_evidence_foundation.php' /tmp/s53-source-paths
            echo 'Recognized exact Sprint53 opening-cash source envelope.'
          elif [[ "$count" -eq 14 && "$fingerprint" == 'a0914d7db5c1636e909e331e8b72653bc9814eb74e3a3823d7db36bd3b73b624' ]]; then
            test "$(grep -c '^apps/web/database/migrations/' /tmp/s53-source-paths)" -eq 1
            grep -Fxq 'apps/web/database/migrations/0000_00_00_000023_create_pos_shift_closing_cash_evidence_foundation.php' /tmp/s53-source-paths
            echo 'ONEQAY_SPRINT54_JRN010_PREREQ_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint54 closing-cash source successor envelope.'
          else
            echo 'Sprint53/Sprint54 exact source envelope mismatch.' >&2
            exit 1
          fi

          ! grep -Eq '(^|/)(composer\.(json|lock)|package(-lock)?\.json|\.env(\.|$))' /tmp/s53-source-paths

      - name: Preserve migration horizon and validate Sprint53 opening-cash migration
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          migration22='apps/web/database/migrations/0000_00_00_000022_create_pos_shift_opening_cash_evidence_foundation.php'
          migration23='apps/web/database/migrations/0000_00_00_000023_create_pos_shift_closing_cash_evidence_foundation.php'

          if [[ "${ONEQAY_SPRINT54_JRN010_PREREQ_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
            test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 1
            printf '%s\n' "$changed" | grep -Fxq "$migration23"
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration23"
            test -f "$migration22"
            test -f "$migration23"
            mapfile -t migrations < <(find apps/web/database/migrations -maxdepth 1 -type f -name '*.php' -printf '%f\n' | sort)
            test "${#migrations[@]}" -eq 23
            for index in $(seq 1 23); do
              prefix="$(printf '0000_00_00_%06d_' "$index")"
              test "$(printf '%s\n' "${migrations[@]}" | grep -c "^$prefix")" -eq 1
            done
          else
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration22"
            mapfile -t migrations < <(find apps/web/database/migrations -maxdepth 1 -type f -name '*.php' -printf '%f\n' | sort)
            test "${#migrations[@]}" -eq 22
            for index in $(seq 1 22); do
              prefix="$(printf '0000_00_00_%06d_' "$index")"
              test "$(printf '%s\n' "${migrations[@]}" | grep -c "^$prefix")" -eq 1
            done
          fi

          grep -Fq "Schema::create('oneqay_pos_shift_opening_cash_evidence'" "$migration22"
          grep -Fq "unique(['tenant_id', 'operation_id']" "$migration22"
          grep -Fq "unique(['tenant_id', 'shift_id']" "$migration22"
          grep -Fq "foreign(['tenant_id', 'shift_id']" "$migration22"
          grep -Fq "on('oneqay_pos_shifts')" "$migration22"
          grep -Fq "throw new LogicException('Forward-only generated migration; rollback is not authorized.');" "$migration22"

      - name: Validate authorization and delivery locks
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "public const RECORD_SHIFT_OPENING_CASH = 'pos.shift.opening-cash.record';" apps/web/app/Application/Authorization/PosPermission.php
          grep -Fq "env('ONEQAY_POS_SHIFT_OPENING_CASH_EVIDENCE_ENABLED', false)" apps/web/config/oneqay.php
          grep -Fq "config('oneqay.pos_shift_opening_cash_evidence.enabled', false)" apps/web/routes/web.php
          grep -Fq "Route::post('/pos/shifts/opening-cash'" apps/web/routes/web.php
          grep -Fq "'session.active'" apps/web/routes/web.php
          grep -Fq 'RequirePosSessionContextMiddleware::class' apps/web/routes/web.php
          grep -Fq "table('oneqay_pos_shift_opening_cash_evidence')" apps/web/app/Infrastructure/Pos/LaravelShiftOpeningCashRepository.php
          grep -Fq "table('oneqay_pos_shifts')" apps/web/app/Infrastructure/Pos/LaravelShiftOpeningCashRepository.php
          grep -Fq "where('active_slot', 1)" apps/web/app/Infrastructure/Pos/LaravelShiftOpeningCashRepository.php
          grep -Fq 'OPERATOR_OBSERVED_OPENING_CASH' apps/web/app/Infrastructure/Pos/LaravelShiftOpeningCashRepository.php
          ! grep -Fq "update(['active_slot'" apps/web/app/Infrastructure/Pos/LaravelShiftOpeningCashRepository.php
          ! grep -Fq "table('oneqay_pos_sales')" apps/web/app/Infrastructure/Pos/LaravelShiftOpeningCashRepository.php
          ! grep -Fq "table('oneqay_pos_sale_cash_refunds')" apps/web/app/Infrastructure/Pos/LaravelShiftOpeningCashRepository.php
          ! grep -Fq "table('oneqay_pos_sale_catalog_items')" apps/web/app/Infrastructure/Pos/LaravelShiftOpeningCashRepository.php

      - name: Preserve Application framework independence
        shell: bash
        run: |
          set -euo pipefail
          if grep -n -F -e 'Illuminate\' -e 'Laravel\' -e 'Schema::' -e 'DB::' \
            apps/web/app/Application/Authorization/PosPermission.php \
            apps/web/app/Application/Pos/RecordShiftOpeningCash.php \
            apps/web/app/Application/Pos/ShiftOpeningCashCommand.php \
            apps/web/app/Application/Pos/ShiftOpeningCashRepository.php \
            apps/web/app/Application/Pos/ShiftOpeningCashResult.php; then
            echo 'Sprint53 opening-cash Application framework boundary violated.' >&2
            exit 1
          fi

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find apps/web/app apps/web/database/migrations apps/web/routes apps/web/tests -type f -name '*.php' -print0 |
            while IFS= read -r -d '' file; do php -l "$file"; done

      - name: Install locked dependencies
        working-directory: apps/web
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Reject High or Critical Composer advisories
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          composer audit --locked --format=json > /tmp/oneqay-composer-audit.json
          php -r '
            $data = json_decode(file_get_contents("/tmp/oneqay-composer-audit.json"), true, 512, JSON_THROW_ON_ERROR);
            foreach (($data["advisories"] ?? []) as $items) {
                foreach ($items as $item) {
                    if (in_array(strtolower((string) ($item["severity"] ?? "")), ["high", "critical"], true)) {
                        fwrite(STDERR, "Blocking Composer advisory.\n");
                        exit(1);
                    }
                }
            }
          '

      - name: Run Sprint53 durable opening-cash evidence regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          migration23='database/migrations/0000_00_00_000023_create_pos_shift_closing_cash_evidence_foundation.php'
          backup23='/tmp/oneqay-s53-s54-migration23-opening.php'
          restore() { [[ ! -f "$backup23" ]] || mv "$backup23" "$migration23"; }
          trap restore EXIT
          if [[ -f "$migration23" ]]; then
            cp "$migration23" "$backup23"
            rm -f "$migration23"
          fi
          php tests/pos-shift-opening-cash-durable.php
          restore
          trap - EXIT

      - name: Preserve Sprint52 full CASH refund regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          migrations=(
            database/migrations/0000_00_00_000022_create_pos_shift_opening_cash_evidence_foundation.php
            database/migrations/0000_00_00_000023_create_pos_shift_closing_cash_evidence_foundation.php
          )
          backups=()
          restore() {
            for index in "${!migrations[@]}"; do
              [[ ! -f "${backups[$index]:-}" ]] || mv "${backups[$index]}" "${migrations[$index]}"
            done
          }
          trap restore EXIT
          for index in "${!migrations[@]}"; do
            if [[ -f "${migrations[$index]}" ]]; then
              backup="/tmp/oneqay-s53-s54-refund-$index.php"
              cp "${migrations[$index]}" "$backup"
              backups[$index]="$backup"
              rm -f "${migrations[$index]}"
            else
              backups[$index]=''
            fi
          done
          php tests/pos-sale-cash-refund-durable.php
          restore
          trap - EXIT

      - name: Preserve Sprint51 inventory baseline regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          migrations=(
            database/migrations/0000_00_00_000021_create_pos_sale_cash_refund_foundation.php
            database/migrations/0000_00_00_000022_create_pos_shift_opening_cash_evidence_foundation.php
            database/migrations/0000_00_00_000023_create_pos_shift_closing_cash_evidence_foundation.php
          )
          backups=()
          restore() {
            for index in "${!migrations[@]}"; do
              [[ ! -f "${backups[$index]:-}" ]] || mv "${backups[$index]}" "${migrations[$index]}"
            done
          }
          trap restore EXIT
          for index in "${!migrations[@]}"; do
            if [[ -f "${migrations[$index]}" ]]; then
              backup="/tmp/oneqay-s53-s54-inventory-$index.php"
              cp "${migrations[$index]}" "$backup"
              backups[$index]="$backup"
              rm -f "${migrations[$index]}"
            else
              backups[$index]=''
            fi
          done
          php tests/pos-inventory-baseline-durable.php
          restore
          trap - EXIT

      - name: Preserve Sprint48 shift opening regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          migrations=(
            database/migrations/0000_00_00_000019_create_pos_sale_void_foundation.php
            database/migrations/0000_00_00_000020_create_pos_inventory_baseline_foundation.php
            database/migrations/0000_00_00_000021_create_pos_sale_cash_refund_foundation.php
            database/migrations/0000_00_00_000022_create_pos_shift_opening_cash_evidence_foundation.php
            database/migrations/0000_00_00_000023_create_pos_shift_closing_cash_evidence_foundation.php
          )
          backups=()
          restore() {
            for index in "${!migrations[@]}"; do
              [[ ! -f "${backups[$index]}" ]] || mv "${backups[$index]}" "${migrations[$index]}"
            done
          }
          trap restore EXIT
          for index in "${!migrations[@]}"; do
            backup="/tmp/oneqay-s53-shift-$index.php"
            if [[ -f "${migrations[$index]}" ]]; then
              cp "${migrations[$index]}" "$backup"
              backups+=("$backup")
              rm -f "${migrations[$index]}"
            else
              backups+=('')
            fi
          done
          php tests/pos-shift-opening-durable.php
          restore
          trap - EXIT

      - name: Preserve tracked source cleanliness
        run: git diff --exit-code
