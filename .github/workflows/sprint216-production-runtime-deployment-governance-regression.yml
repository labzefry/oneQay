# Author by Lab | zefry
name: Sprint216 Production Runtime Deployment Governance Regression
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sprint216-production-runtime-deployment-governance-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      APP_DEBUG: "false"
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      SESSION_DRIVER: array
      CACHE_STORE: array
      LOG_CHANNEL: stderr
      ONEQAY_BUILD_PROVENANCE: github-actions:${{ github.run_id }}:${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha || github.sha }}"}
      - name: Exact envelope
        if: github.event_name == 'pull_request' && github.head_ref == 'sprint216-production-release-deployment-governance-foundation'
        env: {EXPECTED_PATH_HASH: f5a80743fd99eb2160c801cfa9ecd25d529b2a8b1d985f41ec61da2e4095c8a0}
        run: |
          set -euo pipefail
          mapfile -t paths < <(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | LC_ALL=C sort)
          test "${#paths[@]}" -eq 20
          test "$(printf '%s\n' "${paths[@]}" | sha256sum | awk '{print $1}')" = "$EXPECTED_PATH_HASH"
      - name: Preserve NO-GO
        run: |
          set -euo pipefail
          test "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" = NOT_EXECUTED
          test "$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)" = NONE
          test "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" = INACTIVE
          test "$(jq -r '.deployment_authority' ops/final-shift-close/STATE.json)" = NOT_GRANTED
          test "$(jq -r '.technical_preview_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
          test "$(jq -r '.production_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with: {php-version: '8.3', extensions: pdo_mysql, tools: composer:v2, coverage: none}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with: {node-version: 24.19.0}
      - name: Lint contracts
        run: |
          set -euo pipefail
          php -l apps/web/app/Infrastructure/Runtime/GovernedBusinessRuntimePolicy.php
          php -l apps/web/app/Infrastructure/Configuration/CriticalConfiguration.php
          php -l apps/web/config/oneqay.php
          php -l apps/web/routes/web.php
          php -l apps/web/tests/governed-business-runtime-policy.php
          php -l tools/validate-production-release-manifest.php
          php -l tools/prepare-production-deployment-authority-request.php
          php -l tools/qualify-production-deployment-authority.php
          php -l tools/prepare-production-deployment-plan.php
          php -l tools/qualify-production-deployment-evidence.php
          bash -n tools/build-production-release.sh
          jq -e '.contract_state == "SOURCE_READY_PRODUCTION_RUNTIME_AND_DEPLOYMENT_GOVERNANCE_NOT_DEPLOYED_NOT_ACTIVATED"' ops/final-shift-close/PRODUCTION_RELEASE_DEPLOYMENT_GOVERNANCE_CONTRACT.json
          jq -e '.properties.release.properties.channel.const == "PRODUCTION_CANDIDATE"' release/production-manifest-v1.schema.json
          jq -e '.properties.production_traffic_activation_allowed.const == false' tools/deployment/production-deployment-authority.schema.json
      - name: Runtime fail closed
        run: |
          set -euo pipefail
          php apps/web/tests/governed-business-runtime-policy.php
          grep -Fq 'GovernedBusinessRuntimePolicy::allows' apps/web/routes/web.php
          grep -Fq 'ONEQAY_GOVERNED_BUSINESS_RUNTIME_ENABLED' apps/web/config/oneqay.php
      - name: Install dependencies
        run: |
          set -euo pipefail
          composer validate --strict --no-check-publish
          composer test
          cd apps/web
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          npm ci --ignore-scripts --no-fund
          npm run type-check
          npm run build
      - name: Production artifact deterministic
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          bash tools/build-production-release.sh "$HEAD_SHA"
          id="production-${HEAD_SHA:0:12}"
          cp "dist/${id}.manifest.json" /tmp/prod-manifest.json
          cp "dist/${id}.tar.gz.sha256" /tmp/prod-sha
          rm -rf dist
          bash tools/build-production-release.sh "$HEAD_SHA"
          diff -u /tmp/prod-manifest.json "dist/${id}.manifest.json"
          diff -u /tmp/prod-sha "dist/${id}.tar.gz.sha256"
      - name: Same-source staging remains buildable
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          rm -rf dist
          bash tools/build-durable-staging-release.sh "$HEAD_SHA"
          id="durable-staging-${HEAD_SHA:0:12}"
          php tools/validate-durable-staging-release-manifest.php "dist/${id}.manifest.json" "dist/${id}.tar.gz"
      - name: No automatic Production activation
        run: |
          set -euo pipefail
          ! grep -R -E 'Artisan::call|php artisan migrate' tools/build-production-release.sh tools/prepare-production-deployment-authority-request.php tools/qualify-production-deployment-authority.php tools/prepare-production-deployment-plan.php tools/qualify-production-deployment-evidence.php
          jq -e '.production_promotion.migration_execution_allowed == false' ops/final-shift-close/PRODUCTION_RELEASE_DEPLOYMENT_GOVERNANCE_CONTRACT.json
          jq -e '.production_promotion.production_traffic_activation_allowed == false' ops/final-shift-close/PRODUCTION_RELEASE_DEPLOYMENT_GOVERNANCE_CONTRACT.json
      - name: Clean
        run: |
          rm -rf dist
          git diff --exit-code
          test -z "$(git status --porcelain)"
