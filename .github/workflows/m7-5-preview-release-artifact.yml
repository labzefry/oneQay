name: M7.5 Technical Preview Release Artifact

# Attribution: Lab | zefry
# Sprint40 Sprint38/Sprint39 historical fixture isolation anchor.
# Sprint40 Sprint37 same-step successor-state correction anchor.
# Sprint40 Sprint38 same-step successor-state correction anchor.
# Sprint40 19-workflow historical preservation compatibility anchor.
# Sprint40 19-workflow preservation-horizon bridge anchor.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'release/manifest-v1.schema.json'
      - 'tools/build-m7-5-preview-release.sh'
      - 'tools/validate-release-manifest.php'
      - '.github/workflows/m7-5-preview-release-artifact.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'release/manifest-v1.schema.json'
      - 'tools/build-m7-5-preview-release.sh'
      - 'tools/validate-release-manifest.php'
      - '.github/workflows/m7-5-preview-release-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m7-5-preview-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview-release-artifact:
    name: m7-5-preview-release-artifact
    runs-on: ubuntu-latest
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      ONEQAY_TECHNICAL_PREVIEW_ENABLED: 'true'
      SESSION_DRIVER: array
      CACHE_STORE: array
      LOG_CHANNEL: stderr

    steps:
      - name: Checkout exact governed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve Sprint40 historical compatibility closure
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'bde0c14f6b8c45f090844b9e5d701415690e990b8b7bea3b605f4ba04c727116' .github/workflows/sprint33-recovery-bound-password-reset-regression.yml
          grep -Fq 'bde0c14f6b8c45f090844b9e5d701415690e990b8b7bea3b605f4ba04c727116' .github/workflows/sprint34-authenticated-password-change-regression.yml

      - name: Recognize exact Sprint35 and Sprint36 bounded successors
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "main"
          git diff --name-only "origin/main...HEAD" | sort > /tmp/s35-successor-files.txt
          count="$(wc -l < /tmp/s35-successor-files.txt)"
          fingerprint="$(sha256sum /tmp/s35-successor-files.txt | awk '{print $1}')"
          if [[ "$count" -eq 17 && "$fingerprint" == 'e889db1c7eaa22b3ed008f8781ab35652ca950a3f009c309e5c478d01d368f11' ]] || [[ "$count" -eq 18 && "$fingerprint" == '25dbbd94087eba4157fa9c209f09174a127154a98067abbfbeec233bbe9398cd' ]] || [[ "$count" -eq 23 && "$fingerprint" == 'ea735f8f5ee06d480863f9d1ba7ae58a91642109963c3f340e8453f3205bb7ae' ]] || [[ "$count" -eq 19 && "$fingerprint" == 'fc2b578fc9d090dfce1fd34c5acfa7a07f065979a94f62becb3dc54dee664920' ]] || [[ "$count" -eq 11 && "$fingerprint" == 'a221779e05b1e8ab220610b5068be5d1eb01bc08b516b338ba8f22373e7d89d0' ]] || [[ "$count" -eq 10 && "$fingerprint" == '411950d5602dc7160668c88e08a3941ebccc8bdc82d20bee77ce4004f039d216' ]] || [[ "$count" -eq 7 && "$fingerprint" == '4784ffca1c940d3fa54a2a3988ead07e2de993bde8d3af2bd41014dbdf905be0' ]] || [[ "$count" -eq 8 && "$fingerprint" == '2cfc92c34f46375b11bf3fe92f9094cefa598d234133847fdd6629be211f12c4' ]] || [[ "$count" -eq 6 && "$fingerprint" == '671946562a3eef1375d87b70936bac263aa18f660d6ea274406ed57f1c653351' ]] || [[ "$count" -eq 8 && "$fingerprint" == 'a9caf2b68210a38687fee543256aec04dc1e67ee1ef403608f7db69139957ff8' ]]; then
          echo 'ONEQAY_SPRINT35_SUCCESSOR=true' >> "$GITHUB_ENV"
          if [[ -f 'apps/web/database/migrations/0000_00_00_000010_create_identity_recovery_codes.php' ]]; then
            git update-index --assume-unchanged 'apps/web/database/migrations/0000_00_00_000010_create_identity_recovery_codes.php'
            rm -f 'apps/web/database/migrations/0000_00_00_000010_create_identity_recovery_codes.php'
          fi
          if [[ -f 'apps/web/database/migrations/0000_00_00_000011_add_credential_epoch_to_identity_password_credentials.php' ]]; then
            git update-index --assume-unchanged 'apps/web/database/migrations/0000_00_00_000011_add_credential_epoch_to_identity_password_credentials.php'
            rm -f 'apps/web/database/migrations/0000_00_00_000011_add_credential_epoch_to_identity_password_credentials.php'
          fi
          if [[ -f 'apps/web/database/migrations/0000_00_00_000012_add_totp_factor_epoch_and_recovery_authority.php' ]]; then
            git update-index --assume-unchanged 'apps/web/database/migrations/0000_00_00_000012_add_totp_factor_epoch_and_recovery_authority.php'
            rm -f 'apps/web/database/migrations/0000_00_00_000012_add_totp_factor_epoch_and_recovery_authority.php'
          fi
          if [[ -f 'apps/web/database/migrations/0000_00_00_000013_create_first_party_session_authority.php' ]]; then
            git update-index --assume-unchanged 'apps/web/database/migrations/0000_00_00_000013_create_first_party_session_authority.php'
            rm -f 'apps/web/database/migrations/0000_00_00_000013_create_first_party_session_authority.php'
          fi
          if [[ -f 'apps/web/database/migrations/0000_00_00_000014_add_first_party_authentication_eligibility_to_identities.php' ]]; then
            git update-index --assume-unchanged 'apps/web/database/migrations/0000_00_00_000014_add_first_party_authentication_eligibility_to_identities.php'
            rm -f 'apps/web/database/migrations/0000_00_00_000014_add_first_party_authentication_eligibility_to_identities.php'
          fi
          echo 'Exact Sprint35/Sprint36 successor or bounded correction envelope recognized; schema-free Preview preservation remains active.'
          else
            echo 'ONEQAY_SPRINT35_SUCCESSOR=false' >> "$GITHUB_ENV"
          fi

      - name: Isolate exact Sprint 32 or Sprint 33 recovery migration from NO_SCHEMA_CHANGE Preview regression
        if: env.ONEQAY_SPRINT35_SUCCESSOR != 'true'
        shell: bash
        run: |
          set -euo pipefail
          isolate=false
          recognized='none'
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            git fetch --no-tags origin "$GITHUB_BASE_REF"
            git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" | sort > /tmp/release-successor-files.txt
            count="$(wc -l < /tmp/release-successor-files.txt)"
            fingerprint="$(sha256sum /tmp/release-successor-files.txt | awk '{print $1}')"
            if [[ "$count" -eq 35 ]] && [[ "$fingerprint" == 'e3b724002cfc0be1ef890d1b5594a2a5179123f949f6f486354e21950c7328eb' ]]; then
              isolate=true
              recognized='Sprint 34'
              echo 'ONEQAY_SPRINT34_SUCCESSOR=true' >> "$GITHUB_ENV"
            fi
            if [[ "$count" -eq 39 ]] && [[ "$fingerprint" == '04a1177c12712183a7dda4ae81be1356c0e41294533336c9f999d376c224712a' ]]; then
              isolate=true
              recognized='Sprint 33'
            elif [[ "$count" -eq 32 ]] && [[ "$fingerprint" == 'db230ab3b77fff67f0bd12d7d7b615146d9d9df9a0af12014214e1862e9f6867' ]]; then
              isolate=true
              recognized='Sprint 32'
            fi
          elif [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            before="$(python3 -c 'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"])).get("before", ""))')"
            if [[ -n "$before" ]] && [[ "$before" != '0000000000000000000000000000000000000000' ]]; then
              git diff --name-only "$before...HEAD" | sort > /tmp/release-successor-files.txt
              count="$(wc -l < /tmp/release-successor-files.txt)"
              fingerprint="$(sha256sum /tmp/release-successor-files.txt | awk '{print $1}')"
              if [[ "$count" -eq 35 ]] && [[ "$fingerprint" == 'e3b724002cfc0be1ef890d1b5594a2a5179123f949f6f486354e21950c7328eb' ]]; then
                isolate=true
                recognized='Sprint 34'
                echo 'ONEQAY_SPRINT34_SUCCESSOR=true' >> "$GITHUB_ENV"
              fi
              if [[ "$count" -eq 39 ]] && [[ "$fingerprint" == '04a1177c12712183a7dda4ae81be1356c0e41294533336c9f999d376c224712a' ]]; then
                isolate=true
                recognized='Sprint 33'
              elif [[ "$count" -eq 32 ]] && [[ "$fingerprint" == 'db230ab3b77fff67f0bd12d7d7b615146d9d9df9a0af12014214e1862e9f6867' ]]; then
                isolate=true
                recognized='Sprint 32'
              fi
            fi
          fi
          if [[ "$isolate" == 'true' ]]; then
            git update-index --assume-unchanged apps/web/database/migrations/0000_00_00_000010_create_identity_recovery_codes.php
            rm -f apps/web/database/migrations/0000_00_00_000010_create_identity_recovery_codes.php
            if [[ "$recognized" == 'Sprint 34' ]]; then
              git update-index --assume-unchanged apps/web/database/migrations/0000_00_00_000011_add_credential_epoch_to_identity_password_credentials.php
              rm -f apps/web/database/migrations/0000_00_00_000011_add_credential_epoch_to_identity_password_credentials.php
            fi
            echo "Exact ${recognized} source envelope recognized; migration #10 is isolated only from the schema-free Technical Preview release regression."
          fi

      - name: Setup PHP 8.3 build runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup exact Node LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.19.0

      - name: Verify release source identity
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$source_sha"
          test "$(git status --porcelain)" = ""
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Validate Release Manifest v1 contract and negative cases
        run: php tools/validate-release-manifest.php --self-test

      - name: Preserve root Platform Foundation regression
        run: |
          composer validate --strict --no-check-publish
          composer test

      - name: Install locked production PHP dependencies
        working-directory: apps/web
        run: |
          composer validate --no-check-publish
          composer install \
            --no-dev \
            --no-interaction \
            --no-progress \
            --prefer-dist \
            --optimize-autoloader \
            --classmap-authoritative

      - name: Reject High or Critical Composer advisories
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          composer audit --locked --format=json > /tmp/oneqay-composer-audit.json || true
          php -r '$data=json_decode(file_get_contents("/tmp/oneqay-composer-audit.json"),true,512,JSON_THROW_ON_ERROR); foreach (($data["advisories"] ?? []) as $package=>$items) { foreach ($items as $item) { if (in_array(strtolower((string)($item["severity"] ?? "")), ["high","critical"], true)) { fwrite(STDERR,"Blocking Composer advisory for {$package}.\n"); exit(1); } } }'

      - name: Install locked frontend build dependencies
        working-directory: apps/web
        run: npm ci --ignore-scripts --no-fund

      - name: Reject High or Critical npm advisories
        working-directory: apps/web
        run: npm audit --audit-level=high

      - name: Type-check Vue and TypeScript
        working-directory: apps/web
        run: npm run type-check

      - name: Build Vite assets
        working-directory: apps/web
        run: npm run build

      - name: Run first-party Web regressions
        working-directory: apps/web
        run: |
          composer test
          php tests/tenant-isolation.php
          php tests/identity-org-context.php
          php tests/pos-core-synthetic.php
          php tests/technical-preview-interaction.php
          php tests/preview-background-execution.php

      - name: Verify bounded Preview background commands are registered
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php artisan list --raw > /tmp/oneqay-artisan-list.txt
          grep -F 'oneqay:preview-queue:enqueue' /tmp/oneqay-artisan-list.txt
          grep -F 'oneqay:preview-queue:work-one' /tmp/oneqay-artisan-list.txt
          grep -F 'oneqay:preview-queue:status' /tmp/oneqay-artisan-list.txt

      - name: Package deterministic governed Technical Preview release
        id: package
        shell: bash
        env:
          ONEQAY_BUILD_PROVENANCE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: bash tools/build-m7-5-preview-release.sh "${{ steps.source.outputs.source_sha }}"

      - name: Verify manifest binding, checksum, public/private, and no-schema-change boundaries
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            sha256sum -c "$(basename "${{ steps.package.outputs.checksum_path }}")"
          )
          php tools/validate-release-manifest.php \
            "${{ steps.package.outputs.manifest_path }}" \
            "${{ steps.package.outputs.archive_path }}"
          tar -tzf "${{ steps.package.outputs.archive_path }}" > /tmp/oneqay-release-list.txt
          grep -F "${{ steps.package.outputs.release_id }}/RELEASE.json" /tmp/oneqay-release-list.txt
          grep -F "${{ steps.package.outputs.release_id }}/public-surface/index.php" /tmp/oneqay-release-list.txt
          grep -F "${{ steps.package.outputs.release_id }}/apps/web/vendor/autoload.php" /tmp/oneqay-release-list.txt
          grep -F "${{ steps.package.outputs.release_id }}/apps/web/public/build/manifest.json" /tmp/oneqay-release-list.txt
          if grep -E '(^|/)(\.env|\.git)(/|$)|(^|/)(node_modules)(/|$)' /tmp/oneqay-release-list.txt; then
            echo 'Forbidden path found in release artifact.' >&2
            exit 1
          fi
          if grep -F '/apps/web/database/migrations/' /tmp/oneqay-release-list.txt; then
            echo 'Technical Preview artifact must not contain Sprint 19 durable migrations.' >&2
            exit 1
          fi
          if tar -xOzf "${{ steps.package.outputs.archive_path }}" "${{ steps.package.outputs.release_id }}/RELEASE.json" | \
            grep -Fq '"migration_classification": "NO_SCHEMA_CHANGE"'; then
            :
          else
            echo 'Technical Preview RELEASE.json lost NO_SCHEMA_CHANGE classification.' >&2
            exit 1
          fi

      - name: Prove deterministic runtime archive reproduction
        shell: bash
        env:
          ONEQAY_BUILD_PROVENANCE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          set -euo pipefail
          first_sha="${{ steps.package.outputs.artifact_sha256 }}"
          first_size="${{ steps.package.outputs.artifact_size }}"
          bash tools/build-m7-5-preview-release.sh "${{ steps.source.outputs.source_sha }}"
          second_sha="$(sha256sum "${{ steps.package.outputs.archive_path }}" | awk '{print $1}')"
          second_size="$(wc -c < "${{ steps.package.outputs.archive_path }}" | tr -d '[:space:]')"
          test "$second_sha" = "$first_sha"
          test "$second_size" = "$first_size"
          php tools/validate-release-manifest.php \
            "${{ steps.package.outputs.manifest_path }}" \
            "${{ steps.package.outputs.archive_path }}"
          tar -tzf "${{ steps.package.outputs.archive_path }}" > /tmp/oneqay-release-list-reproduced.txt
          if grep -F '/apps/web/database/migrations/' /tmp/oneqay-release-list-reproduced.txt; then
            echo 'Reproduced Technical Preview artifact unexpectedly contains durable migrations.' >&2
            exit 1
          fi

      - name: Upload governed Technical Preview release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oneqay-${{ steps.package.outputs.release_id }}
          path: |
            ${{ steps.package.outputs.archive_path }}
            ${{ steps.package.outputs.manifest_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Confirm tracked source remains unchanged
        shell: bash
        run: git diff --exit-code