name: M7.5 Technical Preview Release Artifact

# Attribution: Lab | zefry
# Historical Sprint 33 fingerprint: 04a1177c12712183a7dda4ae81be1356c0e41294533336c9f999d376c224712a
# Sprint 34 fingerprint: e3b724002cfc0be1ef890d1b5594a2a5179123f949f6f486354e21950c7328eb

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'release/manifest-v1.schema.json'
      - 'tools/build-m7-5-preview-release.sh'
      - 'tools/validate-release-manifest.php'
      - '.github/workflows/m7-5-preview-release-artifact.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'release/manifest-v1.schema.json'
      - 'tools/build-m7-5-preview-release.sh'
      - 'tools/validate-release-manifest.php'
      - '.github/workflows/m7-5-preview-release-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m7-5-preview-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview-release-artifact:
    name: m7-5-preview-release-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      ONEQAY_TECHNICAL_PREVIEW_ENABLED: 'true'
      ONEQAY_PERSISTENCE_ENABLED: 'false'
      SESSION_DRIVER: array
      CACHE_STORE: array
      LOG_CHANNEL: stderr

    steps:
      - name: Checkout exact governed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Isolate exact Sprint 34 schema source from NO_SCHEMA_CHANGE artifact
        shell: bash
        run: |
          set -euo pipefail
          matched=false
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            git fetch --no-tags origin "$GITHUB_BASE_REF"
            base="origin/$GITHUB_BASE_REF"
            git diff --name-only "$base...HEAD" | sort > /tmp/release-s34-files.txt
            if [[ "$(wc -l < /tmp/release-s34-files.txt)" -eq 35 ]] && [[ "$(sha256sum /tmp/release-s34-files.txt | awk '{print $1}')" == 'e3b724002cfc0be1ef890d1b5594a2a5179123f949f6f486354e21950c7328eb' ]]; then
              test "$(git rev-parse "$base")" = '8b4fc5425ba8d98f35f02c39bd1880ce50c4759b'
              matched=true
            fi
          elif [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            before="$(python3 -c 'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"])).get("before", ""))')"
            if [[ -n "$before" ]] && [[ "$before" != '0000000000000000000000000000000000000000' ]]; then
              git diff --name-only "$before...HEAD" | sort > /tmp/release-s34-files.txt
              if [[ "$(wc -l < /tmp/release-s34-files.txt)" -eq 35 ]] && [[ "$(sha256sum /tmp/release-s34-files.txt | awk '{print $1}')" == 'e3b724002cfc0be1ef890d1b5594a2a5179123f949f6f486354e21950c7328eb' ]]; then
                matched=true
              fi
            fi
          fi
          if [[ "$matched" == 'true' ]]; then
            git update-index --assume-unchanged apps/web/database/migrations/0000_00_00_000010_create_identity_recovery_codes.php
            git update-index --assume-unchanged apps/web/database/migrations/0000_00_00_000011_add_credential_epoch_to_identity_password_credentials.php
            rm -f apps/web/database/migrations/0000_00_00_000010_create_identity_recovery_codes.php
            rm -f apps/web/database/migrations/0000_00_00_000011_add_credential_epoch_to_identity_password_credentials.php
          fi

      - name: Setup PHP 8.3 build runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup exact Node LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.19.0

      - name: Verify release source identity
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$source_sha"
          test "$(git status --porcelain)" = ""
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Validate Release Manifest v1 contract and negative cases
        run: php tools/validate-release-manifest.php --self-test

      - name: Preserve root Platform Foundation regression
        run: |
          composer validate --strict --no-check-publish
          composer test

      - name: Install locked production dependencies
        working-directory: apps/web
        run: |
          composer validate --no-check-publish
          composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader --classmap-authoritative
          npm ci --ignore-scripts --no-fund
          npm audit --audit-level=high
          npm run type-check
          npm run build

      - name: Run first-party Web regressions
        working-directory: apps/web
        run: |
          composer test
          php tests/tenant-isolation.php
          php tests/identity-org-context.php
          php tests/pos-core-synthetic.php
          php tests/technical-preview-interaction.php
          php tests/preview-background-execution.php

      - name: Package deterministic governed Technical Preview release
        id: package
        shell: bash
        env:
          ONEQAY_BUILD_PROVENANCE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: bash tools/build-m7-5-preview-release.sh "${{ steps.source.outputs.source_sha }}"

      - name: Verify manifest checksum and no-schema-change boundaries
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c "$(basename "${{ steps.package.outputs.checksum_path }}")")
          php tools/validate-release-manifest.php "${{ steps.package.outputs.manifest_path }}" "${{ steps.package.outputs.archive_path }}"
          tar -tzf "${{ steps.package.outputs.archive_path }}" > /tmp/oneqay-release-list.txt
          grep -F "${{ steps.package.outputs.release_id }}/RELEASE.json" /tmp/oneqay-release-list.txt
          grep -F "${{ steps.package.outputs.release_id }}/public-surface/index.php" /tmp/oneqay-release-list.txt
          grep -F "${{ steps.package.outputs.release_id }}/apps/web/vendor/autoload.php" /tmp/oneqay-release-list.txt
          grep -F "${{ steps.package.outputs.release_id }}/apps/web/public/build/manifest.json" /tmp/oneqay-release-list.txt
          if grep -E '(^|/)(\.env|\.git)(/|$)|(^|/)node_modules(/|$)' /tmp/oneqay-release-list.txt; then exit 1; fi
          if grep -F '/apps/web/database/migrations/' /tmp/oneqay-release-list.txt; then exit 1; fi
          tar -xOzf "${{ steps.package.outputs.archive_path }}" "${{ steps.package.outputs.release_id }}/RELEASE.json" | grep -Fq '"migration_classification": "NO_SCHEMA_CHANGE"'

      - name: Prove deterministic runtime archive reproduction
        shell: bash
        env:
          ONEQAY_BUILD_PROVENANCE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          set -euo pipefail
          first_sha="${{ steps.package.outputs.artifact_sha256 }}"
          first_size="${{ steps.package.outputs.artifact_size }}"
          bash tools/build-m7-5-preview-release.sh "${{ steps.source.outputs.source_sha }}"
          test "$(sha256sum "${{ steps.package.outputs.archive_path }}" | awk '{print $1}')" = "$first_sha"
          test "$(wc -c < "${{ steps.package.outputs.archive_path }}" | tr -d '[:space:]')" = "$first_size"
          if tar -tzf "${{ steps.package.outputs.archive_path }}" | grep -F '/apps/web/database/migrations/'; then exit 1; fi

      - name: Upload governed Technical Preview release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oneqay-${{ steps.package.outputs.release_id }}
          path: |
            ${{ steps.package.outputs.archive_path }}
            ${{ steps.package.outputs.manifest_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Confirm tracked source remains unchanged
        run: git diff --exit-code
