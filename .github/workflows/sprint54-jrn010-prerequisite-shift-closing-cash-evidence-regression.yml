      - name: Validate authorization and delivery locks
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "public const RECORD_SHIFT_CLOSING_CASH = 'pos.shift.closing-cash.record';" apps/web/app/Application/Authorization/PosPermission.php
          grep -Fq "env('ONEQAY_POS_SHIFT_CLOSING_CASH_EVIDENCE_ENABLED', false)" apps/web/config/oneqay.php
