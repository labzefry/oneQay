name: Sprint54 JRN-010 Prerequisite Shift Closing Cash Evidence Regression

# Author by Lab | zefry

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sprint54-jrn010-prerequisite-shift-closing-cash-evidence-regression.yml'
      - 'apps/web/app/Application/Authorization/PosPermission.php'
      - 'apps/web/app/Application/Pos/RecordShiftClosingCash.php'
      - 'apps/web/app/Application/Pos/ShiftClosingCashCommand.php'
      - 'apps/web/app/Application/Pos/ShiftClosingCashRepository.php'
      - 'apps/web/app/Application/Pos/ShiftClosingCashResult.php'
      - 'apps/web/app/Delivery/Http/Pos/PosShiftClosingCashController.php'
      - 'apps/web/app/Infrastructure/Pos/LaravelShiftClosingCashRepository.php'
      - 'apps/web/app/Providers/AppServiceProvider.php'
      - 'apps/web/config/oneqay.php'
      - 'apps/web/database/migrations/0000_00_00_000023_create_pos_shift_closing_cash_evidence_foundation.php'
      - 'apps/web/routes/web.php'
      - 'apps/web/tests/pos-shift-closing-cash-durable.php'
      - 'docs/JRN_010_PREREQUISITE_POS_BOUNDED_SHIFT_CLOSING_CASH_EVIDENCE_FOUNDATION.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint54-jrn010-closing-cash-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sprint54-jrn010-closing-cash:
    name: sprint54-jrn010-closing-cash
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:cXFxcXFxcXFxcXFxcXFxcXFxcXFxcXFxcXFxcXFxcXE=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      ONEQAY_PERSISTENCE_ENABLED: 'true'
      ONEQAY_AUTHENTICATION_SESSION_CONTROL_ENABLED: 'true'
      ONEQAY_POS_SHIFT_OPENING_ENABLED: 'true'
      ONEQAY_POS_SHIFT_OPENING_CASH_EVIDENCE_ENABLED: 'true'
      ONEQAY_POS_SHIFT_CLOSING_CASH_EVIDENCE_ENABLED: 'true'
      ONEQAY_POS_SALE_COMPLETION_ENABLED: 'true'
      ONEQAY_POS_SALE_VOID_ENABLED: 'true'
      ONEQAY_POS_SALE_CASH_REFUND_ENABLED: 'true'
      ONEQAY_POS_CATALOG_PREPARATION_ENABLED: 'true'
      ONEQAY_POS_INVENTORY_BASELINE_ENABLED: 'true'
      SESSION_DRIVER: array
      CACHE_STORE: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce exact Sprint54 source envelope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$base" "$head" | sort > /tmp/s54-source-paths
          test "$(wc -l < /tmp/s54-source-paths)" -eq 14
          test "$(sha256sum /tmp/s54-source-paths | awk '{print $1}')" = 'a0914d7db5c1636e909e331e8b72653bc9814eb74e3a3823d7db36bd3b73b624'
          test "$(grep -c '^apps/web/database/migrations/' /tmp/s54-source-paths)" -eq 1
          grep -Fxq 'apps/web/database/migrations/0000_00_00_000023_create_pos_shift_closing_cash_evidence_foundation.php' /tmp/s54-source-paths
          ! grep -Eq '(^|/)(composer\.(json|lock)|package(-lock)?\.json|\.env(\.|$))' /tmp/s54-source-paths

      - name: Preserve migrations one through twenty-two and validate migration twenty-three
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          migration='apps/web/database/migrations/0000_00_00_000023_create_pos_shift_closing_cash_evidence_foundation.php'
          git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration"
          mapfile -t migrations < <(find apps/web/database/migrations -maxdepth 1 -type f -name '*.php' -printf '%f\n' | sort)
          test "${#migrations[@]}" -eq 23
          for index in $(seq 1 23); do
            prefix="$(printf '0000_00_00_%06d_' "$index")"
            test "$(printf '%s\n' "${migrations[@]}" | grep -c "^$prefix")" -eq 1
          done
          grep -Fq "Schema::create('oneqay_pos_shift_closing_cash_evidence'" "$migration"
          grep -Fq "unique(['tenant_id', 'operation_id']" "$migration"
          grep -Fq "unique(['tenant_id', 'shift_id']" "$migration"
          grep -Fq "foreign(['tenant_id', 'shift_id']" "$migration"
          grep -Fq "on('oneqay_pos_shifts')" "$migration"
          grep -Fq "foreign(['tenant_id', 'opening_cash_evidence_id']" "$migration"
          grep -Fq "on('oneqay_pos_shift_opening_cash_evidence')" "$migration"
          grep -Fq "throw new LogicException('Forward-only generated migration; rollback is not authorized.');" "$migration"

      - name: Validate authorization and delivery locks
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "public const RECORD_SHIFT_CLOSING_CASH = 'pos.shift.closing-cash.record';" apps/web/app/Application/Authorization/PosPermission.php
          grep -Fq "env('ONEQAY_POS_SHIFT_CLOSING_CASH_EVIDENCE_ENABLED', false)" apps/web/config/oneqay.php
          grep -Fq "config('oneqay.pos_shift_closing_cash_evidence.enabled', false)" apps/web/routes/web.php
          grep -Fq "Route::post('/pos/shifts/closing-cash'" apps/web/routes/web.php
          grep -Fq "'session.active'" apps/web/routes/web.php
          grep -Fq 'RequirePosSessionContextMiddleware::class' apps/web/routes/web.php
          grep -Fq "table('oneqay_pos_shift_closing_cash_evidence')" apps/web/app/Infrastructure/Pos/LaravelShiftClosingCashRepository.php
          grep -Fq "table('oneqay_pos_shifts')" apps/web/app/Infrastructure/Pos/LaravelShiftClosingCashRepository.php
          grep -Fq "table('oneqay_pos_shift_opening_cash_evidence')" apps/web/app/Infrastructure/Pos/LaravelShiftClosingCashRepository.php
          grep -Fq "where('active_slot', 1)" apps/web/app/Infrastructure/Pos/LaravelShiftClosingCashRepository.php
          grep -Fq 'OPERATOR_OBSERVED_CLOSING_CASH' apps/web/app/Infrastructure/Pos/LaravelShiftClosingCashRepository.php
          ! grep -Fq "update(['active_slot'" apps/web/app/Infrastructure/Pos/LaravelShiftClosingCashRepository.php
          ! grep -Fq 'expected_cash' apps/web/app/Infrastructure/Pos/LaravelShiftClosingCashRepository.php
          ! grep -Fq 'variance' apps/web/app/Infrastructure/Pos/LaravelShiftClosingCashRepository.php
          ! grep -Fq "table('oneqay_pos_sales')" apps/web/app/Infrastructure/Pos/LaravelShiftClosingCashRepository.php
          ! grep -Fq "table('oneqay_pos_sale_cash_refunds')" apps/web/app/Infrastructure/Pos/LaravelShiftClosingCashRepository.php
          ! grep -Fq "table('oneqay_pos_sale_catalog_items')" apps/web/app/Infrastructure/Pos/LaravelShiftClosingCashRepository.php

      - name: Preserve Application framework independence
        shell: bash
        run: |
          set -euo pipefail
          if grep -n -F -e 'Illuminate\' -e 'Laravel\' -e 'Schema::' -e 'DB::' \
            apps/web/app/Application/Authorization/PosPermission.php \
            apps/web/app/Application/Pos/RecordShiftClosingCash.php \
            apps/web/app/Application/Pos/ShiftClosingCashCommand.php \
            apps/web/app/Application/Pos/ShiftClosingCashRepository.php \
            apps/web/app/Application/Pos/ShiftClosingCashResult.php; then
            echo 'Sprint54 closing-cash Application framework boundary violated.' >&2
            exit 1
          fi

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find apps/web/app apps/web/database/migrations apps/web/routes apps/web/tests -type f -name '*.php' -print0 |
            while IFS= read -r -d '' file; do php -l "$file"; done

      - name: Install locked dependencies
        working-directory: apps/web
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Reject High or Critical Composer advisories
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          composer audit --locked --format=json > /tmp/oneqay-composer-audit.json
          php -r '
            $data = json_decode(file_get_contents("/tmp/oneqay-composer-audit.json"), true, 512, JSON_THROW_ON_ERROR);
            foreach (($data["advisories"] ?? []) as $items) {
                foreach ($items as $item) {
                    if (in_array(strtolower((string) ($item["severity"] ?? "")), ["high", "critical"], true)) {
                        fwrite(STDERR, "Blocking Composer advisory.\n");
                        exit(1);
                    }
                }
            }
          '

      - name: Run Sprint54 durable closing-cash evidence regression
        working-directory: apps/web
        run: php tests/pos-shift-closing-cash-durable.php

      - name: Preserve Sprint53 opening-cash evidence regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          migration23='database/migrations/0000_00_00_000023_create_pos_shift_closing_cash_evidence_foundation.php'
          backup23='/tmp/oneqay-s54-migration23-opening-cash.php'
          cp "$migration23" "$backup23"
          restore() { [[ ! -f "$backup23" ]] || mv "$backup23" "$migration23"; }
          trap restore EXIT
          rm -f "$migration23"
          php tests/pos-shift-opening-cash-durable.php
          restore
          trap - EXIT

      - name: Preserve Sprint52 full CASH refund regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          migrations=(
            database/migrations/0000_00_00_000022_create_pos_shift_opening_cash_evidence_foundation.php
            database/migrations/0000_00_00_000023_create_pos_shift_closing_cash_evidence_foundation.php
          )
          backups=()
          restore() {
            for index in "${!migrations[@]}"; do
              [[ ! -f "${backups[$index]}" ]] || mv "${backups[$index]}" "${migrations[$index]}"
            done
          }
          trap restore EXIT
          for index in "${!migrations[@]}"; do
            backup="/tmp/oneqay-s54-refund-$index.php"
            cp "${migrations[$index]}" "$backup"
            backups+=("$backup")
            rm -f "${migrations[$index]}"
          done
          php tests/pos-sale-cash-refund-durable.php
          restore
          trap - EXIT

      - name: Preserve Sprint51 inventory baseline regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          migrations=(
            database/migrations/0000_00_00_000021_create_pos_sale_cash_refund_foundation.php
            database/migrations/0000_00_00_000022_create_pos_shift_opening_cash_evidence_foundation.php
            database/migrations/0000_00_00_000023_create_pos_shift_closing_cash_evidence_foundation.php
          )
          backups=()
          restore() {
            for index in "${!migrations[@]}"; do
              [[ ! -f "${backups[$index]}" ]] || mv "${backups[$index]}" "${migrations[$index]}"
            done
          }
          trap restore EXIT
          for index in "${!migrations[@]}"; do
            backup="/tmp/oneqay-s54-inventory-$index.php"
            cp "${migrations[$index]}" "$backup"
            backups+=("$backup")
            rm -f "${migrations[$index]}"
          done
          php tests/pos-inventory-baseline-durable.php
          restore
          trap - EXIT

      - name: Preserve Sprint48 shift opening regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          migrations=(
            database/migrations/0000_00_00_000019_create_pos_sale_void_foundation.php
            database/migrations/0000_00_00_000020_create_pos_inventory_baseline_foundation.php
            database/migrations/0000_00_00_000021_create_pos_sale_cash_refund_foundation.php
            database/migrations/0000_00_00_000022_create_pos_shift_opening_cash_evidence_foundation.php
            database/migrations/0000_00_00_000023_create_pos_shift_closing_cash_evidence_foundation.php
          )
          backups=()
          restore() {
            for index in "${!migrations[@]}"; do
              [[ ! -f "${backups[$index]}" ]] || mv "${backups[$index]}" "${migrations[$index]}"
            done
          }
          trap restore EXIT
          for index in "${!migrations[@]}"; do
            backup="/tmp/oneqay-s54-shift-$index.php"
            cp "${migrations[$index]}" "$backup"
            backups+=("$backup")
            rm -f "${migrations[$index]}"
          done
          php tests/pos-shift-opening-durable.php
          restore
          trap - EXIT

      - name: Preserve tracked source cleanliness
        run: git diff --exit-code
