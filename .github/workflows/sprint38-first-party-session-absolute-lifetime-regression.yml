              'apps/web/database/migrations/0000_00_00_000016_create_pos_sale_completion_foundation.php' \
              'apps/web/database/migrations/0000_00_00_000017_create_pos_catalog_preparation_journal.php'
            do
              if [[ -f "$migration" ]]; then
                git update-index --assume-unchanged "$migration"
                rm -f "$migration"
              fi
            done
            echo 'Recognized exact Sprint32 correction or four-workflow legacy-runner shape across canonical migration horizon.'
          elif [[ "$count" -eq 3 && "$fingerprint" == '749ce1548b3491572af9dce61b34012842c638e409d8a9bbfd9625b94d8dd886' ]]; then
            echo 'ONEQAY_S38_SPRINT46_COMPATIBILITY=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT46_JRN006_PREDECESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT40_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT41_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
