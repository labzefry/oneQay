          echo 'ONEQAY_SPRINT46_JRN006_PREDECESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT46_JRN006_SOURCE_SUCCESSOR=false' >> "$GITHUB_ENV"
