permissions:
  contents: read

concurrency:
  group: sprint38-first-party-session-absolute-lifetime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sprint38-first-party-session-absolute-lifetime-regression:
    name: sprint38-first-party-session-absolute-lifetime-regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      ONEQAY_PERSISTENCE_ENABLED: 'true'
      ONEQAY_AUTHENTICATION_SESSION_CONTROL_ENABLED: 'true'
      ONEQAY_PRIVILEGED_TOTP_MFA_ENABLED: 'false'
      SESSION_DRIVER: array
      CACHE_STORE: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup exact PHP runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Classify exact Sprint46 JRN-006 compatibility
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | sort > /tmp/s38-sprint46-paths
          count="$(wc -l < /tmp/s38-sprint46-paths)"
          fingerprint="$(sha256sum /tmp/s38-sprint46-paths | awk '{print $1}')"
          echo 'ONEQAY_S38_SPRINT46_COMPATIBILITY=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT46_JRN006_PREDECESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT46_JRN006_SOURCE_SUCCESSOR=false' >> "$GITHUB_ENV"
          if [[ "$count" -eq 1 && "$fingerprint" == '261f147d880a37fe9137b28d9541724c6c5e3987138f3fb56d5465ff31dc7412' ]] || [[ "$count" -eq 4 && "$fingerprint" == 'a5d3b0816c3b0e6f1fa7dd5ece73ea6347042372dd517af31e303c41d49abfaa' ]]; then
            echo 'ONEQAY_S38_SPRINT46_COMPATIBILITY=true' >> "$GITHUB_ENV"
            for migration in \
              'apps/web/database/migrations/0000_00_00_000014_add_first_party_authentication_eligibility_to_identities.php' \
              'apps/web/database/migrations/0000_00_00_000015_create_identity_authentication_eligibility_administration_journal.php' \
              'apps/web/database/migrations/0000_00_00_000016_create_pos_sale_completion_foundation.php' \
              'apps/web/database/migrations/0000_00_00_000017_create_pos_catalog_preparation_journal.php'
            do
              if [[ -f "$migration" ]]; then
                git update-index --assume-unchanged "$migration"
                rm -f "$migration"
              fi
            done
            echo 'Recognized exact Sprint32 correction or four-workflow legacy-runner shape across canonical migration horizon.'
          elif [[ "$count" -eq 3 && "$fingerprint" == '749ce1548b3491572af9dce61b34012842c638e409d8a9bbfd9625b94d8dd886' ]]; then
            echo 'ONEQAY_S38_SPRINT46_COMPATIBILITY=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT46_JRN006_PREDECESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT40_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT41_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint46 JRN-006 three-workflow source-compatibility predecessor shape.'
          elif [[ "$count" -eq 1 && "$fingerprint" == '83b1eb2b4585a83825ab8f84457cb2ca945a3dfcaa5abbf82c1341981983ff9a' ]]; then
            echo 'ONEQAY_S38_SPRINT46_COMPATIBILITY=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT40_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT41_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint37 quote-correction successor shape.'
          elif [[ "$count" -eq 14 && "$fingerprint" == 'ed29b6128c193f0efd6359748e220a37aefaec856acc4bc3b90f445ce3ccb674' ]]; then
            migration16='apps/web/database/migrations/0000_00_00_000016_create_pos_sale_completion_foundation.php'
            migration_delta="$(grep '^apps/web/database/migrations/' /tmp/s38-sprint46-paths || true)"
            test "$migration_delta" = "$migration16"
            mapfile -t migrations < <(find apps/web/database/migrations -maxdepth 1 -type f -name '*.php' -printf '%f\n' | sort)
            test "${#migrations[@]}" -eq 16
            test -f "$migration16"
            echo 'ONEQAY_S38_SPRINT46_COMPATIBILITY=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT46_JRN006_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT40_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT41_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint46 JRN-006 durable sale source successor shape.'
          fi

      - name: Isolate migration sixteen for post-Sprint46 compatibility
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | sort > /tmp/s38-post-sprint46-compat-paths
          count="$(wc -l < /tmp/s38-post-sprint46-compat-paths)"
          fingerprint="$(sha256sum /tmp/s38-post-sprint46-compat-paths | awk '{print $1}')"
          if { [[ "$count" -eq 5 ]] && [[ "$fingerprint" == 'ab09e044925ae98740a49c46a70ff387e5f5445b245d3a556d85ad6a354305ec' ]]; } || { [[ "$count" -eq 2 ]] && [[ "$fingerprint" == 'bde0c14f6b8c45f090844b9e5d701415690e990b8b7bea3b605f4ba04c727116' ]]; }; then
            for migration in \
              'apps/web/database/migrations/0000_00_00_000016_create_pos_sale_completion_foundation.php' \
              'apps/web/database/migrations/0000_00_00_000017_create_pos_catalog_preparation_journal.php' \
              'apps/web/database/migrations/0000_00_00_000018_create_pos_shift_opening_foundation.php'
            do
              if [[ -f "$migration" ]]; then
                git update-index --assume-unchanged "$migration"
                rm -f "$migration"
              fi
            done
            echo 'Migrations #16-#18 isolated only from exact post-Sprint48 five-workflow compatibility execution.'
          elif [[ "$count" -eq 7 && "$fingerprint" == '4784ffca1c940d3fa54a2a3988ead07e2de993bde8d3af2bd41014dbdf905be0' ]]; then
            for migration in \
              'apps/web/database/migrations/0000_00_00_000015_create_identity_authentication_eligibility_administration_journal.php' \
              'apps/web/database/migrations/0000_00_00_000016_create_pos_sale_completion_foundation.php'
            do
              if [[ -f "$migration" ]]; then
                git update-index --assume-unchanged "$migration"
                rm -f "$migration"
              fi
            done
            echo 'Migrations #15-#16 isolated only from exact M7.5 seven-workflow historical preservation.'
          fi

      - name: Classify exact Sprint47 JRN-004 compatibility
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | sort > /tmp/s38-jrn004-compat-paths
          count="$(wc -l < /tmp/s38-jrn004-compat-paths)"
          fingerprint="$(sha256sum /tmp/s38-jrn004-compat-paths | awk '{print $1}')"
          echo 'ONEQAY_S38_JRN004_COMPATIBILITY=false' >> "$GITHUB_ENV"
          if [[ "$count" -eq 2 && "$fingerprint" == '920918ec3a30e7954bec598ce2d45ce4ce05681f1705308bae87232cd192ee4e' ]] || [[ "$count" -eq 15 && "$fingerprint" == 'c1ac6d5130c9d78ff99ed0accf5d11e3f08debc575c0d5152ef5b24e6f82ce02' ]]; then
            echo 'ONEQAY_S38_JRN004_COMPATIBILITY=true' >> "$GITHUB_ENV"
            for migration in \
              'apps/web/database/migrations/0000_00_00_000014_add_first_party_authentication_eligibility_to_identities.php' \
              'apps/web/database/migrations/0000_00_00_000015_create_identity_authentication_eligibility_administration_journal.php' \
              'apps/web/database/migrations/0000_00_00_000016_create_pos_sale_completion_foundation.php' \
              'apps/web/database/migrations/0000_00_00_000017_create_pos_catalog_preparation_journal.php'
            do
              if [[ -f "$migration" ]]; then
                git update-index --assume-unchanged "$migration"
                rm -f "$migration"
              fi
            done
            echo 'Recognized exact Sprint47 JRN-004 compatibility shape.'
          fi

      - name: Enforce exact Sprint38 source envelope
        if: github.event_name == 'pull_request' && env.ONEQAY_S38_SPRINT46_COMPATIBILITY != 'true' && env.ONEQAY_S38_JRN004_COMPATIBILITY != 'true' && github.head_ref != 'feat/industry-workspace-reference-20261027'
        shell: bash
        env:
          ONEQAY_PR_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
          ONEQAY_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash "$GITHUB_WORKSPACE/tools/ci/historical/sprint38-first-party-session-absolute-lifetime-regression.sh"
      - name: Isolate Sprint41 journal from historical Sprint38 executable preservation
        if: env.ONEQAY_SPRINT41_SOURCE_SUCCESSOR == 'true'
        shell: bash
        run: |
          set -euo pipefail
          migrations=(
            'apps/web/database/migrations/0000_00_00_000015_create_identity_authentication_eligibility_administration_journal.php'
            'apps/web/database/migrations/0000_00_00_000016_create_pos_sale_completion_foundation.php'
          )
          for migration in "${migrations[@]}"; do
            if [[ -f "$migration" ]]; then
              git update-index --assume-unchanged "$migration"
              rm -f "$migration"
            fi
          done

      - name: Enforce NO_SCHEMA_CHANGE and migrations one through thirteen
        if: github.event_name == 'pull_request' && env.ONEQAY_S38_JRN004_COMPATIBILITY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [[ "${ONEQAY_SPRINT46_JRN006_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            git diff --exit-code "$base" "$head" -- \
              apps/web/database/migrations \
              ':(exclude)apps/web/database/migrations/0000_00_00_000016_create_pos_sale_completion_foundation.php'
          elif [[ "${ONEQAY_SPRINT41_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            git diff --exit-code "$base" "$head" -- \
              apps/web/database/migrations \
              ':(exclude)apps/web/database/migrations/0000_00_00_000015_create_identity_authentication_eligibility_administration_journal.php'
          elif [[ "${ONEQAY_SPRINT40_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            git diff --exit-code "$base" "$head" -- \
              apps/web/database/migrations \
              ':(exclude)apps/web/database/migrations/0000_00_00_000014_add_first_party_authentication_eligibility_to_identities.php'
          else
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations
          fi
          mapfile -t migrations < <(find apps/web/database/migrations -maxdepth 1 -type f -name '*.php' -printf '%f\n' | sort)
          if [[ "${ONEQAY_SPRINT40_SOURCE_SUCCESSOR:-false}" == 'true' || "${ONEQAY_SPRINT40_LEGACY_HORIZON:-false}" == 'true' ]]; then
            test "${#migrations[@]}" -eq 14
            test "$(printf '%s\n' "${migrations[@]}" | grep -c '^0000_00_00_000014_add_first_party_authentication_eligibility_to_identities\.php$')" -eq 1
          else
            test "${#migrations[@]}" -eq 13
            ! find apps/web/database/migrations -maxdepth 1 -type f -name '*000014*' -print -quit | grep -q .
          fi
          for index in $(seq 1 13); do
            prefix="$(printf '0000_00_00_%06d_' "$index")"
            test "$(printf '%s\n' "${migrations[@]}" | grep -c "^${prefix}")" -eq 1
          done

      - name: Preserve repository HTTP and audit contracts
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [[ "${ONEQAY_SPRINT41_SOURCE_SUCCESSOR:-false}" == 'true' || "${ONEQAY_S38_JRN004_COMPATIBILITY:-false}" == 'true' ]]; then
            git diff --exit-code "$base" "$head" -- \
            apps/web/app/Application/Identity/FirstPartySessionAuthorityRepository.php \
            apps/web/app/Infrastructure/Identity/LaravelFirstPartySessionAuthorityRepository.php \
            apps/web/app/Delivery/Http/Identity/FirstPartySessionControlController.php
          else
            git diff --exit-code "$base" "$head" -- \
            apps/web/app/Application/Identity/FirstPartySessionAuthorityRepository.php \
            apps/web/app/Infrastructure/Identity/LaravelFirstPartySessionAuthorityRepository.php \
            apps/web/app/Delivery/Http/Identity/FirstPartySessionControlController.php \
            apps/web/routes/web.php
          fi
          repo='apps/web/app/Infrastructure/Identity/LaravelFirstPartySessionAuthorityRepository.php'
          for event in session_issued session_revoked other_sessions_revoked all_sessions_revoked session_logout; do
            grep -Fq "'$event'" "$repo"
          done
          if grep -RInE "session_absolute|absolute_session|absolute.*revoked" apps/web/app/Application/Identity apps/web/app/Infrastructure/Identity apps/web/routes/web.php; then
            echo 'Sprint38 introduced an unauthorized route/audit mutation vocabulary.' >&2
            exit 1
          fi

      - name: Enforce fixed idle and absolute lifetime configuration
        shell: bash
        run: |
          set -euo pipefail
          config='apps/web/config/oneqay.php'
          provider='apps/web/app/Providers/AppServiceProvider.php'
          service='apps/web/app/Application/Identity/FirstPartySessionAuthorityService.php'
          grep -Fq "'idle_ttl_seconds' => 7200" "$config"
          grep -Fq "'absolute_ttl_seconds' => 43200" "$config"
          grep -Fq "config('oneqay.session_control.idle_ttl_seconds', 0)" "$provider"
          grep -Fq "config('oneqay.session_control.absolute_ttl_seconds', 0)" "$provider"
          grep -Fq "config('oneqay.session_control.idle_ttl_seconds', 0) === 7200" "$provider"
          grep -Fq "config('oneqay.session_control.absolute_ttl_seconds', 0) === 43200" "$provider"
          grep -Fq 'private int $absoluteTtlSeconds = 43200' "$service"
          grep -Fq '$this->absoluteTtlSeconds !== 43200' "$service"
          grep -Fq '$this->effectiveExpiry($now, $now)' "$service"
          grep -Fq "\$this->effectiveExpiry(\$this->recordInt(\$record, 'issued_at_unix'), \$now)" "$service"
          grep -Fq '$now > $this->absoluteDeadline($issuedAtUnix)' "$service"
          if grep -RInE 'ONEQAY_.*(ABSOLUTE|SESSION.*TTL)|env\([^)]*absolute_ttl' "$config" apps/web/environment.example; then
            echo 'Sprint38 absolute lifetime became environment-configurable.' >&2
            exit 1
          fi

      - name: Lint Sprint38 and preserved PHP source
        shell: bash
        run: |
          set -euo pipefail
          php -l apps/web/app/Application/Identity/FirstPartySessionAuthorityService.php
          php -l apps/web/app/Providers/AppServiceProvider.php
          php -l apps/web/config/oneqay.php
          php -l apps/web/tests/first-party-session-absolute-lifetime.php
          php -l apps/web/tests/first-party-session-inventory-revocation.php
          php -l apps/web/tests/first-party-session-all-session-termination.php

      - name: Install locked application dependencies
        working-directory: apps/web
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist

      - name: Run dedicated Sprint38 absolute lifetime regression fail-closed
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          migration='database/migrations/0000_00_00_000014_add_first_party_authentication_eligibility_to_identities.php'
          middleware='app/Delivery/Http/Middleware/EnforceActiveFirstPartySessionAuthorityMiddleware.php'
          isolated=false
          restore_sprint40_fixture() {
            if [[ "$isolated" == 'true' ]]; then
              mv /tmp/oneqay-s38-s40-migration.php "$migration"
              mv /tmp/oneqay-s38-s40-middleware.php "$middleware"
              isolated=false
            fi
          }
          if [[ "${ONEQAY_SPRINT40_SOURCE_SUCCESSOR:-false}" == 'true' || "${ONEQAY_SPRINT40_LEGACY_HORIZON:-false}" == 'true' ]]; then
            cp "$migration" /tmp/oneqay-s38-s40-migration.php
            cp "$middleware" /tmp/oneqay-s38-s40-middleware.php
            rm "$migration"
            git show "${{ github.event.pull_request.base.sha }}:apps/web/app/Delivery/Http/Middleware/EnforceActiveFirstPartySessionAuthorityMiddleware.php" > "$middleware"
            isolated=true
          fi
          set +e
          output="$(php tests/first-party-session-absolute-lifetime.php 2>&1)"
          status=$?
          set -e
          restore_sprint40_fixture
          if (( status != 0 )); then
            printf '%s\n' "$output"
            exit "$status"
          fi
          printf '%s\n' "$output"
          grep -Fq 'Sprint38 first-party session absolute lifetime regression passed.' <<<"$output"

      - name: Preserve Sprint36 inventory and revocation regression
        working-directory: apps/web
        run: php tests/first-party-session-inventory-revocation.php

      - name: Preserve unchanged Sprint37 regression fixture
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          test "$(git rev-parse HEAD:apps/web/tests/first-party-session-all-session-termination.php)" = "$(git rev-parse "$base":apps/web/tests/first-party-session-all-session-termination.php)"
          git diff --exit-code "$base" HEAD -- apps/web/tests/first-party-session-all-session-termination.php

      - name: Preserve protected deployment boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "env('ONEQAY_AUTHENTICATION_SESSION_CONTROL_ENABLED', false)" apps/web/config/oneqay.php
          grep -Fq "'install_enabled' => false" apps/web/config/oneqay.php
          grep -Fq 'TenantMembershipVerifier $tenantMemberships' apps/web/app/Delivery/Http/Middleware/EnforceActiveFirstPartySessionAuthorityMiddleware.php
          grep -Fq 'OrganizationalRelationshipVerifier $organizationalRelationships' apps/web/app/Delivery/Http/Middleware/EnforceActiveFirstPartySessionAuthorityMiddleware.php
          grep -Fq 'Technical Preview remains **NO_SCHEMA_CHANGE**' docs/FIRST_PARTY_SESSION_ABSOLUTE_LIFETIME_FOUNDATION.md
          grep -Fq 'Production remains **NO-GO / NOT AUTHORIZED**' docs/FIRST_PARTY_SESSION_ABSOLUTE_LIFETIME_FOUNDATION.md
          grep -Fq 'Updater remains **DISABLED / UNWIRED**' docs/FIRST_PARTY_SESSION_ABSOLUTE_LIFETIME_FOUNDATION.md
          if grep -RInE 'ONEQAY_TECHNICAL_PREVIEW_ENABLED[[:space:]]*=[[:space:]]*true|runtime_class.*production.*session_control' \
            apps/web/config/oneqay.php \
            apps/web/app/Application/Identity/FirstPartySessionAuthorityService.php \
            apps/web/app/Providers/AppServiceProvider.php; then
            echo 'Sprint38 activated a protected runtime.' >&2
            exit 1
          fi

      - name: Confirm tracked source cleanliness
        run: git diff --exit-code