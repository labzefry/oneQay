name: Sprint165 POS Inventory Accountability Workspace Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint165-pos-inventory-accountability-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  preserve-sprint165-pos-inventory-accountability:
    runs-on: ubuntu-latest
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      APP_DEBUG: "false"
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      SESSION_DRIVER: array
      CACHE_STORE: array
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve Sprint165 source contract
        run: |
          set -euo pipefail
          test -f apps/web/app/Application/Pos/PosInventoryAccountabilityWorkspaceRepository.php
          test -f apps/web/app/Application/Pos/PosInventoryAccountabilityWorkspaceSnapshot.php
          test -f apps/web/app/Application/Pos/ViewPosInventoryAccountabilityWorkspace.php
          test -f apps/web/app/Delivery/Http/Pos/PosInventoryAccountabilityWorkspaceController.php
          test -f apps/web/app/Infrastructure/Pos/LaravelPosInventoryAccountabilityWorkspaceRepository.php
          test -f apps/web/app/Providers/PosInventoryAccountabilityWorkspaceServiceProvider.php
          test -f apps/web/config/pos_inventory_accountability.php
          test -f apps/web/resources/js/pages/Pos/InventoryAccountability.vue
          test -f apps/web/tests/pos-inventory-accountability-workspace.php
          grep -Fq 'PosInventoryAccountabilityWorkspaceServiceProvider::class' apps/web/app/Providers/PosOperationsHubServiceProvider.php
          grep -Fq 'ONEQAY_POS_INVENTORY_ACCOUNTABILITY_ENABLED' apps/web/config/pos_inventory_accountability.php
          grep -Fq 'pos.inventory.accountability.workspace' apps/web/app/Delivery/Http/Pos/PosOperationsHubController.php
          grep -Fq 'Route::has($routeName)' apps/web/app/Delivery/Http/Pos/PosOperationsHubController.php

      - name: Preserve operational NO-GO
        run: |
          set -euo pipefail
          test "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" = NOT_EXECUTED
          test "$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)" = NONE
          test "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" = INACTIVE
          test "$(jq -r '.deployment_authority' ops/final-shift-close/STATE.json)" = NOT_GRANTED
          test "$(jq -r '.technical_preview_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
          test "$(jq -r '.production_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
          test "$(jq -r '.updater_activation' ops/final-shift-close/STATE.json)" = INACTIVE
          test "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET
          test "$(jq -r '.selected_target' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = null

      - name: Preserve read-only accountability invariants
        run: |
          set -euo pipefail
          grep -Fq 'PosPermission::inventoryBaseline()' apps/web/app/Application/Pos/ViewPosInventoryAccountabilityWorkspace.php
          grep -Fq 'ReplenishInventory::REPLENISH_PERMISSION' apps/web/app/Application/Pos/ViewPosInventoryAccountabilityWorkspace.php
          grep -Fq 'oneqay_pos_inventory_baselines' apps/web/app/Infrastructure/Pos/LaravelPosInventoryAccountabilityWorkspaceRepository.php
          grep -Fq 'oneqay_pos_inventory_replenishments' apps/web/app/Infrastructure/Pos/LaravelPosInventoryAccountabilityWorkspaceRepository.php
          grep -Fq 'oneqay_pos_sale_lines' apps/web/app/Infrastructure/Pos/LaravelPosInventoryAccountabilityWorkspaceRepository.php
          grep -Fq 'oneqay_pos_sale_voids' apps/web/app/Infrastructure/Pos/LaravelPosInventoryAccountabilityWorkspaceRepository.php
          ! grep -Fq 'oneqay_pos_sale_cash_refunds' apps/web/app/Infrastructure/Pos/LaravelPosInventoryAccountabilityWorkspaceRepository.php
          ! grep -Eq -- '->(insert|update|delete|increment|decrement)\(' apps/web/app/Infrastructure/Pos/LaravelPosInventoryAccountabilityWorkspaceRepository.php

      - name: Install PHP dependencies
        working-directory: apps/web
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist

      - name: Validate PHP syntax
        working-directory: apps/web
        run: |
          find app config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l >/tmp/php-lint.log
          cat /tmp/php-lint.log

      - name: Execute canonical and POS regressions
        working-directory: apps/web
        run: |
          composer test
          php tests/pos-operational-reporting.php
          php tests/pos-cashier-workspace.php
          php tests/pos-shift-start-workspace.php
          php tests/pos-sale-correction-workspace.php
          php tests/pos-sale-history-workspace.php
          php tests/pos-catalog-inventory-setup-workspace.php
          php tests/pos-operations-hub.php
          php tests/pos-cash-variance-reconciliation-workspace.php
          php tests/pos-inventory-replenishment-workspace.php
          php tests/pos-inventory-accountability-workspace.php

      - name: Setup exact Node LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.19.0

      - name: Type-check and build inventory accountability UI
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts --no-fund
          npm run type-check
          npm run build

      - name: Verify tracked-source cleanliness
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
