name: Sprint230 Sprint198 Migration27 Harness Successor Compatibility

# Attribution: Lab | zefry

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/sprint198-pos-business-workspace-delivery-integration-regression.yml'
      - '.github/workflows/sprint230-sprint198-migration27-test-successor-compatibility.yml'
      - 'docs/SPRINT230_SPRINT198_MIGRATION27_TEST_SUCCESSOR_COMPATIBILITY.md'

permissions:
  contents: read

jobs:
  qualify-sprint198-harness-successor-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact Sprint230 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Lock exact Sprint230 envelope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | LC_ALL=C sort > /tmp/paths
          cat > /tmp/expected <<'EOF'
          .github/workflows/sprint198-pos-business-workspace-delivery-integration-regression.yml
          .github/workflows/sprint230-sprint198-migration27-test-successor-compatibility.yml
          docs/SPRINT230_SPRINT198_MIGRATION27_TEST_SUCCESSOR_COMPATIBILITY.md
          EOF
          diff -u /tmp/expected /tmp/paths
          test "$(sha256sum /tmp/paths | awk '{print $1}')" = '67c8c29343b15a8ed99bc673605ad6d915e672ae43f06aa6944378c5d7b06b0b'

      - name: Preserve application runtime and canonical operational ownership
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --exit-code "$BASE_SHA" "$HEAD_SHA" --             apps             ops/final-shift-close/STATE.json             ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json             .github/workflows/sprint102-final-shift-close-operational-sequencing-gate.yml             .github/workflows/final-shift-close-migration27-execution.yml             .github/workflows/final-shift-close-migration27-selected-target-db-binding.yml

      - name: Prove Sprint198 compatibility is harness-only
        shell: bash
        run: |
          set -euo pipefail
          f=.github/workflows/sprint198-pos-business-workspace-delivery-integration-regression.yml
          grep -Fq 'current_migration27="$(jq -r '"'"'.migration27.state'"'"' "$state")"' "$f"
          grep -Fq '[[ "$current_migration27" =~ ^(NOT_EXECUTED|EXECUTED)$ ]]' "$f"
          grep -Fq 'if [[ "$current_migration27" == '"'"'EXECUTED'"'"' ]]; then' "$f"
          grep -Fq 'jq '"'"'.migration27.state = "NOT_EXECUTED"'"'"' "$state" > "$normalized"' "$f"
          grep -Fq 'trap restore_state EXIT' "$f"
          grep -Fq 'trap - EXIT' "$f"
          grep -Fq 'git diff --exit-code -- "$state"' "$f"

      - name: Preserve canonical Sprint198 test source
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --exit-code "$BASE_SHA" "$HEAD_SHA" --             apps/web/tests/pos-business-workspace-delivery-integration.php

      - name: Preserve current operational state
        shell: bash
        run: |
          set -euo pipefail
          state=ops/final-shift-close/STATE.json
          test "$(jq -r '.migration27.state' "$state")" = 'NOT_EXECUTED'
          test "$(jq -r '.permission_provisioning.state' "$state")" = 'NONE'
          test "$(jq -r '.feature_activation.state' "$state")" = 'INACTIVE'
          test "$(jq -r '.technical_preview_activation' "$state")" = 'NOT_AUTHORIZED'
          test "$(jq -r '.production_activation' "$state")" = 'NOT_AUTHORIZED'
          test "$(jq -r '.updater_activation' "$state")" = 'INACTIVE'

      - name: Verify tracked source cleanliness
        shell: bash
        run: git diff --exit-code
