name: Sprint147 Final Shift Close Canonical Control Plane Throttle Rejection Metadata Identity Response Hardening Regression

# Attribution: Lab | zefry

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sprint147-throttle-rejection-metadata-identity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify-throttle-rejection-metadata-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      CACHE_STORE: array
      SESSION_DRIVER: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Lock exact Sprint147 source envelope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | LC_ALL=C sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          .github/workflows/sprint147-final-shift-close-canonical-control-plane-throttle-rejection-metadata-identity-response-hardening-regression.yml
          apps/web/app/Delivery/Http/Middleware/HardenFinalShiftCloseRuntimeControlPlaneThrottleResponseMiddleware.php
          apps/web/tests/final-shift-close-runtime-control-plane-named-route-identity-throttle-response-hardening-regression.php
          apps/web/tests/final-shift-close-runtime-control-plane-throttle-rejection-metadata-identity-response-hardening-regression.php
          docs/SPRINT147_FINAL_SHIFT_CLOSE_CANONICAL_CONTROL_PLANE_THROTTLE_REJECTION_METADATA_IDENTITY_RESPONSE_HARDENING_REGRESSION.md
          ops/final-shift-close/CANONICAL_RUNTIME_CONTROL_PLANE_THROTTLE_REJECTION_METADATA_IDENTITY_RESPONSE_HARDENING_REGRESSION_CONTRACT.json
          EOF
          diff -u /tmp/expected /tmp/actual
          [[ "$(sha256sum /tmp/actual | awk '{print $1}')" == 'ffd176da808eda16fccdf0375fcae2fd5bcc1cfc4b931aca6492ca31eb9b1d40' ]]

      - name: Preserve Sprint146 successor compatibility
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/sprint146-final-shift-close-canonical-control-plane-throttle-budget-identity-response-hardening-regression.yml
          grep -Fq 'Preserve successor-compatible historical regression boundary' "$workflow"
          grep -Fq 'Sprint146 is historical after its canonical squash merge.' "$workflow"

      - name: Validate Sprint147 contract
        shell: bash
        run: |
          set -euo pipefail
          file=ops/final-shift-close/CANONICAL_RUNTIME_CONTROL_PLANE_THROTTLE_REJECTION_METADATA_IDENTITY_RESPONSE_HARDENING_REGRESSION_CONTRACT.json
          jq -e '
            .schema_version == 1 and
            .feature == "final-shift-close" and
            .sprint == 147 and
            .bounded_objective == "CANONICAL_CONTROL_PLANE_THROTTLE_REJECTION_METADATA_IDENTITY_RESPONSE_HARDENING_REGRESSION" and
            .qualification.ownership_signal == "ROUTE_NAME_PLUS_ACTION_PLUS_METHOD_PLUS_PATH_PLUS_EXACT_CANONICAL_THROTTLE_LIMIT_PLUS_CANONICAL_REJECTION_METADATA_SHAPE" and
            .qualification.materialization_canonical_throttle_limit == "1" and
            .qualification.db_attestation_canonical_throttle_limit == "2" and
            .qualification.remaining_exact_string == "0" and
            .qualification.retry_after_required == true and
            .qualification.retry_after_non_empty_decimal_required == true and
            .qualification.reset_required == true and
            .qualification.reset_non_empty_decimal_required == true and
            .qualification.missing_remaining_framework_owned == true and
            .qualification.nonzero_remaining_framework_owned == true and
            .qualification.numeric_alias_remaining_framework_owned == true and
            .qualification.missing_retry_after_framework_owned == true and
            .qualification.empty_retry_after_framework_owned == true and
            .qualification.nondigit_retry_after_framework_owned == true and
            .qualification.missing_reset_framework_owned == true and
            .qualification.empty_reset_framework_owned == true and
            .qualification.nondigit_reset_framework_owned == true and
            .qualification.canonical_materialization_post_hardened == true and
            .qualification.canonical_db_attestation_get_hardened == true and
            .qualification.canonical_db_attestation_head_hardened == true and
            .historical_ownership.sprint146_throttle_budget_identity_response_hardening == "PRESERVED" and
            .historical_ownership.sprint144_named_route_identity_regression_fixture == "SUCCESSOR_COMPATIBLE_WITH_CANONICAL_REJECTION_METADATA" and
            .source_envelope.path_count == 6 and
            .source_envelope.sha256 == "ffd176da808eda16fccdf0375fcae2fd5bcc1cfc4b931aca6492ca31eb9b1d40" and
            .attribution == "Author by Lab | zefry"
          ' "$file" >/dev/null

      - name: Prove bounded throttle rejection metadata identity ownership
        shell: bash
        run: |
          set -euo pipefail
          middleware=apps/web/app/Delivery/Http/Middleware/HardenFinalShiftCloseRuntimeControlPlaneThrottleResponseMiddleware.php
          grep -Fq 'private function hasCanonicalThrottleRejectionMetadata(Response $response, string $expectedThrottleLimit): bool' "$middleware"
          grep -Fq "headers->has('Retry-After')" "$middleware"
          grep -Fq "headers->has('X-RateLimit-Limit')" "$middleware"
          grep -Fq "headers->has('X-RateLimit-Remaining')" "$middleware"
          grep -Fq "headers->has('X-RateLimit-Reset')" "$middleware"
          grep -Fq "\$response->headers->get('X-RateLimit-Limit') !== \$expectedThrottleLimit" "$middleware"
          grep -Fq "\$response->headers->get('X-RateLimit-Remaining') !== '0'" "$middleware"
          grep -Fq "\$retryAfter = \$response->headers->get('Retry-After');" "$middleware"
          grep -Fq "\$reset = \$response->headers->get('X-RateLimit-Reset');" "$middleware"
          grep -Fq 'ctype_digit($retryAfter)' "$middleware"
          grep -Fq 'ctype_digit($reset)' "$middleware"
          ! grep -Fq "(int) \$response->headers->get('X-RateLimit-Remaining')" "$middleware"

      - name: Prove Sprint144 successor-compatible fixture metadata
        shell: bash
        run: |
          set -euo pipefail
          test=apps/web/tests/final-shift-close-runtime-control-plane-named-route-identity-throttle-response-hardening-regression.php
          grep -Fq "'X-RateLimit-Remaining' => '0'" "$test"
          grep -Fq "'X-RateLimit-Reset' => '1999999999'" "$test"
          grep -Fq "'Retry-After' => '60'" "$test"

      - name: Preserve canonical route throttle budgets
        shell: bash
        run: |
          set -euo pipefail
          materialization=apps/web/app/Providers/FinalShiftCloseRuntimeBindingManifestMaterializationServiceProvider.php
          db=apps/web/app/Providers/FinalShiftCloseRuntimeDbBindingAttestationServiceProvider.php
          grep -Fq "'throttle:1,1'" "$materialization"
          grep -Fq "'throttle:2,1'" "$db"

      - name: Preserve canonical lifecycle gates
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" == 'NOT_EXECUTED' ]]
          [[ "$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)" == 'NONE' ]]
          [[ "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.deployment_authority' ops/final-shift-close/STATE.json)" == 'NOT_GRANTED' ]]
          [[ "$(jq -r '.technical_preview_activation' ops/final-shift-close/STATE.json)" == 'NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.production_activation' ops/final-shift-close/STATE.json)" == 'NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.updater_activation' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET' ]]
          [[ "$(jq -r '.selected_target' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'null' ]]

      - name: Validate PHP and dependencies
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Delivery/Http/Middleware/HardenFinalShiftCloseRuntimeControlPlaneThrottleResponseMiddleware.php
          php -l tests/final-shift-close-runtime-control-plane-throttle-rejection-metadata-identity-response-hardening-regression.php
          php -l tests/final-shift-close-runtime-control-plane-throttle-budget-identity-response-hardening-regression.php
          php -l tests/final-shift-close-runtime-control-plane-named-route-identity-throttle-response-hardening-regression.php
          php -l tests/final-shift-close-runtime-control-plane-throttle-rejection-response-hardening-regression.php
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          composer audit --locked --no-interaction --abandoned=report

      - name: Execute Sprint147 regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-throttle-rejection-metadata-identity-response-hardening-regression.php

      - name: Preserve Sprint146 regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-throttle-budget-identity-response-hardening-regression.php

      - name: Preserve Sprint144 named-route identity regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-named-route-identity-throttle-response-hardening-regression.php

      - name: Preserve Sprint142 real HTTP-kernel throttle evidence
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-throttle-rejection-response-hardening-regression.php

      - name: Lock documentation boundary
        shell: bash
        run: |
          set -euo pipefail
          doc=docs/SPRINT147_FINAL_SHIFT_CLOSE_CANONICAL_CONTROL_PLANE_THROTTLE_REJECTION_METADATA_IDENTITY_RESPONSE_HARDENING_REGRESSION.md
          grep -Fq '## Purpose / Why' "$doc"
          grep -Fq '## Objective / Gap' "$doc"
          grep -Fq '## What changed' "$doc"
          grep -Fq '## Evidence / Qualification' "$doc"
          grep -Fq '## Operational boundaries / NO-GO' "$doc"
          grep -Fq '## Next position' "$doc"
          grep -Fq 'ffd176da808eda16fccdf0375fcae2fd5bcc1cfc4b931aca6492ca31eb9b1d40' "$doc"
          ! grep -Eq '^[[:space:]]*workflow_dispatch[[:space:]]*:' .github/workflows/sprint147-final-shift-close-canonical-control-plane-throttle-rejection-metadata-identity-response-hardening-regression.yml

      - name: Verify tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code

# Author by Lab | zefry
