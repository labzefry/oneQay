name: Sprint147 Final Shift Close Canonical Control Plane Throttle Rejection Metadata Identity Response Hardening Regression

# Attribution: Lab | zefry

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sprint147-historical-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preserve-sprint147-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: '01234567890123456789012345678901'
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      CACHE_STORE: array
      SESSION_DRIVER: array
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Preserve successor-compatible historical regression boundary
        shell: bash
        run: |
          set -euo pipefail
          # Sprint147 is historical after its canonical squash merge.
          # Historical workflows validate owned invariants only.
          # Exact full-PR envelope locking belongs to the active sprint workflow.
          test -f apps/web/app/Delivery/Http/Middleware/HardenFinalShiftCloseRuntimeControlPlaneThrottleResponseMiddleware.php
          test -f apps/web/tests/final-shift-close-runtime-control-plane-throttle-rejection-metadata-identity-response-hardening-regression.php
          test -f ops/final-shift-close/CANONICAL_RUNTIME_CONTROL_PLANE_THROTTLE_REJECTION_METADATA_IDENTITY_RESPONSE_HARDENING_REGRESSION_CONTRACT.json

      - name: Validate Sprint147 owned contract
        shell: bash
        run: |
          set -euo pipefail
          file=ops/final-shift-close/CANONICAL_RUNTIME_CONTROL_PLANE_THROTTLE_REJECTION_METADATA_IDENTITY_RESPONSE_HARDENING_REGRESSION_CONTRACT.json
          jq -e '.sprint == 147 and .qualification.remaining_exact_string == "0" and .qualification.retry_after_non_empty_decimal_required == true and .qualification.reset_non_empty_decimal_required == true and .attribution == "Author by Lab | zefry"' "$file" >/dev/null

      - name: Preserve canonical lifecycle gates
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" == 'NOT_EXECUTED' ]]
          [[ "$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)" == 'NONE' ]]
          [[ "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.deployment_authority' ops/final-shift-close/STATE.json)" == 'NOT_GRANTED' ]]
          [[ "$(jq -r '.technical_preview_activation' ops/final-shift-close/STATE.json)" == 'NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.production_activation' ops/final-shift-close/STATE.json)" == 'NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.updater_activation' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]

      - name: Install locked dependencies
        working-directory: apps/web
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Execute Sprint147 owned regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-throttle-rejection-metadata-identity-response-hardening-regression.php

      - name: Preserve predecessor regressions
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php tests/final-shift-close-runtime-control-plane-throttle-budget-identity-response-hardening-regression.php
          php tests/final-shift-close-runtime-control-plane-named-route-identity-throttle-response-hardening-regression.php
          php tests/final-shift-close-runtime-control-plane-throttle-rejection-response-hardening-regression.php

      - name: Verify tracked-source cleanliness
        run: git diff --exit-code

# Author by Lab | zefry
