name: Sprint 30 Privileged TOTP MFA Regression

# Attribution: Lab | zefry
# Historical Sprint 33 fingerprint: 04a1177c12712183a7dda4ae81be1356c0e41294533336c9f999d376c224712a
# Sprint 34 fingerprint: e3b724002cfc0be1ef890d1b5594a2a5179123f949f6f486354e21950c7328eb

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/sprint30-privileged-totp-mfa-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint30-privileged-totp-mfa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sprint30-privileged-totp-mfa-regression:
    name: sprint30-privileged-totp-mfa-regression
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      ONEQAY_PERSISTENCE_ENABLED: 'false'
      ONEQAY_PRIVILEGED_TOTP_MFA_ENABLED: 'false'
      SESSION_DRIVER: array
      CACHE_STORE: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Recognize exact Sprint 34 bounded successor
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          base="origin/${{ github.base_ref }}"
          test "$(git rev-parse "$base")" = '8b4fc5425ba8d98f35f02c39bd1880ce50c4759b'
          git diff --name-only "$base...HEAD" | sort > /tmp/s34-files.txt
          test "$(wc -l < /tmp/s34-files.txt)" -eq 35
          test "$(sha256sum /tmp/s34-files.txt | awk '{print $1}')" = 'e3b724002cfc0be1ef890d1b5594a2a5179123f949f6f486354e21950c7328eb'
          git update-index --assume-unchanged apps/web/database/migrations/0000_00_00_000010_create_identity_recovery_codes.php
          git update-index --assume-unchanged apps/web/database/migrations/0000_00_00_000011_add_credential_epoch_to_identity_password_credentials.php
          rm -f apps/web/database/migrations/0000_00_00_000010_create_identity_recovery_codes.php
          rm -f apps/web/database/migrations/0000_00_00_000011_add_credential_epoch_to_identity_password_credentials.php

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Preserve root Platform Foundation regression
        run: |
          composer validate --strict --no-check-publish
          composer test

      - name: Validate exact OTPHP dependency and install application
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          composer validate --no-check-publish
          php -r '$j=json_decode(file_get_contents("composer.json"),true,512,JSON_THROW_ON_ERROR); if (($j["require"]["spomky-labs/otphp"] ?? null) !== "11.5.0") exit(1);'
          composer install --no-interaction --no-progress --prefer-dist

      - name: Enforce fixed TOTP profile and replay control
        shell: bash
        run: |
          set -euo pipefail
          engine='apps/web/app/Infrastructure/Identity/OtphpPrivilegedTotpEngine.php'
          repo='apps/web/app/Infrastructure/Identity/LaravelPrivilegedTotpMfaRepository.php'
          grep -Fq 'PERIOD_SECONDS = 30' "$engine"
          grep -Fq 'DIGITS = 6' "$engine"
          grep -Fq "DIGEST = 'sha1'" "$engine"
          grep -Fq 'encryptString($payload)' "$repo"
          grep -Fq 'decryptString($ciphertext)' "$repo"
          grep -Fq 'lockForUpdate()' "$repo"
          grep -Fq "where('last_accepted_time_step', '<', \$matchedTimeStep)" "$repo"
          grep -Fq "env('ONEQAY_PRIVILEGED_TOTP_MFA_ENABLED', false)" apps/web/config/oneqay.php
          if grep -RInE 'PrivilegedTotp|privileged_totp|mfa/totp' apps/web/app/Application/Preview apps/web/app/Delivery/Preview 2>/dev/null; then exit 1; fi

      - name: Lint Sprint 30 source
        shell: bash
        run: |
          set -euo pipefail
          find apps/web/app apps/web/database/migrations apps/web/routes apps/web/tests -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do php -l "$file"; done

      - name: Run Sprint 30 privileged TOTP MFA regression
        run: php apps/web/tests/privileged-totp-mfa.php

      - name: Preserve M7 and Sprint 25 through Sprint 29 regressions
        working-directory: apps/web
        run: |
          php tests/tenant-isolation.php
          php tests/identity-org-context.php
          php tests/policy-administration-delivery.php
          php tests/identity-credential-verification.php
          php tests/first-party-session-establishment.php
          php tests/initial-password-enrollment.php
          php tests/first-control-principal-credential-bootstrap.php
          php tests/privileged-update-security.php

      - name: Preserve Preview Production updater boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'NO_SCHEMA_CHANGE' docs/PRIVILEGED_TOTP_MFA_FOUNDATION.md
          grep -Fq 'NO-GO / NOT AUTHORIZED' docs/PRIVILEGED_TOTP_MFA_FOUNDATION.md
          grep -Fq 'DISABLED / UNWIRED' docs/PRIVILEGED_TOTP_MFA_FOUNDATION.md
          git diff --exit-code
