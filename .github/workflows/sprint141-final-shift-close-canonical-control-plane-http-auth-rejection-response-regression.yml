name: Sprint141 Final Shift Close Canonical Control Plane HTTP Auth Rejection Response Regression

# Attribution: Lab | zefry

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sprint141-final-shift-close-canonical-control-plane-http-auth-rejection-response-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify-canonical-control-plane-http-auth-rejection-response-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      CACHE_STORE: array
      SESSION_DRIVER: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Preserve successor-compatible historical regression boundary
        shell: bash
        run: |
          set -euo pipefail
          echo 'Sprint141 is historical after its canonical squash merge.'
          echo 'Historical regression workflows validate their owned invariants only.'
          echo 'Exact full-PR envelope locking belongs to the active sprint workflow.'

      - name: Prove Sprint140 historical successor compatibility
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/sprint140-final-shift-close-canonical-control-plane-auth-rejection-response-hardening-regression.yml
          grep -Fq 'Preserve successor-compatible historical regression boundary' "$workflow"
          grep -Fq 'Sprint140 is historical after its canonical squash merge.' "$workflow"
          ! grep -Fq 'Lock exact Sprint140 source envelope' "$workflow"

      - name: Validate Sprint141 machine-readable contract invariants
        shell: bash
        run: |
          set -euo pipefail
          file=ops/final-shift-close/CANONICAL_RUNTIME_CONTROL_PLANE_HTTP_AUTH_REJECTION_RESPONSE_REGRESSION_CONTRACT.json
          jq -e '
            .schema_version == 1 and
            .feature == "final-shift-close" and
            .sprint == 141 and
            .bounded_objective == "CANONICAL_CONTROL_PLANE_HTTP_AUTH_REJECTION_RESPONSE_REGRESSION" and
            .execution_mode == "CI_ONLY_SYNTHETIC_HTTP_AUTH_REJECTION_RESPONSE_REGRESSION" and
            .qualification.new_executable_gap == "REGISTERED_ROUTE_HTTP_KERNEL_AUTH_REJECTION_RESPONSE_PROPAGATION_AND_INERTNESS" and
            .qualification.real_registered_route_invocation == true and
            .qualification.real_http_kernel_invocation == true and
            .qualification.real_token_middleware_invocation == true and
            .qualification.real_controller_invocation == false and
            .qualification.canonical_token_policy_owner == "SPRINT130" and
            .qualification.token_policy_changed == false and
            .qualification.route_registration_changed == false and
            .qualification.middleware_order_changed == false and
            .qualification.throttle_limits_changed == false and
            .qualification.production_source_changed == false and
            .qualification.materialization.missing_bearer_status == 401 and
            .qualification.materialization.malformed_bearer_status == 401 and
            .qualification.materialization.mismatched_bearer_status == 401 and
            .qualification.materialization.rejection_body == "EMPTY" and
            .qualification.materialization.cache_control_no_store == true and
            .qualification.materialization.cache_control_private == true and
            .qualification.materialization.pragma_no_cache == true and
            .qualification.materialization.x_content_type_options_nosniff == true and
            .qualification.materialization.x_robots_tag == "noindex, nofollow, noarchive" and
            .qualification.db_attestation.missing_bearer_status == 404 and
            .qualification.db_attestation.malformed_bearer_status == 404 and
            .qualification.db_attestation.mismatched_bearer_status == 404 and
            .qualification.db_attestation.rejection_body == "EMPTY" and
            .qualification.db_attestation.cache_control_no_store == true and
            .qualification.db_attestation.cache_control_private == true and
            .qualification.db_attestation.pragma_no_cache == true and
            .qualification.db_attestation.x_content_type_options_nosniff == true and
            .qualification.db_attestation.x_robots_tag == "noindex, nofollow, noarchive" and
            .qualification.expected_bearer_leakage == "FORBIDDEN" and
            .qualification.mismatched_bearer_leakage == "FORBIDDEN" and
            .qualification.internal_path_leakage == "FORBIDDEN" and
            .qualification.materialization_controller_resolution == false and
            .qualification.db_attestation_controller_resolution == false and
            .qualification.manifest_writer_resolution == false and
            .qualification.manifest_materializer_resolution == false and
            .qualification.database_identity_reader_resolution == false and
            .qualification.db_binding_attestation_service_resolution == false and
            .qualification.production_filesystem_adapter_resolution == false and
            .qualification.real_database_connection == false and
            .qualification.operational_runtime_token == false and
            .qualification.operational_runtime_target_invocation == false and
            .historical_ownership.sprint139_auth_before_throttle == "PRESERVED" and
            .historical_ownership.sprint140_direct_middleware_auth_rejection_response_hardening == "PRESERVED" and
            .historical_ownership.sprint141_http_kernel_rejection_response_propagation == "OWNED" and
            .source_envelope.path_count == 4 and
            .source_envelope.sha256 == "b75d55835722110dee38759068ce3f527efc0ecdbd2201f4fde9b4372211641a" and
            .canonical_boundaries.migration27_execution == "NOT_PERFORMED" and
            .canonical_boundaries.permission_provisioning == "NONE" and
            .canonical_boundaries.feature_activation == "INACTIVE" and
            .canonical_boundaries.durable_target_selection_or_invocation == "NOT_PERFORMED" and
            .canonical_boundaries.selected_target == null and
            .canonical_boundaries.runtime_token_provisioning == "NOT_PERFORMED" and
            .canonical_boundaries.canonical_runtime_manifest_write == "NOT_PERFORMED" and
            .canonical_boundaries.production_filesystem_adapter_resolution == "NOT_PERFORMED" and
            .canonical_boundaries.production_database_identity_reader_resolution == "NOT_PERFORMED" and
            .canonical_boundaries.real_database_connection == "NOT_PERFORMED" and
            .canonical_boundaries.real_database_identity_read == "NOT_PERFORMED" and
            .canonical_boundaries.deployment_authority == "NOT_GRANTED" and
            .canonical_boundaries.technical_preview == "NO-GO" and
            .canonical_boundaries.production == "NO-GO" and
            .canonical_boundaries.updater == "INACTIVE" and
            .attribution == "Author by Lab | zefry"
          ' "$file" >/dev/null

      - name: Prove Sprint141 regression uses registered HTTP routes and remains rejection-only
        shell: bash
        run: |
          set -euo pipefail
          test_file=apps/web/tests/final-shift-close-runtime-control-plane-http-auth-rejection-response-regression.php
          grep -Fq '$kernel->handle($request)' "$test_file"
          grep -Fq "getByName('internal.final-shift-close.runtime-binding-manifest.materialize')" "$test_file"
          grep -Fq "getByName('internal.final-shift-close.runtime-db-binding-attestation')" "$test_file"
          grep -Fq "'HTTP-AUTH-RESP-008 materialization missing bearer'" "$test_file"
          grep -Fq "'HTTP-AUTH-RESP-009 materialization malformed bearer'" "$test_file"
          grep -Fq "'HTTP-AUTH-RESP-010 materialization mismatched bearer'" "$test_file"
          grep -Fq "'HTTP-AUTH-RESP-011 DB attestation missing bearer remains cloaked'" "$test_file"
          grep -Fq "'HTTP-AUTH-RESP-012 DB attestation malformed bearer remains cloaked'" "$test_file"
          grep -Fq "'HTTP-AUTH-RESP-013 DB attestation mismatched bearer remains cloaked'" "$test_file"
          grep -Fq "'X-Robots-Tag'" "$test_file"
          grep -Fq 'production manifest writer remains unresolved' "$test_file"
          grep -Fq 'production DB identity reader remains unresolved' "$test_file"
          grep -Fq 'materializer service remains unresolved' "$test_file"
          grep -Fq 'DB-attestation service remains unresolved' "$test_file"
          grep -Fq 'materialization controller remains unresolved' "$test_file"
          grep -Fq 'DB-attestation controller remains unresolved' "$test_file"
          ! grep -Fq 'FilesystemFinalShiftCloseRuntimeBindingManifestWriter' "$test_file"
          ! grep -Fq "connection('oneqay')" "$test_file"
          ! grep -Fq 'new FinalShiftCloseRuntimeBindingManifestMaterializer(' "$test_file"
          ! grep -Fq 'new FinalShiftCloseRuntimeDbBindingAttestation(' "$test_file"

      - name: Prove operational NO-GO state remains intact
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" == 'NOT_EXECUTED' ]]
          [[ "$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)" == 'NONE' ]]
          [[ "$(jq -r '.permission_provisioning.default_grant' ops/final-shift-close/STATE.json)" == 'NONE' ]]
          [[ "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.deployment_authority' ops/final-shift-close/STATE.json)" == 'NOT_GRANTED' ]]
          [[ "$(jq -r '.technical_preview_activation' ops/final-shift-close/STATE.json)" == 'NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.production_activation' ops/final-shift-close/STATE.json)" == 'NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.updater_activation' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET' ]]
          [[ "$(jq -r '.selected_target' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'null' ]]

      - name: Validate PHP syntax and locked dependencies
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php -l tests/final-shift-close-runtime-control-plane-http-auth-rejection-response-regression.php
          php -l tests/final-shift-close-runtime-control-plane-auth-rejection-response-hardening-regression.php
          php -l tests/final-shift-close-runtime-control-plane-auth-before-throttle-regression.php
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          composer audit --locked --no-interaction --abandoned=report

      - name: Execute Sprint141 HTTP auth rejection response regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-http-auth-rejection-response-regression.php

      - name: Preserve Sprint140 direct middleware auth rejection response regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-auth-rejection-response-hardening-regression.php

      - name: Preserve Sprint139 auth-before-throttle regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-auth-before-throttle-regression.php

      - name: Lock documentation and workflow boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Sprint141' docs/SPRINT141_FINAL_SHIFT_CLOSE_CANONICAL_CONTROL_PLANE_HTTP_AUTH_REJECTION_RESPONSE_REGRESSION.md
          grep -Fq 'b75d55835722110dee38759068ce3f527efc0ecdbd2201f4fde9b4372211641a' docs/SPRINT141_FINAL_SHIFT_CLOSE_CANONICAL_CONTROL_PLANE_HTTP_AUTH_REJECTION_RESPONSE_REGRESSION.md
          ! grep -Eq '^[[:space:]]*workflow_dispatch[[:space:]]*:' .github/workflows/sprint141-final-shift-close-canonical-control-plane-http-auth-rejection-response-regression.yml

      - name: Verify tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code

# Author by Lab | zefry
