# Author by Lab | zefry
name: cPanel Enterprise POS Upgrade
on:
  push:
    branches: [pos-enterprise-cpanel-20261019]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  cpanel-enterprise-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: synthetic-test-only
          MYSQL_DATABASE: oneqay_control_upgrade_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psynthetic-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, dom, zlib, phar, curl
          tools: composer:v2
          coverage: none
      - name: Install locked dependencies
        working-directory: apps/web
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Preserve 34 receipts and credentials; add one module migration
        run: |
          set -euo pipefail
          php -l tools/production/cpanel/update-oneqaydev-pos-enterprise.php
          php -l tools/production/cpanel/install-oneqaydev-pos-enterprise.php
          php tools/production/tests/oneqaydev-pos-enterprise-operator.php | tee /tmp/control-operator.log
          grep -Fxq 'POS_ENTERPRISE_OPERATOR_TOTAL=56' /tmp/control-operator.log
          php tools/production/tests/oneqaydev-pos-enterprise-upgrade.php | tee /tmp/control-upgrade-sqlite.log
          grep -Fxq 'POS_ENTERPRISE_UPGRADE_sqlite_PASS assertions=21' /tmp/control-upgrade-sqlite.log
          CONTROL_TEST_ENGINE=mysql php tools/production/tests/oneqaydev-pos-enterprise-upgrade.php | tee /tmp/control-upgrade-mysql.log
          grep -Fxq 'POS_ENTERPRISE_UPGRADE_mysql_PASS assertions=21' /tmp/control-upgrade-mysql.log
      - name: Recognize only the exact empty worker lock and preserve stopped-preflight evidence
        run: |
          set -euo pipefail
          php tools/production/tests/oneqaydev-pos-enterprise-runtime-lock.php | tee /tmp/desktop-runtime-lock.log
          grep -Fxq 'POS_ENTERPRISE_RUNTIME_LOCK_PASS assertions=30' /tmp/desktop-runtime-lock.log
      - name: Verify website predecessor and candidate through the owner login route
        run: |
          set -euo pipefail
          php tools/production/tests/oneqaydev-pos-enterprise-https.php | tee /tmp/control-https.log
          grep -Fxq 'POS_ENTERPRISE_HTTPS_PASS assertions=11' /tmp/control-https.log
      - name: Bind private runtime and validate worker with link and symlink unavailable
        run: |
          set -euo pipefail
          CONTROL_OPERATOR="$PWD/tools/production/cpanel/update-oneqaydev-pos-enterprise.php" php -d disable_functions=link,symlink tools/production/tests/oneqaydev-fixed-bridge.php no-links | tee /tmp/fixed-bridge.log
          grep -Fxq 'FIXED_PUBLIC_BRIDGE_NO_LINKS_PASS assertions=20' /tmp/fixed-bridge.log
      - name: Archive old releases only after success; restore verified private ZIP on rollback
        run: |
          set -euo pipefail
          php -l tools/production/cpanel/release-retention.php
          php tools/production/tests/oneqaydev-desktop-retention.php | tee /tmp/release-retention.log
          grep -Fxq 'DESKTOP_RETENTION_PASS assertions=29' /tmp/release-retention.log
      - name: Bound TLS-preserving retries and untouched preflight restart
        run: |
          set -euo pipefail
          php tools/production/tests/oneqaydev-https-transport.php | tee /tmp/https-retry.log
          grep -Fxq 'HTTPS_TRANSPORT_RETRY_PASS assertions=60' /tmp/https-retry.log
      - name: Package and verify the exact certified enterprise source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 39356620709 --repo labzefry/oneQay --name oneqay-certified-business-production-5f2acf1aec6c --dir "$RUNNER_TEMP/enterprise-certified"
          zip -j "$RUNNER_TEMP/enterprise-certified.zip" "$RUNNER_TEMP/enterprise-certified/"*
          python3 tools/production/package-oneqaydev-pos-enterprise.py --certified-zip "$RUNNER_TEMP/enterprise-certified.zip" --source-sha 5f2acf1aec6c6cc9a5cbab128c312141fe0301c4 --run-id 39356620709 --output-directory "$RUNNER_TEMP/enterprise-package"
          php tools/production/tests/oneqaydev-pos-enterprise-package.php "$RUNNER_TEMP/enterprise-package/oneqaydev-pos-update-5f2acf1aec6c"
