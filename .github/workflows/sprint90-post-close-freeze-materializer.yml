name: Sprint90 Post-Close Freeze Materializer

on:
  push:
    branches:
      - sprint90-post-close-sale-mutation-freeze

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Apply exact active-shift lock hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          void_path = Path('apps/web/app/Infrastructure/Pos/LaravelDurablePosSaleRepository.php')
          refund_path = Path('apps/web/app/Infrastructure/Pos/LaravelSaleCashRefundRepository.php')

          void_text = void_path.read_text()
          refund_text = refund_path.read_text()

          void_old = """            if ($sale === null
                || ! is_string($sale->organization_id)
                || ! hash_equals($context->organizationId(), $sale->organization_id)
                || ! is_string($sale->outlet_id)
                || ! hash_equals($context->outletId(), $sale->outlet_id)) {
                throw new PosTransactionViolation();
            }

            $alreadyVoided = $this->connection->table('oneqay_pos_sale_voids')
"""
          void_new = """            if ($sale === null
                || ! is_string($sale->organization_id)
                || ! hash_equals($context->organizationId(), $sale->organization_id)
                || ! is_string($sale->outlet_id)
                || ! hash_equals($context->outletId(), $sale->outlet_id)
                || ! is_string($sale->shift_id)
                || trim($sale->shift_id) === '') {
                throw new PosTransactionViolation();
            }

            $activeShift = $this->connection->table('oneqay_pos_shifts')
                ->where('tenant_id', $context->tenantId())
                ->where('shift_id', $sale->shift_id)
                ->where('organization_id', $sale->organization_id)
                ->where('outlet_id', $sale->outlet_id)
                ->where('active_slot', 1)
                ->lockForUpdate()
                ->first();

            if ($activeShift === null) {
                throw new PosTransactionViolation();
            }

            $alreadyVoided = $this->connection->table('oneqay_pos_sale_voids')
"""

          refund_old = """            if ($sale === null
                || ! is_string($sale->organization_id)
                || ! hash_equals($context->organizationId(), $sale->organization_id)
                || ! is_string($sale->outlet_id)
                || ! hash_equals($context->outletId(), $sale->outlet_id)
                || ! is_string($sale->tender_category)
                || $sale->tender_category !== TenderCategory::CASH->value) {
                throw new PosTransactionViolation();
            }

            $void = $this->connection->table('oneqay_pos_sale_voids')
"""
          refund_new = """            if ($sale === null
                || ! is_string($sale->organization_id)
                || ! hash_equals($context->organizationId(), $sale->organization_id)
                || ! is_string($sale->outlet_id)
                || ! hash_equals($context->outletId(), $sale->outlet_id)
                || ! is_string($sale->shift_id)
                || trim($sale->shift_id) === ''
                || ! is_string($sale->tender_category)
                || $sale->tender_category !== TenderCategory::CASH->value) {
                throw new PosTransactionViolation();
            }

            $activeShift = $this->connection->table('oneqay_pos_shifts')
                ->where('tenant_id', $context->tenantId())
                ->where('shift_id', $sale->shift_id)
                ->where('organization_id', $sale->organization_id)
                ->where('outlet_id', $sale->outlet_id)
                ->where('active_slot', 1)
                ->lockForUpdate()
                ->first();

            if ($activeShift === null) {
                throw new PosTransactionViolation();
            }

            $void = $this->connection->table('oneqay_pos_sale_voids')
"""

          if void_new in void_text and refund_new in refund_text:
              print('Sprint90 repository hardening already materialized.')
              raise SystemExit(0)

          if void_text.count(void_old) != 1:
              raise SystemExit('Void repository exact insertion anchor mismatch.')
          if refund_text.count(refund_old) != 1:
              raise SystemExit('Refund repository exact insertion anchor mismatch.')

          void_path.write_text(void_text.replace(void_old, void_new, 1))
          refund_path.write_text(refund_text.replace(refund_old, refund_new, 1))
          PY

          git diff --check
          git diff --name-only | sort > /tmp/s90-files
          test "$(wc -l < /tmp/s90-files)" -eq 2
          grep -Fxq 'apps/web/app/Infrastructure/Pos/LaravelDurablePosSaleRepository.php' /tmp/s90-files
          grep -Fxq 'apps/web/app/Infrastructure/Pos/LaravelSaleCashRefundRepository.php' /tmp/s90-files

      - name: Commit bounded repository hardening
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No materialization delta remains.'
            exit 0
          fi
          git config user.name 'Lab | zefry'
          git config user.email 'labzefry@users.noreply.github.com'
          git add \
            apps/web/app/Infrastructure/Pos/LaravelDurablePosSaleRepository.php \
            apps/web/app/Infrastructure/Pos/LaravelSaleCashRefundRepository.php
          git commit -m 'fix(sprint90): freeze sale mutations after shift close' -m 'Author by Lab | zefry'
          git push origin HEAD:sprint90-post-close-sale-mutation-freeze
