name: Sprint90 Post-Close Freeze Materializer

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Apply deterministic regression hardening
        run: python3 tools/sprint90_materialize_post_close_freeze.py

      - name: Verify exact test delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only | sort > /tmp/s90-files
          if git diff --quiet; then
            echo 'No materialization delta remains.'
            exit 0
          fi
          test "$(wc -l < /tmp/s90-files)" -eq 2
          grep -Fxq 'apps/web/tests/pos-sale-void-durable.php' /tmp/s90-files
          grep -Fxq 'apps/web/tests/pos-sale-cash-refund-durable.php' /tmp/s90-files

      - name: Commit bounded regression hardening
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'Lab | zefry'
          git config user.email 'labzefry@users.noreply.github.com'
          git add apps/web/tests/pos-sale-void-durable.php apps/web/tests/pos-sale-cash-refund-durable.php
          git commit -m 'test(sprint90): prove sale mutation freeze after close' -m 'Author by Lab | zefry'
          git push origin HEAD:sprint90-post-close-sale-mutation-freeze
