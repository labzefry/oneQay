name: Sprint251 Apply Versioned Hardlink Topology Correction

# Attribution: Lab | zefry

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sprint251-apply-versioned-hardlink-topology.yml'

permissions:
  contents: write

jobs:
  apply-bounded-correction:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact Sprint251 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply topology-aware correction and remove transient workflow
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          [[ "$HEAD_BRANCH" == 'sprint251-final-shift-close-versioned-hardlink-topology' ]]
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('tools/cpanel/execute-final-shift-close-feature-activation-readiness-successor.php')
          text = path.read_text()

          ensure = r'''function fscActivationSuccessorEnsureRuntimeEnvBinding(string $runtimeEnvPath, array $identity, string $expectedRaw): string
{
    $runtimeEnvPath = fscActivationSafeAbsoluteFile($runtimeEnvPath, true, 'runtime_env');

    if (basename($runtimeEnvPath) !== 'runtime.env' || basename(dirname($runtimeEnvPath)) !== 'shared') {
        fscActivationFail('runtime_env_deployment_shape_invalid');
    }

    $sourceCommit = fscActivationHex(
        $identity['source_commit'] ?? null,
        40,
        'runtime_env_binding_source_invalid',
    );
    $deploymentRoot = dirname(dirname($runtimeEnvPath));
    $sourcePrefix = substr($sourceCommit, 0, 12);
    $releaseEnvPath = $deploymentRoot.'/releases/durable-staging-'.$sourcePrefix.'/apps/web/.env';
    $versionedEnvPath = dirname($runtimeEnvPath).'/runtime-'.$sourcePrefix.'.env';

    if (is_link($releaseEnvPath)) {
        $target = realpath($releaseEnvPath);
        if (!is_string($target) || $target !== $runtimeEnvPath) {
            fscActivationFail('runtime_env_symlink_binding_invalid');
        }
        return 'SYMLINK';
    }

    if (!is_file($releaseEnvPath) || !is_readable($releaseEnvPath)) {
        fscActivationFail('runtime_env_release_binding_unavailable');
    }
    $mode = fileperms($releaseEnvPath);
    if (!is_int($mode) || (($mode & 0077) !== 0)) {
        fscActivationFail('runtime_env_release_binding_permissions_invalid');
    }
    $releaseReal = realpath($releaseEnvPath);
    if (!is_string($releaseReal) || $releaseReal !== $releaseEnvPath) {
        fscActivationFail('runtime_env_release_binding_realpath_invalid');
    }

    $releaseRaw = file_get_contents($releaseEnvPath);
    if (!is_string($releaseRaw) || !hash_equals(hash('sha256', $expectedRaw), hash('sha256', $releaseRaw))) {
        fscActivationFail('runtime_env_release_binding_content_mismatch');
    }

    $runtimeStat = stat($runtimeEnvPath);
    $releaseStat = stat($releaseEnvPath);
    if (!is_array($runtimeStat) || !is_array($releaseStat)) {
        fscActivationFail('runtime_env_binding_stat_failed');
    }

    $sameInode = ($runtimeStat['dev'] ?? null) === ($releaseStat['dev'] ?? null)
        && ($runtimeStat['ino'] ?? null) === ($releaseStat['ino'] ?? null);
    if ($sameInode) {
        if (($runtimeStat['nlink'] ?? null) === 2 && ($releaseStat['nlink'] ?? null) === 2) {
            return 'HARDLINK';
        }
        if (($runtimeStat['nlink'] ?? null) === 3 && ($releaseStat['nlink'] ?? null) === 3) {
            if (!is_file($versionedEnvPath) || is_link($versionedEnvPath) || !is_readable($versionedEnvPath)) {
                fscActivationFail('runtime_env_versioned_binding_unavailable');
            }
            $versionedMode = fileperms($versionedEnvPath);
            $versionedReal = realpath($versionedEnvPath);
            $versionedRaw = file_get_contents($versionedEnvPath);
            $versionedStat = stat($versionedEnvPath);
            if (!is_int($versionedMode)
                || (($versionedMode & 0077) !== 0)
                || !is_string($versionedReal)
                || $versionedReal !== $versionedEnvPath
                || !is_string($versionedRaw)
                || !hash_equals(hash('sha256', $expectedRaw), hash('sha256', $versionedRaw))
                || !is_array($versionedStat)
                || ($versionedStat['dev'] ?? null) !== ($runtimeStat['dev'] ?? null)
                || ($versionedStat['ino'] ?? null) !== ($runtimeStat['ino'] ?? null)
                || ($versionedStat['nlink'] ?? null) !== 3
            ) {
                fscActivationFail('runtime_env_versioned_binding_invalid');
            }
            return 'VERSIONED_HARDLINK';
        }
        fscActivationFail('runtime_env_hardlink_count_invalid');
    }

    // cPanel hosts without symlink support can retain a source-versioned runtime
    // hardlink beside runtime.env. A pre-Sprint249 atomic replacement can then
    // leave runtime.env at nlink=1 while release .env remains hardlinked to
    // shared/runtime-<source-prefix>.env at nlink=2. Repair only that exact,
    // byte-identical, same-filesystem topology before any feature mutation.
    $versionedTopology = ($runtimeStat['nlink'] ?? null) === 1
        && ($releaseStat['nlink'] ?? null) === 2
        && ($runtimeStat['dev'] ?? null) === ($releaseStat['dev'] ?? null);

    if ($versionedTopology) {
        if (!is_file($versionedEnvPath) || is_link($versionedEnvPath) || !is_readable($versionedEnvPath)) {
            fscActivationFail('runtime_env_versioned_binding_unavailable');
        }
        $versionedMode = fileperms($versionedEnvPath);
        $versionedReal = realpath($versionedEnvPath);
        $versionedRaw = file_get_contents($versionedEnvPath);
        $versionedStat = stat($versionedEnvPath);
        if (!is_int($versionedMode) || (($versionedMode & 0077) !== 0)) {
            fscActivationFail('runtime_env_versioned_binding_permissions_invalid');
        }
        if (!is_string($versionedReal) || $versionedReal !== $versionedEnvPath) {
            fscActivationFail('runtime_env_versioned_binding_realpath_invalid');
        }
        if (!is_string($versionedRaw) || !hash_equals(hash('sha256', $expectedRaw), hash('sha256', $versionedRaw))) {
            fscActivationFail('runtime_env_versioned_binding_content_mismatch');
        }
        if (!is_array($versionedStat)
            || ($versionedStat['dev'] ?? null) !== ($releaseStat['dev'] ?? null)
            || ($versionedStat['ino'] ?? null) !== ($releaseStat['ino'] ?? null)
            || ($versionedStat['nlink'] ?? null) !== 2
            || !function_exists('link')
        ) {
            fscActivationFail('runtime_env_versioned_hardlink_repair_not_qualified');
        }

        $releaseDir = dirname($releaseEnvPath);
        $sharedDir = dirname($runtimeEnvPath);
        if (!is_dir($releaseDir) || is_link($releaseDir) || !is_writable($releaseDir)
            || !is_dir($sharedDir) || is_link($sharedDir) || !is_writable($sharedDir)
        ) {
            fscActivationFail('runtime_env_versioned_hardlink_repair_directory_invalid');
        }

        $releaseTemp = $releaseDir.'/.fsc-runtime-env-link-'.bin2hex(random_bytes(12)).'.tmp';
        $versionedTemp = $sharedDir.'/.fsc-versioned-runtime-env-link-'.bin2hex(random_bytes(12)).'.tmp';
        $rollbackTemp = $releaseDir.'/.fsc-runtime-env-rollback-'.bin2hex(random_bytes(12)).'.tmp';
        $releaseCommitted = false;
        $versionedCommitted = false;

        try {
            if (!@link($runtimeEnvPath, $releaseTemp) || !@link($runtimeEnvPath, $versionedTemp)) {
                fscActivationFail('runtime_env_versioned_hardlink_repair_stage_failed');
            }
            foreach ([$releaseTemp, $versionedTemp] as $temp) {
                $tempStat = stat($temp);
                if (!is_array($tempStat)
                    || ($tempStat['dev'] ?? null) !== ($runtimeStat['dev'] ?? null)
                    || ($tempStat['ino'] ?? null) !== ($runtimeStat['ino'] ?? null)
                ) {
                    fscActivationFail('runtime_env_versioned_hardlink_repair_stage_verification_failed');
                }
            }
            if (!@rename($releaseTemp, $releaseEnvPath)) {
                fscActivationFail('runtime_env_versioned_hardlink_repair_release_commit_failed');
            }
            $releaseCommitted = true;
            if (!@rename($versionedTemp, $versionedEnvPath)) {
                fscActivationFail('runtime_env_versioned_hardlink_repair_versioned_commit_failed');
            }
            $versionedCommitted = true;
        } catch (Throwable $exception) {
            if ($releaseCommitted && !$versionedCommitted && is_file($versionedEnvPath)) {
                if (!@link($versionedEnvPath, $rollbackTemp) || !@rename($rollbackTemp, $releaseEnvPath)) {
                    fscActivationFail('runtime_env_versioned_hardlink_repair_rollback_failed');
                }
            }
            if ($exception instanceof FinalShiftCloseActivationTransportException) {
                throw $exception;
            }
            throw new FinalShiftCloseActivationTransportException('runtime_env_versioned_hardlink_repair_failed', 0, $exception);
        } finally {
            foreach ([$releaseTemp, $versionedTemp, $rollbackTemp] as $temp) {
                if (is_file($temp) || is_link($temp)) {
                    @unlink($temp);
                }
            }
        }

        clearstatcache(true, $runtimeEnvPath);
        clearstatcache(true, $releaseEnvPath);
        clearstatcache(true, $versionedEnvPath);
        $runtimeAfter = stat($runtimeEnvPath);
        $releaseAfter = stat($releaseEnvPath);
        $versionedAfter = stat($versionedEnvPath);
        if (!is_array($runtimeAfter)
            || !is_array($releaseAfter)
            || !is_array($versionedAfter)
            || ($runtimeAfter['dev'] ?? null) !== ($releaseAfter['dev'] ?? null)
            || ($runtimeAfter['dev'] ?? null) !== ($versionedAfter['dev'] ?? null)
            || ($runtimeAfter['ino'] ?? null) !== ($releaseAfter['ino'] ?? null)
            || ($runtimeAfter['ino'] ?? null) !== ($versionedAfter['ino'] ?? null)
            || ($runtimeAfter['nlink'] ?? null) !== 3
            || ($releaseAfter['nlink'] ?? null) !== 3
            || ($versionedAfter['nlink'] ?? null) !== 3
        ) {
            fscActivationFail('runtime_env_versioned_hardlink_repair_verification_failed');
        }

        return 'VERSIONED_HARDLINK_REPAIRED';
    }

    // Legacy two-path hardlink repair retained for installations without a
    // source-versioned runtime alias.
    if (($runtimeStat['nlink'] ?? null) !== 1
        || ($releaseStat['nlink'] ?? null) !== 1
        || ($runtimeStat['dev'] ?? null) !== ($releaseStat['dev'] ?? null)
        || !function_exists('link')
    ) {
        fscActivationFail('runtime_env_hardlink_repair_not_qualified');
    }

    $releaseDir = dirname($releaseEnvPath);
    if (!is_dir($releaseDir) || is_link($releaseDir) || !is_writable($releaseDir)) {
        fscActivationFail('runtime_env_hardlink_repair_directory_invalid');
    }

    $temp = $releaseDir.'/.fsc-runtime-env-link-'.bin2hex(random_bytes(12)).'.tmp';
    try {
        if (!@link($runtimeEnvPath, $temp)) {
            fscActivationFail('runtime_env_hardlink_repair_stage_failed');
        }
        $tempStat = stat($temp);
        if (!is_array($tempStat)
            || ($tempStat['dev'] ?? null) !== ($runtimeStat['dev'] ?? null)
            || ($tempStat['ino'] ?? null) !== ($runtimeStat['ino'] ?? null)
        ) {
            fscActivationFail('runtime_env_hardlink_repair_stage_verification_failed');
        }
        if (!@rename($temp, $releaseEnvPath)) {
            fscActivationFail('runtime_env_hardlink_repair_commit_failed');
        }
    } finally {
        if (is_file($temp) || is_link($temp)) {
            @unlink($temp);
        }
    }

    clearstatcache(true, $runtimeEnvPath);
    clearstatcache(true, $releaseEnvPath);
    $runtimeAfter = stat($runtimeEnvPath);
    $releaseAfter = stat($releaseEnvPath);
    if (!is_array($runtimeAfter)
        || !is_array($releaseAfter)
        || ($runtimeAfter['dev'] ?? null) !== ($releaseAfter['dev'] ?? null)
        || ($runtimeAfter['ino'] ?? null) !== ($releaseAfter['ino'] ?? null)
        || ($runtimeAfter['nlink'] ?? null) !== 2
        || ($releaseAfter['nlink'] ?? null) !== 2
    ) {
        fscActivationFail('runtime_env_hardlink_repair_verification_failed');
    }

    return 'HARDLINK_REPAIRED';
}'''

          writer = r'''function fscActivationSuccessorWriteRuntimeEnvBound(string $path, string $contents): void
{
    $path = fscActivationSafeAbsoluteFile($path, true, 'runtime_env');
    $stat = stat($path);
    if (!is_array($stat) || !is_int($stat['nlink'] ?? null)) {
        fscActivationFail('runtime_env_write_stat_failed');
    }

    $linkCount = (int) $stat['nlink'];
    if ($linkCount === 1) {
        // Symlink-bound releases follow this stable shared path; atomic replace
        // therefore remains valid and does not sever the release binding.
        fscActivationWritePrivateAtomic($path, $contents);
        return;
    }
    if ($linkCount < 2 || $linkCount > 3) {
        fscActivationFail('runtime_env_write_link_count_invalid');
    }

    $originalInode = $stat['ino'] ?? null;
    $originalDevice = $stat['dev'] ?? null;
    if (!is_int($originalInode) || !is_int($originalDevice)) {
        fscActivationFail('runtime_env_write_identity_invalid');
    }

    $handle = @fopen($path, 'r+b');
    if (!is_resource($handle)) {
        fscActivationFail('runtime_env_write_open_failed');
    }

    try {
        if (!flock($handle, LOCK_EX)) {
            throw new FinalShiftCloseActivationTransportException('runtime_env_write_lock_failed');
        }
        $openStat = fstat($handle);
        if (!is_array($openStat)
            || ($openStat['ino'] ?? null) !== $originalInode
            || ($openStat['dev'] ?? null) !== $originalDevice
            || ($openStat['nlink'] ?? null) !== $linkCount
            || (((int) ($openStat['mode'] ?? 0)) & 0077) !== 0
        ) {
            throw new FinalShiftCloseActivationTransportException('runtime_env_write_identity_drifted');
        }

        if (!rewind($handle) || !ftruncate($handle, 0)) {
            throw new FinalShiftCloseActivationTransportException('runtime_env_write_truncate_failed');
        }

        $length = strlen($contents);
        $written = 0;
        while ($written < $length) {
            $count = fwrite($handle, substr($contents, $written));
            if ($count === false || $count === 0) {
                throw new FinalShiftCloseActivationTransportException('runtime_env_write_failed');
            }
            $written += $count;
        }
        if (!fflush($handle)) {
            throw new FinalShiftCloseActivationTransportException('runtime_env_write_flush_failed');
        }
        if (function_exists('fsync') && !@fsync($handle)) {
            throw new FinalShiftCloseActivationTransportException('runtime_env_write_fsync_failed');
        }
    } finally {
        @flock($handle, LOCK_UN);
        fclose($handle);
    }

    clearstatcache(true, $path);
    $after = stat($path);
    $readback = file_get_contents($path);
    if (!is_array($after)
        || ($after['ino'] ?? null) !== $originalInode
        || ($after['dev'] ?? null) !== $originalDevice
        || ($after['nlink'] ?? null) !== $linkCount
        || !is_string($readback)
        || !hash_equals(hash('sha256', $contents), hash('sha256', $readback))
    ) {
        fscActivationFail('runtime_env_write_readback_failed');
    }
}'''

          pattern_ensure = re.compile(
              r'function fscActivationSuccessorEnsureRuntimeEnvBinding\(.*?\n\}\n\n(?=function fscActivationSuccessorWriteRuntimeEnvBound)',
              re.S,
          )
          text, count = pattern_ensure.subn(ensure + '\n\n', text, count=1)
          if count != 1:
              raise SystemExit('Sprint251 ensure-binding function boundary mismatch')

          pattern_writer = re.compile(
              r'function fscActivationSuccessorWriteRuntimeEnvBound\(.*?\n\}\n\n(?=/\*\* @return array<string,mixed> \*/\nfunction fscActivationExecuteReadinessSuccessor)',
              re.S,
          )
          text, count = pattern_writer.subn(writer + '\n\n', text, count=1)
          if count != 1:
              raise SystemExit('Sprint251 writer function boundary mismatch')

          path.write_text(text)
          PY

          rm .github/workflows/sprint251-apply-versioned-hardlink-topology.yml

          mapfile -t changed < <(git status --short | awk '{print $2}' | LC_ALL=C sort)
          expected=(
            '.github/workflows/sprint251-apply-versioned-hardlink-topology.yml'
            'tools/cpanel/execute-final-shift-close-feature-activation-readiness-successor.php'
          )
          test "${#changed[@]}" -eq 2
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${changed[@]}")

          php -l tools/cpanel/execute-final-shift-close-feature-activation-readiness-successor.php

          git config user.name 'Lab | zefry'
          git config user.email 'lab.zefa@gmail.com'
          git add -A
          git commit -m 'Sprint251: support versioned runtime hardlink topology' -m 'Author by Lab | zefry'
          git push origin HEAD:"$HEAD_BRANCH"

# Author by Lab | zefry
