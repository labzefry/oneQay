name: Sprint163 POS Cash Variance Reconciliation Workspace Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint163-pos-cash-variance-reconciliation-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  preserve-sprint163-pos-cash-variance-reconciliation:
    runs-on: ubuntu-latest
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnY=
      APP_DEBUG: "false"
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      SESSION_DRIVER: array
      CACHE_STORE: array
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Preserve Sprint163 source contract
        run: |
          set -euo pipefail
          test -f apps/web/app/Application/Pos/OperatePosCashVarianceReconciliation.php
          test -f apps/web/app/Application/Pos/PosCashVarianceReconciliationWorkspaceSnapshot.php
          test -f apps/web/app/Infrastructure/Pos/LaravelPosCashVarianceReconciliationWorkspaceRepository.php
          test -f apps/web/app/Providers/PosCashVarianceReconciliationWorkspaceServiceProvider.php
          test -f apps/web/resources/js/pages/Pos/CashVarianceReconciliation.vue
          test -f apps/web/tests/pos-cash-variance-reconciliation-workspace.php
          grep -Fq 'PosCashVarianceReconciliationWorkspaceServiceProvider::class' apps/web/app/Providers/FinalShiftCloseServiceProvider.php
          grep -Fq 'ONEQAY_POS_CASH_VARIANCE_RECONCILIATION_ENABLED' apps/web/config/pos_cash_variance_reconciliation.php

      - name: Preserve operational NO-GO
        run: |
          set -euo pipefail
          test "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" = NOT_EXECUTED
          test "$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)" = NONE
          test "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" = INACTIVE
          test "$(jq -r '.deployment_authority' ops/final-shift-close/STATE.json)" = NOT_GRANTED
          test "$(jq -r '.technical_preview_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
          test "$(jq -r '.production_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
          test "$(jq -r '.updater_activation' ops/final-shift-close/STATE.json)" = INACTIVE
          test "$(jq -r '.selected_target' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = null

      - name: Install PHP dependencies
        working-directory: apps/web
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist

      - name: Execute preserved POS regressions
        working-directory: apps/web
        run: |
          composer test
          php tests/pos-operational-reporting.php
          php tests/pos-cashier-workspace.php
          php tests/pos-shift-start-workspace.php
          php tests/pos-sale-correction-workspace.php
          php tests/pos-sale-history-workspace.php
          php tests/pos-catalog-inventory-setup-workspace.php
          php tests/pos-operations-hub.php
          php tests/pos-cash-variance-derivation.php
          php tests/pos-cash-variance-explanation-authorization.php
          php tests/pos-cash-variance-review-decision-authorization.php
          php tests/pos-final-shift-close-transactional-lifecycle.php
          php tests/pos-cash-variance-reconciliation-workspace.php

      - name: Setup exact Node LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.19.0

      - name: Type-check and build UI
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts --no-fund
          npm run type-check
          npm run build

      - name: Preserve server-authoritative reconciliation invariants
        run: |
          set -euo pipefail
          grep -Fq 'LaravelExpectedCashSnapshotReader' apps/web/app/Infrastructure/Pos/LaravelPosCashVarianceReconciliationWorkspaceRepository.php
          grep -Fq 'DeriveCashVariance' apps/web/app/Infrastructure/Pos/LaravelPosCashVarianceReconciliationWorkspaceRepository.php
          grep -Fq 'resolveVariance($context, $closingCashEvidenceId)' apps/web/app/Application/Pos/OperatePosCashVarianceReconciliation.php
          grep -Fq 'review_rejected_terminal' apps/web/app/Application/Pos/PosCashVarianceReconciliationWorkspaceSnapshot.php
          grep -Fq 'self_review_blocked' apps/web/app/Application/Pos/PosCashVarianceReconciliationWorkspaceSnapshot.php

      - name: Verify tracked-source cleanliness
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
