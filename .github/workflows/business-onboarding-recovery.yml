# Author by Lab | zefry
name: Business Onboarding and Shift Recovery
on:
  push:
    branches: [business-onboarding-recovery-20261020]
  pull_request:
    branches: [main]
    paths: ['apps/web/**', '.github/workflows/business-onboarding-recovery.yml']
permissions:
  contents: read
jobs:
  business-onboarding-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: synthetic-test-only
          MYSQL_DATABASE: oneqay_platform_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psynthetic-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite, mbstring, dom
          tools: composer:v2
          coverage: none
      - run: composer install --working-dir=apps/web --no-interaction --no-progress --prefer-dist
      - run: php apps/web/tests/business-onboarding-recovery.php
      - run: PLATFORM_TEST_ENGINE=mysql php apps/web/tests/business-onboarding-recovery.php
