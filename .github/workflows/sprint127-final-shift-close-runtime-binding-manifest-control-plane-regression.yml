name: Sprint127 Final Shift Close Runtime Binding Manifest Control Plane Regression

# Attribution: Lab | zefry

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  qualify-runtime-binding-manifest-control-plane-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      CACHE_STORE: array
      SESSION_DRIVER: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Lock exact Sprint127 source envelope
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$base" "$head" | LC_ALL=C sort > /tmp/paths
          cat > /tmp/expected <<'EOF'
          .github/workflows/sprint120-final-shift-close-runtime-binding-manifest-writer.yml
          .github/workflows/sprint121-final-shift-close-runtime-binding-manifest-control-channel.yml
          .github/workflows/sprint122-final-shift-close-runtime-binding-manifest-write-once-cas.yml
          .github/workflows/sprint123-final-shift-close-runtime-binding-manifest-control-plane-registration.yml
          .github/workflows/sprint124-final-shift-close-runtime-db-binding-attestation-control-plane-registration.yml
          .github/workflows/sprint125-final-shift-close-runtime-db-binding-attestation-control-plane-regression.yml
          .github/workflows/sprint126-final-shift-close-runtime-binding-manifest-control-plane-token-hardening.yml
          .github/workflows/sprint127-final-shift-close-runtime-binding-manifest-control-plane-regression.yml
          apps/web/tests/final-shift-close-runtime-binding-manifest-control-plane.php
          docs/SPRINT127_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MANIFEST_CONTROL_PLANE_REGRESSION.md
          ops/final-shift-close/RUNTIME_BINDING_MANIFEST_CONTROL_PLANE_REGRESSION_CONTRACT.json
          EOF
          diff -u /tmp/expected /tmp/paths
          [[ "$(sha256sum /tmp/paths | awk '{print $1}')" == '0024a7b1e7e37964412b96107764c5d8cea6001003b9487fb49d22b32526bb0d' ]]

      - name: Prove control-plane source and operational state remain untouched
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --quiet "$base" "$head" -- \
            apps/web/app/Providers/FinalShiftCloseRuntimeBindingManifestMaterializationServiceProvider.php \
            apps/web/app/Delivery/Http/Middleware/RequireFinalShiftCloseRuntimeBindingMaterializationTokenMiddleware.php \
            apps/web/config/final_shift_close_runtime_binding_materialization.php \
            apps/web/bootstrap/app.php \
            apps/web/bootstrap/providers.php \
            apps/web/routes \
            apps/web/app/Delivery/Http/Pos/FinalShiftCloseRuntimeBindingManifestMaterializationController.php \
            apps/web/app/Application/Pos/FinalShiftCloseRuntimeBindingManifestMaterializer.php \
            apps/web/app/Infrastructure/Pos/FilesystemFinalShiftCloseRuntimeBindingManifestWriter.php \
            apps/web/app/Providers/FinalShiftCloseRuntimeDbBindingAttestationServiceProvider.php \
            apps/web/app/Delivery/Http/Middleware/RequireFinalShiftCloseRuntimeBindingTokenMiddleware.php \
            apps/web/config/final_shift_close_runtime_db_binding_attestation.php \
            apps/web/config/oneqay.php \
            apps/web/database/migrations \
            .github/workflows/final-shift-close-migration27-selected-target-db-binding.yml \
            .github/workflows/final-shift-close-migration27-execution.yml \
            ops/final-shift-close/STATE.json \
            ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json
          [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" == 'NOT_EXECUTED' ]]
          [[ "$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)" == 'NONE' ]]
          [[ "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET' ]]
          [[ "$(jq -r '.selected_target' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'null' ]]

      - name: Validate Sprint127 machine-readable contract
        shell: bash
        run: |
          set -euo pipefail
          file=ops/final-shift-close/RUNTIME_BINDING_MANIFEST_CONTROL_PLANE_REGRESSION_CONTRACT.json
          jq -e '
            .schema_version == 1 and
            .feature == "final-shift-close" and
            .sprint == 127 and
            .bounded_objective == "RUNTIME_BINDING_MANIFEST_CONTROL_PLANE_EXECUTABLE_OFF_SWITCH_REGRESSION" and
            .execution_mode == "CI_ONLY_SYNTHETIC_CONFIGURATION" and
            .gate_matrix.disabled_with_valid_token == "ROUTE_ABSENT_HTTP_404" and
            .gate_matrix.enabled_with_empty_token == "ROUTE_ABSENT_HTTP_404" and
            .gate_matrix.enabled_with_short_token == "ROUTE_ABSENT_HTTP_404" and
            .gate_matrix.enabled_with_oversized_token == "ROUTE_ABSENT_HTTP_404" and
            .gate_matrix.enabled_with_valid_token_missing_auth == "ROUTE_REGISTERED_HTTP_401" and
            .gate_matrix.enabled_with_valid_token_malformed_auth == "ROUTE_REGISTERED_HTTP_401" and
            .registered_route_contract.http_method == "POST_ONLY" and
            .registered_route_contract.throttle == "1_PER_MINUTE" and
            .registered_route_contract.valid_bearer_request_performed == false and
            .registered_route_contract.controller_invocation_performed == false and
            .token_policy.minimum_length == 32 and
            .token_policy.maximum_length == 512 and
            .source_preservation.materialization_provider == "UNCHANGED" and
            .source_preservation.materialization_middleware == "UNCHANGED" and
            .canonical_boundaries.runtime_configuration_mutation == "NOT_PERFORMED" and
            .canonical_boundaries.runtime_token_provisioning == "NOT_PERFORMED" and
            .canonical_boundaries.valid_bearer_request == "NOT_PERFORMED" and
            .canonical_boundaries.controller_invocation == "NOT_PERFORMED" and
            .canonical_boundaries.runtime_manifest_materialization == "NOT_PERFORMED" and
            .canonical_boundaries.migration27_execution == "NOT_PERFORMED" and
            .canonical_boundaries.permission_provisioning == "NONE" and
            .canonical_boundaries.feature_activation == "INACTIVE" and
            .source_envelope_sha256 == "0024a7b1e7e37964412b96107764c5d8cea6001003b9487fb49d22b32526bb0d"
          ' "$file" >/dev/null

      - name: Validate regression source and locked dependencies
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php -l tests/final-shift-close-runtime-binding-manifest-control-plane.php
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          composer audit --locked --no-interaction --abandoned=report

      - name: Prove regression source never sends valid bearer credential
        shell: bash
        run: |
          set -euo pipefail
          test=apps/web/tests/final-shift-close-runtime-binding-manifest-control-plane.php
          grep -Fq "'enabled-valid-token-missing-auth'" "$test"
          grep -Fq "'enabled-valid-token-malformed-auth'" "$test"
          grep -Fq "'HTTP_AUTHORIZATION'] = 'Bearer short'" "$test"
          grep -Fq "getStatusCode() === 401" "$test"
          ! grep -Fq 'Bearer vvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvv' "$test"
          ! grep -Eq '(Artisan::|DB::|connection\(|materialize\()' "$test"

      - name: Prove disabled gate keeps route absent
        working-directory: apps/web
        env:
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_ENABLED: 'false'
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_TOKEN: vvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvv
        run: php tests/final-shift-close-runtime-binding-manifest-control-plane.php disabled

      - name: Prove enabled gate with empty token keeps route absent
        working-directory: apps/web
        env:
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_ENABLED: 'true'
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_TOKEN: ''
        run: php tests/final-shift-close-runtime-binding-manifest-control-plane.php enabled-empty-token

      - name: Prove enabled gate with short token keeps route absent
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf 's%.0s' {1..31})"
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_ENABLED=true \
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_TOKEN="$token" \
            php tests/final-shift-close-runtime-binding-manifest-control-plane.php enabled-short-token

      - name: Prove enabled gate with oversized token keeps route absent
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          token="$(printf 'o%.0s' {1..513})"
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_ENABLED=true \
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_TOKEN="$token" \
            php tests/final-shift-close-runtime-binding-manifest-control-plane.php enabled-oversized-token

      - name: Prove valid gate rejects missing bearer before controller
        working-directory: apps/web
        env:
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_ENABLED: 'true'
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_TOKEN: vvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvv
        run: php tests/final-shift-close-runtime-binding-manifest-control-plane.php enabled-valid-token-missing-auth

      - name: Prove valid gate rejects malformed bearer before controller
        working-directory: apps/web
        env:
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_ENABLED: 'true'
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_TOKEN: vvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvv
        run: php tests/final-shift-close-runtime-binding-manifest-control-plane.php enabled-valid-token-malformed-auth

      - name: Lock Sprint126 token hardening preservation
        shell: bash
        run: |
          set -euo pipefail
          provider=apps/web/app/Providers/FinalShiftCloseRuntimeBindingManifestMaterializationServiceProvider.php
          middleware=apps/web/app/Delivery/Http/Middleware/RequireFinalShiftCloseRuntimeBindingMaterializationTokenMiddleware.php
          grep -Fq 'strlen($token) >= 32' "$provider"
          grep -Fq 'strlen($token) <= 512' "$provider"
          grep -Fq 'strlen($this->expectedToken) < 32' "$middleware"
          grep -Fq 'strlen($this->expectedToken) > 512' "$middleware"
          grep -Fq '[A-Za-z0-9._~+\/-=]{32,512}' "$middleware"
          grep -Fq 'hash_equals($this->expectedToken, $matches[1])' "$middleware"

      - name: Lock no operational invocation or activation
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq 'workflow_dispatch' .github/workflows/sprint127-final-shift-close-runtime-binding-manifest-control-plane-regression.yml
          doc=docs/SPRINT127_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MANIFEST_CONTROL_PLANE_REGRESSION.md
          grep -Fq 'SPRINT127_CONTROL_PLANE_REGRESSION = EXECUTABLE_CI_ONLY' "$doc"
          grep -Fq 'SPRINT127_RUNTIME_CONFIGURATION_MUTATION = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT127_RUNTIME_TOKEN_PROVISIONING = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT127_VALID_BEARER_REQUEST = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT127_CONTROLLER_INVOCATION = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT127_RUNTIME_MANIFEST_MATERIALIZATION = NOT_PERFORMED' "$doc"
          grep -Fq 'MIGRATION_27_EXECUTION = NOT_PERFORMED' "$doc"
          grep -Fq 'FEATURE_ACTIVATION = INACTIVE' "$doc"
          grep -Fq 'PRODUCTION = NO-GO' "$doc"

      - name: Verify tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "$(git status --porcelain)" ]]
