name: Sprint130 Final Shift Close Canonical Runtime Control Plane Token Policy

# Attribution: Lab | zefry

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sprint130-final-shift-close-canonical-runtime-control-plane-token-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify-canonical-runtime-control-plane-token-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      CACHE_STORE: array
      SESSION_DRIVER: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Preserve successor-compatible historical regression boundary
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$base" "$head" | LC_ALL=C sort > /tmp/paths
          [[ -s /tmp/paths ]]
          # Sprint130 is historical from Sprint131 onward and validates
          # its owned canonical token-policy invariant without owning the new full envelope.
          # Historical regression workflows validate their owned invariants only.
          # Exact full-PR envelope locking belongs to the active sprint workflow.

      - name: Prove runtime and operational state remain untouched
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --quiet "$base" "$head" -- \
            apps/web/config/final_shift_close_runtime_binding_materialization.php \
            apps/web/config/final_shift_close_runtime_db_binding_attestation.php \
            apps/web/bootstrap/app.php \
            apps/web/bootstrap/providers.php \
            apps/web/routes \
            apps/web/app/Delivery/Http/Pos/FinalShiftCloseRuntimeBindingManifestMaterializationController.php \
            apps/web/app/Delivery/Http/Pos/FinalShiftCloseRuntimeDbBindingAttestationController.php \
            apps/web/app/Application/Pos/FinalShiftCloseRuntimeBindingManifestMaterializer.php \
            apps/web/app/Application/Pos/FinalShiftCloseRuntimeDbBindingAttestation.php \
            apps/web/app/Infrastructure/Pos/FilesystemFinalShiftCloseRuntimeBindingManifestWriter.php \
            apps/web/app/Infrastructure/Pos/LaravelFinalShiftCloseRuntimeDatabaseIdentityReader.php \
            apps/web/database/migrations \
            .github/workflows/final-shift-close-migration27-selected-target-db-binding.yml \
            .github/workflows/final-shift-close-migration27-execution.yml \
            ops/final-shift-close/STATE.json \
            ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json
          [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" == 'NOT_EXECUTED' ]]
          [[ "$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)" == 'NONE' ]]
          [[ "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET' ]]
          [[ "$(jq -r '.selected_target' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'null' ]]

      - name: Validate canonical policy source and consumers
        shell: bash
        run: |
          set -euo pipefail
          policy=apps/web/app/Application/Pos/FinalShiftCloseRuntimeControlPlaneTokenPolicy.php
          materialization_provider=apps/web/app/Providers/FinalShiftCloseRuntimeBindingManifestMaterializationServiceProvider.php
          db_provider=apps/web/app/Providers/FinalShiftCloseRuntimeDbBindingAttestationServiceProvider.php
          materialization_middleware=apps/web/app/Delivery/Http/Middleware/RequireFinalShiftCloseRuntimeBindingMaterializationTokenMiddleware.php
          db_middleware=apps/web/app/Delivery/Http/Middleware/RequireFinalShiftCloseRuntimeBindingTokenMiddleware.php

          grep -Fq 'public const MINIMUM_LENGTH = 32;' "$policy"
          grep -Fq 'public const MAXIMUM_LENGTH = 512;' "$policy"
          grep -Fq '[A-Za-z0-9._~+=\/-]+' "$policy"
          grep -Fq "private const BEARER_PREFIX = 'Bearer ';" "$policy"
          grep -Fq 'public static function isValidToken(mixed $token): bool' "$policy"
          grep -Fq 'public static function parseBearerCredential(mixed $authorization): ?string' "$policy"

          for provider in "$materialization_provider" "$db_provider"; do
            grep -Fq 'FinalShiftCloseRuntimeControlPlaneTokenPolicy::isValidToken(' "$provider"
            ! grep -Fq 'preg_match(' "$provider"
          done

          for middleware in "$materialization_middleware" "$db_middleware"; do
            grep -Fq 'FinalShiftCloseRuntimeControlPlaneTokenPolicy::isValidToken($this->expectedToken)' "$middleware"
            grep -Fq 'FinalShiftCloseRuntimeControlPlaneTokenPolicy::parseBearerCredential(' "$middleware"
            grep -Fq 'hash_equals($this->expectedToken, $providedToken)' "$middleware"
            ! grep -Fq '[A-Za-z0-9._~+=\/-]{32,512}' "$middleware"
          done

          grep -Fq 'return $this->rejectionResponse(503);' "$materialization_middleware"
          grep -Fq 'return $this->rejectionResponse(401);' "$materialization_middleware"
          grep -Fq "return response('', 404" "$db_middleware"
          grep -Fq "'Cache-Control' => 'no-store, private'" "$db_middleware"
          grep -Fq "'throttle:1,1'" "$materialization_provider"
          grep -Fq "'throttle:2,1'" "$db_provider"

      - name: Validate Sprint130 machine-readable contract
        shell: bash
        run: |
          set -euo pipefail
          file=ops/final-shift-close/CANONICAL_RUNTIME_CONTROL_PLANE_TOKEN_POLICY_CONTRACT.json
          jq -e '.schema_version == 1 and .feature == "final-shift-close" and .sprint == 130 and .bounded_objective == "CANONICAL_RUNTIME_CONTROL_PLANE_TOKEN_POLICY" and .execution_mode == "SOURCE_HARDENING_WITH_CI_ONLY_REGRESSION" and .token_policy.minimum_length == 32 and .token_policy.maximum_length == 512 and .token_policy.hyphen == "ALLOWED" and .token_policy.colon == "REJECTED" and .token_policy.bearer_parsing == "CANONICAL_POLICY" and .token_policy.comparison == "HASH_EQUALS_IN_SECURITY_MIDDLEWARE" and .materialization_control_plane.invalid_expected_token == "HTTP_503" and .materialization_control_plane.missing_malformed_invalid_or_mismatched_bearer == "HTTP_401" and .db_attestation_control_plane.invalid_expected_token == "HTTP_404_CLOAKED" and .db_attestation_control_plane.missing_malformed_invalid_or_mismatched_bearer == "HTTP_404_CLOAKED" and .successor_compatibility.historical_full_pr_envelope_lock == "NOT_REINTRODUCED" and .source_envelope.path_count == 17 and .source_envelope.sha256 == "a9250384c5a6a6d57664f11587bbe9bc4a981f149d1e44aace2e95aaca94fb24" and .canonical_boundaries.valid_control_plane_request == "NOT_PERFORMED" and .canonical_boundaries.controller_invocation == "NOT_PERFORMED" and .canonical_boundaries.runtime_manifest_materialization == "NOT_PERFORMED" and .canonical_boundaries.runtime_db_binding_attestation == "NOT_PERFORMED" and .canonical_boundaries.migration27_execution == "NOT_PERFORMED" and .canonical_boundaries.permission_provisioning == "NONE" and .canonical_boundaries.feature_activation == "INACTIVE"' "$file" >/dev/null

      - name: Validate PHP syntax and locked dependencies
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Application/Pos/FinalShiftCloseRuntimeControlPlaneTokenPolicy.php
          php -l app/Providers/FinalShiftCloseRuntimeBindingManifestMaterializationServiceProvider.php
          php -l app/Providers/FinalShiftCloseRuntimeDbBindingAttestationServiceProvider.php
          php -l app/Delivery/Http/Middleware/RequireFinalShiftCloseRuntimeBindingMaterializationTokenMiddleware.php
          php -l app/Delivery/Http/Middleware/RequireFinalShiftCloseRuntimeBindingTokenMiddleware.php
          php -l tests/final-shift-close-runtime-control-plane-token-character-policy.php
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          composer audit --locked --no-interaction --abandoned=report

      - name: Prove canonical length character and bearer policy
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-token-character-policy.php regex-matrix

      - name: Prove materialization provider registration matrix
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          min="$(printf 'a%.0s' {1..31})-"
          max="$(printf 'a%.0s' {1..511})/"
          short="$(printf 'a%.0s' {1..31})"
          long="$(printf 'a%.0s' {1..513})"
          invalid="$(printf 'a%.0s' {1..31}):"

          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_ENABLED=false ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_TOKEN="$min" php tests/final-shift-close-runtime-control-plane-token-character-policy.php materialization-route-absent
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_ENABLED=true ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_TOKEN="$short" php tests/final-shift-close-runtime-control-plane-token-character-policy.php materialization-route-absent
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_ENABLED=true ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_TOKEN="$long" php tests/final-shift-close-runtime-control-plane-token-character-policy.php materialization-route-absent
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_ENABLED=true ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_TOKEN="$invalid" php tests/final-shift-close-runtime-control-plane-token-character-policy.php materialization-route-absent
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_ENABLED=true ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_TOKEN="$min" php tests/final-shift-close-runtime-control-plane-token-character-policy.php materialization-route-present
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_ENABLED=true ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_TOKEN="$max" php tests/final-shift-close-runtime-control-plane-token-character-policy.php materialization-route-present

      - name: Prove DB attestation provider registration matrix
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          min="$(printf 'a%.0s' {1..31})-"
          max="$(printf 'a%.0s' {1..511})/"
          short="$(printf 'a%.0s' {1..31})"
          long="$(printf 'a%.0s' {1..513})"
          invalid="$(printf 'a%.0s' {1..31}):"

          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_DB_BINDING_ATTESTATION_ENABLED=false ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_DB_BINDING_ATTESTATION_TOKEN="$min" php tests/final-shift-close-runtime-control-plane-token-character-policy.php db-route-absent
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_DB_BINDING_ATTESTATION_ENABLED=true ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_DB_BINDING_ATTESTATION_TOKEN="$short" php tests/final-shift-close-runtime-control-plane-token-character-policy.php db-route-absent
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_DB_BINDING_ATTESTATION_ENABLED=true ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_DB_BINDING_ATTESTATION_TOKEN="$long" php tests/final-shift-close-runtime-control-plane-token-character-policy.php db-route-absent
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_DB_BINDING_ATTESTATION_ENABLED=true ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_DB_BINDING_ATTESTATION_TOKEN="$invalid" php tests/final-shift-close-runtime-control-plane-token-character-policy.php db-route-absent
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_DB_BINDING_ATTESTATION_ENABLED=true ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_DB_BINDING_ATTESTATION_TOKEN="$min" php tests/final-shift-close-runtime-control-plane-token-character-policy.php db-route-present
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_DB_BINDING_ATTESTATION_ENABLED=true ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_DB_BINDING_ATTESTATION_TOKEN="$max" php tests/final-shift-close-runtime-control-plane-token-character-policy.php db-route-present

      - name: Prove materialization middleware dispositions
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php tests/final-shift-close-runtime-control-plane-token-character-policy.php materialization-invalid-expected
          php tests/final-shift-close-runtime-control-plane-token-character-policy.php materialization-missing-bearer
          php tests/final-shift-close-runtime-control-plane-token-character-policy.php materialization-malformed-bearer
          php tests/final-shift-close-runtime-control-plane-token-character-policy.php materialization-invalid-bearer
          php tests/final-shift-close-runtime-control-plane-token-character-policy.php materialization-mismatched-bearer

      - name: Prove DB attestation middleware dispositions
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php tests/final-shift-close-runtime-control-plane-token-character-policy.php db-invalid-expected
          php tests/final-shift-close-runtime-control-plane-token-character-policy.php db-missing-bearer
          php tests/final-shift-close-runtime-control-plane-token-character-policy.php db-malformed-bearer
          php tests/final-shift-close-runtime-control-plane-token-character-policy.php db-invalid-bearer
          php tests/final-shift-close-runtime-control-plane-token-character-policy.php db-mismatched-bearer

      - name: Lock no operational invocation or activation
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq 'workflow_dispatch' .github/workflows/sprint130-final-shift-close-canonical-runtime-control-plane-token-policy.yml
          doc=docs/SPRINT130_FINAL_SHIFT_CLOSE_CANONICAL_RUNTIME_CONTROL_PLANE_TOKEN_POLICY.md
          grep -Fq 'SPRINT130_VALID_CONTROL_PLANE_REQUEST = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT130_CONTROLLER_INVOCATION = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT130_RUNTIME_CONFIGURATION_MUTATION = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT130_RUNTIME_TOKEN_PROVISIONING = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT130_RUNTIME_MANIFEST_MATERIALIZATION = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT130_RUNTIME_DB_BINDING_ATTESTATION = NOT_PERFORMED' "$doc"
          grep -Fq 'MIGRATION_27_EXECUTION = NOT_PERFORMED' "$doc"
          grep -Fq 'PERMISSION_PROVISIONING = NONE' "$doc"
          grep -Fq 'FEATURE_ACTIVATION = INACTIVE' "$doc"
          grep -Fq 'PRODUCTION = NO-GO' "$doc"

      - name: Verify tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "$(git status --porcelain)" ]]
