name: Sprint144 Final Shift Close Canonical Control Plane Named Route Identity Throttle Response Hardening Regression

# Attribution: Lab | zefry

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sprint144-final-shift-close-canonical-control-plane-named-route-identity-throttle-response-hardening-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify-canonical-control-plane-named-route-identity-throttle-response-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      CACHE_STORE: array
      SESSION_DRIVER: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Lock exact Sprint144 source envelope
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$base" "$head" | LC_ALL=C sort > /tmp/paths
          cat > /tmp/expected <<'EOF'
          .github/workflows/sprint144-final-shift-close-canonical-control-plane-named-route-identity-throttle-response-hardening-regression.yml
          apps/web/app/Delivery/Http/Middleware/HardenFinalShiftCloseRuntimeControlPlaneThrottleResponseMiddleware.php
          apps/web/tests/final-shift-close-runtime-control-plane-named-route-identity-throttle-response-hardening-regression.php
          docs/SPRINT144_FINAL_SHIFT_CLOSE_CANONICAL_CONTROL_PLANE_NAMED_ROUTE_IDENTITY_THROTTLE_RESPONSE_HARDENING_REGRESSION.md
          ops/final-shift-close/CANONICAL_RUNTIME_CONTROL_PLANE_NAMED_ROUTE_IDENTITY_THROTTLE_RESPONSE_HARDENING_REGRESSION_CONTRACT.json
          EOF
          diff -u /tmp/expected /tmp/paths
          [[ "$(sha256sum /tmp/paths | awk '{print $1}')" == 'a057418c27d32d2a3c0bb88bf694fb7389304c392d101e04a1d45955805c50ab' ]]

      - name: Preserve Sprint143 historical successor compatibility
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/sprint143-final-shift-close-canonical-control-plane-head-throttle-rejection-response-hardening-regression.yml
          grep -Fq 'Preserve successor-compatible historical regression boundary' "$workflow"
          grep -Fq 'Sprint143 is historical after its canonical squash merge.' "$workflow"
          ! grep -Fq 'Lock exact Sprint143 source envelope' "$workflow"

      - name: Validate Sprint144 machine-readable contract
        shell: bash
        run: |
          set -euo pipefail
          file=ops/final-shift-close/CANONICAL_RUNTIME_CONTROL_PLANE_NAMED_ROUTE_IDENTITY_THROTTLE_RESPONSE_HARDENING_REGRESSION_CONTRACT.json
          jq -e '
            .schema_version == 1 and
            .feature == "final-shift-close" and
            .sprint == 144 and
            .bounded_objective == "CANONICAL_CONTROL_PLANE_NAMED_ROUTE_IDENTITY_THROTTLE_RESPONSE_HARDENING_REGRESSION" and
            .execution_mode == "CI_ONLY_SYNTHETIC_DIRECT_MIDDLEWARE_ROUTE_IDENTITY_QUALIFICATION" and
            .qualification.new_executable_gap == "SAME_PATH_METHOD_NONCANONICAL_ROUTE_IDENTITY_MUST_REMAIN_FRAMEWORK_OWNED" and
            .qualification.ownership_signal == "ROUTE_NAME_PLUS_METHOD_PLUS_PATH" and
            .qualification.route_registration_changed == false and
            .qualification.route_middleware_stack_changed == false and
            .qualification.authentication_before_throttle_preserved == true and
            .qualification.throttle_limits_changed == false and
            .qualification.materialization_method_ownership == ["POST"] and
            .qualification.db_attestation_method_ownership == ["GET", "HEAD"] and
            .qualification.canonical_path_match_still_required == true and
            .qualification.noncanonical_same_path_post_framework_owned == true and
            .qualification.noncanonical_same_path_get_framework_owned == true and
            .qualification.noncanonical_same_path_head_framework_owned == true and
            .qualification.unresolved_route_framework_owned == true and
            .qualification.canonical_materialization_post_hardened == true and
            .qualification.canonical_db_attestation_get_hardened == true and
            .qualification.canonical_db_attestation_head_hardened == true and
            .qualification.throttle_rejection_status == 429 and
            .qualification.canonical_throttle_rejection_body == "EMPTY" and
            .qualification.privacy_security_headers_preserved == true and
            .qualification.framework_rate_limit_metadata_preserved == true and
            .qualification.framework_owned_shadow_response_not_rewritten == true and
            .historical_ownership.sprint143_db_attestation_head_throttle_rejection_response_hardening == "PRESERVED" and
            .historical_ownership.sprint144_named_route_identity_throttle_response_hardening == "OWNED" and
            .source_envelope.path_count == 5 and
            .source_envelope.sha256 == "a057418c27d32d2a3c0bb88bf694fb7389304c392d101e04a1d45955805c50ab" and
            .canonical_boundaries.migration27_execution == "NOT_PERFORMED" and
            .canonical_boundaries.permission_provisioning == "NONE" and
            .canonical_boundaries.feature_activation == "INACTIVE" and
            .canonical_boundaries.selected_target == null and
            .canonical_boundaries.deployment_authority == "NOT_GRANTED" and
            .canonical_boundaries.technical_preview == "NO-GO" and
            .canonical_boundaries.production == "NO-GO" and
            .canonical_boundaries.updater == "INACTIVE" and
            .attribution == "Author by Lab | zefry"
          ' "$file" >/dev/null

      - name: Prove route identity ownership remains bounded
        shell: bash
        run: |
          set -euo pipefail
          middleware=apps/web/app/Delivery/Http/Middleware/HardenFinalShiftCloseRuntimeControlPlaneThrottleResponseMiddleware.php
          materialization_route=apps/web/routes/final-shift-close-runtime-binding-manifest-materialization.php
          db_route=apps/web/routes/final-shift-close-runtime-db-binding-attestation.php
          grep -Fq 'use Illuminate\Routing\Route;' "$middleware"
          grep -Fq 'MATERIALIZATION_ROUTE_NAME' "$middleware"
          grep -Fq 'DB_ATTESTATION_ROUTE_NAME' "$middleware"
          grep -Fq 'if (! $route instanceof Route)' "$middleware"
          grep -Fq '$routeName === self::MATERIALIZATION_ROUTE_NAME' "$middleware"
          grep -Fq '$routeName === self::DB_ATTESTATION_ROUTE_NAME' "$middleware"
          grep -Fq "request->isMethod('POST')" "$middleware"
          grep -Fq "request->isMethod('GET')" "$middleware"
          grep -Fq "request->isMethod('HEAD')" "$middleware"
          grep -Fq "name('internal.final-shift-close.runtime-binding-manifest.materialize')" "$materialization_route"
          grep -Fq "name('internal.final-shift-close.runtime-db-binding-attestation')" "$db_route"

      - name: Prove operational NO-GO state remains intact
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" == 'NOT_EXECUTED' ]]
          [[ "$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)" == 'NONE' ]]
          [[ "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.deployment_authority' ops/final-shift-close/STATE.json)" == 'NOT_GRANTED' ]]
          [[ "$(jq -r '.technical_preview_activation' ops/final-shift-close/STATE.json)" == 'NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.production_activation' ops/final-shift-close/STATE.json)" == 'NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.updater_activation' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET' ]]
          [[ "$(jq -r '.selected_target' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'null' ]]

      - name: Validate PHP syntax and locked dependencies
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Delivery/Http/Middleware/HardenFinalShiftCloseRuntimeControlPlaneThrottleResponseMiddleware.php
          php -l tests/final-shift-close-runtime-control-plane-named-route-identity-throttle-response-hardening-regression.php
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          composer audit --locked --no-interaction --abandoned=report

      - name: Execute Sprint144 named-route identity regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-named-route-identity-throttle-response-hardening-regression.php

      - name: Preserve Sprint143 HEAD throttle rejection response regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-head-throttle-rejection-response-hardening-regression.php

      - name: Preserve Sprint142 throttle rejection response hardening regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-throttle-rejection-response-hardening-regression.php

      - name: Preserve Sprint141 HTTP auth rejection response regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-http-auth-rejection-response-regression.php

      - name: Preserve Sprint140 direct middleware auth rejection regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-auth-rejection-response-hardening-regression.php

      - name: Preserve Sprint139 auth-before-throttle regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-auth-before-throttle-regression.php

      - name: Preserve Sprint138 authenticated HTTP throttle regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-authenticated-http-throttle-regression.php

      - name: Preserve Sprint135 route metadata regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-positive-registration-metadata-regression.php

      - name: Lock documentation and workflow boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'a057418c27d32d2a3c0bb88bf694fb7389304c392d101e04a1d45955805c50ab' docs/SPRINT144_FINAL_SHIFT_CLOSE_CANONICAL_CONTROL_PLANE_NAMED_ROUTE_IDENTITY_THROTTLE_RESPONSE_HARDENING_REGRESSION.md
          ! grep -Eq '^[[:space:]]*workflow_dispatch[[:space:]]*:' .github/workflows/sprint144-final-shift-close-canonical-control-plane-named-route-identity-throttle-response-hardening-regression.yml

      - name: Verify tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code

# Author by Lab | zefry
