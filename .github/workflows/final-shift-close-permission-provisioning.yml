name: Final Shift Close Permission Provisioning Evidence

# Attribution: Lab | zefry

on:
  workflow_dispatch:
    inputs:
      target_pr_number:
        description: 'Exact state-transition PR number'
        required: true
        type: string
      target_head_sha:
        description: 'Exact 40-character state-transition PR head SHA'
        required: true
        type: string
      binding_run_id:
        description: 'Exact successful selected-target database-binding workflow run ID'
        required: true
        type: string
      binding_run_attempt:
        description: 'Exact successful selected-target database-binding workflow run attempt'
        required: true
        type: string
      tenant_id:
        description: 'Exact tenant receiving bounded role permission provisioning'
        required: true
        type: string
      actor_identity_id:
        description: 'Existing tenant-scoped control principal identity'
        required: true
        type: string
      actor_organization_id:
        description: 'Existing organization membership used to construct verified actor context'
        required: true
        type: string
      role_id:
        description: 'Existing non-protected tenant role receiving pos.shift.close'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  statuses: write
  actions: read

env:
  TARGET_SELECTION_FILE: ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json
  BINDING_WORKFLOW_PATH: .github/workflows/final-shift-close-migration27-selected-target-db-binding.yml
  BINDING_ARTIFACT_NAME: final-shift-close-migration27-selected-target-db-binding
  BINDING_EVIDENCE_CONTEXT: final-shift-close-migration27-selected-target-db-binding-evidence
  DATABASE_BINDING_ALGORITHM: SHA256_CANONICAL_JSON_DATABASE_HOSTNAME_PORT_V1

concurrency:
  group: final-shift-close-permission-${{ inputs.target_pr_number }}
  cancel-in-progress: false

jobs:
  provision-permission-and-publish-evidence:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: final-shift-close-permission-provisioning
    env:
      ONEQAY_DB_DRIVER: mysql
      ONEQAY_DB_HOST: ${{ secrets.ONEQAY_PERMISSION_DB_HOST }}
      ONEQAY_DB_PORT: ${{ secrets.ONEQAY_PERMISSION_DB_PORT }}
      ONEQAY_DB_DATABASE: ${{ secrets.ONEQAY_PERMISSION_DB_DATABASE }}
      ONEQAY_DB_USERNAME: ${{ secrets.ONEQAY_PERMISSION_DB_USERNAME }}
      ONEQAY_DB_PASSWORD: ${{ secrets.ONEQAY_PERMISSION_DB_PASSWORD }}
      ONEQAY_PERSISTENCE_ENABLED: 'false'
      APP_ENV: production
      APP_DEBUG: 'false'
      EVIDENCE_CONTEXT: final-shift-close-permission-provisioning-evidence
      PERMISSION_ID: pos.shift.close

    steps:
      - name: Checkout canonical dispatch source only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate canonical selected target and exact permission transition
        id: preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          TARGET_PR: ${{ inputs.target_pr_number }}
          TARGET_HEAD: ${{ inputs.target_head_sha }}
          BINDING_RUN_ID: ${{ inputs.binding_run_id }}
          BINDING_RUN_ATTEMPT: ${{ inputs.binding_run_attempt }}
          TENANT_ID: ${{ inputs.tenant_id }}
          ACTOR_ID: ${{ inputs.actor_identity_id }}
          ACTOR_ORG: ${{ inputs.actor_organization_id }}
          ROLE_ID: ${{ inputs.role_id }}
        run: |
          set -euo pipefail

          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_REPOSITORY" == 'labzefry/oneQay' ]]
          [[ "$TARGET_PR" =~ ^[1-9][0-9]*$ ]]
          [[ "$TARGET_HEAD" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BINDING_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$BINDING_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$TENANT_ID" =~ ^[a-z0-9][a-z0-9_-]{0,63}$ ]]
          [[ "$ACTOR_ID" =~ ^[a-z0-9][a-z0-9_-]{0,95}$ ]]
          [[ "$ACTOR_ORG" =~ ^[a-z0-9][a-z0-9_-]{0,63}$ ]]
          [[ "$ROLE_ID" =~ ^[a-z][a-z0-9_-]{0,63}$ ]]
          [[ "$ROLE_ID" != platform-* ]]
          [[ "$ROLE_ID" != platform_* ]]

          api() {
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$1"
          }

          main_json="$(api "$API_URL/repos/$REPOSITORY/branches/main")"
          main_sha="$(jq -r '.commit.sha' <<<"$main_json")"
          [[ "$main_sha" == "$GITHUB_SHA" ]] || {
            echo "Dispatch source is not current canonical main: $GITHUB_SHA != $main_sha" >&2
            exit 1
          }

          jq -e 'type == "object"' "$TARGET_SELECTION_FILE" >/dev/null
          [[ "$(jq -r '.selection_state' "$TARGET_SELECTION_FILE")" == 'SELECTED_NOT_AUTHORIZED' ]] || {
            echo 'Permission provisioning requires a canonical durable target in SELECTED_NOT_AUTHORIZED state.' >&2
            exit 1
          }
          [[ "$(jq -r '.selected_target | type' "$TARGET_SELECTION_FILE")" == 'object' ]]

          selected_environment="$(jq -r '.selected_target.environment_id // ""' "$TARGET_SELECTION_FILE")"
          selected_runtime="$(jq -r '.selected_target.runtime_class // ""' "$TARGET_SELECTION_FILE")"
          selected_source="$(jq -r '.selected_target.exact_running_source_commit // ""' "$TARGET_SELECTION_FILE")"
          selected_artifact="$(jq -r '.selected_target.exact_running_artifact_sha256 // ""' "$TARGET_SELECTION_FILE")"
          selected_attestation="$(jq -r '.selected_target.readiness_attestation_sha256 // ""' "$TARGET_SELECTION_FILE")"
          selected_selection_fingerprint="$(jq -r '.selected_target.selection_fingerprint_sha256 // ""' "$TARGET_SELECTION_FILE")"
          selected_ingestion_run_id="$(jq -r '.selected_target.trusted_ingestion.run_id // ""' "$TARGET_SELECTION_FILE")"
          selected_ingestion_run_attempt="$(jq -r '.selected_target.trusted_ingestion.run_attempt // ""' "$TARGET_SELECTION_FILE")"
          selected_ingestion_fingerprint="$(jq -r '.selected_target.trusted_ingestion.ingestion_fingerprint_sha256 // ""' "$TARGET_SELECTION_FILE")"

          [[ "$selected_environment" =~ ^[a-z0-9][a-z0-9._:-]{7,127}$ ]]
          [[ "$selected_runtime" =~ ^[a-z0-9][a-z0-9._:-]{7,127}$ ]]
          [[ "$selected_source" =~ ^[0-9a-f]{40}$ ]]
          [[ "$selected_artifact" =~ ^[0-9a-f]{64}$ ]]
          [[ "$selected_attestation" =~ ^[0-9a-f]{64}$ ]]
          [[ "$selected_selection_fingerprint" =~ ^[0-9a-f]{64}$ ]]
          [[ "$selected_ingestion_run_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$selected_ingestion_run_attempt" =~ ^[1-9][0-9]*$ ]]
          [[ "$selected_ingestion_fingerprint" =~ ^[0-9a-f]{64}$ ]]

          case "$selected_runtime" in
            local|test|testing|ci|preview|synthetic-preview|production|prod)
              echo 'Canonical selected runtime class is not eligible for bounded permission provisioning.' >&2
              exit 1
              ;;
          esac

          selected_compare="$(api "$API_URL/repos/$REPOSITORY/compare/$selected_source...$GITHUB_SHA")"
          selected_status="$(jq -r '.status' <<<"$selected_compare")"
          selected_behind="$(jq -r '.behind_by' <<<"$selected_compare")"
          [[ "$selected_status" == 'ahead' || "$selected_status" == 'identical' ]]
          [[ "$selected_behind" == '0' ]]

          pr_json="$(api "$API_URL/repos/$REPOSITORY/pulls/$TARGET_PR")"
          [[ "$(jq -r '.state' <<<"$pr_json")" == 'open' ]]
          [[ "$(jq -r '.draft' <<<"$pr_json")" == 'false' ]]
          [[ "$(jq -r '.base.ref' <<<"$pr_json")" == 'main' ]]
          [[ "$(jq -r '.base.sha' <<<"$pr_json")" == "$GITHUB_SHA" ]] || {
            echo 'Target PR must be based on current canonical main.' >&2
            exit 1
          }
          [[ "$(jq -r '.head.sha' <<<"$pr_json")" == "$TARGET_HEAD" ]]
          [[ "$(jq -r '.head.repo.full_name' <<<"$pr_json")" == "$REPOSITORY" ]] || {
            echo 'Target transition must originate from this repository.' >&2
            exit 1
          }

          files_json="$(api "$API_URL/repos/$REPOSITORY/pulls/$TARGET_PR/files?per_page=100")"
          [[ "$(jq 'length' <<<"$files_json")" -eq 1 ]]
          [[ "$(jq -r '.[0].filename' <<<"$files_json")" == 'ops/final-shift-close/STATE.json' ]] || {
            echo 'Target PR must change only the canonical Final Shift Close state file.' >&2
            exit 1
          }

          cp ops/final-shift-close/STATE.json /tmp/base-state.json
          target_content="$(api "$API_URL/repos/$REPOSITORY/contents/ops/final-shift-close/STATE.json?ref=$TARGET_HEAD" | jq -r '.content' | tr -d '\n' | base64 --decode)"
          printf '%s\n' "$target_content" > /tmp/target-state.json
          jq -e . /tmp/base-state.json >/dev/null
          jq -e . /tmp/target-state.json >/dev/null

          [[ "$(jq -r '.migration27.state' /tmp/base-state.json)" == 'EXECUTED' ]]
          [[ "$(jq -r '.permission_provisioning.state' /tmp/base-state.json)" == 'NONE' ]]
          [[ "$(jq -r '.feature_activation.state' /tmp/base-state.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.migration27.state' /tmp/target-state.json)" == 'EXECUTED' ]]
          [[ "$(jq -r '.permission_provisioning.state' /tmp/target-state.json)" == 'PROVISIONED' ]]
          [[ "$(jq -r '.feature_activation.state' /tmp/target-state.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.permission_provisioning.permission_id' /tmp/target-state.json)" == 'pos.shift.close' ]]
          [[ "$(jq -r '.permission_provisioning.default_grant' /tmp/target-state.json)" == 'NONE' ]]

          jq -S '.permission_provisioning.state = "NONE"' /tmp/target-state.json > /tmp/target-normalized.json
          jq -S . /tmp/base-state.json > /tmp/base-normalized.json
          diff -u /tmp/base-normalized.json /tmp/target-normalized.json

          statuses="$(api "$API_URL/repos/$REPOSITORY/commits/$TARGET_HEAD/statuses?per_page=100")"
          require_latest_success() {
            local context="$1"
            local value
            value="$(jq -r --arg context "$context" '[.[] | select(.context == $context)][0].state // "missing"' <<<"$statuses")"
            [[ "$value" == 'success' ]] || {
              echo "Required exact-head status is not success: $context ($value)." >&2
              exit 1
            }
          }
          require_latest_success 'final-shift-close-permission-provisioning-authority'
          require_latest_success 'product-owner-merge-authority'

          runs="$(api "$API_URL/repos/$REPOSITORY/actions/runs?head_sha=$TARGET_HEAD&event=pull_request&per_page=100")"
          require_workflow_success() {
            local workflow_name="$1"
            local conclusion
            conclusion="$(jq -r --arg name "$workflow_name" '[.workflow_runs | .[] | select(.name == $name)][0].conclusion // "missing"' <<<"$runs")"
            [[ "$conclusion" == 'success' ]] || {
              echo "Required qualification workflow is not success: $workflow_name ($conclusion)." >&2
              exit 1
            }
          }
          require_workflow_success 'Governance Required Checks'
          require_workflow_success 'PHP Foundation Regression'
          require_workflow_success 'M7.1 Application Regression'

          printf '%s' "$selected_environment" > /tmp/selected-environment.txt
          printf '%s' "$selected_runtime" > /tmp/selected-runtime.txt
          printf '%s' "$selected_source" > /tmp/selected-source.txt
          printf '%s' "$selected_artifact" > /tmp/selected-artifact.txt
          printf '%s' "$selected_attestation" > /tmp/selected-attestation.txt
          printf '%s' "$selected_selection_fingerprint" > /tmp/selected-selection-fingerprint.txt
          printf '%s' "$selected_ingestion_run_id" > /tmp/selected-ingestion-run-id.txt
          printf '%s' "$selected_ingestion_run_attempt" > /tmp/selected-ingestion-run-attempt.txt
          printf '%s' "$selected_ingestion_fingerprint" > /tmp/selected-ingestion-fingerprint.txt

          echo "target_head=$TARGET_HEAD" >> "$GITHUB_OUTPUT"
          echo 'verified=true' >> "$GITHUB_OUTPUT"
          echo 'Exact permission transition, selected target, and prerequisite authorities qualified.'

      - name: Resolve exact selected-target database-binding evidence
        id: binding
        if: ${{ steps.preflight.outputs.verified == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          BINDING_RUN_ID: ${{ inputs.binding_run_id }}
          BINDING_RUN_ATTEMPT: ${{ inputs.binding_run_attempt }}
        run: |
          set -euo pipefail

          api() {
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$1"
          }

          run="$(api "$API_URL/repos/$REPOSITORY/actions/runs/$BINDING_RUN_ID")"
          [[ "$(jq -r '.path' <<<"$run")" == "$BINDING_WORKFLOW_PATH" ]]
          [[ "$(jq -r '.event' <<<"$run")" == 'workflow_dispatch' ]]
          [[ "$(jq -r '.head_branch' <<<"$run")" == 'main' ]]
          [[ "$(jq -r '.status' <<<"$run")" == 'completed' ]]
          [[ "$(jq -r '.conclusion' <<<"$run")" == 'success' ]]
          [[ "$(jq -r '.run_attempt' <<<"$run")" == "$BINDING_RUN_ATTEMPT" ]]
          binding_head="$(jq -r '.head_sha' <<<"$run")"
          [[ "$binding_head" =~ ^[0-9a-f]{40}$ ]]

          compare="$(api "$API_URL/repos/$REPOSITORY/compare/$binding_head...$GITHUB_SHA")"
          compare_status="$(jq -r '.status' <<<"$compare")"
          compare_behind="$(jq -r '.behind_by' <<<"$compare")"
          [[ "$compare_status" == 'ahead' || "$compare_status" == 'identical' ]]
          [[ "$compare_behind" == '0' ]]

          artifacts="$(api "$API_URL/repos/$REPOSITORY/actions/runs/$BINDING_RUN_ID/artifacts?per_page=100")"
          matches="$(jq --arg n "$BINDING_ARTIFACT_NAME" '[.artifacts[] | select(.name == $n and .expired == false)]' <<<"$artifacts")"
          [[ "$(jq 'length' <<<"$matches")" == '1' ]]
          artifact_id="$(jq -r '.[0].id' <<<"$matches")"
          artifact_size="$(jq -r '.[0].size_in_bytes' <<<"$matches")"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
          (( artifact_size > 0 && artifact_size <= 262144 ))

          curl --fail-with-body --silent --show-error --location \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$API_URL/repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" \
            --output /tmp/permission-selected-target-binding.zip
          (( $(wc -c < /tmp/permission-selected-target-binding.zip) <= 262144 ))

          unzip -Z1 /tmp/permission-selected-target-binding.zip | LC_ALL=C sort > /tmp/binding-actual-entries
          cat > /tmp/binding-expected-entries <<'EOF'
          binding.json
          execution.json
          EOF
          diff -u /tmp/binding-expected-entries /tmp/binding-actual-entries
          mkdir /tmp/permission-selected-target-binding
          unzip -qq /tmp/permission-selected-target-binding.zip -d /tmp/permission-selected-target-binding
          for f in binding.json execution.json; do
            (( $(wc -c < "/tmp/permission-selected-target-binding/$f") > 1 ))
            (( $(wc -c < "/tmp/permission-selected-target-binding/$f") <= 32768 ))
            jq -e 'type == "object"' "/tmp/permission-selected-target-binding/$f" >/dev/null
          done

          binding=/tmp/permission-selected-target-binding/binding.json
          execution=/tmp/permission-selected-target-binding/execution.json
          selected_environment="$(cat /tmp/selected-environment.txt)"
          selected_runtime="$(cat /tmp/selected-runtime.txt)"
          selected_source="$(cat /tmp/selected-source.txt)"
          selected_artifact="$(cat /tmp/selected-artifact.txt)"
          selected_attestation="$(cat /tmp/selected-attestation.txt)"
          selected_selection_fingerprint="$(cat /tmp/selected-selection-fingerprint.txt)"
          selected_ingestion_run_id="$(cat /tmp/selected-ingestion-run-id.txt)"
          selected_ingestion_run_attempt="$(cat /tmp/selected-ingestion-run-attempt.txt)"
          selected_ingestion_fingerprint="$(cat /tmp/selected-ingestion-fingerprint.txt)"

          [[ "$(jq -r '.schema_version' "$binding")" == '1' ]]
          [[ "$(jq -r '.feature' "$binding")" == 'final-shift-close' ]]
          [[ "$(jq -r '.binding_state' "$binding")" == 'VERIFIED_SELECTED_TARGET_DATABASE' ]]
          [[ "$(jq -r '.environment_id' "$binding")" == "$selected_environment" ]]
          [[ "$(jq -r '.runtime_class' "$binding")" == "$selected_runtime" ]]
          [[ "$(jq -r '.exact_running_source_commit' "$binding")" == "$selected_source" ]]
          [[ "$(jq -r '.exact_running_artifact_sha256' "$binding")" == "$selected_artifact" ]]
          [[ "$(jq -r '.readiness_attestation_sha256' "$binding")" == "$selected_attestation" ]]
          [[ "$(jq -r '.selection_fingerprint_sha256' "$binding")" == "$selected_selection_fingerprint" ]]
          [[ "$(jq -r '.trusted_ingestion.run_id' "$binding")" == "$selected_ingestion_run_id" ]]
          [[ "$(jq -r '.trusted_ingestion.run_attempt' "$binding")" == "$selected_ingestion_run_attempt" ]]
          [[ "$(jq -r '.trusted_ingestion.ingestion_fingerprint_sha256' "$binding")" == "$selected_ingestion_fingerprint" ]]
          [[ "$(jq -r '.migration27_state' "$binding")" == 'NOT_EXECUTED' ]]
          [[ "$(jq -r '.database_binding_algorithm' "$binding")" == "$DATABASE_BINDING_ALGORITHM" ]]
          [[ "$(jq -r '.secrets_embedded' "$binding")" == 'false' ]]
          database_binding="$(jq -r '.database_binding_sha256 // ""' "$binding")"
          [[ "$database_binding" =~ ^[0-9a-f]{64}$ ]]

          [[ "$(jq -r '.schema_version' "$execution")" == '1' ]]
          [[ "$(jq -r '.feature' "$execution")" == 'final-shift-close' ]]
          [[ "$(jq -r '.workflow_path' "$execution")" == "$BINDING_WORKFLOW_PATH" ]]
          [[ "$(jq -r '.repository' "$execution")" == 'labzefry/oneQay' ]]
          [[ "$(jq -r '.ref' "$execution")" == 'refs/heads/main' ]]
          [[ "$(jq -r '.source_commit' "$execution")" == "$binding_head" ]]
          [[ "$(jq -r '.run_id' "$execution")" == "$BINDING_RUN_ID" ]]
          [[ "$(jq -r '.run_attempt' "$execution")" == "$BINDING_RUN_ATTEMPT" ]]
          [[ "$(jq -r '.database_binding_sha256' "$execution")" == "$database_binding" ]]
          [[ "$(jq -r '.selection_fingerprint_sha256' "$execution")" == "$selected_selection_fingerprint" ]]
          [[ "$(jq -r '.evidence_context' "$execution")" == "$BINDING_EVIDENCE_CONTEXT" ]]
          [[ "$(jq -r '.evidence_state' "$execution")" == 'success' ]]
          [[ "$(jq -r '.secrets_embedded' "$execution")" == 'false' ]]

          expected_target="$GITHUB_SERVER_URL/$REPOSITORY/actions/runs/$BINDING_RUN_ID"
          statuses="$(api "$API_URL/repos/$REPOSITORY/commits/$selected_source/statuses?per_page=100")"
          exact="$(jq -r --arg c "$BINDING_EVIDENCE_CONTEXT" --arg u "$expected_target" \
            '[.[] | select(.context == $c and .state == "success" and .target_url == $u)][0].state // ""' <<<"$statuses")"
          [[ "$exact" == 'success' ]] || {
            echo 'Exact selected-target database-binding evidence status is not success.' >&2
            exit 1
          }

          echo "expected_db_binding=$database_binding" >> "$GITHUB_OUTPUT"
          echo 'verified=true' >> "$GITHUB_OUTPUT"
          echo 'Exact selected-target database-binding evidence qualified for permission provisioning.'

      - name: Publish pending provisioning evidence
        if: ${{ steps.preflight.outputs.verified == 'true' && steps.binding.outputs.verified == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          TARGET_HEAD: ${{ steps.preflight.outputs.target_head }}
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg state pending \
            --arg context "$EVIDENCE_CONTEXT" \
            --arg description 'Selected-target-bound pos.shift.close provisioning is in progress' \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$API_URL/repos/$REPOSITORY/statuses/$TARGET_HEAD" \
            --data "$payload" >/dev/null

      - name: Execute bounded selected-target permission provisioning transaction
        id: execute
        if: ${{ steps.preflight.outputs.verified == 'true' && steps.binding.outputs.verified == 'true' }}
        shell: bash
        env:
          TARGET_HEAD: ${{ steps.preflight.outputs.target_head }}
          EXPECTED_DB_BINDING: ${{ steps.binding.outputs.expected_db_binding }}
          TENANT_ID: ${{ inputs.tenant_id }}
          ACTOR_ID: ${{ inputs.actor_identity_id }}
          ACTOR_ORG: ${{ inputs.actor_organization_id }}
          ROLE_ID: ${{ inputs.role_id }}
        run: |
          set -euo pipefail

          for value in \
            "$ONEQAY_DB_HOST" \
            "$ONEQAY_DB_PORT" \
            "$ONEQAY_DB_DATABASE" \
            "$ONEQAY_DB_USERNAME" \
            "$ONEQAY_DB_PASSWORD" \
            "$EXPECTED_DB_BINDING"; do
            [[ -n "$value" ]] || {
              echo 'Required permission provisioning environment secret or selected-target binding is missing.' >&2
              exit 1
            }
          done
          [[ "$EXPECTED_DB_BINDING" =~ ^[0-9a-f]{64}$ ]]

          composer install \
            --working-dir=apps/web \
            --no-interaction \
            --prefer-dist \
            --no-progress

          php <<'PHP'
          <?php
          declare(strict_types=1);

          require __DIR__.'/apps/web/vendor/autoload.php';
          $app = require __DIR__.'/apps/web/bootstrap/app.php';
          $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();

          $db = $app->make('db')->connection('oneqay');
          $schema = $db->getSchemaBuilder();
          if (strtolower($db->getDriverName()) !== 'mysql') {
              throw new RuntimeException('Operational permission provisioning requires canonical MySQL-compatible target.');
          }
          if ((string) getenv('APP_ENV') !== 'production') {
              throw new RuntimeException('Operational permission provisioning must retain production runtime classification.');
          }
          if (filter_var(getenv('ONEQAY_PERSISTENCE_ENABLED') ?: false, FILTER_VALIDATE_BOOL)) {
              throw new RuntimeException('Application persistence must remain disabled during the isolated operational provisioning ceremony.');
          }

          $identity = $db->selectOne('SELECT DATABASE() AS database_name, @@hostname AS server_hostname, @@port AS server_port');
          if (! is_object($identity)) {
              throw new RuntimeException('Selected-target database identity readback failed before permission mutation.');
          }
          $databaseName = trim((string) ($identity->database_name ?? ''));
          $serverHostname = trim((string) ($identity->server_hostname ?? ''));
          $serverPort = (int) ($identity->server_port ?? 0);
          if ($databaseName === '' || $serverHostname === '' || $serverPort < 1 || $serverPort > 65535) {
              throw new RuntimeException('Selected-target database identity readback is incomplete before permission mutation.');
          }
          $bindingPayload = [
              'database_name' => $databaseName,
              'server_hostname' => $serverHostname,
              'server_port' => $serverPort,
          ];
          ksort($bindingPayload, SORT_STRING);
          $actualBinding = hash('sha256', json_encode(
              $bindingPayload,
              JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE | JSON_THROW_ON_ERROR,
          ));
          $expectedBinding = (string) getenv('EXPECTED_DB_BINDING');
          if (! hash_equals($expectedBinding, $actualBinding)) {
              throw new RuntimeException('Permission provisioning database credentials are not bound to the exact selected durable target.');
          }

          $tenant = App\Domain\Tenancy\TenantId::fromString((string) getenv('TENANT_ID'));
          $actorId = App\Domain\Identity\PlatformIdentityId::fromString((string) getenv('ACTOR_ID'));
          $organization = App\Domain\Organization\OrganizationId::fromString((string) getenv('ACTOR_ORG'));
          $role = App\Application\Authorization\RoleIdentifier::fromString((string) getenv('ROLE_ID'));
          $permission = App\Application\Pos\FinalShiftClosePermission::identifier();
          if (! hash_equals('pos.shift.close', $permission->value())) {
              throw new RuntimeException('Canonical Final Shift Close permission identifier drifted.');
          }

          foreach ([
              'migrations',
              'oneqay_tenants',
              'oneqay_identities',
              'oneqay_identity_organizations',
              'oneqay_roles',
              'oneqay_role_permissions',
              'oneqay_tenant_role_assignments',
              'oneqay_organization_role_assignments',
              'oneqay_outlet_role_assignments',
              'oneqay_device_role_assignments',
              'oneqay_policy_mutations',
              'oneqay_pos_shift_close_evidence',
          ] as $table) {
              if (! $schema->hasTable($table)) {
                  throw new RuntimeException('Required permission provisioning table missing: '.$table);
              }
          }

          $migration27 = '0000_00_00_000027_create_pos_shift_close_evidence_foundation';
          if ((int) $db->table('migrations')->where('migration', $migration27)->count() !== 1) {
              throw new RuntimeException('Canonical migration27 execution record is not exact.');
          }

          $actor = new App\Application\Organization\VerifiedOrganizationalContext(
              $actorId,
              $tenant,
              $organization,
          );
          $mutationId = App\Application\Authorization\PolicyMutationId::fromString(
              'fscperm_'.substr(hash('sha256', (string) getenv('TARGET_HEAD').'|'.$tenant->value().'|'.$role->value()), 0, 55),
          );
          $mutation = App\Application\Authorization\DurablePolicyMutation::permissionGrant(
              $mutationId,
              $actor,
              $role,
              $permission,
          );
          $fingerprint = $mutation->fingerprint($actor);
          if (preg_match('/\A[0-9a-f]{64}\z/', $fingerprint) !== 1) {
              throw new RuntimeException('Canonical permission mutation fingerprint is invalid.');
          }

          $assignmentTables = [
              'oneqay_tenant_role_assignments',
              'oneqay_organization_role_assignments',
              'oneqay_outlet_role_assignments',
              'oneqay_device_role_assignments',
          ];

          $db->transaction(function () use (
              $db,
              $tenant,
              $actorId,
              $organization,
              $role,
              $permission,
              $mutationId,
              $fingerprint,
              $assignmentTables,
          ): void {
              $tenantRow = $db->table('oneqay_tenants')->where('id', $tenant->value())->lockForUpdate()->first();
              if ($tenantRow === null) {
                  throw new RuntimeException('Target tenant does not exist.');
              }
              $identityRow = $db->table('oneqay_identities')->where('tenant_id', $tenant->value())
                  ->where('id', $actorId->value())->lockForUpdate()->first();
              if ($identityRow === null) {
                  throw new RuntimeException('Provisioning actor is not an existing same-tenant identity.');
              }
              $membership = $db->table('oneqay_identity_organizations')->where('tenant_id', $tenant->value())
                  ->where('identity_id', $actorId->value())->where('organization_id', $organization->value())
                  ->lockForUpdate()->first();
              if ($membership === null) {
                  throw new RuntimeException('Provisioning actor organization membership is not durable.');
              }
              $roleRow = $db->table('oneqay_roles')->where('tenant_id', $tenant->value())
                  ->where('id', $role->value())->lockForUpdate()->first();
              if ($roleRow === null) {
                  throw new RuntimeException('Target role does not exist.');
              }

              $actorAssignments = $db->table('oneqay_tenant_role_assignments')
                  ->where('tenant_id', $tenant->value())->where('identity_id', $actorId->value())
                  ->lockForUpdate()->get();
              $tenantControl = false;
              foreach ($actorAssignments as $assignment) {
                  $controlRoleId = $assignment->role_id ?? null;
                  if (! is_string($controlRoleId) || $controlRoleId === '') {
                      continue;
                  }
                  $controlPermission = $db->table('oneqay_role_permissions')->where('tenant_id', $tenant->value())
                      ->where('role_id', $controlRoleId)
                      ->where('permission_id', App\Application\Authorization\AdministrationPermission::MANAGE)
                      ->lockForUpdate()->first();
                  if ($controlPermission !== null) {
                      $tenantControl = true;
                      break;
                  }
              }
              if (! $tenantControl) {
                  throw new RuntimeException('Provisioning actor lacks tenant-scoped protected control authority.');
              }

              $protectedTarget = $db->table('oneqay_role_permissions')->where('tenant_id', $tenant->value())
                  ->where('role_id', $role->value())
                  ->where('permission_id', App\Application\Authorization\AdministrationPermission::MANAGE)
                  ->lockForUpdate()->first();
              if ($protectedTarget !== null) {
                  throw new RuntimeException('Protected control role cannot receive Final Shift Close permission through this executor.');
              }

              $existingGrant = $db->table('oneqay_role_permissions')->where('tenant_id', $tenant->value())
                  ->where('role_id', $role->value())->where('permission_id', $permission->value())
                  ->lockForUpdate()->first();
              if ($existingGrant !== null) {
                  throw new RuntimeException('Final Shift Close permission already exists on target role; refusing retrospective evidence.');
              }
              $existingJournal = $db->table('oneqay_policy_mutations')->where('tenant_id', $tenant->value())
                  ->where('mutation_id', $mutationId->value())->lockForUpdate()->first();
              if ($existingJournal !== null) {
                  throw new RuntimeException('Deterministic provisioning mutation journal already exists; refusing ambiguous evidence.');
              }

              $assignmentCounts = [];
              foreach ($assignmentTables as $table) {
                  $assignmentCounts[$table] = (int) $db->table($table)->where('tenant_id', $tenant->value())
                      ->where('role_id', $role->value())->count();
              }

              $occurredAtUnix = time();
              if ($occurredAtUnix <= 0) {
                  throw new RuntimeException('Operational provisioning clock returned an invalid timestamp.');
              }

              $journalInserted = $db->table('oneqay_policy_mutations')->insert([
                  'tenant_id' => $tenant->value(),
                  'mutation_id' => $mutationId->value(),
                  'actor_identity_id' => $actorId->value(),
                  'operation' => App\Application\Authorization\PolicyMutationOperation::PERMISSION_GRANT,
                  'scope_type' => 'tenant',
                  'organization_id' => null,
                  'outlet_id' => null,
                  'device_id' => null,
                  'target_identity_id' => null,
                  'role_id' => $role->value(),
                  'permission_id' => $permission->value(),
                  'payload_fingerprint' => $fingerprint,
                  'outcome' => 'applied',
                  'occurred_at_unix' => $occurredAtUnix,
              ]);
              if ($journalInserted !== true) {
                  throw new RuntimeException('Canonical policy mutation journal insert failed.');
              }

              $grantInserted = $db->table('oneqay_role_permissions')->insert([
                  'tenant_id' => $tenant->value(),
                  'role_id' => $role->value(),
                  'permission_id' => $permission->value(),
              ]);
              if ($grantInserted !== true) {
                  throw new RuntimeException('Final Shift Close role permission insert failed.');
              }

              if ((int) $db->table('oneqay_role_permissions')->where('tenant_id', $tenant->value())
                  ->where('role_id', $role->value())->where('permission_id', $permission->value())->count() !== 1) {
                  throw new RuntimeException('Final Shift Close permission grant is not exact after provisioning.');
              }

              $journal = $db->table('oneqay_policy_mutations')->where('tenant_id', $tenant->value())
                  ->where('mutation_id', $mutationId->value())->first();
              if ($journal === null
                  || ! hash_equals($actorId->value(), (string) ($journal->actor_identity_id ?? ''))
                  || ! hash_equals(App\Application\Authorization\PolicyMutationOperation::PERMISSION_GRANT, (string) ($journal->operation ?? ''))
                  || ! hash_equals('tenant', (string) ($journal->scope_type ?? ''))
                  || ! hash_equals($role->value(), (string) ($journal->role_id ?? ''))
                  || ! hash_equals($permission->value(), (string) ($journal->permission_id ?? ''))
                  || ! hash_equals($fingerprint, (string) ($journal->payload_fingerprint ?? ''))
                  || ! hash_equals('applied', (string) ($journal->outcome ?? ''))) {
                  throw new RuntimeException('Canonical policy mutation journal evidence is invalid.');
              }

              foreach ($assignmentTables as $table) {
                  $after = (int) $db->table($table)->where('tenant_id', $tenant->value())
                      ->where('role_id', $role->value())->count();
                  if ($after !== $assignmentCounts[$table]) {
                      throw new RuntimeException('Permission provisioning changed a role assignment boundary: '.$table);
                  }
              }
          }, 1);
          PHP

          echo 'Selected-target-bound pos.shift.close provisioning transaction and journal verification succeeded.'

      - name: Publish final provisioning evidence
        if: ${{ always() && steps.preflight.outputs.verified == 'true' && steps.binding.outputs.verified == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          TARGET_HEAD: ${{ steps.preflight.outputs.target_head }}
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
        run: |
          set -euo pipefail
          if [[ "$EXECUTE_OUTCOME" == 'success' ]]; then
            state=success
            description='Selected-target-bound pos.shift.close provisioning verified'
          else
            state=failure
            description='Selected-target-bound pos.shift.close provisioning failed closed'
          fi

          payload="$(jq -n \
            --arg state "$state" \
            --arg context "$EVIDENCE_CONTEXT" \
            --arg description "$description" \
            --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$API_URL/repos/$REPOSITORY/statuses/$TARGET_HEAD" \
            --data "$payload" >/dev/null

          [[ "$state" == 'success' ]]

