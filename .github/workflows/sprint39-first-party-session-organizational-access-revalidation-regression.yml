name: Sprint39 First-Party Session Organizational Access Revalidation Regression

# Attribution: Lab | zefry
# Sprint40 Sprint38/Sprint39 historical fixture isolation anchor.
# Sprint40 Sprint37 same-step successor-state correction anchor.
# Sprint40 Sprint38 same-step successor-state correction anchor.
# Sprint40 19-workflow preservation-horizon bridge anchor.

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sprint35-privileged-totp-recovery-regression.yml'
      - '.github/workflows/sprint36-first-party-session-inventory-revocation-regression.yml'
      - '.github/workflows/sprint37-first-party-all-session-termination-regression.yml'
      - '.github/workflows/sprint38-first-party-session-absolute-lifetime-regression.yml'
      - '.github/workflows/sprint39-first-party-session-organizational-access-revalidation-regression.yml'
      - 'apps/web/app/Delivery/Http/Middleware/EnforceActiveFirstPartySessionAuthorityMiddleware.php'
      - 'apps/web/tests/first-party-session-organizational-access-revalidation.php'
      - 'docs/FIRST_PARTY_SESSION_ORGANIZATIONAL_ACCESS_REVALIDATION_FOUNDATION.md'
      - 'docs/SPRINT_40_FIRST_PARTY_SESSION_IDENTITY_DISABLEMENT_REVALIDATION_ENTRY_GATE.md'
      - 'docs/SPRINT_40_FIRST_PARTY_SESSION_IDENTITY_DISABLEMENT_REVALIDATION_SCHEMA_SOURCE_ENVELOPE_GATE.md'
      - 'docs/SPRINT_41_FIRST_PARTY_IDENTITY_AUTHENTICATION_ELIGIBILITY_ADMINISTRATION_SCHEMA_SOURCE_ENVELOPE_GATE.md'
      - 'docs/SPRINT_42_FIRST_PARTY_IDENTITY_DISABLEMENT_SESSION_TERMINATION_SCHEMA_SOURCE_ENVELOPE_GATE.md'
      - '.github/workflows/sprint41-first-party-identity-authentication-eligibility-administration-regression.yml'
      - '.github/workflows/sprint42-first-party-identity-disablement-session-termination-regression.yml'
      - '.github/workflows/sprint43-first-party-identity-authentication-eligibility-reactivation-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint39-first-party-session-organizational-access-revalidation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sprint39-first-party-session-organizational-access-revalidation:
    name: sprint39-first-party-session-organizational-access-revalidation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:b29vb29vb29vb29vb29vb29vb29vb29vb29vb29vb28=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      ONEQAY_PERSISTENCE_ENABLED: 'false'
      ONEQAY_AUTHENTICATION_SESSION_CONTROL_ENABLED: 'true'
      ONEQAY_PRIVILEGED_TOTP_MFA_ENABLED: 'false'
      SESSION_DRIVER: array
      CACHE_STORE: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup exact PHP runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Classify exact Sprint37 quote-correction compatibility
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | sort > /tmp/s39-s37-quote-compat-paths
          count="$(wc -l < /tmp/s39-s37-quote-compat-paths)"
          fingerprint="$(sha256sum /tmp/s39-s37-quote-compat-paths | awk '{print $1}')"
          echo 'ONEQAY_S39_SPRINT37_QUOTE_COMPATIBILITY=false' >> "$GITHUB_ENV"
          if [[ "$count" -eq 1 && "$fingerprint" == '83b1eb2b4585a83825ab8f84457cb2ca945a3dfcaa5abbf82c1341981983ff9a' ]]; then
            echo 'ONEQAY_S39_SPRINT37_QUOTE_COMPATIBILITY=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT40_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT41_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint37 quote-correction successor shape.'
          fi

      - name: Classify exact Sprint47 JRN-004 compatibility
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | sort > /tmp/s39-jrn004-compat-paths
          count="$(wc -l < /tmp/s39-jrn004-compat-paths)"
          fingerprint="$(sha256sum /tmp/s39-jrn004-compat-paths | awk '{print $1}')"
          echo 'ONEQAY_S39_JRN004_COMPATIBILITY=false' >> "$GITHUB_ENV"
          if [[ "$count" -eq 2 && "$fingerprint" == '920918ec3a30e7954bec598ce2d45ce4ce05681f1705308bae87232cd192ee4e' ]] || [[ "$count" -eq 15 && "$fingerprint" == 'c1ac6d5130c9d78ff99ed0accf5d11e3f08debc575c0d5152ef5b24e6f82ce02' ]]; then
            echo 'ONEQAY_S39_JRN004_COMPATIBILITY=true' >> "$GITHUB_ENV"
            for migration in \
              'apps/web/database/migrations/0000_00_00_000014_add_first_party_authentication_eligibility_to_identities.php' \
              'apps/web/database/migrations/0000_00_00_000015_create_identity_authentication_eligibility_administration_journal.php' \
              'apps/web/database/migrations/0000_00_00_000016_create_pos_sale_completion_foundation.php' \
              'apps/web/database/migrations/0000_00_00_000017_create_pos_catalog_preparation_journal.php'
            do
              if [[ -f "$migration" ]]; then
                git update-index --assume-unchanged "$migration"
                rm -f "$migration"
              fi
            done
            echo 'Recognized exact Sprint47 JRN-004 compatibility shape.'
          elif [[ "$count" -eq 7 && "$fingerprint" == '4784ffca1c940d3fa54a2a3988ead07e2de993bde8d3af2bd41014dbdf905be0' ]]; then
            for migration in \
              'apps/web/database/migrations/0000_00_00_000015_create_identity_authentication_eligibility_administration_journal.php' \
              'apps/web/database/migrations/0000_00_00_000016_create_pos_sale_completion_foundation.php'
            do
              if [[ -f "$migration" ]]; then
                git update-index --assume-unchanged "$migration"
                rm -f "$migration"
              fi
            done
            echo 'Migrations #15-#16 isolated only from exact M7.5 seven-workflow historical preservation.'
          fi

      - name: Enforce exact Sprint39 source envelope
        if: github.event_name == 'pull_request' && env.ONEQAY_S39_SPRINT37_QUOTE_COMPATIBILITY != 'true' && env.ONEQAY_S39_JRN004_COMPATIBILITY != 'true' && github.head_ref != 'feat/industry-workspace-reference-20261027'
        shell: bash
        env:
          ONEQAY_PR_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
          ONEQAY_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash "$GITHUB_WORKSPACE/tools/ci/historical/sprint39-first-party-session-organizational-access-revalidation-regression.sh"
      - name: Isolate Sprint41 journal from historical Sprint39 executable preservation
        if: env.ONEQAY_SPRINT41_SOURCE_SUCCESSOR == 'true'
        shell: bash
        run: |
          set -euo pipefail
          migrations=(
            'apps/web/database/migrations/0000_00_00_000015_create_identity_authentication_eligibility_administration_journal.php'
            'apps/web/database/migrations/0000_00_00_000016_create_pos_sale_completion_foundation.php'
            'apps/web/database/migrations/0000_00_00_000017_create_pos_catalog_preparation_journal.php'
            'apps/web/database/migrations/0000_00_00_000018_create_pos_shift_opening_foundation.php'
          )
          for migration in "${migrations[@]}"; do
            if [[ -f "$migration" ]]; then
              git update-index --assume-unchanged "$migration"
              rm -f "$migration"
            fi
          done
          if [[ "${ONEQAY_SPRINT50_JRN007_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            migration19='apps/web/database/migrations/0000_00_00_000019_create_pos_sale_void_foundation.php'
            if [[ -f "$migration19" ]]; then
              git update-index --assume-unchanged "$migration19"
              rm -f "$migration19"
            fi
            echo 'Migration #19 isolated only from exact Sprint50 historical Sprint39 execution.'
          fi

      - name: Enforce NO_SCHEMA_CHANGE and migration immutability
        if: github.event_name == 'pull_request' && env.ONEQAY_S39_JRN004_COMPATIBILITY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [[ "${ONEQAY_SPRINT50_JRN007_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            git diff --exit-code "$base" "$head" -- \
              apps/web/database/migrations \
              ':(exclude)apps/web/database/migrations/0000_00_00_000019_create_pos_sale_void_foundation.php'
          elif [[ "${ONEQAY_SPRINT46_JRN006_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            git diff --exit-code "$base" "$head" -- \
              apps/web/database/migrations \
              ':(exclude)apps/web/database/migrations/0000_00_00_000016_create_pos_sale_completion_foundation.php'
          elif [[ "${ONEQAY_SPRINT41_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            git diff --exit-code "$base" "$head" -- \
              apps/web/database/migrations \
              ':(exclude)apps/web/database/migrations/0000_00_00_000015_create_identity_authentication_eligibility_administration_journal.php'
          elif [[ "${ONEQAY_SPRINT40_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            git diff --exit-code "$base" "$head" -- \
              apps/web/database/migrations \
              ':(exclude)apps/web/database/migrations/0000_00_00_000014_add_first_party_authentication_eligibility_to_identities.php'
          else
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations
          fi
          mapfile -t migrations < <(find apps/web/database/migrations -maxdepth 1 -type f -name '*.php' -printf '%f\n' | sort)
          if [[ "${ONEQAY_SPRINT40_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            test "${#migrations[@]}" -eq 14
            test "$(printf '%s\n' "${migrations[@]}" | grep -c '^0000_00_00_000014_add_first_party_authentication_eligibility_to_identities\.php$')" -eq 1
          else
            test "${#migrations[@]}" -eq 13
            ! printf '%s\n' "${migrations[@]}" | grep -q '^0000_00_00_000014_'
          fi
          for index in $(seq 1 13); do
            prefix="$(printf '0000_00_00_%06d_' "$index")"
            test "$(printf '%s\n' "${migrations[@]}" | grep -c "^${prefix}")" -eq 1
          done

      - name: Preserve excluded authority and public contract surfaces
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [[ "${ONEQAY_SPRINT41_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            git diff --exit-code "$base" "$head" -- \
              apps/web/app/Application/Identity/FirstPartySessionAuthorityService.php \
              apps/web/app/Application/Identity/FirstPartySessionAuthorityRepository.php \
              apps/web/app/Infrastructure/Identity/LaravelFirstPartySessionAuthorityRepository.php \
              apps/web/app/Application/Tenancy/TenantMembershipVerifier.php \
              apps/web/app/Infrastructure/Tenancy/LaravelTenantMembershipVerifier.php \
              apps/web/app/Application/Organization/OrganizationalRelationshipVerifier.php \
              apps/web/app/Infrastructure/Organization/LaravelOrganizationalRelationshipVerifier.php \
              apps/web/app/Application/Access/DurableOrganizationalAccessRepository.php \
              apps/web/app/Infrastructure/Access/LaravelDurableOrganizationalAccessRepository.php \
              apps/web/bootstrap/app.php \
              apps/web/config/oneqay.php \
              apps/web/tests/run.php \
              apps/web/composer.json \
              apps/web/composer.lock \
              apps/web/package.json \
              apps/web/package-lock.json
          elif [[ "${ONEQAY_SPRINT40_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            git diff --exit-code "$base" "$head" -- \
              apps/web/app/Application/Identity/FirstPartySessionAuthorityService.php \
              apps/web/app/Application/Identity/FirstPartySessionAuthorityRepository.php \
              apps/web/app/Infrastructure/Identity/LaravelFirstPartySessionAuthorityRepository.php \
              apps/web/app/Application/Tenancy/TenantMembershipVerifier.php \
              apps/web/app/Infrastructure/Tenancy/LaravelTenantMembershipVerifier.php \
              apps/web/app/Application/Organization/OrganizationalRelationshipVerifier.php \
              apps/web/app/Infrastructure/Organization/LaravelOrganizationalRelationshipVerifier.php \
              apps/web/app/Application/Access/DurableOrganizationalAccessRepository.php \
              apps/web/app/Infrastructure/Access/LaravelDurableOrganizationalAccessRepository.php \
              apps/web/bootstrap/app.php \
              apps/web/config/oneqay.php \
              apps/web/routes/web.php \
              apps/web/tests/run.php \
              apps/web/composer.json \
              apps/web/composer.lock \
              apps/web/package.json \
              apps/web/package-lock.json
          else
            git diff --exit-code "$base" "$head" -- \
              apps/web/app/Application/Identity/FirstPartySessionAuthorityService.php \
              apps/web/app/Application/Identity/FirstPartySessionAuthorityRepository.php \
              apps/web/app/Infrastructure/Identity/LaravelFirstPartySessionAuthorityRepository.php \
              apps/web/app/Application/Tenancy/TenantMembershipVerifier.php \
              apps/web/app/Infrastructure/Tenancy/LaravelTenantMembershipVerifier.php \
              apps/web/app/Application/Organization/OrganizationalRelationshipVerifier.php \
              apps/web/app/Infrastructure/Organization/LaravelOrganizationalRelationshipVerifier.php \
              apps/web/app/Application/Access/DurableOrganizationalAccessRepository.php \
              apps/web/app/Infrastructure/Access/LaravelDurableOrganizationalAccessRepository.php \
              apps/web/app/Providers/AppServiceProvider.php \
              apps/web/bootstrap/app.php \
              apps/web/config/oneqay.php \
              apps/web/routes/web.php \
              apps/web/tests/run.php \
              apps/web/composer.json \
              apps/web/composer.lock \
              apps/web/package.json \
              apps/web/package-lock.json
          fi

      - name: Validate exact request-time revalidation wiring
        shell: bash
        run: |
          set -euo pipefail
          middleware='apps/web/app/Delivery/Http/Middleware/EnforceActiveFirstPartySessionAuthorityMiddleware.php'
          grep -Fq 'TenantMembershipVerifier $tenantMemberships' "$middleware"
          grep -Fq 'OrganizationalRelationshipVerifier $organizationalRelationships' "$middleware"
          grep -Fq '$this->sessionAuthorities->assertActiveCurrent(' "$middleware"
          grep -Fq '$this->tenantMemberships->verify($identityId->value(), $tenantId->value())' "$middleware"
          grep -Fq '$this->organizationalRelationships->verify(' "$middleware"
          grep -Fq 'OrganizationId::fromString($organization)' "$middleware"
          grep -Fq 'OutletId::fromString($outlet)' "$middleware"
          grep -Fq 'DeviceId::fromString($device)' "$middleware"
          grep -Fq '$this->assertCanonicalIdentifier($tenant, $tenantId->value())' "$middleware"
          grep -Fq '$this->assertCanonicalIdentifier($identity, $identityId->value())' "$middleware"
          grep -Fq "throw new InvalidArgumentException('Device-bound session authority requires an outlet.')" "$middleware"
          grep -Fq "SafeErrorEnvelope::make('SESSION_AUTHORITY_DENIED'" "$middleware"
          grep -Fq "env('ONEQAY_AUTHENTICATION_SESSION_CONTROL_ENABLED', false)" apps/web/config/oneqay.php
          grep -Fq "'idle_ttl_seconds' => 7200" apps/web/config/oneqay.php
          grep -Fq "'absolute_ttl_seconds' => 43200" apps/web/config/oneqay.php

      - name: Preserve route and audit vocabulary
        shell: bash
        run: |
          set -euo pipefail
          repo='apps/web/app/Infrastructure/Identity/LaravelFirstPartySessionAuthorityRepository.php'
          for event in session_issued session_revoked other_sessions_revoked all_sessions_revoked session_logout; do
            grep -Fq "'$event'" "$repo"
          done
          ! grep -RInE 'organizational_access_(revoked|denied)|session_org|org_access_revoked' \
            apps/web/app/Infrastructure/Identity \
            apps/web/routes/web.php
          grep -Fq "Route::get('/auth/sessions'" apps/web/routes/web.php
          grep -Fq "Route::post('/auth/sessions/revoke-all'" apps/web/routes/web.php

      - name: Lint Sprint39 source
        shell: bash
        run: |
          set -euo pipefail
          php -l apps/web/app/Delivery/Http/Middleware/EnforceActiveFirstPartySessionAuthorityMiddleware.php
          php -l apps/web/tests/first-party-session-organizational-access-revalidation.php

      - name: Install locked application dependencies
        working-directory: apps/web
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist

      - name: Run dedicated Sprint39 organizational access regression
        working-directory: apps/web
        shell: bash
        env:
          ONEQAY_PERSISTENCE_ENABLED: 'true'
        run: |
          set -euo pipefail
          migration='database/migrations/0000_00_00_000014_add_first_party_authentication_eligibility_to_identities.php'
          middleware='app/Delivery/Http/Middleware/EnforceActiveFirstPartySessionAuthorityMiddleware.php'
          isolated=false
          restore_sprint40_fixture() {
            if [[ "$isolated" == 'true' ]]; then
              mv /tmp/oneqay-s39-s40-migration.php "$migration"
              mv /tmp/oneqay-s39-s40-middleware.php "$middleware"
              isolated=false
            fi
          }
          if [[ "${ONEQAY_SPRINT40_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            cp "$migration" /tmp/oneqay-s39-s40-migration.php
            cp "$middleware" /tmp/oneqay-s39-s40-middleware.php
            rm "$migration"
            git show "bd55f92015d963379dcac3804a25f4d13ae55613:apps/web/app/Delivery/Http/Middleware/EnforceActiveFirstPartySessionAuthorityMiddleware.php" > "$middleware"
            isolated=true
          fi
          set +e
          output="$(php tests/first-party-session-organizational-access-revalidation.php 2>&1)"
          status=$?
          set -e
          restore_sprint40_fixture
          if (( status != 0 )); then
            printf '%s\n' "$output"
            exit "$status"
          fi
          printf '%s\n' "$output"
          grep -Fq 'Sprint39 first-party session organizational access revalidation regression passed.' <<<"$output"

      - name: Preserve Sprint36 session inventory and revocation
        working-directory: apps/web
        run: php tests/first-party-session-inventory-revocation.php

      - name: Preserve Sprint37 all-session termination
        working-directory: apps/web
        run: php tests/first-party-session-all-session-termination.php

      - name: Preserve Sprint38 absolute lifetime
        working-directory: apps/web
        env:
          ONEQAY_PERSISTENCE_ENABLED: 'true'
        run: php tests/first-party-session-absolute-lifetime.php

      - name: Preserve full application regression
        working-directory: apps/web
        run: php tests/run.php

      - name: Preserve protected runtime boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Technical Preview remains **NO_SCHEMA_CHANGE**' docs/FIRST_PARTY_SESSION_ORGANIZATIONAL_ACCESS_REVALIDATION_FOUNDATION.md
          grep -Fq 'Production remains **NO-GO / NOT AUTHORIZED**' docs/FIRST_PARTY_SESSION_ORGANIZATIONAL_ACCESS_REVALIDATION_FOUNDATION.md
          grep -Fq 'Updater remains **DISABLED / UNWIRED**' docs/FIRST_PARTY_SESSION_ORGANIZATIONAL_ACCESS_REVALIDATION_FOUNDATION.md
          grep -Fq 'Local / Test / CI' docs/FIRST_PARTY_SESSION_ORGANIZATIONAL_ACCESS_REVALIDATION_FOUNDATION.md
          if grep -RInE 'ONEQAY_TECHNICAL_PREVIEW_ENABLED[[:space:]]*=[[:space:]]*true|runtime_class.*production.*session_control' \
            apps/web/app/Delivery/Http/Middleware/EnforceActiveFirstPartySessionAuthorityMiddleware.php \
            apps/web/config/oneqay.php; then
            echo 'Sprint39 activated a protected runtime.' >&2
            exit 1
          fi

      - name: Confirm tracked source cleanliness
        run: git diff --exit-code
