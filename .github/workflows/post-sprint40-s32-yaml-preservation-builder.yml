name: Post-Sprint40 Sprint32 YAML Preservation Builder

on:
  push:
    branches:
      - ci/post-sprint40-s32-yaml-preservation-predecessor

permissions:
  contents: write

jobs:
  build-clean-predecessor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout builder head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Add exact Sprint32 YAML closure recognition
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('.github/workflows/sprint33-recovery-bound-password-reset-regression.yml'),
              Path('.github/workflows/sprint34-authenticated-password-change-regression.yml'),
          ]
          old = "]] || [[ \"$count\" -eq 6 && \"$fingerprint\" == '671946562a3eef1375d87b70936bac263aa18f660d6ea274406ed57f1c653351' ]]"
          new = "]] || [[ \"$count\" -eq 1 && \"$fingerprint\" == '261f147d880a37fe9137b28d9541724c6c5e3987138f3fb56d5465ff31dc7412' ]] || [[ \"$count\" -eq 6 && \"$fingerprint\" == '671946562a3eef1375d87b70936bac263aa18f660d6ea274406ed57f1c653351' ]]"
          expected = {
              paths[0]: 2,
              paths[1]: 1,
          }
          for path in paths:
              text = path.read_text()
              count = text.count(old)
              if count != expected[path]:
                  raise SystemExit(f'unexpected recognition insertion count for {path}: {count}')
              path.write_text(text.replace(old, new))
          PY

          git diff --check
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= \
            .github/workflows/sprint33-recovery-bound-password-reset-regression.yml \
            .github/workflows/sprint34-authenticated-password-change-regression.yml

      - name: Commit clean predecessor and publish commit object
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'labzefry'
          git config user.email 'lab.zefa@gmail.com'
          git rm .github/workflows/post-sprint40-s32-yaml-preservation-builder.yml
          git add \
            .github/workflows/sprint33-recovery-bound-password-reset-regression.yml \
            .github/workflows/sprint34-authenticated-password-change-regression.yml
          git commit -m 'ci: preserve Sprint32 YAML closure through Sprint33 Sprint34'

          cat > /tmp/expected-net-paths <<'EOF'
          .github/workflows/sprint33-recovery-bound-password-reset-regression.yml
          .github/workflows/sprint34-authenticated-password-change-regression.yml
          EOF
          git diff --name-only fa2d10e5abdebeaa7b9ded04f491500c7f72757e HEAD | sort > /tmp/actual-net-paths
          cmp -s /tmp/expected-net-paths /tmp/actual-net-paths || {
            echo 'Unexpected predecessor net path set:' >&2
            diff -u /tmp/expected-net-paths /tmp/actual-net-paths >&2 || true
            exit 1
          }

          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          echo "FINAL_TREE=$(git rev-parse HEAD^{tree})"

          set +e
          git push origin HEAD:ci/post-sprint40-s32-yaml-preservation-predecessor
          rc=$?
          set -e
          echo "PUSH_RC=$rc"
          exit 0
