# Author by Lab | zefry
name: Sprint203 Durable Staging Merchant Core Runtime Enablement Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint203-durable-staging-merchant-core-runtime-enablement-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify-sprint203-durable-staging-merchant-core-runtime:
    name: qualify-sprint203-durable-staging-merchant-core-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:c3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3M=
      APP_DEBUG: "false"
      APP_URL: http://127.0.0.1
      ONEQAY_RUNTIME_CLASS: staging
      ONEQAY_DURABLE_STAGING_RUNTIME_ENABLED: "true"
      ONEQAY_PERSISTENCE_ENABLED: "true"
      ONEQAY_AUTHENTICATION_SESSION_CONTROL_ENABLED: "true"
      ONEQAY_POS_SALE_COMPLETION_ENABLED: "true"
      ONEQAY_POS_CATALOG_PREPARATION_ENABLED: "true"
      ONEQAY_POS_INVENTORY_BASELINE_ENABLED: "true"
      ONEQAY_POS_SHIFT_OPENING_ENABLED: "true"
      ONEQAY_POS_SHIFT_OPENING_CASH_EVIDENCE_ENABLED: "true"
      SESSION_DRIVER: array
      CACHE_STORE: array
      LOG_CHANNEL: stderr

    steps:
      - name: Checkout exact Sprint203 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Qualify exact Sprint203 engineering envelope
        if: github.event_name == 'pull_request' && github.head_ref == 'sprint203-durable-staging-merchant-core-runtime-enablement'
        shell: bash
        env:
          EXPECTED_PATH_HASH: 41175da8e63cf8df9ae5a34c6e3257972139d2341b5e7efae8f612a33b8e0f5b
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          mapfile -t paths < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | LC_ALL=C sort)
          expected=(
            ".github/workflows/sprint203-durable-staging-merchant-core-runtime-enablement-regression.yml"
            "apps/web/app/Console/Commands/MerchantContextBootstrapCommand.php"
            "apps/web/app/Delivery/Http/Identity/FirstPartySessionController.php"
            "apps/web/app/Infrastructure/Access/LaravelDurableOrganizationalAccessRepository.php"
            "apps/web/app/Infrastructure/Authorization/LaravelDurablePolicyAdministrationRepository.php"
            "apps/web/app/Infrastructure/Authorization/LaravelDurableRolePermissionRepository.php"
            "apps/web/app/Infrastructure/Authorization/LaravelInitialTenantAdministratorProvisioningRepository.php"
            "apps/web/app/Infrastructure/Bootstrap/LaravelMerchantContextBootstrapStateRepository.php"
            "apps/web/app/Infrastructure/Identity/LaravelFirstControlPrincipalCredentialBootstrapRepository.php"
            "apps/web/app/Infrastructure/Identity/LaravelFirstPartyCredentialEpochRepository.php"
            "apps/web/app/Infrastructure/Identity/LaravelFirstPartyIdentityCredentialVerifier.php"
            "apps/web/app/Infrastructure/Identity/LaravelFirstPartyIdentityEligibilityVerifier.php"
            "apps/web/app/Infrastructure/Identity/LaravelFirstPartySessionAuthorityRepository.php"
            "apps/web/app/Infrastructure/Identity/LaravelPrivilegedTotpFactorEpochRepository.php"
            "apps/web/app/Infrastructure/Identity/LaravelPrivilegedTotpMfaRepository.php"
            "apps/web/app/Infrastructure/Persistence/LaravelDurableContextGraphRepository.php"
            "apps/web/app/Infrastructure/Persistence/LaravelPersistenceTransaction.php"
            "apps/web/app/Infrastructure/Pos/LaravelCatalogPreparationRepository.php"
            "apps/web/app/Infrastructure/Pos/LaravelDurablePosSaleRepository.php"
            "apps/web/app/Infrastructure/Pos/LaravelInventoryBaselineRepository.php"
            "apps/web/app/Infrastructure/Pos/LaravelPosCashierWorkspaceRepository.php"
            "apps/web/app/Infrastructure/Pos/LaravelPosCatalogInventorySetupWorkspaceRepository.php"
            "apps/web/app/Infrastructure/Pos/LaravelPosShiftStartWorkspaceRepository.php"
            "apps/web/app/Infrastructure/Pos/LaravelShiftOpeningCashRepository.php"
            "apps/web/app/Infrastructure/Pos/LaravelShiftOpeningRepository.php"
            "apps/web/app/Providers/AppServiceProvider.php"
            "apps/web/app/Providers/PosCashierWorkspaceServiceProvider.php"
            "apps/web/app/Providers/PosCatalogInventorySetupWorkspaceServiceProvider.php"
            "apps/web/app/Providers/PosOperationsHubServiceProvider.php"
            "apps/web/app/Providers/PosShiftStartWorkspaceServiceProvider.php"
            "apps/web/config/oneqay.php"
            "apps/web/resources/views/app.blade.php"
            "apps/web/routes/web.php"
            "apps/web/tests/durable-staging-merchant-core-runtime-enablement.php"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${paths[@]}")
          actual_hash="$(printf '%s\n' "${paths[@]}" | sha256sum | awk '{print $1}')"
          test "$actual_hash" = "$EXPECTED_PATH_HASH"

      - name: Preserve operational NO-GO
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" = NOT_EXECUTED
          test "$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)" = NONE
          test "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" = INACTIVE
          test "$(jq -r '.deployment_authority' ops/final-shift-close/STATE.json)" = NOT_GRANTED
          test "$(jq -r '.technical_preview_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
          test "$(jq -r '.production_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
          test "$(jq -r '.updater_activation' ops/final-shift-close/STATE.json)" = INACTIVE
          test "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET
          test "$(jq -r '.selected_target' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = null

      - name: Assert production remains source-denied
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -E "\['local', 'test', 'ci', 'staging', 'production'\]|\['local', 'test', 'ci', 'production'\]" \
            apps/web/app apps/web/routes apps/web/resources/views
          ! grep -R -E 'ONEQAY_PRODUCTION_(MERCHANT_RUNTIME|POS_DELIVERY)_ENABLED' \
            apps/web/app apps/web/config apps/web/routes apps/web/resources/views

      - name: Setup PHP 8.3 runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Validate Sprint203 staging source contracts
        shell: bash
        run: |
          set -euo pipefail
          php -l apps/web/app/Console/Commands/MerchantContextBootstrapCommand.php
          php -l apps/web/app/Delivery/Http/Identity/FirstPartySessionController.php
          php -l apps/web/app/Providers/AppServiceProvider.php
          php -l apps/web/routes/web.php
          php -l apps/web/tests/durable-staging-merchant-core-runtime-enablement.php
          php apps/web/tests/durable-staging-merchant-core-runtime-enablement.php
          ! grep -R -E 'ChatGPT|OpenAI|Copilot|Gemini' \
            apps/web/app/Console/Commands/MerchantContextBootstrapCommand.php \
            apps/web/app/Delivery/Http/Identity/FirstPartySessionController.php \
            apps/web/app/Infrastructure \
            apps/web/app/Providers/AppServiceProvider.php \
            apps/web/app/Providers/PosCashierWorkspaceServiceProvider.php \
            apps/web/app/Providers/PosCatalogInventorySetupWorkspaceServiceProvider.php \
            apps/web/app/Providers/PosOperationsHubServiceProvider.php \
            apps/web/app/Providers/PosShiftStartWorkspaceServiceProvider.php \
            apps/web/config/oneqay.php \
            apps/web/resources/views/app.blade.php \
            apps/web/routes/web.php \
            apps/web/tests/durable-staging-merchant-core-runtime-enablement.php

      - name: Install locked application dependencies
        working-directory: apps/web
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          composer audit --locked --abandoned=report

      - name: Preserve merchant bootstrap, authentication, and POS core contracts
        working-directory: apps/web
        run: |
          php tests/merchant-context-guarded-bootstrap-delivery.php
          php tests/pos-catalog-inventory-setup-workspace.php
          php tests/pos-shift-start-workspace.php
          php tests/pos-cashier-workspace.php
          php tests/pos-sale-completion-durable.php
          php tests/durable-staging-merchant-core-runtime-enablement.php

      - name: Setup exact Node LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.19.0

      - name: Type-check and build merchant application
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts --no-fund
          npm run type-check
          npm run build

      - name: Confirm source cleanliness
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
