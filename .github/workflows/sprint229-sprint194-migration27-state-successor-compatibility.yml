name: Sprint229 Sprint194 Migration27 State Successor Compatibility

# Attribution: Lab | zefry

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/sprint194-technical-preview-activation-request-regression.yml'
      - '.github/workflows/sprint229-sprint194-migration27-state-successor-compatibility.yml'
      - 'docs/SPRINT229_SPRINT194_MIGRATION27_STATE_SUCCESSOR_COMPATIBILITY.md'

permissions:
  contents: read

jobs:
  qualify-sprint194-successor-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact Sprint229 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Lock exact Sprint229 envelope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | LC_ALL=C sort > /tmp/paths
          cat > /tmp/expected <<'EOF'
          .github/workflows/sprint194-technical-preview-activation-request-regression.yml
          .github/workflows/sprint229-sprint194-migration27-state-successor-compatibility.yml
          docs/SPRINT229_SPRINT194_MIGRATION27_STATE_SUCCESSOR_COMPATIBILITY.md
          EOF
          diff -u /tmp/expected /tmp/paths
          test "$(sha256sum /tmp/paths | awk '{print $1}')" = '8ff153f0715315eb20e976c5702f9b2ffea1789b49093f4f74e3fa0314ea2716'

      - name: Preserve canonical operational ownership
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --exit-code "$BASE_SHA" "$HEAD_SHA" --             apps             ops/final-shift-close/STATE.json             ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json             .github/workflows/sprint102-final-shift-close-operational-sequencing-gate.yml             .github/workflows/final-shift-close-migration27-execution.yml             .github/workflows/final-shift-close-migration27-selected-target-db-binding.yml

      - name: Qualify Sprint194 canonical migration lifecycle compatibility
        shell: bash
        run: |
          set -euo pipefail
          f=.github/workflows/sprint194-technical-preview-activation-request-regression.yml
          test "$(grep -F -c '^(NOT_EXECUTED|EXECUTED)$' "$f")" = '2'
          ! grep -Eq "migration27\.state.*=[[:space:]]*NOT_EXECUTED" "$f"
          grep -Fq "permission_provisioning.state" "$f"
          grep -Fq "feature_activation.state" "$f"
          grep -Fq "technical_preview_activation" "$f"
          grep -Fq "production_activation" "$f"
          grep -Fq "updater_activation" "$f"

      - name: Preserve current operational state
        shell: bash
        run: |
          set -euo pipefail
          state=ops/final-shift-close/STATE.json
          test "$(jq -r '.migration27.state' "$state")" = 'NOT_EXECUTED'
          test "$(jq -r '.permission_provisioning.state' "$state")" = 'NONE'
          test "$(jq -r '.feature_activation.state' "$state")" = 'INACTIVE'
          test "$(jq -r '.technical_preview_activation' "$state")" = 'NOT_AUTHORIZED'
          test "$(jq -r '.production_activation' "$state")" = 'NOT_AUTHORIZED'
          test "$(jq -r '.updater_activation' "$state")" = 'INACTIVE'

      - name: Verify tracked source cleanliness
        shell: bash
        run: git diff --exit-code
