# Sprint41 Sprint31 source-successor state correction preservation anchor.
name: Sprint 23 Initial Tenant Administrator Provisioning Regression

# Attribution: Lab | zefry

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/app/Application/Authorization/**'
      - 'apps/web/app/Infrastructure/Authorization/**'
      - 'apps/web/app/Application/Identity/**'
      - 'apps/web/app/Infrastructure/Identity/**'
      - 'apps/web/app/Delivery/Http/Authorization/**'
      - 'apps/web/app/Delivery/Http/Identity/**'
      - 'apps/web/app/Delivery/Http/Middleware/RequirePolicyAdministrationSessionContextMiddleware.php'
      - 'apps/web/app/Providers/AppServiceProvider.php'
      - 'apps/web/routes/web.php'
      - 'apps/web/database/migrations/**'
      - 'apps/web/tests/initial-password-enrollment.php'
      - 'apps/web/tests/first-party-session-establishment.php'
      - 'apps/web/tests/identity-credential-verification.php'
      - 'apps/web/tests/policy-administration-delivery.php'
      - 'apps/web/tests/protected-control-administrator-lifecycle.php'
      - 'apps/web/tests/initial-tenant-administrator-provisioning.php'
      - 'apps/web/tests/authorization-administration-persistence.php'
      - 'apps/web/tests/authorization-persistence.php'
      - 'apps/web/tests/tenant-isolation.php'
      - 'apps/web/tests/identity-org-context.php'
      - '.github/workflows/m7-2-tenant-isolation-regression.yml'
      - '.github/workflows/m7-3-identity-org-context-regression.yml'
      - '.github/workflows/m7-4a-technical-preview-interaction-regression.yml'
      - '.github/workflows/m7-5-preview-db-qualification-regression.yml'
      - '.github/workflows/sprint21-role-permission-policy-regression.yml'
      - '.github/workflows/sprint22-policy-administration-regression.yml'
      - '.github/workflows/sprint23-initial-tenant-admin-provisioning-regression.yml'
      - '.github/workflows/sprint24-protected-control-admin-lifecycle-regression.yml'
      - '.github/workflows/sprint25-policy-administration-delivery-regression.yml'
      - '.github/workflows/sprint26-identity-credential-verification-regression.yml'
      - '.github/workflows/sprint27-first-party-session-establishment-regression.yml'
      - '.github/workflows/sprint28-initial-password-enrollment-regression.yml'
      - 'docs/FIRST_PARTY_IDENTITY_CREDENTIAL_VERIFICATION_FOUNDATION.md'
      - 'docs/FIRST_PARTY_LOGIN_SESSION_ESTABLISHMENT_FOUNDATION.md'
      - 'docs/FIRST_PARTY_INITIAL_PASSWORD_ENROLLMENT_FOUNDATION.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint23-initial-tenant-admin-provisioning-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sprint23-initial-tenant-admin-provisioning-regression:
    name: sprint23-initial-tenant-admin-provisioning-regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      SESSION_DRIVER: array
      CACHE_STORE: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Recognize exact Sprint 30 and Sprint 31 bounded successors
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" | sort > /tmp/oneqay-successor-files.txt
          count="$(wc -l < /tmp/oneqay-successor-files.txt)"
          fingerprint="$(sha256sum /tmp/oneqay-successor-files.txt | awk '{print $1}')"
          if [[ "$count" -eq 46 ]] && [[ "$fingerprint" == '95daaf86ba93ae797fccf3825d65d27acd4f71ee58916898a16fbc83d432a5ce' ]]; then
            echo 'ONEQAY_SPRINT30_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT31_SUCCESSOR=false' >> "$GITHUB_ENV"
            echo 'Exact Sprint 30 successor envelope recognized; legacy shape-only guards defer to the dedicated Sprint 30 workflow.'
          elif [[ "$count" -eq 26 ]] && [[ "$fingerprint" == '8136b57a5c9949ec5020a3d5ae497f34431a704900eb0447d42fdb791efb6e39' ]]; then
            echo 'ONEQAY_SPRINT30_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT31_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'Exact Sprint 31 successor envelope recognized; stale historical shape guards defer while executable preservation remains active.'
          else
            echo 'ONEQAY_SPRINT30_SUCCESSOR=false' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT31_SUCCESSOR=false' >> "$GITHUB_ENV"
          fi

      - name: Recognize exact Sprint 32 bounded successor
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" | sort > /tmp/s32-successor-files.txt
          count="$(wc -l < /tmp/s32-successor-files.txt)"
          fingerprint="$(sha256sum /tmp/s32-successor-files.txt | awk '{print $1}')"
          if [[ "$count" -eq 32 ]] && [[ "$fingerprint" == 'db230ab3b77fff67f0bd12d7d7b615146d9d9df9a0af12014214e1862e9f6867' ]]; then
            echo 'ONEQAY_SPRINT30_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT31_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT32_SUCCESSOR=true' >> "$GITHUB_ENV"
            git update-index --assume-unchanged apps/web/database/migrations/0000_00_00_000010_create_identity_recovery_codes.php
            rm -f apps/web/database/migrations/0000_00_00_000010_create_identity_recovery_codes.php
          else
            echo 'ONEQAY_SPRINT32_SUCCESSOR=false' >> "$GITHUB_ENV"
          fi

      - name: Recognize exact Sprint 33 bounded successor
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" | sort > /tmp/s33-successor-files.txt
          count="$(wc -l < /tmp/s33-successor-files.txt)"
          fingerprint="$(sha256sum /tmp/s33-successor-files.txt | awk '{print $1}')"
          if [[ "$count" -eq 35 ]] && [[ "$fingerprint" == 'e3b724002cfc0be1ef890d1b5594a2a5179123f949f6f486354e21950c7328eb' ]]; then
            echo 'ONEQAY_SPRINT30_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT31_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT32_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT33_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT34_SUCCESSOR=true' >> "$GITHUB_ENV"
            git update-index --assume-unchanged apps/web/database/migrations/0000_00_00_000010_create_identity_recovery_codes.php
            git update-index --assume-unchanged apps/web/database/migrations/0000_00_00_000011_add_credential_epoch_to_identity_password_credentials.php
            rm -f apps/web/database/migrations/0000_00_00_000010_create_identity_recovery_codes.php
            rm -f apps/web/database/migrations/0000_00_00_000011_add_credential_epoch_to_identity_password_credentials.php
            echo 'Exact Sprint 34 successor envelope recognized; historical executable regression remains active while migration #10 is isolated from legacy migration-shape guards.'
            exit 0
          fi
          if [[ "$count" -eq 39 ]] && [[ "$fingerprint" == '04a1177c12712183a7dda4ae81be1356c0e41294533336c9f999d376c224712a' ]]; then
            echo 'ONEQAY_SPRINT30_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT31_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT32_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT33_SUCCESSOR=true' >> "$GITHUB_ENV"
            git update-index --assume-unchanged apps/web/database/migrations/0000_00_00_000010_create_identity_recovery_codes.php
            rm -f apps/web/database/migrations/0000_00_00_000010_create_identity_recovery_codes.php
            echo 'Exact Sprint 33 successor envelope recognized; historical executable regression remains active while migration #10 is isolated from legacy migration-shape guards.'
          else
            echo 'ONEQAY_SPRINT33_SUCCESSOR=false' >> "$GITHUB_ENV"
          fi

      - name: Recognize exact Sprint35 and Sprint36 bounded successors
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "main"
          git diff --name-only "origin/main...HEAD" | sort > /tmp/s35-successor-files.txt
          count="$(wc -l < /tmp/s35-successor-files.txt)"
          fingerprint="$(sha256sum /tmp/s35-successor-files.txt | awk '{print $1}')"
          if [[ "$count" -eq 17 && "$fingerprint" == 'e889db1c7eaa22b3ed008f8781ab35652ca950a3f009c309e5c478d01d368f11' ]] || [[ "$count" -eq 18 && "$fingerprint" == '25dbbd94087eba4157fa9c209f09174a127154a98067abbfbeec233bbe9398cd' ]] || [[ "$count" -eq 23 && "$fingerprint" == 'ea735f8f5ee06d480863f9d1ba7ae58a91642109963c3f340e8453f3205bb7ae' ]] || [[ "$count" -eq 19 && "$fingerprint" == 'fc2b578fc9d090dfce1fd34c5acfa7a07f065979a94f62becb3dc54dee664920' ]] || [[ "$count" -eq 11 && "$fingerprint" == 'a221779e05b1e8ab220610b5068be5d1eb01bc08b516b338ba8f22373e7d89d0' ]] || [[ "$count" -eq 10 && "$fingerprint" == '411950d5602dc7160668c88e08a3941ebccc8bdc82d20bee77ce4004f039d216' ]] || [[ "$count" -eq 8 && "$fingerprint" == 'a9caf2b68210a38687fee543256aec04dc1e67ee1ef403608f7db69139957ff8' ]] || [[ "$count" -eq 12 && "$fingerprint" == 'b2c5fc10a8baa2d56991d6dbd36b0407159d70953654ef322a9a11d23660489b' ]] || [[ "$count" -eq 8 && "$fingerprint" == '6315890d318c3cdfca549bfacef6cb8d1ca66a4421416b49b4978095a98b6729' ]]; then
          if [[ -f 'apps/web/database/migrations/0000_00_00_000014_add_first_party_authentication_eligibility_to_identities.php' ]]; then
            git update-index --assume-unchanged 'apps/web/database/migrations/0000_00_00_000014_add_first_party_authentication_eligibility_to_identities.php'
            rm -f 'apps/web/database/migrations/0000_00_00_000014_add_first_party_authentication_eligibility_to_identities.php'
          fi
          if [[ -f 'apps/web/database/migrations/0000_00_00_000015_create_identity_authentication_eligibility_administration_journal.php' ]]; then
            git update-index --assume-unchanged 'apps/web/database/migrations/0000_00_00_000015_create_identity_authentication_eligibility_administration_journal.php'
            rm -f 'apps/web/database/migrations/0000_00_00_000015_create_identity_authentication_eligibility_administration_journal.php'
            echo 'Migration #15 isolated only from exact Sprint41 source historical preservation.'
          fi
          echo 'ONEQAY_SPRINT35_SUCCESSOR=true' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT30_SUCCESSOR=true' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT31_SUCCESSOR=true' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT32_SUCCESSOR=true' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT33_SUCCESSOR=true' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT34_SUCCESSOR=true' >> "$GITHUB_ENV"
          if [[ -f 'apps/web/database/migrations/0000_00_00_000010_create_identity_recovery_codes.php' ]]; then
            git update-index --assume-unchanged 'apps/web/database/migrations/0000_00_00_000010_create_identity_recovery_codes.php'
            rm -f 'apps/web/database/migrations/0000_00_00_000010_create_identity_recovery_codes.php'
          fi
          if [[ -f 'apps/web/database/migrations/0000_00_00_000011_add_credential_epoch_to_identity_password_credentials.php' ]]; then
            git update-index --assume-unchanged 'apps/web/database/migrations/0000_00_00_000011_add_credential_epoch_to_identity_password_credentials.php'
            rm -f 'apps/web/database/migrations/0000_00_00_000011_add_credential_epoch_to_identity_password_credentials.php'
          fi
          if [[ -f 'apps/web/database/migrations/0000_00_00_000012_add_totp_factor_epoch_and_recovery_authority.php' ]]; then
            git update-index --assume-unchanged 'apps/web/database/migrations/0000_00_00_000012_add_totp_factor_epoch_and_recovery_authority.php'
            rm -f 'apps/web/database/migrations/0000_00_00_000012_add_totp_factor_epoch_and_recovery_authority.php'
          fi
          if [[ -f 'apps/web/database/migrations/0000_00_00_000013_create_first_party_session_authority.php' ]]; then
            git update-index --assume-unchanged 'apps/web/database/migrations/0000_00_00_000013_create_first_party_session_authority.php'
            rm -f 'apps/web/database/migrations/0000_00_00_000013_create_first_party_session_authority.php'
          fi
          echo 'Exact Sprint35/Sprint36 successor or bounded correction envelope recognized; historical executable preservation remains active.'
          else
            echo 'ONEQAY_SPRINT35_SUCCESSOR=false' >> "$GITHUB_ENV"
          fi

      - name: Preserve root Platform Foundation dependency locks and Sprint 28 migration boundary
        if: (github.event_name == 'pull_request' && env.ONEQAY_SPRINT30_SUCCESSOR != 'true') && env.ONEQAY_SPRINT35_SUCCESSOR != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" | sort > /tmp/s29-successor-files.txt
          if [[ "$(wc -l < /tmp/s29-successor-files.txt)" -eq 20 ]] && [[ "$(sha256sum /tmp/s29-successor-files.txt | awk '{print $1}')" == '29ab63415c913c80aed0f19eb97d547cc31c60bd38a2484a0e6dc0f3c8341d03' ]]; then
            echo 'Exact Sprint 29 successor envelope accepted for Sprint 23 preservation.'
            exit 0
          fi
          base="origin/${{ github.base_ref }}"
          if git diff --name-only "$base...HEAD" | grep -Eq '(^|/)(composer\.(json|lock)|package(-lock)?\.json)$'; then exit 1; fi
          if git diff --name-only "$base...HEAD" | grep -Eq '^(src/Auth/|src/Persistence/|src/Migration/|src/Authorization/Foundation\.php)'; then exit 1; fi
          immutable=(
            apps/web/database/migrations/0000_00_00_000001_create_foundational_context_graph.php
            apps/web/database/migrations/0000_00_00_000002_create_organizational_access_grants.php
            apps/web/database/migrations/0000_00_00_000003_create_scoped_role_permission_policy.php
            apps/web/database/migrations/0000_00_00_000004_create_policy_mutation_journal.php
            apps/web/database/migrations/0000_00_00_000005_create_initial_tenant_administrator_provisioning_journal.php
            apps/web/database/migrations/0000_00_00_000006_create_protected_control_administrator_mutation_journal.php
            apps/web/database/migrations/0000_00_00_000007_create_identity_password_credentials.php
          )
          git diff --exit-code "$base...HEAD" -- "${immutable[@]}"
          mapfile -t migration_diff < <(git diff --name-status "$base...HEAD" -- apps/web/database/migrations)
          test "${#migration_diff[@]}" -eq 1
          test "${migration_diff[0]}" = $'A\tapps/web/database/migrations/0000_00_00_000008_create_initial_password_enrollments.php'

      - name: Preserve root Platform Foundation regression
        run: |
          composer validate --strict --no-check-publish
          composer test

      - name: Install locked application dependencies
        working-directory: apps/web
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist

      - name: Validate Sprint 23 bootstrap Sprint 24 separation and Sprint 25 exclusion
        shell: bash
        run: |
          set -euo pipefail
          find apps/web/app apps/web/database/migrations apps/web/routes apps/web/tests -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do php -l "$file"; done
          if grep -R -n -E 'Illuminate\\|Schema::|DB::|new PDO|mysqli_' apps/web/app/Application/Authorization; then exit 1; fi
          grep -Fq 'VerifiedPlatformIdentity' apps/web/app/Application/Authorization/InitialTenantAdministratorProvisioningService.php
          grep -Fq 'InitialTenantAdministratorProvisioningAuthority' apps/web/app/Application/Authorization/InitialTenantAdministratorProvisioningService.php
          grep -Fq 'PersistenceTransaction' apps/web/app/Application/Authorization/InitialTenantAdministratorProvisioningService.php
          grep -Fq "CONTROL_ROLE = 'authorization-policy-administrator'" apps/web/app/Application/Authorization/InitialTenantAdministratorProvisioningRepository.php
          grep -Fq 'CONTROL_PERMISSION = AdministrationPermission::MANAGE' apps/web/app/Application/Authorization/InitialTenantAdministratorProvisioningRepository.php
          grep -Fq 'ProtectedControlAdministratorLifecycleRepository' apps/web/app/Application/Authorization/ProtectedControlAdministratorLifecycleService.php
          delivery_files=(
            apps/web/app/Application/Authorization/PolicyAdministrationDeliveryCommand.php
            apps/web/app/Application/Authorization/PolicyAdministrationDeliveryService.php
            apps/web/app/Delivery/Http/Authorization/PolicyAdministrationController.php
            apps/web/app/Delivery/Http/Middleware/RequirePolicyAdministrationSessionContextMiddleware.php
          )
          if grep -n -E 'InitialTenantAdministratorProvisioning(Service|Authority)|PreauthorizedInitialTenantAdministratorProvisioningAuthority|LaravelInitialTenantAdministratorProvisioningRepository|ProtectedControlAdministratorLifecycle(Service|Repository)|control\.administrator\.(delegate|revoke)' "${delivery_files[@]}"; then exit 1; fi

      - name: Enforce eight-migration one-time bootstrap preservation
        if: env.ONEQAY_SPRINT30_SUCCESSOR != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t migrations < <(find apps/web/database/migrations -maxdepth 1 -type f -name '*.php' -printf '%f\n' | sort)
          expected=(
            '0000_00_00_000001_create_foundational_context_graph.php'
            '0000_00_00_000002_create_organizational_access_grants.php'
            '0000_00_00_000003_create_scoped_role_permission_policy.php'
            '0000_00_00_000004_create_policy_mutation_journal.php'
            '0000_00_00_000005_create_initial_tenant_administrator_provisioning_journal.php'
            '0000_00_00_000006_create_protected_control_administrator_mutation_journal.php'
            '0000_00_00_000007_create_identity_password_credentials.php'
            '0000_00_00_000008_create_initial_password_enrollments.php'
          )
          test "${migrations[*]}" = "${expected[*]}"
          migration='apps/web/database/migrations/0000_00_00_000005_create_initial_tenant_administrator_provisioning_journal.php'
          lifecycle_migration='apps/web/database/migrations/0000_00_00_000006_create_protected_control_administrator_mutation_journal.php'
          credential_migration='apps/web/database/migrations/0000_00_00_000007_create_identity_password_credentials.php'
          enrollment_migration='apps/web/database/migrations/0000_00_00_000008_create_initial_password_enrollments.php'
          repo='apps/web/app/Infrastructure/Authorization/LaravelInitialTenantAdministratorProvisioningRepository.php'
          lifecycle_repo='apps/web/app/Infrastructure/Authorization/LaravelProtectedControlAdministratorLifecycleRepository.php'
          authority='apps/web/app/Infrastructure/Authorization/PreauthorizedInitialTenantAdministratorProvisioningAuthority.php'
          provider='apps/web/app/Providers/AppServiceProvider.php'
          grep -Fq 'oneqay_initial_tenant_admin_provisionings' "$migration"
          grep -Fq "primary('tenant_id'" "$migration"
          grep -Fq 'fk_initial_tenant_admin_identity' "$migration"
          grep -Fq 'fk_initial_tenant_admin_role' "$migration"
          grep -Fq 'fk_initial_tenant_admin_permission' "$migration"
          grep -Fq 'oneqay_protected_control_admin_mutations' "$lifecycle_migration"
          grep -Fq 'oneqay_identity_password_credentials' "$credential_migration"
          grep -Fq "string('identity_id', 96)" "$credential_migration"
          grep -Fq 'oneqay_initial_password_enrollments' "$enrollment_migration"
          grep -Fq 'fk_initial_password_enrollment_actor' "$enrollment_migration"
          grep -Fq 'fk_initial_password_enrollment_target' "$enrollment_migration"
          grep -Fq -- "->where('tenant_id'," "$repo"
          grep -Fq 'hasAnyControlRole' "$repo"
          grep -Fq 'controlRoleStateCompatible' "$repo"
          grep -Fq 'assertDesiredState' "$repo"
          grep -Fq -- "->where('tenant_id'," "$lifecycle_repo"
          if grep -Eq '\b(updateOrInsert|upsert)\s*\(' "$repo" "$lifecycle_repo"; then exit 1; fi
          if grep -Eq '\b(request|header|getenv)\s*\(' "$authority"; then exit 1; fi
          if grep -Fq 'InitialTenantAdministratorProvisioningAuthority::class' "$provider"; then exit 1; fi

      - name: Preserve Sprint 21 Sprint 22 and Sprint 25 control-plane invariants
        shell: bash
        run: |
          set -euo pipefail
          read_repo='apps/web/app/Infrastructure/Authorization/LaravelDurableRolePermissionRepository.php'
          write_repo='apps/web/app/Infrastructure/Authorization/LaravelDurablePolicyAdministrationRepository.php'
          if grep -Eq '\b(insert|insertOrIgnore|update|updateOrInsert|upsert|delete|truncate)\s*\(' "$read_repo"; then exit 1; fi
          grep -Fq 'controlAuthorityExistsForScope' "$write_repo"
          grep -Fq -- "->where('permission_id', AdministrationPermission::MANAGE)" "$write_repo"
          grep -Fq 'scope-escape-tenant' apps/web/tests/authorization-administration-persistence.php
          grep -Fq 'PROTECTED_CONTROL_AUTHORITY' apps/web/tests/initial-tenant-administrator-provisioning.php
          grep -Fq 'last-principal-alpha' apps/web/tests/protected-control-administrator-lifecycle.php
          grep -Fq 'protected-permission-attempt' apps/web/tests/policy-administration-delivery.php
          grep -Fq 'protected-role-attempt' apps/web/tests/policy-administration-delivery.php

      - name: Run Sprint 21 through Sprint 28 disposable regressions
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          composer test
          php -r 'require "vendor/autoload.php"; $app=require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Http\Kernel::class)->bootstrap(); $assert=static function(bool $c,string $m):void{if(!$c)throw new RuntimeException($m);}; require "tests/authorization-persistence.php"; require "tests/authorization-administration-persistence.php"; require "tests/initial-tenant-administrator-provisioning.php"; require "tests/protected-control-administrator-lifecycle.php";'
          php tests/policy-administration-delivery.php
          php tests/tenant-isolation.php
          php tests/identity-org-context.php
          php tests/privileged-update-security.php
          php tests/identity-credential-verification.php
          php tests/first-party-session-establishment.php
          php tests/initial-password-enrollment.php

      - name: Preserve Preview Production updater and release boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'ONEQAY_PERSISTENCE_ENABLED=false' apps/web/environment.example
          if grep -R -n -E 'LaravelInitialTenantAdministratorProvisioningRepository|InitialTenantAdministratorProvisioningService|InitialTenantAdministratorProvisioningAuthority|PreauthorizedInitialTenantAdministratorProvisioningAuthority|LaravelProtectedControlAdministratorLifecycleRepository|ProtectedControlAdministratorLifecycleService|PolicyAdministrationDelivery|PolicyAdministrationController|RequirePolicyAdministrationSessionContextMiddleware|FirstPartyIdentityCredentialVerifier|VerifyFirstPartyIdentityCredential|LaravelFirstPartyIdentityCredentialVerifier|FirstPartySessionController|FirstPartySessionKeys|InitialPasswordEnrollment|password-enrollment' apps/web/app/Application/Preview apps/web/app/Delivery/Preview 2>/dev/null; then exit 1; fi
          release_workflow='.github/workflows/m7-5-preview-release-artifact.yml'
          grep -Fq '/apps/web/database/migrations/' "$release_workflow"
