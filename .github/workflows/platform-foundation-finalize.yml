name: Platform Foundation Controlled Finalization

"on":
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: platform-foundation-controlled-finalization
  cancel-in-progress: false

jobs:
  finalize:
    name: finalize-platform-foundation
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.ref == 'agent/platform-foundation-skeleton' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact authorized head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize exact source archive
        shell: bash
        env:
          SOURCE_ARCHIVE_SHA256: 1b4f996f433022aded5f27a5e1f8dc799646174ef16ebc5219b4e3faf7a2c731
        run: |
          set -euo pipefail
          cat .github/bootstrap/source.part* | base64 --decode > /tmp/oneqay-source.tar.gz
          echo "$SOURCE_ARCHIVE_SHA256  /tmp/oneqay-source.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file=/tmp/oneqay-source.tar.gz --directory=.
          python3 - <<'PY'
          from pathlib import Path

          service_worker = Path('public/sw.js')
          marker = '/* global self, caches, fetch, URL */\n'
          service_worker_text = service_worker.read_text()
          if not service_worker_text.startswith(marker):
              service_worker.write_text(marker + service_worker_text)

          phpstan = Path('phpstan.neon')
          phpstan.write_text(
              phpstan.read_text().replace('    checkMissingIterableValueType: false\n', '')
          )

          user_model = Path('app/Models/User.php')
          user_model.write_text(
              user_model.read_text()
              .replace('use Illuminate\\Database\\Eloquent\\Factories\\HasFactory;\n', '')
              .replace('    use HasFactory;\n', '')
          )

          app_entry = Path('resources/js/app.ts')
          app_entry_text = app_entry.read_text()
          import_marker = "import { createApp, h } from 'vue';\n"
          typed_import = (
              "import type { DefineComponent } from 'vue';\n"
              "import { createApp, h } from 'vue';\n"
          )
          resolve_marker = '  resolve: () => Foundation,\n'
          if import_marker not in app_entry_text or resolve_marker not in app_entry_text:
              raise SystemExit('Inertia app typing marker not found.')
          app_entry.write_text(
              app_entry_text
              .replace(import_marker, typed_import, 1)
              .replace(
                  resolve_marker,
                  '  resolve: () => Foundation as unknown as DefineComponent,\n',
                  1,
              )
          )

          middleware = Path(
              'app/Modules/Platform/Tenancy/Interface/Http/Middleware/ResolveTenantContext.php'
          )
          middleware_text = middleware.read_text()
          old_set = '        $this->store->set($context);\n'
          new_set = (
              "        if ($request->attributes->get('tenant_context_resolved') === true) {\n"
              "            return $this->failure(\n"
              "                $request,\n"
              "                'tenant_context_already_resolved',\n"
              "                'Tenant context has already been resolved for this request.',\n"
              "                409,\n"
              "            );\n"
              "        }\n\n"
              "        $this->store->clear();\n"
              "        $this->store->set($context);\n"
              "        $request->attributes->set('tenant_context_resolved', true);\n"
          )
          if old_set not in middleware_text:
              raise SystemExit('Tenant middleware set marker not found.')
          middleware_text = middleware_text.replace(old_set, new_set, 1)

          old_return = '        return $next($request);\n'
          new_return = (
              '        try {\n'
              '            return $next($request);\n'
              '        } finally {\n'
              '            $this->store->clear();\n'
              '        }\n'
          )
          if old_return not in middleware_text:
              raise SystemExit('Tenant middleware return marker not found.')
          middleware.write_text(middleware_text.replace(old_return, new_return, 1))
          PY

      - name: Verify exact finalization conditions
        shell: bash
        env:
          EXPECTED_BASE: 68df196efdf38919d73a6b6345b973d2c3698b29
          EXPECTED_BRANCH: agent/platform-foundation-skeleton
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.base.sha }}" = "$EXPECTED_BASE"
          test "${{ github.event.pull_request.head.ref }}" = "$EXPECTED_BRANCH"
          test "${{ github.event.pull_request.head.repo.full_name }}" = "$GITHUB_REPOSITORY"
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          test -f composer.json
          test -f package.json
          test -f scripts/quality/finalize_ssot.py
          test ! -f composer.lock
          test ! -f package-lock.json

      - name: Synchronize canonical SSOT documents
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/quality/finalize_ssot.py

      - name: Resolve and lock dependencies
        shell: bash
        run: |
          set -euo pipefail
          php --version
          composer --version
          node --version
          npm --version
          composer update --no-interaction --prefer-dist --no-progress
          npm install --no-audit --no-fund

      - name: Normalize source formatting
        shell: bash
        run: |
          set -euo pipefail
          ./vendor/bin/pint --parallel
          npx prettier --write resources/js resources/css
          npx eslint . --fix

      - name: Validate executable foundation
        shell: bash
        run: |
          set -euo pipefail
          composer validate --strict
          composer audit --no-interaction
          composer check
          npm audit --audit-level=high
          npm run check
          npm run build
          python3 scripts/quality/scan_repository.py
          git diff --check

      - name: Remove temporary write-capable finalizer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/bootstrap
          rm -f .github/workflows/platform-foundation-finalize.yml
          rm -f scripts/quality/finalize_ssot.py
          test ! -e .github/workflows/platform-foundation-finalize.yml
          test ! -e scripts/quality/finalize_ssot.py

      - name: Commit validated final tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Lab | zefry'
          git config user.email 'labzefry@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'feat(platform): finalize technical preview foundation'
          git push origin HEAD:agent/platform-foundation-skeleton
