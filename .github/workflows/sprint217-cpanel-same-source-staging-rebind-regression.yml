# Author by Lab | zefry
name: Sprint217 cPanel Same-Source Staging Rebind Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint217-cpanel-same-source-staging-rebind-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify-sprint217:
    name: qualify-sprint217-cpanel-same-source-staging-rebind
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Lock exact Sprint217 envelope
        if: github.event_name == 'pull_request' && github.head_ref == 'sprint217-cpanel-same-source-staging-rebind'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_PATH_HASH: d741d767942ac32eb8e0e1faeaf1bf2c2eade693b5ebdd142fc7d6ab5ff5fff9
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | LC_ALL=C sort > /tmp/s217-paths
          test "$(wc -l < /tmp/s217-paths)" -eq 6
          test "$(sha256sum /tmp/s217-paths | awk '{print $1}')" = "$EXPECTED_PATH_HASH"
          test -z "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- apps/web)"

      - name: Setup governed PHP runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: curl,pdo_mysql
          coverage: none

      - name: Validate current release binding
        shell: bash
        run: |
          set -euo pipefail
          contract=ops/final-shift-close/DURABLE_STAGING_CPANEL_NO_SSH_OPERATOR_KIT_PUBLICATION_CONTRACT.json
          jq -e . "$contract" >/dev/null
          bash -n tools/cpanel/build-cpanel-no-ssh-operator-qualification-kit.sh
          php -l tools/cpanel/inspect-durable-staging-cpanel-no-ssh-target.php
          php -l tools/cpanel/prepare-durable-staging-cpanel-no-ssh-target-candidate.php
          php -l tools/prepare-durable-staging-deployment-authority-request.php
          test "$(jq -r '.application_release_reference.publication_run_id' "$contract")" = 35505077172
          test "$(jq -r '.application_release_reference.actions_artifact_id' "$contract")" = 10603323419
          test "$(jq -r '.application_release_reference.actions_artifact_name' "$contract")" = oneqay-durable-staging-d0b5becbf945-operator-bundle
          test "$(jq -r '.application_release_reference.actions_outer_digest' "$contract")" = sha256:38e21fef3c32014f2d07cb7a3a2d970a37680371c99118b8c43b88cf196c25f5
          test "$(jq -r '.application_release_reference.release_id' "$contract")" = durable-staging-d0b5becbf945
          test "$(jq -r '.application_release_reference.source_commit' "$contract")" = d0b5becbf945c5192e797d512a704eb5aecc6eaa
          test "$(jq -r '.application_release_reference.artifact_sha256' "$contract")" = e32a7de2c07c35306c03edff5d7d762782ef58449c92d4b88e5dd04b50d489a2
          test "$(jq -r '.application_release_reference.manifest_sha256' "$contract")" = 6d8099ef3f0b18003c8e362cc1f315d01777b70f3a05b3948f16ff4a44092b9c
          test "$(jq -r '.application_release_reference.handoff_sha256' "$contract")" = a9f33e8e5fa28abefdfb6397f350307e8954c486fbd43540a879b9c340c7ccad
          test "$(jq -r '.application_release_reference.handoff_state' "$contract")" = VALIDATED_FOR_EXTERNAL_DEPLOYMENT_NOT_AUTHORIZED
          test "$(jq -r '.same_source_production_context.source_commit' "$contract")" = "$(jq -r '.application_release_reference.source_commit' "$contract")"
          test "$(jq -r '.same_source_production_context.actions_artifact_id' "$contract")" = 10603358335
          test "$(jq -r '.same_source_production_context.production_promotion_requires_verified_staging_evidence' "$contract")" = true
          test "$(jq -r '.same_source_production_context.production_traffic_activation_authorized' "$contract")" = false

      - name: Preserve canonical operational NO-GO
        shell: bash
        run: |
          set -euo pipefail
          state=ops/final-shift-close/STATE.json
          selection=ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json
          test "$(jq -r '.migration27.state' "$state")" = NOT_EXECUTED
          test "$(jq -r '.permission_provisioning.state' "$state")" = NONE
          test "$(jq -r '.feature_activation.state' "$state")" = INACTIVE
          test "$(jq -r '.deployment_authority' "$state")" = NOT_GRANTED
          test "$(jq -r '.technical_preview_activation' "$state")" = NOT_AUTHORIZED
          test "$(jq -r '.production_activation' "$state")" = NOT_AUTHORIZED
          test "$(jq -r '.updater_activation' "$state")" = INACTIVE
          test "$(jq -r '.selection_state' "$selection")" = BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET
          test "$(jq -r '.selected_target' "$selection")" = null

      - name: Build current kit twice
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          bash tools/cpanel/build-cpanel-no-ssh-operator-qualification-kit.sh "$head_sha"
          kit_id="cpanel-no-ssh-operator-kit-${head_sha:0:12}"
          cp "dist/${kit_id}.zip" /tmp/s217-first.zip
          cp "dist/${kit_id}.manifest.json" /tmp/s217-first.manifest.json
          cp "dist/${kit_id}.zip.sha256" /tmp/s217-first.sha256
          rm -rf dist
          bash tools/cpanel/build-cpanel-no-ssh-operator-qualification-kit.sh "$head_sha"
          cmp /tmp/s217-first.zip "dist/${kit_id}.zip"
          diff -u /tmp/s217-first.manifest.json "dist/${kit_id}.manifest.json"
          diff -u /tmp/s217-first.sha256 "dist/${kit_id}.zip.sha256"

      - name: Prove packaged kit uses current same-source release only
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          kit_id="cpanel-no-ssh-operator-kit-${head_sha:0:12}"
          root="$RUNNER_TEMP/s217-kit"
          mkdir -p "$root"
          unzip -q "dist/${kit_id}.zip" -d "$root"
          kit="$root/${kit_id}"

          test "$(jq -r '.application_release_reference.actions_artifact_id' "$kit/KIT.json")" = 10603323419
          test "$(jq -r '.application_release_reference.release_id' "$kit/KIT.json")" = durable-staging-d0b5becbf945
          test "$(jq -r '.application_release_reference.source_commit' "$kit/KIT.json")" = d0b5becbf945c5192e797d512a704eb5aecc6eaa
          test "$(jq -r '.application_release_reference.artifact_sha256' "$kit/KIT.json")" = e32a7de2c07c35306c03edff5d7d762782ef58449c92d4b88e5dd04b50d489a2
          test "$(jq -r '.application_release_reference.handoff_sha256' "$kit/KIT.json")" = a9f33e8e5fa28abefdfb6397f350307e8954c486fbd43540a879b9c340c7ccad
          test "$(jq -r '.application_release_reference.actions_artifact_id' "$kit/kit.manifest.json")" = 10603323419

          ! grep -RIFq '10597712890' "$kit"
          ! grep -RIFq 'durable-staging-e37300d5d1be' "$kit"
          ! grep -RIFq 'Sprint211 durable-staging operator bundle' "$kit"
          ! find "$kit" -type f -path '*/apps/web/*' -print -quit | grep -q .
          ! find "$kit" -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' \) -print -quit | grep -q .

      - name: Exercise current kit through Sprint208 authority request
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          kit_id="cpanel-no-ssh-operator-kit-${head_sha:0:12}"
          root="$RUNNER_TEMP/s217-exercise"
          mkdir -p "$root"
          unzip -q "dist/${kit_id}.zip" -d "$root"
          kit="$root/${kit_id}"
          deployment="$root/host/deployment"
          release_root="$deployment/releases"
          shared_root="$deployment/shared"
          active_pointer="$deployment/current"
          document_root="$active_pointer/apps/web/public"
          private="$root/host/private"
          mkdir -p "$release_root" "$shared_root" "$private"

          jq --arg env_id cpanel-s217-ci --arg deployment "$deployment" --arg release_root "$release_root" --arg shared_root "$shared_root" --arg active "$active_pointer" --arg docroot "$document_root"             '.environment_id=$env_id
             | .filesystem.deployment_root=$deployment
             | .filesystem.release_root=$release_root
             | .filesystem.shared_runtime_root=$shared_root
             | .filesystem.active_release_pointer=$active
             | .filesystem.document_root=$docroot
             | .operator_assertions |= with_entries(.value=true)'             "$kit/target-input.template.json" > "$private/target-input.json"

          token='sprint217-ci-private-attestation-token-0123456789abcdef'
          jq --arg env_id cpanel-s217-ci --arg token "$token"             '.ONEQAY_DURABLE_RUNTIME_ENVIRONMENT_ID=$env_id | .ONEQAY_DURABLE_RUNTIME_ATTESTATION_TOKEN=$token'             "$kit/private-bindings.template.json" > "$private/bindings.json"
          chmod 0600 "$private/bindings.json"

          php "$kit/tools/cpanel/inspect-durable-staging-cpanel-no-ssh-target.php"             "$private/target-input.json" "$private/bindings.json" "$private/target-profile.json"
          php "$kit/tools/cpanel/prepare-durable-staging-cpanel-no-ssh-target-candidate.php"             "$private/target-profile.json" "$private/target-candidate.json"

          cat > "$private/handoff.json" <<'EOF'
          {
            "schema_version": 1,
            "handoff_state": "VALIDATED_FOR_EXTERNAL_DEPLOYMENT_NOT_AUTHORIZED",
            "product": {"name":"oneQay","repository":"labzefry/oneQay"},
            "artifact": {
              "release_id": "durable-staging-d0b5becbf945",
              "source_commit": "d0b5becbf945c5192e797d512a704eb5aecc6eaa",
              "artifact_filename": "durable-staging-d0b5becbf945.tar.gz",
              "artifact_sha256": "e32a7de2c07c35306c03edff5d7d762782ef58449c92d4b88e5dd04b50d489a2",
              "artifact_size_bytes": 4765840,
              "manifest_sha256": "6d8099ef3f0b18003c8e362cc1f315d01777b70f3a05b3948f16ff4a44092b9c"
            },
            "runtime": {
              "release_channel": "STAGING",
              "release_environment": "DURABLE_STAGING",
              "required_runtime_class": "durable-staging",
              "production": false,
              "production_data_allowed": false,
              "synthetic_fixture_runtime": false,
              "environment_values_embedded": false
            },
            "migration": {
              "source_included": true,
              "expected_count": 27,
              "latest_migration": "0000_00_00_000027_create_pos_shift_close_evidence_foundation.php",
              "execution_state": "NOT_PERFORMED",
              "execution_authorized": false
            },
            "deployment": {
              "execution_state": "NOT_PERFORMED",
              "archive_extraction_state": "NOT_PERFORMED",
              "runtime_configuration_mutation_state": "NOT_PERFORMED",
              "active_release_pointer_mutation_state": "NOT_PERFORMED",
              "authority_state": "NOT_GRANTED"
            },
            "required_external_bindings": [
              "ONEQAY_RUNTIME_CLASS",
              "ONEQAY_RUNNING_SOURCE_COMMIT",
              "ONEQAY_RUNNING_ARTIFACT_SHA256",
              "ONEQAY_DURABLE_RUNTIME_ENVIRONMENT_ID",
              "ONEQAY_DURABLE_RUNTIME_ATTESTATION_TOKEN",
              "ONEQAY_DURABLE_STAGING_RUNTIME_ENABLED"
            ],
            "operational_boundary": {
              "environment_creation": "NOT_PERFORMED",
              "environment_deployment": "NOT_PERFORMED",
              "migration27_execution": "NOT_PERFORMED",
              "permission_provisioning": "NONE",
              "feature_activation": "INACTIVE",
              "technical_preview_activation": "NOT_AUTHORIZED",
              "production_activation": "NOT_AUTHORIZED",
              "updater_activation": "INACTIVE",
              "target_selection": "BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET",
              "selected_target": null,
              "producer_dispatch": "NOT_PERFORMED"
            },
            "attribution": "Lab | zefry"
          }
          EOF

          php "$kit/tools/prepare-durable-staging-deployment-authority-request.php"             "$private/handoff.json" "$private/target-candidate.json" "$private/request.json"

          test "$(jq -r '.request_state' "$private/request.json")" = DURABLE_STAGING_DEPLOYMENT_AUTHORITY_REQUEST_PENDING_APPROVAL
          test "$(jq -r '.release_id' "$private/request.json")" = durable-staging-d0b5becbf945
          test "$(jq -r '.source_commit' "$private/request.json")" = d0b5becbf945c5192e797d512a704eb5aecc6eaa
          test "$(jq -r '.artifact_sha256' "$private/request.json")" = e32a7de2c07c35306c03edff5d7d762782ef58449c92d4b88e5dd04b50d489a2
          test "$(jq -r '.required_authority.maximum_lifetime_seconds' "$private/request.json")" = 900
          test "$(jq -r '.production_authorized' "$private/request.json")" = false

      - name: Confirm source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          git diff --exit-code
          test -z "$(git status --porcelain)"
