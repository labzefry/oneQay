name: Sprint225 Historical Selected Target Successor Compatibility

# Attribution: Lab | zefry

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/sprint225-historical-selected-target-successor-compatibility.yml'
      - 'docs/SPRINT225_HISTORICAL_SELECTED_TARGET_SUCCESSOR_COMPATIBILITY.md'

permissions:
  contents: read

concurrency:
  group: sprint225-historical-selected-target-successor-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify-historical-selected-target-successor-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact Sprint225 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Lock exact Sprint225 compatibility envelope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Historical regression workflows validate their owned invariants only.
          # Exact full-PR envelope locking belongs to the active Sprint253 workflow.
          test -f '.github/workflows/sprint225-historical-selected-target-successor-compatibility.yml'

      - name: Preserve product runtime database and operational source
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --exit-code "$BASE_SHA" "$HEAD_SHA" -- apps/web/app             apps/web/bootstrap             apps/web/config             apps/web/database/migrations             apps/web/resources             apps/web/routes             ops/final-shift-close/STATE.json             ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json             .github/workflows/final-shift-close-migration27-selected-target-db-binding.yml             .github/workflows/final-shift-close-migration27-execution.yml             .github/workflows/final-shift-close-permission-provisioning.yml

      - name: Lock current canonical selected target without granting activation
        shell: bash
        run: |
          set -euo pipefail
          state=ops/final-shift-close/STATE.json
          selection=ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json
          test "$(jq -r '.migration27.state' "$state")" = 'NOT_EXECUTED' || test "$(jq -r '.migration27.state' "$state")" = 'EXECUTED'
          test "$(jq -r '.permission_provisioning.state' "$state")" = 'NONE' || test "$(jq -r '.permission_provisioning.state' "$state")" = 'PROVISIONED'
          test "$(jq -r '.feature_activation.state' "$state")" = INACTIVE || test "$(jq -r '.feature_activation.state' "$state")" = ACTIVE
          test "$(jq -r '.deployment_authority' "$state")" = 'NOT_GRANTED'
          test "$(jq -r '.technical_preview_activation' "$state")" = 'NOT_AUTHORIZED'
          test "$(jq -r '.production_activation' "$state")" = 'NOT_AUTHORIZED'
          test "$(jq -r '.updater_activation' "$state")" = 'INACTIVE'
          test "$(jq -r '.selection_state' "$selection")" = 'SELECTED_NOT_AUTHORIZED'
          test "$(jq -r '.selected_target.environment_id' "$selection")" = 'oneqay-durable-staging-01'
          test "$(jq -r '.selected_target.runtime_class' "$selection")" = 'durable-staging'
          test "$(jq -r '.selected_target.exact_running_source_commit' "$selection")" = '59b42137eed717aacc82080a46753440bb4d8537'
          test "$(jq -r '.selected_target.exact_running_artifact_sha256' "$selection")" = '8ad4a33196eabd6248c9dfb35eb118e97759e5c17b32384a12b120258bce615c'
          test "$(jq -r '.selected_target.selection_fingerprint_sha256' "$selection")" = '6ecc487cb144e634455de69cc43aa39b1f6880a2256c4b1ab33387096513772b'

      - name: Prove stale current-state assertions are removed from changed historical workflows
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git merge-base HEAD origin/main)"
          git diff --name-only "$base_sha" HEAD -- '.github/workflows/sprint*.yml' | LC_ALL=C sort > /tmp/sprint225-paths
          grep '^\.github/workflows/sprint' /tmp/sprint225-paths | grep -v 'sprint225-' > /tmp/historical-workflows
          test -s /tmp/historical-workflows
          while IFS= read -r workflow; do
            ! grep -Eq "jq -r '\.selection_state'.*BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET" "$workflow"
            ! grep -Eq "jq -r '\.selected_target'.*(==|=)[[:space:]]*'?null'?" "$workflow"
            ! grep -Eq '^[[:space:]]+\.github/workflows/final-shift-close-migration27-selected-target-db-binding\.yml \\$' "$workflow"
          done < /tmp/historical-workflows

      - name: Preserve historical contracts as provenance
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --exit-code "$BASE_SHA" "$HEAD_SHA" -- ops docs/handbook
          grep -Fq 'Historical workflow contracts remain historical provenance.' docs/SPRINT225_HISTORICAL_SELECTED_TARGET_SUCCESSOR_COMPATIBILITY.md

      - name: Verify tracked source cleanliness
        shell: bash
        run: git diff --exit-code
