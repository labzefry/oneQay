          composer audit --locked --format=json > /tmp/oneqay-s32-composer-audit.json || true
          php -r '$data=json_decode(file_get_contents("/tmp/oneqay-s32-composer-audit.json"),true,512,JSON_THROW_ON_ERROR); foreach (($data["advisories"] ?? []) as $package=>$items) { foreach ($items as $item) { if (in_array(strtolower((string)($item["severity"] ?? "")), ["high","critical"], true)) { fwrite(STDERR,"Blocking Composer advisory for {$package}.\n"); exit(1); } } }'

