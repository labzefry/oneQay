name: Sprint 32 Authentication Recovery Proof Regression

# Attribution: Lab | zefry
# Historical Sprint 33 fingerprint: 04a1177c12712183a7dda4ae81be1356c0e41294533336c9f999d376c224712a
# Sprint 34 fingerprint: e3b724002cfc0be1ef890d1b5594a2a5179123f949f6f486354e21950c7328eb

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/sprint32-authentication-recovery-proof-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint32-authentication-recovery-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sprint32-authentication-recovery-proof-regression:
    name: sprint32-authentication-recovery-proof-regression
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      ONEQAY_PERSISTENCE_ENABLED: 'false'
      ONEQAY_AUTHENTICATION_RECOVERY_ENABLED: 'false'
      ONEQAY_PRIVILEGED_TOTP_MFA_ENABLED: 'false'
      ONEQAY_PRIVILEGED_STEP_UP_ENABLED: 'false'
      SESSION_DRIVER: array
      CACHE_STORE: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce exact Sprint 34 successor envelope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          base="origin/${{ github.base_ref }}"
          test "$(git rev-parse "$base")" = '8b4fc5425ba8d98f35f02c39bd1880ce50c4759b'
          git diff --name-only "$base...HEAD" | sort > /tmp/s34-files.txt
          test "$(wc -l < /tmp/s34-files.txt)" -eq 35
          test "$(sha256sum /tmp/s34-files.txt | awk '{print $1}')" = 'e3b724002cfc0be1ef890d1b5594a2a5179123f949f6f486354e21950c7328eb'

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Preserve root and install application
        run: |
          composer validate --strict --no-check-publish
          composer test
          cd apps/web
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist

      - name: Enforce recovery feature arm storage and restricted-session boundary
        shell: bash
        run: |
          set -euo pipefail
          config='apps/web/config/oneqay.php'
          repo='apps/web/app/Infrastructure/Identity/LaravelRecoveryCodeRepository.php'
          controller='apps/web/app/Delivery/Http/Identity/RecoveryCodeController.php'
          keys='apps/web/app/Delivery/Http/Identity/FirstPartySessionKeys.php'
          grep -Fq "env('ONEQAY_AUTHENTICATION_RECOVERY_ENABLED', false)" "$config"
          grep -Fq "'restricted_session_ttl_seconds' => 600" "$config"
          grep -Fq 'lockForUpdate()' "$repo"
          grep -Fq "'proof_succeeded'" "$repo"
          grep -Fq 'FirstPartySessionKeys::RECOVERY_CODE_ID' "$controller"
          grep -Fq '$session->invalidate();' "$controller"
          grep -Fq '$session->regenerateToken();' "$controller"
          grep -Fq 'oneqay.auth.credential_epoch' "$keys"
          if grep -RInE 'AuthenticationRecovery|RecoveryCode|auth/recovery' apps/web/app/Application/Preview apps/web/app/Delivery/Preview 2>/dev/null; then exit 1; fi

      - name: Lint full Sprint 34 compatible PHP source
        shell: bash
        run: |
          set -euo pipefail
          find apps/web/app apps/web/database/migrations apps/web/routes apps/web/tests -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do php -l "$file"; done

      - name: Run dedicated Sprint 32 recovery proof regression
        working-directory: apps/web
        run: php tests/authentication-recovery-proof.php

      - name: Preserve session TOTP and step-up regressions
        working-directory: apps/web
        run: |
          php tests/first-party-session-establishment.php
          php tests/privileged-totp-mfa.php
          php tests/privileged-reauthentication-step-up.php
          php tests/privileged-update-security.php

      - name: Preserve protected deployment boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'ONEQAY_PERSISTENCE_ENABLED=false' apps/web/environment.example
          grep -Fq "'install_enabled' => false" apps/web/config/oneqay.php
          grep -Fq 'NO_SCHEMA_CHANGE' docs/AUTHENTICATION_RECOVERY_PROOF_FOUNDATION.md
          grep -Fq 'Production' docs/AUTHENTICATION_RECOVERY_PROOF_FOUNDATION.md
          git diff --exit-code
