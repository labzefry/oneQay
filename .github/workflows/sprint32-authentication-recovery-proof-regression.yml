          repo='apps/web/app/Infrastructure/Identity/LaravelRecoveryCodeRepository.php'
          service='apps/web/app/Application/Identity/RecoveryCodeService.php'
          controller='apps/web/app/Delivery/Http/Identity/RecoveryCodeController.php'
          config='apps/web/config/oneqay.php'
          routes='apps/web/routes/web.php'
          grep -Fq "env('ONEQAY_AUTHENTICATION_RECOVERY_ENABLED', false)" "$config"
          grep -Fq "'restricted_session_ttl_seconds' => 600" "$config"
          grep -Fq "Route::post('/auth/recovery/codes/rotate'" "$routes"
          grep -Fq "Route::post('/auth/recovery/proof'" "$routes"
          grep -Fq 'VerifyFirstPartyIdentityCredential' "$service"
          grep -Fq 'random_bytes(16)' "$repo"
          grep -Fq 'random_bytes(32)' "$repo"
          grep -Fq "hash('sha256', \$secret)" "$repo"
          grep -Fq 'hash_equals($row->secret_digest, $suppliedDigest)' "$repo"
          grep -Fq "whereNotNull('confirmed_at_unix')" "$repo"
          grep -Fq 'lockForUpdate()' "$repo"
          grep -Fq '$session->invalidate();' "$controller"
          grep -Fq '$session->regenerateToken();' "$controller"
          if grep -n -E 'decryptString|encryptString|secret_ciphertext|provisioningUri|password_hash\(|password_verify\(' "$repo" "$service" "$controller"; then exit 1; fi

