# Author by Lab | zefry
# Sprint47 JRN-004 Sprint38 legacy-state correction preservation anchor.
name: Sprint43 First-Party Identity Authentication Eligibility Reactivation Regression

# Attribution: Lab | zefry

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sprint43-first-party-identity-authentication-eligibility-reactivation-regression.yml'
      - 'apps/web/app/Application/Identity/FirstPartyIdentityEligibilityAdministrationRepository.php'
      - 'apps/web/app/Application/Identity/FirstPartyIdentityEligibilityAdministrationService.php'
      - 'apps/web/app/Delivery/Http/Identity/FirstPartyIdentityEligibilityAdministrationController.php'
      - 'apps/web/app/Infrastructure/Identity/LaravelFirstPartyIdentityEligibilityAdministrationRepository.php'
      - 'apps/web/routes/web.php'
      - 'apps/web/tests/first-party-identity-authentication-eligibility-administration.php'
      - 'apps/web/tests/first-party-identity-authentication-eligibility-reactivation.php'
      - 'docs/FIRST_PARTY_IDENTITY_AUTHENTICATION_ELIGIBILITY_REACTIVATION_FOUNDATION.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint43-identity-authentication-eligibility-reactivation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sprint43-identity-authentication-eligibility-reactivation:
    name: sprint43-identity-authentication-eligibility-reactivation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnY=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      ONEQAY_PERSISTENCE_ENABLED: 'true'
      ONEQAY_AUTHENTICATION_SESSION_CONTROL_ENABLED: 'true'
      ONEQAY_PRIVILEGED_TOTP_MFA_ENABLED: 'false'
      SESSION_DRIVER: array
      CACHE_STORE: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup exact PHP runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Enforce exact Sprint43 source envelope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/sprint43-source-paths <<'EOF'
          .github/workflows/sprint43-first-party-identity-authentication-eligibility-reactivation-regression.yml
          apps/web/app/Application/Identity/FirstPartyIdentityEligibilityAdministrationRepository.php
          apps/web/app/Application/Identity/FirstPartyIdentityEligibilityAdministrationService.php
          apps/web/app/Delivery/Http/Identity/FirstPartyIdentityEligibilityAdministrationController.php
          apps/web/app/Infrastructure/Identity/LaravelFirstPartyIdentityEligibilityAdministrationRepository.php
          apps/web/routes/web.php
          apps/web/tests/first-party-identity-authentication-eligibility-administration.php
          apps/web/tests/first-party-identity-authentication-eligibility-reactivation.php
          docs/FIRST_PARTY_IDENTITY_AUTHENTICATION_ELIGIBILITY_REACTIVATION_FOUNDATION.md
          EOF
          sort -o /tmp/sprint43-source-paths /tmp/sprint43-source-paths
          test "$(wc -l < /tmp/sprint43-source-paths)" -eq 9
          test "$(sha256sum /tmp/sprint43-source-paths | awk '{print $1}')" = '3d0293362f451fe4bf472d0d2c38c3eec3d67df75b451ba5b273e8dbdb0f2eed'
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | sort > /tmp/actual-sprint43-source-paths
          actual_count="$(wc -l < /tmp/actual-sprint43-source-paths)"
          actual_fingerprint="$(sha256sum /tmp/actual-sprint43-source-paths | awk '{print $1}')"
          echo 'ONEQAY_SPRINT46_JRN006_PRESERVATION=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT46_JRN006_SOURCE_SUCCESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT46_JRN006_COMPATIBILITY_PREDECESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT47_JRN004_SOURCE_SUCCESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT48_JRN005_SOURCE_SUCCESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT50_JRN007_SOURCE_SUCCESSOR=false' >> "$GITHUB_ENV"
          echo 'ONEQAY_SPRINT50_COMPATIBILITY_PREDECESSOR=false' >> "$GITHUB_ENV"
          if [[ "$actual_count" -eq 9 && "$actual_fingerprint" == '3d0293362f451fe4bf472d0d2c38c3eec3d67df75b451ba5b273e8dbdb0f2eed' ]]; then
            cmp -s /tmp/sprint43-source-paths /tmp/actual-sprint43-source-paths
            echo 'Recognized exact Sprint43 source envelope.'
          elif [[ "$actual_count" -eq 3 && "$actual_fingerprint" == '749ce1548b3491572af9dce61b34012842c638e409d8a9bbfd9625b94d8dd886' ]]; then
            echo 'ONEQAY_SPRINT46_JRN006_PRESERVATION=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint46 JRN-006 three-workflow source-compatibility predecessor shape.'
            migration17='apps/web/database/migrations/0000_00_00_000017_create_pos_catalog_preparation_journal.php'
            if [[ -f "$migration17" ]]; then
              git update-index --assume-unchanged "$migration17"
              rm -f "$migration17"
              echo 'Migration #17 isolated only from exact three-workflow Sprint43 preservation.'
            fi
          elif [[ "$actual_count" -eq 14 && "$actual_fingerprint" == 'ed29b6128c193f0efd6359748e220a37aefaec856acc4bc3b90f445ce3ccb674' ]]; then
            migration16='apps/web/database/migrations/0000_00_00_000016_create_pos_sale_completion_foundation.php'
            migration_delta="$(grep '^apps/web/database/migrations/' /tmp/actual-sprint43-source-paths || true)"
            test "$migration_delta" = "$migration16"
            status="$(git diff --name-status "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- "$migration16" | awk 'NR==1 {print $1}')"
            if [[ "$status" == 'A' ]]; then
              echo 'ONEQAY_SPRINT46_JRN006_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
              echo 'Recognized exact Sprint46 JRN-006 durable sale source successor shape.'
            elif [[ "$status" == 'M' ]]; then
              echo 'ONEQAY_SPRINT46_JRN006_COMPATIBILITY_PREDECESSOR=true' >> "$GITHUB_ENV"
              echo 'Recognized exact Sprint46 JRN-006 compatibility predecessor shape.'
            else
              echo "Unexpected JRN-006 migration #16 status: ${status:-none}" >&2
              exit 1
            fi
          elif [[ "$actual_count" -eq 15 && "$actual_fingerprint" == 'c1ac6d5130c9d78ff99ed0accf5d11e3f08debc575c0d5152ef5b24e6f82ce02' ]]; then
            migration17='apps/web/database/migrations/0000_00_00_000017_create_pos_catalog_preparation_journal.php'
            migration_delta="$(grep '^apps/web/database/migrations/' /tmp/actual-sprint43-source-paths || true)"
            test "$migration_delta" = "$migration17"
            echo 'ONEQAY_SPRINT47_JRN004_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint47 JRN-004 durable catalog source successor shape.'
          elif [[ "$actual_count" -eq 15 && "$actual_fingerprint" == '5e19664988cabba0030f9927d26b0702370414be4cd6b424d585925b634ca2b8' ]]; then
            migration18='apps/web/database/migrations/0000_00_00_000018_create_pos_shift_opening_foundation.php'
            migration_delta="$(grep '^apps/web/database/migrations/' /tmp/actual-sprint43-source-paths || true)"
            test "$migration_delta" = "$migration18"
            echo 'ONEQAY_SPRINT48_JRN005_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint48 JRN-005 shift-opening source successor shape.'
          elif [[ "$actual_count" -eq 14 && "$actual_fingerprint" == '78628976e4dbfea29ecab4b40ec6bfbdf697564668ef028a5cb77a3b53466451' ]]; then
            echo 'ONEQAY_SPRINT48_JRN005_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT50_JRN007_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint50 JRN-007 source successor shape.'
          elif [[ "$actual_count" -eq 15 && "$actual_fingerprint" == '325559599c79ba68340eac34569f8e5513aa4957b1ddf2515007b98b2cc1f15f' ]]; then
            echo 'ONEQAY_SPRINT48_JRN005_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT51_JRN008_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint51 JRN-008 source successor shape.'
          elif [[ "$actual_count" -eq 14 && "$actual_fingerprint" == 'ad4f6c62c820bdc59d7c1c8550ffeec0a4a0718ba4388a516418d50468d7e9d5' ]]; then
            echo 'ONEQAY_SPRINT48_JRN005_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT51_JRN008_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT52_JRN007_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint52 JRN-007 full CASH refund source successor shape.'
          elif [[ "$actual_count" -eq 30 && "$actual_fingerprint" == 'cf8adb2328427a8e27e46f0efd9fe88db90f0401eba9cafd513944c7e040035e' ]] || [[ "$actual_count" -eq 28 && "$actual_fingerprint" == '3b97670674b60c636a23e52551b7ade69a3f545d5d0b4a861fa1c06eae5c0656' ]] || [[ "$actual_count" -eq 29 && "$actual_fingerprint" == 'e56a3e2732f5d5b0b40dd3ae50ec25746cf18bc8bd556d25405e85642c789878' ]]; then
            if [[ "$actual_count" -eq 29 && "$actual_fingerprint" == 'e56a3e2732f5d5b0b40dd3ae50ec25746cf18bc8bd556d25405e85642c789878' ]]; then
              echo 'ONEQAY_SPRINT52_COMPATIBILITY_PREDECESSOR=true' >> "$GITHUB_ENV"
            fi
            echo 'ONEQAY_SPRINT48_JRN005_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT50_COMPATIBILITY_PREDECESSOR=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint50 historical compatibility predecessor shape.'
          elif [[ "$actual_count" -eq 2 && "$actual_fingerprint" == '0f7b19c619d32f5b461eec1625cf0779b2b7f0a0ee31292c855d5709a2962669' ]]; then
            echo 'ONEQAY_SPRINT48_JRN005_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT50_COMPATIBILITY_PREDECESSOR=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint50 two-workflow source-compatibility correction shape.'
          elif [[ "$actual_count" -eq 9 && "$actual_fingerprint" == '3402c8ea58722711f2894b8e3219b6e9d5dede4a5a87f61faa265f299a34c5b1' ]]; then
            echo 'ONEQAY_SPRINT48_JRN005_SOURCE_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT50_COMPATIBILITY_PREDECESSOR=true' >> "$GITHUB_ENV"
            echo 'Recognized exact Sprint50 nine-workflow source-compatibility correction shape.'
          else
            echo 'Sprint43 changed-file envelope mismatch.' >&2
            diff -u /tmp/sprint43-source-paths /tmp/actual-sprint43-source-paths >&2 || true
            exit 1
          fi

      - name: Enforce NO_SCHEMA_CHANGE and migrations one through fifteen
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          migration16='apps/web/database/migrations/0000_00_00_000016_create_pos_sale_completion_foundation.php'
          migration17='apps/web/database/migrations/0000_00_00_000017_create_pos_catalog_preparation_journal.php'
          migration18='apps/web/database/migrations/0000_00_00_000018_create_pos_shift_opening_foundation.php'
          migration19='apps/web/database/migrations/0000_00_00_000019_create_pos_sale_void_foundation.php'

          migration20='apps/web/database/migrations/0000_00_00_000020_create_pos_inventory_baseline_foundation.php'
          if [[ "${ONEQAY_SPRINT52_COMPATIBILITY_PREDECESSOR:-false}" == 'true' && -f "$migration20" ]]; then
            git update-index --assume-unchanged "$migration20"
            rm -f "$migration20"
          fi
          migration21='apps/web/database/migrations/0000_00_00_000021_create_pos_sale_cash_refund_foundation.php'
          if [[ "${ONEQAY_SPRINT52_JRN007_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
            test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 1
            printf '%s\n' "$changed" | grep -Fxq "$migration21"
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration21"
            if [[ -f "$migration20" ]]; then git update-index --assume-unchanged "$migration20"; rm -f "$migration20"; fi
            for historical_migration in "$migration19" "$migration20" "$migration21"; do
              if [[ -f "$historical_migration" ]]; then
                git update-index --assume-unchanged "$historical_migration"
                rm -f "$historical_migration"
              fi
            done
          elif [[ "${ONEQAY_SPRINT51_JRN008_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
            test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 1
            printf '%s\n' "$changed" | grep -Fxq "$migration20"
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration20"
            for historical_migration in "$migration19" "$migration20"; do
              if [[ -f "$historical_migration" ]]; then
                git update-index --assume-unchanged "$historical_migration"
                rm -f "$historical_migration"
              fi
            done
          elif [[ "${ONEQAY_SPRINT50_JRN007_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
            test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 1
            printf '%s\n' "$changed" | grep -Fxq "$migration19"
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration19"
            git update-index --assume-unchanged "$migration19"
            rm -f "$migration19"
          elif [[ "${ONEQAY_SPRINT50_COMPATIBILITY_PREDECESSOR:-false}" == 'true' ]]; then
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations
            if [[ -f "$migration19" ]]; then
              git update-index --assume-unchanged "$migration19"
              rm -f "$migration19"
            fi
          elif [[ "${ONEQAY_SPRINT48_JRN005_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
            test "$changed" = "$migration18"
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration18"
          elif [[ "${ONEQAY_SPRINT47_JRN004_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
            test "$changed" = "$migration17"
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration17"
          elif [[ "${ONEQAY_SPRINT46_JRN006_COMPATIBILITY_PREDECESSOR:-false}" == 'true' ]]; then
            changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
            test "$changed" = "$migration16"
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration16"
          elif [[ "${ONEQAY_SPRINT46_JRN006_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
            test "$changed" = "$migration16"
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration16"
          else
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations
          fi

          mapfile -t migrations < <(find apps/web/database/migrations -maxdepth 1 -type f -name '*.php' -printf '%f\n' | sort)
          if [[ "${ONEQAY_SPRINT48_JRN005_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            test "${#migrations[@]}" -eq 18
            test -f "$migration16"
            test -f "$migration17"
            test -f "$migration18"
          elif [[ "${ONEQAY_SPRINT47_JRN004_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            test "${#migrations[@]}" -eq 17
            test -f "$migration16"
            test -f "$migration17"
          elif [[ "${ONEQAY_SPRINT46_JRN006_COMPATIBILITY_PREDECESSOR:-false}" == 'true' ]]; then
            test "${#migrations[@]}" -eq 17
            test -f "$migration16"
            test -f "$migration17"
          elif [[ "${ONEQAY_SPRINT46_JRN006_SOURCE_SUCCESSOR:-false}" == 'true' || "${ONEQAY_SPRINT46_JRN006_PRESERVATION:-false}" == 'true' ]]; then
            test "${#migrations[@]}" -eq 16
            test -f "$migration16"
            ! test -e "$migration17"
          else
            test "${#migrations[@]}" -eq 15
            ! test -e "$migration16"
            ! test -e "$migration17"
          fi
          for index in $(seq 1 15); do
            prefix="$(printf '0000_00_00_%06d_' "$index")"
            test "$(printf '%s\n' "${migrations[@]}" | grep -c "^${prefix}")" -eq 1
          done
          test "$(printf '%s\n' "${migrations[@]}" | grep -c '^0000_00_00_000014_add_first_party_authentication_eligibility_to_identities\.php$')" -eq 1
          test "$(printf '%s\n' "${migrations[@]}" | grep -c '^0000_00_00_000015_create_identity_authentication_eligibility_administration_journal\.php$')" -eq 1

      - name: Isolate post-Sprint43 migrations from historical Sprint43 execution
        if: env.ONEQAY_SPRINT46_JRN006_SOURCE_SUCCESSOR == 'true' || env.ONEQAY_SPRINT46_JRN006_COMPATIBILITY_PREDECESSOR == 'true' || env.ONEQAY_SPRINT46_JRN006_PRESERVATION == 'true' || env.ONEQAY_SPRINT47_JRN004_SOURCE_SUCCESSOR == 'true' || env.ONEQAY_SPRINT48_JRN005_SOURCE_SUCCESSOR == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for migration in \
            'apps/web/database/migrations/0000_00_00_000016_create_pos_sale_completion_foundation.php' \
            'apps/web/database/migrations/0000_00_00_000017_create_pos_catalog_preparation_journal.php' \
            'apps/web/database/migrations/0000_00_00_000018_create_pos_shift_opening_foundation.php'
          do
            if [[ -f "$migration" ]]; then
              git update-index --assume-unchanged "$migration"
              rm -f "$migration"
            fi
          done

      - name: Preserve excluded authority and dependency surfaces
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [[ "${ONEQAY_SPRINT46_JRN006_SOURCE_SUCCESSOR:-false}" == 'true' || "${ONEQAY_SPRINT46_JRN006_COMPATIBILITY_PREDECESSOR:-false}" == 'true' || "${ONEQAY_SPRINT47_JRN004_SOURCE_SUCCESSOR:-false}" == 'true' || "${ONEQAY_SPRINT48_JRN005_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            git diff --exit-code "$base" "$head" -- \
              apps/web/app/Application/Identity/FirstPartyIdentityDisablementSessionTerminationRepository.php \
              apps/web/app/Infrastructure/Identity/LaravelFirstPartyIdentityDisablementSessionTerminationRepository.php \
              apps/web/app/Application/Identity/FirstPartySessionAuthorityRepository.php \
              apps/web/app/Infrastructure/Identity/LaravelFirstPartySessionAuthorityRepository.php \
              apps/web/app/Delivery/Http/Identity/FirstPartySessionControlController.php \
              apps/web/app/Delivery/Http/Middleware/EnforceActiveFirstPartySessionAuthorityMiddleware.php \
              apps/web/config/database.php \
              apps/web/bootstrap/app.php \
              apps/web/composer.json \
              apps/web/composer.lock \
              apps/web/package.json \
              apps/web/package-lock.json
          else
            git diff --exit-code "$base" "$head" -- \
              apps/web/app/Providers/AppServiceProvider.php \
              apps/web/app/Application/Identity/FirstPartyIdentityDisablementSessionTerminationRepository.php \
              apps/web/app/Infrastructure/Identity/LaravelFirstPartyIdentityDisablementSessionTerminationRepository.php \
              apps/web/app/Application/Identity/FirstPartySessionAuthorityRepository.php \
              apps/web/app/Infrastructure/Identity/LaravelFirstPartySessionAuthorityRepository.php \
              apps/web/app/Delivery/Http/Identity/FirstPartySessionControlController.php \
              apps/web/app/Delivery/Http/Middleware/EnforceActiveFirstPartySessionAuthorityMiddleware.php \
              apps/web/config/oneqay.php \
              apps/web/config/database.php \
              apps/web/bootstrap/app.php \
              apps/web/composer.json \
              apps/web/composer.lock \
              apps/web/package.json \
              apps/web/package-lock.json
          fi

      - name: Validate dedicated reactivation contracts
        shell: bash
        run: |
          set -euo pipefail
          contract='apps/web/app/Application/Identity/FirstPartyIdentityEligibilityAdministrationRepository.php'
          service='apps/web/app/Application/Identity/FirstPartyIdentityEligibilityAdministrationService.php'
          controller='apps/web/app/Delivery/Http/Identity/FirstPartyIdentityEligibilityAdministrationController.php'
          adapter='apps/web/app/Infrastructure/Identity/LaravelFirstPartyIdentityEligibilityAdministrationRepository.php'
          routes='apps/web/routes/web.php'

          grep -Fq "public const OPERATION_DISABLE = 'disable';" "$contract"
          grep -Fq "public const OPERATION_REACTIVATE = 'reactivate';" "$contract"
          grep -Fq 'public function replayReactivationOutcome(' "$contract"
          grep -Fq 'public function applyFreshReactivation(' "$contract"

          test "$(grep -Fc 'public function disable(' "$service")" -eq 1
          test "$(grep -Fc 'public function reactivate(' "$service")" -eq 1
          test "$(grep -Fc '$this->sessionTermination->revokeActiveForIdentityDisablement(' "$service")" -eq 2

          test "$(grep -Fc 'count($payload) !== 1' "$controller")" -eq 2
          test "$(grep -Fc "array_key_exists('mutation_id', \$payload)" "$controller")" -eq 2
          ! grep -Fq "array_key_exists('operation', \$payload)" "$controller"
          ! grep -Fq "array_key_exists('tenant_id', \$payload)" "$controller"
          ! grep -Fq "array_key_exists('enabled', \$payload)" "$controller"

          grep -Fq "private const JOURNAL_TABLE = 'oneqay_identity_authentication_eligibility_mutations';" "$adapter"
          grep -Fq -- "->where('first_party_authentication_enabled', 0)" "$adapter"
          test "$(grep -Fc -- "->update(['first_party_authentication_enabled' => true])" "$adapter")" -eq 1
          test "$(grep -Fc -- "->update(['first_party_authentication_enabled' => false])" "$adapter")" -eq 1
          grep -Fq 'self::OPERATION_REACTIVATE' "$adapter"
          grep -Fq 'AdministrationPermission::MANAGE' "$adapter"
          grep -Fq "['local', 'test', 'ci']" "$adapter"
          ! grep -Fq 'oneqay_identity_first_party_sessions' "$adapter"
          ! grep -Fq 'revoked_at_unix' "$adapter"

          test "$(grep -Fc "Route::post('/administration/identities/{identity_id}/authentication-disablement'" "$routes")" -eq 1
          test "$(grep -Fc "Route::post('/administration/identities/{identity_id}/authentication-reactivation'" "$routes")" -eq 1
          grep -Fq -- "->name('identity.authentication-eligibility.disable')" "$routes"
          grep -Fq -- "->name('identity.authentication-eligibility.reactivate')" "$routes"
          test "$(grep -Fc "'session.active', 'throttle:5,1', 'throttle:20,60', RequirePolicyAdministrationSessionContextMiddleware::class" "$routes")" -ge 2

          ! grep -RInE 'authentication-(enablement|toggle)|authentication_eligibility_(enable|toggle)|identity\.authentication-eligibility\.(enable|toggle)' \
            apps/web/app/Application/Identity/FirstPartyIdentityEligibilityAdministration*.php \
