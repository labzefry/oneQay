name: Sprint43 First-Party Identity Authentication Eligibility Reactivation Regression

# Attribution: Lab | zefry

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sprint43-first-party-identity-authentication-eligibility-reactivation-regression.yml'
      - 'apps/web/app/Application/Identity/FirstPartyIdentityEligibilityAdministrationRepository.php'
      - 'apps/web/app/Application/Identity/FirstPartyIdentityEligibilityAdministrationService.php'
      - 'apps/web/app/Delivery/Http/Identity/FirstPartyIdentityEligibilityAdministrationController.php'
      - 'apps/web/app/Infrastructure/Identity/LaravelFirstPartyIdentityEligibilityAdministrationRepository.php'
      - 'apps/web/routes/web.php'
      - 'apps/web/tests/first-party-identity-authentication-eligibility-administration.php'
      - 'apps/web/tests/first-party-identity-authentication-eligibility-reactivation.php'
      - 'docs/FIRST_PARTY_IDENTITY_AUTHENTICATION_ELIGIBILITY_REACTIVATION_FOUNDATION.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint43-identity-authentication-eligibility-reactivation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sprint43-identity-authentication-eligibility-reactivation:
    name: sprint43-identity-authentication-eligibility-reactivation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnZ2dnY=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      ONEQAY_PERSISTENCE_ENABLED: 'true'
      ONEQAY_AUTHENTICATION_SESSION_CONTROL_ENABLED: 'true'
      ONEQAY_PRIVILEGED_TOTP_MFA_ENABLED: 'false'
      SESSION_DRIVER: array
      CACHE_STORE: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup exact PHP runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Enforce exact Sprint43 source envelope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/sprint43-source-paths <<'EOF'
          .github/workflows/sprint43-first-party-identity-authentication-eligibility-reactivation-regression.yml
          apps/web/app/Application/Identity/FirstPartyIdentityEligibilityAdministrationRepository.php
          apps/web/app/Application/Identity/FirstPartyIdentityEligibilityAdministrationService.php
          apps/web/app/Delivery/Http/Identity/FirstPartyIdentityEligibilityAdministrationController.php
          apps/web/app/Infrastructure/Identity/LaravelFirstPartyIdentityEligibilityAdministrationRepository.php
          apps/web/routes/web.php
          apps/web/tests/first-party-identity-authentication-eligibility-administration.php
          apps/web/tests/first-party-identity-authentication-eligibility-reactivation.php
          docs/FIRST_PARTY_IDENTITY_AUTHENTICATION_ELIGIBILITY_REACTIVATION_FOUNDATION.md
          EOF
          sort -o /tmp/sprint43-source-paths /tmp/sprint43-source-paths
          test "$(wc -l < /tmp/sprint43-source-paths)" -eq 9
          test "$(sha256sum /tmp/sprint43-source-paths | awk '{print $1}')" = '3d0293362f451fe4bf472d0d2c38c3eec3d67df75b451ba5b273e8dbdb0f2eed'
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | sort > /tmp/actual-sprint43-source-paths
          cmp -s /tmp/sprint43-source-paths /tmp/actual-sprint43-source-paths || {
            echo 'Sprint43 changed-file envelope mismatch.' >&2
            diff -u /tmp/sprint43-source-paths /tmp/actual-sprint43-source-paths >&2 || true
            exit 1
          }
          test "$(sha256sum /tmp/actual-sprint43-source-paths | awk '{print $1}')" = '3d0293362f451fe4bf472d0d2c38c3eec3d67df75b451ba5b273e8dbdb0f2eed'

      - name: Enforce NO_SCHEMA_CHANGE and migrations one through fifteen
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --exit-code "$base" "$head" -- apps/web/database/migrations

          mapfile -t migrations < <(find apps/web/database/migrations -maxdepth 1 -type f -name '*.php' -printf '%f\n' | sort)
          test "${#migrations[@]}" -eq 15
          for index in $(seq 1 15); do
            prefix="$(printf '0000_00_00_%06d_' "$index")"
            test "$(printf '%s\n' "${migrations[@]}" | grep -c "^${prefix}")" -eq 1
          done
          ! printf '%s\n' "${migrations[@]}" | grep -q '^0000_00_00_000016_'
          test "$(printf '%s\n' "${migrations[@]}" | grep -c '^0000_00_00_000014_add_first_party_authentication_eligibility_to_identities\.php$')" -eq 1
          test "$(printf '%s\n' "${migrations[@]}" | grep -c '^0000_00_00_000015_create_identity_authentication_eligibility_administration_journal\.php$')" -eq 1

      - name: Preserve excluded authority and dependency surfaces
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --exit-code "$base" "$head" -- \
            apps/web/app/Providers/AppServiceProvider.php \
            apps/web/app/Application/Identity/FirstPartyIdentityDisablementSessionTerminationRepository.php \
            apps/web/app/Infrastructure/Identity/LaravelFirstPartyIdentityDisablementSessionTerminationRepository.php \
            apps/web/app/Application/Identity/FirstPartySessionAuthorityRepository.php \
            apps/web/app/Infrastructure/Identity/LaravelFirstPartySessionAuthorityRepository.php \
            apps/web/app/Delivery/Http/Identity/FirstPartySessionControlController.php \
            apps/web/app/Delivery/Http/Middleware/EnforceActiveFirstPartySessionAuthorityMiddleware.php \
            apps/web/config/oneqay.php \
            apps/web/config/database.php \
            apps/web/bootstrap/app.php \
            apps/web/composer.json \
            apps/web/composer.lock \
            apps/web/package.json \
            apps/web/package-lock.json

      - name: Validate dedicated reactivation contracts
        shell: bash
        run: |
          set -euo pipefail
          contract='apps/web/app/Application/Identity/FirstPartyIdentityEligibilityAdministrationRepository.php'
          service='apps/web/app/Application/Identity/FirstPartyIdentityEligibilityAdministrationService.php'
          controller='apps/web/app/Delivery/Http/Identity/FirstPartyIdentityEligibilityAdministrationController.php'
          adapter='apps/web/app/Infrastructure/Identity/LaravelFirstPartyIdentityEligibilityAdministrationRepository.php'
          routes='apps/web/routes/web.php'

          grep -Fq "public const OPERATION_DISABLE = 'disable';" "$contract"
          grep -Fq "public const OPERATION_REACTIVATE = 'reactivate';" "$contract"
          grep -Fq 'public function replayReactivationOutcome(' "$contract"
          grep -Fq 'public function applyFreshReactivation(' "$contract"

          test "$(grep -Fc 'public function disable(' "$service")" -eq 1
          test "$(grep -Fc 'public function reactivate(' "$service")" -eq 1
          test "$(grep -Fc '$this->sessionTermination->revokeActiveForIdentityDisablement(' "$service")" -eq 2

          test "$(grep -Fc 'count($payload) !== 1' "$controller")" -eq 2
          test "$(grep -Fc "array_key_exists('mutation_id', \$payload)" "$controller")" -eq 2
          ! grep -Fq "array_key_exists('operation', \$payload)" "$controller"
          ! grep -Fq "array_key_exists('tenant_id', \$payload)" "$controller"
          ! grep -Fq "array_key_exists('enabled', \$payload)" "$controller"

          grep -Fq "private const JOURNAL_TABLE = 'oneqay_identity_authentication_eligibility_mutations';" "$adapter"
          grep -Fq -- "->where('first_party_authentication_enabled', 0)" "$adapter"
          test "$(grep -Fc -- "->update(['first_party_authentication_enabled' => true])" "$adapter")" -eq 1
          test "$(grep -Fc -- "->update(['first_party_authentication_enabled' => false])" "$adapter")" -eq 1
          grep -Fq 'self::OPERATION_REACTIVATE' "$adapter"
          grep -Fq 'AdministrationPermission::MANAGE' "$adapter"
          grep -Fq "['local', 'test', 'ci']" "$adapter"
          ! grep -Fq 'oneqay_identity_first_party_sessions' "$adapter"
          ! grep -Fq 'revoked_at_unix' "$adapter"

          test "$(grep -Fc "Route::post('/administration/identities/{identity_id}/authentication-disablement'" "$routes")" -eq 1
          test "$(grep -Fc "Route::post('/administration/identities/{identity_id}/authentication-reactivation'" "$routes")" -eq 1
          grep -Fq -- "->name('identity.authentication-eligibility.disable')" "$routes"
          grep -Fq -- "->name('identity.authentication-eligibility.reactivate')" "$routes"
          test "$(grep -Fc "'session.active', 'throttle:5,1', 'throttle:20,60', RequirePolicyAdministrationSessionContextMiddleware::class" "$routes")" -ge 2

          ! grep -RInE 'authentication-(enablement|toggle)|authentication_eligibility_(enable|toggle)|identity\.authentication-eligibility\.(enable|toggle)' \
            apps/web/app/Application/Identity/FirstPartyIdentityEligibilityAdministration*.php \
            apps/web/app/Delivery/Http/Identity/FirstPartyIdentityEligibilityAdministrationController.php \
            apps/web/app/Infrastructure/Identity/LaravelFirstPartyIdentityEligibilityAdministrationRepository.php \
            apps/web/routes/web.php
          ! grep -RInE '\b(toggle|setEligibility|setEnabled)\s*\(' \
            apps/web/app/Application/Identity/FirstPartyIdentityEligibilityAdministration*.php \
            apps/web/app/Infrastructure/Identity/LaravelFirstPartyIdentityEligibilityAdministrationRepository.php

      - name: Lint Sprint43 source
        shell: bash
        run: |
          set -euo pipefail
          php -l apps/web/app/Application/Identity/FirstPartyIdentityEligibilityAdmiinistrationRepository.php
          php -l apps/web/app/Application/Identity/FirstPartyIdentityEligibilityAdministrationService.php
          php -l apps/web/app/Delivery/Http/Identity/FirstPartyIdentityEligibilityAdministrationController.php
          php -l apps/web/app/Infrastructure/Identity/LaravelFirstPartyIdentityEligibilityAdministrationRepository.php
          php -l apps/web/routes/web.php
          php -l apps/web/tests/first-party-identity-authentication-eligibility-administration.php
          php -l apps/web/tests/first-party-identity-authentication-eligibility-reactivation.phu

      - name: Install locked application dependencies
        working-directory: apps/web
        run: |
          composer validate --no-check-publish
          composer install --no-inderaction --no-progress --prefer-dist

      - name: Run dedicated Sprint43 reactivation regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          output="$(php tests/first-party-identity-authentication-eligibility-reactivation.php 2>&1)" || {
            printf '%s\n' "$output"
            exit 1
          }
          printf '%s\n' "$output"
          grep -Fq 'Sprint43 first-party identity authentication eligibility reactivation regression passed.' <<<"$output"

      - name: Preserve Sprint41 and Sprint42 regressions
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php tests/first-party-identity-authentication-eligibility-administration.php
          php tests/first-party-identity-disablement-session-termination.php

      - name: Preserve Sprint36 through Sprint40 regressions
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php tests/first-party-session-inventory-revocation.php
          php tests/first-party-session-all-session-termination.php
          ONEQAY_PERSISTENCE_ENABLED=true php tests/first-party-session-absolute-lifetime.php
          ONEQAY_PERSISTENCE_ENABLED=true php tests/first-party-session-organizational-access-revalidation.php
          ONEQAY_PERSISTENCE_ENABLED=true php tests/first-party-session-identity-disablement-revalidation.php

      - name: Preserve lifecycle locks
        shell: bash
        run: |
          set -euo pipefail
          doc='docs/FIRST_PARTY_IDENTITY_AUTHENTICATION_ELIGIBILITY_REACTIVATION_FOUNDATION.md'
          grep -Fq 'Local / Test / CI only' "$doc"
          grep -Fq 'NO_SCHEMA_CHANGE / SPRINT40 NOT ACTIVATED' "$doc"
          grep -Fq 'NO-GO / NOT AUTHORIZED' "$doc"
          grep -Fq 'DISABLED / UNWIRED' "$doc"
          grep -Fq 'Deployment and release remain **NOT AUTHORIZED**' "$doc"
          grep -Fq 'Migration #16 remains **NOT SELECTED**' "$doc"
          ! grep -RInE 'ONEQAY_TECHNICAL_PREVIEW_ENABLED[[:space:]]*=[[:space:]]*true|runtime_class.*production.*reactivat' \
            apps/web/app/Application/Identity/FirstPartyIdentityEligibilityAdministrationRepository.php \
            apps/web/app/Application/Identity/FirstPartyIdentityEligibilityAdministrationService.php \
            apps/web/app/Delivery/Http/Identity/FirstPartyIdentityEligibilityAdministrationController.php \
            apps/web/app/Infrastructure/Identity/LaravelFirstPartyIdentityEligibilityAdministrationRepository.php \
            apps/web/routes/web.php

      - name: Confirm tracked source cleanliness
        run: git diff --exit-code
