name: Sprint 28 Initial Password Enrollment Regression

# Attribution: Lab | zefry

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/app/Application/Identity/InitialPasswordEnrollmentId.php'
      - 'apps/web/app/Application/Identity/IssuedInitialPasswordEnrollment.php'
      - 'apps/web/app/Application/Identity/InitialPasswordEnrollmentRepository.php'
      - 'apps/web/app/Application/Identity/InitialPasswordEnrollmentService.php'
      - 'apps/web/app/Application/Identity/InitialPasswordEnrollmentViolation.php'
      - 'apps/web/app/Infrastructure/Identity/LaravelInitialPasswordEnrollmentRepository.php'
      - 'apps/web/app/Providers/AppServiceProvider.php'
      - 'apps/web/app/Delivery/Http/Identity/InitialPasswordEnrollmentController.php'
      - 'apps/web/routes/web.php'
      - 'apps/web/database/migrations/0000_00_00_000008_create_initial_password_enrollments.php'
      - 'apps/web/tests/initial-password-enrollment.php'
      - '.github/workflows/sprint28-initial-password-enrollment-regression.yml'
      - 'docs/FIRST_PARTY_INITIAL_PASSWORD_ENROLLMENT_FOUNDATION.md'
      - 'apps/web/tests/authorization-persistence.php'
      - 'apps/web/tests/authorization-administration-persistence.php'
      - 'apps/web/tests/initial-tenant-administrator-provisioning.php'
      - 'apps/web/tests/protected-control-administrator-lifecycle.php'
      - 'apps/web/tests/tenant-isolation.php'
      - 'apps/web/tests/identity-org-context.php'
      - 'apps/web/tests/policy-administration-delivery.php'
      - 'apps/web/tests/identity-credential-verification.php'
      - 'apps/web/tests/first-party-session-establishment.php'
      - '.github/workflows/m7-2-tenant-isolation-regression.yml'
      - '.github/workflows/m7-3-identity-org-context-regression.yml'
      - '.github/workflows/m7-4a-technical-preview-interaction-regression.yml'
      - '.github/workflows/m7-5-preview-db-qualification-regression.yml'
      - '.github/workflows/sprint21-role-permission-policy-regression.yml'
      - '.github/workflows/sprint22-policy-administration-regression.yml'
      - '.github/workflows/sprint23-initial-tenant-admin-provisioning-regression.yml'
      - '.github/workflows/sprint24-protected-control-admin-lifecycle-regression.yml'
      - '.github/workflows/sprint25-policy-administration-delivery-regression.yml'
      - '.github/workflows/sprint26-identity-credential-verification-regression.yml'
      - '.github/workflows/sprint27-first-party-session-establishment-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint28-initial-password-enrollment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sprint28-initial-password-enrollment-regression:
    name: sprint28-initial-password-enrollment-regression
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      ONEQAY_PERSISTENCE_ENABLED: 'false'
      SESSION_DRIVER: array
      CACHE_STORE: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce exact Sprint 28 source envelope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/sprint28-files.txt
          test -s /tmp/sprint28-files.txt
          while IFS= read -r file; do
            case "$file" in
              apps/web/app/Application/Identity/InitialPasswordEnrollmentId.php|\
              apps/web/app/Application/Identity/IssuedInitialPasswordEnrollment.php|\
              apps/web/app/Application/Identity/InitialPasswordEnrollmentRepository.php|\
              apps/web/app/Application/Identity/InitialPasswordEnrollmentService.php|\
              apps/web/app/Application/Identity/InitialPasswordEnrollmentViolation.php|\
              apps/web/app/Infrastructure/Identity/LaravelInitialPasswordEnrollmentRepository.php|\
              apps/web/app/Providers/AppServiceProvider.php|\
              apps/web/app/Delivery/Http/Identity/InitialPasswordEnrollmentController.php|\
              apps/web/routes/web.php|\
              apps/web/database/migrations/0000_00_00_000008_create_initial_password_enrollments.php|\
              apps/web/tests/initial-password-enrollment.php|\
              .github/workflows/sprint28-initial-password-enrollment-regression.yml|\
              docs/FIRST_PARTY_INITIAL_PASSWORD_ENROLLMENT_FOUNDATION.md|\
              apps/web/tests/authorization-persistence.php|\
              apps/web/tests/authorization-administration-persistence.php|\
              apps/web/tests/initial-tenant-administrator-provisioning.php|\
              apps/web/tests/protected-control-administrator-lifecycle.php|\
              apps/web/tests/tenant-isolation.php|\
              apps/web/tests/identity-org-context.php|\
              apps/web/tests/policy-administration-delivery.php|\
              apps/web/tests/identity-credential-verification.php|\
              apps/web/tests/first-party-session-establishment.php|\
              .github/workflows/m7-2-tenant-isolation-regression.yml|\
              .github/workflows/m7-3-identity-org-context-regression.yml|\
              .github/workflows/m7-4a-technical-preview-interaction-regression.yml|\
              .github/workflows/m7-5-preview-db-qualification-regression.yml|\
              .github/workflows/sprint21-role-permission-policy-regression.yml|\
              .github/workflows/sprint22-policy-administration-regression.yml|\
              .github/workflows/sprint23-initial-tenant-admin-provisioning-regression.yml|\
              .github/workflows/sprint24-protected-control-admin-lifecycle-regression.yml|\
              .github/workflows/sprint25-policy-administration-delivery-regression.yml|\
              .github/workflows/sprint26-identity-credential-verification-regression.yml|\
              .github/workflows/sprint27-first-party-session-establishment-regression.yml)
                ;;
              *) echo "Unauthorized Sprint 28 changed path: $file" >&2; exit 1 ;;
            esac
          done < /tmp/sprint28-files.txt
          test "$(wc -l < /tmp/sprint28-files.txt)" -eq 33
          if grep -Eq '(^|/)(composer\.(json|lock)|package(-lock)?\.json)$' /tmp/sprint28-files.txt; then
            echo 'Sprint 28 authorizes zero dependency changes.' >&2
            exit 1
          fi

      - name: Enforce migration one through seven immutability and migration eight only
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          immutable=(
            apps/web/database/migrations/0000_00_00_000001_create_foundational_context_graph.php
            apps/web/database/migrations/0000_00_00_000002_create_organizational_access_grants.php
            apps/web/database/migrations/0000_00_00_000003_create_scoped_role_permission_policy.php
            apps/web/database/migrations/0000_00_00_000004_create_policy_mutation_journal.php
            apps/web/database/migrations/0000_00_00_000005_create_initial_tenant_administrator_provisioning_journal.php
            apps/web/database/migrations/0000_00_00_000006_create_protected_control_administrator_mutation_journal.php
            apps/web/database/migrations/0000_00_00_000007_create_identity_password_credentials.php
          )
          git diff --exit-code "$base...HEAD" -- "${immutable[@]}"
          mapfile -t migration_diff < <(git diff --name-status "$base...HEAD" -- apps/web/database/migrations)
          test "${#migration_diff[@]}" -eq 1
          test "${migration_diff[0]}" = $'A\tapps/web/database/migrations/0000_00_00_000008_create_initial_password_enrollments.php'

      - name: Preserve root Platform Foundation regression
        run: |
          composer validate --strict --no-check-publish
          composer test

      - name: Install locked application dependencies
        working-directory: apps/web
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist

      - name: Lint Sprint 28 enrollment identifier
        run: php -l apps/web/app/Application/Identity/InitialPasswordEnrollmentId.php

      - name: Lint Sprint 28 issued enrollment result
        run: php -l apps/web/app/Application/Identity/IssuedInitialPasswordEnrollment.php

      - name: Lint Sprint 28 repository contract
        run: php -l apps/web/app/Application/Identity/InitialPasswordEnrollmentRepository.php

      - name: Lint Sprint 28 enrollment service
        run: php -l apps/web/app/Application/Identity/InitialPasswordEnrollmentService.php

      - name: Lint Sprint 28 enrollment violation
        run: php -l apps/web/app/Application/Identity/InitialPasswordEnrollmentViolation.php

      - name: Lint Sprint 28 infrastructure repository
        run: php -l apps/web/app/Infrastructure/Identity/LaravelInitialPasswordEnrollmentRepository.php

      - name: Lint Sprint 28 provider composition
        run: php -l apps/web/app/Providers/AppServiceProvider.php

      - name: Lint Sprint 28 HTTP controller
        run: php -l apps/web/app/Delivery/Http/Identity/InitialPasswordEnrollmentController.php

      - name: Lint Sprint 28 routes
        run: php -l apps/web/routes/web.php

      - name: Lint Sprint 28 migration eight
        run: php -l apps/web/database/migrations/0000_00_00_000008_create_initial_password_enrollments.php

      - name: Lint Sprint 28 disposable regression
        run: php -l apps/web/tests/initial-password-enrollment.php

      - name: Lint Sprint 21 preservation test
        run: php -l apps/web/tests/authorization-persistence.php

      - name: Lint Sprint 22 preservation test
        run: php -l apps/web/tests/authorization-administration-persistence.php

      - name: Lint Sprint 23 preservation test
        run: php -l apps/web/tests/initial-tenant-administrator-provisioning.php

      - name: Lint Sprint 24 preservation test
        run: php -l apps/web/tests/protected-control-administrator-lifecycle.php

      - name: Lint M7.2 preservation test
        run: php -l apps/web/tests/tenant-isolation.php

      - name: Lint M7.3 preservation test
        run: php -l apps/web/tests/identity-org-context.php

      - name: Lint Sprint 25 preservation test
        run: php -l apps/web/tests/policy-administration-delivery.php

      - name: Lint Sprint 26 preservation test
        run: php -l apps/web/tests/identity-credential-verification.php

      - name: Lint Sprint 27 preservation test
        run: php -l apps/web/tests/first-party-session-establishment.php

      - name: Validate PHP syntax and exact eight-migration set
        shell: bash
        run: |
          set -euo pipefail
          find apps/web/app apps/web/bootstrap apps/web/config apps/web/database apps/web/public apps/web/routes apps/web/tests -type f -name '*.php' -print0 |
            while IFS= read -r -d '' file; do php -l "$file"; done
          mapfile -t migrations < <(find apps/web/database/migrations -maxdepth 1 -type f -name '*.php' -printf '%f\n' | sort)
          expected=(
            '0000_00_00_000001_create_foundational_context_graph.php'
            '0000_00_00_000002_create_organizational_access_grants.php'
            '0000_00_00_000003_create_scoped_role_permission_policy.php'
            '0000_00_00_000004_create_policy_mutation_journal.php'
            '0000_00_00_000005_create_initial_tenant_administrator_provisioning_journal.php'
            '0000_00_00_000006_create_protected_control_administrator_mutation_journal.php'
            '0000_00_00_000007_create_identity_password_credentials.php'
            '0000_00_00_000008_create_initial_password_enrollments.php'
          )
          test "${migrations[*]}" = "${expected[*]}"

      - name: Enforce Application enrollment boundary
        shell: bash
        run: |
          set -euo pipefail
          files=(
            apps/web/app/Application/Identity/InitialPasswordEnrollmentId.php
            apps/web/app/Application/Identity/IssuedInitialPasswordEnrollment.php
            apps/web/app/Application/Identity/InitialPasswordEnrollmentRepository.php
            apps/web/app/Application/Identity/InitialPasswordEnrollmentService.php
            apps/web/app/Application/Identity/InitialPasswordEnrollmentViolation.php
          )
          if grep -n -E 'Illuminate\\|Schema::|DB::|new PDO|mysqli_|ConnectionInterface|->table\(' "${files[@]}"; then
            echo 'Sprint 28 Application enrollment source gained framework/database mechanics.' >&2
            exit 1
          fi
          grep -Fq 'TOKEN_TTL_SECONDS = 900' apps/web/app/Application/Identity/InitialPasswordEnrollmentService.php
          grep -Fq 'MIN_PASSWORD_BYTES = 12' apps/web/app/Application/Identity/InitialPasswordEnrollmentService.php
          grep -Fq 'MAX_PASSWORD_BYTES = 4096' apps/web/app/Application/Identity/InitialPasswordEnrollmentService.php
          grep -Fq '#[\SensitiveParameter]' apps/web/app/Application/Identity/InitialPasswordEnrollmentRepository.php
          grep -Fq '#[\SensitiveParameter]' apps/web/app/Application/Identity/InitialPasswordEnrollmentService.php

      - name: Enforce migration eight secret-minimal schema
        shell: bash
        run: |
          set -euo pipefail
          migration='apps/web/database/migrations/0000_00_00_000008_create_initial_password_enrollments.php'
          grep -Fq "Schema::create('oneqay_initial_password_enrollments'" "$migration"
          grep -Fq "string('tenant_id', 64)" "$migration"
          grep -Fq "string('enrollment_id', 64)" "$migration"
          grep -Fq "string('actor_identity_id', 96)" "$migration"
          grep -Fq "string('target_identity_id', 96)" "$migration"
          grep -Fq "char('token_digest', 64)" "$migration"
          grep -Fq "unique(" "$migration"
          grep -Fq "uq_initial_password_enrollment_active_target" "$migration"
          grep -Fq 'fk_initial_password_enrollment_actor' "$migration"
          grep -Fq 'fk_initial_password_enrollment_target' "$migration"
          grep -Fq 'Forward-only generated migration; rollback is not authorized.' "$migration"
          if grep -Ei 'plaintext|password_hash|password[^_a-z]|session|csrf|email|phone|metadata' "$migration"; then
            echo 'Migration eight contains forbidden secret/profile fields.' >&2
            exit 1
          fi

      - name: Enforce secure token and insert-only credential repository
        shell: bash
        run: |
          set -euo pipefail
          repo='apps/web/app/Infrastructure/Identity/LaravelInitialPasswordEnrollmentRepository.php'
          grep -Fq 'random_bytes(32)' "$repo"
          grep -Fq "hash('sha256', \$token)" "$repo"
          grep -Fq "hash('sha256', \$enrollmentToken)" "$repo"
          grep -Fq 'hash_equals(' "$repo"
          grep -Fq 'password_hash($password, PASSWORD_DEFAULT)' "$repo"
          grep -Fq "['local', 'test', 'ci']" "$repo"
          grep -Fq 'AdministrationPermission::MANAGE' "$repo"
          grep -Fq "where('a.tenant_id', \$tenantId)" "$repo"
          grep -Fq "where('a.identity_id', \$identityId)" "$repo"
          test "$(grep -Fc 'table(self::CREDENTIAL_TABLE)->insert([' "$repo")" -eq 1
          if grep -Eq 'table\(self::CREDENTIAL_TABLE\).*(update|updateOrInsert|upsert|delete|truncate)' "$repo"; then
            echo 'Sprint 28 credential path gained overwrite/delete mechanics.' >&2
            exit 1
          fi
          if grep -Ei '\b(log|logger|debug|info|warning|error)\s*\(' "$repo"; then
            echo 'Sprint 28 repository gained logging mechanics.' >&2
            exit 1
          fi

      - name: Enforce bounded HTTP routes and delivery privacy
        shell: bash
        run: |
          set -euo pipefail
          routes='apps/web/routes/web.php'
          controller='apps/web/app/Delivery/Http/Identity/InitialPasswordEnrollmentController.php'
          grep -Fq "Route::post('/administration/identity/password-enrollments'" "$routes"
          grep -Fq "Route::post('/auth/password-enrollment'" "$routes"
          grep -Fq "name('identity.initial-password-enrollment.issue')" "$routes"
          grep -Fq "name('auth.initial-password-enrollment.redeem')" "$routes"
          grep -Fq 'RequirePolicyAdministrationSessionContextMiddleware::class' "$routes"
          grep -Fq "['local', 'test', 'ci']" "$routes"
          grep -Fq 'INITIAL_PASSWORD_ENROLLMENT_ISSUE_REJECTED' "$controller"
          grep -Fq 'INITIAL_PASSWORD_ENROLLMENT_FAILED' "$controller"
          grep -Fq "'Cache-Control' => 'no-store, private'" "$controller"
          grep -Fq "'Pragma' => 'no-cache'" "$controller"
          if grep -n -E 'password_(verify|hash)\s*\(|random_bytes\(|Schema::|DB::|new PDO|mysqli_|->table\(' "$controller"; then
            echo 'Sprint 28 controller gained cryptographic/database mechanics.' >&2
            exit 1
          fi
          if grep -Fq 'FirstPartySessionKeys::' "$controller" || grep -Fq -- '->session()->put' "$controller"; then
            echo 'Sprint 28 enrollment delivery gained automatic login/session establishment.' >&2
            exit 1
          fi
          if grep -Ei '\b(log|logger|debug|info|warning|error)\s*\(' "$controller"; then
            echo 'Sprint 28 controller gained logging mechanics.' >&2
            exit 1
          fi

      - name: Prove runtime-scoped Sprint 28 route registration
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          ci_routes="$(ONEQAY_RUNTIME_CLASS=ci php artisan route:list 2>&1)"
          grep -Fq 'identity.initial-password-enrollment.issue' <<<"$ci_routes"
          grep -Fq 'auth.initial-password-enrollment.redeem' <<<"$ci_routes"
          preview_routes="$(ONEQAY_RUNTIME_CLASS=preview php artisan route:list 2>&1)"
          if grep -Fq 'identity.initial-password-enrollment.issue' <<<"$preview_routes" || grep -Fq 'auth.initial-password-enrollment.redeem' <<<"$preview_routes"; then
            echo 'Sprint 28 enrollment routes are active in Preview.' >&2
            exit 1
          fi
          production_routes="$(ONEQAY_RUNTIME_CLASS=production php artisan route:list 2>&1)"
          if grep -Fq 'identity.initial-password-enrollment.issue' <<<"$production_routes" || grep -Fq 'auth.initial-password-enrollment.redeem' <<<"$production_routes"; then
            echo 'Sprint 28 enrollment routes are active in Production.' >&2
            exit 1
          fi

      - name: Preserve Technical Preview Production updater and persistence defaults
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'ONEQAY_PERSISTENCE_ENABLED=false' apps/web/environment.example
          grep -Fq '/apps/web/database/migrations/' .github/workflows/m7-5-preview-release-artifact.yml
          grep -Fq 'NO_SCHEMA_CHANGE' .github/workflows/m7-5-preview-release-artifact.yml
          grep -Fq 'php tests/privileged-update-security.php' .github/workflows/sprint22-policy-administration-regression.yml
          if grep -R -n -E 'InitialPasswordEnrollment|password-enrollment' apps/web/app/Application/Preview apps/web/app/Delivery/Preview 2>/dev/null; then
            echo 'Technical Preview gained Sprint 28 enrollment wiring.' >&2
            exit 1
          fi

      - name: Run Sprint 28 disposable enrollment regression
        working-directory: apps/web
        run: php tests/initial-password-enrollment.php

      - name: Preserve Sprint 21 through Sprint 27 regressions
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          composer test
          php -r 'require "vendor/autoload.php"; $app=require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Http\Kernel::class)->bootstrap(); $assert=static function(bool $c,string $m):void{if(!$c)throw new RuntimeException($m);}; require "tests/authorization-persistence.php"; require "tests/authorization-administration-persistence.php"; require "tests/initial-tenant-administrator-provisioning.php"; require "tests/protected-control-administrator-lifecycle.php";'
          php tests/tenant-isolation.php
          php tests/identity-org-context.php
          php tests/policy-administration-delivery.php
          php tests/identity-credential-verification.php
          php tests/first-party-session-establishment.php
          php tests/privileged-update-security.php

      - name: Preserve tracked source
        run: git diff --exit-code
