# Author by Lab | zefry
name: Sprint209 Durable Staging Deployment Evidence Binding Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint209-durable-staging-deployment-evidence-binding-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify-sprint209-deployment-evidence-binding:
    name: qualify-sprint209-deployment-evidence-binding
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Lock exact Sprint209 engineering envelope
        if: github.event_name == 'pull_request' && github.head_ref == 'sprint209-durable-staging-deployment-evidence-binding-foundation'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | LC_ALL=C sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          .github/workflows/final-shift-close-durable-runtime-attestation.yml
          .github/workflows/sprint113-final-shift-close-durable-runtime-attestation-producer.yml
          .github/workflows/sprint209-durable-staging-deployment-evidence-binding-regression.yml
          DEPLOYMENT.md
          docs/SPRINT113_FINAL_SHIFT_CLOSE_DURABLE_RUNTIME_ATTESTATION_PRODUCER.md
          ops/final-shift-close/DURABLE_RUNTIME_ATTESTATION_PRODUCER_CONTRACT.json
          ops/final-shift-close/DURABLE_STAGING_DEPLOYMENT_EVIDENCE_BINDING_CONTRACT.json
          tools/deployment/durable-staging-deployment-evidence.schema.json
          tools/qualify-durable-staging-deployment-evidence.php
          EOF
          diff -u /tmp/expected /tmp/actual
          test "$(sha256sum /tmp/actual | awk '{print $1}')" = 'ebff1a00d0b06f16925cc0f0849b3c7cd38216ccccd659f0447f307d71face10'

      - name: Preserve canonical operational NO-GO
        shell: bash
        run: |
          set -euo pipefail
          state=ops/final-shift-close/STATE.json
          selection=ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json
          test "$(jq -r '.migration27.state' "$state")" = NOT_EXECUTED
          test "$(jq -r '.permission_provisioning.state' "$state")" = NONE
          test "$(jq -r '.feature_activation.state' "$state")" = INACTIVE
          test "$(jq -r '.deployment_authority' "$state")" = NOT_GRANTED
          test "$(jq -r '.technical_preview_activation' "$state")" = NOT_AUTHORIZED
          test "$(jq -r '.production_activation' "$state")" = NOT_AUTHORIZED
          test "$(jq -r '.updater_activation' "$state")" = INACTIVE
          test "$(jq -r '.selection_state' "$selection")" = BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET
          test "$(jq -r '.selected_target' "$selection")" = null

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none

      - name: Validate Sprint209 contract schema and qualifier
        shell: bash
        run: |
          set -euo pipefail
          jq -e . ops/final-shift-close/DURABLE_STAGING_DEPLOYMENT_EVIDENCE_BINDING_CONTRACT.json >/dev/null
          jq -e . tools/deployment/durable-staging-deployment-evidence.schema.json >/dev/null
          php -l tools/qualify-durable-staging-deployment-evidence.php
          test "$(jq -r '.contract_state' ops/final-shift-close/DURABLE_STAGING_DEPLOYMENT_EVIDENCE_BINDING_CONTRACT.json)" = SOURCE_READY_EVIDENCE_QUALIFICATION_ONLY_NOT_DISPATCHED
          test "$(jq -r '.properties.evidence_state.const' tools/deployment/durable-staging-deployment-evidence.schema.json)" = DEPLOYED_VERIFIED_NOT_SELECTED
          test "$(jq -r '.properties.runtime_class.const' tools/deployment/durable-staging-deployment-evidence.schema.json)" = durable-staging
          test "$(jq -r '.properties.operational_boundary.properties.target_selection.const' tools/deployment/durable-staging-deployment-evidence.schema.json)" = NOT_PERFORMED

      - name: Qualify exact synthetic deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          source_commit='1111111111111111111111111111111111111111'
          artifact_sha='aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          plan_sha='bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'
          authority_sha='cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc'
          cat > /tmp/evidence.json <<EOF
          {
            "schema_version":1,
            "product":"oneQay",
            "evidence_state":"DEPLOYED_VERIFIED_NOT_SELECTED",
            "environment_id":"durable-staging-ci",
            "runtime_class":"durable-staging",
            "release_id":"durable-staging-111111111111",
            "source_commit":"$source_commit",
            "artifact_sha256":"$artifact_sha",
            "deployment_plan_fingerprint":"$plan_sha",
            "deployment_authority_id":"durable-staging-deployment-authority-0123456789abcdef01234567",
            "deployment_authority_sha256":"$authority_sha",
            "deployment_request_id":"durable-staging-deployment-request-0123456789abcdef01234567",
            "deployment_request_sha256":"dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd",
            "verification":{
              "preflight_passed":true,
              "previous_active_release_preserved":true,
              "immutable_release_extracted":true,
              "public_document_root_verified":true,
              "external_runtime_configuration_bound":true,
              "provenance_readback_verified":true,
              "configuration_read_before_write_verified":true,
              "configuration_read_after_write_verified":true,
              "non_mutating_health_attestation_verified":true,
              "rollback_path_verified":true
            },
            "runtime_readback":{
              "environment_id":"durable-staging-ci",
              "runtime_class":"durable-staging",
              "exact_running_source_commit":"$source_commit",
              "exact_running_artifact_sha256":"$artifact_sha",
              "durable_staging_runtime_enabled":true,
              "production_data_allowed":false
            },
            "operational_boundary":{
              "migration27_execution":"NOT_PERFORMED",
              "permission_provisioning":"NONE",
              "feature_activation":"INACTIVE",
              "technical_preview_activation":"NOT_AUTHORIZED",
              "production_activation":"NOT_AUTHORIZED",
              "updater_activation":"INACTIVE",
              "target_selection":"NOT_PERFORMED",
              "selected_target":null,
              "producer_dispatch":"NOT_PERFORMED"
            },
            "secrets_embedded":false,
            "attribution":"Lab | zefry"
          }
          EOF
          php tools/qualify-durable-staging-deployment-evidence.php             /tmp/evidence.json durable-staging-ci durable-staging "$source_commit" "$artifact_sha" "$plan_sha" "$authority_sha"             > /tmp/qualification.json
          jq -e '.qualification_state == "QUALIFIED_DEPLOYMENT_EVIDENCE_NOT_SELECTED"' /tmp/qualification.json >/dev/null
          test "$(jq -r '.selected_target' /tmp/qualification.json)" = null
          test "$(jq -r '.producer_dispatch' /tmp/qualification.json)" = NOT_PERFORMED

      - name: Prove fail-closed binding mismatches
        shell: bash
        run: |
          set -euo pipefail
          source_commit='1111111111111111111111111111111111111111'
          artifact_sha='aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          plan_sha='bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'
          authority_sha='cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc'
          ! php tools/qualify-durable-staging-deployment-evidence.php /tmp/evidence.json wrong-target durable-staging "$source_commit" "$artifact_sha" "$plan_sha" "$authority_sha"
          ! php tools/qualify-durable-staging-deployment-evidence.php /tmp/evidence.json durable-staging-ci durable-staging 2222222222222222222222222222222222222222 "$artifact_sha" "$plan_sha" "$authority_sha"
          ! php tools/qualify-durable-staging-deployment-evidence.php /tmp/evidence.json durable-staging-ci durable-staging "$source_commit" eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee "$plan_sha" "$authority_sha"
          ! php tools/qualify-durable-staging-deployment-evidence.php /tmp/evidence.json durable-staging-ci durable-staging "$source_commit" "$artifact_sha" ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff "$authority_sha"
          ! php tools/qualify-durable-staging-deployment-evidence.php /tmp/evidence.json durable-staging-ci durable-staging "$source_commit" "$artifact_sha" "$plan_sha" 9999999999999999999999999999999999999999999999999999999999999999
          jq '.operational_boundary.selected_target = "forbidden"' /tmp/evidence.json > /tmp/evidence-bad.json
          ! php tools/qualify-durable-staging-deployment-evidence.php /tmp/evidence-bad.json durable-staging-ci durable-staging "$source_commit" "$artifact_sha" "$plan_sha" "$authority_sha"

      - name: Prove producer requires deployment evidence before attestation
        shell: bash
        run: |
          set -euo pipefail
          producer=.github/workflows/final-shift-close-durable-runtime-attestation.yml
          grep -Fq 'secrets.ONEQAY_DURABLE_STAGING_DEPLOYMENT_EVIDENCE_B64' "$producer"
          grep -Fq 'REVIEW_GATED_DEPLOYMENT_EVIDENCE_V1' "$producer"
          grep -Fq 'tools/qualify-durable-staging-deployment-evidence.php' "$producer"
          grep -Fq 'vars.ONEQAY_DURABLE_RUNTIME_RUNNING_SOURCE_COMMIT' "$producer"
          grep -Fq 'vars.ONEQAY_DURABLE_RUNTIME_RUNNING_ARTIFACT_SHA256' "$producer"
          grep -Fq 'vars.ONEQAY_DURABLE_STAGING_DEPLOYMENT_PLAN_FINGERPRINT' "$producer"
          grep -Fq 'vars.ONEQAY_DURABLE_STAGING_DEPLOYMENT_AUTHORITY_SHA256' "$producer"
          qualify_line="$(grep -n 'name: Qualify protected durable-staging deployment evidence' "$producer" | cut -d: -f1)"
          fetch_line="$(grep -n 'name: Fetch authenticated runtime readiness attestation' "$producer" | cut -d: -f1)"
          (( qualify_line < fetch_line ))

      - name: Prove qualifier has no operational side effects
        shell: bash
        run: |
          set -euo pipefail
          qualifier=tools/qualify-durable-staging-deployment-evidence.php
          ! grep -Eq 'Artisan::call|shell_exec\(|proc_open\(|passthru\(|exec\(|system\(' "$qualifier"
          ! grep -Eq 'file_put_contents\(|fwrite\([^,]*,[^)]*\.env|symlink\(|rename\(' "$qualifier"
          ! grep -R -E 'ChatGPT|OpenAI|Copilot|Gemini'             "$qualifier"             tools/deployment/durable-staging-deployment-evidence.schema.json             ops/final-shift-close/DURABLE_STAGING_DEPLOYMENT_EVIDENCE_BINDING_CONTRACT.json

      - name: Preserve Sprint208 and Sprint207 source boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.contract_state' ops/final-shift-close/DURABLE_STAGING_DEPLOYMENT_AUTHORITY_BINDING_CONTRACT.json)" = SOURCE_READY_AUTHORITY_BINDING_ONLY_NOT_DEPLOYED
          test "$(jq -r '.contract_state' ops/final-shift-close/DURABLE_STAGING_OPERATOR_DEPLOYMENT_PLAN_CONTRACT.json)" = SOURCE_READY_PLAN_PREPARATION_ONLY_NOT_DEPLOYED
          test "$(jq -r '.canonical_boundaries.producer_dispatch' ops/final-shift-close/DURABLE_STAGING_OPERATOR_DEPLOYMENT_PLAN_CONTRACT.json)" = NOT_PERFORMED

      - name: Confirm tracked source cleanliness
        run: git diff --exit-code
