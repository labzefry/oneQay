# Author by Lab | zefry. Synthetic databases only.
name: Menu book catalog integration
on:
  pull_request:
    paths:
      - 'apps/web/app/Infrastructure/Business/LaravelMenuBookCatalog.php'
      - 'apps/web/app/Delivery/Http/Business/MenuBookController.php'
      - 'apps/web/app/Delivery/Http/Business/PublicMenuBookController.php'
      - 'apps/web/resources/js/pages/Website/PublicMenuBook.vue'
      - 'apps/web/app/Application/Business/BusinessAccess.php'
      - 'apps/web/app/Providers/BusinessManagementServiceProvider.php'
      - 'apps/web/resources/js/pages/Business/MenuBook.vue'
      - 'apps/web/resources/js/layouts/MerchantShell.vue'
      - 'apps/web/app/Infrastructure/Platform/ControlPlaneBusinessReset.php'
      - 'apps/web/database/module-migrations/business/2026_10_29_000001_create_menu_book_catalog.php'
      - 'apps/web/tests/menu-book-catalog.php'
      - '.github/workflows/menu-book-catalog.yml'
permissions:
  contents: read
concurrency:
  group: menu-book-catalog-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  menu-book-catalog:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: synthetic-test-only
          MYSQL_DATABASE: oneqay_platform_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psynthetic-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, mbstring, zip
          coverage: none
      - run: composer install --working-dir=apps/web --no-interaction --prefer-dist
      - run: php apps/web/tests/menu-book-catalog.php
      - run: PLATFORM_TEST_ENGINE=mysql php apps/web/tests/menu-book-catalog.php
      - run: php apps/web/tests/loyalty-math.php
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-fund
        working-directory: apps/web
      - run: npm run type-check
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
