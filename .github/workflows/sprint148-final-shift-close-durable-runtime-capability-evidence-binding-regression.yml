name: Sprint148 Final Shift Close Durable Runtime Capability Evidence Binding Regression

# Attribution: Lab | zefry

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sprint148-durable-runtime-capability-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify-target-bound-capability-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      CACHE_STORE: array
      SESSION_DRIVER: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Preserve successor-compatible historical regression boundary
        shell: bash
        run: |
          set -euo pipefail
          # Sprint148 is historical after its canonical squash merge.
          # Future PRs may evolve adjacent source while this workflow continues
          # to prove the behavior and NO-GO invariants owned by Sprint148.
          test -f apps/web/app/Application/Pos/FinalShiftCloseDurableRuntimeCapabilityEvidence.php
          test -f apps/web/tests/pos-final-shift-close-durable-runtime-capability-evidence-binding.php
          test -f docs/SPRINT148_FINAL_SHIFT_CLOSE_DURABLE_RUNTIME_CAPABILITY_EVIDENCE_BINDING.md
          test -f ops/final-shift-close/DURABLE_RUNTIME_CAPABILITY_EVIDENCE_BINDING_CONTRACT.json
          test -f ops/final-shift-close/POST_SELECTION_DOWNSTREAM_READINESS.json
          test -f ops/final-shift-close/STATE.json
          test -f ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json

      - name: Preserve predecessor historical successor compatibility
        shell: bash
        run: |
          set -euo pipefail
          sprint116=.github/workflows/sprint116-final-shift-close-post-selection-downstream-readiness.yml
          sprint147=.github/workflows/sprint147-final-shift-close-canonical-control-plane-throttle-rejection-metadata-identity-response-hardening-regression.yml
          grep -Fq 'Preserve successor-compatible historical regression boundary' "$sprint116"
          grep -Fq 'Sprint116 is historical after its canonical squash merge.' "$sprint116"
          grep -Fq 'Preserve successor-compatible historical regression boundary' "$sprint147"
          grep -Fq 'Sprint147 is historical after its canonical squash merge.' "$sprint147"

      - name: Validate historical Sprint148 contract
        shell: bash
        run: |
          set -euo pipefail
          file=ops/final-shift-close/DURABLE_RUNTIME_CAPABILITY_EVIDENCE_BINDING_CONTRACT.json
          jq -e '
            .schema_version == 1 and
            .feature == "final-shift-close" and
            .sprint == 148 and
            .contract_state == "MATERIALIZED_SOURCE_ONLY" and
            .bounded_objective == "DURABLE_RUNTIME_TARGET_BOUND_CAPABILITY_EVIDENCE_IDENTITY_BINDING" and
            .qualification.sprint110_readiness_attestation_must_remain_qualified == true and
            .qualification.sprint111_selection_identity_must_recompute_exactly == true and
            .qualification.required_selection_state == "SELECTED_NOT_AUTHORIZED" and
            .qualification.required_activation_authority_state == "NOT_GRANTED" and
            .qualification.required_feature_activation_state == "INACTIVE" and
            .qualification.required_runtime_allowlist_change == "NOT_IMPLEMENTED" and
            .qualification.each_capability_state_must_equal == "VERIFIED" and
            .qualification.each_capability_evidence_sha256_must_be_lowercase_hex64 == true and
            .qualification.each_capability_must_bind_exact_target_binding_sha256 == true and
            .qualification.evidence_bundle_fingerprint_key_order_independent == true and
            .qualification.evidence_and_capability_records_must_be_secret_free == true and
            .qualification.raw_sprint110_boolean_capability_claims_are_not_target_bound_evidence == true and
            .qualification.qualification_does_not_grant_activation_authority == true and
            .qualification.qualification_does_not_change_runtime_allowlist == true and
            .qualification.qualification_does_not_execute_operational_actions == true and
            .historical_ownership.sprint116_post_selection_downstream_readiness == "SUCCESSOR_COMPATIBLE_AFTER_CI_PROVEN_ENVELOPE_CONFLICT" and
            .source_envelope.path_count == 7 and
            .source_envelope.sha256 == "f7d9cfb173b54ac863cc70f10b9ae3df2f6715a4abdae0c7c32cbdb399bda5a6" and
            .canonical_boundaries.real_capability_evidence == "NONE" and
            .canonical_boundaries.trusted_capability_evidence_producer == "NOT_IMPLEMENTED" and
            .canonical_boundaries.migration27_execution == "NOT_PERFORMED" and
            .canonical_boundaries.permission_provisioning == "NONE" and
            .canonical_boundaries.runtime_allowlist_change == "NOT_IMPLEMENTED" and
            .canonical_boundaries.feature_activation == "INACTIVE" and
            .canonical_boundaries.deployment_authority == "NOT_GRANTED" and
            .attribution == "Author by Lab | zefry"
          ' "$file" >/dev/null

      - name: Preserve Sprint148 post-selection ownership
        shell: bash
        run: |
          set -euo pipefail
          file=ops/final-shift-close/POST_SELECTION_DOWNSTREAM_READINESS.json
          jq -e '
            .downstream_components.durable_runtime_capability_evidence_binding.source_materialized == true and
            .downstream_components.durable_runtime_capability_evidence_binding.real_capability_evidence_present == false and
            .downstream_components.durable_runtime_capability_evidence_binding.trusted_evidence_producer_materialized == false and
            (.downstream_components.runtime_allowlist.required_before_eligibility | index("TARGET_BOUND_CAPABILITY_EVIDENCE_IDENTITY_QUALIFIED")) != null and
            (.ordering | index("QUALIFY_TARGET_BOUND_DURABLE_RUNTIME_CAPABILITY_EVIDENCE_IDENTITY")) != null and
            (.forbidden_shortcuts | index("TREAT_SPRINT110_BOOLEAN_CAPABILITY_CLAIMS_AS_TARGET_BOUND_EVIDENCE")) != null and
            .sprint148_extension.bounded_objective == "DURABLE_RUNTIME_TARGET_BOUND_CAPABILITY_EVIDENCE_IDENTITY_BINDING" and
            .sprint148_extension.source_envelope_sha256 == "f7d9cfb173b54ac863cc70f10b9ae3df2f6715a4abdae0c7c32cbdb399bda5a6" and
            .sprint148_extension.source_only == true and
            .sprint148_extension.real_capability_evidence == "NONE" and
            .sprint148_extension.operational_execution == "NOT_PERFORMED"
          ' "$file" >/dev/null

      - name: Prove target-bound capability evidence identity boundary
        shell: bash
        run: |
          set -euo pipefail
          source=apps/web/app/Application/Pos/FinalShiftCloseDurableRuntimeCapabilityEvidence.php
          grep -Fq "QUALIFICATION_STATE = 'TARGET_BOUND_CAPABILITY_EVIDENCE_IDENTITY_QUALIFIED_NOT_AUTHORIZED'" "$source"
          grep -Fq "'authenticated_configuration_mutation_channel' => 'AUTHENTICATED_CONFIGURATION_CHANNEL_IDENTITY_EVIDENCE'" "$source"
          grep -Fq "'read_before_write_read_after' => 'READ_BEFORE_WRITE_READ_AFTER_VERIFICATION_EVIDENCE'" "$source"
          grep -Fq "'non_mutating_health_attestation' => 'NON_MUTATING_HEALTH_ATTESTATION_EVIDENCE'" "$source"
          grep -Fq "'verified_flag_rollback' => 'VERIFIED_FLAG_ROLLBACK_EVIDENCE'" "$source"
          grep -Fq "selection_activation_authority_must_remain_not_granted" "$source"
          grep -Fq "selection_runtime_allowlist_must_remain_unchanged" "$source"
          grep -Fq "capability_target_binding_mismatch:" "$source"
          grep -Fq "capability_evidence_must_not_embed_secrets:" "$source"

      - name: Preserve canonical lifecycle gates
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" == 'NOT_EXECUTED' ]]
          [[ "$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)" == 'NONE' ]]
          [[ "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.deployment_authority' ops/final-shift-close/STATE.json)" == 'NOT_GRANTED' ]]
          [[ "$(jq -r '.technical_preview_activation' ops/final-shift-close/STATE.json)" == 'NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.production_activation' ops/final-shift-close/STATE.json)" == 'NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.updater_activation' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET' ]]
          [[ "$(jq -r '.selected_target' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'null' ]]

      - name: Validate PHP and dependencies
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Application/Pos/FinalShiftCloseDurableRuntimeCapabilityEvidence.php
          php -l tests/pos-final-shift-close-durable-runtime-capability-evidence-binding.php
          php -l app/Application/Pos/FinalShiftCloseDurableRuntimeReadiness.php
          php -l app/Application/Pos/FinalShiftCloseDurableRuntimeTargetSelection.php
          php -l tests/pos-final-shift-close-durable-runtime-readiness.php
          php -l tests/pos-final-shift-close-durable-runtime-target-selection.php
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          composer audit --locked --no-interaction --abandoned=report

      - name: Execute Sprint148 regression
        working-directory: apps/web
        run: php tests/pos-final-shift-close-durable-runtime-capability-evidence-binding.php

      - name: Preserve Sprint110 durable runtime readiness regression
        working-directory: apps/web
        run: php tests/pos-final-shift-close-durable-runtime-readiness.php

      - name: Preserve Sprint111 durable runtime target selection regression
        working-directory: apps/web
        run: php tests/pos-final-shift-close-durable-runtime-target-selection.php

      - name: Preserve Sprint148 documentation boundary
        shell: bash
        run: |
          set -euo pipefail
          doc=docs/SPRINT148_FINAL_SHIFT_CLOSE_DURABLE_RUNTIME_CAPABILITY_EVIDENCE_BINDING.md
          grep -Fq '## Purpose / Why' "$doc"
          grep -Fq '## Objective / Gap' "$doc"
          grep -Fq '## What changed' "$doc"
          grep -Fq '## Evidence / Qualification' "$doc"
          grep -Fq '## Operational boundaries / NO-GO' "$doc"
          grep -Fq '## Next position' "$doc"
          grep -Fq 'f7d9cfb173b54ac863cc70f10b9ae3df2f6715a4abdae0c7c32cbdb399bda5a6' "$doc"
          ! grep -Eq '^[[:space:]]*workflow_dispatch[[:space:]]*:' .github/workflows/sprint148-final-shift-close-durable-runtime-capability-evidence-binding-regression.yml

      - name: Verify tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code

# Author by Lab | zefry
