# Author by Lab | zefry
name: Sprint214 cPanel No-SSH Guarded Deployment Execution Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint214-cpanel-no-ssh-guarded-deployment-execution-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify-sprint214-cpanel-no-ssh-guarded-deployment:
    name: qualify-sprint214-cpanel-no-ssh-guarded-deployment
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Lock exact Sprint214 engineering envelope
        if: github.event_name == 'pull_request' && github.head_ref == 'sprint214-cpanel-no-ssh-guarded-deployment-execution'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | LC_ALL=C sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          .github/workflows/cpanel-no-ssh-operator-qualification-kit-publication.yml
          .github/workflows/sprint214-cpanel-no-ssh-guarded-deployment-execution-regression.yml
          DEPLOYMENT.md
          INSTALLER.md
          ops/final-shift-close/DURABLE_STAGING_CPANEL_NO_SSH_GUARDED_DEPLOYMENT_EXECUTION_CONTRACT.json
          ops/final-shift-close/DURABLE_STAGING_CPANEL_NO_SSH_OPERATOR_KIT_PUBLICATION_CONTRACT.json
          tools/cpanel/build-cpanel-no-ssh-operator-qualification-kit.sh
          tools/cpanel/execute-durable-staging-cpanel-no-ssh-deployment.php
          EOF
          diff -u /tmp/expected /tmp/actual
          test "$(sha256sum /tmp/actual | awk '{print $1}')" = 'dd1abbfbd9c21d2372cc1b3957ea42bed438b224b88284ceb870df81e8b46347'

      - name: Setup governed PHP runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: curl,pdo_mysql
          coverage: none

      - name: Validate Sprint214 source syntax and contracts
        shell: bash
        run: |
          set -euo pipefail
          php -l tools/cpanel/execute-durable-staging-cpanel-no-ssh-deployment.php
          bash -n tools/cpanel/build-cpanel-no-ssh-operator-qualification-kit.sh
          jq -e . ops/final-shift-close/DURABLE_STAGING_CPANEL_NO_SSH_GUARDED_DEPLOYMENT_EXECUTION_CONTRACT.json >/dev/null
          jq -e . ops/final-shift-close/DURABLE_STAGING_CPANEL_NO_SSH_OPERATOR_KIT_PUBLICATION_CONTRACT.json >/dev/null

          contract=ops/final-shift-close/DURABLE_STAGING_CPANEL_NO_SSH_GUARDED_DEPLOYMENT_EXECUTION_CONTRACT.json
          test "$(jq -r '.contract_state' "$contract")" = SOURCE_READY_AUTHORITY_BOUND_CPANEL_NO_SSH_EXECUTOR_NOT_EXECUTED
          test "$(jq -r '.execution_requirements.active_release_pointer_semantics' "$contract")" = SYMLINK_TO_IMMUTABLE_RELEASE_DIRECTORY
          test "$(jq -r '.initial_deployment_policy.active_pointer_may_be_absent_before_first_deployment' "$contract")" = true
          test "$(jq -r '.execution_requirements.rollback_rehearsal_required' "$contract")" = true
          test "$(jq -r '.execution_requirements.post_reactivation_readiness_required' "$contract")" = true
          test "$(jq -r '.safety.migration_execution' "$contract")" = false
          test "$(jq -r '.canonical_boundaries.real_environment_execution' "$contract")" = NOT_PERFORMED

      - name: Preserve canonical operational NO-GO
        shell: bash
        run: |
          set -euo pipefail
          state=ops/final-shift-close/STATE.json
          selection=ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json
          test "$(jq -r '.migration27.state' "$state")" = NOT_EXECUTED
          test "$(jq -r '.permission_provisioning.state' "$state")" = NONE
          test "$(jq -r '.feature_activation.state' "$state")" = INACTIVE
          test "$(jq -r '.deployment_authority' "$state")" = NOT_GRANTED
          test "$(jq -r '.technical_preview_activation' "$state")" = NOT_AUTHORIZED
          test "$(jq -r '.production_activation' "$state")" = NOT_AUTHORIZED
          test "$(jq -r '.updater_activation' "$state")" = INACTIVE
          test "$(jq -r '.selection_state' "$selection")" = BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET
          test "$(jq -r '.selected_target' "$selection")" = null

      - name: Prepare synthetic authority-bound cPanel target and exact archive
        id: fixture
        shell: bash
        run: |
          set -euo pipefail

          root="$RUNNER_TEMP/oneqay-sprint214"
          deployment="$root/deployment"
          release_root="$deployment/releases"
          shared_root="$deployment/shared"
          active_pointer="$deployment/current"
          document_root="$active_pointer/apps/web/public"
          source_commit='aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          release_id='durable-staging-aaaaaaaaaaaa'
          environment_id='cpanel-s214-ci'
          archive_stage="$root/archive-stage/$release_id"
          archive="$root/$release_id.tar.gz"

          mkdir -p             "$release_root"             "$shared_root"             "$archive_stage/apps/web/public"             "$archive_stage/apps/web/vendor"             "$archive_stage/apps/web/bootstrap"             "$archive_stage/apps/web/database/migrations"

          printf '<?php echo "ok";\n' > "$archive_stage/apps/web/public/index.php"
          printf 'RewriteEngine On\n' > "$archive_stage/apps/web/public/.htaccess"
          printf '<?php\n' > "$archive_stage/apps/web/vendor/autoload.php"
          printf '<?php\n' > "$archive_stage/apps/web/bootstrap/app.php"

          for i in $(seq -w 1 26); do
            printf '<?php\n' > "$archive_stage/apps/web/database/migrations/fixture_${i}.php"
          done
          printf '<?php\n' > "$archive_stage/apps/web/database/migrations/0000_00_00_000027_create_pos_shift_close_evidence_foundation.php"

          cat > "$archive_stage/RELEASE.json" <<EOF
          {
            "payload_metadata_version": 1,
            "product": "oneQay",
            "release_id": "$release_id",
            "environment": "DURABLE_STAGING",
            "required_runtime_class": "durable-staging",
            "production": false,
            "synthetic_fixture_runtime": false,
            "production_data_allowed": false,
            "source_commit": "$source_commit",
            "migration_source_included": true,
            "migration_count": 27,
            "latest_migration": "0000_00_00_000027_create_pos_shift_close_evidence_foundation.php",
            "migration_execution_state": "NOT_EXECUTED_BY_ARTIFACT_BUILD",
            "migration_execution_authorized": false,
            "deployment_authority": "NOT_GRANTED",
            "environment_deployment": "NOT_PERFORMED",
            "feature_activation": "INACTIVE",
            "technical_preview_activation": "NOT_AUTHORIZED",
            "production_activation": "NOT_AUTHORIZED",
            "updater_activation": "INACTIVE",
            "target_selection": "BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET",
            "selected_target": null,
            "producer_dispatch": "NOT_PERFORMED",
            "attribution": "Lab | zefry"
          }
          EOF

          tar -C "$root/archive-stage" -czf "$archive" "$release_id"
          artifact_sha="$(sha256sum "$archive" | awk '{print $1}')"

          token='sprint214-ci-attestation-token-0123456789abcdef'
          cat > "$shared_root/private-bindings.json" <<EOF
          {
            "ONEQAY_RUNTIME_CLASS": "durable-staging",
            "ONEQAY_RUNNING_SOURCE_COMMIT": "$source_commit",
            "ONEQAY_RUNNING_ARTIFACT_SHA256": "$artifact_sha",
            "ONEQAY_DURABLE_RUNTIME_ENVIRONMENT_ID": "$environment_id",
            "ONEQAY_DURABLE_RUNTIME_ATTESTATION_TOKEN": "$token",
            "ONEQAY_DURABLE_STAGING_RUNTIME_ENABLED": "true"
          }
          EOF
          chmod 0600 "$shared_root/private-bindings.json"

          cat > "$shared_root/runtime.env" <<EOF
          APP_NAME=oneQay
          APP_ENV=staging
          APP_DEBUG=false
          ONEQAY_RUNTIME_CLASS=durable-staging
          ONEQAY_RUNNING_SOURCE_COMMIT=$source_commit
          ONEQAY_RUNNING_ARTIFACT_SHA256=$artifact_sha
          ONEQAY_DURABLE_RUNTIME_ENVIRONMENT_ID=$environment_id
          ONEQAY_DURABLE_STAGING_RUNTIME_ENABLED=true
          EOF
          chmod 0600 "$shared_root/runtime.env"

          cat > "$root/profile.json" <<EOF
          {
            "schema_version": 1,
            "profile_state": "CPANEL_NO_SSH_TARGET_PROFILE_OBSERVED",
            "environment_id": "$environment_id",
            "runtime_class": "durable-staging",
            "production": false,
            "production_data_allowed": false,
            "synthetic_fixture_runtime": false,
            "execution_channel": "CPANEL_CRON_PHP_CLI_NO_SSH",
            "release_binding": {
              "source_commit": "$source_commit",
              "artifact_sha256": "$artifact_sha"
            },
            "filesystem": {
              "deployment_root": "$deployment",
              "release_root": "$release_root",
              "shared_runtime_root": "$shared_root",
              "active_release_pointer": "$active_pointer",
              "document_root": "$document_root",
              "deployment_root_writable": true,
              "release_root_writable": true,
              "shared_runtime_root_writable": true,
              "active_pointer_parent_writable": true,
              "atomic_rename_supported": true,
              "symlink_supported": true,
              "document_root_shape_valid": true
            },
            "runtime": {
              "php_version": "8.3",
              "php_version_supported": true,
              "required_extensions_present": true,
              "pdo_mysql_available": true
            },
            "configuration": {
              "binding_file_private": true,
              "required_binding_presence": {
                "ONEQAY_RUNTIME_CLASS": true,
                "ONEQAY_RUNNING_SOURCE_COMMIT": true,
                "ONEQAY_RUNNING_ARTIFACT_SHA256": true,
                "ONEQAY_DURABLE_RUNTIME_ENVIRONMENT_ID": true,
                "ONEQAY_DURABLE_RUNTIME_ATTESTATION_TOKEN": true,
                "ONEQAY_DURABLE_STAGING_RUNTIME_ENABLED": true
              },
              "required_binding_identity_matches": true,
              "secret_values_embedded": false
            },
            "operator_assertions": {
              "durable_database_persistence": true,
              "durable_session": true,
              "authorization": true,
              "transaction_durability": true,
              "pos_durability": true,
              "authenticated_configuration_channel": true,
              "read_before_write": true,
              "read_after_write": true,
              "non_mutating_health_attestation": true,
              "verified_rollback": true
            },
            "secrets_embedded": false,
            "attribution": "Lab | zefry"
          }
          EOF

          now="$(date +%s)"
          authorized_at="$((now - 1))"
          expires_at="$((now + 600))"
          authority_sha="$(printf 'b%.0s' {1..64})"
          request_sha="$(printf 'c%.0s' {1..64})"
          descriptor_sha="$(printf 'd%.0s' {1..64})"
          manifest_sha="$(printf 'e%.0s' {1..64})"

          cat > "$root/plan-core.json" <<EOF
          {
            "schema_version": 1,
            "plan_state": "QUALIFIED_FOR_EXTERNAL_OPERATOR_EXECUTION_NOT_EXECUTED",
            "product": {
              "name": "oneQay",
              "repository": "labzefry/oneQay"
            },
            "artifact": {
              "release_id": "$release_id",
              "source_commit": "$source_commit",
              "artifact_filename": "$release_id.tar.gz",
              "artifact_sha256": "$artifact_sha",
              "manifest_sha256": "$manifest_sha"
            },
            "target": {
              "environment_id": "$environment_id",
              "runtime_class": "durable-staging",
              "production": false,
              "production_data_allowed": false,
              "synthetic_fixture_runtime": false,
              "deployment_root": "$deployment",
              "release_directory": "$release_root/$release_id",
              "shared_runtime_root": "$shared_root",
              "active_release_pointer": "$active_pointer"
            },
            "authority_binding": {
              "state": "EXTERNAL_AUTHORITY_BOUND_TO_EXACT_TARGET",
              "authority_id": "durable-staging-deployment-authority-0123456789abcdef01234567",
              "authority_sha256": "$authority_sha",
              "request_id": "durable-staging-deployment-request-0123456789abcdef01234567",
              "request_sha256": "$request_sha",
              "target_descriptor_sha256": "$descriptor_sha",
              "authorized_at_unix": $authorized_at,
              "expires_at_unix": $expires_at,
              "deployment_allowed": true,
              "migration_execution_allowed": false,
              "production_allowed": false
            },
            "readback_expectations": {
              "environment_id": "$environment_id",
              "runtime_class": "durable-staging",
              "running_source_commit": "$source_commit",
              "running_artifact_sha256": "$artifact_sha",
              "durable_staging_runtime_enabled": true,
              "production_data_allowed": false
            },
            "rollback": {
              "required": true,
              "previous_active_release_must_be_preserved": true,
              "rollback_must_be_verified_before_acceptance": true,
              "database_rollback_implied": false,
              "migration_rollback_implied": false
            },
            "migration": {
              "source_included": true,
              "expected_count": 27,
              "execution_state": "NOT_PERFORMED",
              "execution_authorized": false
            },
            "attribution": "Lab | zefry"
          }
          EOF

          PLAN_CORE="$root/plan-core.json" PLAN_OUT="$root/plan.json" php <<'PHP'
          <?php
          declare(strict_types=1);

          function canonicalize(mixed $value): mixed {
              if (!is_array($value)) return $value;
              if (array_is_list($value)) return array_map('canonicalize', $value);
              ksort($value, SORT_STRING);
              foreach ($value as $key => $entry) {
                  $value[$key] = canonicalize($entry);
              }
              return $value;
          }

          $core = json_decode(file_get_contents((string) getenv('PLAN_CORE')), true, 64, JSON_THROW_ON_ERROR);
          $fingerprint = hash('sha256', json_encode(
              canonicalize($core),
              JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE | JSON_THROW_ON_ERROR,
          ));
          $plan = ['plan_fingerprint' => $fingerprint] + $core;
          file_put_contents(
              (string) getenv('PLAN_OUT'),
              json_encode($plan, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE | JSON_THROW_ON_ERROR)."\n",
              LOCK_EX,
          );
          PHP
          chmod 0600 "$root/plan.json"

          {
            echo "root=$root"
            echo "archive=$archive"
            echo "artifact_sha=$artifact_sha"
            echo "source_commit=$source_commit"
            echo "environment_id=$environment_id"
            echo "release_id=$release_id"
            echo "release_root=$release_root"
            echo "active_pointer=$active_pointer"
            echo "shared_root=$shared_root"
            echo "authority_sha=$authority_sha"
            echo "token=$token"
          } >> "$GITHUB_OUTPUT"

      - name: Execute guarded initial deployment with deterministic readiness fixture
        shell: bash
        env:
          ROOT: ${{ steps.fixture.outputs.root }}
          ARCHIVE: ${{ steps.fixture.outputs.archive }}
          SHARED_ROOT: ${{ steps.fixture.outputs.shared_root }}
          ACTIVE_POINTER: ${{ steps.fixture.outputs.active_pointer }}
          RELEASE_ROOT: ${{ steps.fixture.outputs.release_root }}
          RELEASE_ID: ${{ steps.fixture.outputs.release_id }}
          SOURCE_COMMIT: ${{ steps.fixture.outputs.source_commit }}
          ARTIFACT_SHA: ${{ steps.fixture.outputs.artifact_sha }}
          ENVIRONMENT_ID: ${{ steps.fixture.outputs.environment_id }}
          AUTHORITY_SHA: ${{ steps.fixture.outputs.authority_sha }}
          TOKEN: ${{ steps.fixture.outputs.token }}
          EXECUTOR: tools/cpanel/execute-durable-staging-cpanel-no-ssh-deployment.php
        run: |
          set -euo pipefail

          test ! -e "$ACTIVE_POINTER"
          test ! -L "$ACTIVE_POINTER"

          php <<'PHP'
          <?php
          declare(strict_types=1);

          require getenv('EXECUTOR');

          $root = getenv('ROOT');
          $source = getenv('SOURCE_COMMIT');
          $artifact = getenv('ARTIFACT_SHA');
          $environment = getenv('ENVIRONMENT_ID');
          $expectedToken = getenv('TOKEN');
          $fetchCount = 0;

          $attestation = [
              'schema_version' => 1,
              'environment_id' => $environment,
              'runtime_class' => 'durable-staging',
              'runtime_model' => 'NON_SYNTHETIC_DURABLE_RUNTIME',
              'environment_isolation' => 'ISOLATED_NON_PRODUCTION',
              'serving_application_runtime' => true,
              'synthetic_fixture_runtime' => false,
              'production_traffic_served' => false,
              'durable_persistence_enabled' => true,
              'durable_session_control_enabled' => true,
              'durable_authorization_enabled' => true,
              'durable_transaction_boundary_enabled' => true,
              'durable_pos_persistence_enabled' => true,
              'exact_running_source_commit' => $source,
              'exact_running_artifact_sha256' => $artifact,
              'authenticated_configuration_mutation_channel' => true,
              'read_before_write_read_after_supported' => true,
              'non_mutating_health_attestation_supported' => true,
              'verified_flag_rollback_supported' => true,
              'activation_authority_binding' => 'SEPARATE_EXPLICIT_ACTIVATION_AUTHORITY',
              'feature_activation_state' => 'INACTIVE',
              'secrets_embedded' => false,
          ];

          $fetcher = static function (string $url, string $token) use (&$fetchCount, $expectedToken, $attestation): array {
              if ($url !== 'https://fixture.invalid/readiness' || !hash_equals($expectedToken, $token)) {
                  throw new RuntimeException('fixture_readiness_binding_mismatch');
              }
              $fetchCount++;
              return $attestation;
          };

          cpanelExecExecute(
              $root.'/plan.json',
              $root.'/profile.json',
              getenv('ARCHIVE'),
              getenv('SHARED_ROOT').'/private-bindings.json',
              getenv('SHARED_ROOT').'/runtime.env',
              'https://fixture.invalid/readiness',
              $root.'/deployment-evidence.json',
              $fetcher,
          );

          if ($fetchCount !== 2) {
              throw new RuntimeException('readiness_fetch_count_invalid');
          }
          PHP

          test -L "$ACTIVE_POINTER"
          test "$(realpath "$ACTIVE_POINTER")" = "$(realpath "$RELEASE_ROOT/$RELEASE_ID")"
          test -L "$RELEASE_ROOT/$RELEASE_ID/apps/web/.env"
          test "$(realpath "$RELEASE_ROOT/$RELEASE_ID/apps/web/.env")" = "$(realpath "$SHARED_ROOT/runtime.env")"

          EVIDENCE="$ROOT/deployment-evidence.json"
          test "$(jq -r '.evidence_state' "$EVIDENCE")" = DEPLOYED_VERIFIED_NOT_SELECTED
          test "$(jq -r '.verification.preflight_passed' "$EVIDENCE")" = true
          test "$(jq -r '.verification.previous_active_release_preserved' "$EVIDENCE")" = true
          test "$(jq -r '.verification.immutable_release_extracted' "$EVIDENCE")" = true
          test "$(jq -r '.verification.rollback_path_verified' "$EVIDENCE")" = true
          test "$(jq -r '.runtime_readback.environment_id' "$EVIDENCE")" = "$ENVIRONMENT_ID"
          test "$(jq -r '.runtime_readback.exact_running_source_commit' "$EVIDENCE")" = "$SOURCE_COMMIT"
          test "$(jq -r '.runtime_readback.exact_running_artifact_sha256' "$EVIDENCE")" = "$ARTIFACT_SHA"
          test "$(jq -r '.operational_boundary.migration27_execution' "$EVIDENCE")" = NOT_PERFORMED
          test "$(jq -r '.operational_boundary.selected_target' "$EVIDENCE")" = null
          test "$(jq -r '.secrets_embedded' "$EVIDENCE")" = false
          ! grep -Fq "$TOKEN" "$EVIDENCE"

          plan_fingerprint="$(jq -r '.plan_fingerprint' "$ROOT/plan.json")"
          php tools/qualify-durable-staging-deployment-evidence.php             "$EVIDENCE"             "$ENVIRONMENT_ID"             durable-staging             "$SOURCE_COMMIT"             "$ARTIFACT_SHA"             "$plan_fingerprint"             "$AUTHORITY_SHA"             > "$ROOT/evidence-qualification.json"

          test "$(jq -r '.qualification_state' "$ROOT/evidence-qualification.json")" = QUALIFIED_DEPLOYMENT_EVIDENCE_NOT_SELECTED
          test "$(jq -r '.selected_target' "$ROOT/evidence-qualification.json")" = null
          test "$(jq -r '.producer_dispatch' "$ROOT/evidence-qualification.json")" = NOT_PERFORMED

      - name: Exercise rolling pointer rollback semantics
        shell: bash
        env:
          ROOT: ${{ steps.fixture.outputs.root }}
          EXECUTOR: tools/cpanel/execute-durable-staging-cpanel-no-ssh-deployment.php
        run: |
          set -euo pipefail

          php <<'PHP'
          <?php
          declare(strict_types=1);

          require getenv('EXECUTOR');

          $root = getenv('ROOT').'/rolling';
          $releaseRoot = $root.'/releases';
          $previous = $releaseRoot.'/previous';
          $next = $releaseRoot.'/next';
          $pointer = $root.'/current';

          mkdir($previous, 0700, true);
          mkdir($next, 0700, true);
          if (!symlink($previous, $pointer)) {
              throw new RuntimeException('rolling_fixture_symlink_failed');
          }

          $state = cpanelExecReadPreviousState($pointer, $releaseRoot, $next);
          if (($state['state'] ?? null) !== 'SYMLINK' || ($state['target'] ?? null) !== realpath($previous)) {
              throw new RuntimeException('rolling_previous_state_invalid');
          }

          cpanelExecAtomicPoint($pointer, $next);
          if (realpath($pointer) !== realpath($next)) {
              throw new RuntimeException('rolling_activation_failed');
          }

          cpanelExecRestorePrevious($pointer, $state);
          if (realpath($pointer) !== realpath($previous)) {
              throw new RuntimeException('rolling_rollback_failed');
          }

          cpanelExecAtomicPoint($pointer, $next);
          if (realpath($pointer) !== realpath($next)) {
              throw new RuntimeException('rolling_reactivation_failed');
          }
          PHP

      - name: Fail closed on drifted capability profile without mutating active release
        shell: bash
        env:
          ROOT: ${{ steps.fixture.outputs.root }}
          ARCHIVE: ${{ steps.fixture.outputs.archive }}
          SHARED_ROOT: ${{ steps.fixture.outputs.shared_root }}
          ACTIVE_POINTER: ${{ steps.fixture.outputs.active_pointer }}
          EXECUTOR: tools/cpanel/execute-durable-staging-cpanel-no-ssh-deployment.php
        run: |
          set -euo pipefail

          before="$(realpath "$ACTIVE_POINTER")"
          jq '.operator_assertions.verified_rollback = false' "$ROOT/profile.json" > "$ROOT/rejected-profile.json"

          ROOT="$ROOT" ARCHIVE="$ARCHIVE" SHARED_ROOT="$SHARED_ROOT" EXECUTOR="$EXECUTOR" php <<'PHP'
          <?php
          declare(strict_types=1);

          require getenv('EXECUTOR');

          $root = getenv('ROOT');
          try {
              cpanelExecExecute(
                  $root.'/plan.json',
                  $root.'/rejected-profile.json',
                  getenv('ARCHIVE'),
                  getenv('SHARED_ROOT').'/private-bindings.json',
                  getenv('SHARED_ROOT').'/runtime.env',
                  'https://fixture.invalid/readiness',
                  $root.'/rejected-evidence.json',
                  static fn (string $url, string $token): array => [],
              );
              throw new RuntimeException('drifted_profile_incorrectly_accepted');
          } catch (CpanelNoSshDeploymentExecutionException $expected) {
              if (!str_contains($expected->getMessage(), 'profile_operator_capability_verified_rollback_invalid')) {
                  throw $expected;
              }
          }
          PHP

          test ! -e "$ROOT/rejected-evidence.json"
          test "$(realpath "$ACTIVE_POINTER")" = "$before"

      - name: Prove HTTPS fetcher is fail closed on non-HTTPS URLs
        shell: bash
        env:
          EXECUTOR: tools/cpanel/execute-durable-staging-cpanel-no-ssh-deployment.php
        run: |
          set -euo pipefail
          php <<'PHP'
          <?php
          declare(strict_types=1);

          require getenv('EXECUTOR');

          try {
              cpanelExecFetchReadiness('http://example.invalid/readiness', str_repeat('x', 32));
              throw new RuntimeException('http_readiness_incorrectly_accepted');
          } catch (CpanelNoSshDeploymentExecutionException $expected) {
              if ($expected->getMessage() !== 'readiness_url_invalid') {
                  throw $expected;
              }
          }
          PHP

      - name: Prove executor cannot execute schema migration or shell deployment commands
        shell: bash
        run: |
          set -euo pipefail
          executor=tools/cpanel/execute-durable-staging-cpanel-no-ssh-deployment.php
          ! grep -Fq 'artisan migrate' "$executor"
          ! grep -Fq 'Artisan::call' "$executor"
          ! grep -E '(^|[^A-Za-z_])(exec|shell_exec|system|passthru|proc_open|popen)[[:space:]]*\(' "$executor"
          grep -Fq "migration27_execution' => 'NOT_PERFORMED'" "$executor"
          grep -Fq "producer_dispatch' => 'NOT_PERFORMED'" "$executor"

      - name: Prove cPanel operator kit carries Sprint214 executor
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          bash tools/cpanel/build-cpanel-no-ssh-operator-qualification-kit.sh "$head_sha"
          kit_id="cpanel-no-ssh-operator-kit-${head_sha:0:12}"
          unzip -l "dist/${kit_id}.zip" > /tmp/s214-kit-list.txt
          grep -Fq "${kit_id}/tools/cpanel/execute-durable-staging-cpanel-no-ssh-deployment.php" /tmp/s214-kit-list.txt
          grep -Fq "${kit_id}/ops/final-shift-close/DURABLE_STAGING_CPANEL_NO_SSH_GUARDED_DEPLOYMENT_EXECUTION_CONTRACT.json" /tmp/s214-kit-list.txt
          ! grep -Fq '/apps/web/' /tmp/s214-kit-list.txt

      - name: Prove application source remains untouched or exact Sprint220 bounded updater
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- apps/web/database/migrations)"
          if [ "$HEAD_REF" = 'sprint220-governed-cpanel-bootstrap-development-updater' ]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- apps/web | LC_ALL=C sort > /tmp/s220-app-paths
            test -s /tmp/s220-app-paths
            while IFS= read -r changed; do
              case "$changed" in
                apps/web/app/Console/Commands/DiscoverGovernedDevelopmentUpdateCommand.php|apps/web/app/Console/Commands/ProcessGovernedDevelopmentUpdateCommand.php|apps/web/app/Delivery/Http/SystemUpdate/DevelopmentUpdateRequestController.php|apps/web/app/Delivery/Http/SystemUpdate/SystemUpdatePageController.php|apps/web/app/Infrastructure/SystemUpdate/Development/*|apps/web/app/Providers/SystemUpdateServiceProvider.php|apps/web/resources/js/pages/System/UpdateDeployment.vue|apps/web/tests/read-only-update-deployment-ui.php|apps/web/tests/sprint220-governed-development-updater.php)
                  ;;
                *)
                  echo "Unexpected Sprint220 application path: $changed" >&2
                  exit 1
                  ;;
              esac
            done < /tmp/s220-app-paths
          else
            test -z "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- apps/web)"
          fi

      - name: Confirm tracked source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          git diff --exit-code
          test -z "$(git status --porcelain)"
