name: Sprint79 JRN-010 Prerequisite Cash Variance Review Decision Source Regression

# Author by Lab | zefry

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sprint78-jrn010-prerequisite-cash-variance-review-decision-source-regression.yml'
      - 'apps/web/app/Application/Pos/CashVarianceReviewDecisionCommand.php'
      - 'apps/web/app/Application/Pos/CashVarianceReviewDecisionRepository.php'
      - 'apps/web/app/Application/Pos/CashVarianceReviewDecisionResult.php'
      - 'apps/web/app/Application/Pos/RecordCashVarianceReviewDecision.php'
      - 'apps/web/app/Infrastructure/Pos/LaravelCashVarianceReviewDecisionRepository.php'
      - 'apps/web/database/migrations/0000_00_00_000026_create_pos_cash_variance_review_decision_evidence_foundation.php'
      - 'apps/web/tests/pos-cash-variance-review-decision-durable.php'
      - 'apps/web/tests/pos-cash-variance-review-decision-authorization.php'
      - 'docs/JRN_010_PREREQUISITE_CASH_VARIANCE_REVIEW_DECISION_SOURCE_FOUNDATION.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint79-jrn010-variance-review-decision-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sprint79-jrn010-variance-review-decision:
    name: sprint79-jrn010-variance-review-decision
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:cXFxcXFxcXFxcXFxcXFxcXFxcXFxcXFxcXFxcXFxcXE=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      SESSION_DRIVER: array
      CACHE_STORE: array
      ONEQAY_RUNTIME_CLASS: ci
      ONEQAY_PERSISTENCE_ENABLED: 'true'

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce exact Sprint79 source envelope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$base" "$head" | sort > /tmp/s79-source-paths
          count="$(wc -l < /tmp/s79-source-paths)"
          fingerprint="$(sha256sum /tmp/s79-source-paths | awk '{print $1}')"

          if [[ "$count" -eq 2 && "$fingerprint" == '034fdf11410ac54e5b24d5b783d2364c34eadf06e74b57243cce94c523d37396' ]]; then
            grep -Fxq 'apps/web/app/Application/Pos/RecordCashVarianceReviewDecision.php' /tmp/s79-source-paths
            grep -Fxq 'apps/web/tests/pos-cash-variance-review-decision-authorization.php' /tmp/s79-source-paths
            echo 'Recognized exact scoped reviewer-authorization implementation slice.'
          elif [[ "$count" -eq 2 && "$fingerprint" == '00cbf0f3271b3693bf9587b16e43c0f28799b53b95a622331c022c74390af91a' ]]; then
            grep -Fxq '.github/workflows/m7-4-pos-core-synthetic-regression.yml' /tmp/s79-source-paths
            grep -Fxq '.github/workflows/sprint78-jrn010-prerequisite-cash-variance-review-decision-source-regression.yml' /tmp/s79-source-paths
            echo 'Recognized exact reviewer-authorization two-workflow compatibility predecessor.'
          else
            test "$count" -eq 9
            test "$fingerprint" = '890cb08631de804bc2936882f635be11dea52c1e022c4f5112389fd76744ce10'
            grep -Fxq '.github/workflows/sprint78-jrn010-prerequisite-cash-variance-review-decision-source-regression.yml' /tmp/s79-source-paths
            grep -Fxq 'apps/web/app/Application/Pos/CashVarianceReviewDecisionCommand.php' /tmp/s79-source-paths
            grep -Fxq 'apps/web/app/Application/Pos/CashVarianceReviewDecisionRepository.php' /tmp/s79-source-paths
            grep -Fxq 'apps/web/app/Application/Pos/CashVarianceReviewDecisionResult.php' /tmp/s79-source-paths
            grep -Fxq 'apps/web/app/Application/Pos/RecordCashVarianceReviewDecision.php' /tmp/s79-source-paths
            grep -Fxq 'apps/web/app/Infrastructure/Pos/LaravelCashVarianceReviewDecisionRepository.php' /tmp/s79-source-paths
            grep -Fxq 'apps/web/database/migrations/0000_00_00_000026_create_pos_cash_variance_review_decision_evidence_foundation.php' /tmp/s79-source-paths
            grep -Fxq 'apps/web/tests/pos-cash-variance-review-decision-durable.php' /tmp/s79-source-paths
            grep -Fxq 'docs/JRN_010_PREREQUISITE_CASH_VARIANCE_REVIEW_DECISION_SOURCE_FOUNDATION.md' /tmp/s79-source-paths
          fi

          ! grep -Fxq 'apps/web/app/Providers/AppServiceProvider.php' /tmp/s79-source-paths
          ! grep -Fxq 'apps/web/config/oneqay.php' /tmp/s79-source-paths
          ! grep -Fxq 'apps/web/app/Application/Authorization/PosPermission.php' /tmp/s79-source-paths

      - name: Preserve exact migration set through twenty-six
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t migrations < <(find apps/web/database/migrations -maxdepth 1 -type f -name '*.php' -printf '%f\n' | sort)
          test "${#migrations[@]}" -eq 26
          for index in $(seq 1 26); do
            prefix="$(printf '0000_00_00_%06d_' "$index")"
            test "$(printf '%s\n' "${migrations[@]}" | grep -c "^$prefix")" -eq 1
          done
          test "$(printf '%s\n' "${migrations[@]}" | grep -c '^0000_00_00_000026_create_pos_cash_variance_review_decision_evidence_foundation.php$')" -eq 1
          ! printf '%s\n' "${migrations[@]}" | grep -Eq '^0000_00_00_000027_'

      - name: Validate bounded review-decision source locks
        shell: bash
        run: |
          set -euo pipefail
          command='apps/web/app/Application/Pos/CashVarianceReviewDecisionCommand.php'
          port='apps/web/app/Application/Pos/CashVarianceReviewDecisionRepository.php'
          result='apps/web/app/Application/Pos/CashVarianceReviewDecisionResult.php'
          service='apps/web/app/Application/Pos/RecordCashVarianceReviewDecision.php'
          adapter='apps/web/app/Infrastructure/Pos/LaravelCashVarianceReviewDecisionRepository.php'
          migration='apps/web/database/migrations/0000_00_00_000026_create_pos_cash_variance_review_decision_evidence_foundation.php'
          regression='apps/web/tests/pos-cash-variance-review-decision-durable.php'
          auth_regression='apps/web/tests/pos-cash-variance-review-decision-authorization.php'

          grep -Fq "public const REVIEW_ACCEPTED = 'REVIEW_ACCEPTED';" "$command"
          grep -Fq "public const REVIEW_REJECTED = 'REVIEW_REJECTED';" "$command"
          grep -Fq 'cashVarianceExplanationEvidenceId' "$command"
          grep -Fq 'interface CashVarianceReviewDecisionRepository' "$port"
          grep -Fq 'resolveExplanation(' "$port"
          grep -Fq 'final readonly class CashVarianceReviewDecisionResult' "$result"
          grep -Fq 'final readonly class RecordCashVarianceReviewDecision' "$service"
          grep -Fq 'resolveExplanation(' "$service"
          grep -Fq 'hash_equals($context->actorId(), $explanation->actorIdentityId())' "$service"
          grep -Fq 'final readonly class LaravelCashVarianceReviewDecisionRepository' "$adapter"
          grep -Fq "private const TABLE = 'oneqay_pos_cash_variance_review_decision_evidence';" "$adapter"
          grep -Fq "private const EXPLANATION_TABLE = 'oneqay_pos_cash_variance_explanation_evidence';" "$adapter"
          ! grep -Eq -- '->update\(|->delete\(' "$adapter"
          grep -Fq "Schema::create('oneqay_pos_cash_variance_review_decision_evidence'" "$migration"
          grep -Fq 'restrictOnDelete()->restrictOnUpdate()' "$migration"
          grep -Fq 'reviewer_actor_identity_id <> explanation_actor_identity_id' "$migration"
          grep -Fq 'self-review' "$regression"
          grep -Fq 'wrong explanation subject' "$regression"
          grep -Fq 'cross-organization context' "$regression"
          grep -Fq 'cross-outlet context' "$regression"
          grep -Fq 'conflicting operation replay' "$regression"
          grep -Fq 'competing independent decision' "$regression"
          grep -Fq 'cross-tenant operation isolation' "$regression"
          grep -Fq 'REVIEW_REJECTED durable round-trip' "$regression"

          if [[ -f "$auth_regression" ]]; then
            grep -Fq 'DurableScopedAuthorizationPolicy' "$service"
            grep -Fq 'PermissionIdentifier::fromString(self::REVIEW_PERMISSION)' "$service"
            grep -Fq "private const REVIEW_PERMISSION = 'pos.shift.cash-variance-review-decision.record';" "$service"
            grep -Fq 'deny-before-effects ordering' "$auth_regression"
            grep -Fq 'explanation permission substitution' "$auth_regression"
            grep -Fq 'wrong-scope reviewer grant' "$auth_regression"
            grep -Fq "['authorization', 'resolve', 'clock', 'transaction', 'record']" "$auth_regression"
            grep -Fq 'self-review ordering' "$auth_regression"
          fi

          ! grep -Eq '\b(float|double)\b' "$command" "$port" "$result" "$service" "$adapter" "$migration"

      - name: Assert no reviewer runtime binding or permission publication
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq 'CashVarianceReviewDecisionRepository::class' apps/web/app/Providers/AppServiceProvider.php
          ! grep -Fq 'RecordCashVarianceReviewDecision::class' apps/web/app/Providers/AppServiceProvider.php
          ! grep -Fq 'cash_variance_review_decision' apps/web/config/oneqay.php
          ! grep -Fq 'cash-variance-review-decision' apps/web/routes/web.php
          ! grep -Fq 'cash-variance-review' apps/web/app/Application/Authorization/PosPermission.php
          if git grep -nEi 'cash.?variance.?review.?decision' -- apps/web/database/seeders apps/web/database/factories 2>/dev/null; then
            echo 'Unexpected reviewer permission/default-grant delivery source.' >&2
            exit 1
          fi

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          php -l apps/web/app/Application/Pos/CashVarianceReviewDecisionCommand.php
          php -l apps/web/app/Application/Pos/CashVarianceReviewDecisionRepository.php
          php -l apps/web/app/Application/Pos/CashVarianceReviewDecisionResult.php
          php -l apps/web/app/Application/Pos/RecordCashVarianceReviewDecision.php
          php -l apps/web/app/Infrastructure/Pos/LaravelCashVarianceReviewDecisionRepository.php
          php -l apps/web/database/migrations/0000_00_00_000026_create_pos_cash_variance_review_decision_evidence_foundation.php
          php -l apps/web/tests/pos-cash-variance-review-decision-durable.php
          if [[ -f apps/web/tests/pos-cash-variance-review-decision-authorization.php ]]; then
            php -l apps/web/tests/pos-cash-variance-review-decision-authorization.php
          fi

      - name: Install locked dependencies
        working-directory: apps/web
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Reject High or Critical Composer advisories
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          composer audit --locked --format=json > /tmp/oneqay-s79-composer-audit.json
          php -r '
            $data = json_decode(file_get_contents("/tmp/oneqay-s79-composer-audit.json"), true, 512, JSON_THROW_ON_ERROR);
            foreach (($data["advisories"] ?? []) as $items) {
                foreach ($items as $item) {
                    if (in_array(strtolower((string) ($item["severity"] ?? "")), ["high", "critical"], true)) {
                        fwrite(STDERR, "Blocking Composer advisory.\n");
                        exit(1);
                    }
                }
            }
          '

      - name: Run Sprint79 durable reviewer-decision regression
        working-directory: apps/web
        run: php tests/pos-cash-variance-review-decision-durable.php

      - name: Run scoped reviewer authorization regression when published
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f tests/pos-cash-variance-review-decision-authorization.php ]]; then
            php tests/pos-cash-variance-review-decision-authorization.php
          fi

      - name: Preserve canonical explanation and variance regressions at migration twenty-five horizon
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          migration='database/migrations/0000_00_00_000026_create_pos_cash_variance_review_decision_evidence_foundation.php'
          backup='/tmp/oneqay-s79-m26.php'
          cp "$migration" "$backup"
          restore() { [[ ! -f "$backup" ]] || mv "$backup" "$migration"; }
          trap restore EXIT
          rm -f "$migration"
          php tests/pos-cash-variance-explanation-authorization.php
          php tests/pos-cash-variance-explanation-durable.php
          php tests/pos-cash-variance-derivation.php
          restore
          trap - EXIT

      - name: Assert source-foundation lifecycle locks
        shell: bash
        run: |
          set -euo pipefail
          doc='docs/JRN_010_PREREQUISITE_CASH_VARIANCE_REVIEW_DECISION_SOURCE_FOUNDATION.md'
          grep -Fq 'Migration #25: **SOURCE-PUBLISHED ONLY / NOT EXECUTED / NOT APPLIED / NOT ACTIVATED**' "$doc"
          grep -Fq 'Migration #26: **SOURCE-PUBLISHED ONLY / NOT EXECUTED / NOT APPLIED / NOT ACTIVATED**' "$doc"
          grep -Fq 'Technical Preview: **INACTIVE**' "$doc"
          grep -Fq 'Production: **NO-GO**' "$doc"
          grep -Fq 'Updater: **INACTIVE**' "$doc"
          grep -Fq 'JRN-010 Shift Close: **NOT SELECTED**' "$doc"
          grep -Fq 'Reviewer permission: **NOT SELECTED**' "$doc"

      - name: Assert no deployment or migration application authority
        shell: bash
        run: |
          set -euo pipefail
          ! git diff --name-only "${{ github.event.pull_request.base.sha || github.sha }}" "${{ github.event.pull_request.head.sha || github.sha }}" | grep -Eq '(^|/)(deploy|deployment|release|updater)(/|\.|$)'
          echo 'Sprint79 qualification is isolated CI evidence only; no shared migration execution or deployment occurs.'
