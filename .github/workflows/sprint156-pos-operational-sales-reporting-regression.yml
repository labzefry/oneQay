name: Sprint156 POS Operational Sales Reporting Regression

# Attribution: Lab | zefry

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint156-pos-operational-sales-reporting-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  preserve-sprint156-operational-sales-reporting:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      SESSION_DRIVER: array
      CACHE_STORE: array
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Preserve successor-compatible historical regression boundary
        shell: bash
        run: |
          set -euo pipefail
          # Sprint156 is historical after canonical reconciliation. It preserves
          # its owned reporting/security invariants without freezing successor PR shape.
          test -f apps/web/app/Application/Pos/PosOperationalSalesSummary.php
          test -f apps/web/app/Application/Pos/PosOperationalSalesSummaryRepository.php
          test -f apps/web/app/Application/Pos/ViewPosOperationalSalesSummary.php
          test -f apps/web/app/Delivery/Http/Pos/PosOperationalSalesSummaryController.php
          test -f apps/web/app/Infrastructure/Pos/LaravelPosOperationalSalesSummaryRepository.php
          test -f apps/web/app/Providers/PosOperationalReportingServiceProvider.php
          test -f apps/web/config/pos_operational_reporting.php
          test -f apps/web/resources/js/pages/Pos/SalesSummary.vue
          test -f apps/web/tests/pos-operational-reporting.php

      - name: Preserve Final Shift Close operational NO-GO
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" == 'NOT_EXECUTED' ]]
          [[ "$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)" == 'NONE' ]]
          [[ "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.deployment_authority' ops/final-shift-close/STATE.json)" == 'NOT_GRANTED' ]]
          [[ "$(jq -r '.technical_preview_activation' ops/final-shift-close/STATE.json)" == 'NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.production_activation' ops/final-shift-close/STATE.json)" == 'NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.updater_activation' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET' ]]
          [[ "$(jq -r '.selected_target' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'null' ]]
          [[ "$(jq -r '.selection_prerequisite.current_eligibility' ops/final-shift-close/POST_SELECTION_DOWNSTREAM_READINESS.json)" == 'BLOCKED_SELECTION_NOT_PERSISTED' ]]

      - name: Validate PHP runtime and locked dependencies
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php -r 'if (PHP_VERSION_ID < 80200 || PHP_VERSION_ID >= 80600) { fwrite(STDERR, "Sprint156 requires governed PHP 8.2-8.5 compatibility.\n"); exit(1); }'
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          composer audit --locked --no-interaction --abandoned=report

      - name: Validate Sprint156 source and executable regressions
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Application/Pos/PosOperationalSalesSummary.php
          php -l app/Application/Pos/PosOperationalSalesSummaryRepository.php
          php -l app/Application/Pos/ViewPosOperationalSalesSummary.php
          php -l app/Delivery/Http/Pos/PosOperationalSalesSummaryController.php
          php -l app/Infrastructure/Pos/LaravelPosOperationalSalesSummaryRepository.php
          php -l app/Providers/PosOperationalReportingServiceProvider.php
          php -l app/Providers/FinalShiftCloseServiceProvider.php
          php -l config/pos_operational_reporting.php
          composer test
          php tests/pos-operational-reporting.php

      - name: Setup exact Node LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.19.0

      - name: Type-check and build reporting UI
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-fund
          npm run type-check
          npm run build

      - name: Preserve Sprint156 read-only scoped authorization contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "private const VIEW_PERMISSION = 'pos.reporting.sales-summary.view';" apps/web/app/Application/Pos/ViewPosOperationalSalesSummary.php
          grep -Fq "where('tenant_id', \$context->tenantId())" apps/web/app/Infrastructure/Pos/LaravelPosOperationalSalesSummaryRepository.php
          grep -Fq "where('organization_id', \$context->organizationId())" apps/web/app/Infrastructure/Pos/LaravelPosOperationalSalesSummaryRepository.php
          grep -Fq "where('outlet_id', \$context->outletId())" apps/web/app/Infrastructure/Pos/LaravelPosOperationalSalesSummaryRepository.php
          grep -Fq 'currency_scale' apps/web/app/Infrastructure/Pos/LaravelPosOperationalSalesSummaryRepository.php
          grep -Fq 'ONEQAY_POS_OPERATIONAL_REPORTING_ENABLED' apps/web/config/pos_operational_reporting.php
          grep -Fq '$this->app->register(PosOperationalReportingServiceProvider::class);' apps/web/app/Providers/FinalShiftCloseServiceProvider.php
          ! grep -Fq 'PosOperationalReportingServiceProvider' apps/web/bootstrap/providers.php
          ! grep -R -n -E 'insert\(|update\(|delete\(|statement\(' \
            apps/web/app/Application/Pos/PosOperationalSalesSummary.php \
            apps/web/app/Application/Pos/PosOperationalSalesSummaryRepository.php \
            apps/web/app/Application/Pos/ViewPosOperationalSalesSummary.php \
            apps/web/app/Delivery/Http/Pos/PosOperationalSalesSummaryController.php

      - name: Verify tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code

