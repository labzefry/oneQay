name: Sprint156 POS Operational Sales Reporting Regression

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint156-pos-operational-sales-reporting-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify-sprint156-operational-sales-reporting:
    name: qualify-sprint156-operational-sales-reporting
    runs-on: ubuntu-latest
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: "false"
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      SESSION_DRIVER: array
      CACHE_STORE: array
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Lock exact Sprint156 engineering envelope
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          base="${{ github.event.pull_request.base.sha || '4f939acd6cbcc3c49a45cba549a082c789cabd44' }}"
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --name-only "$base" "$head" | LC_ALL=C sort > /tmp/sprint156-paths
          count="$(wc -l < /tmp/sprint156-paths | tr -d ' ')"
          fingerprint="$(sha256sum /tmp/sprint156-paths | awk '{print $1}')"
          [[ "$count" == '16' ]]
          [[ "$fingerprint" == '60cb4694b619112f9e38c0b35cea8b3a1a789f2a0e3a71cf264ec123ac976582' ]]
          cat > /tmp/sprint156-expected <<'EOF'
          .github/workflows/sprint120-final-shift-close-runtime-binding-manifest-writer.yml
          .github/workflows/sprint125-final-shift-close-runtime-db-binding-attestation-control-plane-regression.yml
          .github/workflows/sprint127-final-shift-close-runtime-binding-manifest-control-plane-regression.yml
          .github/workflows/sprint128-final-shift-close-runtime-control-plane-token-character-policy.yml
          .github/workflows/sprint129-final-shift-close-historical-regression-successor-compatibility.yml
          .github/workflows/sprint156-pos-operational-sales-reporting-regression.yml
          apps/web/app/Application/Pos/PosOperationalSalesSummary.php
          apps/web/app/Application/Pos/PosOperationalSalesSummaryRepository.php
          apps/web/app/Application/Pos/ViewPosOperationalSalesSummary.php
          apps/web/app/Delivery/Http/Pos/PosOperationalSalesSummaryController.php
          apps/web/app/Infrastructure/Pos/LaravelPosOperationalSalesSummaryRepository.php
          apps/web/app/Providers/PosOperationalReportingServiceProvider.php
          apps/web/bootstrap/providers.php
          apps/web/config/pos_operational_reporting.php
          apps/web/resources/js/pages/Pos/SalesSummary.vue
          apps/web/tests/pos-operational-reporting.php
          EOF
          diff -u /tmp/sprint156-expected /tmp/sprint156-paths

      - name: Preserve Final Shift Close operational NO-GO
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || '4f939acd6cbcc3c49a45cba549a082c789cabd44' }}"
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --quiet "$base" "$head" -- \
            ops/final-shift-close/STATE.json \
            ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json \
            ops/final-shift-close/POST_SELECTION_DOWNSTREAM_READINESS.json \
            .github/workflows/final-shift-close-migration27-execution.yml \
            .github/workflows/final-shift-close-migration27-selected-target-db-binding.yml
          [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" == 'NOT_EXECUTED' ]]
          [[ "$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)" == 'NONE' ]]
          [[ "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET' ]]
          [[ "$(jq -r '.selected_target' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'null' ]]

      - name: Validate PHP runtime and locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          php -r 'if (PHP_VERSION_ID < 80200 || PHP_VERSION_ID >= 80600) { fwrite(STDERR, "Sprint156 requires governed PHP 8.2-8.5 compatibility.\n"); exit(1); }'
          test -f apps/web/composer.lock
          test -f apps/web/package-lock.json
          cd apps/web
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist

      - name: Validate Sprint156 PHP syntax and executable regression
        shell: bash
        run: |
          set -euo pipefail
          find apps/web/app apps/web/bootstrap apps/web/config apps/web/routes apps/web/tests \
            -type f -name '*.php' -print0 |
            while IFS= read -r -d '' file; do
              php -l "$file"
            done
          cd apps/web
          composer test
          php tests/pos-operational-reporting.php

      - name: Setup exact Node LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.19.0

      - name: Type-check and build reporting UI
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts --no-fund
          npm run type-check
          npm run build

      - name: Prove reporting source remains read-only and fail-closed
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "private const VIEW_PERMISSION = 'pos.reporting.sales-summary.view';" apps/web/app/Application/Pos/ViewPosOperationalSalesSummary.php
          grep -Fq "where('tenant_id', \$context->tenantId())" apps/web/app/Infrastructure/Pos/LaravelPosOperationalSalesSummaryRepository.php
          grep -Fq "where('organization_id', \$context->organizationId())" apps/web/app/Infrastructure/Pos/LaravelPosOperationalSalesSummaryRepository.php
          grep -Fq "where('outlet_id', \$context->outletId())" apps/web/app/Infrastructure/Pos/LaravelPosOperationalSalesSummaryRepository.php
          grep -Fq "ONEQAY_POS_OPERATIONAL_REPORTING_ENABLED" apps/web/config/pos_operational_reporting.php
          ! grep -R -n -E 'insert\(|update\(|delete\(|statement\(' \
            apps/web/app/Application/Pos/PosOperationalSalesSummary.php \
            apps/web/app/Application/Pos/PosOperationalSalesSummaryRepository.php \
            apps/web/app/Application/Pos/ViewPosOperationalSalesSummary.php \
            apps/web/app/Delivery/Http/Pos/PosOperationalSalesSummaryController.php

      - name: Verify tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
