name: Sprint258 Selected Target Generation Successor Compatibility Generator

# Attribution: Lab | zefry

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: sprint258-selected-target-generation-successor-compatibility-generator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  generate-compatibility-patch:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'sprint258-selected-target-generation-successor-compatibility' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Checkout exact compatibility branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: sprint258-selected-target-generation-successor-compatibility
          fetch-depth: 0
          persist-credentials: true

      - name: Rewrite only retired selected-target generation assertions
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import json
          import re

          workflows = Path('.github/workflows')
          generator = workflows / 'sprint258-selected-target-generation-successor-compatibility-generator.yml'
          selection_path = 'ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json'

          retired = {
              '.selected_target.exact_running_source_commit': (
                  '59b42137eed717aacc82080a46753440bb4d8537',
                  'selected_target_source',
                  r'^[0-9a-f]{40}$',
              ),
              '.selected_target.exact_running_artifact_sha256': (
                  '8ad4a33196eabd6248c9dfb35eb118e97759e5c17b32384a12b120258bce615c',
                  'selected_target_artifact',
                  r'^[0-9a-f]{64}$',
              ),
              '.selected_target.readiness_attestation_sha256': (
                  '4a0772838f25d7ee3a7d57153f76b3b23f5d4722c644a76c287b5005e9c328b2',
                  'selected_target_readiness',
                  r'^[0-9a-f]{64}$',
              ),
              '.selected_target.selection_fingerprint_sha256': (
                  '6ecc487cb144e634455de69cc43aa39b1f6880a2256c4b1ab33387096513772b',
                  'selected_target_fingerprint',
                  r'^[0-9a-f]{64}$',
              ),
              '.selected_target.trusted_ingestion.run_id': (
                  '36008213090',
                  'selected_target_ingestion_run',
                  r'^[1-9][0-9]*$',
              ),
              '.selected_target.trusted_ingestion.ingestion_fingerprint_sha256': (
                  'a007a97b0b822895ffcdc3453594dae7d4a3f5dab1358390f030c7793b7c79fb',
                  'selected_target_ingestion_fingerprint',
                  r'^[0-9a-f]{64}$',
              ),
          }

          assertion_markers = ('test ', '[[', 'jq ', 'grep ', '=~', '!=', '==')
          changed = []
          replacements = {field: 0 for field in retired}
          unresolved = []

          for path in sorted(list(workflows.glob('*.yml')) + list(workflows.glob('*.yaml'))):
              if path == generator:
                  continue

              lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
              out = []
              touched = False

              for line in lines:
                  stripped = line.lstrip()
                  replaced = False

                  if stripped.startswith('#'):
                      out.append(line)
                      continue

                  for field, (literal, variable, shape) in retired.items():
                      if literal not in line:
                          continue

                      if field in line and any(marker in line for marker in assertion_markers):
                          indent = line[:len(line) - len(stripped)]
                          newline = '\n' if line.endswith('\n') else ''
                          out.append(
                              f"{indent}{variable}=\"$(jq -r '{field}' {selection_path})\"; "
                              f"[[ \"${variable}\" =~ {shape} ]]{newline}"
                          )
                          replacements[field] += 1
                          touched = True
                          replaced = True
                          break

                      if any(marker in line for marker in assertion_markers):
                          unresolved.append((str(path), field, line.rstrip()))

                  if not replaced:
                      out.append(line)

              if touched:
                  path.write_text(''.join(out), encoding='utf-8')
                  changed.append(str(path))

          if unresolved:
              details = '\n'.join(f'{p}: {field}: {line}' for p, field, line in unresolved[:20])
              raise SystemExit('Retired generation literal found in an assertion that could not be classified:\n' + details)

          if not changed:
              raise SystemExit('No historical workflow generation assertions were updated.')

          if replacements['.selected_target.selection_fingerprint_sha256'] == 0:
              raise SystemExit('No retired selected-target fingerprint assertions were updated.')

          report = {
              'schema_version': 1,
              'feature': 'final-shift-close',
              'sprint': 258,
              'bounded_objective': 'SELECTED_TARGET_GENERATION_SUCCESSOR_COMPATIBILITY',
              'compatibility_state': 'RETIRED_GENERATION_PIN_REMOVED_FROM_HISTORICAL_RUNTIME_ASSERTIONS',
              'historical_workflows_updated': len(changed),
              'replacement_counts': replacements,
              'stable_invariants': {
                  'selection_state': 'SELECTED_NOT_AUTHORIZED',
                  'environment_id': 'oneqay-durable-staging-01',
                  'runtime_class': 'durable-staging',
                  'generation_fields': 'STRUCTURAL_VALIDITY_IN_HISTORICAL_WORKFLOWS_EXACT_BINDING_IN_ACTIVE_GENERATION_GATE'
              },
              'operational_boundaries': {
                  'target_reselection': 'NOT_PERFORMED',
                  'feature_activation_mutation': 'NOT_PERFORMED',
                  'migration27_replay': 'NOT_PERFORMED',
                  'permission_reprovisioning': 'NOT_PERFORMED',
                  'technical_preview_activation': 'NOT_AUTHORIZED',
                  'production_activation': 'NOT_AUTHORIZED',
                  'updater_activation': 'INACTIVE',
                  'producer_dispatch': 'NOT_PERFORMED'
              },
              'attribution': 'Author by Lab | zefry'
          }

          Path('ops/final-shift-close/SELECTED_TARGET_GENERATION_SUCCESSOR_COMPATIBILITY_CONTRACT.json').write_text(
              json.dumps(report, indent=2) + '\n', encoding='utf-8'
          )
          Path('ops/final-shift-close/SELECTED_TARGET_GENERATION_SUCCESSOR_COMPATIBILITY_PATHS.txt').write_text(
              '\n'.join(changed) + '\n', encoding='utf-8'
          )
          print(json.dumps(report, indent=2))
          PY

      - name: Materialize permanent Sprint258 regression and documentation
        shell: bash
        run: |
          set -euo pipefail

          cat > .github/workflows/sprint258-selected-target-generation-successor-compatibility-regression.yml <<'EOF'
          name: Sprint258 Selected Target Generation Successor Compatibility Regression

          # Attribution: Lab | zefry

          on:
            pull_request:
              branches:
                - main

          permissions:
            contents: read

          concurrency:
            group: sprint258-selected-target-generation-successor-compatibility-regression-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: true

          jobs:
            qualify-successor-compatible-selected-target-generation:
              runs-on: ubuntu-latest
              timeout-minutes: 12
              steps:
                - name: Checkout exact PR source
                  uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
                  with:
                    ref: ${{ github.event.pull_request.head.sha }}
                    fetch-depth: 0

                - name: Validate stable target identity and generation shape
                  shell: bash
                  run: |
                    set -euo pipefail
                    selection=ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json
                    state=ops/final-shift-close/STATE.json
                    test "$(jq -r '.selection_state' "$selection")" = SELECTED_NOT_AUTHORIZED
                    test "$(jq -r '.selected_target.environment_id' "$selection")" = oneqay-durable-staging-01
                    test "$(jq -r '.selected_target.runtime_class' "$selection")" = durable-staging
                    source="$(jq -r '.selected_target.exact_running_source_commit' "$selection")"; [[ "$source" =~ ^[0-9a-f]{40}$ ]]
                    artifact="$(jq -r '.selected_target.exact_running_artifact_sha256' "$selection")"; [[ "$artifact" =~ ^[0-9a-f]{64}$ ]]
                    readiness="$(jq -r '.selected_target.readiness_attestation_sha256' "$selection")"; [[ "$readiness" =~ ^[0-9a-f]{64}$ ]]
                    fingerprint="$(jq -r '.selected_target.selection_fingerprint_sha256' "$selection")"; [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]]
                    ingestion_run="$(jq -r '.selected_target.trusted_ingestion.run_id' "$selection")"; [[ "$ingestion_run" =~ ^[1-9][0-9]*$ ]]
                    ingestion_fp="$(jq -r '.selected_target.trusted_ingestion.ingestion_fingerprint_sha256' "$selection")"; [[ "$ingestion_fp" =~ ^[0-9a-f]{64}$ ]]
                    test "$(jq -r '.deployment_authority' "$state")" = NOT_GRANTED
                    test "$(jq -r '.technical_preview_activation' "$state")" = NOT_AUTHORIZED
                    test "$(jq -r '.production_activation' "$state")" = NOT_AUTHORIZED
                    test "$(jq -r '.updater_activation' "$state")" = INACTIVE

                - name: Prove retired generation is not asserted as current selected target
                  shell: bash
                  run: |
                    set -euo pipefail
                    python3 <<'PY'
                    from pathlib import Path

                    retired = {
                        '.selected_target.exact_running_source_commit': '59b42137eed717aacc82080a46753440bb4d8537',
                        '.selected_target.exact_running_artifact_sha256': '8ad4a33196eabd6248c9dfb35eb118e97759e5c17b32384a12b120258bce615c',
                        '.selected_target.readiness_attestation_sha256': '4a0772838f25d7ee3a7d57153f76b3b23f5d4722c644a76c287b5005e9c328b2',
                        '.selected_target.selection_fingerprint_sha256': '6ecc487cb144e634455de69cc43aa39b1f6880a2256c4b1ab33387096513772b',
                        '.selected_target.trusted_ingestion.run_id': '36008213090',
                        '.selected_target.trusted_ingestion.ingestion_fingerprint_sha256': 'a007a97b0b822895ffcdc3453594dae7d4a3f5dab1358390f030c7793b7c79fb',
                    }
                    failures = []
                    for path in sorted(Path('.github/workflows').glob('*.y*ml')):
                        for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                            stripped = line.lstrip()
                            if stripped.startswith('#'):
                                continue
                            for field, literal in retired.items():
                                if field in line and literal in line:
                                    failures.append(f'{path}:{number}:{field}')
                    if failures:
                        raise SystemExit('Retired current-generation assertions remain:\n' + '\n'.join(failures[:40]))
                    PY

                - name: Validate Sprint258 contract and path manifest
                  shell: bash
                  run: |
                    set -euo pipefail
                    contract=ops/final-shift-close/SELECTED_TARGET_GENERATION_SUCCESSOR_COMPATIBILITY_CONTRACT.json
                    paths=ops/final-shift-close/SELECTED_TARGET_GENERATION_SUCCESSOR_COMPATIBILITY_PATHS.txt
                    jq -e '
                      .schema_version == 1 and
                      .feature == "final-shift-close" and
                      .sprint == 258 and
                      .bounded_objective == "SELECTED_TARGET_GENERATION_SUCCESSOR_COMPATIBILITY" and
                      .compatibility_state == "RETIRED_GENERATION_PIN_REMOVED_FROM_HISTORICAL_RUNTIME_ASSERTIONS" and
                      (.historical_workflows_updated > 0) and
                      .stable_invariants.selection_state == "SELECTED_NOT_AUTHORIZED" and
                      .stable_invariants.environment_id == "oneqay-durable-staging-01" and
                      .stable_invariants.runtime_class == "durable-staging" and
                      .operational_boundaries.target_reselection == "NOT_PERFORMED" and
                      .operational_boundaries.feature_activation_mutation == "NOT_PERFORMED" and
                      .operational_boundaries.migration27_replay == "NOT_PERFORMED" and
                      .operational_boundaries.permission_reprovisioning == "NOT_PERFORMED" and
                      .operational_boundaries.technical_preview_activation == "NOT_AUTHORIZED" and
                      .operational_boundaries.production_activation == "NOT_AUTHORIZED" and
                      .operational_boundaries.updater_activation == "INACTIVE" and
                      .operational_boundaries.producer_dispatch == "NOT_PERFORMED" and
                      .attribution == "Author by Lab | zefry"
                    ' "$contract" >/dev/null
                    test -s "$paths"
                    test "$(wc -l < "$paths")" = "$(jq -r '.historical_workflows_updated' "$contract")"
                    while IFS= read -r path; do test -f "$path"; done < "$paths"

                - name: Verify tracked source cleanliness
                  shell: bash
                  run: |
                    set -euo pipefail
                    git diff --exit-code
                    git diff --cached --exit-code

          # Author by Lab | zefry
          EOF

          cat > docs/SPRINT258_SELECTED_TARGET_GENERATION_SUCCESSOR_COMPATIBILITY.md <<'EOF'
          # Sprint258 — Selected-Target Generation Successor Compatibility

          Author by Lab | zefry

          Sprint258 removes historical CI coupling that treated one prior durable-staging selected-target generation as immutable forever.

          Stable target identity remains governed and unchanged: environment `oneqay-durable-staging-01`, runtime class `durable-staging`, and selection state `SELECTED_NOT_AUTHORIZED`. Historical workflows keep those stable invariants while generation-specific fields are checked for canonical structural shape. Exact binding of a newly proposed generation remains fail-closed in the active post-activation generation gate.

          This compatibility pass performs no target reselection, runtime mutation, feature activation mutation, migration replay, permission reprovisioning, Technical Preview activation, Production deployment or activation, updater activation, or producer dispatch. Historical documents and machine-readable historical contracts remain provenance and are not rewritten.
          EOF

      - name: Remove one-shot bootstrap artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/sprint258-selected-target-generation-successor-compatibility-generator.yml
          rm -f ops/final-shift-close/SPRINT258_GENERATOR_TRIGGER.txt

      - name: Validate generated compatibility tree
        shell: bash
        run: |
          set -euo pipefail
          test -s ops/final-shift-close/SELECTED_TARGET_GENERATION_SUCCESSOR_COMPATIBILITY_PATHS.txt
          jq -e '.historical_workflows_updated > 0' ops/final-shift-close/SELECTED_TARGET_GENERATION_SUCCESSOR_COMPATIBILITY_CONTRACT.json >/dev/null
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].each { |f| YAML.load_file(f) }'
          test -f .github/workflows/sprint258-selected-target-generation-successor-compatibility-regression.yml
          test -f docs/SPRINT258_SELECTED_TARGET_GENERATION_SUCCESSOR_COMPATIBILITY.md
          test ! -e .github/workflows/sprint258-selected-target-generation-successor-compatibility-generator.yml
          test ! -e ops/final-shift-close/SPRINT258_GENERATOR_TRIGGER.txt
          git status --short

      - name: Commit generated successor compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Lab | zefry'
          git config user.email 'lab.zefry@users.noreply.github.com'
          git add -A
          git commit -m 'Sprint258: make selected-target generation successor-compatible' -m 'Author by Lab | zefry' -m '[compat-generated]'
          git push origin HEAD:sprint258-selected-target-generation-successor-compatibility
