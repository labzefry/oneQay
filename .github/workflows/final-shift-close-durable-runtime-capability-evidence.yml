name: Final Shift Close Durable Runtime Capability Evidence

# Attribution: Lab | zefry

on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  EVIDENCE_STATUS_CONTEXT: final-shift-close-durable-runtime-capability-evidence
  PRODUCER_ENVIRONMENT: final-shift-close-durable-runtime-capability-evidence
  PRODUCER_WORKFLOW_PATH: .github/workflows/final-shift-close-durable-runtime-capability-evidence.yml
  EVIDENCE_ARTIFACT_NAME: final-shift-close-durable-runtime-capability-evidence
  TARGET_SELECTION_FILE: ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json

concurrency:
  group: final-shift-close-durable-runtime-capability-evidence
  cancel-in-progress: false

jobs:
  produce-target-bound-capability-evidence:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: final-shift-close-durable-runtime-capability-evidence
    env:
      CAPABILITY_EVIDENCE_URL: ${{ secrets.ONEQAY_DURABLE_RUNTIME_CAPABILITY_EVIDENCE_URL }}
      CAPABILITY_EVIDENCE_TOKEN: ${{ secrets.ONEQAY_DURABLE_RUNTIME_CAPABILITY_EVIDENCE_TOKEN }}
      ENVIRONMENT_PROTECTION_ASSERTION: ${{ secrets.ONEQAY_DURABLE_RUNTIME_CAPABILITY_EVIDENCE_PROTECTION_ASSERTION }}
      EXPECTED_ENVIRONMENT_ID: ${{ vars.ONEQAY_DURABLE_RUNTIME_ENVIRONMENT_ID }}
      EXPECTED_RUNTIME_CLASS: ${{ vars.ONEQAY_DURABLE_RUNTIME_CLASS }}

    steps:
      - name: Checkout canonical producer source only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate canonical source protected environment and persisted target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_REPOSITORY" == 'labzefry/oneQay' ]]
          [[ "$CAPABILITY_EVIDENCE_URL" =~ ^https://[^[:space:]]+$ ]]
          [[ -n "$CAPABILITY_EVIDENCE_TOKEN" ]]
          [[ "$ENVIRONMENT_PROTECTION_ASSERTION" == 'REVIEW_GATED_V1' ]]
          [[ "$EXPECTED_ENVIRONMENT_ID" =~ ^[a-z0-9][a-z0-9._:-]{7,127}$ ]]
          [[ "$EXPECTED_RUNTIME_CLASS" =~ ^[a-z0-9][a-z0-9._:-]{7,127}$ ]]

          main_sha="$(curl --fail-with-body --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$API_URL/repos/$REPOSITORY/branches/main" | jq -r '.commit.sha')"
          [[ "$main_sha" == "$GITHUB_SHA" ]]

          jq -e '.schema_version == 1 and .feature == "final-shift-close"' "$TARGET_SELECTION_FILE" >/dev/null
          [[ "$(jq -r '.selection_state' "$TARGET_SELECTION_FILE")" == 'SELECTED_NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.selected_target | type' "$TARGET_SELECTION_FILE")" == 'object' ]]
          [[ "$(jq -r '.selected_target.environment_id' "$TARGET_SELECTION_FILE")" == "$EXPECTED_ENVIRONMENT_ID" ]]
          [[ "$(jq -r '.selected_target.runtime_class' "$TARGET_SELECTION_FILE")" == "$EXPECTED_RUNTIME_CLASS" ]]
          jq -e '.selected_target.trusted_ingestion_run_id | type == "number" and . > 0' "$TARGET_SELECTION_FILE" >/dev/null
          jq -e '.selected_target.trusted_ingestion_run_attempt | type == "number" and . > 0' "$TARGET_SELECTION_FILE" >/dev/null
          jq -e '.selected_target.trusted_ingestion_fingerprint_sha256 | type == "string" and test("^[0-9a-f]{64}$")' "$TARGET_SELECTION_FILE" >/dev/null

      - name: Fetch authenticated target-bound capability observations
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          curl \
            --proto '=https' \
            --tlsv1.2 \
            --connect-timeout 5 \
            --max-time 20 \
            --fail-with-body \
            --silent \
            --show-error \
            --header 'Accept: application/json' \
            --header "Authorization: Bearer $CAPABILITY_EVIDENCE_TOKEN" \
            "$CAPABILITY_EVIDENCE_URL" > /tmp/capability-evidence-input.json
          bytes="$(wc -c < /tmp/capability-evidence-input.json)"
          (( bytes > 1 && bytes <= 65536 ))
          jq -e '
            type == "object" and
            (.attestation | type == "object") and
            (.observations | type == "object") and
            (.secrets_embedded == false)
          ' /tmp/capability-evidence-input.json >/dev/null

      - name: Produce and qualify exact target-bound capability evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/final-shift-close-capability-evidence
          INPUT_FILE=/tmp/capability-evidence-input.json \
          TARGET_SELECTION_FILE="$TARGET_SELECTION_FILE" \
          EVIDENCE_FILE=/tmp/final-shift-close-capability-evidence/evidence.json \
          ATTESTATION_FILE=/tmp/final-shift-close-capability-evidence/attestation.json \
          PRODUCER_FILE=/tmp/final-shift-close-capability-evidence/producer.json \
          PRODUCER_SOURCE_COMMIT="$GITHUB_SHA" \
          PRODUCER_RUN_ID="$GITHUB_RUN_ID" \
          PRODUCER_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
          php <<'PHP'
          <?php
          declare(strict_types=1);

          require __DIR__.'/apps/web/app/Application/Pos/FinalShiftCloseDurableRuntimeReadiness.php';
          require __DIR__.'/apps/web/app/Application/Pos/FinalShiftCloseDurableRuntimeTargetSelection.php';
          require __DIR__.'/apps/web/app/Application/Pos/FinalShiftCloseDurableRuntimeCapabilityEvidence.php';
          require __DIR__.'/apps/web/app/Application/Pos/FinalShiftCloseDurableRuntimeCapabilityEvidenceProducer.php';

          use App\Application\Pos\FinalShiftCloseDurableRuntimeCapabilityEvidence;
          use App\Application\Pos\FinalShiftCloseDurableRuntimeCapabilityEvidenceProducer;
          use App\Application\Pos\FinalShiftCloseDurableRuntimeReadiness;
          use App\Application\Pos\FinalShiftCloseDurableRuntimeTargetSelection;

          $readJson = static function (string $path): array {
              $raw = file_get_contents($path);
              if ($raw === false) {
                  throw new RuntimeException('Required producer input cannot be read.');
              }
              $decoded = json_decode($raw, true, 32, JSON_THROW_ON_ERROR);
              if (!is_array($decoded)) {
                  throw new RuntimeException('Required producer input must decode to an object.');
              }
              return $decoded;
          };

          $input = $readJson((string) getenv('INPUT_FILE'));
          $persisted = $readJson((string) getenv('TARGET_SELECTION_FILE'));
          $attestation = is_array($input['attestation'] ?? null) ? $input['attestation'] : [];
          $observations = is_array($input['observations'] ?? null) ? $input['observations'] : [];

          $readiness = new FinalShiftCloseDurableRuntimeReadiness();
          $selector = new FinalShiftCloseDurableRuntimeTargetSelection($readiness);
          $qualifier = new FinalShiftCloseDurableRuntimeCapabilityEvidence($readiness, $selector);
          $producer = new FinalShiftCloseDurableRuntimeCapabilityEvidenceProducer($qualifier);
          $selection = $selector->select($attestation);

          if (($persisted['selection_state'] ?? null) !== FinalShiftCloseDurableRuntimeTargetSelection::SELECTION_STATE) {
              throw new RuntimeException('Persisted target is not SELECTED_NOT_AUTHORIZED.');
          }
          $persistedTarget = is_array($persisted['selected_target'] ?? null) ? $persisted['selected_target'] : [];
          foreach (['environment_id','runtime_class','exact_running_source_commit','exact_running_artifact_sha256','readiness_attestation_sha256'] as $field) {
              if (($persistedTarget[$field] ?? null) !== ($selection['selected_target'][$field] ?? null)) {
                  throw new RuntimeException('Persisted selected target does not match recomputed Sprint111 identity: '.$field);
              }
          }

          $package = $producer->produce($selection, $attestation, $observations);
          $evidence = $package['evidence'];
          $producerRecord = [
              'schema_version' => 1,
              'feature' => 'final-shift-close',
              'producer_state' => $package['producer_state'],
              'producer_repository' => 'labzefry/oneQay',
              'producer_workflow_path' => '.github/workflows/final-shift-close-durable-runtime-capability-evidence.yml',
              'producer_environment' => 'final-shift-close-durable-runtime-capability-evidence',
              'producer_source_commit' => getenv('PRODUCER_SOURCE_COMMIT'),
              'producer_run_id' => (int) getenv('PRODUCER_RUN_ID'),
              'producer_run_attempt' => (int) getenv('PRODUCER_RUN_ATTEMPT'),
              'target_binding_sha256' => $evidence['target_binding_sha256'],
              'capability_evidence_bundle_sha256' => $package['qualification']['capability_evidence_bundle_sha256'],
              'producer_fingerprint_sha256' => $package['producer_fingerprint_sha256'],
              'activation_authority_state' => 'NOT_GRANTED',
              'feature_activation_state' => 'INACTIVE',
              'runtime_allowlist_change' => 'NOT_IMPLEMENTED',
              'secrets_embedded' => false,
          ];

          file_put_contents((string) getenv('EVIDENCE_FILE'), json_encode($evidence, JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE|JSON_THROW_ON_ERROR)."\n", LOCK_EX);
          file_put_contents((string) getenv('ATTESTATION_FILE'), json_encode($attestation, JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE|JSON_THROW_ON_ERROR)."\n", LOCK_EX);
          file_put_contents((string) getenv('PRODUCER_FILE'), json_encode($producerRecord, JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES|JSON_UNESCAPED_UNICODE|JSON_THROW_ON_ERROR)."\n", LOCK_EX);
          PHP

          for f in attestation.json evidence.json producer.json; do
            jq -e 'type == "object"' "/tmp/final-shift-close-capability-evidence/$f" >/dev/null
            (( $(wc -c < "/tmp/final-shift-close-capability-evidence/$f") <= 32768 ))
            ! grep -Fq "$CAPABILITY_EVIDENCE_TOKEN" "/tmp/final-shift-close-capability-evidence/$f"
          done
          echo "running_source=$(jq -r '.exact_running_source_commit' /tmp/final-shift-close-capability-evidence/attestation.json)" >> "$GITHUB_OUTPUT"

      - name: Publish pending capability evidence status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          RUNNING_SOURCE: ${{ steps.evidence.outputs.running_source }}
        run: |
          set -euo pipefail
          payload="$(jq -n --arg state pending --arg context "$EVIDENCE_STATUS_CONTEXT" --arg description 'Target-bound capability evidence is being published' --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail-with-body --silent --show-error --request POST --header 'Accept: application/vnd.github+json' --header "Authorization: Bearer $GH_TOKEN" --header 'X-GitHub-Api-Version: 2022-11-28' "$API_URL/repos/$REPOSITORY/statuses/$RUNNING_SOURCE" --data "$payload" >/dev/null

      - name: Upload trusted target-bound capability evidence bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-shift-close-durable-runtime-capability-evidence
          path: /tmp/final-shift-close-capability-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Publish success capability evidence status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
          RUNNING_SOURCE: ${{ steps.evidence.outputs.running_source }}
        run: |
          set -euo pipefail
          payload="$(jq -n --arg state success --arg context "$EVIDENCE_STATUS_CONTEXT" --arg description 'Target-bound capability evidence verified and published' --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail-with-body --silent --show-error --request POST --header 'Accept: application/vnd.github+json' --header "Authorization: Bearer $GH_TOKEN" --header 'X-GitHub-Api-Version: 2022-11-28' "$API_URL/repos/$REPOSITORY/statuses/$RUNNING_SOURCE" --data "$payload" >/dev/null

# Author by Lab | zefry
