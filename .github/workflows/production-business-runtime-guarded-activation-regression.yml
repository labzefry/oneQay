name: Production Business Runtime Guarded Activation Regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-business-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
      - name: Show PHP runtime
        run: php -v
      - name: PHP syntax for all first-party application classes
        run: find apps/web/app -type f -name '*.php' -print0 | xargs -0 -n 1 php -l >/tmp/oneqay-lint.log && tail -n 2 /tmp/oneqay-lint.log
      - name: Lint non-deploying operator runtime gate
        run: php -l tools/production/ProductionBusinessRuntimeGate.php
      - name: Reject non-authorized production traffic
        run: php apps/web/tests/production-business-runtime-gate.php
      - name: Preserve specialized governance boundaries
        run: |
          grep -Fq "['local', 'test', 'ci']" apps/web/app/Console/Commands/MerchantContextBootstrapCommand.php
          grep -Fq "['local', 'test', 'testing', 'ci']" apps/web/app/Application/Preview/TechnicalPreviewRuntimePolicy.php
          grep -Fq "['local', 'test', 'ci']" apps/web/app/Providers/FinalShiftCloseServiceProvider.php
          grep -Fq "['local', 'test', 'ci']" apps/web/routes/console.php
          grep -Fq 'final class ProductionBusinessRuntimeGate' tools/production/ProductionBusinessRuntimeGate.php
          grep -Fq 'business_runtime_activation_ready' apps/web/app/Infrastructure/Runtime/ProductionBusinessRuntimeGate.php
          grep -Fq "['local', 'test', 'ci']" apps/web/routes/web.php
