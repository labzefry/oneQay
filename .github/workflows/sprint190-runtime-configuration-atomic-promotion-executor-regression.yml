# Author by Lab | zefry
name: Sprint190 Runtime Configuration Atomic Promotion Executor Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint190-runtime-configuration-atomic-promotion-executor-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify-sprint190-runtime-configuration-atomic-promotion-executor:
    name: qualify-sprint190-runtime-configuration-atomic-promotion-executor
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      APP_DEBUG: "false"
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      SESSION_DRIVER: array
      CACHE_STORE: array
      LOG_CHANNEL: stderr
      ONEQAY_BUILD_PROVENANCE: github-actions:${{ github.run_id }}:${{ github.run_attempt }}

    steps:
      - name: Checkout exact Sprint190 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Qualify exact Sprint190 engineering envelope
        if: github.event_name == 'pull_request' && github.head_ref == 'sprint190-runtime-configuration-atomic-promotion-executor'
        shell: bash
        env:
          EXPECTED_PATH_HASH: 3efa46f499d6f2df2d5b64f31eb35630366e43e6b037213297e3457bf0170d7f
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          mapfile -t paths < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | LC_ALL=C sort)
          expected=(
            ".github/workflows/m7-5-preview-release-artifact.yml"
            ".github/workflows/sprint190-runtime-configuration-atomic-promotion-executor-regression.yml"
            ".github/workflows/sprint32-authentication-recovery-proof-regression.yml"
            ".github/workflows/sprint33-recovery-bound-password-reset-regression.yml"
            ".github/workflows/sprint34-authenticated-password-change-regression.yml"
            "apps/web/app/Infrastructure/Installation/PrebootRuntimeConfigurationPromotionExecution.php"
            "apps/web/tests/preboot-runtime-configuration-promotion-execution.php"
            "tools/build-m7-5-preview-release.sh"
            "tools/installation/runtime-configuration-promotion-execution.schema.json"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${paths[@]}")
          actual_hash="$(printf '%s\n' "${paths[@]}" | sha256sum | awk '{print $1}')"
          test "$actual_hash" = "$EXPECTED_PATH_HASH"

      - name: Preserve operational NO-GO
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" =~ ^(NOT_EXECUTED|EXECUTED)$ ]]
          permission_state="$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)"; [[ "$permission_state" =~ ^(NONE|PROVISIONED)$ ]]; if [[ "$permission_state" == 'PROVISIONED' ]]; then [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" == 'EXECUTED' ]]; fi
          test "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" = INACTIVE || test "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" = ACTIVE
          test "$(jq -r '.deployment_authority' ops/final-shift-close/STATE.json)" = NOT_GRANTED
          test "$(jq -r '.technical_preview_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
          test "$(jq -r '.production_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
          test "$(jq -r '.updater_activation' ops/final-shift-close/STATE.json)" = INACTIVE
          test "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = SELECTED_NOT_AUTHORIZED
          test "$(jq -r '.selected_target.environment_id' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = 'oneqay-durable-staging-01'
          test "$(jq -r '.selected_target.runtime_class' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = 'durable-staging'
          test "$(jq -r '.selected_target.selection_fingerprint_sha256' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = '6ecc487cb144e634455de69cc43aa39b1f6880a2256c4b1ab33387096513772b'

      - name: Setup PHP 8.3 runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Setup exact Node LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.19.0

      - name: Validate Sprint190 source and execution schema
        shell: bash
        run: |
          set -euo pipefail
          php -l apps/web/app/Infrastructure/Installation/PrebootRuntimeConfigurationPromotionExecution.php
          php -l apps/web/tests/preboot-runtime-configuration-promotion-execution.php
          bash -n tools/build-m7-5-preview-release.sh
          jq -e '.properties.execution_state.const == "RUNTIME_CONFIGURATION_PROMOTED_NOT_ACTIVATED"' tools/installation/runtime-configuration-promotion-execution.schema.json
          jq -e '.properties.technical_preview_authorized.const == false' tools/installation/runtime-configuration-promotion-execution.schema.json
          jq -e '.properties.production_authorized.const == false' tools/installation/runtime-configuration-promotion-execution.schema.json
          jq -e '.properties.pending_environment_state.const == "REMOVED_AFTER_VERIFIED_PROMOTION"' tools/installation/runtime-configuration-promotion-execution.schema.json

      - name: Install locked application dependencies
        working-directory: apps/web
        run: |
          set -euo pipefail
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          npm ci --ignore-scripts --no-fund
          npm run type-check
          npm run build

      - name: Preserve Sprint184 through Sprint189 installation regressions
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php -d zend.assertions=1 -d assert.exception=1 tests/preboot-installation-configuration.php
          php -d zend.assertions=1 -d assert.exception=1 tests/preboot-database-compatibility-verification.php
          php -d zend.assertions=1 -d assert.exception=1 tests/preboot-installation-activation-readiness.php
          php -d zend.assertions=1 -d assert.exception=1 tests/preboot-runtime-configuration-promotion-request.php
          php -d zend.assertions=1 -d assert.exception=1 tests/preboot-runtime-configuration-promotion-qualification.php
          php -d zend.assertions=1 -d assert.exception=1 tests/preboot-runtime-configuration-promotion-readiness.php

      - name: Execute Sprint190 atomic promotion executor regression
        working-directory: apps/web
        run: php -d zend.assertions=1 -d assert.exception=1 tests/preboot-runtime-configuration-promotion-execution.php

      - name: Build governed release with dormant Sprint190 executor
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          bash tools/build-m7-5-preview-release.sh "$HEAD_SHA"
          release_id="m75-preview-${HEAD_SHA:0:12}"
          artifact="dist/${release_id}.tar.gz"
          test -f "$artifact"

          tar -tzf "$artifact" > /tmp/oneqay-s190-release-list.txt
          grep -Fxq "$release_id/apps/web/app/Infrastructure/Installation/PrebootRuntimeConfigurationPromotionExecution.php" /tmp/oneqay-s190-release-list.txt
          grep -Fxq "$release_id/installation/runtime-configuration-promotion-execution.schema.json" /tmp/oneqay-s190-release-list.txt
          ! grep -F '/apps/web/database/migrations/' /tmp/oneqay-s190-release-list.txt

          tar -xOzf "$artifact" "$release_id/RELEASE.json" > /tmp/oneqay-s190-release.json
          grep -Fq '"promotion_execution_receipt_relative_path": "oneqay-preview/shared/install/runtime-configuration-promotion-execution.json"' /tmp/oneqay-s190-release.json
          grep -Fq '"promotion_execution_schema_relative_path": "installation/runtime-configuration-promotion-execution.schema.json"' /tmp/oneqay-s190-release.json
          grep -Fq '"promotion_execution_state": "NOT_EXECUTED"' /tmp/oneqay-s190-release.json
          grep -Fq '"activation_authorized": false' /tmp/oneqay-s190-release.json

          tar -xOzf "$artifact" "$release_id/public-surface/install.php" > /tmp/oneqay-s190-install.php
          if grep -Fq 'execute_runtime_promotion' /tmp/oneqay-s190-install.php; then
            grep -Fq '"promotion_executor_registration_state": "REGISTERED_GUARDED_OPERATOR_ACTION"' /tmp/oneqay-s190-release.json
            grep -Fq '"promotion_operator_action": "execute_runtime_promotion"' /tmp/oneqay-s190-release.json
            grep -Fq '"promotion_operator_confirmation_required": true' /tmp/oneqay-s190-release.json
            grep -Fq 'PrebootRuntimeConfigurationPromotionExecution.php' /tmp/oneqay-s190-install.php
            grep -Fq 'PROMOTE_RUNTIME_CONFIGURATION' /tmp/oneqay-s190-install.php
          else
            grep -Fq '"promotion_executor_registration_state": "NOT_REGISTERED"' /tmp/oneqay-s190-release.json
            ! grep -Fq 'PrebootRuntimeConfigurationPromotionExecution.php' /tmp/oneqay-s190-install.php
          fi

      - name: Preserve governed executor registration boundary
        shell: bash
        run: |
          set -euo pipefail
          EXECUTOR=apps/web/app/Infrastructure/Installation/PrebootRuntimeConfigurationPromotionExecution.php
          PAGE=tools/installation/public-installer.php

          grep -Fq "RUNTIME_CONFIGURATION_PROMOTED_NOT_ACTIVATED" "$EXECUTOR"
          grep -Fq "'technical_preview_authorized' => false" "$EXECUTOR"
          grep -Fq "'production_authorized' => false" "$EXECUTOR"
          grep -Fq "'deployment_authorized' => false" "$EXECUTOR"
          grep -Fq "active_environment_already_present" "$EXECUTOR"
          grep -Fq "promotion_execution_readiness_required" "$EXECUTOR"

          if grep -Fq 'execute_runtime_promotion' "$PAGE"; then
            grep -Fq 'PrebootRuntimeConfigurationPromotionExecution.php' "$PAGE"
            grep -Fq '<?php if ($promotionExecutionReady && ! $runtimePromoted): ?>' "$PAGE"
            grep -Fq 'PROMOTE_RUNTIME_CONFIGURATION' "$PAGE"
            grep -Fq '$executionResult = $execution->execute($approvalToken);' "$PAGE"
          else
            ! grep -Fq 'PrebootRuntimeConfigurationPromotionExecution.php' "$PAGE"
          fi

          ! grep -Eq 'Artisan::call|requestInstall\(|checkAvailability\(' "$EXECUTOR"
          ! grep -Eq -- '->(insert|update|delete|increment|decrement)\(' "$EXECUTOR"

      - name: Verify tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          git diff --exit-code
          test -z "$(git status --porcelain)"
