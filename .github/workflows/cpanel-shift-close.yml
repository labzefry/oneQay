# Author by Lab | zefry
name: cPanel Shift Closure Workspace Update
on:
  push:
    branches: [deploy-shift-closure-20261020]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  cpanel-shift-close-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: synthetic-test-only
          MYSQL_DATABASE: oneqay_control_upgrade_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psynthetic-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, dom, zlib, phar, curl
          tools: composer:v2
          coverage: none
      - name: Install locked dependencies
        working-directory: apps/web
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Verify route matching, deployment boundaries and existing schema preservation
        run: |
          set -euo pipefail
          php -l tools/production/cpanel/update-oneqaydev-shift-close.php
          php -l tools/production/cpanel/verify-oneqaydev-pos-routing-schema.php
          php apps/web/tests/desktop-settings-routing.php
          php tools/production/tests/oneqaydev-shift-close-operator.php
          php tools/production/tests/oneqaydev-shift-close-https.php
          php tools/production/tests/oneqaydev-shift-close-runtime-lock.php
          php tools/production/tests/oneqaydev-pos-routing-schema.php
          CONTROL_TEST_ENGINE=mysql php tools/production/tests/oneqaydev-pos-routing-schema.php
      - name: Verify certified shift closure package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 39419053849 --repo labzefry/oneQay --name oneqay-certified-business-production-302379bd7e47 --dir "$RUNNER_TEMP/routing-certified"
          zip -j "$RUNNER_TEMP/routing-certified.zip" "$RUNNER_TEMP/routing-certified/"*
          python3 tools/production/package-oneqaydev-shift-close.py --certified-zip "$RUNNER_TEMP/routing-certified.zip" --source-sha 302379bd7e474f082bdfada13d434802edcedc68 --run-id 39419053849 --output-directory "$RUNNER_TEMP/routing-package"
          php tools/production/tests/oneqaydev-pos-routing-package.php "$RUNNER_TEMP/routing-package/oneqaydev-pos-update-302379bd7e47"
