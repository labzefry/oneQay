# Author by Lab | zefry
name: Business OS Command Center

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  business-os-command-center:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Focused business/read-model contract
        run: |
          php -l apps/web/app/Application/BusinessIntelligence/BusinessCommandCenter.php
          php -l apps/web/app/Delivery/Http/Pos/PosOperationsHubController.php
          php apps/web/tests/business-os-command-center.php
      - name: Install app dependencies and preserve the scoped POS authority contract
        working-directory: apps/web
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          php tests/pos-operations-hub.php
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.19.0
      - name: Type check and build the integrated Business OS workspace
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts --no-fund
          npm run type-check
          npm run build
