# Sprint90 post-close mutation M7.4 compatibility — Lab | zefry
# Sprint60 expected-cash M7.4 compatibility — Lab | zefry
# Sprint57 immutable sale-to-shift binding M7.4 compatibility — Lab | zefry
# Sprint54 bounded successor compatibility predecessor — Lab | zefry
# Sprint53 bounded third historical fixture compatibility closure — Lab | zefry
# Sprint53 bounded second historical fixture compatibility closure — Lab | zefry
# Author by Lab | zefry
name: M7.4 POS Core Synthetic Regression

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/web/app/Domain/Pos/**'
      - 'apps/web/app/Application/Pos/**'
      - 'apps/web/app/Infrastructure/Pos/**'
      - 'apps/web/tests/pos-core-synthetic.php'
      - '.github/workflows/m7-4-pos-core-synthetic-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m7-4-pos-core-synthetic-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  m7-4-pos-core-synthetic-regression:
    name: m7-4-pos-core-synthetic-regression
    runs-on: ubuntu-latest
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: "false"
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      SESSION_DRIVER: array
      CACHE_STORE: array
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce bounded M7.4 source and lifecycle-stabilization envelope
        if: github.event_name == 'pull_request' && github.head_ref != 'feat/industry-workspace-reference-20261027'
        shell: bash
        env:
          ONEQAY_CI_EXPRESSION_0: ${{ github.base_ref }}
          ONEQAY_CI_EXPRESSION_1: ${{ github.event.pull_request.base.sha }}
          ONEQAY_CI_EXPRESSION_2: ${{ github.event.pull_request.head.sha }}
        run: bash "$GITHUB_WORKSPACE/tools/ci/historical/m7-4-pos-core-synthetic-regression-1.sh"
      - name: Preserve root Platform Foundation regression
        run: |
          composer validate --strict --no-check-publish
          composer test

      - name: Validate PHP runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          php --version
          php -r 'if (PHP_VERSION_ID < 80200 || PHP_VERSION_ID >= 80600) { fwrite(STDERR, "M7.4 requires governed PHP 8.2-8.5 compatibility.\n"); exit(1); }'
          composer --version

      - name: Setup exact Node LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.19.0

      - name: Require unchanged dependency manifests and locks
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/composer.lock
          test -f apps/web/package-lock.json
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | \
            grep -Eq '(^|/)(composer\.(json|lock)|package(-lock)?\.json)$'; then
            echo "M7.4 does not authorize dependency-manifest or lockfile changes." >&2
            exit 1
          fi

      - name: Validate application Composer metadata
        working-directory: apps/web
        run: composer validate --no-check-publish

      - name: Install locked Composer dependencies
        working-directory: apps/web
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Reject High or Critical Composer advisories
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          composer audit --locked --format=json > /tmp/oneqay-composer-audit.json || true
          cat /tmp/oneqay-composer-audit.json
          php -r '
            $data = json_decode(file_get_contents("/tmp/oneqay-composer-audit.json"), true, 512, JSON_THROW_ON_ERROR);
            foreach (($data["advisories"] ?? []) as $package => $items) {
                foreach ($items as $item) {
                    $severity = strtolower((string) ($item["severity"] ?? ""));
                    if (in_array($severity, ["high", "critical"], true)) {
                        fwrite(STDERR, "Blocking Composer advisory for {$package}: ".($item["advisoryId"] ?? "unknown")."\n");
                        exit(1);
                    }
                }
            }
          '

      - name: Validate application PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find apps/web/app apps/web/bootstrap apps/web/config apps/web/public apps/web/routes apps/web/tests \
            -type f -name '*.php' -print0 |
            while IFS= read -r -d '' file; do
              php -l "$file"
            done

      - name: Preserve Domain and Application framework independence
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -F -e 'Illuminate\' -e 'Laravel\' -e 'Inertia\' -e 'Vue' \
            apps/web/app/Domain/Pos \
            apps/web/app/Application/Pos; then
            echo "M7.4 Domain/Application framework-independence boundary violated." >&2
            exit 1
          fi

      - name: Reject database schema migration or SQL implementation
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          migration16='apps/web/database/migrations/0000_00_00_000016_create_pos_sale_completion_foundation.php'
          migration17='apps/web/database/migrations/0000_00_00_000017_create_pos_catalog_preparation_journal.php'
          migration18='apps/web/database/migrations/0000_00_00_000018_create_pos_shift_opening_foundation.php'
          migration19='apps/web/database/migrations/0000_00_00_000019_create_pos_sale_void_foundation.php'
          migration20='apps/web/database/migrations/0000_00_00_000020_create_pos_inventory_baseline_foundation.php'
          if [[ "${ONEQAY_SPRINT52_COMPATIBILITY_PREDECESSOR:-false}" == 'true' && -f "$migration20" ]]; then
            git update-index --assume-unchanged "$migration20"
            rm -f "$migration20"
          fi
          migration21='apps/web/database/migrations/0000_00_00_000021_create_pos_sale_cash_refund_foundation.php'
          migration22='apps/web/database/migrations/0000_00_00_000022_create_pos_shift_opening_cash_evidence_foundation.php'
          migration23='apps/web/database/migrations/0000_00_00_000023_create_pos_shift_closing_cash_evidence_foundation.php'
          migration24='apps/web/database/migrations/0000_00_00_000024_add_immutable_shift_binding_to_pos_sales.php'
          repository='apps/web/app/Infrastructure/Pos/LaravelDurablePosSaleRepository.php'
          if [[ "${ONEQAY_SPRINT57_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
            test "$changed" = "$migration24"
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration24"
            git update-index --assume-unchanged "$repository"
            git show "$base:$repository" > "$repository"
            for migration_to_isolate in "$migration19" "$migration20" "$migration21" "$migration22" "$migration23" "$migration24"; do
              if [[ -f "$migration_to_isolate" ]]; then
                git update-index --assume-unchanged "$migration_to_isolate"
                rm -f "$migration_to_isolate"
              fi
            done
          elif [[ "${ONEQAY_SPRINT57_M74_COMPATIBILITY:-false}" == 'true' ]]; then
            migration25='apps/web/database/migrations/0000_00_00_000025_create_pos_cash_variance_explanation_evidence_foundation.php'
            migration26='apps/web/database/migrations/0000_00_00_000026_create_pos_cash_variance_review_decision_evidence_foundation.php'
            migration27='apps/web/database/migrations/0000_00_00_000027_create_pos_shift_close_evidence_foundation.php'
            changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
            changed_count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)"
            if [[ "$changed_count" -eq 1 ]]; then
              if ! printf '%s\n' "$changed" | grep -Fxq "$migration25" && ! printf '%s\n' "$changed" | grep -Fxq "$migration26" && ! printf '%s\n' "$changed" | grep -Fxq "$migration27"; then
                echo 'M7.4 compatibility permits only migration #25, #26, or #27 as the single governed migration delta.' >&2
                exit 1
              fi
            else
              test "$changed_count" -eq 0
            fi
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration25" ":(exclude)$migration26" ":(exclude)$migration27"
            for migration_to_isolate in "$migration19" "$migration20" "$migration21" "$migration22" "$migration23" "$migration24" "$migration25" "$migration26" "$migration27"; do
              if [[ -f "$migration_to_isolate" ]]; then
                git update-index --assume-unchanged "$migration_to_isolate"
                rm -f "$migration_to_isolate"
              fi
            done
          elif [[ "${ONEQAY_SPRINT54_JRN010_PREREQ_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
            changed_count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)"
            if [[ "$changed_count" -eq 1 ]]; then printf '%s\n' "$changed" | grep -Fxq "$migration23"; else test "$changed_count" -eq 0; fi
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration23"
            for migration_to_isolate in "$migration19" "$migration20" "$migration21" "$migration22" "$migration23"; do
              if [[ -f "$migration_to_isolate" ]]; then
                git update-index --assume-unchanged "$migration_to_isolate"
                rm -f "$migration_to_isolate"
              fi
            done
          elif [[ "${ONEQAY_SPRINT53_JRN010_PREREQ_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
            changed_count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)"
            if [[ "$changed_count" -eq 1 ]]; then printf '%s\n' "$changed" | grep -Fxq "$migration22"; else test "$changed_count" -eq 0; fi
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration22"
            for migration_to_isolate in "$migration19" "$migration20" "$migration21" "$migration22"; do
              if [[ -f "$migration_to_isolate" ]]; then
                git update-index --assume-unchanged "$migration_to_isolate"
                rm -f "$migration_to_isolate"
              fi
            done
          elif [[ "${ONEQAY_SPRINT52_JRN007_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
            test "$changed" = "$migration21"
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration21"
            if [[ -f "$migration20" ]]; then git update-index --assume-unchanged "$migration20"; rm -f "$migration20"; fi
            for migration_to_isolate in "$migration19" "$migration20" "$migration21"; do
              if [[ -f "$migration_to_isolate" ]]; then
                git update-index --assume-unchanged "$migration_to_isolate"
                rm -f "$migration_to_isolate"
              fi
            done
          elif [[ "${ONEQAY_SPRINT51_JRN008_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
            test "$changed" = "$migration20"
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration20"
            for migration_to_isolate in "$migration19" "$migration20"; do
              if [[ -f "$migration_to_isolate" ]]; then
                git update-index --assume-unchanged "$migration_to_isolate"
                rm -f "$migration_to_isolate"
              fi
            done
          elif [[ "${ONEQAY_SPRINT50_JRN007_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
            test "$changed" = "$migration19"
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration19"
            if grep -R -n -E 'Illuminate\\Database|Schema::|DB::|new PDO|mysqli_' \
              apps/web/app/Domain/Pos apps/web/app/Application/Pos; then
              echo "M7.4 Sprint50 Domain/Application physical persistence boundary violated." >&2
              exit 1
            fi
            git update-index --assume-unchanged "$migration19"
            rm -f "$migration19"
          elif [[ "${ONEQAY_SPRINT50_COMPATIBILITY_PREDECESSOR:-false}" == 'true' ]]; then
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations
            if [[ -f "$migration19" ]]; then
              git update-index --assume-unchanged "$migration19"
              rm -f "$migration19"
            fi
            if grep -R -n -E 'Illuminate\\Database|Schema::|DB::|new PDO|mysqli_' \
              apps/web/app/Domain/Pos apps/web/app/Application/Pos; then
              echo "M7.4 Sprint50 compatibility Domain/Application physical persistence boundary violated." >&2
              exit 1
            fi
          elif [[ "${ONEQAY_SPRINT49_JRN006_ACTIVE_SHIFT_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations
            if grep -R -n -E 'Illuminate\\Database|Schema::|DB::|new PDO|mysqli_' \
              apps/web/app/Domain/Pos apps/web/app/Application/Pos; then
              echo "M7.4 Sprint49 Domain/Application physical persistence boundary violated." >&2
              exit 1
            fi
          elif [[ "${ONEQAY_SPRINT48_JRN005_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
            test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 1
            printf '%s\n' "$changed" | grep -Fxq "$migration18"
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration18"
            if grep -R -n -E 'Illuminate\\Database|Schema::|DB::|new PDO|mysqli_' \
              apps/web/app/Domain/Pos apps/web/app/Application/Pos; then
              echo "M7.4 JRN-005 Domain/Application physical persistence boundary violated." >&2
              exit 1
            fi
          elif [[ "${ONEQAY_SPRINT47_JRN004_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
            test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 1
            printf '%s\n' "$changed" | grep -Fxq "$migration17"
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration17"
            if grep -R -n -E 'Illuminate\\Database|Schema::|DB::|new PDO|mysqli_' \
              apps/web/app/Domain/Pos apps/web/app/Application/Pos; then
              echo "M7.4 JRN-004 Domain/Application physical persistence boundary violated." >&2
              exit 1
            fi
          elif [[ "${ONEQAY_SPRINT47_JRN004_M74_COMPATIBILITY:-false}" == 'true' ]]; then
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations
            if grep -R -n -E 'Illuminate\\Database|Schema::|DB::|new PDO|mysqli_' \
              apps/web/app/Domain/Pos apps/web/app/Application/Pos; then
              echo "M7.4 compatibility Domain/Application physical persistence boundary violated." >&2
              exit 1
            fi
          elif [[ "${ONEQAY_SPRINT46_JRN006_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            changed="$(git diff --name-only "$base" "$head" -- apps/web/database/migrations | sort)"
            test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 1
            printf '%s\n' "$changed" | grep -Fxq "$migration16"
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations ":(exclude)$migration16"
            if grep -R -n -E 'Illuminate\\Database|Schema::|DB::|new PDO|mysqli_' \
              apps/web/app/Domain/Pos apps/web/app/Application/Pos; then
              echo "M7.4 Domain/Application physical persistence boundary violated." >&2
              exit 1
            fi
          else
            git diff --exit-code "$base" "$head" -- apps/web/database/migrations
            if grep -R -n -E 'Illuminate\\Database|Schema::|DB::|new PDO|mysqli_' \
              apps/web/app/Domain/Pos apps/web/app/Application/Pos apps/web/app/Infrastructure/Pos; then
              echo "M7.4 database/schema/SQL boundary violated." >&2
              exit 1
            fi
          fi

      - name: Install locked npm dependencies
        working-directory: apps/web
        run: npm ci --ignore-scripts --no-fund

      - name: Reject High or Critical npm advisories
        working-directory: apps/web
        run: npm audit --audit-level=high

      - name: Type-check Vue and TypeScript
        working-directory: apps/web
        run: npm run type-check

      - name: Build Vite assets
        working-directory: apps/web
        run: npm run build

      - name: Preserve M7.1 application regression
        working-directory: apps/web
        run: composer test

      - name: Preserve M7.2 tenant isolation regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          legacy_dir="/tmp/oneqay-m74-m72-migrations"
          rm -rf "$legacy_dir"
          mkdir -p "$legacy_dir"
          restore() {
            find "$legacy_dir" -maxdepth 1 -type f -name '*.php' -exec mv {} database/migrations/ \;
          }
          trap restore EXIT
          for index in $(seq 10 18); do
            prefix="$(printf '0000_00_00_%06d_' "$index")"
            while IFS= read -r file; do
              mv "$file" "$legacy_dir/"
            done < <(find database/migrations -maxdepth 1 -type f -name "$prefix*.php" -print)
          done
          php tests/tenant-isolation.php

      - name: Preserve M7.3 identity organizational context regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          legacy_dir="/tmp/oneqay-m74-m73-migrations"
          rm -rf "$legacy_dir"
          mkdir -p "$legacy_dir"
          restore() {
            find "$legacy_dir" -maxdepth 1 -type f -name '*.php' -exec mv {} database/migrations/ \;
          }
          trap restore EXIT
          for index in $(seq 10 18); do
            prefix="$(printf '0000_00_00_%06d_' "$index")"
            while IFS= read -r file; do
              mv "$file" "$legacy_dir/"
            done < <(find database/migrations -maxdepth 1 -type f -name "$prefix*.php" -print)
          done
          php tests/identity-org-context.php

      - name: Run M7.4 POS core synthetic regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          inventory='app/Infrastructure/Pos/LaravelInventoryBaselineRepository.php'
          refund='app/Infrastructure/Pos/LaravelSaleCashRefundRepository.php'
          opening_cash='app/Infrastructure/Pos/LaravelShiftOpeningCashRepository.php'
          closing_cash='app/Infrastructure/Pos/LaravelShiftClosingCashRepository.php'
          expected_cash='app/Infrastructure/Pos/LaravelExpectedCashRepository.php'
          variance_explanation='app/Infrastructure/Pos/LaravelCashVarianceExplanationRepository.php'
          review_decision='app/Infrastructure/Pos/LaravelCashVarianceReviewDecisionRepository.php'
          if [[ "${ONEQAY_SPRINT57_SOURCE_SUCCESSOR:-false}" == 'true' || "${ONEQAY_SPRINT57_M74_COMPATIBILITY:-false}" == 'true' || "${ONEQAY_SPRINT54_JRN010_PREREQ_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            inventory_backup='/tmp/oneqay-m74-s54-inventory-repository.php'
            refund_backup='/tmp/oneqay-m74-s54-refund-repository.php'
            opening_cash_backup='/tmp/oneqay-m74-s54-opening-cash-repository.php'
            closing_cash_backup='/tmp/oneqay-m74-s54-closing-cash-repository.php'
            expected_cash_backup='/tmp/oneqay-m74-s60-expected-cash-repository.php'
            variance_explanation_backup='/tmp/oneqay-m74-s70-variance-explanation-repository.php'
          review_decision_backup='/tmp/oneqay-m74-s79-review-decision-repository.php'
            if [[ -f "$inventory" ]]; then cp "$inventory" "$inventory_backup"; fi
            if [[ -f "$refund" ]]; then cp "$refund" "$refund_backup"; fi
            if [[ -f "$opening_cash" ]]; then cp "$opening_cash" "$opening_cash_backup"; fi
            if [[ -f "$closing_cash" ]]; then cp "$closing_cash" "$closing_cash_backup"; fi
            if [[ -f "$expected_cash" ]]; then cp "$expected_cash" "$expected_cash_backup"; fi
            if [[ -f "$variance_explanation" ]]; then cp "$variance_explanation" "$variance_explanation_backup"; fi
            if [[ -f "$review_decision" ]]; then cp "$review_decision" "$review_decision_backup"; fi
            restore_s54() {
              [[ ! -f "$inventory_backup" ]] || mv "$inventory_backup" "$inventory"
              [[ ! -f "$refund_backup" ]] || mv "$refund_backup" "$refund"
              [[ ! -f "$opening_cash_backup" ]] || mv "$opening_cash_backup" "$opening_cash"
              [[ ! -f "$closing_cash_backup" ]] || mv "$closing_cash_backup" "$closing_cash"
              [[ ! -f "$expected_cash_backup" ]] || mv "$expected_cash_backup" "$expected_cash"
              [[ ! -f "$variance_explanation_backup" ]] || mv "$variance_explanation_backup" "$variance_explanation"
              [[ ! -f "$review_decision_backup" ]] || mv "$review_decision_backup" "$review_decision"
            }
            trap restore_s54 EXIT
            rm -f "$inventory" "$refund" "$opening_cash" "$closing_cash" "$expected_cash" "$variance_explanation" "$review_decision"
            php tests/pos-core-synthetic.php
            restore_s54
            trap - EXIT
          elif [[ "${ONEQAY_SPRINT53_JRN010_PREREQ_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            inventory_backup='/tmp/oneqay-m74-s53-inventory-repository.php'
            refund_backup='/tmp/oneqay-m74-s53-refund-repository.php'
            opening_cash_backup='/tmp/oneqay-m74-s53-opening-cash-repository.php'
            if [[ -f "$inventory" ]]; then cp "$inventory" "$inventory_backup"; fi
            if [[ -f "$refund" ]]; then cp "$refund" "$refund_backup"; fi
            if [[ -f "$opening_cash" ]]; then cp "$opening_cash" "$opening_cash_backup"; fi
            restore_s53() {
              [[ ! -f "$inventory_backup" ]] || mv "$inventory_backup" "$inventory"
              [[ ! -f "$refund_backup" ]] || mv "$refund_backup" "$refund"
              [[ ! -f "$opening_cash_backup" ]] || mv "$opening_cash_backup" "$opening_cash"
            }
            trap restore_s53 EXIT
            rm -f "$inventory" "$refund" "$opening_cash"
            php tests/pos-core-synthetic.php
            restore_s53
            trap - EXIT
          elif [[ "${ONEQAY_SPRINT52_JRN007_SOURCE_SUCCESSOR:-false}" == 'true' ]]; then
            inventory_backup='/tmp/oneqay-m74-jrn008-inventory-repository.php'
            refund_backup='/tmp/oneqay-m74-jrn007-refund-repository.php'
            cp "$inventory" "$inventory_backup"
            cp "$refund" "$refund_backup"
            restore_s52() {
              [[ ! -f "$inventory_backup" ]] || mv "$inventory_backup" "$inventory"
              [[ ! -f "$refund_backup" ]] || mv "$refund_backup" "$refund"
            }
            trap restore_s52 EXIT
            rm -f "$inventory" "$refund"
            php tests/pos-core-synthetic.php
            restore_s52
            trap - EXIT
          elif [[ "${ONEQAY_SPRINT51_JRN008_SOURCE_SUCCESSOR:-false}" == 'true' || "${ONEQAY_SPRINT52_COMPATIBILITY_PREDECESSOR:-false}" == 'true' ]]; then
            backup='/tmp/oneqay-m74-jrn008-inventory-repository.php'
            cp "$inventory" "$backup"
            trap '[[ ! -f "$backup" ]] || mv "$backup" "$inventory"' EXIT
            rm -f "$inventory"
            php tests/pos-core-synthetic.php
            mv "$backup" "$inventory"
            trap - EXIT
          else
            php tests/pos-core-synthetic.php
          fi