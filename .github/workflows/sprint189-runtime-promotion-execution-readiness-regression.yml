# Author by Lab | zefry
name: Sprint189 Runtime Promotion Execution Readiness Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint189-runtime-promotion-execution-readiness-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify-sprint189-runtime-promotion-execution-readiness:
    name: qualify-sprint189-runtime-promotion-execution-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      APP_DEBUG: "false"
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      SESSION_DRIVER: array
      CACHE_STORE: array
      LOG_CHANNEL: stderr
      ONEQAY_BUILD_PROVENANCE: github-actions:${{ github.run_id }}:${{ github.run_attempt }}

    steps:
      - name: Checkout exact Sprint189 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Qualify exact Sprint189 engineering envelope
        if: github.event_name == 'pull_request' && github.head_ref == 'sprint189-runtime-promotion-execution-readiness'
        shell: bash
        env:
          EXPECTED_PATH_HASH: d1c5161eed0ca32659bb6c9e47f897c7ee02447c1af8424d87550d5436a89523
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          mapfile -t paths < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | LC_ALL=C sort)
          expected=(
            ".github/workflows/m7-5-preview-release-artifact.yml"
            ".github/workflows/sprint189-runtime-promotion-execution-readiness-regression.yml"
            ".github/workflows/sprint32-authentication-recovery-proof-regression.yml"
            ".github/workflows/sprint33-recovery-bound-password-reset-regression.yml"
            ".github/workflows/sprint34-authenticated-password-change-regression.yml"
            "apps/web/app/Infrastructure/Installation/PrebootRuntimeConfigurationPromotionReadiness.php"
            "apps/web/tests/preboot-runtime-configuration-promotion-readiness.php"
            "tools/build-m7-5-preview-release.sh"
            "tools/installation/public-installer.php"
            "tools/installation/runtime-configuration-promotion-readiness.schema.json"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${paths[@]}")
          actual_hash="$(printf '%s\n' "${paths[@]}" | sha256sum | awk '{print $1}')"
          test "$actual_hash" = "$EXPECTED_PATH_HASH"

      - name: Preserve operational NO-GO
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" =~ ^(NOT_EXECUTED|EXECUTED)$ ]]
          permission_state="$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)"; [[ "$permission_state" =~ ^(NONE|PROVISIONED)$ ]]; if [[ "$permission_state" == 'PROVISIONED' ]]; then [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" == 'EXECUTED' ]]; fi
          test "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" = INACTIVE || test "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" = ACTIVE
          test "$(jq -r '.deployment_authority' ops/final-shift-close/STATE.json)" = NOT_GRANTED
          test "$(jq -r '.technical_preview_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
          test "$(jq -r '.production_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
          test "$(jq -r '.updater_activation' ops/final-shift-close/STATE.json)" = INACTIVE
          test "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = SELECTED_NOT_AUTHORIZED
          test "$(jq -r '.selected_target.environment_id' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = 'oneqay-durable-staging-01'
          test "$(jq -r '.selected_target.runtime_class' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = 'durable-staging'
          test "$(jq -r '.selected_target.selection_fingerprint_sha256' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = '858280ea3575317e8d88eed7009c770530097e261c391b2869fa81ad7c8546ce'

      - name: Setup PHP 8.3 runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Setup exact Node LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.19.0

      - name: Validate Sprint189 source and readiness schema
        shell: bash
        run: |
          set -euo pipefail
          php -l apps/web/app/Infrastructure/Installation/PrebootRuntimeConfigurationPromotionReadiness.php
          php -l apps/web/tests/preboot-runtime-configuration-promotion-readiness.php
          php -l tools/installation/public-installer.php
          bash -n tools/build-m7-5-preview-release.sh
          jq -e '.properties.readiness_state.const == "PROMOTION_EXECUTION_READY_NOT_EXECUTED"' tools/installation/runtime-configuration-promotion-readiness.schema.json
          jq -e '.properties.promotion_executed.const == false' tools/installation/runtime-configuration-promotion-readiness.schema.json
          jq -e '.properties.technical_preview_authorized.const == false' tools/installation/runtime-configuration-promotion-readiness.schema.json
          jq -e '.properties.production_authorized.const == false' tools/installation/runtime-configuration-promotion-readiness.schema.json
          jq -e '.properties.execution_contract.properties.consume_authority_on_success.const == true' tools/installation/runtime-configuration-promotion-readiness.schema.json

      - name: Install locked application dependencies
        working-directory: apps/web
        run: |
          set -euo pipefail
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          npm ci --ignore-scripts --no-fund
          npm run type-check
          npm run build

      - name: Preserve Sprint184 through Sprint188 installation regressions
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php -d zend.assertions=1 -d assert.exception=1 tests/preboot-installation-configuration.php
          php -d zend.assertions=1 -d assert.exception=1 tests/preboot-database-compatibility-verification.php
          php -d zend.assertions=1 -d assert.exception=1 tests/preboot-installation-activation-readiness.php
          php -d zend.assertions=1 -d assert.exception=1 tests/preboot-runtime-configuration-promotion-request.php
          php -d zend.assertions=1 -d assert.exception=1 tests/preboot-runtime-configuration-promotion-qualification.php

      - name: Execute Sprint189 promotion execution readiness regression
        working-directory: apps/web
        run: php -d zend.assertions=1 -d assert.exception=1 tests/preboot-runtime-configuration-promotion-readiness.php

      - name: Build governed release with promotion execution readiness
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          bash tools/build-m7-5-preview-release.sh "$HEAD_SHA"
          release_id="m75-preview-${HEAD_SHA:0:12}"
          artifact="dist/${release_id}.tar.gz"
          test -f "$artifact"

          tar -tzf "$artifact" > /tmp/oneqay-s189-release-list.txt
          grep -Fxq "$release_id/public-surface/install.php" /tmp/oneqay-s189-release-list.txt
          grep -Fxq "$release_id/apps/web/app/Infrastructure/Installation/PrebootRuntimeConfigurationPromotionReadiness.php" /tmp/oneqay-s189-release-list.txt
          grep -Fxq "$release_id/installation/runtime-configuration-promotion-readiness.schema.json" /tmp/oneqay-s189-release-list.txt
          ! grep -F '/apps/web/database/migrations/' /tmp/oneqay-s189-release-list.txt

          tar -xOzf "$artifact" "$release_id/RELEASE.json" > /tmp/oneqay-s189-release.json
          grep -Fq '"promotion_readiness_relative_path": "oneqay-preview/shared/install/runtime-configuration-promotion-readiness.json"' /tmp/oneqay-s189-release.json
          grep -Fq '"promotion_readiness_schema_relative_path": "installation/runtime-configuration-promotion-readiness.schema.json"' /tmp/oneqay-s189-release.json
          grep -Fq '"promotion_execution_state": "NOT_EXECUTED"' /tmp/oneqay-s189-release.json
          grep -Fq '"activation_authorized": false' /tmp/oneqay-s189-release.json

          tar -xOzf "$artifact" "$release_id/public-surface/install.php" > /tmp/oneqay-s189-install.php
          php -l /tmp/oneqay-s189-install.php
          grep -Fq 'PrebootRuntimeConfigurationPromotionReadiness.php' /tmp/oneqay-s189-install.php
          grep -Fq 'EXECUTION READY / NOT EXECUTED' /tmp/oneqay-s189-install.php

      - name: Preserve readiness-before-execution boundary
        shell: bash
        run: |
          set -euo pipefail
          READY=apps/web/app/Infrastructure/Installation/PrebootRuntimeConfigurationPromotionReadiness.php
          PAGE=tools/installation/public-installer.php
          SCHEMA=tools/installation/runtime-configuration-promotion-readiness.schema.json

          grep -Fq "PROMOTION_EXECUTION_READY_NOT_EXECUTED" "$READY"
          grep -Fq "'promotion_executed' => false" "$READY"
          grep -Fq "'consume_authority_on_success' => true" "$READY"
          grep -Fq "'consume_readiness_on_success' => true" "$READY"
          grep -Fq "'rollback_on_post_promotion_validation_failure' => true" "$READY"
          grep -Fq "EXECUTION READY / NOT EXECUTED" "$PAGE"
          grep -Fq '"promotion_executed": { "const": false }' "$SCHEMA"

          ! grep -Eq 'Artisan::call|requestInstall\(|checkAvailability\(' "$READY" "$PAGE"
          ! grep -Fq 'rename($this->pendingEnvironmentPath()' "$READY"
          ! grep -Fq 'copy($this->pendingEnvironmentPath()' "$READY"
          ! grep -Eq -- '->(insert|update|delete|increment|decrement)\(' "$READY" "$PAGE"

      - name: Verify tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          git diff --exit-code
          test -z "$(git status --porcelain)"
