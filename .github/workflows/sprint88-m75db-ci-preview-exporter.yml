# Sprint88 M7.5 DB explicit CI Preview fixture exporter — Lab | zefry
# Author by Lab | zefry
name: Sprint88 M7.5 DB CI Preview Exporter

on:
  push:
    branches: [sprint88-compat20-exporter-v11]
    paths:
      - '.github/workflows/sprint88-m75db-ci-preview-exporter.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exporter branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: sprint88-compat20-exporter-v11

      - name: Materialize explicit CI Preview fixture
        shell: python
        run: |
          from pathlib import Path

          source = Path('docs/_sprint88_compat20/m7-5-preview-db-qualification-regression.yml')
          text = source.read_text()
          needle = '      - name: Run Preview and established regressions through Sprint 28\n'
          if text.count(needle) != 1:
              raise SystemExit('M7.5 DB executable step anchor mismatch')
          env_block = (
              needle
              + '        env:\n'
              + "          ONEQAY_RUNTIME_CLASS: ci\n"
              + "          ONEQAY_TECHNICAL_PREVIEW_ENABLED: 'true'\n"
              + "          SESSION_DRIVER: array\n"
          )
          text = text.replace(needle, env_block, 1)
          out = Path('docs/_sprint88_m75db_fix/m7-5-preview-db-qualification-regression.yml')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(text)
          print('Explicit CI-only Preview fixture materialized for M7.5 DB nested interaction regression.')

      - name: Publish ordinary corrected output
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/_sprint88_m75db_fix/m7-5-preview-db-qualification-regression.yml
          grep -Fq "ONEQAY_RUNTIME_CLASS: ci" docs/_sprint88_m75db_fix/m7-5-preview-db-qualification-regression.yml
          grep -Fq "ONEQAY_TECHNICAL_PREVIEW_ENABLED: 'true'" docs/_sprint88_m75db_fix/m7-5-preview-db-qualification-regression.yml
          grep -Fq "SESSION_DRIVER: array" docs/_sprint88_m75db_fix/m7-5-preview-db-qualification-regression.yml
          git config user.name 'Lab | zefry'
          git config user.email 'lab.zefry@users.noreply.github.com'
          git add docs/_sprint88_m75db_fix
          git commit -m 'ci(sprint88): export M7.5 DB explicit CI Preview fixture' -m 'Author by Lab | zefry'
          git push origin HEAD:sprint88-compat20-exporter-v11
