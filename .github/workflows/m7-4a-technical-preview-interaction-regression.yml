name: M7.4A Technical Preview Interaction Regression

# Attribution: Lab | zefry
# Historical Sprint 33 fingerprint: 04a1177c12712183a7dda4ae81be1356c0e41294533336c9f999d376c224712a
# Sprint 34 fingerprint: e3b724002cfc0be1ef890d1b5594a2a5179123f949f6f486354e21950c7328eb

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/m7-4a-technical-preview-interaction-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m7-4a-technical-preview-interaction-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  m7-4a-technical-preview-interaction-regression:
    name: m7-4a-technical-preview-interaction-regression
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      ONEQAY_TECHNICAL_PREVIEW_ENABLED: 'true'
      ONEQAY_PERSISTENCE_ENABLED: 'false'
      SESSION_DRIVER: array
      CACHE_STORE: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Recognize exact Sprint 34 bounded successor
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          base="origin/${{ github.base_ref }}"
          test "$(git rev-parse "$base")" = '8b4fc5425ba8d98f35f02c39bd1880ce50c4759b'
          git diff --name-only "$base...HEAD" | sort > /tmp/s34-files.txt
          test "$(wc -l < /tmp/s34-files.txt)" -eq 35
          test "$(sha256sum /tmp/s34-files.txt | awk '{print $1}')" = 'e3b724002cfc0be1ef890d1b5594a2a5179123f949f6f486354e21950c7328eb'
          git update-index --assume-unchanged apps/web/database/migrations/0000_00_00_000010_create_identity_recovery_codes.php
          git update-index --assume-unchanged apps/web/database/migrations/0000_00_00_000011_add_credential_epoch_to_identity_password_credentials.php
          rm -f apps/web/database/migrations/0000_00_00_000010_create_identity_recovery_codes.php
          rm -f apps/web/database/migrations/0000_00_00_000011_add_credential_epoch_to_identity_password_credentials.php

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup exact Node LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.19.0

      - name: Preserve root Platform Foundation regression
        run: |
          composer validate --strict --no-check-publish
          composer test

      - name: Install locked application dependencies
        working-directory: apps/web
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          npm ci --ignore-scripts --no-fund

      - name: Validate Technical Preview application boundaries
        shell: bash
        run: |
          set -euo pipefail
          find apps/web/app apps/web/routes apps/web/tests -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do php -l "$file"; done
          if grep -R -n -F -e 'Illuminate\' -e 'Inertia\' -e 'Vue' apps/web/app/Application/Preview; then exit 1; fi
          if grep -R -n -E 'FirstPartyIdentityCredentialVerifier|FirstPartySessionController|AuthenticatedPasswordChange|password/change' apps/web/app/Application/Preview apps/web/app/Infrastructure/Preview apps/web/app/Delivery/Preview 2>/dev/null; then exit 1; fi

      - name: Type-check and build frontend
        working-directory: apps/web
        run: |
          npm audit --audit-level=high
          npm run type-check
          npm run build

      - name: Preserve M7 tenant identity and Preview regressions
        working-directory: apps/web
        run: |
          composer test
          php tests/tenant-isolation.php
          php tests/identity-org-context.php
          php tests/technical-preview-interaction.php
          php tests/identity-credential-verification.php
          php tests/first-party-session-establishment.php
          php tests/initial-password-enrollment.php

      - name: Preserve NO_SCHEMA_CHANGE Preview boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'NO_SCHEMA_CHANGE' .github/workflows/m7-5-preview-release-artifact.yml
          grep -Fq 'ONEQAY_PERSISTENCE_ENABLED=false' apps/web/environment.example
          git diff --exit-code
