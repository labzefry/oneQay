name: Sprint 33 Recovery-Bound Password Reset Regression

# Attribution: Lab | zefry

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/m7-2-tenant-isolation-regression.yml'
      - '.github/workflows/m7-3-identity-org-context-regression.yml'
      - '.github/workflows/m7-4a-technical-preview-interaction-regression.yml'
      - '.github/workflows/m7-5-preview-db-qualification-regression.yml'
      - '.github/workflows/m7-5-preview-release-artifact.yml'
      - '.github/workflows/sprint21-role-permission-policy-regression.yml'
      - '.github/workflows/sprint22-policy-administration-regression.yml'
      - '.github/workflows/sprint23-initial-tenant-admin-provisioning-regression.yml'
      - '.github/workflows/sprint24-protected-control-admin-lifecycle-regression.yml'
      - '.github/workflows/sprint25-policy-administration-delivery-regression.yml'
      - '.github/workflows/sprint26-identity-credential-verification-regression.yml'
      - '.github/workflows/sprint27-first-party-session-establishment-regression.yml'
      - '.github/workflows/sprint28-initial-password-enrollment-regression.yml'
      - '.github/workflows/sprint29-first-control-principal-credential-bootstrap-regression.yml'
      - '.github/workflows/sprint30-privileged-totp-mfa-regression.yml'
      - '.github/workflows/sprint31-privileged-reauthentication-step-up-regression.yml'
      - '.github/workflows/sprint32-authentication-recovery-proof-regression.yml'
      - '.github/workflows/sprint33-recovery-bound-password-reset-regression.yml'
      - 'apps/web/app/Application/Identity/FirstPartyCredentialEpochRepository.php'
      - 'apps/web/app/Application/Identity/RecoveryCodeRepository.php'
      - 'apps/web/app/Application/Identity/RecoveryCodeService.php'
      - 'apps/web/app/Application/Identity/RecoveryPasswordResetRepository.php'
      - 'apps/web/app/Application/Identity/RecoveryPasswordResetService.php'
      - 'apps/web/app/Application/Identity/RecoveryPasswordResetViolation.php'
      - 'apps/web/app/Application/Identity/VerifiedRecoveryProof.php'
      - 'apps/web/app/Application/Identity/VerifyFirstPartyCredentialEpoch.php'
      - 'apps/web/app/Delivery/Http/Identity/FirstPartySessionController.php'
      - 'apps/web/app/Delivery/Http/Identity/FirstPartySessionKeys.php'
      - 'apps/web/app/Delivery/Http/Identity/RecoveryCodeController.php'
      - 'apps/web/app/Delivery/Http/Identity/RecoveryPasswordResetController.php'
      - 'apps/web/app/Infrastructure/Identity/LaravelFirstPartyCredentialEpochRepository.php'
      - 'apps/web/app/Infrastructure/Identity/LaravelRecoveryCodeRepository.php'
      - 'apps/web/app/Infrastructure/Identity/LaravelRecoveryPasswordResetRepository.php'
      - 'apps/web/app/Providers/AppServiceProvider.php'
      - 'apps/web/routes/web.php'
      - 'apps/web/tests/authentication-recovery-proof.php'
      - 'apps/web/tests/first-party-session-establishment.php'
      - 'apps/web/tests/recovery-bound-password-reset.php'
      - 'docs/RECOVERY_BOUND_PASSWORD_RESET_COMPLETION_FOUNDATION.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint33-recovery-bound-password-reset-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sprint33-recovery-bound-password-reset-regression:
    name: sprint33-recovery-bound-password-reset-regression
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:c3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3M=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      ONEQAY_PERSISTENCE_ENABLED: 'false'
      ONEQAY_PRIVILEGED_TOTP_MFA_ENABLED: 'false'
      ONEQAY_PRIVILEGED_STEP_UP_ENABLED: 'false'
      ONEQAY_AUTHENTICATION_RECOVERY_ENABLED: 'false'
      SESSION_DRIVER: array
      CACHE_STORE: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Recognize exact Sprint 34 bounded successor
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          base="origin/$GITHUB_BASE_REF"
          git diff --name-only "$base...HEAD" | sort > /tmp/s34-preservation-files.txt
          count="$(wc -l < /tmp/s34-preservation-files.txt)"
          fingerprint="$(sha256sum /tmp/s34-preservation-files.txt | awk '{print $1}')"
          if [[ "$count" -eq 35 ]] && [[ "$fingerprint" == 'e3b724002cfc0be1ef890d1b5594a2a5179123f949f6f486354e21950c7328eb' ]] && [[ "$(git rev-parse "$base")" == '8b4fc5425ba8d98f35f02c39bd1880ce50c4759b' ]] && [[ "$(git rev-list --count "$base..HEAD")" -eq 1 ]] && [[ "$(git rev-parse HEAD^)" == '8b4fc5425ba8d98f35f02c39bd1880ce50c4759b' ]]; then
            echo 'ONEQAY_SPRINT34_SUCCESSOR=true' >> "$GITHUB_ENV"
          else
            echo 'ONEQAY_SPRINT34_SUCCESSOR=false' >> "$GITHUB_ENV"
          fi

      - name: Recognize exact Sprint35 and Sprint36 bounded successors
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "main"
          git diff --name-only "origin/main...HEAD" | sort > /tmp/s35-successor-files.txt
          count="$(wc -l < /tmp/s35-successor-files.txt)"
          fingerprint="$(sha256sum /tmp/s35-successor-files.txt | awk '{print $1}')"
          if [[ "$count" -eq 17 && "$fingerprint" == 'e889db1c7eaa22b3ed008f8781ab35652ca950a3f009c309e5c478d01d368f11' ]] || [[ "$count" -eq 18 && "$fingerprint" == '25dbbd94087eba4157fa9c209f09174a127154a98067abbfbeec233bbe9398cd' ]] || [[ "$count" -eq 23 && "$fingerprint" == 'ea735f8f5ee06d480863f9d1ba7ae58a91642109963c3f340e8453f3205bb7ae' ]] || [[ "$count" -eq 19 && "$fingerprint" == 'fc2b578fc9d090dfce1fd34c5acfa7a07f065979a94f62becb3dc54dee664920' ]] || [[ "$count" -eq 4 && "$fingerprint" == 'a5d3b0816c3b0e6f1fa7dd5ece73ea6347042372dd517af31e303c41d49abfaa' ]]; then
            echo 'ONEQAY_SPRINT35_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT34_SUCCESSOR=true' >> "$GITHUB_ENV"
            if [[ "$count" -eq 23 && "$fingerprint" == 'ea735f8f5ee06d480863f9d1ba7ae58a91642109963c3f340e8453f3205bb7ae' ]]; then
              echo 'ONEQAY_SPRINT36_SUCCESSOR=true' >> "$GITHUB_ENV"
            else
              echo 'ONEQAY_SPRINT36_SUCCESSOR=false' >> "$GITHUB_ENV"
            fi
            if [[ -f 'apps/web/database/migrations/0000_00_00_000012_add_totp_factor_epoch_and_recovery_authority.php' ]]; then
              git update-index --assume-unchanged 'apps/web/database/migrations/0000_00_00_000012_add_totp_factor_epoch_and_recovery_authority.php'
              rm -f 'apps/web/database/migrations/0000_00_00_000012_add_totp_factor_epoch_and_recovery_authority.php'
            fi
            if [[ -f 'apps/web/database/migrations/0000_00_00_000013_create_first_party_session_authority.php' ]]; then
              git update-index --assume-unchanged 'apps/web/database/migrations/0000_00_00_000013_create_first_party_session_authority.php'
              rm -f 'apps/web/database/migrations/0000_00_00_000013_create_first_party_session_authority.php'
            fi
            echo 'Exact Sprint35/Sprint36 successor or bounded correction envelope recognized; historical executable preservation remains active.'
          else
            echo 'ONEQAY_SPRINT35_SUCCESSOR=false' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT36_SUCCESSOR=false' >> "$GITHUB_ENV"
          fi

      - name: Setup exact PHP runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Enforce exact Sprint 33 source envelope
        if: (github.event_name == 'pull_request') && env.ONEQAY_SPRINT35_SUCCESSOR != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${ONEQAY_SPRINT34_SUCCESSOR:-false}" == 'true' ]]; then
            echo 'Exact Sprint34 successor recognized; stale Sprint33 shape-only guard defers to the additive Sprint34 preservation guard.'
            exit 0
          fi
          git fetch --no-tags origin "${{ github.base_ref }}"
          base="origin/${{ github.base_ref }}"
          git diff --name-only "$base...HEAD" | sort > /tmp/sprint33-files.txt
          test "$(wc -l < /tmp/sprint33-files.txt)" -eq 39
          test "$(sha256sum /tmp/sprint33-files.txt | awk '{print $1}')" = '04a1177c12712183a7dda4ae81be1356c0e41294533336c9f999d376c224712a'
          if grep -Eq '(^|/)\.env($|\.)|(^|/)composer\.(json|lock)$|(^|/)package(-lock)?\.json$|^apps/web/database/migrations/' /tmp/sprint33-files.txt; then
            echo 'Sprint 33 source envelope contains a forbidden environment, dependency, or migration path.' >&2
            exit 1
          fi
          git diff --exit-code "$base...HEAD" -- apps/web/database/migrations

      - name: Enforce canonical migration set remains exactly one through ten
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${ONEQAY_SPRINT34_SUCCESSOR:-false}" == 'true' ]]; then
            echo 'Exact Sprint34 successor recognized; stale Sprint33 shape-only guard defers to the additive Sprint34 preservation guard.'
            exit 0
          fi
          mapfile -t migrations < <(find apps/web/database/migrations -maxdepth 1 -type f -name '*.php' -printf '%f\n' | sort)
          expected=(
            '0000_00_00_000001_create_foundational_context_graph.php'
            '0000_00_00_000002_create_organizational_access_grants.php'
            '0000_00_00_000003_create_scoped_role_permission_policy.php'
            '0000_00_00_000004_create_policy_mutation_journal.php'
            '0000_00_00_000005_create_initial_tenant_administrator_provisioning_journal.php'
            '0000_00_00_000006_create_protected_control_administrator_mutation_journal.php'
            '0000_00_00_000007_create_identity_password_credentials.php'
            '0000_00_00_000008_create_initial_password_enrollments.php'
            '0000_00_00_000009_create_identity_totp_factors.php'
            '0000_00_00_000010_create_identity_recovery_codes.php'
          )
          test "${migrations[*]}" = "${expected[*]}"
          ! find apps/web/database/migrations -maxdepth 1 -type f -name '*000011*' -print -quit | grep -q .

      - name: Preserve exact Sprint 34 migration generic epoch and reset boundary
        if: env.ONEQAY_SPRINT34_SUCCESSOR == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t migrations < <(find apps/web/database/migrations -maxdepth 1 -type f -name '*.php' -printf '%f\n' | sort)
          expected=(
            '0000_00_00_000001_create_foundational_context_graph.php'
            '0000_00_00_000002_create_organizational_access_grants.php'
            '0000_00_00_000003_create_scoped_role_permission_policy.php'
            '0000_00_00_000004_create_policy_mutation_journal.php'
            '0000_00_00_000005_create_initial_tenant_administrator_provisioning_journal.php'
            '0000_00_00_000006_create_protected_control_administrator_mutation_journal.php'
            '0000_00_00_000007_create_identity_password_credentials.php'
            '0000_00_00_000008_create_initial_password_enrollments.php'
            '0000_00_00_000009_create_identity_totp_factors.php'
            '0000_00_00_000010_create_identity_recovery_codes.php'
            '0000_00_00_000011_add_credential_epoch_to_identity_password_credentials.php'
          )
          test "${migrations[*]}" = "${expected[*]}"
          ! find apps/web/database/migrations -maxdepth 1 -type f -name '*000012*' -print -quit | grep -q .
          migration='apps/web/database/migrations/0000_00_00_000011_add_credential_epoch_to_identity_password_credentials.php'
          reset='apps/web/app/Infrastructure/Identity/LaravelRecoveryPasswordResetRepository.php'
          epoch='apps/web/app/Infrastructure/Identity/LaravelFirstPartyCredentialEpochRepository.php'
          keys='apps/web/app/Delivery/Http/Identity/FirstPartySessionKeys.php'
          routes='apps/web/routes/web.php'
          grep -Fq "unsignedBigInteger('credential_epoch')->default(0)" "$migration"
          grep -Fq "where('event_type', 'password_reset_completed')" "$migration"
          grep -Fq 'lockForUpdate()' "$reset"
          grep -Fq 'password_hash($password, PASSWORD_DEFAULT)' "$reset"
          grep -Fq "'credential_epoch' => \$credentialEpoch + 1" "$reset"
          grep -Fq "where('event_type', 'proof_succeeded')" "$reset"
          grep -Fq "where('event_type', 'password_reset_completed')" "$reset"
          grep -Fq "whereNotNull('confirmed_at_unix')" "$reset"
          grep -Fq "where('role_id', self::CONTROL_ROLE)" "$reset"
          if grep -Eq 'table\(self::CREDENTIAL_TABLE\).*(insert|insertOrIgnore|updateOrInsert|upsert|delete|truncate)' "$reset"; then exit 1; fi
          if grep -n -E 'decryptString|secret_ciphertext|provisioningUri' "$reset"; then exit 1; fi
          grep -Fq 'canonicalEpoch(' "$epoch"
          grep -Fq "first(['credential_epoch'])" "$epoch"
          if [[ ! -f apps/web/vendor/autoload.php ]]; then
            (cd apps/web && composer install --no-interaction --no-progress --prefer-dist)
          fi
          test "$(php -r 'require "apps/web/vendor/autoload.php"; echo count(App\Delivery\Http\Identity\FirstPartySessionKeys::all());')" -eq 5
          grep -Fq "RECOVERY_CODE_ID = 'oneqay.auth.recovery.code_id'" "$keys"
          grep -Fq "CREDENTIAL_EPOCH = 'oneqay.auth.credential_epoch'" "$keys"
          grep -Fq "Route::post('/auth/recovery/password-reset'" "$routes"
          if grep -RInE 'RecoveryPasswordReset|auth/recovery/password-reset' apps/web/app/Application/Preview apps/web/app/Delivery/Preview 2>/dev/null; then exit 1; fi

      - name: Preserve root Platform Foundation regression
        run: |
          composer validate --strict --no-check-publish
          composer test

      - name: Install locked application dependencies
        working-directory: apps/web
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist

      - name: Reject High or Critical Composer advisories
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          composer audit --locked --format=json > /tmp/oneqay-s33-composer-audit.json || true
          php -r '$data=json_decode(file_get_contents("/tmp/oneqay-s33-composer-audit.json"),true,512,JSON_THROW_ON_ERROR); foreach (($data["advisories"] ?? []) as $package=>$items) { foreach ($items as $item) { if (in_array(strtolower((string)($item["severity"] ?? "")), ["high","critical"], true)) { fwrite(STDERR,"Blocking Composer advisory for {$package}.\n"); exit(1); } } }'

      - name: Lint Sprint 33 and preserved PHP source
        shell: bash
        run: |
          set -euo pipefail
          find apps/web/app apps/web/database/migrations apps/web/routes apps/web/tests -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do php -l "$file"; done

      - name: Enforce framework-independent Sprint 33 Application boundary
        shell: bash
        run: |
          set -euo pipefail
          files=(
            apps/web/app/Application/Identity/FirstPartyCredentialEpochRepository.php
            apps/web/app/Application/Identity/RecoveryCodeRepository.php
            apps/web/app/Application/Identity/RecoveryCodeService.php
            apps/web/app/Application/Identity/RecoveryPasswordResetRepository.php
            apps/web/app/Application/Identity/RecoveryPasswordResetService.php
            apps/web/app/Application/Identity/RecoveryPasswordResetViolation.php
            apps/web/app/Application/Identity/VerifiedRecoveryProof.php
            apps/web/app/Application/Identity/VerifyFirstPartyCredentialEpoch.php
          )
          if grep -n -E 'Illuminate\\|Schema::|DB::|new PDO|mysqli_|ConnectionInterface|->table\(' "${files[@]}"; then
            echo 'Sprint 33 Application source gained framework or database mechanics.' >&2
            exit 1
          fi
          grep -Fq '#[\SensitiveParameter]' apps/web/app/Application/Identity/RecoveryPasswordResetRepository.php
          grep -Fq '#[\SensitiveParameter]' apps/web/app/Application/Identity/RecoveryPasswordResetService.php
          grep -Fq 'MIN_PASSWORD_BYTES = 12' apps/web/app/Application/Identity/RecoveryPasswordResetService.php
          grep -Fq 'MAX_PASSWORD_BYTES = 4096' apps/web/app/Application/Identity/RecoveryPasswordResetService.php

      - name: Enforce server-bound proof epoch and canonical session vocabulary
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${ONEQAY_SPRINT34_SUCCESSOR:-false}" == 'true' ]]; then
            echo 'Exact Sprint34 successor recognized; stale Sprint33 shape-only guard defers to the additive Sprint34 preservation guard.'
            exit 0
          fi
          keys='apps/web/app/Delivery/Http/Identity/FirstPartySessionKeys.php'
          proof='apps/web/app/Application/Identity/VerifiedRecoveryProof.php'
          epoch='apps/web/app/Infrastructure/Identity/LaravelFirstPartyCredentialEpochRepository.php'
          test "$(php -r 'require "apps/web/vendor/autoload.php"; echo count(App\Delivery\Http\Identity\FirstPartySessionKeys::all());')" -eq 5
          php -r 'require "apps/web/vendor/autoload.php"; $expected=[App\Delivery\Http\Identity\FirstPartySessionKeys::IDENTITY,App\Delivery\Http\Identity\FirstPartySessionKeys::TENANT,App\Delivery\Http\Identity\FirstPartySessionKeys::ORGANIZATION,App\Delivery\Http\Identity\FirstPartySessionKeys::OUTLET,App\Delivery\Http\Identity\FirstPartySessionKeys::DEVICE]; if (App\Delivery\Http\Identity\FirstPartySessionKeys::all() !== $expected) exit(1); if (in_array(App\Delivery\Http\Identity\FirstPartySessionKeys::CREDENTIAL_EPOCH,$expected,true)) exit(1);'
          grep -Fq "RECOVERY_CODE_ID = 'oneqay.auth.recovery.code_id'" "$keys"
          grep -Fq "CREDENTIAL_EPOCH = 'oneqay.auth.credential_epoch'" "$keys"
          grep -Fq 'CODE_ID_PATTERN' "$proof"
          grep -Fq "where('event_type', self::COMPLETION_EVENT)" "$epoch"
          grep -Fq "COMPLETION_EVENT = 'password_reset_completed'" "$epoch"

      - name: Enforce update-only transactional reset completion boundary
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${ONEQAY_SPRINT34_SUCCESSOR:-false}" == 'true' ]]; then
            echo 'Exact Sprint34 successor recognized; stale Sprint33 shape-only guard defers to the additive Sprint34 preservation guard.'
            exit 0
          fi
          repo='apps/web/app/Infrastructure/Identity/LaravelRecoveryPasswordResetRepository.php'
          controller='apps/web/app/Delivery/Http/Identity/RecoveryPasswordResetController.php'
          routes='apps/web/routes/web.php'
          grep -Fq "Route::post('/auth/recovery/password-reset'" "$routes"
          grep -Fq "name('auth.recovery.password-reset')" "$routes"
          grep -Fq 'FirstPartySessionKeys::RECOVERY_CODE_ID' "$controller"
          grep -Fq 'RESTRICTED_SESSION_TTL_SECONDS = 600' "$controller"
          grep -Fq '$session->invalidate();' "$controller"
          grep -Fq '$session->regenerateToken();' "$controller"
          grep -Fq 'password_hash($password, PASSWORD_DEFAULT)' "$repo"
          grep -Fq "where('event_type', 'proof_succeeded')" "$repo"
          grep -Fq "where('event_type', 'password_reset_completed')" "$repo"
          grep -Fq "whereNotNull('confirmed_at_unix')" "$repo"
          grep -Fq "where('role_id', self::CONTROL_ROLE)" "$repo"
          grep -Fq -- "->update(['password_hash' => \$replacementHash])" "$repo"
          if grep -Eq 'table\(self::CREDENTIAL_TABLE\).*(insert|insertOrIgnore|updateOrInsert|upsert|delete|truncate)' "$repo"; then
            echo 'Sprint 33 reset repository gained non-update-only credential mutation.' >&2
            exit 1
          fi
          if grep -n -E 'decryptString|secret_ciphertext|provisioningUri' "$repo" "$controller"; then
            echo 'Sprint 33 reset path gained TOTP secret access.' >&2
            exit 1
          fi

      - name: Run dedicated Sprint 33 recovery-bound password reset regression
        working-directory: apps/web
        run: php tests/recovery-bound-password-reset.php

      - name: Preserve Sprint 32 authentication recovery proof regression
        working-directory: apps/web
        run: php tests/authentication-recovery-proof.php

      - name: Preserve Sprint 21 through Sprint 31 executable regressions
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${ONEQAY_SPRINT36_SUCCESSOR:-false}" == 'true' ]]; then
            git -C ../.. worktree add --detach /tmp/oneqay-s33-canonical-preservation origin/main
            cd /tmp/oneqay-s33-canonical-preservation/apps/web
            composer install --no-interaction --no-progress --prefer-dist
            php tests/tenant-isolation.php
            php tests/identity-org-context.php
            php -r 'require "vendor/autoload.php"; $app=require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Http\Kernel::class)->bootstrap(); $assert=static function(bool $c,string $m):void{if(!$c)throw new RuntimeException($m);}; require "tests/authorization-persistence.php"; require "tests/authorization-administration-persistence.php"; require "tests/initial-tenant-administrator-provisioning.php"; require "tests/protected-control-administrator-lifecycle.php";'
            php tests/policy-administration-delivery.php
            php tests/identity-credential-verification.php
            php tests/first-party-session-establishment.php
            php tests/initial-password-enrollment.php
            php tests/first-control-principal-credential-bootstrap.php
            php tests/privileged-totp-mfa.php
            php tests/privileged-reauthentication-step-up.php
            php tests/privileged-update-security.php
            exit 0
          fi
          git -C ../.. update-index --assume-unchanged apps/web/database/migrations/0000_00_00_000010_create_identity_recovery_codes.php
          git -C ../.. update-index --assume-unchanged apps/web/database/migrations/0000_00_00_000011_add_credential_epoch_to_identity_password_credentials.php
          rm -f database/migrations/0000_00_00_000010_create_identity_recovery_codes.php
          rm -f database/migrations/0000_00_00_000011_add_credential_epoch_to_identity_password_credentials.php
          php tests/tenant-isolation.php
          php tests/identity-org-context.php
          php -r 'require "vendor/autoload.php"; $app=require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Http\Kernel::class)->bootstrap(); $assert=static function(bool $c,string $m):void{if(!$c)throw new RuntimeException($m);}; require "tests/authorization-persistence.php"; require "tests/authorization-administration-persistence.php"; require "tests/initial-tenant-administrator-provisioning.php"; require "tests/protected-control-administrator-lifecycle.php";'
          php tests/policy-administration-delivery.php
          php tests/identity-credential-verification.php
          php tests/first-party-session-establishment.php
          php tests/initial-password-enrollment.php
          php tests/first-control-principal-credential-bootstrap.php
          php tests/privileged-totp-mfa.php
          php tests/privileged-reauthentication-step-up.php
          php tests/privileged-update-security.php

      - name: Prove runtime and protected deployment boundaries
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          ci_routes="$(ONEQAY_RUNTIME_CLASS=ci ONEQAY_AUTHENTICATION_RECOVERY_ENABLED=true php artisan route:list --path=auth/recovery 2>&1)"
          grep -Fq 'auth/recovery/codes/rotate' <<<"$ci_routes"
          grep -Fq 'auth/recovery/proof' <<<"$ci_routes"
          grep -Fq 'auth/recovery/password-reset' <<<"$ci_routes"

          preview_routes="$(ONEQAY_RUNTIME_CLASS=preview ONEQAY_AUTHENTICATION_RECOVERY_ENABLED=true php artisan route:list --path=auth/recovery 2>&1)"
          if grep -Fq 'auth/recovery/' <<<"$preview_routes"; then
            echo 'Sprint 33 recovery route is active in Technical Preview.' >&2
            exit 1
          fi

          production_routes="$(ONEQAY_RUNTIME_CLASS=production ONEQAY_AUTHENTICATION_RECOVERY_ENABLED=true php artisan route:list --path=auth/recovery 2>&1)"
          if grep -Fq 'auth/recovery/' <<<"$production_routes"; then
            echo 'Sprint 33 recovery route is active in Production.' >&2
            exit 1
          fi

          grep -Fq "env('ONEQAY_AUTHENTICATION_RECOVERY_ENABLED', false)" config/oneqay.php
          grep -Fq 'ONEQAY_PERSISTENCE_ENABLED=false' environment.example
          grep -Fq "'install_enabled' => false" config/oneqay.php
          grep -Fq 'Technical Preview remains **NO_SCHEMA_CHANGE**' ../../docs/RECOVERY_BOUND_PASSWORD_RESET_COMPLETION_FOUNDATION.md
          grep -Fq 'Production remains **NO-GO / NOT AUTHORIZED**' ../../docs/RECOVERY_BOUND_PASSWORD_RESET_COMPLETION_FOUNDATION.md
          grep -Fq 'updater remains **DISABLED / UNWIRED**' ../../docs/RECOVERY_BOUND_PASSWORD_RESET_COMPLETION_FOUNDATION.md

      - name: Confirm tracked source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
