name: Sprint 33 Recovery-Bound Password Reset Regression

# Attribution: Lab | zefry
# Historical Sprint 33 fingerprint: 04a1177c12712183a7dda4ae81be1356c0e41294533336c9f999d376c224712a
# Sprint 34 fingerprint: e3b724002cfc0be1ef890d1b5594a2a5179123f949f6f486354e21950c7328eb

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - '.github/workflows/sprint33-recovery-bound-password-reset-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint33-recovery-bound-password-reset-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sprint33-recovery-bound-password-reset-regression:
    name: sprint33-recovery-bound-password-reset-regression
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      ONEQAY_PERSISTENCE_ENABLED: 'false'
      ONEQAY_AUTHENTICATION_RECOVERY_ENABLED: 'false'
      ONEQAY_PRIVILEGED_TOTP_MFA_ENABLED: 'false'
      ONEQAY_PRIVILEGED_STEP_UP_ENABLED: 'false'
      SESSION_DRIVER: array
      CACHE_STORE: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce exact Sprint 34 successor envelope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          base="origin/${{ github.base_ref }}"
          test "$(git rev-parse "$base")" = '8b4fc5425ba8d98f35f02c39bd1880ce50c4759b'
          test "$(git rev-list --count "$base..HEAD")" -eq 1
          test "$(git rev-parse HEAD^)" = '8b4fc5425ba8d98f35f02c39bd1880ce50c4759b'
          git diff --name-only "$base...HEAD" | sort > /tmp/s34-files.txt
          test "$(wc -l < /tmp/s34-files.txt)" -eq 35
          test "$(sha256sum /tmp/s34-files.txt | awk '{print $1}')" = 'e3b724002cfc0be1ef890d1b5594a2a5179123f949f6f486354e21950c7328eb'

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Preserve root and install application
        shell: bash
        run: |
          set -euo pipefail
          composer validate --strict --no-check-publish
          composer test
          cd apps/web
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist

      - name: Enforce recovery reset and generic credential epoch preservation
        shell: bash
        run: |
          set -euo pipefail
          reset='apps/web/app/Infrastructure/Identity/LaravelRecoveryPasswordResetRepository.php'
          epoch='apps/web/app/Infrastructure/Identity/LaravelFirstPartyCredentialEpochRepository.php'
          migration='apps/web/database/migrations/0000_00_00_000011_add_credential_epoch_to_identity_password_credentials.php'
          grep -Fq 'lockForUpdate()' "$reset"
          grep -Fq 'password_hash($password, PASSWORD_DEFAULT)' "$reset"
          grep -Fq "'password_reset_completed'" "$reset"
          grep -Fq "'credential_epoch' => \$credentialEpoch + 1" "$reset"
          grep -Fq 'canonicalEpoch(' "$epoch"
          grep -Fq "first(['credential_epoch'])" "$epoch"
          grep -Fq "unsignedBigInteger('credential_epoch')->default(0)" "$migration"
          grep -Fq "where('event_type', 'password_reset_completed')" "$migration"
          if grep -RInE 'RecoveryPasswordReset|auth/recovery/password-reset' apps/web/app/Application/Preview apps/web/app/Delivery/Preview 2>/dev/null; then exit 1; fi

      - name: Lint full Sprint 34 compatible PHP source
        shell: bash
        run: |
          set -euo pipefail
          find apps/web/app apps/web/database/migrations apps/web/routes apps/web/tests -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do php -l "$file"; done

      - name: Run dedicated Sprint 33 recovery-bound password reset regression fail-closed
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php tests/recovery-bound-password-reset.php 2>&1 | tee /tmp/s33-reset.log
          grep -Fq 'Sprint 33 recovery-bound password reset regression passed.' /tmp/s33-reset.log
          if grep -Fq 'regression failed:' /tmp/s33-reset.log; then exit 1; fi

      - name: Preserve Sprint 32 recovery proof fail-closed
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php tests/authentication-recovery-proof.php 2>&1 | tee /tmp/s32-proof.log
          grep -Fq 'Sprint 32 authentication recovery proof regression passed.' /tmp/s32-proof.log
          if grep -Fq 'regression failed:' /tmp/s32-proof.log; then exit 1; fi

      - name: Preserve Sprint 27 session establishment fail-closed
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php tests/first-party-session-establishment.php 2>&1 | tee /tmp/s27-session.log
          grep -Fq 'Sprint 27 first-party session establishment regression passed.' /tmp/s27-session.log
          if grep -Fq 'regression failed:' /tmp/s27-session.log; then exit 1; fi

      - name: Preserve Preview Production updater boundaries
        shell: bash
        run: |
          set -euo pipefail
          foundation='docs/RECOVERY_BOUND_PASSWORD_RESET_COMPLETION_FOUNDATION.md'
          grep -Fq 'ONEQAY_PERSISTENCE_ENABLED=false' apps/web/environment.example
          grep -Fq "'install_enabled' => false" apps/web/config/oneqay.php
          grep -Fq 'Technical Preview remains **NO_SCHEMA_CHANGE**' "$foundation"
          grep -Fq 'does not authorize deployment, activation in Technical Preview, activation in Production, or updater wiring' "$foundation"
          git diff --exit-code
