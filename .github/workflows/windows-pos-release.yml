# Author by Lab | zefry
name: Signed Windows POS release
on:
  push:
    tags: ['pos-windows-v*']
    branches: [main]
    paths: ['apps/pos-desktop/**', 'packages/service-pos-ui/**', 'packages/ui-theme/**', '.github/workflows/windows-pos-release.yml']
  pull_request:
    paths: ['apps/pos-desktop/**', 'packages/service-pos-ui/**', 'packages/ui-theme/**', '.github/workflows/windows-pos-release.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional existing pos-windows-vX.Y.Z tag on main; blank builds the merged main version'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: windows-pos-stable-publication
  cancel-in-progress: false
jobs:
  signing-key-readiness:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Report signing availability without reading or publishing key material
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -n "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo 'SIGNING_KEY_CONFIGURED=true'
          else
            echo 'SIGNING_KEY_CONFIGURED=false'
            echo '::notice::Compatible in-app publication requires the matching signing key in GitHub Actions secrets. No unsigned fallback is permitted.'
          fi
  release:
    if: github.event_name != 'pull_request'
    runs-on: windows-2022
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/pos-desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.sha }}
      - name: Validate immutable release source and signing availability
        env:
          INPUT_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } elseif ($env:PUSH_TAG) { $env:PUSH_TAG } else { "pos-windows-v$version" }
          if ($tag -notmatch '^pos-windows-v[0-9]+\.[0-9]+\.[0-9]+$' -or $tag -ne "pos-windows-v$version") { throw 'Invalid stable tag/version' }
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release source must already be merged into main' }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEY)) { throw 'Configure the configured TAURI_SIGNING_PRIVATE_KEY in GitHub Actions secrets. No unsigned update will be published.' }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: rustup default 1.99.1
      - run: npm ci --no-audit --no-fund
      - run: cargo test --manifest-path core/Cargo.toml --locked
      - run: python scripts/generate-icon.py
      - name: Build signed installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw 'Configure TAURI_SIGNING_PRIVATE_KEY before publishing an update. The installed app continues working.' }
          npm run tauri -- build --ci --config '{"bundle":{"createUpdaterArtifacts":true}}' --target x86_64-pc-windows-msvc -- --locked
          if ($LASTEXITCODE -ne 0) { throw 'Signed build failed' }
      - run: cargo test --release --locked --target x86_64-pc-windows-msvc --manifest-path src-tauri/Cargo.toml
      - name: Publish signed assets, then stable manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = @(Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe)
          if ($installer.Count -ne 1) { throw 'Expected one installer' }
          $exe = $installer[0]
          $signature = (Get-Content ($exe.FullName + '.sig') -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($signature)) { throw 'Missing update signature' }
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$sha  $($exe.Name)" | Set-Content SHA256SUMS.txt
          $env:ONEQAY_RELEASE_INSTALLER = $exe.FullName
          cargo test --release --locked --target x86_64-pc-windows-msvc --manifest-path src-tauri/Cargo.toml updates::release_tests::verifies_release_signature_against_installed_public_key -- --ignored --exact
          if ($LASTEXITCODE -ne 0) { throw 'Installed updater trust key rejected this asset; stable channel untouched' }
          git show-ref --verify --quiet "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -eq 0) {
            $tagSource = git rev-list -n 1 $env:RELEASE_TAG
            if ($tagSource -ne (git rev-parse HEAD)) { throw 'Version tag points to a different source' }
          } else {
            git tag $env:RELEASE_TAG HEAD
            git push origin "refs/tags/$env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw 'Immutable version tag publication failed' }
          }
          gh release view $env:RELEASE_TAG --repo labzefry/oneQay *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Immutable version already published. Use a new version.' }
          gh release create $env:RELEASE_TAG $exe.FullName ($exe.FullName + '.sig') SHA256SUMS.txt --repo labzefry/oneQay --verify-tag --title "oneQay POS $version" --notes 'Windows POS 0.2.4 recovery trust generation. Older installations require one manual upgrade after backing up local data; install for the whole computer in Program Files. Future updates use stable-v2. Keep the same Windows user and do not delete application data.' --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Version publication failed; stable channel untouched' }
          $url = 'https://github.com/labzefry/oneQay/releases/download/' + $env:RELEASE_TAG + '/' + [Uri]::EscapeDataString($exe.Name)
          @{version=$version;notes="oneQay POS $version";pub_date=(Get-Date).ToUniversalTime().ToString('o');platforms=@{'windows-x86_64'=@{signature=$signature;url=$url}}} | ConvertTo-Json -Depth 6 | Set-Content latest.json
          gh release view pos-windows-stable-v2 --repo labzefry/oneQay *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create pos-windows-stable-v2 --repo labzefry/oneQay --target (git rev-parse HEAD) --title 'oneQay POS stable update channel' --notes 'Only the signed update manifest is mutable. Versioned installers remain immutable.' --latest=false
            if ($LASTEXITCODE -ne 0) { throw 'Stable channel creation failed' }
          }
          gh release upload pos-windows-stable-v2 latest.json --clobber --repo labzefry/oneQay
          if ($LASTEXITCODE -ne 0) { throw 'Stable manifest publication failed' }
