# Author by Lab | zefry
name: Production Merchant Commercial Go-Live Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  merchant-commercial-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      ONEQAY_PERSISTENCE_ENABLED: 'false'
      SESSION_DRIVER: array
      CACHE_STORE: array
      LOG_CHANNEL: stderr
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: pdo_mysql,pdo_sqlite,mbstring,openssl
          tools: composer:v2
          coverage: none
      - name: Verify no schema mutation or legacy staging cutover
        run: |
          test -f ops/production/BUSINESS_RUNTIME_AUTHORIZED_PATHS.txt
          test "$(grep -c 'ProductionBusinessRuntimeGate::allows' apps/web/routes/web.php)" -eq 7
          grep -Fq "['local', 'test', 'ci']" apps/web/app/Providers/FinalShiftCloseServiceProvider.php
          ! grep -Fq 'ProductionBusinessRuntimeGate::allows' apps/web/app/Console/Commands/MerchantContextBootstrapCommand.php
          ! grep -Fq 'ProductionBusinessRuntimeGate::allows' apps/web/app/Application/Preview/TechnicalPreviewRuntimePolicy.php
          grep -Fq "!== TenderCategory::CASH" apps/web/app/Infrastructure/Pos/LaravelDurablePosSaleRepository.php
          test "$(find apps/web/database/migrations -maxdepth 1 -name '*.php' | wc -l)" -eq 27
      - name: PHP lint for all application source
        run: |
          find apps/web/app -type f -name '*.php' -print0 | xargs -0 -n 1 php -l > "$RUNNER_TEMP/php-lint.log"
          php -l apps/web/routes/web.php
          tail -n 2 "$RUNNER_TEMP/php-lint.log"
      - name: Hardened production business admission regression
        run: |
          php apps/web/tests/production-commercial-runtime-integration.php
          php apps/web/tests/production-business-runtime-gate.php
      - name: Install dependencies without secrets
        run: |
          cd apps/web
          composer validate --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress
      - name: Full first-party Laravel contract and POS regressions
        run: |
          cd apps/web
          composer test
      - name: Keep dark release build governance unchanged
        run: |
          grep -Fq '"business_runtime_activation_ready":false' tools/build-production-release.sh
          grep -Fq "prodManifestEq(" tools/validate-production-release-manifest.php
          git diff --exit-code
