name: Sprint 25 Policy Administration Delivery Regression

# Attribution: Lab | zefry

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/app/Application/Authorization/PolicyAdministrationDeliveryCommand.php'
      - 'apps/web/app/Application/Authorization/PolicyAdministrationDeliveryService.php'
      - 'apps/web/app/Application/Authorization/PolicyAdministrationDeliveryViolation.php'
      - 'apps/web/app/Application/Identity/**'
      - 'apps/web/app/Infrastructure/Identity/**'
      - 'apps/web/app/Delivery/Http/Authorization/PolicyAdministrationController.php'
      - 'apps/web/app/Delivery/Http/Identity/**'
      - 'apps/web/app/Delivery/Http/Middleware/RequirePolicyAdministrationSessionContextMiddleware.php'
      - 'apps/web/app/Providers/AppServiceProvider.php'
      - 'apps/web/routes/web.php'
      - 'apps/web/database/migrations/**'
      - 'apps/web/tests/initial-password-enrollment.php'
      - 'apps/web/tests/first-party-session-establishment.php'
      - 'apps/web/tests/identity-credential-verification.php'
      - 'apps/web/tests/policy-administration-delivery.php'
      - '.github/workflows/m7-2-tenant-isolation-regression.yml'
      - '.github/workflows/m7-3-identity-org-context-regression.yml'
      - '.github/workflows/m7-4a-technical-preview-interaction-regression.yml'
      - '.github/workflows/m7-5-preview-db-qualification-regression.yml'
      - '.github/workflows/sprint21-role-permission-policy-regression.yml'
      - '.github/workflows/sprint22-policy-administration-regression.yml'
      - '.github/workflows/sprint23-initial-tenant-admin-provisioning-regression.yml'
      - '.github/workflows/sprint24-protected-control-admin-lifecycle-regression.yml'
      - '.github/workflows/sprint25-policy-administration-delivery-regression.yml'
      - '.github/workflows/sprint26-identity-credential-verification-regression.yml'
      - '.github/workflows/sprint27-first-party-session-establishment-regression.yml'
      - '.github/workflows/sprint28-initial-password-enrollment-regression.yml'
      - 'docs/FIRST_PARTY_IDENTITY_CREDENTIAL_VERIFICATION_FOUNDATION.md'
      - 'docs/FIRST_PARTY_LOGIN_SESSION_ESTABLISHMENT_FOUNDATION.md'
      - 'docs/FIRST_PARTY_INITIAL_PASSWORD_ENROLLMENT_FOUNDATION.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint25-policy-administration-delivery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sprint25-policy-administration-delivery-regression:
    name: sprint25-policy-administration-delivery-regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      SESSION_DRIVER: array
      CACHE_STORE: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Recognize exact Sprint 30 through Sprint 34 bounded successors
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" | sort > /tmp/oneqay-successor-files.txt
          count="$(wc -l < /tmp/oneqay-successor-files.txt)"
          fingerprint="$(sha256sum /tmp/oneqay-successor-files.txt | awk '{print $1}')"
          if [[ "$count" -eq 35 ]] && [[ "$fingerprint" == 'e3b724002cfc0be1ef890d1b5594a2a5179123f949f6f486354e21950c7328eb' ]]; then
            echo 'ONEQAY_SPRINT30_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT31_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT32_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT33_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT34_SUCCESSOR=true' >> "$GITHUB_ENV"
            git update-index --assume-unchanged apps/web/database/migrations/0000_00_00_000010_create_identity_recovery_codes.php
            git update-index --assume-unchanged apps/web/database/migrations/0000_00_00_000011_add_credential_epoch_to_identity_password_credentials.php
            rm -f apps/web/database/migrations/0000_00_00_000010_create_identity_recovery_codes.php
            rm -f apps/web/database/migrations/0000_00_00_000011_add_credential_epoch_to_identity_password_credentials.php
          elif [[ "$count" -eq 39 ]] && [[ "$fingerprint" == '04a1177c12712183a7dda4ae81be1356c0e41294533336c9f999d376c224712a' ]]; then
            echo 'ONEQAY_SPRINT30_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT31_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT32_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT33_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT34_SUCCESSOR=false' >> "$GITHUB_ENV"
            git update-index --assume-unchanged apps/web/database/migrations/0000_00_00_000010_create_identity_recovery_codes.php
            rm -f apps/web/database/migrations/0000_00_00_000010_create_identity_recovery_codes.php
          elif [[ "$count" -eq 32 ]] && [[ "$fingerprint" == 'db230ab3b77fff67f0bd12d7d7b615146d9d9df9a0af12014214e1862e9f6867' ]]; then
            echo 'ONEQAY_SPRINT30_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT31_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT32_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT33_SUCCESSOR=false' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT34_SUCCESSOR=false' >> "$GITHUB_ENV"
            git update-index --assume-unchanged apps/web/database/migrations/0000_00_00_000010_create_identity_recovery_codes.php
            rm -f apps/web/database/migrations/0000_00_00_000010_create_identity_recovery_codes.php
          elif [[ "$count" -eq 46 ]] && [[ "$fingerprint" == '95daaf86ba93ae797fccf3825d65d27acd4f71ee58916898a16fbc83d432a5ce' ]]; then
            echo 'ONEQAY_SPRINT30_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT31_SUCCESSOR=false' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT32_SUCCESSOR=false' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT33_SUCCESSOR=false' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT34_SUCCESSOR=false' >> "$GITHUB_ENV"
          elif [[ "$count" -eq 26 ]] && [[ "$fingerprint" == '8136b57a5c9949ec5020a3d5ae497f34431a704900eb0447d42fdb791efb6e39' ]]; then
            echo 'ONEQAY_SPRINT30_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT31_SUCCESSOR=true' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT32_SUCCESSOR=false' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT33_SUCCESSOR=false' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT34_SUCCESSOR=false' >> "$GITHUB_ENV"
          else
            echo 'ONEQAY_SPRINT30_SUCCESSOR=false' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT31_SUCCESSOR=false' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT32_SUCCESSOR=false' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT33_SUCCESSOR=false' >> "$GITHUB_ENV"
            echo 'ONEQAY_SPRINT34_SUCCESSOR=false' >> "$GITHUB_ENV"
          fi

      - name: Enforce exact authorized Sprint 28 envelope
        if: github.event_name == 'pull_request' && env.ONEQAY_SPRINT30_SUCCESSOR != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" | sort > /tmp/s29-successor-files.txt
          if [[ "$(wc -l < /tmp/s29-successor-files.txt)" -eq 20 ]] && [[ "$(sha256sum /tmp/s29-successor-files.txt | awk '{print $1}')" == '29ab63415c913c80aed0f19eb97d547cc31c60bd38a2484a0e6dc0f3c8341d03' ]]; then
            echo 'Exact Sprint 29 successor envelope accepted for Sprint 25 preservation.'
            exit 0
          fi
          base="origin/${{ github.base_ref }}"
          git diff --name-only "$base...HEAD" > /tmp/sprint28-files.txt
          test -s /tmp/sprint28-files.txt
          while IFS= read -r file; do
            case "$file" in
              apps/web/app/Application/Identity/InitialPasswordEnrollmentId.php|\
              apps/web/app/Application/Identity/IssuedInitialPasswordEnrollment.php|\
              apps/web/app/Application/Identity/InitialPasswordEnrollmentRepository.php|\
              apps/web/app/Application/Identity/InitialPasswordEnrollmentService.php|\
              apps/web/app/Application/Identity/InitialPasswordEnrollmentViolation.php|\
              apps/web/app/Infrastructure/Identity/LaravelInitialPasswordEnrollmentRepository.php|\
              apps/web/app/Providers/AppServiceProvider.php|\
              apps/web/app/Delivery/Http/Identity/InitialPasswordEnrollmentController.php|\
              apps/web/routes/web.php|\
              apps/web/database/migrations/0000_00_00_000008_create_initial_password_enrollments.php|\
              apps/web/tests/initial-password-enrollment.php|\
              .github/workflows/sprint28-initial-password-enrollment-regression.yml|\
              docs/FIRST_PARTY_INITIAL_PASSWORD_ENROLLMENT_FOUNDATION.md|\
              apps/web/tests/authorization-persistence.php|\
              apps/web/tests/authorization-administration-persistence.php|\
              apps/web/tests/initial-tenant-administrator-provisioning.php|\
              apps/web/tests/protected-control-administrator-lifecycle.php|\
              apps/web/tests/tenant-isolation.php|\
              apps/web/tests/identity-org-context.php|\
              apps/web/tests/policy-administration-delivery.php|\
              apps/web/tests/identity-credential-verification.php|\
              apps/web/tests/first-party-session-establishment.php|\
              .github/workflows/m7-2-tenant-isolation-regression.yml|\
              .github/workflows/m7-3-identity-org-context-regression.yml|\
              .github/workflows/m7-4a-technical-preview-interaction-regression.yml|\
              .github/workflows/m7-5-preview-db-qualification-regression.yml|\
              .github/workflows/sprint21-role-permission-policy-regression.yml|\
              .github/workflows/sprint22-policy-administration-regression.yml|\
              .github/workflows/sprint23-initial-tenant-admin-provisioning-regression.yml|\
              .github/workflows/sprint24-protected-control-admin-lifecycle-regression.yml|\
              .github/workflows/sprint25-policy-administration-delivery-regression.yml|\
              .github/workflows/sprint26-identity-credential-verification-regression.yml|\
              .github/workflows/sprint27-first-party-session-establishment-regression.yml)
                ;;
              *) echo "Unauthorized Sprint 28 changed path: $file" >&2; exit 1 ;;
            esac
          done < /tmp/sprint28-files.txt
          test "$(wc -l < /tmp/sprint28-files.txt)" -eq 33
          if grep -Eq '(^|/)(composer\.(json|lock)|package(-lock)?\.json)$' /tmp/sprint28-files.txt; then exit 1; fi
          immutable=(
            apps/web/database/migrations/0000_00_00_000001_create_foundational_context_graph.php
            apps/web/database/migrations/0000_00_00_000002_create_organizational_access_grants.php
            apps/web/database/migrations/0000_00_00_000003_create_scoped_role_permission_policy.php
            apps/web/database/migrations/0000_00_00_000004_create_policy_mutation_journal.php
            apps/web/database/migrations/0000_00_00_000005_create_initial_tenant_administrator_provisioning_journal.php
            apps/web/database/migrations/0000_00_00_000006_create_protected_control_administrator_mutation_journal.php
            apps/web/database/migrations/0000_00_00_000007_create_identity_password_credentials.php
          )
          git diff --exit-code "$base...HEAD" -- "${immutable[@]}"
          mapfile -t migration_diff < <(git diff --name-status "$base...HEAD" -- apps/web/database/migrations)
          test "${#migration_diff[@]}" -eq 1
          test "${migration_diff[0]}" = $'A\tapps/web/database/migrations/0000_00_00_000008_create_initial_password_enrollments.php'

      - name: Preserve root Platform Foundation regression
        run: |
          composer validate --strict --no-check-publish
          composer test

      - name: Install locked application dependencies
        working-directory: apps/web
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist

      - name: Validate PHP syntax and Application boundary
        shell: bash
        run: |
          set -euo pipefail
          find apps/web/app apps/web/bootstrap apps/web/config apps/web/database apps/web/public apps/web/routes apps/web/tests -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do php -l "$file"; done
          if grep -R -n -E 'Illuminate\\|Schema::|DB::|new PDO|mysqli_' apps/web/app/Application/Authorization/PolicyAdministrationDeliveryCommand.php apps/web/app/Application/Authorization/PolicyAdministrationDeliveryService.php apps/web/app/Application/Authorization/PolicyAdministrationDeliveryViolation.php; then
            echo 'Sprint 25 Application delivery boundary gained framework/database mechanics.' >&2; exit 1
          fi
          if grep -R -n -E 'Illuminate\\|Schema::|DB::|new PDO|mysqli_' apps/web/app/Application/Identity; then
            echo 'Application identity boundary gained framework/database mechanics.' >&2; exit 1
          fi
          grep -Fq 'DurablePolicyAdministrationService' apps/web/app/Application/Authorization/PolicyAdministrationDeliveryService.php
          grep -Fq 'PolicyMutationOperation::fromString' apps/web/app/Application/Authorization/PolicyAdministrationDeliveryCommand.php
          grep -Fq 'DurablePolicyMutation::roleCreate' apps/web/app/Application/Authorization/PolicyAdministrationDeliveryCommand.php
          grep -Fq 'DurablePolicyMutation::roleAssignment' apps/web/app/Application/Authorization/PolicyAdministrationDeliveryCommand.php

      - name: Enforce exact eight-migration preservation
        if: env.ONEQAY_SPRINT30_SUCCESSOR != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t migrations < <(find apps/web/database/migrations -maxdepth 1 -type f -name '*.php' -printf '%f\n' | sort)
          expected=(
            '0000_00_00_000001_create_foundational_context_graph.php'
            '0000_00_00_000002_create_organizational_access_grants.php'
            '0000_00_00_000003_create_scoped_role_permission_policy.php'
            '0000_00_00_000004_create_policy_mutation_journal.php'
            '0000_00_00_000005_create_initial_tenant_administrator_provisioning_journal.php'
            '0000_00_00_000006_create_protected_control_administrator_mutation_journal.php'
            '0000_00_00_000007_create_identity_password_credentials.php'
            '0000_00_00_000008_create_initial_password_enrollments.php'
          )
          test "${migrations[*]}" = "${expected[*]}"
          credential_migration='apps/web/database/migrations/0000_00_00_000007_create_identity_password_credentials.php'
          enrollment_migration='apps/web/database/migrations/0000_00_00_000008_create_initial_password_enrollments.php'
          grep -Fq 'oneqay_identity_password_credentials' "$credential_migration"
          grep -Fq "string('identity_id', 96)" "$credential_migration"
          grep -Fq "primary(['tenant_id', 'identity_id']" "$credential_migration"
          grep -Fq "references(['tenant_id', 'id'])" "$credential_migration"
          grep -Fq 'oneqay_initial_password_enrollments' "$enrollment_migration"
          grep -Fq 'uq_initial_password_enrollment_active_target' "$enrollment_migration"

      - name: Enforce Sprint 25 session CSRF and verification boundary
        shell: bash
        run: |
          set -euo pipefail
          routes='apps/web/routes/web.php'
          middleware='apps/web/app/Delivery/Http/Middleware/RequirePolicyAdministrationSessionContextMiddleware.php'
          controller='apps/web/app/Delivery/Http/Authorization/PolicyAdministrationController.php'
          provider='apps/web/app/Providers/AppServiceProvider.php'
          test "$(grep -Fc "Route::post('/administration/policy/mutations'" "$routes")" -eq 1
          if grep -Fq "Route::get('/administration/policy" "$routes"; then exit 1; fi
          if grep -Ei 'technical-preview.*administration/policy|administration/policy.*technical-preview' "$routes"; then exit 1; fi
          grep -Fq "['local', 'test', 'ci']" "$middleware"
          grep -Fq 'FirstPartySessionKeys::IDENTITY' "$middleware"
          grep -Fq 'ServerVerifiedPlatformIdentity' "$middleware"
          grep -Fq 'ServerVerifiedTenantContext' "$middleware"
          grep -Fq 'EnterOrganizationalContext' "$middleware"
          grep -Fq 'finally' "$middleware"
          if grep -Eq '\$request->(input|query|header)\(' "$middleware"; then
            echo 'Session context middleware reads authority from request input/query/header.' >&2; exit 1
          fi
          grep -Fq "except('_token')" "$controller"
          grep -Fq 'TenantMembershipVerifier::class' "$provider"
          grep -Fq 'LaravelTenantMembershipVerifier' "$provider"
          grep -Fq 'OrganizationalRelationshipVerifier::class' "$provider"
          grep -Fq 'LaravelOrganizationalRelationshipVerifier' "$provider"
          grep -Fq 'OrganizationalContextStore::class' "$provider"
          grep -Fq 'RequestOrganizationalContextStore' "$provider"
          grep -Fq 'FirstPartyIdentityCredentialVerifier::class' "$provider"
          grep -Fq 'LaravelFirstPartyIdentityCredentialVerifier' "$provider"
          grep -Fq 'InitialPasswordEnrollmentRepository::class' "$provider"
          grep -Fq 'LaravelInitialPasswordEnrollmentRepository' "$provider"
          if grep -Fq 'InitialTenantAdministratorProvisioningAuthority::class' "$provider"; then exit 1; fi
          if grep -R -n -E 'ValidateCsrfToken.*except|withoutMiddleware|csrf.*except' apps/web/routes/web.php apps/web/app/Delivery/Http/Authorization/PolicyAdministrationController.php apps/web/app/Delivery/Http/Middleware/RequirePolicyAdministrationSessionContextMiddleware.php apps/web/app/Delivery/Http/Identity; then
            echo 'First-party delivery introduced a CSRF bypass.' >&2; exit 1
          fi

      - name: Enforce protected-control Preview Production and updater separation
        shell: bash
        run: |
          set -euo pipefail
          delivery_files=(
            apps/web/app/Application/Authorization/PolicyAdministrationDeliveryCommand.php
            apps/web/app/Application/Authorization/PolicyAdministrationDeliveryService.php
            apps/web/app/Delivery/Http/Authorization/PolicyAdministrationController.php
            apps/web/app/Delivery/Http/Middleware/RequirePolicyAdministrationSessionContextMiddleware.php
          )
          if grep -n -E 'InitialTenantAdministratorProvisioning(Service|Authority)|PreauthorizedInitialTenantAdministratorProvisioningAuthority|ProtectedControlAdministratorLifecycle(Service|Repository)|control\.administrator\.(delegate|revoke)' "${delivery_files[@]}"; then exit 1; fi
          if grep -R -n -E 'PolicyAdministrationDelivery|PolicyAdministrationController|RequirePolicyAdministrationSessionContextMiddleware|FirstPartyIdentityCredentialVerifier|VerifyFirstPartyIdentityCredential|LaravelFirstPartyIdentityCredentialVerifier|FirstPartySessionController|FirstPartySessionKeys|InitialPasswordEnrollment|password-enrollment' apps/web/app/Application/Preview apps/web/app/Delivery/Preview; then exit 1; fi
          grep -Fq 'ONEQAY_PERSISTENCE_ENABLED=false' apps/web/environment.example
          grep -Fq '/apps/web/database/migrations/' .github/workflows/m7-5-preview-release-artifact.yml
          grep -Fq 'NO_SCHEMA_CHANGE' .github/workflows/m7-5-preview-release-artifact.yml
          grep -Fq 'php tests/privileged-update-security.php' .github/workflows/sprint22-policy-administration-regression.yml

      - name: Run Sprint 25 disposable HTTP delivery regression
        working-directory: apps/web
        run: php tests/policy-administration-delivery.php

      - name: Preserve Sprint 21 through Sprint 28 regressions
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          composer test
          php -r 'require "vendor/autoload.php"; $app=require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Http\Kernel::class)->bootstrap(); $assert=static function(bool $c,string $m):void{if(!$c)throw new RuntimeException($m);}; require "tests/authorization-persistence.php"; require "tests/authorization-administration-persistence.php"; require "tests/initial-tenant-administrator-provisioning.php"; require "tests/protected-control-administrator-lifecycle.php";'
          php tests/tenant-isolation.php
          php tests/identity-org-context.php
          php tests/privileged-update-security.php
          php tests/identity-credential-verification.php
          php tests/first-party-session-establishment.php
          php tests/initial-password-enrollment.php

      - name: Preserve tracked source
        run: git diff --exit-code
