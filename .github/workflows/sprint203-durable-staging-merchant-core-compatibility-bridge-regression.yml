# Author by Lab | zefry
name: Sprint203 Durable Staging Merchant Core Compatibility Bridge Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint203-durable-staging-merchant-core-compatibility-bridge-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify-sprint203-durable-staging-merchant-core-bridge:
    name: qualify-sprint203-durable-staging-merchant-core-bridge
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: "false"
      APP_URL: http://127.0.0.1
      ONEQAY_RUNTIME_CLASS: ci
      SESSION_DRIVER: array
      CACHE_STORE: array
      LOG_CHANNEL: stderr

    steps:
      - name: Checkout exact Sprint203 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Qualify exact Sprint203 engineering envelope
        if: github.event_name == 'pull_request' && github.head_ref == 'sprint203-durable-staging-merchant-core-compatibility-bridge'
        shell: bash
        env:
          EXPECTED_PATH_HASH: cf8b06e413df786201c8c0d9076f41737ec2cedcf303d0f6a9aab4e987f2f212
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          mapfile -t paths < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | LC_ALL=C sort)
          expected=(
            ".github/workflows/sprint203-durable-staging-merchant-core-compatibility-bridge-regression.yml"
            "apps/web/app/Application/Runtime/DurableStagingRuntimeBridge.php"
            "apps/web/app/Console/Commands/MerchantContextBootstrapCommand.php"
            "apps/web/app/Delivery/Http/Identity/FirstPartySessionController.php"
            "apps/web/app/Providers/AppServiceProvider.php"
            "apps/web/app/Providers/PosCashierWorkspaceServiceProvider.php"
            "apps/web/app/Providers/PosCatalogInventorySetupWorkspaceServiceProvider.php"
            "apps/web/app/Providers/PosOperationsHubServiceProvider.php"
            "apps/web/app/Providers/PosShiftStartWorkspaceServiceProvider.php"
            "apps/web/config/oneqay.php"
            "apps/web/resources/views/app.blade.php"
            "apps/web/routes/web.php"
            "apps/web/tests/durable-staging-merchant-core-compatibility-bridge.php"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${paths[@]}")
          actual_hash="$(printf '%s\n' "${paths[@]}" | sha256sum | awk '{print $1}')"
          test "$actual_hash" = "$EXPECTED_PATH_HASH"

      - name: Preserve operational NO-GO
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" = NOT_EXECUTED
          test "$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)" = NONE
          test "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" = INACTIVE
          test "$(jq -r '.deployment_authority' ops/final-shift-close/STATE.json)" = NOT_GRANTED
          test "$(jq -r '.technical_preview_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
          test "$(jq -r '.production_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
          test "$(jq -r '.updater_activation' ops/final-shift-close/STATE.json)" = INACTIVE
          test "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET
          test "$(jq -r '.selected_target' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = null

      - name: Setup PHP 8.3 runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Validate Sprint203 bridge and source contracts
        shell: bash
        run: |
          set -euo pipefail
          php -l apps/web/app/Application/Runtime/DurableStagingRuntimeBridge.php
          php -l apps/web/app/Console/Commands/MerchantContextBootstrapCommand.php
          php -l apps/web/app/Delivery/Http/Identity/FirstPartySessionController.php
          php -l apps/web/app/Providers/AppServiceProvider.php
          php -l apps/web/routes/web.php
          php -l apps/web/tests/durable-staging-merchant-core-compatibility-bridge.php
          php apps/web/tests/durable-staging-merchant-core-compatibility-bridge.php
          ! grep -R -E 'ChatGPT|OpenAI|Copilot|Gemini' \
            apps/web/app/Application/Runtime/DurableStagingRuntimeBridge.php \
            apps/web/app/Console/Commands/MerchantContextBootstrapCommand.php \
            apps/web/app/Delivery/Http/Identity/FirstPartySessionController.php \
            apps/web/app/Providers/AppServiceProvider.php \
            apps/web/app/Providers/PosCashierWorkspaceServiceProvider.php \
            apps/web/app/Providers/PosCatalogInventorySetupWorkspaceServiceProvider.php \
            apps/web/app/Providers/PosOperationsHubServiceProvider.php \
            apps/web/app/Providers/PosShiftStartWorkspaceServiceProvider.php \
            apps/web/config/oneqay.php \
            apps/web/resources/views/app.blade.php \
            apps/web/routes/web.php \
            apps/web/tests/durable-staging-merchant-core-compatibility-bridge.php

      - name: Install locked application dependencies
        working-directory: apps/web
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          composer audit --locked --abandoned=report

      - name: Preserve historical merchant core regressions
        working-directory: apps/web
        run: |
          php tests/merchant-context-guarded-bootstrap-delivery.php
          php tests/pos-catalog-inventory-setup-workspace.php
          php tests/pos-shift-start-workspace.php
          php tests/pos-cashier-workspace.php
          php tests/pos-sale-completion-durable.php
          php tests/durable-staging-merchant-core-compatibility-bridge.php

      - name: Setup exact Node LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.19.0

      - name: Type-check and build merchant application
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts --no-fund
          npm run type-check
          npm run build

      - name: Confirm source cleanliness
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
