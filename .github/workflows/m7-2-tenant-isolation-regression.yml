name: M7.2 Tenant Isolation Regression

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/web/app/Domain/Tenancy/**'
      - 'apps/web/app/Application/Tenancy/**'
      - 'apps/web/app/Application/Persistence/**'
      - 'apps/web/app/Application/Access/**'
      - 'apps/web/app/Infrastructure/Tenancy/**'
      - 'apps/web/app/Infrastructure/Access/**'
      - 'apps/web/app/Infrastructure/Organization/LaravelOrganizationalRelationshipVerifier.php'
      - 'apps/web/app/Infrastructure/Persistence/LaravelDurableContextGraphRepository.php'
      - 'apps/web/app/Infrastructure/Persistence/LaravelPersistenceTransaction.php'
      - 'apps/web/app/Infrastructure/Configuration/CriticalConfiguration.php'
      - 'apps/web/app/Delivery/Http/Middleware/**'
      - 'apps/web/app/Providers/AppServiceProvider.php'
      - 'apps/web/bootstrap/app.php'
      - 'apps/web/config/database.php'
      - 'apps/web/environment.example'
      - 'apps/web/database/migrations/0000_00_00_000001_create_foundational_context_graph.php'
      - 'apps/web/database/migrations/0000_00_00_000002_create_organizational_access_grants.php'
      - 'apps/web/tests/persistence.php'
      - 'apps/web/tests/access-persistence.php'
      - 'apps/web/tests/tenant-isolation.php'
      - 'apps/web/tests/identity-org-context.php'
      - 'apps/web/tests/run.php'
      - 'docs/DURABLE_APPLICATION_PERSISTENCE_FOUNDATION.md'
      - 'docs/DURABLE_IDENTITY_ORGANIZATIONAL_ACCESS_PERSISTENCE_FOUNDATION.md'
      - '.github/workflows/m7-2-tenant-isolation-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m7-2-tenant-isolation-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  m7-2-tenant-isolation-regression:
    name: m7-2-tenant-isolation-regression
    runs-on: ubuntu-latest
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: "false"
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      SESSION_DRIVER: array
      CACHE_STORE: array
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce bounded M7.2 and Sprint 19/20 persistence envelope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/m72-changed-files.txt
          test -s /tmp/m72-changed-files.txt
          while IFS= read -r file; do
            case "$file" in
              apps/web/app/Application/Access/DurableOrganizationalAccessGrant.php|\
              apps/web/app/Application/Access/DurableOrganizationalAccessRepository.php|\
              apps/web/app/Application/Access/DurableOrganizationalAccessService.php|\
              apps/web/app/Application/Access/DurableOrganizationalAccessViolation.php|\
              apps/web/app/Infrastructure/Access/LaravelDurableOrganizationalAccessRepository.php|\
              apps/web/app/Infrastructure/Tenancy/LaravelTenantMembershipVerifier.php|\
              apps/web/app/Infrastructure/Organization/LaravelOrganizationalRelationshipVerifier.php|\
              apps/web/app/Providers/AppServiceProvider.php|\
              apps/web/database/migrations/0000_00_00_000002_create_organizational_access_grants.php|\
              apps/web/tests/access-persistence.php|\
              apps/web/tests/run.php|\
              apps/web/tests/tenant-isolation.php|\
              apps/web/tests/identity-org-context.php|\
              .github/workflows/m7-2-tenant-isolation-regression.yml|\
              .github/workflows/m7-3-identity-org-context-regression.yml|\
              .github/workflows/m7-5-preview-db-qualification-regression.yml|\
              docs/DURABLE_IDENTITY_ORGANIZATIONAL_ACCESS_PERSISTENCE_FOUNDATION.md|\
              apps/web/app/Domain/Tenancy/*|\
              apps/web/app/Application/Tenancy/*|\
              apps/web/app/Application/Persistence/*|\
              apps/web/app/Infrastructure/Tenancy/RequestTenantContextStore.php|\
              apps/web/app/Infrastructure/Tenancy/ServerVerifiedTenantContext.php|\
              apps/web/app/Infrastructure/Tenancy/SyntheticTenantMembershipVerifier.php|\
              apps/web/app/Infrastructure/Persistence/LaravelDurableContextGraphRepository.php|\
              apps/web/app/Infrastructure/Persistence/LaravelPersistenceTransaction.php|\
              apps/web/app/Infrastructure/Configuration/CriticalConfiguration.php|\
              apps/web/app/Delivery/Http/Middleware/*|\
              apps/web/bootstrap/app.php|\
              apps/web/config/database.php|\
              apps/web/environment.example|\
              apps/web/database/migrations/0000_00_00_000001_create_foundational_context_graph.php|\
              apps/web/tests/persistence.php|\
              docs/DURABLE_APPLICATION_PERSISTENCE_FOUNDATION.md|\
              .github/workflows/m7-4-pos-core-synthetic-regression.yml|\
              .github/workflows/README.md|\
              AI_CONSTITUTION.md|\
              ARCHITECTURE.md|\
              README.md|\
              ROADMAP.md|\
              TASKS.md|\
              docs/ai/AI_SESSION_STATE.md|\
              docs/ai/AI_M7_5_SECURITY_HEADERS_ENV_SECRETS_STATE.md|\
              docs/evidence/runtime/p1-cpanel-environment-secrets-security-headers-20260816.json|\
              docs/evidence/runtime/p1-cpanel-live-runtime-reconciled-20260816-security-env.json|\
              docs/evidence/runtime/p1-cpanel-live-runtime-reconciled-20260816-security-env.report.json|\
              docs/handbook/M7_5_P1_SECURITY_HEADERS_ENV_SECRETS_EVIDENCE_20260816.md)
                ;;
              *)
                echo "M7.2 unauthorized changed path: $file" >&2
                exit 1
                ;;
            esac
          done < /tmp/m72-changed-files.txt

      - name: Preserve root Platform Foundation regression
        run: |
          composer validate --strict --no-check-publish
          composer test

      - name: Validate PHP runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          php --version
          php -r 'if (PHP_VERSION_ID < 80200 || PHP_VERSION_ID >= 80600) { fwrite(STDERR, "M7.2 requires governed PHP 8.2-8.5 compatibility.\n"); exit(1); }'
          composer --version

      - name: Setup exact Node LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.19.0

      - name: Require unchanged deterministic dependency locks
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/composer.lock
          test -f apps/web/package-lock.json
          if git diff --name-only "origin/${{ github.base_ref || 'main' }}...HEAD" 2>/dev/null | grep -Eq '(^|/)(composer\.(json|lock)|package(-lock)?\.json)$'; then
            echo "M7.2/Sprint20 does not authorize dependency-manifest or lockfile changes." >&2
            exit 1
          fi

      - name: Validate application Composer metadata
        working-directory: apps/web
        run: composer validate --no-check-publish

      - name: Install locked Composer dependencies
        working-directory: apps/web
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Reject High or Critical Composer advisories
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          composer audit --locked --format=json > /tmp/oneqay-composer-audit.json || true
          cat /tmp/oneqay-composer-audit.json
          php -r '
            $data = json_decode(file_get_contents("/tmp/oneqay-composer-audit.json"), true, 512, JSON_THROW_ON_ERROR);
            foreach (($data["advisories"] ?? []) as $package => $items) {
                foreach ($items as $item) {
                    $severity = strtolower((string) ($item["severity"] ?? ""));
                    if (in_array($severity, ["high", "critical"], true)) {
                        fwrite(STDERR, "Blocking Composer advisory for {$package}: ".($item["advisoryId"] ?? "unknown")."\n");
                        exit(1);
                    }
                }
            }
          '

      - name: Validate application PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find apps/web/app apps/web/bootstrap apps/web/config apps/web/database apps/web/public apps/web/routes apps/web/tests \
            -type f -name '*.php' -print0 |
            while IFS= read -r -d '' file; do
              php -l "$file"
            done

      - name: Enforce tenant-safe durable persistence and access boundaries
        shell: bash
        run: |
          set -euo pipefail
          s19='apps/web/database/migrations/0000_00_00_000001_create_foundational_context_graph.php'
          s20='apps/web/database/migrations/0000_00_00_000002_create_organizational_access_grants.php'
          access='apps/web/app/Infrastructure/Access/LaravelDurableOrganizationalAccessRepository.php'
          test -f "$s19"
          test -f "$s20"
          test -f apps/web/tests/persistence.php
          test -f apps/web/tests/access-persistence.php

          mapfile -t migrations < <(find apps/web/database/migrations -maxdepth 1 -type f -name '*.php' -printf '%f\n' | sort)
          expected=(
            '0000_00_00_000001_create_foundational_context_graph.php'
            '0000_00_00_000002_create_organizational_access_grants.php'
          )
          if [ "${migrations[*]}" != "${expected[*]}" ]; then
            printf 'Unexpected Sprint 19/20 migration set:\n%s\n' "${migrations[*]:-<empty>}" >&2
            exit 1
          fi

          if grep -R -n -E 'Illuminate\\|Laravel\\|Schema::|DB::|new PDO|mysqli_' \
            apps/web/app/Domain \
            apps/web/app/Application; then
            echo "M7.2/Sprint20 Domain or Application framework/persistence boundary violated." >&2
            exit 1
          fi

          grep -Fq "primary(['tenant_id', 'id']" "$s19"
          grep -Fq "foreign(['tenant_id', 'identity_id']" "$s19"
          grep -Fq "foreign(['tenant_id', 'organization_id']" "$s19"
          grep -Fq "foreign(['tenant_id', 'outlet_id']" "$s19"
          grep -Fq 'oneqay_outlet_access_grants' "$s20"
          grep -Fq 'oneqay_device_access_grants' "$s20"
          grep -Fq 'fk_outlet_access_membership' "$s20"
          grep -Fq 'fk_device_access_outlet_grant' "$s20"
          grep -Fq 'fk_device_access_device' "$s20"
          grep -Fq 'Forward-only generated migration; rollback is not authorized.' "$s20"
          grep -Fq -- "->where('tenant_id'," "$access"
          grep -Fq "in_array(\$runtime, ['local', 'test', 'ci'], true)" "$access"
          if grep -Eq '\b(updateOrInsert|upsert)\s*\(' "$access"; then
            echo "Sprint 20 access repository must not silently rewrite grant ownership." >&2
            exit 1
          fi

      - name: Install locked npm dependencies
        working-directory: apps/web
        run: npm ci --ignore-scripts --no-fund

      - name: Reject High or Critical npm advisories
        working-directory: apps/web
        run: npm audit --audit-level=high

      - name: Type-check Vue and TypeScript
        working-directory: apps/web
        run: npm run type-check

      - name: Build Vite assets
        working-directory: apps/web
        run: npm run build

      - name: Preserve M7.1 and run Sprint 19/20 durable regressions
        working-directory: apps/web
        run: composer test

      - name: Run M7.2 tenant isolation regression
        working-directory: apps/web
        run: php tests/tenant-isolation.php
