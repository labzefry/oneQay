name: M7.2 Tenant Isolation Regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/app/Domain/Tenancy/**'
      - 'apps/web/app/Application/Tenancy/**'
      - 'apps/web/app/Application/Persistence/**'
      - 'apps/web/app/Application/Access/**'
      - 'apps/web/app/Application/Authorization/**'
      - 'apps/web/app/Infrastructure/Tenancy/**'
      - 'apps/web/app/Infrastructure/Access/**'
      - 'apps/web/app/Infrastructure/Authorization/**'
      - 'apps/web/app/Infrastructure/Organization/LaravelOrganizationalRelationshipVerifier.php'
      - 'apps/web/app/Infrastructure/Persistence/LaravelDurableContextGraphRepository.php'
      - 'apps/web/app/Infrastructure/Persistence/LaravelPersistenceTransaction.php'
      - 'apps/web/app/Infrastructure/Configuration/CriticalConfiguration.php'
      - 'apps/web/app/Delivery/Http/Middleware/**'
      - 'apps/web/app/Providers/AppServiceProvider.php'
      - 'apps/web/bootstrap/app.php'
      - 'apps/web/config/database.php'
      - 'apps/web/environment.example'
      - 'apps/web/database/migrations/**'
      - 'apps/web/tests/persistence.php'
      - 'apps/web/tests/access-persistence.php'
      - 'apps/web/tests/authorization-persistence.php'
      - 'apps/web/tests/tenant-isolation.php'
      - 'apps/web/tests/identity-org-context.php'
      - 'apps/web/tests/run.php'
      - 'docs/DURABLE_APPLICATION_PERSISTENCE_FOUNDATION.md'
      - 'docs/DURABLE_IDENTITY_ORGANIZATIONAL_ACCESS_PERSISTENCE_FOUNDATION.md'
      - 'docs/DURABLE_SCOPED_ROLE_PERMISSION_POLICY_FOUNDATION.md'
      - '.github/workflows/m7-2-tenant-isolation-regression.yml'
      - '.github/workflows/m7-3-identity-org-context-regression.yml'
      - '.github/workflows/m7-5-preview-db-qualification-regression.yml'
      - '.github/workflows/sprint21-role-permission-policy-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m7-2-tenant-isolation-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  m7-2-tenant-isolation-regression:
    name: m7-2-tenant-isolation-regression
    runs-on: ubuntu-latest
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      SESSION_DRIVER: array
      CACHE_STORE: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce bounded M7.2 and Sprint 19/20/21 envelope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/m72-changed-files.txt
          test -s /tmp/m72-changed-files.txt
          while IFS= read -r file; do
            case "$file" in
              apps/web/app/Application/Authorization/RoleIdentifier.php|\
              apps/web/app/Application/Authorization/PermissionIdentifier.php|\
              apps/web/app/Application/Authorization/DurableRolePermissionRepository.php|\
              apps/web/app/Application/Authorization/DurableScopedAuthorizationPolicy.php|\
              apps/web/app/Application/Authorization/DurableAuthorizationViolation.php|\
              apps/web/app/Infrastructure/Authorization/LaravelDurableRolePermissionRepository.php|\
              apps/web/app/Providers/AppServiceProvider.php|\
              apps/web/database/migrations/0000_00_00_000003_create_scoped_role_permission_policy.php|\
              apps/web/tests/authorization-persistence.php|\
              apps/web/tests/run.php|\
              apps/web/tests/tenant-isolation.php|\
              apps/web/tests/identity-org-context.php|\
              .github/workflows/m7-2-tenant-isolation-regression.yml|\
              .github/workflows/m7-3-identity-org-context-regression.yml|\
              .github/workflows/m7-5-preview-db-qualification-regression.yml|\
              .github/workflows/sprint21-role-permission-policy-regression.yml|\
              docs/DURABLE_SCOPED_ROLE_PERMISSION_POLICY_FOUNDATION.md|\
              apps/web/app/Domain/Tenancy/*|\
              apps/web/app/Application/Tenancy/*|\
              apps/web/app/Application/Persistence/*|\
              apps/web/app/Application/Access/*|\
              apps/web/app/Infrastructure/Tenancy/*|\
              apps/web/app/Infrastructure/Access/*|\
              apps/web/app/Infrastructure/Persistence/LaravelDurableContextGraphRepository.php|\
              apps/web/app/Infrastructure/Persistence/LaravelPersistenceTransaction.php|\
              apps/web/app/Infrastructure/Configuration/CriticalConfiguration.php|\
              apps/web/app/Delivery/Http/Middleware/*|\
              apps/web/bootstrap/app.php|\
              apps/web/config/database.php|\
              apps/web/environment.example|\
              apps/web/database/migrations/0000_00_00_000001_create_foundational_context_graph.php|\
              apps/web/database/migrations/0000_00_00_000002_create_organizational_access_grants.php|\
              apps/web/tests/persistence.php|\
              apps/web/tests/access-persistence.php|\
              docs/DURABLE_APPLICATION_PERSISTENCE_FOUNDATION.md|\
              docs/DURABLE_IDENTITY_ORGANIZATIONAL_ACCESS_PERSISTENCE_FOUNDATION.md|\
              .github/workflows/m7-4-pos-core-synthetic-regression.yml|\
              .github/workflows/README.md|\
              AI_CONSTITUTION.md|ARCHITECTURE.md|README.md|ROADMAP.md|TASKS.md|\
              docs/ai/AI_SESSION_STATE.md|\
              docs/ai/AI_M7_5_SECURITY_HEADERS_ENV_SECRETS_STATE.md|\
              docs/evidence/runtime/p1-cpanel-environment-secrets-security-headers-20260816.json|\
              docs/evidence/runtime/p1-cpanel-live-runtime-reconciled-20260816-security-env.json|\
              docs/evidence/runtime/p1-cpanel-live-runtime-reconciled-20260816-security-env.report.json|\
              docs/handbook/M7_5_P1_SECURITY_HEADERS_ENV_SECRETS_EVIDENCE_20260816.md)
                ;;
              *) echo "M7.2 unauthorized changed path: $file" >&2; exit 1 ;;
            esac
          done < /tmp/m72-changed-files.txt

      - name: Preserve root Platform Foundation regression
        run: |
          composer validate --strict --no-check-publish
          composer test

      - name: Validate PHP runtime boundary
        run: |
          php --version
          php -r 'if (PHP_VERSION_ID < 80200 || PHP_VERSION_ID >= 80600) { fwrite(STDERR, "M7.2 requires governed PHP 8.2-8.5 compatibility.\n"); exit(1); }'
          composer --version

      - name: Setup exact Node LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.19.0

      - name: Require unchanged deterministic dependency locks
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/web/composer.lock
          test -f apps/web/package-lock.json
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Eq '(^|/)(composer\.(json|lock)|package(-lock)?\.json)$'; then
            echo 'M7.2/Sprint21 does not authorize dependency manifest or lockfile changes.' >&2
            exit 1
          fi

      - name: Install locked Composer dependencies
        working-directory: apps/web
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist

      - name: Reject High or Critical Composer advisories
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          composer audit --locked --format=json > /tmp/oneqay-composer-audit.json || true
          php -r '$data=json_decode(file_get_contents("/tmp/oneqay-composer-audit.json"),true,512,JSON_THROW_ON_ERROR); foreach (($data["advisories"] ?? []) as $package=>$items) { foreach ($items as $item) { if (in_array(strtolower((string)($item["severity"] ?? "")),["high","critical"],true)) { fwrite(STDERR,"Blocking Composer advisory for {$package}.\n"); exit(1); } } }'

      - name: Validate application PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find apps/web/app apps/web/bootstrap apps/web/config apps/web/database apps/web/public apps/web/routes apps/web/tests -type f -name '*.php' -print0 |
            while IFS= read -r -d '' file; do php -l "$file"; done

      - name: Enforce tenant-safe durable persistence access and authorization
        shell: bash
        run: |
          set -euo pipefail
          s19='apps/web/database/migrations/0000_00_00_000001_create_foundational_context_graph.php'
          s20='apps/web/database/migrations/0000_00_00_000002_create_organizational_access_grants.php'
          s21='apps/web/database/migrations/0000_00_00_000003_create_scoped_role_permission_policy.php'
          authz='apps/web/app/Infrastructure/Authorization/LaravelDurableRolePermissionRepository.php'
          mapfile -t migrations < <(find apps/web/database/migrations -maxdepth 1 -type f -name '*.php' -printf '%f\n' | sort)
          expected=(
            '0000_00_00_000001_create_foundational_context_graph.php'
            '0000_00_00_000002_create_organizational_access_grants.php'
            '0000_00_00_000003_create_scoped_role_permission_policy.php'
          )
          test "${migrations[*]}" = "${expected[*]}"
          if grep -R -n -E 'Illuminate\\|Laravel\\|Schema::|DB::|new PDO|mysqli_' apps/web/app/Domain apps/web/app/Application; then
            echo 'M7.2/Sprint21 Domain or Application framework/persistence boundary violated.' >&2
            exit 1
          fi
          grep -Fq "primary(['tenant_id', 'id']" "$s19"
          grep -Fq 'fk_device_access_device' "$s20"
          for table in oneqay_roles oneqay_role_permissions oneqay_tenant_role_assignments oneqay_organization_role_assignments oneqay_outlet_role_assignments oneqay_device_role_assignments; do grep -Fq "$table" "$s21"; done
          grep -Fq 'fk_organization_role_membership' "$s21"
          grep -Fq 'fk_outlet_role_access' "$s21"
          grep -Fq 'fk_device_role_access' "$s21"
          grep -Fq 'Forward-only generated migration; rollback is not authorized.' "$s21"
          grep -Fq -- "->where('tenant_id'," "$authz"
          grep -Fq "in_array(\$runtime, ['local', 'test', 'ci'], true)" "$authz"
          if grep -Eq '\b(insert|insertOrIgnore|update|updateOrInsert|upsert|delete|truncate)\s*\(' "$authz"; then
            echo 'Sprint 21 durable authorization repository must remain read-only.' >&2
            exit 1
          fi

      - name: Install locked npm dependencies
        working-directory: apps/web
        run: npm ci --ignore-scripts --no-fund

      - name: Reject High or Critical npm advisories
        working-directory: apps/web
        run: npm audit --audit-level=high

      - name: Type-check Vue and TypeScript
        working-directory: apps/web
        run: npm run type-check

      - name: Build Vite assets
        working-directory: apps/web
        run: npm run build

      - name: Preserve M7.1 and run durable regressions
        working-directory: apps/web
        run: composer test

      - name: Run M7.2 tenant isolation regression
        working-directory: apps/web
        run: php tests/tenant-isolation.php
