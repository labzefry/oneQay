name: Sprint145 Final Shift Close Canonical Control Plane Action Identity Throttle Response Hardening Regression

# Attribution: Lab | zefry

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sprint145-action-identity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify-action-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      CACHE_STORE: array
      SESSION_DRIVER: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Lock exact Sprint145 source envelope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | LC_ALL=C sort > /tmp/paths
          cat > /tmp/expected <<'EOF'
          .github/workflows/sprint145-final-shift-close-canonical-control-plane-action-identity-throttle-response-hardening-regression.yml
          apps/web/app/Delivery/Http/Middleware/HardenFinalShiftCloseRuntimeControlPlaneThrottleResponseMiddleware.php
          apps/web/tests/final-shift-close-runtime-control-plane-action-identity-throttle-response-hardening-regression.php
          apps/web/tests/final-shift-close-runtime-control-plane-named-route-identity-throttle-response-hardening-regression.php
          docs/SPRINT145_FINAL_SHIFT_CLOSE_CANONICAL_CONTROL_PLANE_ACTION_IDENTITY_THROTTLE_RESPONSE_HARDENING_REGRESSION.md
          ops/final-shift-close/CANONICAL_RUNTIME_CONTROL_PLANE_ACTION_IDENTITY_THROTTLE_RESPONSE_HARDENING_REGRESSION_CONTRACT.json
          EOF
          diff -u /tmp/expected /tmp/paths
          [[ "$(sha256sum /tmp/paths | awk '{print $1}')" == 'ed1a67c7a7b89e26cd4c3ade350132b8eca7c4e2142f76d9b69495ac0ba2fad2' ]]

      - name: Preserve Sprint144 successor compatibility
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/sprint144-final-shift-close-canonical-control-plane-named-route-identity-throttle-response-hardening-regression.yml
          grep -Fq 'Preserve successor-compatible historical regression boundary' "$workflow"
          grep -Fq 'Sprint144 is historical after its canonical squash merge.' "$workflow"

      - name: Validate Sprint145 contract
        shell: bash
        run: |
          set -euo pipefail
          file=ops/final-shift-close/CANONICAL_RUNTIME_CONTROL_PLANE_ACTION_IDENTITY_THROTTLE_RESPONSE_HARDENING_REGRESSION_CONTRACT.json
          jq -e '
            .schema_version == 1 and
            .feature == "final-shift-close" and
            .sprint == 145 and
            .bounded_objective == "CANONICAL_CONTROL_PLANE_ACTION_IDENTITY_THROTTLE_RESPONSE_HARDENING_REGRESSION" and
            .qualification.ownership_signal == "ROUTE_NAME_PLUS_ACTION_PLUS_METHOD_PLUS_PATH" and
            .qualification.canonical_action_match_required == true and
            .qualification.noncanonical_action_materialization_post_framework_owned == true and
            .qualification.noncanonical_action_db_get_framework_owned == true and
            .qualification.noncanonical_action_db_head_framework_owned == true and
            .historical_ownership.sprint144_named_route_identity_throttle_response_hardening == "PRESERVED_WITH_SUCCESSOR_COMPATIBLE_CANONICAL_ACTION_FIXTURE" and
            .source_envelope.path_count == 6 and
            .source_envelope.sha256 == "ed1a67c7a7b89e26cd4c3ade350132b8eca7c4e2142f76d9b69495ac0ba2fad2" and
            .attribution == "Author by Lab | zefry"
          ' "$file" >/dev/null

      - name: Prove bounded action identity ownership
        shell: bash
        run: |
          set -euo pipefail
          middleware=apps/web/app/Delivery/Http/Middleware/HardenFinalShiftCloseRuntimeControlPlaneThrottleResponseMiddleware.php
          grep -Fq '$routeActionName = $route->getActionName();' "$middleware"
          grep -Fq "routeActionName === FinalShiftCloseRuntimeBindingManifestMaterializationController::class.'@__invoke'" "$middleware"
          grep -Fq "routeActionName === FinalShiftCloseRuntimeDbBindingAttestationController::class.'@__invoke'" "$middleware"
          grep -Fq '$routeName === self::MATERIALIZATION_ROUTE_NAME' "$middleware"
          grep -Fq '$routeName === self::DB_ATTESTATION_ROUTE_NAME' "$middleware"

      - name: Preserve canonical lifecycle gates
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" == 'NOT_EXECUTED' ]]
          [[ "$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)" == 'NONE' ]]
          [[ "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.deployment_authority' ops/final-shift-close/STATE.json)" == 'NOT_GRANTED' ]]
          [[ "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET' ]]
          [[ "$(jq -r '.selected_target' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'null' ]]

      - name: Validate PHP and dependencies
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Delivery/Http/Middleware/HardenFinalShiftCloseRuntimeControlPlaneThrottleResponseMiddleware.php
          php -l tests/final-shift-close-runtime-control-plane-action-identity-throttle-response-hardening-regression.php
          php -l tests/final-shift-close-runtime-control-plane-named-route-identity-throttle-response-hardening-regression.php
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          composer audit --locked --no-interaction --abandoned=report

      - name: Execute Sprint145 regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-action-identity-throttle-response-hardening-regression.php

      - name: Preserve Sprint144 regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-named-route-identity-throttle-response-hardening-regression.php

      - name: Preserve Sprint135 registration metadata
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-positive-registration-metadata-regression.php

      - name: Lock documentation boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'ed1a67c7a7b89e26cd4c3ade350132b8eca7c4e2142f76d9b69495ac0ba2fad2' docs/SPRINT145_FINAL_SHIFT_CLOSE_CANONICAL_CONTROL_PLANE_ACTION_IDENTITY_THROTTLE_RESPONSE_HARDENING_REGRESSION.md
          ! grep -Eq '^[[:space:]]*workflow_dispatch[[:space:]]*:' .github/workflows/sprint145-final-shift-close-canonical-control-plane-action-identity-throttle-response-hardening-regression.yml

      - name: Verify tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code

# Author by Lab | zefry
