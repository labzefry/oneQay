name: Sprint129 Final Shift Close Historical Regression Successor Compatibility

# Attribution: Lab | zefry

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  qualify-historical-regression-successor-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Lock exact Sprint129 source envelope
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$base" "$head" | LC_ALL=C sort > /tmp/paths
          cat > /tmp/expected <<'EOF'
          .github/workflows/sprint119-final-shift-close-runtime-db-binding-attestation.yml
          .github/workflows/sprint120-final-shift-close-runtime-binding-manifest-writer.yml
          .github/workflows/sprint121-final-shift-close-runtime-binding-manifest-control-channel.yml
          .github/workflows/sprint122-final-shift-close-runtime-binding-manifest-write-once-cas.yml
          .github/workflows/sprint123-final-shift-close-runtime-binding-manifest-control-plane-registration.yml
          .github/workflows/sprint124-final-shift-close-runtime-db-binding-attestation-control-plane-registration.yml
          .github/workflows/sprint125-final-shift-close-runtime-db-binding-attestation-control-plane-regression.yml
          .github/workflows/sprint126-final-shift-close-runtime-binding-manifest-control-plane-token-hardening.yml
          .github/workflows/sprint127-final-shift-close-runtime-binding-manifest-control-plane-regression.yml
          .github/workflows/sprint128-final-shift-close-runtime-control-plane-token-character-policy.yml
          .github/workflows/sprint129-final-shift-close-historical-regression-successor-compatibility.yml
          docs/SPRINT129_FINAL_SHIFT_CLOSE_HISTORICAL_REGRESSION_SUCCESSOR_COMPATIBILITY.md
          ops/final-shift-close/HISTORICAL_REGRESSION_SUCCESSOR_COMPATIBILITY_CONTRACT.json
          EOF
          diff -u /tmp/expected /tmp/paths
          [[ "$(sha256sum /tmp/paths | awk '{print $1}')" == '28dca334ecbd01d3832805a41043c7592a2356e252b36c9e2ccbe6db9f5d91d6' ]]

      - name: Prove historical workflows no longer own successor full envelopes
        shell: bash
        run: |
          set -euo pipefail
          for sprint in {119..128}; do
            file="$(find .github/workflows -maxdepth 1 -type f -name "sprint${sprint}-*.yml" -print -quit)"
            [[ -n "$file" ]]
            grep -Fq 'Preserve successor-compatible historical regression boundary' "$file"
            grep -Fq 'Historical regression workflows validate their owned invariants only.' "$file"
            grep -Fq 'Exact full-PR envelope locking belongs to the active sprint workflow.' "$file"
            ! grep -Fq 'cat > /tmp/expected' "$file"
            ! grep -Fq 'diff -u /tmp/expected /tmp/paths' "$file"
          done

      - name: Prove canonical runtime and operational state remain untouched
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --quiet "$base" "$head" -- \
            apps/web \
            .github/workflows/final-shift-close-migration27-selected-target-db-binding.yml \
            .github/workflows/final-shift-close-migration27-execution.yml \
            ops/final-shift-close/STATE.json \
            ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json
          [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" == 'NOT_EXECUTED' ]]
          [[ "$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)" == 'NONE' ]]
          [[ "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET' ]]
          [[ "$(jq -r '.selected_target' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'null' ]]

      - name: Validate Sprint129 machine-readable contract
        shell: bash
        run: |
          set -euo pipefail
          file=ops/final-shift-close/HISTORICAL_REGRESSION_SUCCESSOR_COMPATIBILITY_CONTRACT.json
          jq -e '.schema_version == 1 and .feature == "final-shift-close" and .sprint == 129 and .bounded_objective == "HISTORICAL_REGRESSION_SUCCESSOR_COMPATIBILITY" and .execution_mode == "CI_GOVERNANCE_HARDENING_ONLY" and .historical_regressions.range == "SPRINT119_THROUGH_SPRINT128" and .historical_regressions.full_pr_envelope_lock == "REMOVED_FROM_HISTORICAL_WORKFLOWS" and .historical_regressions.owned_invariant_regression == "PRESERVED" and .historical_regressions.active_sprint_envelope_authority == "CURRENT_SPRINT_WORKFLOW_ONLY" and .historical_regressions.exact_head_checkout == "PRESERVED" and .historical_regressions.fail_closed_operational_boundaries == "PRESERVED" and .canonical_boundaries.valid_control_plane_request == "NOT_PERFORMED" and .canonical_boundaries.runtime_manifest_materialization == "NOT_PERFORMED" and .canonical_boundaries.runtime_db_binding_attestation == "NOT_PERFORMED" and .canonical_boundaries.migration27_execution == "NOT_PERFORMED" and .canonical_boundaries.permission_provisioning == "NONE" and .canonical_boundaries.feature_activation == "INACTIVE" and .source_envelope.path_count == 13 and .source_envelope.sha256 == "28dca334ecbd01d3832805a41043c7592a2356e252b36c9e2ccbe6db9f5d91d6"' "$file" >/dev/null

      - name: Preserve active Sprint128 security regression source
        shell: bash
        run: |
          set -euo pipefail
          provider_materialization=apps/web/app/Providers/FinalShiftCloseRuntimeBindingManifestMaterializationServiceProvider.php
          provider_db=apps/web/app/Providers/FinalShiftCloseRuntimeDbBindingAttestationServiceProvider.php
          middleware_materialization=apps/web/app/Delivery/Http/Middleware/RequireFinalShiftCloseRuntimeBindingMaterializationTokenMiddleware.php
          middleware_db=apps/web/app/Delivery/Http/Middleware/RequireFinalShiftCloseRuntimeBindingTokenMiddleware.php
          grep -Fq '[A-Za-z0-9._~+=\/-]{32,512}' "$provider_materialization"
          grep -Fq '[A-Za-z0-9._~+=\/-]{32,512}' "$provider_db"
          grep -Fq 'hash_equals($this->expectedToken, $matches[1])' "$middleware_materialization"
          grep -Fq 'hash_equals($this->expectedToken, $matches[1])' "$middleware_db"
          jq -e '.sprint == 128 and .canonical_boundaries.runtime_manifest_materialization == "NOT_PERFORMED" and .canonical_boundaries.runtime_db_binding_attestation == "NOT_PERFORMED" and .canonical_boundaries.feature_activation == "INACTIVE"' ops/final-shift-close/RUNTIME_CONTROL_PLANE_TOKEN_CHARACTER_POLICY_CONTRACT.json >/dev/null

      - name: Lock no operational invocation or activation
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Fq 'workflow_dispatch' .github/workflows/sprint129-final-shift-close-historical-regression-successor-compatibility.yml
          doc=docs/SPRINT129_FINAL_SHIFT_CLOSE_HISTORICAL_REGRESSION_SUCCESSOR_COMPATIBILITY.md
          grep -Fq 'SPRINT129_VALID_CONTROL_PLANE_REQUEST = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT129_CONTROLLER_INVOCATION = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT129_RUNTIME_CONFIGURATION_MUTATION = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT129_RUNTIME_TOKEN_PROVISIONING = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT129_RUNTIME_MANIFEST_MATERIALIZATION = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT129_RUNTIME_DB_BINDING_ATTESTATION = NOT_PERFORMED' "$doc"
          grep -Fq 'MIGRATION_27_EXECUTION = NOT_PERFORMED' "$doc"
          grep -Fq 'PERMISSION_PROVISIONING = NONE' "$doc"
          grep -Fq 'FEATURE_ACTIVATION = INACTIVE' "$doc"
          grep -Fq 'PRODUCTION = NO-GO' "$doc"

      - name: Verify tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "$(git status --porcelain)" ]]
