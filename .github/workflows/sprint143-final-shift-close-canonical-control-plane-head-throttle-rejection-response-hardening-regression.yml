name: Sprint143 Final Shift Close Canonical Control Plane HEAD Throttle Rejection Response Hardening Regression

# Attribution: Lab | zefry

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sprint143-final-shift-close-canonical-control-plane-head-throttle-rejection-response-hardening-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify-canonical-control-plane-head-throttle-rejection-response-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      CACHE_STORE: array
      SESSION_DRIVER: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Lock exact Sprint143 source envelope
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$base" "$head" | LC_ALL=C sort > /tmp/paths
          cat > /tmp/expected <<'EOF'
          .github/workflows/sprint143-final-shift-close-canonical-control-plane-head-throttle-rejection-response-hardening-regression.yml
          apps/web/app/Delivery/Http/Middleware/HardenFinalShiftCloseRuntimeControlPlaneThrottleResponseMiddleware.php
          apps/web/tests/final-shift-close-runtime-control-plane-head-throttle-rejection-response-hardening-regression.php
          docs/SPRINT143_FINAL_SHIFT_CLOSE_CANONICAL_CONTROL_PLANE_HEAD_THROTTLE_REJECTION_RESPONSE_HARDENING_REGRESSION.md
          ops/final-shift-close/CANONICAL_RUNTIME_CONTROL_PLANE_HEAD_THROTTLE_REJECTION_RESPONSE_HARDENING_REGRESSION_CONTRACT.json
          EOF
          diff -u /tmp/expected /tmp/paths
          [[ "$(sha256sum /tmp/paths | awk '{print $1}')" == '30df6d628ffa67335dd51275137c022cd461264a137b28b5d9fa623a1d1298ed' ]]

      - name: Preserve Sprint142 historical successor compatibility
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/sprint142-final-shift-close-canonical-control-plane-throttle-rejection-response-hardening-regression.yml
          grep -Fq 'Preserve successor-compatible historical regression boundary' "$workflow"
          grep -Fq 'Sprint142 is historical after its canonical squash merge.' "$workflow"
          ! grep -Fq 'Lock exact Sprint142 source envelope' "$workflow"

      - name: Validate Sprint143 machine-readable contract
        shell: bash
        run: |
          set -euo pipefail
          file=ops/final-shift-close/CANONICAL_RUNTIME_CONTROL_PLANE_HEAD_THROTTLE_REJECTION_RESPONSE_HARDENING_REGRESSION_CONTRACT.json
          jq -e '
            .schema_version == 1 and
            .feature == "final-shift-close" and
            .sprint == 143 and
            .bounded_objective == "CANONICAL_CONTROL_PLANE_DB_ATTESTATION_HEAD_THROTTLE_REJECTION_RESPONSE_HARDENING_REGRESSION" and
            .execution_mode == "CI_ONLY_SYNTHETIC_AUTHENTICATED_HTTP_HEAD_THROTTLE_RESPONSE_HARDENING" and
            .qualification.new_executable_gap == "DB_ATTESTATION_HEAD_THROTTLE_REJECTION_PRIVACY_SECURITY_PARITY" and
            .qualification.route_registration_changed == false and
            .qualification.route_middleware_stack_changed == false and
            .qualification.authentication_before_throttle_preserved == true and
            .qualification.throttle_limits_changed == false and
            .qualification.materialization_method_ownership == ["POST"] and
            .qualification.db_attestation_methods == ["GET", "HEAD"] and
            .qualification.db_attestation_head_owned_by_hardener == true and
            .qualification.db_attestation_configured_throttle == "2,1" and
            .qualification.head_success_status == 200 and
            .qualification.head_excess_status == 429 and
            .qualification.head_successful_reads_before_throttle == 2 and
            .qualification.head_excess_additional_reads == 0 and
            .qualification.throttle_rejection_body == "EMPTY" and
            .qualification.cache_control_no_store == true and
            .qualification.cache_control_private == true and
            .qualification.pragma_no_cache == true and
            .qualification.x_content_type_options_nosniff == true and
            .qualification.x_robots_tag == "noindex, nofollow, noarchive" and
            .qualification.retry_after_preserved == true and
            .qualification.x_rate_limit_limit_preserved == true and
            .qualification.x_rate_limit_remaining_preserved == true and
            .qualification.x_rate_limit_reset_preserved == true and
            .qualification.production_database_identity_reader_resolution == "FORBIDDEN" and
            .qualification.canonical_runtime_binding_manifest_write == "FORBIDDEN" and
            .historical_ownership.sprint135_get_head_route_metadata == "PRESERVED" and
            .historical_ownership.sprint138_authenticated_http_throttle_enforcement == "PRESERVED" and
            .historical_ownership.sprint139_auth_before_throttle == "PRESERVED" and
            .historical_ownership.sprint140_direct_middleware_auth_rejection_response_hardening == "PRESERVED" and
            .historical_ownership.sprint141_http_kernel_auth_rejection_response_propagation == "PRESERVED" and
            .historical_ownership.sprint142_authenticated_throttle_rejection_response_hardening == "PRESERVED" and
            .historical_ownership.sprint143_db_attestation_head_throttle_rejection_response_hardening == "OWNED" and
            .source_envelope.path_count == 5 and
            .source_envelope.sha256 == "30df6d628ffa67335dd51275137c022cd461264a137b28b5d9fa623a1d1298ed" and
            .canonical_boundaries.migration27_execution == "NOT_PERFORMED" and
            .canonical_boundaries.permission_provisioning == "NONE" and
            .canonical_boundaries.feature_activation == "INACTIVE" and
            .canonical_boundaries.selected_target == null and
            .canonical_boundaries.deployment_authority == "NOT_GRANTED" and
            .canonical_boundaries.technical_preview == "NO-GO" and
            .canonical_boundaries.production == "NO-GO" and
            .canonical_boundaries.updater == "INACTIVE" and
            .attribution == "Author by Lab | zefry"
          ' "$file" >/dev/null

      - name: Prove HEAD ownership delta remains bounded
        shell: bash
        run: |
          set -euo pipefail
          middleware=apps/web/app/Delivery/Http/Middleware/HardenFinalShiftCloseRuntimeControlPlaneThrottleResponseMiddleware.php
          db_route=apps/web/routes/final-shift-close-runtime-db-binding-attestation.php
          materialization_provider=apps/web/app/Providers/FinalShiftCloseRuntimeBindingManifestMaterializationServiceProvider.php
          db_provider=apps/web/app/Providers/FinalShiftCloseRuntimeDbBindingAttestationServiceProvider.php
          grep -Fq "request->isMethod('POST')" "$middleware"
          grep -Fq "request->isMethod('GET')" "$middleware"
          grep -Fq "request->isMethod('HEAD')" "$middleware"
          grep -Fq 'Route::get(' "$db_route"
          grep -Fq "'throttle:1,1'," "$materialization_provider"
          grep -Fq "'throttle:2,1'," "$db_provider"
          grep -Fq "getStatusCode() !== 429" "$middleware"
          grep -Fq "headers->has('Retry-After')" "$middleware"
          grep -Fq "headers->has('X-RateLimit-Limit')" "$middleware"
          grep -Fq "setContent('')" "$middleware"
          grep -Fq 'X-Robots-Tag' "$middleware"

      - name: Prove operational NO-GO state remains intact
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" == 'NOT_EXECUTED' ]]
          [[ "$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)" == 'NONE' ]]
          [[ "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.deployment_authority' ops/final-shift-close/STATE.json)" == 'NOT_GRANTED' ]]
          [[ "$(jq -r '.technical_preview_activation' ops/final-shift-close/STATE.json)" == 'NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.production_activation' ops/final-shift-close/STATE.json)" == 'NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.updater_activation' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET' ]]
          [[ "$(jq -r '.selected_target' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'null' ]]

      - name: Validate PHP syntax and locked dependencies
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Delivery/Http/Middleware/HardenFinalShiftCloseRuntimeControlPlaneThrottleResponseMiddleware.php
          php -l tests/final-shift-close-runtime-control-plane-head-throttle-rejection-response-hardening-regression.php
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          composer audit --locked --no-interaction --abandoned=report

      - name: Execute Sprint143 HEAD throttle rejection response hardening regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-head-throttle-rejection-response-hardening-regression.php

      - name: Preserve Sprint142 throttle rejection response hardening regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-throttle-rejection-response-hardening-regression.php

      - name: Preserve Sprint141 HTTP auth rejection response regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-http-auth-rejection-response-regression.php

      - name: Preserve Sprint140 direct middleware auth rejection hardening regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-auth-rejection-response-hardening-regression.php

      - name: Preserve Sprint139 auth-before-throttle regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-auth-before-throttle-regression.php

      - name: Preserve Sprint138 authenticated HTTP throttle regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-authenticated-http-throttle-regression.php

      - name: Preserve Sprint135 route metadata regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-positive-registration-metadata-regression.php

      - name: Lock documentation and workflow boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '30df6d628ffa67335dd51275137c022cd461264a137b28b5d9fa623a1d1298ed' docs/SPRINT143_FINAL_SHIFT_CLOSE_CANONICAL_CONTROL_PLANE_HEAD_THROTTLE_REJECTION_RESPONSE_HARDENING_REGRESSION.md
          ! grep -Eq '^[[:space:]]*workflow_dispatch[[:space:]]*:' .github/workflows/sprint143-final-shift-close-canonical-control-plane-head-throttle-rejection-response-hardening-regression.yml

      - name: Verify tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code

# Author by Lab | zefry
