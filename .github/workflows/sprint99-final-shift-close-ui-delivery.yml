        working-directory: apps/web
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Execute Sprint99 UI regression
        working-directory: apps/web
        run: php tests/pos-final-shift-close-ui-delivery.php

      - name: Prove Final Shift Close routes absent by default
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          output="$(ONEQAY_RUNTIME_CLASS=ci ONEQAY_POS_SHIFT_CLOSE_ENABLED=false php artisan route:list --json)"
          php -r '
            $rows=json_decode($argv[1], true, 512, JSON_THROW_ON_ERROR);
            foreach ($rows as $row) {
                if (($row["name"] ?? "") === "pos.shifts.close" || ($row["name"] ?? "") === "pos.shifts.close.page") {
                    fwrite(STDERR, "Final Shift Close routes must be absent by default.\n");
                    exit(1);
                }
            }
          ' "$output"

      - name: Prove GET and POST routes appear only when explicitly armed
        working-directory: apps/web
        shell: bash
        run: |
