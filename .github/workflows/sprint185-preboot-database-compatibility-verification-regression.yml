# Author by Lab | zefry
name: Sprint185 Preboot Database Compatibility Verification Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint185-preboot-database-compatibility-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify-sprint185-preboot-database-compatibility:
    name: qualify-sprint185-preboot-database-compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: oneqay-s185-root
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -poneqay-s185-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      APP_DEBUG: "false"
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      SESSION_DRIVER: array
      CACHE_STORE: array
      LOG_CHANNEL: stderr
      ONEQAY_BUILD_PROVENANCE: github-actions:${{ github.run_id }}:${{ github.run_attempt }}

    steps:
      - name: Checkout exact Sprint185 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Qualify exact Sprint185 engineering envelope
        if: github.event_name == 'pull_request' && github.head_ref == 'sprint185-preboot-database-compatibility-verification'
        shell: bash
        env:
          EXPECTED_PATH_HASH: 775caa7723278af855b888f2c6bac592d9187e7b988619799f90e2e7a6950e99
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          mapfile -t paths < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | LC_ALL=C sort)
          expected=(
            ".github/workflows/m7-5-preview-release-artifact.yml"
            ".github/workflows/sprint185-preboot-database-compatibility-verification-regression.yml"
            ".github/workflows/sprint32-authentication-recovery-proof-regression.yml"
            ".github/workflows/sprint33-recovery-bound-password-reset-regression.yml"
            ".github/workflows/sprint34-authenticated-password-change-regression.yml"
            "apps/web/app/Infrastructure/Installation/PrebootDatabaseCompatibilityVerification.php"
            "apps/web/app/Infrastructure/Installation/PrebootInstallationConfiguration.php"
            "apps/web/tests/preboot-database-compatibility-verification.php"
            "apps/web/tests/preboot-installation-configuration.php"
            "tools/installation/public-installer.php"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${paths[@]}")
          actual_hash="$(printf '%s\n' "${paths[@]}" | sha256sum | awk '{print $1}')"
          test "$actual_hash" = "$EXPECTED_PATH_HASH"

      - name: Preserve operational NO-GO
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" =~ ^(NOT_EXECUTED|EXECUTED)$ ]]
          permission_state="$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)"; [[ "$permission_state" =~ ^(NONE|PROVISIONED)$ ]]; if [[ "$permission_state" == 'PROVISIONED' ]]; then [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" == 'EXECUTED' ]]; fi
          test "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" = INACTIVE || test "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" = ACTIVE
          test "$(jq -r '.deployment_authority' ops/final-shift-close/STATE.json)" = NOT_GRANTED
          test "$(jq -r '.technical_preview_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
          test "$(jq -r '.production_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
          test "$(jq -r '.updater_activation' ops/final-shift-close/STATE.json)" = INACTIVE
          test "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = SELECTED_NOT_AUTHORIZED
          test "$(jq -r '.selected_target.environment_id' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = 'oneqay-durable-staging-01'
          test "$(jq -r '.selected_target.runtime_class' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = 'durable-staging'
          test "$(jq -r '.selected_target.selection_fingerprint_sha256' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = '858280ea3575317e8d88eed7009c770530097e261c391b2869fa81ad7c8546ce'

      - name: Setup PHP 8.3 runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Setup exact Node LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.19.0

      - name: Validate Sprint185 source
        shell: bash
        run: |
          set -euo pipefail
          php -l apps/web/app/Infrastructure/Installation/PrebootDatabaseCompatibilityVerification.php
          php -l apps/web/app/Infrastructure/Installation/PrebootInstallationConfiguration.php
          php -l apps/web/tests/preboot-database-compatibility-verification.php
          php -l apps/web/tests/preboot-installation-configuration.php
          php -l tools/installation/public-installer.php

      - name: Install locked application dependencies
        working-directory: apps/web
        run: |
          set -euo pipefail
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          npm ci --ignore-scripts --no-fund
          npm run type-check
          npm run build

      - name: Bootstrap least-privilege MySQL fixture
        shell: bash
        env:
          MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
          MYSQL_ROOT_PASSWORD: oneqay-s185-root
        run: |
          set -euo pipefail
          php <<'PHP'
          <?php
          $port = (int) getenv('MYSQL_PORT');
          $rootPassword = (string) getenv('MYSQL_ROOT_PASSWORD');
          $pdo = new PDO(
              "mysql:host=127.0.0.1;port={$port};charset=utf8mb4",
              'root',
              $rootPassword,
              [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION],
          );
          $pdo->exec('DROP DATABASE IF EXISTS oneqay_s185');
          $pdo->exec('CREATE DATABASE oneqay_s185 CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci');
          $pdo->exec("DROP USER IF EXISTS 'oneqay_s185'@'%'");
          $pdo->exec("CREATE USER 'oneqay_s185'@'%' IDENTIFIED BY 'oneqay-s185-runtime-secret'");
          $pdo->exec("GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, INDEX, DROP ON oneqay_s185.* TO 'oneqay_s185'@'%'");
          PHP

      - name: Execute Sprint184 preserved preparation regression
        working-directory: apps/web
        run: php -d zend.assertions=1 -d assert.exception=1 tests/preboot-installation-configuration.php

      - name: Execute Sprint185 live database verification regression
        working-directory: apps/web
        env:
          ONEQAY_SPRINT185_DB_HOST: 127.0.0.1
          ONEQAY_SPRINT185_DB_PORT: ${{ job.services.mysql.ports[3306] }}
          ONEQAY_SPRINT185_DB_DATABASE: oneqay_s185
          ONEQAY_SPRINT185_DB_USERNAME: oneqay_s185
          ONEQAY_SPRINT185_DB_PASSWORD: oneqay-s185-runtime-secret
        run: php -d zend.assertions=1 -d assert.exception=1 tests/preboot-database-compatibility-verification.php

      - name: Build governed release with verified installer
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          bash tools/build-m7-5-preview-release.sh "$HEAD_SHA"
          release_id="m75-preview-${HEAD_SHA:0:12}"
          artifact="dist/${release_id}.tar.gz"
          test -f "$artifact"
          tar -tzf "$artifact" > /tmp/oneqay-s185-release-list.txt
          grep -Fxq "$release_id/public-surface/install.php" /tmp/oneqay-s185-release-list.txt
          grep -Fxq "$release_id/apps/web/app/Infrastructure/Installation/PrebootDatabaseCompatibilityVerification.php" /tmp/oneqay-s185-release-list.txt
          grep -Fxq "$release_id/apps/web/app/Infrastructure/Installation/PrebootInstallationConfiguration.php" /tmp/oneqay-s185-release-list.txt
          ! grep -F '/apps/web/database/migrations/' /tmp/oneqay-s185-release-list.txt

          tar -xOzf "$artifact" "$release_id/public-surface/install.php" > /tmp/oneqay-s185-install.php
          php -l /tmp/oneqay-s185-install.php
          grep -Fq 'PrebootDatabaseCompatibilityVerification.php' /tmp/oneqay-s185-install.php
          grep -Fq 'Verify &amp; prepare configuration' /tmp/oneqay-s185-install.php
          grep -Fq 'Technical Preview</span><strong>NOT AUTHORIZED' /tmp/oneqay-s185-install.php
          grep -Fq 'Production</span><strong>NOT AUTHORIZED' /tmp/oneqay-s185-install.php

      - name: Preserve verification-before-pending boundary
        shell: bash
        run: |
          set -euo pipefail
          CONFIG=apps/web/app/Infrastructure/Installation/PrebootInstallationConfiguration.php
          VERIFY=apps/web/app/Infrastructure/Installation/PrebootDatabaseCompatibilityVerification.php
          PAGE=tools/installation/public-installer.php

          grep -Fq "database_compatibility_failed" "$CONFIG"
          grep -Fq "ONEQAY_INSTALLATION_DATABASE_VERIFIED" "$CONFIG"
          grep -Fq "ONEQAY_INSTALLATION_ACTIVATION_AUTHORIZED' => 'false'" "$CONFIG"
          grep -Fq "SHOW GRANTS FOR CURRENT_USER()" "$VERIFY"
          grep -Fq "information_schema.TABLES" "$VERIFY"
          grep -Fq "PENDING_CONFIGURATION_VERIFIED" "$PAGE"

          ! grep -Eq 'Artisan::call|migrate|requestInstall\(|checkAvailability\(' "$CONFIG" "$VERIFY" "$PAGE"
          ! grep -Eq -- '->(insert|update|delete|increment|decrement)\(' "$CONFIG" "$VERIFY" "$PAGE"

      - name: Verify tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          git diff --exit-code
          test -z "$(git status --porcelain)"
