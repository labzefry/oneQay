name: Sprint45 Entry Gate Compatibility Materializer

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/sprint45-entry-gate-compat-materializer.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'sprint45-entry-gate-compat-materializer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact materializer branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: sprint45-entry-gate-compat-materializer
          fetch-depth: 0

      - name: Materialize corrected Sprint35 compatibility blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/sprint35-privileged-totp-recovery-regression.yml')
          old = '93559a76a6b31068316959787d8e7ebf041355955aa4226262958c39f791af89'
          new = 'c2531ec04dd34198ac94aee5d5f39c271440101541817c1f12bcfb0140a2dca0'
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          matches = [i for i, line in enumerate(lines) if old in line]
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one Sprint44 entry-gate fingerprint, found {len(matches)}')
          start = matches[0]
          stripped = lines[start].lstrip()
          if not stripped.startswith('elif '):
              raise SystemExit('Sprint44 entry-gate fingerprint is not on an elif line')
          indent = lines[start][:len(lines[start]) - len(stripped)]
          end = None
          for i in range(start + 1, len(lines)):
              if lines[i].startswith(indent + 'elif '):
                  end = i
                  break
          if end is None:
              raise SystemExit('could not bound Sprint44 entry-gate recognizer block')
          cloned = []
          for line in lines[start:end]:
              line = line.replace(old, new)
              if 'Recognized exact Sprint44 identity-reactivation fresh-authentication re-entry entry-gate successor shape.' in line:
                  line_indent = line[:len(line) - len(line.lstrip())]
                  line = line_indent + "echo 'Recognized exact Sprint45 pending-MFA identity-eligibility revalidation entry-gate successor shape.'\n"
              cloned.append(line)
          text = ''.join(lines[:end] + cloned + lines[end:])
          if text.count(new) != 1:
              raise SystemExit('new fingerprint count is not exactly one')
          if text.count('Recognized exact Sprint45 pending-MFA identity-eligibility revalidation entry-gate successor shape.') != 1:
              raise SystemExit('Sprint45 recognition message count is not exactly one')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = '.github/workflows/sprint35-privileged-totp-recovery-regression.yml'
          payload="$(python3 - <<'PY'
          import base64, json, pathlib
          data = base64.b64encode(pathlib.Path('.github/workflows/sprint35-privileged-totp-recovery-regression.yml').read_bytes()).decode('ascii')
          print(json.dumps({'content': data, 'encoding': 'base64'}))
          PY
          )"
          sha="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha <<<"$payload")"
          printf 'MATERIALIZED_CORRECTED_BLOB %s %s\n' '.github/workflows/sprint35-privileged-totp-recovery-regression.yml' "$sha"
