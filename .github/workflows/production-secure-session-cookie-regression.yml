# Author by Lab | zefry
name: Production Secure Session Cookie Regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/config/session.php'
      - 'apps/web/tests/production-session-cookie-policy.php'
      - '.github/workflows/production-secure-session-cookie-regression.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/config/session.php'
      - 'apps/web/tests/production-session-cookie-policy.php'
      - '.github/workflows/production-secure-session-cookie-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-session:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: mbstring,openssl,pdo_mysql
          tools: composer:v2
          coverage: none
      - name: Test secure Production cookie policy
        run: |
          set -euo pipefail
          php -l apps/web/config/session.php
          php -l apps/web/tests/production-session-cookie-policy.php
          cd apps/web
          composer install --no-interaction --prefer-dist --no-progress
          php tests/production-session-cookie-policy.php
      - name: Keep schema and source envelope unchanged
        run: |
          test "$(find apps/web/database/migrations -maxdepth 1 -name '*.php' | wc -l)" -eq 27
          git diff --exit-code
