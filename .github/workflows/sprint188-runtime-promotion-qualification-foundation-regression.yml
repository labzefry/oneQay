# Author by Lab | zefry
name: Sprint188 Runtime Promotion Qualification Foundation Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint188-runtime-promotion-qualification-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify-sprint188-runtime-promotion-qualification:
    name: qualify-sprint188-runtime-promotion-qualification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      APP_DEBUG: "false"
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      SESSION_DRIVER: array
      CACHE_STORE: array
      LOG_CHANNEL: stderr
      ONEQAY_BUILD_PROVENANCE: github-actions:${{ github.run_id }}:${{ github.run_attempt }}

    steps:
      - name: Checkout exact Sprint188 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Qualify exact Sprint188 engineering envelope
        if: github.event_name == 'pull_request' && github.head_ref == 'sprint188-runtime-promotion-qualification-foundation'
        shell: bash
        env:
          EXPECTED_PATH_HASH: cd3306762c9f36c76154a989d8b464ad8c2ec0fbf7833c3e6a0d065afbf064b0
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          mapfile -t paths < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | LC_ALL=C sort)
          expected=(
            ".github/workflows/m7-5-preview-release-artifact.yml"
            ".github/workflows/sprint188-runtime-promotion-qualification-foundation-regression.yml"
            ".github/workflows/sprint32-authentication-recovery-proof-regression.yml"
            ".github/workflows/sprint33-recovery-bound-password-reset-regression.yml"
            ".github/workflows/sprint34-authenticated-password-change-regression.yml"
            "apps/web/app/Infrastructure/Installation/PrebootRuntimeConfigurationPromotionQualification.php"
            "apps/web/tests/preboot-runtime-configuration-promotion-qualification.php"
            "tools/build-m7-5-preview-release.sh"
            "tools/installation/public-installer.php"
            "tools/installation/runtime-configuration-promotion-authority.schema.json"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${paths[@]}")
          actual_hash="$(printf '%s\n' "${paths[@]}" | sha256sum | awk '{print $1}')"
          test "$actual_hash" = "$EXPECTED_PATH_HASH"

      - name: Preserve operational NO-GO
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" =~ ^(NOT_EXECUTED|EXECUTED)$ ]]
          test "$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)" = NONE
          test "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" = INACTIVE
          test "$(jq -r '.deployment_authority' ops/final-shift-close/STATE.json)" = NOT_GRANTED
          test "$(jq -r '.technical_preview_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
          test "$(jq -r '.production_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
          test "$(jq -r '.updater_activation' ops/final-shift-close/STATE.json)" = INACTIVE
          test "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = SELECTED_NOT_AUTHORIZED
          test "$(jq -r '.selected_target.environment_id' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = 'oneqay-durable-staging-01'
          test "$(jq -r '.selected_target.runtime_class' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = 'durable-staging'
          test "$(jq -r '.selected_target.selection_fingerprint_sha256' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = '858280ea3575317e8d88eed7009c770530097e261c391b2869fa81ad7c8546ce'

      - name: Setup PHP 8.3 runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Setup exact Node LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.19.0

      - name: Validate Sprint188 source and authority schema
        shell: bash
        run: |
          set -euo pipefail
          php -l apps/web/app/Infrastructure/Installation/PrebootRuntimeConfigurationPromotionQualification.php
          php -l apps/web/tests/preboot-runtime-configuration-promotion-qualification.php
          php -l tools/installation/public-installer.php
          bash -n tools/build-m7-5-preview-release.sh
          jq -e '.properties.authority_state.const == "GRANTED"' tools/installation/runtime-configuration-promotion-authority.schema.json
          jq -e '.properties.single_use.const == true' tools/installation/runtime-configuration-promotion-authority.schema.json
          jq -e '.properties.promotion_authorized.const == true' tools/installation/runtime-configuration-promotion-authority.schema.json
          jq -e '.properties.technical_preview_authorized.const == false' tools/installation/runtime-configuration-promotion-authority.schema.json
          jq -e '.properties.production_authorized.const == false' tools/installation/runtime-configuration-promotion-authority.schema.json

      - name: Install locked application dependencies
        working-directory: apps/web
        run: |
          set -euo pipefail
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          npm ci --ignore-scripts --no-fund
          npm run type-check
          npm run build

      - name: Preserve Sprint184 through Sprint187 installation regressions
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php -d zend.assertions=1 -d assert.exception=1 tests/preboot-installation-configuration.php
          php -d zend.assertions=1 -d assert.exception=1 tests/preboot-database-compatibility-verification.php
          php -d zend.assertions=1 -d assert.exception=1 tests/preboot-installation-activation-readiness.php
          php -d zend.assertions=1 -d assert.exception=1 tests/preboot-runtime-configuration-promotion-request.php

      - name: Execute Sprint188 promotion qualification regression
        working-directory: apps/web
        run: php -d zend.assertions=1 -d assert.exception=1 tests/preboot-runtime-configuration-promotion-qualification.php

      - name: Build governed release with promotion qualification contract
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          bash tools/build-m7-5-preview-release.sh "$HEAD_SHA"
          release_id="m75-preview-${HEAD_SHA:0:12}"
          artifact="dist/${release_id}.tar.gz"
          test -f "$artifact"

          tar -tzf "$artifact" > /tmp/oneqay-s188-release-list.txt
          grep -Fxq "$release_id/public-surface/install.php" /tmp/oneqay-s188-release-list.txt
          grep -Fxq "$release_id/apps/web/app/Infrastructure/Installation/PrebootRuntimeConfigurationPromotionQualification.php" /tmp/oneqay-s188-release-list.txt
          grep -Fxq "$release_id/installation/runtime-configuration-promotion-authority.schema.json" /tmp/oneqay-s188-release-list.txt
          ! grep -F '/apps/web/database/migrations/' /tmp/oneqay-s188-release-list.txt

          tar -xOzf "$artifact" "$release_id/RELEASE.json" > /tmp/oneqay-s188-release.json
          grep -Fq '"promotion_authority_schema_relative_path": "installation/runtime-configuration-promotion-authority.schema.json"' /tmp/oneqay-s188-release.json
          grep -Fq '"promotion_authority_max_lifetime_seconds": 900' /tmp/oneqay-s188-release.json
          grep -Fq '"promotion_authorized": false' /tmp/oneqay-s188-release.json
          grep -Fq '"activation_authorized": false' /tmp/oneqay-s188-release.json

          tar -xOzf "$artifact" "$release_id/public-surface/install.php" > /tmp/oneqay-s188-install.php
          php -l /tmp/oneqay-s188-install.php
          grep -Fq 'PrebootRuntimeConfigurationPromotionQualification.php' /tmp/oneqay-s188-install.php
          grep -Fq 'QUALIFIED / NOT EXECUTED' /tmp/oneqay-s188-install.php
          grep -Fq 'qualify_promotion_authority' /tmp/oneqay-s188-install.php

      - name: Preserve qualification-before-execution boundary
        shell: bash
        run: |
          set -euo pipefail
          QUAL=apps/web/app/Infrastructure/Installation/PrebootRuntimeConfigurationPromotionQualification.php
          PAGE=tools/installation/public-installer.php
          SCHEMA=tools/installation/runtime-configuration-promotion-authority.schema.json

          grep -Fq "PROMOTION_QUALIFIED_NOT_EXECUTED" "$QUAL"
          grep -Fq "MAX_AUTHORITY_LIFETIME_SECONDS = 900" "$QUAL"
          grep -Fq "'promotion_executed' => false" "$QUAL"
          grep -Fq "'technical_preview_authorized' => false" "$QUAL"
          grep -Fq "'production_authorized' => false" "$QUAL"
          grep -Fq "approval_token_sha256" "$QUAL"
          grep -Fq "QUALIFIED / NOT EXECUTED" "$PAGE"
          grep -Fq '"single_use": { "const": true }' "$SCHEMA"

          ! grep -Eq 'Artisan::call|migrate|requestInstall\(|checkAvailability\(' "$QUAL" "$PAGE"
          ! grep -Eq 'rename\(|copy\(|file_put_contents\(' "$QUAL"
          ! grep -Eq -- '->(insert|update|delete|increment|decrement)\(' "$QUAL" "$PAGE"

      - name: Verify tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          git diff --exit-code
          test -z "$(git status --porcelain)"
