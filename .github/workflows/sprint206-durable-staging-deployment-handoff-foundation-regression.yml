# Author by Lab | zefry
name: Sprint206 Durable Staging Deployment Handoff Foundation Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint206-durable-staging-deployment-handoff-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify-sprint206-durable-staging-deployment-handoff:
    name: qualify-sprint206-durable-staging-deployment-handoff
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      APP_DEBUG: "false"
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      SESSION_DRIVER: array
      CACHE_STORE: array
      LOG_CHANNEL: stderr
      ONEQAY_BUILD_PROVENANCE: github-actions:${{ github.run_id }}:${{ github.run_attempt }}

    steps:
      - name: Checkout exact Sprint206 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Qualify exact Sprint206 engineering envelope
        if: github.event_name == 'pull_request' && github.head_ref == 'sprint206-durable-staging-deployment-handoff-foundation'
        shell: bash
        env:
          EXPECTED_PATH_HASH: 2afad04ec60d7bce178795c8606922ee0dc38c7e672f16350902fe33b5760e3c
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          mapfile -t paths < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | LC_ALL=C sort)
          expected=(
            ".github/workflows/m7-5-preview-release-artifact.yml"
            ".github/workflows/sprint206-durable-staging-deployment-handoff-foundation-regression.yml"
            ".github/workflows/sprint32-authentication-recovery-proof-regression.yml"
            ".github/workflows/sprint33-recovery-bound-password-reset-regression.yml"
            ".github/workflows/sprint34-authenticated-password-change-regression.yml"
            "ops/final-shift-close/DURABLE_STAGING_DEPLOYMENT_HANDOFF_CONTRACT.json"
            "tools/deployment/durable-staging-deployment-handoff.schema.json"
            "tools/prepare-durable-staging-deployment-handoff.php"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${paths[@]}")
          test "$(printf '%s\n' "${paths[@]}" | sha256sum | awk '{print $1}')" = "$EXPECTED_PATH_HASH"

      - name: Preserve canonical operational NO-GO
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" = NOT_EXECUTED
          test "$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)" = NONE
          test "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" = INACTIVE
          test "$(jq -r '.deployment_authority' ops/final-shift-close/STATE.json)" = NOT_GRANTED
          test "$(jq -r '.technical_preview_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
          test "$(jq -r '.production_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
          test "$(jq -r '.updater_activation' ops/final-shift-close/STATE.json)" = INACTIVE
          test "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = SELECTED_NOT_AUTHORIZED
          test "$(jq -r '.selected_target.environment_id' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = 'oneqay-durable-staging-01'
          test "$(jq -r '.selected_target.runtime_class' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = 'durable-staging'
          test "$(jq -r '.selected_target.selection_fingerprint_sha256' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = '858280ea3575317e8d88eed7009c770530097e261c391b2869fa81ad7c8546ce'

      - name: Setup governed PHP runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Setup exact Node LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.19.0

      - name: Validate Sprint206 source contracts
        shell: bash
        run: |
          set -euo pipefail
          php -l tools/prepare-durable-staging-deployment-handoff.php
          jq -e '.contract_state == "MATERIALIZED_SOURCE_ONLY_NOT_DEPLOYED"' ops/final-shift-close/DURABLE_STAGING_DEPLOYMENT_HANDOFF_CONTRACT.json
          jq -e '.handoff_output.state == "VALIDATED_FOR_EXTERNAL_DEPLOYMENT_NOT_AUTHORIZED"' ops/final-shift-close/DURABLE_STAGING_DEPLOYMENT_HANDOFF_CONTRACT.json
          jq -e '.handoff_output.deployment_execution == "NOT_PERFORMED"' ops/final-shift-close/DURABLE_STAGING_DEPLOYMENT_HANDOFF_CONTRACT.json
          jq -e '.handoff_output.archive_extraction == "NOT_PERFORMED"' ops/final-shift-close/DURABLE_STAGING_DEPLOYMENT_HANDOFF_CONTRACT.json
          jq -e '.handoff_output.migration_execution == "NOT_PERFORMED"' ops/final-shift-close/DURABLE_STAGING_DEPLOYMENT_HANDOFF_CONTRACT.json
          jq -e '.canonical_boundaries.deployment_authority == "NOT_GRANTED"' ops/final-shift-close/DURABLE_STAGING_DEPLOYMENT_HANDOFF_CONTRACT.json
          jq -e '.properties.handoff_state.const == "VALIDATED_FOR_EXTERNAL_DEPLOYMENT_NOT_AUTHORIZED"' tools/deployment/durable-staging-deployment-handoff.schema.json
          jq -e '.properties.runtime.properties.required_runtime_class.const == "durable-staging"' tools/deployment/durable-staging-deployment-handoff.schema.json
          jq -e '.properties.migration.properties.execution_authorized.const == false' tools/deployment/durable-staging-deployment-handoff.schema.json
          jq -e '.properties.deployment.properties.authority_state.const == "NOT_GRANTED"' tools/deployment/durable-staging-deployment-handoff.schema.json

      - name: Install locked build dependencies
        shell: bash
        run: |
          set -euo pipefail
          composer validate --strict --no-check-publish
          composer test
          cd apps/web
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          npm ci --ignore-scripts --no-fund
          npm run type-check
          npm run build

      - name: Build exact Sprint205 durable staging artifact
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          bash tools/build-durable-staging-release.sh "$HEAD_SHA"
          release_id="durable-staging-${HEAD_SHA:0:12}"
          test -f "dist/${release_id}.tar.gz"
          test -f "dist/${release_id}.manifest.json"
          php tools/validate-durable-staging-release-manifest.php             "dist/${release_id}.manifest.json"             "dist/${release_id}.tar.gz"

      - name: Prepare secret-free deployment handoff
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          release_id="durable-staging-${HEAD_SHA:0:12}"
          php tools/prepare-durable-staging-deployment-handoff.php             "dist/${release_id}.manifest.json"             "dist/${release_id}.tar.gz"             "$HEAD_SHA"             "dist/${release_id}.deployment-handoff.json"

          HANDOFF="dist/${release_id}.deployment-handoff.json"
          jq -e '.handoff_state == "VALIDATED_FOR_EXTERNAL_DEPLOYMENT_NOT_AUTHORIZED"' "$HANDOFF"
          jq -e --arg sha "$HEAD_SHA" '.artifact.source_commit == $sha' "$HANDOFF"
          jq -e '.runtime.required_runtime_class == "durable-staging"' "$HANDOFF"
          jq -e '.runtime.production == false' "$HANDOFF"
          jq -e '.runtime.production_data_allowed == false' "$HANDOFF"
          jq -e '.migration.expected_count == 27' "$HANDOFF"
          jq -e '.migration.execution_state == "NOT_PERFORMED"' "$HANDOFF"
          jq -e '.migration.execution_authorized == false' "$HANDOFF"
          jq -e '.deployment.execution_state == "NOT_PERFORMED"' "$HANDOFF"
          jq -e '.deployment.archive_extraction_state == "NOT_PERFORMED"' "$HANDOFF"
          jq -e '.deployment.runtime_configuration_mutation_state == "NOT_PERFORMED"' "$HANDOFF"
          jq -e '.deployment.active_release_pointer_mutation_state == "NOT_PERFORMED"' "$HANDOFF"
          jq -e '.deployment.authority_state == "NOT_GRANTED"' "$HANDOFF"
          jq -e '.operational_boundary.selected_target == null' "$HANDOFF"
          jq -e '.operational_boundary.producer_dispatch == "NOT_PERFORMED"' "$HANDOFF"
          test "$(jq '.required_external_bindings | length' "$HANDOFF")" -eq 6

      - name: Prove exact handoff determinism
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          release_id="durable-staging-${HEAD_SHA:0:12}"
          cp "dist/${release_id}.deployment-handoff.json" /tmp/sprint206-handoff-first.json
          php tools/prepare-durable-staging-deployment-handoff.php             "dist/${release_id}.manifest.json"             "dist/${release_id}.tar.gz"             "$HEAD_SHA"             "dist/${release_id}.deployment-handoff-second.json"
          diff -u /tmp/sprint206-handoff-first.json "dist/${release_id}.deployment-handoff-second.json"

      - name: Fail closed on source and artifact mismatch
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          release_id="durable-staging-${HEAD_SHA:0:12}"
          wrong_sha="0000000000000000000000000000000000000000"

          if php tools/prepare-durable-staging-deployment-handoff.php             "dist/${release_id}.manifest.json"             "dist/${release_id}.tar.gz"             "$wrong_sha"             /tmp/sprint206-wrong-source.json; then
            echo "Handoff accepted a mismatched source commit." >&2
            exit 1
          fi

          cp "dist/${release_id}.tar.gz" /tmp/sprint206-corrupt.tar.gz
          printf 'tamper' >> /tmp/sprint206-corrupt.tar.gz
          if php tools/prepare-durable-staging-deployment-handoff.php             "dist/${release_id}.manifest.json"             /tmp/sprint206-corrupt.tar.gz             "$HEAD_SHA"             /tmp/sprint206-corrupt.json; then
            echo "Handoff accepted an artifact with digest drift." >&2
            exit 1
          fi

      - name: Prove handoff has no operational side effects
        shell: bash
        run: |
          set -euo pipefail
          TOOL=tools/prepare-durable-staging-deployment-handoff.php
          ! grep -Eq 'Artisan::call|php artisan migrate|migrate --force|PDO\(|mysqli_|curl_exec|https?://' "$TOOL"
          ! grep -Eq 'rename\([^,]+,[^)]*releases|current-release\.json|deployment-state/locks|ONEQAY_DURABLE_RUNTIME_ATTESTATION_TOKEN=' "$TOOL"
          ! grep -Eq 'SystemUpdateActivationCoordinator|FilesystemSystemUpdateReleaseStore|FilesystemSystemUpdateActiveReleasePointerStore' "$TOOL"

      - name: Preserve Preview-only updater boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "public const MIGRATION_CLASSIFICATION = 'NO_SCHEMA_CHANGE';" apps/web/app/Application/SystemUpdate/SystemUpdatePreparedRelease.php
          grep -Fq "/\\Am75-preview-[0-9a-f]{12}\\z/" apps/web/app/Application/SystemUpdate/SystemUpdateReleaseIdentity.php
          grep -Fq "schema_change_not_supported" apps/web/app/Application/SystemUpdate/SystemUpdatePreparedRelease.php
          ! grep -Fq "durable-staging" apps/web/app/Application/SystemUpdate/SystemUpdatePreparedRelease.php
          ! grep -Fq "durable-staging" apps/web/app/Application/SystemUpdate/SystemUpdateReleaseIdentity.php

      - name: Preserve Technical Preview no-schema-change artifact
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          rm -rf dist
          bash tools/build-m7-5-preview-release.sh "$HEAD_SHA"
          preview_id="m75-preview-${HEAD_SHA:0:12}"
          tar -tzf "dist/${preview_id}.tar.gz" > /tmp/sprint206-preview-artifact-list.txt
          ! grep -F '/apps/web/database/migrations/' /tmp/sprint206-preview-artifact-list.txt
          jq -e '.release.channel == "PREVIEW"' "dist/${preview_id}.manifest.json"
          jq -e '.release.environment == "TECHNICAL_PREVIEW"' "dist/${preview_id}.manifest.json"
          jq -e '.compatibility.migration_classification == "NO_SCHEMA_CHANGE"' "dist/${preview_id}.manifest.json"

      - name: Confirm tracked source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          git diff --exit-code
          test -z "$(git status --porcelain)"
