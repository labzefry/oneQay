name: Sprint133 Final Shift Close Canonical Control Plane Controller Fail Closed Regression

# Attribution: Lab | zefry

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sprint133-final-shift-close-canonical-control-plane-controller-fail-closed-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify-canonical-control-plane-controller-fail-closed-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      CACHE_STORE: array
      SESSION_DRIVER: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Preserve successor-compatible historical regression boundary
        shell: bash
        run: |
          set -euo pipefail
          # Sprint133 is historical from Sprint134 onward.
          # Historical regression workflows validate their owned invariants only.
          # Exact full-PR envelope locking belongs to the active sprint workflow.
          test -f apps/web/tests/final-shift-close-runtime-control-plane-controller-fail-closed-regression.php
          test -f docs/SPRINT133_FINAL_SHIFT_CLOSE_CANONICAL_CONTROL_PLANE_CONTROLLER_FAIL_CLOSED_REGRESSION.md
          test -f ops/final-shift-close/CANONICAL_RUNTIME_CONTROL_PLANE_CONTROLLER_FAIL_CLOSED_REGRESSION_CONTRACT.json

      - name: Prove Sprint132 historical successor compatibility
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/sprint132-final-shift-close-canonical-control-plane-controller-positive-path-regression.yml
          grep -Fq 'Preserve successor-compatible historical regression boundary' "$workflow"
          grep -Fq 'Sprint132 is historical from Sprint133 onward.' "$workflow"
          grep -Fq 'Historical regression workflows validate their owned invariants only.' "$workflow"
          grep -Fq 'Exact full-PR envelope locking belongs to the active sprint workflow.' "$workflow"
          ! grep -Fq 'Lock exact Sprint132 source envelope' "$workflow"

      - name: Prove runtime and operational state remain untouched
        # Historical-only fixed source envelope, superseded for governed commercial Production PR.
        if: github.event_name != 'pull_request' || github.head_ref != 'production-merchant-commercial-go-live-integrated-20261009'
        shell: bash
        run: |
          menu_verified_exclusions=()
          if [[ "${{ github.event_name }}" == 'pull_request' && "${{ github.event.pull_request.number }}" == '992' && "${{ github.head_ref }}" == 'feature/menu-membership-20261029' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            python3 tools/ci/verify-menu-successor.py --frozen-inputs || exit 1
            menu_verified_exclusions=(':(exclude)apps/web/bootstrap/app.php' ':(exclude)apps/web/composer.lock' ':(exclude)apps/web/package.json' ':(exclude)apps/web/package-lock.json')
          fi
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [[ "${{ github.head_ref }}" == 'feat/business-workspaces-20261023' && "${{ github.event.pull_request.base.sha }}" == '90a9b298c3b44a4cfa7700a23fc78d1eec0655b2' && "${{ github.event.pull_request.number }}" == '987' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-business-experience-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" || exit 1
            exit 0
          fi
          if [[ "${{ github.head_ref }}" == 'fix/simplify-pos-onboarding-20261023' && "${{ github.event.pull_request.base.sha }}" == '4e5d3ab55b616c7424459e0229d9cf6ded78f937' && "${{ github.event.pull_request.number }}" == '984' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-pos-account-flow-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" || exit 1
            exit 0
          fi
          if [[ "${{ github.head_ref }}" == 'cpanel-desktop-pos-20261018' && "${{ github.event.pull_request.base.sha }}" == '45509005b2f9ed4e5ffddd1e8c7db100a50e52fe' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-cpanel-desktop-pos-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
            exit 0
          fi
          if [[ "${{ github.head_ref }}" == 'cpanel-pos-worker-lock-fix-20261018' && "${{ github.event.pull_request.base.sha }}" == 'c75ac817e29b8896d806bfcb43a1f182387e44ef' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-cpanel-pos-worker-lock-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
            exit 0
          fi
          if [[ "${{ github.head_ref }}" == 'pos-enterprise-20261019' && "${{ github.event.pull_request.base.sha }}" == '85a602a6eb27acab533ac4c30d97e12ea0a07c9e' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-pos-enterprise-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
            exit 0
          fi
          if [[ "${{ github.head_ref }}" == 'experience-pos-desktop-20261018' && "${{ github.event.pull_request.base.sha }}" == 'eb9a02d00a8ca11d6287d9be149efdd99f25967a' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-desktop-pos-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.head_ref }}" == 'control-plane-enterprise-20261016' && "${{ github.event.pull_request.base.sha }}" == '1e235bf4947a4e94d589d711e0b0fb1a463b3cac' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-control-plane-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          else
          if [[ "${{ github.head_ref }}" == 'public-website-cms-onboarding-20261015' && "${{ github.event.pull_request.base.sha }}" == '9420db4ec3939fefc2bac54d11d4e24af1624e17' && "${{ github.event.pull_request.head.repo.full_name }}" == 'labzefry/oneQay' ]]; then
            bash tools/qa-website-source-envelope.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          git diff --quiet "$base" "$head" -- \
            apps/web/config/final_shift_close_runtime_binding_materialization.php \
            apps/web/config/final_shift_close_runtime_db_binding_attestation.php \
            apps/web/bootstrap/app.php \
            apps/web/routes \
            apps/web/app/Delivery/Http/Pos/FinalShiftCloseRuntimeBindingManifestMaterializationController.php \
            apps/web/app/Delivery/Http/Pos/FinalShiftCloseRuntimeDbBindingAttestationController.php \
            apps/web/app/Application/Pos/FinalShiftCloseRuntimeBindingManifestMaterializationRequest.php \
            apps/web/app/Application/Pos/FinalShiftCloseRuntimeBindingManifest.php \
            apps/web/app/Application/Pos/FinalShiftCloseRuntimeBindingManifestMaterializer.php \
            apps/web/app/Application/Pos/FinalShiftCloseRuntimeDatabaseIdentity.php \
            apps/web/app/Application/Pos/FinalShiftCloseRuntimeDatabaseIdentityReader.php \
            apps/web/app/Application/Pos/FinalShiftCloseRuntimeDbBindingAttestation.php \
            apps/web/app/Infrastructure/Pos/FilesystemFinalShiftCloseRuntimeBindingManifestWriter.php \
            apps/web/app/Infrastructure/Pos/LaravelFinalShiftCloseRuntimeDatabaseIdentityReader.php \
            apps/web/database/migrations ':(exclude)apps/web/routes/web.php' "${menu_verified_exclusions[@]}"
          else
          git diff --quiet "$base" "$head" -- \
            apps/web/config/final_shift_close_runtime_binding_materialization.php \
            apps/web/config/final_shift_close_runtime_db_binding_attestation.php \
            apps/web/bootstrap/app.php \
            apps/web/routes \
            apps/web/app/Delivery/Http/Pos/FinalShiftCloseRuntimeBindingManifestMaterializationController.php \
            apps/web/app/Delivery/Http/Pos/FinalShiftCloseRuntimeDbBindingAttestationController.php \
            apps/web/app/Application/Pos/FinalShiftCloseRuntimeBindingManifestMaterializationRequest.php \
            apps/web/app/Application/Pos/FinalShiftCloseRuntimeBindingManifest.php \
            apps/web/app/Application/Pos/FinalShiftCloseRuntimeBindingManifestMaterializer.php \
            apps/web/app/Application/Pos/FinalShiftCloseRuntimeDatabaseIdentity.php \
            apps/web/app/Application/Pos/FinalShiftCloseRuntimeDatabaseIdentityReader.php \
            apps/web/app/Application/Pos/FinalShiftCloseRuntimeDbBindingAttestation.php \
            apps/web/app/Infrastructure/Pos/FilesystemFinalShiftCloseRuntimeBindingManifestWriter.php \
            apps/web/app/Infrastructure/Pos/LaravelFinalShiftCloseRuntimeDatabaseIdentityReader.php \
            apps/web/database/migrations "${menu_verified_exclusions[@]}"
          fi
          fi
          [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" =~ ^(NOT_EXECUTED|EXECUTED)$ ]]
          permission_state="$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)"; [[ "$permission_state" =~ ^(NONE|PROVISIONED)$ ]]; if [[ "$permission_state" == 'PROVISIONED' ]]; then [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" == 'EXECUTED' ]]; fi
          [[ "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" =~ ^(INACTIVE|ACTIVE)$ ]]
          [[ "$(jq -r '.deployment_authority' ops/final-shift-close/STATE.json)" == 'NOT_GRANTED' ]]
          [[ "$(jq -r '.technical_preview_activation' ops/final-shift-close/STATE.json)" == 'NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.production_activation' ops/final-shift-close/STATE.json)" == 'NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.updater_activation' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'SELECTED_NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.selected_target.environment_id' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'oneqay-durable-staging-01' ]]
          [[ "$(jq -r '.selected_target.runtime_class' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'durable-staging' ]]
          selected_target_fingerprint="$(jq -r '.selected_target.selection_fingerprint_sha256' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)"; [[ "$selected_target_fingerprint" =~ ^[0-9a-f]{64}$ ]]

      - name: Validate Sprint133 machine-readable contract
        shell: bash
        run: |
          set -euo pipefail
          file=ops/final-shift-close/CANONICAL_RUNTIME_CONTROL_PLANE_CONTROLLER_FAIL_CLOSED_REGRESSION_CONTRACT.json
          jq -e '
            .schema_version == 1 and
            .feature == "final-shift-close" and
            .sprint == 133 and
            .bounded_objective == "CANONICAL_CONTROL_PLANE_CONTROLLER_FAIL_CLOSED_REGRESSION" and
            .execution_mode == "CI_ONLY_SYNTHETIC_CONTROLLER_FAIL_CLOSED_REGRESSION" and
            .qualification.materialization_invalid_field_set_controller_direct_invocation == "SYNTHETIC_HTTP_422" and
            .qualification.materialization_invalid_field_set_writer_invocation_count == 0 and
            .qualification.materialization_application_failure_controller_direct_invocation == "SYNTHETIC_HTTP_503" and
            .qualification.db_attestation_application_failure_controller_direct_invocation == "SYNTHETIC_HTTP_503" and
            .qualification.db_attestation_identity_reader_failure_controller_direct_invocation == "SYNTHETIC_HTTP_503" and
            .qualification.real_route_invocation == false and
            .qualification.production_container_service_resolution == false and
            .qualification.real_filesystem_adapter_invocation == false and
            .qualification.real_database_connection == false and
            .qualification.real_database_identity_read == false and
            .source_envelope.path_count == 5 and
            .source_envelope.sha256 == "2be909fed12150b2f831ab6ae9877e9609859c1a1b81792d165f79771ac31786" and
            .canonical_boundaries.migration27_execution == "NOT_PERFORMED" and
            .canonical_boundaries.permission_provisioning == "NONE" and
            .canonical_boundaries.feature_activation == "INACTIVE" and
            .canonical_boundaries.deployment_authority == "NOT_GRANTED" and
            .canonical_boundaries.technical_preview == "NO-GO" and
            .canonical_boundaries.production == "NO-GO" and
            .canonical_boundaries.updater == "INACTIVE" and
            .attribution == "Author by Lab | zefry"
          ' "$file" >/dev/null

      - name: Prove Sprint133 controller regression remains synthetic and isolated
        shell: bash
        run: |
          set -euo pipefail
          test_file=apps/web/tests/final-shift-close-runtime-control-plane-controller-fail-closed-regression.php
          grep -Fq 'new FinalShiftCloseRuntimeBindingManifestMaterializationController($materializer)' "$test_file"
          grep -Fq 'new FinalShiftCloseRuntimeDbBindingAttestationController($invalidAttestation)' "$test_file"
          grep -Fq 'new FinalShiftCloseRuntimeDbBindingAttestationController($readerFailureAttestation)' "$test_file"
          grep -Fq 'new class implements FinalShiftCloseRuntimeBindingManifestWriter' "$test_file"
          grep -Fq 'new class implements FinalShiftCloseRuntimeDatabaseIdentityReader' "$test_file"
          ! grep -Fq '/internal/final-shift-close/runtime-binding-manifest/materialize' "$test_file"
          ! grep -Fq '/internal/final-shift-close/runtime-db-binding-attestation' "$test_file"
          ! grep -Fq 'FilesystemFinalShiftCloseRuntimeBindingManifestWriter' "$test_file"
          ! grep -Fq 'LaravelFinalShiftCloseRuntimeDatabaseIdentityReader' "$test_file"

      - name: Validate PHP syntax and locked dependencies
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php -l tests/final-shift-close-runtime-control-plane-controller-fail-closed-regression.php
          php -l tests/final-shift-close-runtime-control-plane-controller-positive-path-regression.php
          php -l tests/final-shift-close-runtime-control-plane-token-character-policy.php
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          composer audit --locked --no-interaction --abandoned=report

      - name: Execute Sprint133 controller fail-closed regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-controller-fail-closed-regression.php

      - name: Preserve Sprint132 controller positive-path regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-controller-positive-path-regression.php

      - name: Preserve Sprint131 middleware positive-path regression
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php tests/final-shift-close-runtime-control-plane-token-character-policy.php regex-matrix
          php tests/final-shift-close-runtime-control-plane-token-character-policy.php materialization-matching-bearer
          php tests/final-shift-close-runtime-control-plane-token-character-policy.php db-matching-bearer

      - name: Preserve fail-closed credential dispositions
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php tests/final-shift-close-runtime-control-plane-token-character-policy.php materialization-invalid-expected
          php tests/final-shift-close-runtime-control-plane-token-character-policy.php materialization-missing-bearer
          php tests/final-shift-close-runtime-control-plane-token-character-policy.php materialization-malformed-bearer
          php tests/final-shift-close-runtime-control-plane-token-character-policy.php materialization-invalid-bearer
          php tests/final-shift-close-runtime-control-plane-token-character-policy.php materialization-mismatched-bearer
          php tests/final-shift-close-runtime-control-plane-token-character-policy.php db-invalid-expected
          php tests/final-shift-close-runtime-control-plane-token-character-policy.php db-missing-bearer
          php tests/final-shift-close-runtime-control-plane-token-character-policy.php db-malformed-bearer
          php tests/final-shift-close-runtime-control-plane-token-character-policy.php db-invalid-bearer
          php tests/final-shift-close-runtime-control-plane-token-character-policy.php db-mismatched-bearer

      - name: Lock no operational invocation or activation
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/sprint133-final-shift-close-canonical-control-plane-controller-fail-closed-regression.yml
          ! grep -Fq 'workflow_dispatch' "$workflow"
          doc=docs/SPRINT133_FINAL_SHIFT_CLOSE_CANONICAL_CONTROL_PLANE_CONTROLLER_FAIL_CLOSED_REGRESSION.md
          grep -Fq 'SPRINT133_VALID_OPERATIONAL_CONTROL_PLANE_REQUEST = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT133_REAL_ROUTE_INVOCATION = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT133_PRODUCTION_CONTAINER_SERVICE_RESOLUTION = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT133_REAL_FILESYSTEM_ADAPTER_INVOCATION = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT133_CANONICAL_RUNTIME_MANIFEST_WRITE = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT133_REAL_DATABASE_CONNECTION = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT133_REAL_DATABASE_IDENTITY_READ = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT133_RUNTIME_CONFIGURATION_MUTATION = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT133_RUNTIME_TOKEN_PROVISIONING = NOT_PERFORMED' "$doc"
          grep -Fq 'MIGRATION_27_EXECUTION = NOT_PERFORMED' "$doc"
          grep -Fq 'PERMISSION_PROVISIONING = NONE' "$doc"
          grep -Fq 'FEATURE_ACTIVATION = INACTIVE' "$doc"
          grep -Fq 'DEPLOYMENT_AUTHORITY = NOT_GRANTED' "$doc"
          grep -Fq 'TECHNICAL_PREVIEW = NO-GO' "$doc"
          grep -Fq 'PRODUCTION = NO-GO' "$doc"
          grep -Fq 'UPDATER = INACTIVE' "$doc"

      - name: Verify tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "$(git status --porcelain)" ]]
