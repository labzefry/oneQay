name: Sprint131 Final Shift Close Canonical Control Plane Positive Path Regression

# Attribution: Lab | zefry

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sprint131-final-shift-close-canonical-control-plane-positive-path-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify-canonical-control-plane-positive-path-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      CACHE_STORE: array
      SESSION_DRIVER: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Preserve successor-compatible historical regression boundary
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$base" "$head" | LC_ALL=C sort > /tmp/paths
          [[ -s /tmp/paths ]]
          # Sprint131 is historical from Sprint132 onward and validates
          # its owned canonical middleware positive-path invariant without owning the new full envelope.
          # Historical regression workflows validate their owned invariants only.
          # Exact full-PR envelope locking belongs to the active sprint workflow.

      - name: Prove Sprint130 historical successor compatibility
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/sprint130-final-shift-close-canonical-runtime-control-plane-token-policy.yml
          grep -Fq 'Preserve successor-compatible historical regression boundary' "$workflow"
          grep -Fq 'Sprint130 is historical from Sprint131 onward' "$workflow"
          grep -Fq 'Historical regression workflows validate their owned invariants only.' "$workflow"
          grep -Fq 'Exact full-PR envelope locking belongs to the active sprint workflow.' "$workflow"
          ! grep -Fq 'Lock exact Sprint130 source envelope' "$workflow"
          ! grep -Fq 'cat > /tmp/expected' "$workflow"
          ! grep -Fq 'diff -u /tmp/expected /tmp/paths' "$workflow"

      - name: Prove runtime and operational state remain untouched
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --quiet "$base" "$head" -- \
            apps/web/config/final_shift_close_runtime_binding_materialization.php \
            apps/web/config/final_shift_close_runtime_db_binding_attestation.php \
            apps/web/bootstrap/app.php \
            apps/web/bootstrap/providers.php \
            apps/web/routes \
            apps/web/app/Delivery/Http/Pos/FinalShiftCloseRuntimeBindingManifestMaterializationController.php \
            apps/web/app/Delivery/Http/Pos/FinalShiftCloseRuntimeDbBindingAttestationController.php \
            apps/web/app/Application/Pos/FinalShiftCloseRuntimeBindingManifestMaterializer.php \
            apps/web/app/Application/Pos/FinalShiftCloseRuntimeDbBindingAttestation.php \
            apps/web/app/Infrastructure/Pos/FilesystemFinalShiftCloseRuntimeBindingManifestWriter.php \
            apps/web/app/Infrastructure/Pos/LaravelFinalShiftCloseRuntimeDatabaseIdentityReader.php \
            apps/web/database/migrations \
            .github/workflows/final-shift-close-migration27-selected-target-db-binding.yml \
            .github/workflows/final-shift-close-migration27-execution.yml \
            ops/final-shift-close/STATE.json \
            ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json
          [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" == 'NOT_EXECUTED' ]]
          [[ "$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)" == 'NONE' ]]
          [[ "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET' ]]
          [[ "$(jq -r '.selected_target' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'null' ]]

      - name: Validate canonical token policy and security consumers
        shell: bash
        run: |
          set -euo pipefail
          policy=apps/web/app/Application/Pos/FinalShiftCloseRuntimeControlPlaneTokenPolicy.php
          materialization_provider=apps/web/app/Providers/FinalShiftCloseRuntimeBindingManifestMaterializationServiceProvider.php
          db_provider=apps/web/app/Providers/FinalShiftCloseRuntimeDbBindingAttestationServiceProvider.php
          materialization_middleware=apps/web/app/Delivery/Http/Middleware/RequireFinalShiftCloseRuntimeBindingMaterializationTokenMiddleware.php
          db_middleware=apps/web/app/Delivery/Http/Middleware/RequireFinalShiftCloseRuntimeBindingTokenMiddleware.php

          grep -Fq 'public const MINIMUM_LENGTH = 32;' "$policy"
          grep -Fq 'public const MAXIMUM_LENGTH = 512;' "$policy"
          grep -Fq '[A-Za-z0-9._~+=\/-]+' "$policy"
          grep -Fq "private const BEARER_PREFIX = 'Bearer ';" "$policy"
          grep -Fq 'public static function isValidToken(mixed $token): bool' "$policy"
          grep -Fq 'public static function parseBearerCredential(mixed $authorization): ?string' "$policy"

          for provider in "$materialization_provider" "$db_provider"; do
            grep -Fq 'FinalShiftCloseRuntimeControlPlaneTokenPolicy::isValidToken(' "$provider"
            ! grep -Fq 'preg_match(' "$provider"
          done

          for middleware in "$materialization_middleware" "$db_middleware"; do
            grep -Fq 'FinalShiftCloseRuntimeControlPlaneTokenPolicy::isValidToken($this->expectedToken)' "$middleware"
            grep -Fq 'FinalShiftCloseRuntimeControlPlaneTokenPolicy::parseBearerCredential(' "$middleware"
            grep -Fq 'hash_equals($this->expectedToken, $providedToken)' "$middleware"
          done

          grep -Fq 'return $this->rejectionResponse(503);' "$materialization_middleware"
          grep -Fq 'return $this->rejectionResponse(401);' "$materialization_middleware"
          grep -Fq "return response('', 404" "$db_middleware"
          grep -Fq "'Cache-Control' => 'no-store, private'" "$db_middleware"
          grep -Fq "'throttle:1,1'" "$materialization_provider"
          grep -Fq "'throttle:2,1'" "$db_provider"

      - name: Validate Sprint131 machine-readable contract
        shell: bash
        run: |
          set -euo pipefail
          file=ops/final-shift-close/CANONICAL_RUNTIME_CONTROL_PLANE_POSITIVE_PATH_REGRESSION_CONTRACT.json
          jq -e '.schema_version == 1 and .feature == "final-shift-close" and .sprint == 131 and .bounded_objective == "CANONICAL_CONTROL_PLANE_POSITIVE_PATH_REGRESSION" and .execution_mode == "CI_ONLY_SYNTHETIC_MIDDLEWARE_REGRESSION" and .qualification.minimum_length_valid_token == "ACCEPTED" and .qualification.maximum_length_valid_token == "ACCEPTED" and .qualification.bearer_parsing == "EXACT_CANONICAL_BEARER_ONLY" and .qualification.materialization_matching_bearer == "SYNTHETIC_CLOSURE_HTTP_204" and .qualification.db_attestation_matching_bearer == "SYNTHETIC_CLOSURE_HTTP_204" and .qualification.credential_comparison == "HASH_EQUALS_IN_SECURITY_MIDDLEWARE" and .qualification.real_route_invocation == false and .qualification.controller_invocation == false and .qualification.application_service_invocation == false and .preserved_fail_closed_dispositions.materialization_invalid_expected_token == "HTTP_503" and .preserved_fail_closed_dispositions.materialization_invalid_bearer == "HTTP_401" and .preserved_fail_closed_dispositions.db_attestation_invalid_expected_or_bearer == "HTTP_404_CLOAKED" and .successor_compatibility.sprint130_full_pr_envelope_lock == "REMOVED_FROM_HISTORICAL_WORKFLOW" and .successor_compatibility.sprint130_owned_invariant_regression == "PRESERVED" and .successor_compatibility.active_sprint_envelope_authority == "SPRINT131_WORKFLOW_ONLY" and .source_envelope.path_count == 5 and .source_envelope.sha256 == "6549ac162090f316faad210ff3b6298640ee538aecb681f05ca49f616930dd6b" and .canonical_boundaries.valid_operational_control_plane_request == "NOT_PERFORMED" and .canonical_boundaries.real_route_invocation == "NOT_PERFORMED" and .canonical_boundaries.controller_invocation == "NOT_PERFORMED" and .canonical_boundaries.runtime_configuration_mutation == "NOT_PERFORMED" and .canonical_boundaries.runtime_token_provisioning == "NOT_PERFORMED" and .canonical_boundaries.runtime_manifest_materialization == "NOT_PERFORMED" and .canonical_boundaries.runtime_db_binding_attestation == "NOT_PERFORMED" and .canonical_boundaries.migration27_execution == "NOT_PERFORMED" and .canonical_boundaries.permission_provisioning == "NONE" and .canonical_boundaries.feature_activation == "INACTIVE" and .canonical_boundaries.selected_target == null and .canonical_boundaries.deployment_authority == "NOT_GRANTED" and .canonical_boundaries.technical_preview == "NO-GO" and .canonical_boundaries.production == "NO-GO" and .canonical_boundaries.updater == "INACTIVE" and .attribution == "Author by Lab | zefry"' "$file" >/dev/null

      - name: Prove positive-path regression remains synthetic only
        shell: bash
        run: |
          set -euo pipefail
          test_file=apps/web/tests/final-shift-close-runtime-control-plane-token-character-policy.php
          grep -Fq "Request::create('/_ci/token-policy-positive', 'POST'" "$test_file"
          grep -Fq "Request::create('/_ci/token-policy-positive', 'GET'" "$test_file"
          grep -Fq "if (\$mode === 'materialization-matching-bearer')" "$test_file"
          grep -Fq "if (\$mode === 'db-matching-bearer')" "$test_file"
          grep -Fq "return response('', 204);" "$test_file"
          ! grep -Fq 'FinalShiftCloseRuntimeBindingManifestMaterializationController' "$test_file"
          ! grep -Fq 'FinalShiftCloseRuntimeDbBindingAttestationController' "$test_file"
          ! grep -Fq 'FinalShiftCloseRuntimeBindingManifestMaterializer' "$test_file"
          ! grep -Fq 'FinalShiftCloseRuntimeDbBindingAttestation;' "$test_file"

      - name: Validate PHP syntax and locked dependencies
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php -l app/Application/Pos/FinalShiftCloseRuntimeControlPlaneTokenPolicy.php
          php -l app/Providers/FinalShiftCloseRuntimeBindingManifestMaterializationServiceProvider.php
          php -l app/Providers/FinalShiftCloseRuntimeDbBindingAttestationServiceProvider.php
          php -l app/Delivery/Http/Middleware/RequireFinalShiftCloseRuntimeBindingMaterializationTokenMiddleware.php
          php -l app/Delivery/Http/Middleware/RequireFinalShiftCloseRuntimeBindingTokenMiddleware.php
          php -l tests/final-shift-close-runtime-control-plane-token-character-policy.php
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          composer audit --locked --no-interaction --abandoned=report

      - name: Prove canonical token policy matrix
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-token-character-policy.php regex-matrix

      - name: Prove materialization matching Bearer reaches synthetic closure
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-token-character-policy.php materialization-matching-bearer

      - name: Prove DB attestation matching Bearer reaches synthetic closure
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-token-character-policy.php db-matching-bearer

      - name: Preserve materialization fail-closed dispositions
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php tests/final-shift-close-runtime-control-plane-token-character-policy.php materialization-invalid-expected
          php tests/final-shift-close-runtime-control-plane-token-character-policy.php materialization-missing-bearer
          php tests/final-shift-close-runtime-control-plane-token-character-policy.php materialization-malformed-bearer
          php tests/final-shift-close-runtime-control-plane-token-character-policy.php materialization-invalid-bearer
          php tests/final-shift-close-runtime-control-plane-token-character-policy.php materialization-mismatched-bearer

      - name: Preserve DB attestation fail-closed dispositions
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php tests/final-shift-close-runtime-control-plane-token-character-policy.php db-invalid-expected
          php tests/final-shift-close-runtime-control-plane-token-character-policy.php db-missing-bearer
          php tests/final-shift-close-runtime-control-plane-token-character-policy.php db-malformed-bearer
          php tests/final-shift-close-runtime-control-plane-token-character-policy.php db-invalid-bearer
          php tests/final-shift-close-runtime-control-plane-token-character-policy.php db-mismatched-bearer

      - name: Lock no operational invocation or activation
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/sprint131-final-shift-close-canonical-control-plane-positive-path-regression.yml
          ! grep -Fq 'workflow_dispatch' "$workflow"
          doc=docs/SPRINT131_FINAL_SHIFT_CLOSE_CANONICAL_CONTROL_PLANE_POSITIVE_PATH_REGRESSION.md
          grep -Fq 'SPRINT131_VALID_OPERATIONAL_CONTROL_PLANE_REQUEST = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT131_REAL_ROUTE_INVOCATION = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT131_CONTROLLER_INVOCATION = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT131_RUNTIME_CONFIGURATION_MUTATION = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT131_RUNTIME_TOKEN_PROVISIONING = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT131_RUNTIME_MANIFEST_MATERIALIZATION = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT131_RUNTIME_DB_BINDING_ATTESTATION = NOT_PERFORMED' "$doc"
          grep -Fq 'SELECTED_TARGET = NONE' "$doc"
          grep -Fq 'DB_BINDING_PRODUCER_DISPATCH = NOT_PERFORMED' "$doc"
          grep -Fq 'MIGRATION_27_EXECUTION = NOT_PERFORMED' "$doc"
          grep -Fq 'PERMISSION_PROVISIONING = NONE' "$doc"
          grep -Fq 'FEATURE_ACTIVATION = INACTIVE' "$doc"
          grep -Fq 'DEPLOYMENT_AUTHORITY = NOT_GRANTED' "$doc"
          grep -Fq 'TECHNICAL_PREVIEW = NO-GO' "$doc"
          grep -Fq 'PRODUCTION = NO-GO' "$doc"
          grep -Fq 'UPDATER = INACTIVE' "$doc"

      - name: Verify tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "$(git status --porcelain)" ]]
