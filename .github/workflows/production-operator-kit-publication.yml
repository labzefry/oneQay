# Author by Lab | zefry
# Sprint255 exact-source Production operator-kit successor binding — Lab | zefry
name: Production Dark Deployment Operator Kit Publication

on:
  workflow_run:
    workflows: ["Durable Staging Operator Artifact Publication"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: production-dark-deployment-operator-kit-${{ github.event.workflow_run.id || github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      STAGING_RUN_ID: ${{ github.event.workflow_run.id || '' }}
      REPOSITORY: ${{ github.repository }}
      API_URL: ${{ github.api_url }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact canonical source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup governed PHP runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: curl,pdo_mysql,phar
          coverage: none

      - name: Validate exact-source successor boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch origin main --quiet
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main

          state=ops/final-shift-close/STATE.json
          selection=ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json
          contract=ops/final-shift-close/PRODUCTION_OPERATOR_KIT_PUBLICATION_CONTRACT.json

          jq -e . "$state" >/dev/null
          jq -e . "$selection" >/dev/null
          jq -e . "$contract" >/dev/null

          test "$(jq -r '.migration27.state' "$state")" = EXECUTED
          test "$(jq -r '.permission_provisioning.state' "$state")" = PROVISIONED
          test "$(jq -r '.permission_provisioning.permission_id' "$state")" = pos.shift.close
          test "$(jq -r '.permission_provisioning.default_grant' "$state")" = NONE
          test "$(jq -r '.feature_activation.state' "$state")" = ACTIVE
          test "$(jq -r '.deployment_authority' "$state")" = NOT_GRANTED
          test "$(jq -r '.technical_preview_activation' "$state")" = NOT_AUTHORIZED
          test "$(jq -r '.production_activation' "$state")" = NOT_AUTHORIZED
          test "$(jq -r '.updater_activation' "$state")" = INACTIVE

          test "$(jq -r '.selection_state' "$selection")" = SELECTED_NOT_AUTHORIZED
          test "$(jq -r '.selected_target.environment_id' "$selection")" = oneqay-durable-staging-01
          test "$(jq -r '.selected_target.runtime_class' "$selection")" = durable-staging

          test "$(jq -r '.contract_state' "$contract")" = PUBLISHES_SECRET_FREE_PRODUCTION_DARK_DEPLOYMENT_OPERATOR_KIT_NOT_DEPLOYED_NOT_ACTIVATED
          test "$(jq -r '.authority_boundary.kit_is_not_deployment_authority' "$contract")" = true
          test "$(jq -r '.authority_boundary.separate_production_deployment_authority_required' "$contract")" = true
          test "$(jq -r '.authority_boundary.production_traffic_activation_allowed' "$contract")" = false

      - name: Validate operator source and tools
        shell: bash
        run: |
          set -euo pipefail
          bash -n tools/production/build-production-operator-kit.sh
          php -l tools/execute-production-dark-deployment.php
          php -l tools/inspect-production-operator-target.php
          php -l tools/prepare-production-operator-target-candidate.php
          php -l tools/prepare-production-deployment-authority-request.php
          php -l tools/qualify-production-deployment-authority.php
          php -l tools/prepare-production-deployment-plan.php
          php -l tools/qualify-production-deployment-evidence.php

      - name: Resolve exact-source durable-staging prerequisite
        id: staging
        shell: bash
        run: |
          set -euo pipefail

          api() {
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$1"
          }

          run_id="$STAGING_RUN_ID"
          if [[ -z "$run_id" ]]; then
            runs="$(api "$API_URL/repos/$REPOSITORY/actions/runs?head_sha=$SOURCE_SHA&per_page=100")"
            run_id="$(jq -r --arg source "$SOURCE_SHA" '[.workflow_runs[] | select(.path == ".github/workflows/durable-staging-release-publication.yml" and .head_sha == $source and .head_branch == "main" and .status == "completed" and .conclusion == "success" and .event != "pull_request")][0].id // empty' <<<"$runs")"
          fi
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]]

          run="$(api "$API_URL/repos/$REPOSITORY/actions/runs/$run_id")"
          test "$(jq -r '.path' <<<"$run")" = .github/workflows/durable-staging-release-publication.yml
          test "$(jq -r '.head_branch' <<<"$run")" = main
          test "$(jq -r '.head_sha' <<<"$run")" = "$SOURCE_SHA"
          test "$(jq -r '.status' <<<"$run")" = completed
          test "$(jq -r '.conclusion' <<<"$run")" = success

          release_id="durable-staging-${SOURCE_SHA:0:12}"
          expected_name="oneqay-${release_id}-operator-bundle"
          artifacts="$(api "$API_URL/repos/$REPOSITORY/actions/runs/$run_id/artifacts?per_page=100")"
          matches="$(jq --arg name "$expected_name" '[.artifacts[] | select(.name == $name and .expired == false)]' <<<"$artifacts")"
          test "$(jq 'length' <<<"$matches")" = 1
          artifact_id="$(jq -r '.[0].id' <<<"$matches")"
          size="$(jq -r '.[0].size_in_bytes' <<<"$matches")"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
          (( size > 0 && size <= 33554432 ))

          rm -rf /tmp/production-kit-staging /tmp/production-kit-staging.zip
          mkdir -p /tmp/production-kit-staging
          curl --fail-with-body --silent --show-error --location \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$API_URL/repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" \
            --output /tmp/production-kit-staging.zip
          (( $(wc -c < /tmp/production-kit-staging.zip) <= 33554432 ))
          unzip -qq /tmp/production-kit-staging.zip -d /tmp/production-kit-staging

          archive="/tmp/production-kit-staging/${release_id}.tar.gz"
          manifest="/tmp/production-kit-staging/${release_id}.manifest.json"
          checksum="/tmp/production-kit-staging/${release_id}.tar.gz.sha256"
          handoff="/tmp/production-kit-staging/${release_id}.deployment-handoff.json"
          for file in "$archive" "$manifest" "$checksum" "$handoff"; do test -f "$file"; done
          php tools/validate-durable-staging-release-manifest.php "$manifest" "$archive"
          (cd /tmp/production-kit-staging && sha256sum -c "$(basename "$checksum")")
          test "$(jq -r '.source.commit_sha' "$manifest")" = "$SOURCE_SHA"
          test "$(jq -r '.runtime.required_runtime_class' "$manifest")" = durable-staging
          test "$(jq -r '.handoff_state' "$handoff")" = VALIDATED_FOR_EXTERNAL_DEPLOYMENT_NOT_AUTHORIZED
          test "$(jq -r '.artifact.source_commit' "$handoff")" = "$SOURCE_SHA"
          test "$(jq -r '.deployment.authority_state' "$handoff")" = NOT_GRANTED
          artifact_sha="$(jq -r '.artifact.sha256' "$manifest")"
          [[ "$artifact_sha" =~ ^[0-9a-f]{64}$ ]]
          test "$artifact_sha" = "$(sha256sum "$archive" | awk '{print $1}')"

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "artifact_sha=$artifact_sha" >> "$GITHUB_OUTPUT"

      - name: Resolve exact-source Production release candidate
        id: production
        shell: bash
        run: |
          set -euo pipefail

          api() {
            curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$1"
          }

          run_id=''
          for attempt in $(seq 1 60); do
            runs="$(api "$API_URL/repos/$REPOSITORY/actions/runs?head_sha=$SOURCE_SHA&per_page=100")"
            candidate="$(jq -c --arg source "$SOURCE_SHA" '[.workflow_runs[] | select(.path == ".github/workflows/production-release-candidate-publication.yml" and .head_sha == $source and .head_branch == "main" and .event != "pull_request")][0] // {}' <<<"$runs")"
            candidate_id="$(jq -r '.id // empty' <<<"$candidate")"
            status="$(jq -r '.status // empty' <<<"$candidate")"
            conclusion="$(jq -r '.conclusion // empty' <<<"$candidate")"
            if [[ -n "$candidate_id" && "$status" == completed ]]; then
              if [[ "$conclusion" != success ]]; then
                echo "Exact-source Production RC publication completed non-success: $conclusion" >&2
                exit 1
              fi
              run_id="$candidate_id"
              break
            fi
            sleep 5
          done
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]] || {
            echo 'Timed out waiting for exact-source Production RC publication.' >&2
            exit 1
          }

          run="$(api "$API_URL/repos/$REPOSITORY/actions/runs/$run_id")"
          test "$(jq -r '.path' <<<"$run")" = .github/workflows/production-release-candidate-publication.yml
          test "$(jq -r '.head_sha' <<<"$run")" = "$SOURCE_SHA"
          test "$(jq -r '.conclusion' <<<"$run")" = success

          release_id="production-${SOURCE_SHA:0:12}"
          expected_name="oneqay-${release_id}-operator-bundle"
          artifacts="$(api "$API_URL/repos/$REPOSITORY/actions/runs/$run_id/artifacts?per_page=100")"
          matches="$(jq --arg name "$expected_name" '[.artifacts[] | select(.name == $name and .expired == false)]' <<<"$artifacts")"
          test "$(jq 'length' <<<"$matches")" = 1
          artifact_id="$(jq -r '.[0].id' <<<"$matches")"
          artifact_name="$(jq -r '.[0].name' <<<"$matches")"
          outer_digest="$(jq -r '.[0].digest' <<<"$matches")"
          expires_at="$(jq -r '.[0].expires_at' <<<"$matches")"
          outer_size="$(jq -r '.[0].size_in_bytes' <<<"$matches")"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$outer_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          (( outer_size > 0 && outer_size <= 33554432 ))

          rm -rf /tmp/production-kit-release /tmp/production-kit-release.zip
          mkdir -p /tmp/production-kit-release
          curl --fail-with-body --silent --show-error --location \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$API_URL/repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" \
            --output /tmp/production-kit-release.zip
          (( $(wc -c < /tmp/production-kit-release.zip) <= 33554432 ))
          unzip -qq /tmp/production-kit-release.zip -d /tmp/production-kit-release

          archive="/tmp/production-kit-release/${release_id}.tar.gz"
          manifest="/tmp/production-kit-release/${release_id}.manifest.json"
          checksum="/tmp/production-kit-release/${release_id}.tar.gz.sha256"
          for file in "$archive" "$manifest" "$checksum"; do test -f "$file"; done
          (cd /tmp/production-kit-release && sha256sum -c "$(basename "$checksum")")
          test "$(jq -r '.release.id' "$manifest")" = "$release_id"
          test "$(jq -r '.source.commit_sha' "$manifest")" = "$SOURCE_SHA"
          test "$(jq -r '.release.channel' "$manifest")" = PRODUCTION_CANDIDATE
          test "$(jq -r '.release.production' "$manifest")" = true
          test "$(jq -r '.runtime.business_runtime_activation_ready' "$manifest")" = false
          test "$(jq -r '.promotion_gate.verified_durable_staging_evidence_required' "$manifest")" = true
          test "$(jq -r '.promotion_gate.same_source_commit_required' "$manifest")" = true
          test "$(jq -r '.promotion_gate.production_traffic_activation_authorized' "$manifest")" = false

          artifact_sha="$(jq -r '.artifact.sha256' "$manifest")"
          artifact_size="$(jq -r '.artifact.size_bytes' "$manifest")"
          artifact_filename="$(jq -r '.artifact.filename' "$manifest")"
          manifest_sha="$(sha256sum "$manifest" | awk '{print $1}')"
          [[ "$artifact_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$manifest_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$artifact_size" =~ ^[1-9][0-9]*$ ]]
          test "$artifact_sha" = "$(sha256sum "$archive" | awk '{print $1}')"
          test "$artifact_size" = "$(wc -c < "$archive")"
          test "$artifact_filename" = "${release_id}.tar.gz"

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "outer_digest=$outer_digest" >> "$GITHUB_OUTPUT"
          echo "expires_at=$expires_at" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "artifact_filename=$artifact_filename" >> "$GITHUB_OUTPUT"
          echo "artifact_size=$artifact_size" >> "$GITHUB_OUTPUT"
          echo "artifact_sha=$artifact_sha" >> "$GITHUB_OUTPUT"
          echo "manifest_sha=$manifest_sha" >> "$GITHUB_OUTPUT"

      - name: Bind runtime provenance without mutating tracked contract
        shell: bash
        run: |
          set -euo pipefail
          contract=ops/final-shift-close/PRODUCTION_OPERATOR_KIT_PUBLICATION_CONTRACT.json
          cp "$contract" /tmp/production-operator-kit-contract-base.json

          jq \
            --argjson production_run_id "${{ steps.production.outputs.run_id }}" \
            --argjson production_artifact_id "${{ steps.production.outputs.artifact_id }}" \
            --arg production_artifact_name "${{ steps.production.outputs.artifact_name }}" \
            --arg production_outer_digest "${{ steps.production.outputs.outer_digest }}" \
            --arg production_expires_at "${{ steps.production.outputs.expires_at }}" \
            --arg production_release_id "${{ steps.production.outputs.release_id }}" \
            --arg source "$SOURCE_SHA" \
            --arg production_filename "${{ steps.production.outputs.artifact_filename }}" \
            --argjson production_size "${{ steps.production.outputs.artifact_size }}" \
            --arg production_sha "${{ steps.production.outputs.artifact_sha }}" \
            --arg production_manifest_sha "${{ steps.production.outputs.manifest_sha }}" \
            --argjson staging_run_id "${{ steps.staging.outputs.run_id }}" \
            --argjson staging_artifact_id "${{ steps.staging.outputs.artifact_id }}" \
            --arg staging_release_id "${{ steps.staging.outputs.release_id }}" \
            --arg staging_sha "${{ steps.staging.outputs.artifact_sha }}" \
            '.production_release_reference = {
              publication_run_id: $production_run_id,
              actions_artifact_id: $production_artifact_id,
              actions_artifact_name: $production_artifact_name,
              actions_outer_digest: $production_outer_digest,
              expires_at: $production_expires_at,
              release_id: $production_release_id,
              source_commit: $source,
              artifact_filename: $production_filename,
              artifact_size_bytes: $production_size,
              artifact_sha256: $production_sha,
              manifest_sha256: $production_manifest_sha,
              business_runtime_activation_ready: false,
              dark_deploy_health_endpoint: "/health/live"
            }
            | .staging_prerequisite_reference = {
              publication_run_id: $staging_run_id,
              actions_artifact_id: $staging_artifact_id,
              source_commit: $source,
              release_id: $staging_release_id,
              artifact_sha256: $staging_sha,
              verified_deployment_evidence_required: true
            }
            | .runtime_successor_binding = {
              source_commit: $source,
              migration27: "EXECUTED",
              permission_provisioning: "PROVISIONED",
              feature_activation: "ACTIVE",
              deployment_authority: "NOT_GRANTED",
              selected_target_state: "SELECTED_NOT_AUTHORIZED",
              selected_target_environment_id: "oneqay-durable-staging-01",
              production_activation: "NOT_AUTHORIZED",
              updater_activation: "INACTIVE",
              exact_source_artifact_pair_required: true
            }' /tmp/production-operator-kit-contract-base.json > "$contract.tmp"
          mv "$contract.tmp" "$contract"

          test "$(jq -r '.production_release_reference.source_commit' "$contract")" = "$SOURCE_SHA"
          test "$(jq -r '.staging_prerequisite_reference.source_commit' "$contract")" = "$SOURCE_SHA"
          test "$(jq -r '.runtime_successor_binding.feature_activation' "$contract")" = ACTIVE
          test "$(jq -r '.runtime_successor_binding.deployment_authority' "$contract")" = NOT_GRANTED
          test "$(jq -r '.authority_boundary.production_traffic_activation_allowed' "$contract")" = false

      - name: Build first exact Production operator kit
        id: kit
        shell: bash
        run: |
          set -euo pipefail
          bash tools/production/build-production-operator-kit.sh "$SOURCE_SHA"
          kit_id="production-operator-kit-${SOURCE_SHA:0:12}"
          cp "dist/${kit_id}.zip" /tmp/production-kit-first.zip
          cp "dist/${kit_id}.manifest.json" /tmp/production-kit-first.manifest.json
          cp "dist/${kit_id}.zip.sha256" /tmp/production-kit-first.sha256
          test "$(jq -r '.production_release_reference.source_commit' "dist/${kit_id}.manifest.json")" = "$SOURCE_SHA"
          test "$(jq -r '.staging_prerequisite_reference.source_commit' "dist/${kit_id}.manifest.json")" = "$SOURCE_SHA"
          test "$(jq -r '.production_release_reference.actions_artifact_id' "dist/${kit_id}.manifest.json")" = "${{ steps.production.outputs.artifact_id }}"
          test "$(jq -r '.staging_prerequisite_reference.actions_artifact_id' "dist/${kit_id}.manifest.json")" = "${{ steps.staging.outputs.artifact_id }}"
          echo "kit_id=$kit_id" >> "$GITHUB_OUTPUT"

      - name: Prove deterministic and secret-free kit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          bash tools/production/build-production-operator-kit.sh "$SOURCE_SHA"
          kit_id="production-operator-kit-${SOURCE_SHA:0:12}"
          cmp /tmp/production-kit-first.zip "dist/${kit_id}.zip"
          diff -u /tmp/production-kit-first.manifest.json "dist/${kit_id}.manifest.json"
          diff -u /tmp/production-kit-first.sha256 "dist/${kit_id}.zip.sha256"
          unzip -l "dist/${kit_id}.zip" > /tmp/production-kit-list.txt
          ! grep -Fq '/apps/web/' /tmp/production-kit-list.txt
          ! grep -E '(^|/)(\.env|id_rsa|id_ed25519)(/|$)|\.(pem|key|p12|pfx)$' /tmp/production-kit-list.txt
          test "$(jq -r '.secret_values_embedded' "dist/${kit_id}.manifest.json")" = false
          test "$(jq -r '.application_release_bytes_embedded' "dist/${kit_id}.manifest.json")" = false
          test "$(jq -r '.deployment_authority' "dist/${kit_id}.manifest.json")" = NOT_GRANTED
          test "$(jq -r '.production_traffic_activation' "dist/${kit_id}.manifest.json")" = NOT_AUTHORIZED

      - name: Upload governed Production operator kit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oneqay-${{ steps.kit.outputs.kit_id }}
          path: |
            dist/${{ steps.kit.outputs.kit_id }}.zip
            dist/${{ steps.kit.outputs.kit_id }}.manifest.json
            dist/${{ steps.kit.outputs.kit_id }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Restore tracked provenance and confirm source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          contract=ops/final-shift-close/PRODUCTION_OPERATOR_KIT_PUBLICATION_CONTRACT.json
          cp /tmp/production-operator-kit-contract-base.json "$contract"
          rm -rf dist
          git diff --exit-code
          test -z "$(git status --porcelain)"

