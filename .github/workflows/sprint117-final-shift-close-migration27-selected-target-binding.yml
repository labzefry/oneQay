name: Sprint117 Final Shift Close Migration27 Selected Target Binding

# Attribution: Lab | zefry

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/final-shift-close-migration27-selected-target-db-binding.yml'
      - '.github/workflows/sprint103-final-shift-close-migration27-execution-evidence.yml'
      - '.github/workflows/sprint117-final-shift-close-migration27-selected-target-binding.yml'
      - '.github/workflows/sprint118-final-shift-close-migration27-selected-target-db-binding.yml'
      - 'docs/SPRINT117_FINAL_SHIFT_CLOSE_MIGRATION27_SELECTED_TARGET_BINDING.md'
      - 'docs/SPRINT118_FINAL_SHIFT_CLOSE_MIGRATION27_SELECTED_TARGET_DB_BINDING.md'
      - 'ops/final-shift-close/MIGRATION27_SELECTED_TARGET_BINDING_CONTRACT.json'

permissions:
  contents: read

concurrency:
  group: sprint117-final-shift-close-migration27-selected-target-binding-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify-migration27-selected-target-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Enforce exact Sprint118 successor compatibility envelope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | LC_ALL=C sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          .github/workflows/final-shift-close-migration27-selected-target-db-binding.yml
          .github/workflows/sprint103-final-shift-close-migration27-execution-evidence.yml
          .github/workflows/sprint117-final-shift-close-migration27-selected-target-binding.yml
          .github/workflows/sprint118-final-shift-close-migration27-selected-target-db-binding.yml
          docs/SPRINT117_FINAL_SHIFT_CLOSE_MIGRATION27_SELECTED_TARGET_BINDING.md
          docs/SPRINT118_FINAL_SHIFT_CLOSE_MIGRATION27_SELECTED_TARGET_DB_BINDING.md
          ops/final-shift-close/MIGRATION27_SELECTED_TARGET_BINDING_CONTRACT.json
          EOF
          diff -u /tmp/expected /tmp/actual
          test "$(sha256sum /tmp/actual | awk '{print $1}')" = '1b8a8a9851a5cac94389c6939f4c4f08dd479c108296c3959c996884612ee13c'

      - name: Preserve Sprint117 executor application and operational boundaries
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --exit-code "$BASE_SHA" "$HEAD_SHA" -- \
            .github/workflows/final-shift-close-migration27-execution.yml \
            apps/web/app \
            apps/web/bootstrap \
            apps/web/config \
            apps/web/database/migrations \
            apps/web/routes \
            apps/web/resources \
            ops/final-shift-close/STATE.json \
            ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json

          state=ops/final-shift-close/STATE.json
          selection=ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json
          test "$(jq -r '.migration27.state' "$state")" = 'NOT_EXECUTED'
          test "$(jq -r '.permission_provisioning.state' "$state")" = 'NONE'
          test "$(jq -r '.feature_activation.state' "$state")" = 'INACTIVE'
          test "$(jq -r '.selection_state' "$selection")" = 'BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET'
          test "$(jq -r '.selected_target' "$selection")" = 'null'
          test "$(git rev-parse "$HEAD_SHA:apps/web/database/migrations/0000_00_00_000027_create_pos_shift_close_evidence_foundation.php")" = 'a412560c2f340f4783a385aef729dbd074389a4c'

      - name: Validate successor machine-readable contract without losing Sprint117 provenance
        shell: bash
        run: |
          set -euo pipefail
          contract=ops/final-shift-close/MIGRATION27_SELECTED_TARGET_BINDING_CONTRACT.json
          jq -e . "$contract" >/dev/null
          test "$(jq -r '.schema_version' "$contract")" = '1'
          test "$(jq -r '.contract_state' "$contract")" = 'MATERIALIZED_SOURCE_ONLY_NOT_DISPATCHED'
          test "$(jq -r '.required_selection_state' "$contract")" = 'SELECTED_NOT_AUTHORIZED'
          test "$(jq -r '.caller_supplied_runtime_target_inputs' "$contract")" = 'false'
          test "$(jq -r '.binding_producer_workflow_path' "$contract")" = '.github/workflows/final-shift-close-migration27-selected-target-db-binding.yml'
          test "$(jq -r '.binding_producer_source_state' "$contract")" = 'SOURCE_MATERIALIZED_NOT_DISPATCHED'
          test "$(jq -r '.binding_artifact_name' "$contract")" = 'final-shift-close-migration27-selected-target-db-binding'
          test "$(jq -r '.binding_evidence_context' "$contract")" = 'final-shift-close-migration27-selected-target-db-binding-evidence'
          test "$(jq -r '.database_binding_algorithm' "$contract")" = 'SHA256_CANONICAL_JSON_DATABASE_HOSTNAME_PORT_V1'
          test "$(jq -r '.sprint117_source_envelope_sha256' "$contract")" = '0aab6969f2e6fe3e7f23aae2af99bc8fb9d70ac10e6d620bf20bc30a58ba4e25'
          test "$(jq -r '.source_envelope_sha256' "$contract")" = '1b8a8a9851a5cac94389c6939f4c4f08dd479c108296c3959c996884612ee13c'
          test "$(jq -r '.canonical_boundaries.binding_evidence' "$contract")" = 'NONE'
          test "$(jq -r '.canonical_boundaries.migration27_execution' "$contract")" = 'NOT_PERFORMED'

      - name: Preserve Sprint117 migration executor selected-target and DB-binding requirements
        shell: bash
        run: |
          set -euo pipefail
          executor=.github/workflows/final-shift-close-migration27-execution.yml
          grep -Fq 'binding_run_id:' "$executor"
          grep -Fq 'binding_run_attempt:' "$executor"
          grep -Fq 'TARGET_SELECTION_FILE: ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json' "$executor"
          grep -Fq 'SELECTED_NOT_AUTHORIZED' "$executor"
          grep -Fq 'selected_target.environment_id' "$executor"
          grep -Fq 'selected_target.exact_running_source_commit' "$executor"
          grep -Fq 'selected_target.selection_fingerprint_sha256' "$executor"
          grep -Fq 'selected_target.trusted_ingestion.ingestion_fingerprint_sha256' "$executor"
          grep -Fq 'BINDING_WORKFLOW_PATH: .github/workflows/final-shift-close-migration27-selected-target-db-binding.yml' "$executor"
          grep -Fq 'BINDING_ARTIFACT_NAME: final-shift-close-migration27-selected-target-db-binding' "$executor"
          grep -Fq 'BINDING_EVIDENCE_CONTEXT: final-shift-close-migration27-selected-target-db-binding-evidence' "$executor"
          grep -Fq 'VERIFIED_SELECTED_TARGET_DATABASE' "$executor"
          grep -Fq 'SELECT DATABASE() AS database_name, @@hostname AS server_hostname, @@port AS server_port' "$executor"
          grep -Fq 'hash_equals($expectedBinding, $actualBinding)' "$executor"
          grep -Fq 'Migration27 database credentials are not bound to the exact selected durable target.' "$executor"

          binding_line="$(grep -n 'name: Resolve exact selected-target database-binding evidence' "$executor" | cut -d: -f1)"
          pending_line="$(grep -n 'name: Publish pending execution evidence' "$executor" | cut -d: -f1)"
          execute_line="$(grep -n 'name: Execute canonical migration27 and verify durable schema' "$executor" | cut -d: -f1)"
          migrate_line="$(grep -n 'php artisan migrate \\' "$executor" | cut -d: -f1)"
          (( binding_line < pending_line && pending_line < execute_line && execute_line < migrate_line ))

      - name: Accept only the reserved Sprint118 producer as successor implementation
        shell: bash
        run: |
          set -euo pipefail
          producer=.github/workflows/final-shift-close-migration27-selected-target-db-binding.yml
          test -f "$producer"
          grep -Fq 'workflow_dispatch:' "$producer"
          ! grep -Fq 'inputs:' "$producer"
          grep -Fq "github.ref == 'refs/heads/main'" "$producer"
          grep -Fq 'environment: final-shift-close-migration27-selected-target-db-binding' "$producer"
          grep -Fq 'statuses: write' "$producer"
          ! grep -Fq 'contents: write' "$producer"
          ! grep -Fq 'deployments: write' "$producer"
          grep -Fq 'SELECTED_NOT_AUTHORIZED' "$producer"
          grep -Fq 'ACTIVE_APPLICATION_DATABASE_CONNECTION' "$producer"
          grep -Fq 'attestation_mode' "$producer"
          grep -Fq 'READ_ONLY' "$producer"
          grep -Fq 'SELECT DATABASE() AS database_name, @@hostname AS server_hostname, @@port AS server_port' "$producer"
          grep -Fq 'hash_equals($runtimeBinding, $actualBinding)' "$producer"
          grep -Fq 'Migration27 table already exists; refusing retrospective database-binding evidence.' "$producer"
          grep -Fq 'Migration27 is already recorded; refusing retrospective database-binding evidence.' "$producer"

      - name: Preserve forward-only migration and no-go semantics
        shell: bash
        run: |
          set -euo pipefail
          executor=.github/workflows/final-shift-close-migration27-execution.yml
          producer=.github/workflows/final-shift-close-migration27-selected-target-db-binding.yml
          grep -Fq 'MIGRATION_BLOB_SHA: a412560c2f340f4783a385aef729dbd074389a4c' "$executor"
          grep -Fq 'php artisan migrate \' "$executor"
          grep -Fq -- '--path="$MIGRATION_PATH"' "$executor"
          ! grep -Eq '(migrate:rollback|migrate:reset|migrate:refresh|migrate:fresh|php artisan migrate:down)' "$executor"
          ! grep -Eq '(DROP TABLE|TRUNCATE TABLE|DELETE FROM)' "$executor"
          ! grep -Eq '(php artisan migrate|migrate:rollback|migrate:fresh|DROP TABLE|TRUNCATE TABLE)' "$producer"
          ! grep -Fq 'ONEQAY_POS_SHIFT_CLOSE_ENABLED=true' "$producer"
          ! grep -Eq '(kubectl |helm |ssh |scp |rsync |gh release|docker push)' "$producer"

      - name: Lock Sprint117 successor documentation disposition
        shell: bash
        run: |
          set -euo pipefail
          doc=docs/SPRINT117_FINAL_SHIFT_CLOSE_MIGRATION27_SELECTED_TARGET_BINDING.md
          grep -Fq 'SPRINT117_HISTORICAL_BINDING_PRODUCER_STATE = NOT_IMPLEMENTED_AT_SPRINT117_CHECKPOINT' "$doc"
          grep -Fq 'SPRINT118_SUCCESSOR_BINDING_PRODUCER_STATE = SOURCE_MATERIALIZED_NOT_DISPATCHED' "$doc"
          grep -Fq 'MIGRATION27_SELECTED_TARGET_BINDING_EVIDENCE = NONE' "$doc"
          grep -Fq 'MIGRATION_27_EXECUTION = NOT_PERFORMED' "$doc"
          grep -Fq 'FEATURE_ACTIVATION = INACTIVE' "$doc"
          grep -Fq 'PRODUCTION_ACTIVATION = NOT_AUTHORIZED' "$doc"

      - name: Verify tracked-source cleanliness
        shell: bash
        run: git diff --exit-code
