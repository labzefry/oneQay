# Author by Lab | zefry
name: Sprint201 Merchant POS State-Aware Guided Operations Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint201-merchant-pos-state-aware-guided-operations-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  qualify-sprint201-merchant-pos-state-aware-guided-operations:
    name: qualify-sprint201-merchant-pos-state-aware-guided-operations
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      APP_DEBUG: "false"
      APP_URL: http://127.0.0.1
      ONEQAY_RUNTIME_CLASS: ci
      SESSION_DRIVER: array
      CACHE_STORE: array
      LOG_CHANNEL: stderr

    steps:
      - name: Checkout exact Sprint201 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Qualify exact Sprint201 engineering envelope
        if: github.event_name == 'pull_request' && github.head_ref == 'sprint201-merchant-pos-state-aware-guided-operations'
        shell: bash
        env:
          EXPECTED_PATH_HASH: 42c4cdd533a99adf2d0d5ba379e1e90575f0bd081ec08187107e9f7a0a03d766
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          mapfile -t paths < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | LC_ALL=C sort)
          expected=(
            ".github/workflows/m7-5-preview-release-artifact.yml"
            ".github/workflows/sprint201-merchant-pos-state-aware-guided-operations-regression.yml"
            ".github/workflows/sprint32-authentication-recovery-proof-regression.yml"
            ".github/workflows/sprint33-recovery-bound-password-reset-regression.yml"
            ".github/workflows/sprint34-authenticated-password-change-regression.yml"
            "apps/web/app/Application/Pos/PosMerchantOperationsReadinessSnapshot.php"
            "apps/web/app/Application/Pos/ViewPosMerchantOperationsReadiness.php"
            "apps/web/app/Delivery/Http/Pos/PosOperationsHubController.php"
            "apps/web/app/Providers/PosOperationsHubServiceProvider.php"
            "apps/web/resources/js/pages/Pos/OperationsHub.vue"
            "apps/web/tests/merchant-pos-guided-operations-home.php"
            "apps/web/tests/merchant-pos-state-aware-guided-operations.php"
          )
          test "${#paths[@]}" -eq "${#expected[@]}"
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${paths[@]}")
          actual_hash="$(printf '%s\n' "${paths[@]}" | sha256sum | awk '{print $1}')"
          test "$actual_hash" = "$EXPECTED_PATH_HASH"

      - name: Preserve operational NO-GO
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" = NOT_EXECUTED
          test "$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)" = NONE
          test "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" = INACTIVE
          test "$(jq -r '.deployment_authority' ops/final-shift-close/STATE.json)" = NOT_GRANTED
          test "$(jq -r '.technical_preview_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
          test "$(jq -r '.production_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
          test "$(jq -r '.updater_activation' ops/final-shift-close/STATE.json)" = INACTIVE
          test "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET
          test "$(jq -r '.selected_target' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = null

      - name: Setup PHP 8.3 runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Validate Sprint201 source contract
        shell: bash
        run: |
          set -euo pipefail
          php -l apps/web/app/Application/Pos/PosMerchantOperationsReadinessSnapshot.php
          php -l apps/web/app/Application/Pos/ViewPosMerchantOperationsReadiness.php
          php -l apps/web/app/Delivery/Http/Pos/PosOperationsHubController.php
          php -l apps/web/app/Providers/PosOperationsHubServiceProvider.php
          php -l apps/web/tests/merchant-pos-state-aware-guided-operations.php
          php apps/web/tests/merchant-pos-state-aware-guided-operations.php
          ! grep -R -E 'ChatGPT|OpenAI|Copilot|Gemini' \
            apps/web/app/Application/Pos/PosMerchantOperationsReadinessSnapshot.php \
            apps/web/app/Application/Pos/ViewPosMerchantOperationsReadiness.php \
            apps/web/app/Delivery/Http/Pos/PosOperationsHubController.php \
            apps/web/app/Providers/PosOperationsHubServiceProvider.php \
            apps/web/resources/js/pages/Pos/OperationsHub.vue \
            apps/web/tests/merchant-pos-state-aware-guided-operations.php

      - name: Install locked application dependencies
        working-directory: apps/web
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          composer audit --locked --abandoned=report

      - name: Preserve POS operations hub and state-aware guidance
        working-directory: apps/web
        run: |
          php -d zend.assertions=1 -d assert.exception=1 tests/pos-operations-hub.php
          php tests/merchant-pos-guided-operations-home.php
          php tests/merchant-pos-state-aware-guided-operations.php

      - name: Setup exact Node LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.19.0

      - name: Type-check and build state-aware merchant operations home
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts --no-fund
          npm run type-check
          npm run build

      - name: Confirm source cleanliness
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
