name: Sprint134 Final Shift Close Canonical Control Plane Delivery Gate Registration Regression

# Attribution: Lab | zefry

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sprint134-final-shift-close-canonical-control-plane-delivery-gate-registration-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify-canonical-control-plane-delivery-gate-registration-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      CACHE_STORE: array
      SESSION_DRIVER: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Lock exact Sprint134 source envelope
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --name-only "$base" "$head" | LC_ALL=C sort > /tmp/paths
          cat > /tmp/expected <<'EOF'
          .github/workflows/sprint133-final-shift-close-canonical-control-plane-controller-fail-closed-regression.yml
          .github/workflows/sprint134-final-shift-close-canonical-control-plane-delivery-gate-registration-regression.yml
          apps/web/tests/final-shift-close-runtime-control-plane-delivery-gate-registration-regression.php
          docs/SPRINT134_FINAL_SHIFT_CLOSE_CANONICAL_CONTROL_PLANE_DELIVERY_GATE_REGISTRATION_REGRESSION.md
          ops/final-shift-close/CANONICAL_RUNTIME_CONTROL_PLANE_DELIVERY_GATE_REGISTRATION_REGRESSION_CONTRACT.json
          EOF
          diff -u /tmp/expected /tmp/paths
          [[ "$(sha256sum /tmp/paths | awk '{print $1}')" == '73b87b460ef349a05ab801d10fc6dd4a19d056625f4a042ff621ab96a12d2c0e' ]]

      - name: Prove Sprint133 historical successor compatibility
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/sprint133-final-shift-close-canonical-control-plane-controller-fail-closed-regression.yml
          grep -Fq 'Preserve successor-compatible historical regression boundary' "$workflow"
          grep -Fq 'Sprint133 is historical from Sprint134 onward.' "$workflow"
          grep -Fq 'Historical regression workflows validate their owned invariants only.' "$workflow"
          grep -Fq 'Exact full-PR envelope locking belongs to the active sprint workflow.' "$workflow"
          ! grep -Fq 'Lock exact Sprint133 source envelope' "$workflow"

      - name: Prove runtime and operational state remain untouched
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          git diff --quiet "$base" "$head" -- \
            apps/web/config/final_shift_close_runtime_binding_materialization.php \
            apps/web/config/final_shift_close_runtime_db_binding_attestation.php \
            apps/web/bootstrap/app.php \
            apps/web/bootstrap/providers.php \
            apps/web/routes \
            apps/web/app/Delivery/Http/Pos/FinalShiftCloseRuntimeBindingManifestMaterializationController.php \
            apps/web/app/Delivery/Http/Pos/FinalShiftCloseRuntimeDbBindingAttestationController.php \
            apps/web/app/Application/Pos/FinalShiftCloseRuntimeBindingManifestMaterializationRequest.php \
            apps/web/app/Application/Pos/FinalShiftCloseRuntimeBindingManifest.php \
            apps/web/app/Application/Pos/FinalShiftCloseRuntimeBindingManifestMaterializer.php \
            apps/web/app/Application/Pos/FinalShiftCloseRuntimeDatabaseIdentity.php \
            apps/web/app/Application/Pos/FinalShiftCloseRuntimeDatabaseIdentityReader.php \
            apps/web/app/Application/Pos/FinalShiftCloseRuntimeDbBindingAttestation.php \
            apps/web/app/Infrastructure/Pos/FilesystemFinalShiftCloseRuntimeBindingManifestWriter.php \
            apps/web/app/Infrastructure/Pos/LaravelFinalShiftCloseRuntimeDatabaseIdentityReader.php \
            apps/web/database/migrations \
            .github/workflows/final-shift-close-migration27-selected-target-db-binding.yml \
            .github/workflows/final-shift-close-migration27-execution.yml \
            ops/final-shift-close/STATE.json \
            ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json
          [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" == 'NOT_EXECUTED' ]]
          [[ "$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)" == 'NONE' ]]
          [[ "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.deployment_authority' ops/final-shift-close/STATE.json)" == 'NOT_GRANTED' ]]
          [[ "$(jq -r '.technical_preview_activation' ops/final-shift-close/STATE.json)" == 'NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.production_activation' ops/final-shift-close/STATE.json)" == 'NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.updater_activation' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET' ]]
          [[ "$(jq -r '.selected_target' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'null' ]]

      - name: Validate Sprint134 machine-readable contract
        shell: bash
        run: |
          set -euo pipefail
          file=ops/final-shift-close/CANONICAL_RUNTIME_CONTROL_PLANE_DELIVERY_GATE_REGISTRATION_REGRESSION_CONTRACT.json
          jq -e '
            .schema_version == 1 and
            .feature == "final-shift-close" and
            .sprint == 134 and
            .bounded_objective == "CANONICAL_CONTROL_PLANE_DELIVERY_GATE_REGISTRATION_REGRESSION" and
            .execution_mode == "CI_ONLY_SYNTHETIC_DELIVERY_GATE_REGISTRATION_REGRESSION" and
            .qualification.inspection_mode == "IN_PROCESS_ROUTE_COLLECTION_ONLY" and
            .qualification.new_executable_gap == "LENGTH_VALID_DISALLOWED_CHARACTER_ROUTE_ABSENCE_BOTH_PROVIDERS" and
            .qualification.historical_registration_coverage.materialization_disabled == "PRESERVED" and
            .qualification.historical_registration_coverage.materialization_empty_token == "PRESERVED" and
            .qualification.historical_registration_coverage.materialization_below_canonical_minimum == "PRESERVED" and
            .qualification.historical_registration_coverage.materialization_above_canonical_maximum == "PRESERVED" and
            .qualification.historical_registration_coverage.db_attestation_disabled == "PRESERVED" and
            .qualification.historical_registration_coverage.db_attestation_empty_token == "PRESERVED" and
            .qualification.historical_registration_coverage.db_attestation_below_canonical_minimum == "PRESERVED" and
            .qualification.historical_registration_coverage.db_attestation_above_canonical_maximum == "PRESERVED" and
            .qualification.aggregate_invalid_token_classes == ["EMPTY", "BELOW_CANONICAL_MINIMUM", "ABOVE_CANONICAL_MAXIMUM", "DISALLOWED_CHARACTER"] and
            .qualification.sprint134_fixture_length == "CANONICAL_MINIMUM" and
            .qualification.sprint134_fixture_disallowed_character == true and
            .qualification.materialization_disallowed_character_route_registration == "ABSENT" and
            .qualification.db_attestation_disallowed_character_route_registration == "ABSENT" and
            .qualification.canonical_token_policy_owner == "SPRINT130" and
            .qualification.alternate_token_validator == false and
            .qualification.valid_operational_control_plane_request == false and
            .qualification.real_route_invocation == false and
            .qualification.production_manifest_writer_resolution == false and
            .qualification.production_manifest_materializer_resolution == false and
            .qualification.production_database_identity_reader_resolution == false and
            .qualification.production_db_attestation_service_resolution == false and
            .qualification.materialization_controller_resolution == false and
            .qualification.db_attestation_controller_resolution == false and
            .qualification.real_filesystem_adapter_invocation == false and
            .qualification.real_database_connection == false and
            .qualification.real_database_identity_read == false and
            .qualification.operational_runtime_target_invocation == false and
            .qualification.runtime_configuration_mutation_outside_test_process == false and
            .successor_compatibility.sprint133_full_pr_envelope_lock == "REMOVED_FROM_HISTORICAL_WORKFLOW" and
            .successor_compatibility.sprint133_owned_controller_fail_closed_regression == "PRESERVED" and
            .successor_compatibility.sprint132_owned_controller_positive_path_regression == "PRESERVED" and
            .successor_compatibility.sprint131_owned_middleware_positive_path_regression == "PRESERVED" and
            .successor_compatibility.historical_control_plane_registration_regressions == "PRESERVED_AS_AGGREGATE_EVIDENCE" and
            .successor_compatibility.active_sprint_envelope_authority == "SPRINT134_WORKFLOW_ONLY" and
            .source_envelope.path_count == 5 and
            .source_envelope.sha256 == "73b87b460ef349a05ab801d10fc6dd4a19d056625f4a042ff621ab96a12d2c0e" and
            .canonical_boundaries.valid_operational_control_plane_request == "NOT_PERFORMED" and
            .canonical_boundaries.real_route_invocation == "NOT_PERFORMED" and
            .canonical_boundaries.positive_operational_route_registration == "NOT_REQUIRED" and
            .canonical_boundaries.production_side_effect_adapter_resolution == "NOT_PERFORMED" and
            .canonical_boundaries.real_filesystem_adapter_invocation == "NOT_PERFORMED" and
            .canonical_boundaries.canonical_runtime_manifest_write == "NOT_PERFORMED" and
            .canonical_boundaries.real_database_connection == "NOT_PERFORMED" and
            .canonical_boundaries.real_database_identity_read == "NOT_PERFORMED" and
            .canonical_boundaries.runtime_configuration_mutation == "NOT_PERFORMED" and
            .canonical_boundaries.runtime_token_provisioning == "NOT_PERFORMED" and
            .canonical_boundaries.canonical_runtime_manifest_materialization == "NOT_PERFORMED" and
            .canonical_boundaries.operational_runtime_db_binding_attestation == "NOT_PERFORMED" and
            .canonical_boundaries.selected_target == null and
            .canonical_boundaries.db_binding_producer_dispatch == "NOT_PERFORMED" and
            .canonical_boundaries.migration27_execution == "NOT_PERFORMED" and
            .canonical_boundaries.permission_provisioning == "NONE" and
            .canonical_boundaries.feature_activation == "INACTIVE" and
            .canonical_boundaries.deployment_authority == "NOT_GRANTED" and
            .canonical_boundaries.technical_preview == "NO-GO" and
            .canonical_boundaries.production == "NO-GO" and
            .canonical_boundaries.updater == "INACTIVE" and
            .attribution == "Author by Lab | zefry"
          ' "$file" >/dev/null

      - name: Prove Sprint134 regression is synthetic and isolated
        shell: bash
        run: |
          set -euo pipefail
          test_file=apps/web/tests/final-shift-close-runtime-control-plane-delivery-gate-registration-regression.php
          grep -Fq "FinalShiftCloseRuntimeControlPlaneTokenPolicy::MINIMUM_LENGTH - 1).'!'" "$test_file"
          grep -Fq 'FinalShiftCloseRuntimeControlPlaneTokenPolicy::isValidToken($invalidToken) === false' "$test_file"
          grep -Fq "'ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_ENABLED' => 'true'" "$test_file"
          grep -Fq "'ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_DB_BINDING_ATTESTATION_ENABLED' => 'true'" "$test_file"
          grep -Fq '$kernel->bootstrap();' "$test_file"
          grep -Fq "getByName('internal.final-shift-close.runtime-binding-manifest.materialize') === null" "$test_file"
          grep -Fq "getByName('internal.final-shift-close.runtime-db-binding-attestation') === null" "$test_file"
          grep -Fq 'FinalShiftCloseRuntimeBindingManifestWriter::class' "$test_file"
          grep -Fq 'FinalShiftCloseRuntimeBindingManifestMaterializer::class' "$test_file"
          grep -Fq 'FinalShiftCloseRuntimeDatabaseIdentityReader::class' "$test_file"
          grep -Fq 'FinalShiftCloseRuntimeDbBindingAttestation::class' "$test_file"
          grep -Fq '$app->resolved($service) === false' "$test_file"
          ! grep -Fq 'Request::create' "$test_file"
          ! grep -Fq 'FilesystemFinalShiftCloseRuntimeBindingManifestWriter' "$test_file"
          ! grep -Fq 'LaravelFinalShiftCloseRuntimeDatabaseIdentityReader' "$test_file"
          ! grep -Fq "connection('oneqay')" "$test_file"
          ! grep -Fq -- '->materialize(' "$test_file"

      - name: Validate PHP syntax and locked dependencies
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php -l tests/final-shift-close-runtime-control-plane-delivery-gate-registration-regression.php
          php -l tests/final-shift-close-runtime-binding-manifest-control-plane.php
          php -l tests/final-shift-close-runtime-db-binding-attestation-control-plane.php
          php -l app/Application/Pos/FinalShiftCloseRuntimeControlPlaneTokenPolicy.php
          php -l app/Providers/FinalShiftCloseRuntimeBindingManifestMaterializationServiceProvider.php
          php -l app/Providers/FinalShiftCloseRuntimeDbBindingAttestationServiceProvider.php
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          composer audit --locked --no-interaction --abandoned=report

      - name: Execute Sprint134 disallowed-character delivery-gate regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-delivery-gate-registration-regression.php

      - name: Preserve historical manifest delivery-gate breadth
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_ENABLED=false ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_TOKEN=vvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvv php tests/final-shift-close-runtime-binding-manifest-control-plane.php disabled
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_ENABLED=true ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_TOKEN='' php tests/final-shift-close-runtime-binding-manifest-control-plane.php enabled-empty-token
          short="$(printf 's%.0s' {1..31})"
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_ENABLED=true ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_TOKEN="$short" php tests/final-shift-close-runtime-binding-manifest-control-plane.php enabled-short-token
          long="$(printf 'o%.0s' {1..513})"
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_ENABLED=true ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_TOKEN="$long" php tests/final-shift-close-runtime-binding-manifest-control-plane.php enabled-oversized-token

      - name: Preserve historical DB attestation delivery-gate breadth
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_DB_BINDING_ATTESTATION_ENABLED=false ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_DB_BINDING_ATTESTATION_TOKEN=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa php tests/final-shift-close-runtime-db-binding-attestation-control-plane.php disabled
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_DB_BINDING_ATTESTATION_ENABLED=true ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_DB_BINDING_ATTESTATION_TOKEN='' php tests/final-shift-close-runtime-db-binding-attestation-control-plane.php enabled-empty-token
          short="$(printf 's%.0s' {1..31})"
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_DB_BINDING_ATTESTATION_ENABLED=true ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_DB_BINDING_ATTESTATION_TOKEN="$short" php tests/final-shift-close-runtime-db-binding-attestation-control-plane.php enabled-short-token
          long="$(printf 'o%.0s' {1..513})"
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_DB_BINDING_ATTESTATION_ENABLED=true ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_DB_BINDING_ATTESTATION_TOKEN="$long" php tests/final-shift-close-runtime-db-binding-attestation-control-plane.php enabled-oversized-token

      - name: Preserve Sprint133 controller fail-closed regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-controller-fail-closed-regression.php

      - name: Lock no operational invocation or activation
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/sprint134-final-shift-close-canonical-control-plane-delivery-gate-registration-regression.yml
          ! grep -Fq 'workflow_dispatch' "$workflow"
          doc=docs/SPRINT134_FINAL_SHIFT_CLOSE_CANONICAL_CONTROL_PLANE_DELIVERY_GATE_REGISTRATION_REGRESSION.md
          grep -Fq 'SPRINT134_VALID_OPERATIONAL_CONTROL_PLANE_REQUEST = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT134_REAL_ROUTE_INVOCATION = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT134_POSITIVE_OPERATIONAL_ROUTE_REGISTRATION = NOT_REQUIRED' "$doc"
          grep -Fq 'SPRINT134_PRODUCTION_SIDE_EFFECT_ADAPTER_RESOLUTION = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT134_REAL_FILESYSTEM_ADAPTER_INVOCATION = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT134_CANONICAL_RUNTIME_MANIFEST_WRITE = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT134_REAL_DATABASE_CONNECTION = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT134_REAL_DATABASE_IDENTITY_READ = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT134_RUNTIME_CONFIGURATION_MUTATION = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT134_RUNTIME_TOKEN_PROVISIONING = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT134_CANONICAL_RUNTIME_MANIFEST_MATERIALIZATION = NOT_PERFORMED' "$doc"
          grep -Fq 'SPRINT134_OPERATIONAL_RUNTIME_DB_BINDING_ATTESTATION = NOT_PERFORMED' "$doc"
          grep -Fq 'SELECTED_TARGET = NONE' "$doc"
          grep -Fq 'DB_BINDING_PRODUCER_DISPATCH = NOT_PERFORMED' "$doc"
          grep -Fq 'MIGRATION_27_EXECUTION = NOT_PERFORMED' "$doc"
          grep -Fq 'PERMISSION_PROVISIONING = NONE' "$doc"
          grep -Fq 'FEATURE_ACTIVATION = INACTIVE' "$doc"
          grep -Fq 'DEPLOYMENT_AUTHORITY = NOT_GRANTED' "$doc"
          grep -Fq 'TECHNICAL_PREVIEW = NO-GO' "$doc"
          grep -Fq 'PRODUCTION = NO-GO' "$doc"
          grep -Fq 'UPDATER = INACTIVE' "$doc"

      - name: Verify tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "$(git status --porcelain)" ]]
