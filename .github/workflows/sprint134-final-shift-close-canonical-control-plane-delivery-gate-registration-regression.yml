name: Sprint134 Final Shift Close Canonical Control Plane Delivery Gate Registration Regression

# Attribution: Lab | zefry

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sprint134-final-shift-close-canonical-control-plane-delivery-gate-registration-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify-canonical-control-plane-delivery-gate-registration-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ=
      APP_DEBUG: 'false'
      APP_URL: http://localhost
      CACHE_STORE: array
      SESSION_DRIVER: array

    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Preserve successor-compatible historical regression boundary
        shell: bash
        run: |
          set -euo pipefail
          # Sprint134 is historical after its canonical squash merge.
          # This workflow preserves Sprint134-owned executable invariants.
          # Full pull-request envelope ownership belongs to the current active change.
          test -f apps/web/tests/final-shift-close-runtime-control-plane-delivery-gate-registration-regression.php
          test -f docs/SPRINT134_FINAL_SHIFT_CLOSE_CANONICAL_CONTROL_PLANE_DELIVERY_GATE_REGISTRATION_REGRESSION.md
          test -f ops/final-shift-close/CANONICAL_RUNTIME_CONTROL_PLANE_DELIVERY_GATE_REGISTRATION_REGRESSION_CONTRACT.json

      - name: Prove Sprint133 historical successor compatibility remains present
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/sprint133-final-shift-close-canonical-control-plane-controller-fail-closed-regression.yml
          grep -Fq 'Preserve successor-compatible historical regression boundary' "$workflow"
          grep -Fq 'Sprint133 is historical from Sprint134 onward.' "$workflow"
          ! grep -Fq 'Lock exact Sprint133 source envelope' "$workflow"

      - name: Validate Sprint134 machine-readable contract invariants
        shell: bash
        run: |
          set -euo pipefail
          file=ops/final-shift-close/CANONICAL_RUNTIME_CONTROL_PLANE_DELIVERY_GATE_REGISTRATION_REGRESSION_CONTRACT.json
          jq -e '
            .schema_version == 1 and
            .feature == "final-shift-close" and
            .sprint == 134 and
            .bounded_objective == "CANONICAL_CONTROL_PLANE_DELIVERY_GATE_REGISTRATION_REGRESSION" and
            .execution_mode == "CI_ONLY_SYNTHETIC_DELIVERY_GATE_REGISTRATION_REGRESSION" and
            .qualification.inspection_mode == "IN_PROCESS_ROUTE_COLLECTION_ONLY" and
            .qualification.new_executable_gap == "LENGTH_VALID_DISALLOWED_CHARACTER_ROUTE_ABSENCE_BOTH_PROVIDERS" and
            .qualification.sprint134_fixture_length == "CANONICAL_MINIMUM" and
            .qualification.sprint134_fixture_disallowed_character == true and
            .qualification.materialization_disallowed_character_route_registration == "ABSENT" and
            .qualification.db_attestation_disallowed_character_route_registration == "ABSENT" and
            .qualification.canonical_token_policy_owner == "SPRINT130" and
            .qualification.alternate_token_validator == false and
            .qualification.valid_operational_control_plane_request == false and
            .qualification.real_route_invocation == false and
            .qualification.production_manifest_writer_resolution == false and
            .qualification.production_manifest_materializer_resolution == false and
            .qualification.production_database_identity_reader_resolution == false and
            .qualification.production_db_attestation_service_resolution == false and
            .qualification.real_filesystem_adapter_invocation == false and
            .qualification.real_database_connection == false and
            .qualification.real_database_identity_read == false and
            .source_envelope.path_count == 5 and
            .source_envelope.sha256 == "73b87b460ef349a05ab801d10fc6dd4a19d056625f4a042ff621ab96a12d2c0e" and
            .canonical_boundaries.migration27_execution == "NOT_PERFORMED" and
            .canonical_boundaries.permission_provisioning == "NONE" and
            .canonical_boundaries.feature_activation == "INACTIVE" and
            .canonical_boundaries.deployment_authority == "NOT_GRANTED" and
            .canonical_boundaries.technical_preview == "NO-GO" and
            .canonical_boundaries.production == "NO-GO" and
            .canonical_boundaries.updater == "INACTIVE" and
            .attribution == "Author by Lab | zefry"
          ' "$file" >/dev/null

      - name: Prove operational NO-GO state remains intact
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" == 'NOT_EXECUTED' ]]
          [[ "$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)" == 'NONE' ]]
          [[ "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.deployment_authority' ops/final-shift-close/STATE.json)" == 'NOT_GRANTED' ]]
          [[ "$(jq -r '.technical_preview_activation' ops/final-shift-close/STATE.json)" == 'NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.production_activation' ops/final-shift-close/STATE.json)" == 'NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.updater_activation' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET' ]]
          [[ "$(jq -r '.selected_target' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'null' ]]

      - name: Prove Sprint134 regression remains synthetic and isolated
        shell: bash
        run: |
          set -euo pipefail
          test_file=apps/web/tests/final-shift-close-runtime-control-plane-delivery-gate-registration-regression.php
          grep -Fq "FinalShiftCloseRuntimeControlPlaneTokenPolicy::MINIMUM_LENGTH - 1).'!'" "$test_file"
          grep -Fq 'FinalShiftCloseRuntimeControlPlaneTokenPolicy::isValidToken($invalidToken) === false' "$test_file"
          grep -Fq '$kernel->bootstrap();' "$test_file"
          grep -Fq "getByName('internal.final-shift-close.runtime-binding-manifest.materialize') === null" "$test_file"
          grep -Fq "getByName('internal.final-shift-close.runtime-db-binding-attestation') === null" "$test_file"
          grep -Fq '$app->resolved($service) === false' "$test_file"
          ! grep -Fq 'Request::create' "$test_file"
          ! grep -Fq 'FilesystemFinalShiftCloseRuntimeBindingManifestWriter' "$test_file"
          ! grep -Fq 'LaravelFinalShiftCloseRuntimeDatabaseIdentityReader' "$test_file"
          ! grep -Fq "connection('oneqay')" "$test_file"
          ! grep -Fq -- '->materialize(' "$test_file"

      - name: Validate PHP syntax and locked dependencies
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          php -l tests/final-shift-close-runtime-control-plane-delivery-gate-registration-regression.php
          php -l tests/final-shift-close-runtime-binding-manifest-control-plane.php
          php -l tests/final-shift-close-runtime-db-binding-attestation-control-plane.php
          php -l tests/final-shift-close-runtime-control-plane-controller-fail-closed-regression.php
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          composer audit --locked --no-interaction --abandoned=report

      - name: Execute Sprint134 disallowed-character delivery-gate regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-delivery-gate-registration-regression.php

      - name: Preserve historical manifest delivery-gate breadth
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_ENABLED=false ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_TOKEN=vvvvvvvvvvvvvvvvvvvvvvvvvvvvvvvv php tests/final-shift-close-runtime-binding-manifest-control-plane.php disabled
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_ENABLED=true ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_TOKEN='' php tests/final-shift-close-runtime-binding-manifest-control-plane.php enabled-empty-token
          short="$(printf 's%.0s' {1..31})"
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_ENABLED=true ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_TOKEN="$short" php tests/final-shift-close-runtime-binding-manifest-control-plane.php enabled-short-token
          long="$(printf 'o%.0s' {1..513})"
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_ENABLED=true ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_BINDING_MATERIALIZATION_TOKEN="$long" php tests/final-shift-close-runtime-binding-manifest-control-plane.php enabled-oversized-token

      - name: Preserve historical DB attestation delivery-gate breadth
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_DB_BINDING_ATTESTATION_ENABLED=false ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_DB_BINDING_ATTESTATION_TOKEN=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa php tests/final-shift-close-runtime-db-binding-attestation-control-plane.php disabled
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_DB_BINDING_ATTESTATION_ENABLED=true ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_DB_BINDING_ATTESTATION_TOKEN='' php tests/final-shift-close-runtime-db-binding-attestation-control-plane.php enabled-empty-token
          short="$(printf 's%.0s' {1..31})"
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_DB_BINDING_ATTESTATION_ENABLED=true ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_DB_BINDING_ATTESTATION_TOKEN="$short" php tests/final-shift-close-runtime-db-binding-attestation-control-plane.php enabled-short-token
          long="$(printf 'o%.0s' {1..513})"
          ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_DB_BINDING_ATTESTATION_ENABLED=true ONEQAY_FINAL_SHIFT_CLOSE_RUNTIME_DB_BINDING_ATTESTATION_TOKEN="$long" php tests/final-shift-close-runtime-db-binding-attestation-control-plane.php enabled-oversized-token

      - name: Preserve Sprint133 controller fail-closed regression
        working-directory: apps/web
        run: php tests/final-shift-close-runtime-control-plane-controller-fail-closed-regression.php

      - name: Verify tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain --untracked-files=no
