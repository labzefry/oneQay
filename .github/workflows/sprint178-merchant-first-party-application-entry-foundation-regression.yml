name: Sprint178 Merchant First-Party Application Entry Foundation Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint178-merchant-entry-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  preserve-sprint178-merchant-entry:
    name: preserve-sprint178-merchant-entry
    runs-on: ubuntu-latest
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:Y2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2NjY2M=
      APP_DEBUG: "false"
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      SESSION_DRIVER: array
      CACHE_STORE: array
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Qualify exact Sprint178 reconciliation envelope
        if: github.event_name == 'pull_request' && github.head_ref == 'sprint178-canonical-reconciliation'
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          mapfile -t paths < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | LC_ALL=C sort)
          expected=(
            ".github/workflows/sprint178-merchant-first-party-application-entry-foundation-regression.yml"
            "CHANGELOG.md"
            "PROJECT_MANIFEST.md"
            "README.md"
            "ROADMAP.md"
            "TASKS.md"
          )
          [[ "${#paths[@]}" -eq "${#expected[@]}" ]]
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${paths[@]}")
          actual_hash="$(printf '%s\n' "${paths[@]}" | sha256sum | awk '{print $1}')"
          [[ "$actual_hash" == "d994709453d1415d23d2bdfc8ecade257d8baa8b07b9aff98654a2b4cb6bb0f5" ]]

      - name: Preserve canonical Sprint178 engineering evidence
        if: github.event_name == 'pull_request' && github.head_ref == 'sprint178-canonical-reconciliation'
        shell: bash
        run: |
          set -euo pipefail
          for FILE in PROJECT_MANIFEST.md README.md CHANGELOG.md TASKS.md ROADMAP.md; do
            grep -Fq '8992c2ed1b6278d113e24e38a847bedeac345161' "$FILE"
            ! grep -Fq '${{ github.event.pull_request.head.sha }}' "$FILE"
          done
          grep -Fq '**Engineering PR:** #783' PROJECT_MANIFEST.md
          grep -Fq 'ee0e2e8acc5238fa0cb2e3be56b6e58cf2092239' PROJECT_MANIFEST.md
          grep -Fq '9d27ecd0802230d3484aa7ca424064313595e8174172eb889c2736250e2815c5' PROJECT_MANIFEST.md
          grep -Fq 'd994709453d1415d23d2bdfc8ecade257d8baa8b07b9aff98654a2b4cb6bb0f5' PROJECT_MANIFEST.md

      - name: Preserve guarded merchant entry contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'meta name="oneqay-merchant-entry"' apps/web/resources/views/app.blade.php
          grep -Fq "['local', 'test', 'ci']" apps/web/resources/views/app.blade.php
          grep -Fq "config('database.oneqay_persistence_enabled', false)" apps/web/resources/views/app.blade.php
          grep -Fq "config('oneqay.session_control.enabled', false)" apps/web/resources/views/app.blade.php
          grep -Fq "/auth/login" apps/web/resources/js/pages/Foundation.vue
          grep -Fq "/auth/mfa/totp/challenge" apps/web/resources/js/pages/Foundation.vue
          grep -Fq "location.assign('/pos')" apps/web/resources/js/pages/Foundation.vue
          ! grep -Fq "Route::post('/register" apps/web/routes/web.php

      - name: Preserve operational NO-GO
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" =~ ^(NOT_EXECUTED|EXECUTED)$ ]]
          permission_state="$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)"; [[ "$permission_state" =~ ^(NONE|PROVISIONED)$ ]]; if [[ "$permission_state" == 'PROVISIONED' ]]; then [[ "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" == 'EXECUTED' ]]; fi
          [[ "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" =~ ^(INACTIVE|ACTIVE)$ ]]
          [[ "$(jq -r '.deployment_authority' ops/final-shift-close/STATE.json)" == 'NOT_GRANTED' ]]
          [[ "$(jq -r '.technical_preview_activation' ops/final-shift-close/STATE.json)" == 'NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.production_activation' ops/final-shift-close/STATE.json)" == 'NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.updater_activation' ops/final-shift-close/STATE.json)" == 'INACTIVE' ]]
          [[ "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'SELECTED_NOT_AUTHORIZED' ]]
          [[ "$(jq -r '.selected_target.environment_id' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'oneqay-durable-staging-01' ]]
          [[ "$(jq -r '.selected_target.runtime_class' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == 'durable-staging' ]]
          [[ "$(jq -r '.selected_target.selection_fingerprint_sha256' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" == '6ecc487cb144e634455de69cc43aa39b1f6880a2256c4b1ab33387096513772b' ]]

      - name: Validate PHP and execute regressions
        shell: bash
        run: |
          set -euo pipefail
          cd apps/web
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist
          find app bootstrap config routes tests -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do php -l "$file"; done
          composer test
          php tests/first-party-session-establishment.php
          php tests/merchant-first-party-application-entry.php
          php tests/pos-operations-hub.php

      - name: Setup exact Node LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.19.0

      - name: Type-check and build merchant entry
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts --no-fund
          npm run type-check
          npm run build

      - name: Verify tracked-source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
