name: Sprint176 Merchant Context Atomic Bootstrap Foundation Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint176-merchant-context-atomic-bootstrap-foundation-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  preserve-sprint176-merchant-context-atomic-bootstrap-foundation:
    runs-on: ubuntu-latest
    env:
      APP_NAME: oneQay
      APP_ENV: testing
      APP_KEY: base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      APP_DEBUG: "false"
      APP_URL: http://localhost
      ONEQAY_RUNTIME_CLASS: ci
      SESSION_DRIVER: array
      CACHE_STORE: array
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checked-out head
        run: |
          set -euo pipefail
          EXPECTED_HEAD="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Qualify exact Sprint176 reconciliation envelope
        if: github.event_name == 'pull_request' && github.head_ref == 'sprint176-canonical-reconciliation'
        env:
          EXPECTED_PATH_HASH: 4cc815fdb1c6489ab34334a14033acfe1452b50874f48c9e867e6f6da3858b03
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          mapfile -t CHANGED < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | LC_ALL=C sort)
          EXPECTED=(
            '.github/workflows/sprint176-merchant-context-atomic-bootstrap-foundation-regression.yml'
            'CHANGELOG.md'
            'PROJECT_MANIFEST.md'
            'README.md'
            'ROADMAP.md'
            'TASKS.md'
          )
          test "${#CHANGED[@]}" -eq "${#EXPECTED[@]}"
          diff -u <(printf '%s\n' "${EXPECTED[@]}") <(printf '%s\n' "${CHANGED[@]}")
          ACTUAL_HASH="$(printf '%s\n' "${CHANGED[@]}" | sha256sum | awk '{print $1}')"
          test "$ACTUAL_HASH" = "$EXPECTED_PATH_HASH"

      - name: Preserve Sprint176 source contract
        run: |
          set -euo pipefail
          APP=apps/web/app/Application/Bootstrap
          INFRA=apps/web/app/Infrastructure/Bootstrap
          TEST=apps/web/tests/merchant-context-atomic-bootstrap.php
          for FILE in \
            "$APP/MerchantContextBootstrapAuthority.php" \
            "$APP/MerchantContextBootstrapService.php" \
            "$APP/MerchantContextBootstrapStateRepository.php" \
            "$APP/MerchantContextBootstrapViolation.php" \
            "$INFRA/LaravelMerchantContextBootstrapStateRepository.php" \
            "$INFRA/PreauthorizedMerchantContextBootstrapAuthority.php" \
            "$TEST"; do
            test -f "$FILE"
            grep -Fq 'Author by Lab | zefry' "$FILE"
          done
          grep -Fq 'extends InitialTenantAdministratorProvisioningAuthority' "$APP/MerchantContextBootstrapAuthority.php"
          grep -Fq 'authorizesBootstrap' "$APP/MerchantContextBootstrapAuthority.php"
          grep -Fq 'assertFresh' "$APP/MerchantContextBootstrapStateRepository.php"
          grep -Fq 'MerchantContextBootstrapAuthority $authority' "$APP/MerchantContextBootstrapService.php"
          grep -Fq 'DurableContextGraphRepository $graphRepository' "$APP/MerchantContextBootstrapService.php"
          grep -Fq 'InitialTenantAdministratorProvisioningRepository $administratorRepository' "$APP/MerchantContextBootstrapService.php"
          grep -Fq 'FirstControlPrincipalCredentialBootstrapService $credentialBootstrap' "$APP/MerchantContextBootstrapService.php"
          grep -Fq '$this->transaction->run' "$APP/MerchantContextBootstrapService.php"
          grep -Fq '$this->graphRepository->persist' "$APP/MerchantContextBootstrapService.php"
          grep -Fq '$this->administratorRepository->applyFresh' "$APP/MerchantContextBootstrapService.php"
          grep -Fq '$this->credentialBootstrap->bootstrap' "$APP/MerchantContextBootstrapService.php"
          grep -Fq "['local', 'test', 'ci']" "$INFRA/LaravelMerchantContextBootstrapStateRepository.php"
          ! grep -R -Eq 'use Illuminate\\|Illuminate\\' "$APP"
          ! grep -R -Eq 'Route::|routes/|Http\\Controllers' "$APP" "$INFRA"

      - name: Preserve canonical Sprint176 engineering evidence
        if: github.event_name == 'pull_request' && github.head_ref == 'sprint176-canonical-reconciliation'
        run: |
          set -euo pipefail
          for FILE in PROJECT_MANIFEST.md README.md CHANGELOG.md TASKS.md ROADMAP.md; do
            grep -Fq 'af2ed4db8e49c4a75f1e1b743986cc20f3e3b0ff' "$FILE"
            ! grep -Fq '${{ github.event.pull_request.head.sha }}' "$FILE"
          done
          grep -Fq 'Engineering PR: #777' PROJECT_MANIFEST.md
          grep -Fq '775343389659754d85f870eca55f808a0b28eea5' PROJECT_MANIFEST.md
          grep -Fq 'f1b48efc2a25623ae55c72b95407a19ef60b63f8dcb933f9d7f137f09a34b974' PROJECT_MANIFEST.md
          grep -Fq '4cc815fdb1c6489ab34334a14033acfe1452b50874f48c9e867e6f6da3858b03' PROJECT_MANIFEST.md

      - name: Preserve operational NO-GO
        run: |
          set -euo pipefail
          test "$(jq -r '.migration27.state' ops/final-shift-close/STATE.json)" = NOT_EXECUTED
          test "$(jq -r '.permission_provisioning.state' ops/final-shift-close/STATE.json)" = NONE
          test "$(jq -r '.feature_activation.state' ops/final-shift-close/STATE.json)" = INACTIVE
          test "$(jq -r '.deployment_authority' ops/final-shift-close/STATE.json)" = NOT_GRANTED
          test "$(jq -r '.technical_preview_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
          test "$(jq -r '.production_activation' ops/final-shift-close/STATE.json)" = NOT_AUTHORIZED
          test "$(jq -r '.updater_activation' ops/final-shift-close/STATE.json)" = INACTIVE
          test "$(jq -r '.selection_state' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = BLOCKED_NO_QUALIFIED_NON_SYNTHETIC_DURABLE_TARGET
          test "$(jq -r '.selected_target' ops/final-shift-close/DURABLE_ACTIVATION_TARGET_SELECTION.json)" = null

      - name: Install PHP dependencies
        working-directory: apps/web
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --prefer-dist

      - name: Validate Sprint176 source
        working-directory: apps/web
        run: |
          php -l app/Application/Bootstrap/MerchantContextBootstrapAuthority.php
          php -l app/Application/Bootstrap/MerchantContextBootstrapService.php
          php -l app/Application/Bootstrap/MerchantContextBootstrapStateRepository.php
          php -l app/Application/Bootstrap/MerchantContextBootstrapViolation.php
          php -l app/Infrastructure/Bootstrap/LaravelMerchantContextBootstrapStateRepository.php
          php -l app/Infrastructure/Bootstrap/PreauthorizedMerchantContextBootstrapAuthority.php
          php -l tests/merchant-context-atomic-bootstrap.php

      - name: Execute focused atomic bootstrap regression
        working-directory: apps/web
        run: php -d zend.assertions=1 -d assert.exception=1 tests/merchant-context-atomic-bootstrap.php

      - name: Execute application regression
        working-directory: apps/web
        run: composer test

      - name: Verify tracked-source cleanliness
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
